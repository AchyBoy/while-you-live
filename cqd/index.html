ths that had been laid for breakfast. Evans was there, with his collar still undone. Stan was there, beside me, white as the tablecloths.</p>\n<p class=\"tape\">The chief steward stood on a chair and told us.</p>\n<p class=\"tape\">He told us plainly. The Titanic had struck ice and was sinking. We were going to her. We would be there in about four hours, if we could get there at all. Every man in that room would be wanted, and nobody would sleep tonight, and whatever we saw when we got there, we would do our work and keep our mouths shut and not frighten anybody.</p>\n<p class=\"tape\">Nobody said anything. Then somebody at the back said, \"The Titanic,\" in the voice of a man saying the name of a church that has fallen down.</p>\n<p class=\"tape\">\"Yes,\" said the chief steward. \"The Titanic. Now get moving.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They put me on blankets first. I carried blankets from the linen stores to the gangways and the saloons until my arms shook, armful after armful, a boy with a pile of gray wool up to his eyes running along corridors that were still tilted over into the turn, because she was still leaning, still pushing, still going north-west as fast as she could go.</p>\n<p class=\"tape\">It got cold very fast. That was the heat. Rostron had shut off the steam to every radiator on the ship, every cabin, every saloon, and sent every pound of it down to the engines. Within half an hour you could see your breath in the corridors. Within an hour there was frost on the inside of the portholes.</p>\n<p class=\"tape\">Then Lyle put me and Stan in the second-class corridor on C deck, one at each end, to keep the passengers in.</p>\n<p class=\"tape\">It was strange work. The passengers woke one at a time, from the cold and from the shaking, because the whole ship had begun to shake, a deep hard shudder that came up through the floor and the walls and the bed frames and the teeth. A door would open, and a man in a dressing gown would look out, and I would say, \"Captain's compliments, sir, nothing to be alarmed about, please stay in your cabin,\" and he would look at me, and at the frost on the porthole at the end of the corridor, and go back in, and shut the door, and not believe a word of it.</p>\n<p class=\"tape\">Mr. Hatch came out at about two.</p>\n<p class=\"tape\">He was fully dressed, in the brown suit, with a muffler around his neck and his hat in his hand and a notebook sticking out of his pocket. He came down the corridor toward me, and I stepped in front of him, and he stopped.</p>\n<p class=\"tape\">\"Captain's compliments, sir,\" I said. \"Nothing to be alarmed about. Please stay in your cabin.\"</p>\n<p class=\"tape\">He looked down at me for a moment. He had a long, clever, tired face, and I saw him look at my face, and then at my hands, which were red and raw from the blankets, and then at the frost on the porthole behind me.</p>\n<p class=\"tape\">\"Bertie,\" he said. \"She turned, a little after half past twelve. I felt her go over in my bunk. She's been going flat out ever since, faster than she's ever gone, or the whole ship wouldn't be rattling like a tin of nails. And somebody's turned the heat off to do it, in the middle of the night, in the North Atlantic, with seven hundred paying passengers asleep.\" He put his hat on. \"There's nothing to be alarmed about, is there?\"</p>\n<p class=\"tape\">\"No, sir.\"</p>\n<p class=\"tape\">\"You're a terrible liar, Bertie.\" He smiled. It was not an unkind smile. \"That's all right. Honest boys always are.\"</p>\n<p class=\"tape\">And he stepped around me, quite gently, and went up the stairs.</p>\n<p class=\"tape\">I could have stopped him. I could have shouted for Lyle. I stood in the corridor and watched his brown suit go up the stairs and out of sight, and I did nothing, and I told myself it was because a bell boy cannot lay hands on a passenger.</p>\n<p class=\"tape\">That was true. It was also true that I knew exactly what he was. I had been him, more than once, in other lives. A man who has to see. A man who will go and stand in the cold all night, in a thin suit, with a notebook, because something is happening and he cannot bear to be the one asleep. I've told you. It's the worst thing about me.</p>\n<p class=\"tape\">I let him go because I would have gone.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At about half past two Lyle sent me down to the engine room with a can of coffee.</p>\n<p class=\"tape\">I have tried, since, to tell people what that was like, and I can't. The stokehold of a ship in 1912 was a kind of hell anyway, a long low room of furnaces and coal dust and heat, with men stripped to the waist feeding the fires by hand. That night it was something else. Every stoker on the ship was down there, the watch that should have been sleeping as well as the watch on duty. The furnace doors were open and shutting and open, open and shutting, so fast it was like a light flickering. The men were shoveling as if the coal had done them a personal injury, with the sweat running down their faces through the black, and nobody spoke, because there was no breath to speak with. The noise was a wall.</p>\n<p class=\"tape\">And the ship was shaking. Down there you could feel all of it, every turn of the screws, the whole of her straining, as if she knew. The chief engineer was standing by the gauges watching the needles, and I saw his face, and I understood that they were past where they should have been, and that he was letting them stay there.</p>\n<p class=\"tape\">I gave the coffee to the nearest man. He drank it without stopping, and gave me back the can, and went on shoveling.</p>\n<p class=\"tape\">She had been built to make fourteen knots. People who were there have argued for a hundred years about what she made that night, and I won't argue with them. I'll only tell you I was in her stokehold, and she had never gone like that before, and I don't believe she ever did again.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">When I came up again it was getting on for twenty to three, and I went out on deck, because nobody had told me not to.</p>\n<p class=\"tape\">The cold had got worse. The sea was still perfectly flat, still polished, still holding the stars. And there were men all along the rail. Extra lookouts, in the bows, in the crow's nest, on both wings of the bridge. Officers. Seamen. And passengers, too, by then, some of them, the ones who had not stayed in their cabins, in their coats over their nightclothes, standing very quietly along the rail and looking north.</p>\n<p class=\"tape\">Mr. Hatch was there. He was standing by himself at the forward end of the promenade, writing.</p>\n<p class=\"tape\">Then, low on the water far ahead of us, there was a light. A green one. It burned for a moment, and went out.</p>\n<p class=\"tape\">I heard the bridge go quiet. Then I heard Rostron's voice, and a moment later, from the bridge wing above me, our first rocket went up. It went up hissing, very high, and burst white, and lit the whole sea, and the faces along the rail. Then the company's signals, in colors, after it.</p>\n<p class=\"tape\">After that, every quarter of an hour, another.</p>\n<p class=\"tape\">A few minutes later somebody shouted from the bows.</p>\n<p class=\"tape\">I ran to the rail. Off to starboard, quite close, closer than I would have believed, something was going past us in the dark. It was white. It was very big. It was so much bigger than the ship that for a moment I thought it was land. It slid past us, enormous and silent, with the starlight on it, and the sea did not even break against its foot, because there was no sea, only that black polished floor. It went by. And the ship did not slow down.</p>\n<p class=\"tape\">Then another. Then, a few minutes later, another. Rostron took her through them at full speed, turning, and turning back, and turning again, and the officers on the bridge called the bergs as they came, and he never once slowed her down.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The engines stopped just after four.</p>\n<p class=\"tape\">You don't know what a silence is, Ms. Barnett, until a ship's engines stop after four hours of that. The shaking stopped. The noise stopped. The ship slid on through the water, slower, and slower, and the deck was suddenly so quiet that I could hear the man beside me breathing, and the water whispering along her side.</p>\n<p class=\"tape\">It was still dark. But the dark had begun to thin out in the east, a little, the way it does when you have been looking at it long enough.</p>\n<p class=\"tape\">And there was a boat.</p>\n<p class=\"tape\">It was very small, down on that enormous flat sea, off our port bow. A lifeboat, low in the water, with people in it, and oars going raggedly, out of time, and a man standing in the stern. Someone in her lit another green flare as we came up, and for a moment I could see the faces in it, white and green, all of them turned up toward us.</p>\n<p class=\"tape\">They brought her alongside to the gangway door on the port side. I was there. I don't know how. Everybody who could get there was there, crowded inside that open door, with the blankets and the coffee and the chair sling and the canvas bags. The ladder went down. They began to come up.</p>\n<p class=\"tape\">They came up one at a time, slowly, the ones who could climb up the ladder and the ones who could not in the sling, and the children in the canvas bags. They were women, mostly, in evening dresses under men's coats, in nightgowns under fur, with their hair down and their hands so cold they could not hold the rail. Not one of them said anything. I gave out blankets. I could not have told you, then, a single face.</p>\n<p class=\"tape\">Among them was an officer. A young one, in a Titanic officer's uniform, soaked and shaking. Somebody put a blanket around him, and he did not seem to notice, and they took him straight up to the bridge.</p>\n<p class=\"tape\">I went up after him with a can of coffee for the bridge, because I had been told to, and because I would have found a reason to go anyway. The captain was standing by the wheelhouse, very straight, and the young officer stood in front of him with the blanket around his shoulders, and the captain asked him the only question there was.</p>\n<p class=\"tape\">\"Where is the Titanic?\"</p>\n<p class=\"tape\">The young officer looked at him a moment, as if he did not understand the question, or did not want to.</p>\n<p class=\"tape\">\"Gone,\" he said. \"She sank at two-twenty.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He did not say anything else for a while.</p>\n<p>I didn't either. The recorders went on recording the woodstove, and the rain, and the two of us not talking, and I let them.</p>\n<p>\"Do you want to stop?\" I said.</p>\n<p>\"No.\" He picked up his tea and found it cold and drank it anyway. \"If I stop here, I'll have to start again from here. I'd rather not.\" He set the cup down. \"They came up all morning.\"</p>", "audio": false, "added": 1790944011597, "pt": [1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944448385, 1790944448385]}, {"num": 7, "title": "The Boats", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 15, 1912, dawn</em></p>\n<p class=\"tape\">The light came up slowly, as it does at sea, from nothing, out of the water itself.</p>\n<p class=\"tape\">And when it came, we saw where we were.</p>\n<p class=\"tape\">There was ice everywhere. I had known there was ice. I had watched the bergs go past us in the dark, one after another, white shapes in the starlight. But I had not understood. When the sun came up, the whole sea to the north and west of us was full of it, bergs of every size, some low and flat like islands and some standing up out of the water in peaks and towers, two hundred feet high, with the dawn on them turning them pink and gold. Between them, the water was crowded with smaller ice, a great field of it, broken and grinding, stretching away to the edge of the world. It was the most beautiful thing I had ever seen. I hated it with my whole heart.</p>\n<p class=\"tape\">And between us and the ice, scattered across miles of flat water, the boats.</p>\n<p class=\"tape\">Little white boats, low in the water, a long way apart. Some rowing toward us. Some not moving at all. As the light grew you could count them, and then you could see the people in them, packed in, very still, and here and there one man standing up in the stern working a steering oar.</p>\n<p class=\"tape\">That was all. Boats, and ice, and the sea, and a few deck chairs, and some cork, floating. Almost nothing else. A ship as big as a town had been there five hours before, with two thousand people on her. You would not have known.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They came up all morning, one boat after another, for four hours.</p>\n<p class=\"tape\">I was at the port gangway the whole time, except when I was sent running. I gave out blankets. I carried coffee. I took children out of the canvas bags as they came up over the sill, and gave them to whoever reached for them, and sometimes nobody reached, and I carried them in myself and found them a chair and a blanket and somebody to sit with.</p>\n<p class=\"tape\">Most of them didn't speak. That's the thing I remember best, and the thing nobody believes. You would think there would have been screaming, or weeping, or crowds of people shouting names. There wasn't. Not at first. They came up the ladders, or in the slings, and they stood on the deck in the cold sunlight in whatever they had been wearing at midnight, evening dresses under men's overcoats, nightgowns under furs, a man in his pajamas and a dinner jacket, a girl in one shoe. And they looked about them. Not at us. At the deck. At the ship. As if they were trying to work out where they were, and whether it was real, and whether it would hold.</p>\n<p class=\"tape\">Then they went to the rail.</p>\n<p class=\"tape\">That was where they waited, all morning, the women, all along the rail, in a long row, looking down at each boat as it came in. Looking at the faces in it. Every time a boat came alongside, the whole row leaned over together and looked, and then, one at a time, they straightened up again. It was like watching a field of wheat in a wind.</p>\n<p class=\"tape\">Most of the boats were women and children. Some of them had a few men. There were very few men, anywhere. You learned, by the second or third boat, not to look at the women's faces when they straightened up.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I'll tell you about one boat. Only one.</p>\n<p class=\"tape\">It came in somewhere in the middle of the morning, when the sun was well up and the wind had begun to come up with it, and the sea that had been flat all night was starting to roughen, so the boats bumped and swung against our side as they came in. This one was fuller than most. There were men in her. More than in most of the others. I noticed that, and then I noticed I had noticed it, and put it away.</p>\n<p class=\"tape\">And there was a woman in the bow with two children.</p>\n<p class=\"tape\">She was young, perhaps twenty-five, very straight, with a dark coat buttoned to the throat and no hat, and her hair coming down. A little girl of about six sat against her, wrapped in the woman's own shawl, and she held a smaller boy on her lap, asleep, or nearly. When the boat came alongside, the seaman at the gangway reached down to take the boy from her, and she didn't let him. She held up one hand, quite calmly, palm out, the way you stop a carriage, and said something I couldn't hear. Then she put the boy into the canvas bag herself. She tied the neck of it herself, and tested the knot, and watched him all the way up until he was in somebody's arms on deck. Then she did the same with the girl. Then she came up the ladder.</p>\n<p class=\"tape\">She came up it well. Better than most of the men. And when she stepped through the gangway door, onto our deck, she did not do what all the others had done. She did not stand and look about her, at the deck, at the ship, as if it might not be real.</p>\n<p class=\"tape\">She looked at the people.</p>\n<p class=\"tape\">I saw her do it. I was standing by the stack of blankets, a yard away, and I watched her eyes go along the gangway. The purser at his table with his list. The two seamen at the door. The doctor. The stewards with coffee. Me. One after another, each of us, quick and complete, the way you read a page. Then the doors. Then the stairs. Then back to the children.</p>\n<p class=\"tape\">She did not look back at the sea. Not once.</p>\n<p class=\"tape\">I gave her a blanket. She took it, and said thank you, in an English voice, a good one, quiet. And for a moment she looked straight at me, a bell boy holding out a blanket, and I saw her see that I had been watching her. Then she put the blanket around the little girl and went to sit with them by the wall, and did not look at me again.</p>\n<p class=\"tape\">There was a woman with them, too. She came up after, in the sling, because she couldn't climb. Their mother, I learned later. She sat where they put her and didn't move, and didn't speak, and when the little girl climbed into her lap she held her without seeming to know who it was. The young woman in the dark coat went and knelt by her and talked to her, low, steadily, for a long time. The mother didn't answer.</p>\n<p class=\"tape\">The father had not been in the boat.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"What was her name?\" I said.</p>\n<p>He looked at me. He had been looking at the window, at the rain, while he told it, and now he turned and looked at me with a kind of patience I had not seen in him before.</p>\n<p>\"I'll tell you what I called her,\" he said. \"Later. When it matters.\"</p>\n<p>\"That isn't what I asked.\"</p>\n<p>\"No.\" He set his cup down. \"Ms. Barnett, I'm going to ask you to let me do something, and I know you won't like it. There are people in this part of the story who were real, and are on lists, and have families. Grandchildren. Great-grandchildren, some of them still alive, with their grandmother's photograph on the wall. Some of what happened in that boat, and on that ship, nobody has ever said aloud. If I give you their names, you'll check them. I know you will. That's why I asked for you.\" He looked at the notepad on his knee. \"And then they'll be in a book.\"</p>\n<p>\"That's my job.\"</p>\n<p>\"I know it is. That's why I'm asking.\" He was very calm. \"I won't give you the names of anyone in that boat. Not the woman with the children. Not the others. Not the number of the boat. Everyone else, you can have. Rostron, Cottam, Evans, Hatch. Check them all. But not the boat.\"</p>\n<p>\"Then how am I supposed to know any of it's true?\"</p>\n<p>\"You aren't,\" he said. \"Not that part. You'll have to decide whether to believe me.\" He smiled, a little, not happily. \"I know. It's a great deal to ask of you, of all people.\"</p>\n<p>I sat with that. Outside, a truck went by on the far road, and the window rattled in its frame.</p>\n<p>\"Every other Thursday,\" I said, \"you've given me something I could check.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Why not this?\"</p>\n<p>He was quiet for a long moment.</p>\n<p>\"Because I was twelve,\" he said, \"and I couldn't do anything about it. And I've had a very long time to decide what I owe those people now.\" He picked up the pencil. \"Not their names. That much I can still do.\"</p>\n<p>I wrote it down. I wrote, <em>Won't name the boat. Won't name anyone in it.</em> And then, because I was honest on paper: <em>First time he's refused me anything.</em></p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 15, 1912, morning</em></p>\n<p class=\"tape\">The last boat came in at half past eight.</p>\n<p class=\"tape\">She was the worst. She was so full you could not see the wood of her sides, only people, packed shoulder to shoulder and standing in the bottom, seventy of them, more, in a boat built for sixty-five and riding so low that every swell came in over the gunwale. The wind was really blowing by then, and the sea was up, and she came toward us very slowly, rolling, with an officer standing in the stern steering her. We all stood at the rail and watched her come and did not breathe.</p>\n<p class=\"tape\">She made it. The officer was the last man up. A tall, hard-looking man, soaked to the waist, who came up the ladder like a man climbing out of a grave, and stood on our deck, and turned, and looked back out at the ice for a long moment before he let them lead him away. I learned afterward he was the senior officer saved. The most senior one left alive.</p>\n<p class=\"tape\">That was the end of it. Seven hundred and five people. Every boat accounted for, and some of them empty, and all the rest of them gone.</p>\n<p class=\"tape\">A little after that, another ship came up out of the north, through the ice. A steamer, smaller than us. She came slowly and stopped a way off, and her wireless and ours talked, and on our bridge the officers looked across at her with faces I did not understand then.</p>\n<p class=\"tape\">She was the Californian. She had been there all night, near enough to see the Titanic's rockets. Her wireless man had gone to bed.</p>\n<p class=\"tape\">I didn't know any of that, that morning. I only saw the officers' faces.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The captain had the ship turn slowly around the place where the Titanic had gone down, once, while a clergyman who was one of our passengers held a service in the first-class saloon. A short one. Prayers for the dead, and thanks for the living, both at once, in the same breath, because there was no time to do them separately.</p>\n<p class=\"tape\">The saloon was full. Our passengers and theirs, side by side, the people who had slept through the night and the people who had sat in the boats. I stood at the back, against the wall, with the other boys, as we had the morning before, as if it were Sunday.</p>\n<p class=\"tape\">Most of the survivors didn't sing. They stood with the hymn books open and their mouths shut. Some of them wept, now, for the first time, quite silently. Some of them stared at the floor.</p>\n<p class=\"tape\">The young woman with the children was there, by the door, with the little boy asleep against her shoulder. She was not singing either. She was not praying, and she was not weeping, and she was not looking at the floor.</p>\n<p class=\"tape\">She was watching the room. Every face in it, one after another, the same as at the gangway. Quick and complete.</p>\n<p class=\"tape\">I knew that look. I knew it the way you know your own handwriting on an envelope you don't remember sending. It was the way I looked at a room.</p>\n<p class=\"tape\">It was nothing, I decided. A sharp young woman who had just lived through the worst night of her life, counting the doors because she would never again sit in a room without knowing where the doors were. Plenty of people came off those boats like that. I had seen a dozen of them that morning.</p>\n<p class=\"tape\">I told myself that, and I believed it, and I put her away.</p>\n<p class=\"tape\">That was the second time in my long life I had done that, Ms. Barnett. I had done it once before, in a hotel dining room in Washington, to a waiter in a white jacket.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">When the service was over, Rostron took the ship out of the ice, south and then west, and we turned for New York.</p>\n<p class=\"tape\">Mr. Hatch found me on the boat deck at a quarter to ten. He looked terrible. He had been out on deck since two in the morning, in the thin brown suit, and his face was gray with cold and his hands shook, and the notebook in his hand was so full of writing it had swollen to twice its size.</p>\n<p class=\"tape\">\"Bertie,\" he said. \"Do you know what's on this ship?\"</p>\n<p class=\"tape\">\"Survivors, sir.\"</p>\n<p class=\"tape\">\"Seven hundred of them.\" He held up the notebook. \"Seven hundred people who were there. Who saw it. Every newspaper in the world would give its eyeteeth for one of them, and we've got seven hundred, and four days before anybody else can get near them.\" He laughed. It was not a good laugh. It was the laugh of a man who has been awake too long, and has seen too much, and has just understood that it is also the best thing that ever happened to him. \"I came to write about a volcano.\"</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">\"I'm going to talk to every one of them,\" he said. \"Every single one who'll have me. I'm going to write it all down. What they saw. What they did.\" He put the notebook in his pocket, and buttoned the pocket, and patted it, once. \"Somebody has to. You watch, Bertie. In New York they'll all have a story, and half of them will be lies, and nobody will ever know the difference. Unless somebody wrote it down first. Right here. While it was still true.\"</p>\n<p class=\"tape\">He went off along the deck, toward the first-class entrance, where a group of survivors was sitting in the sun in blankets, and I watched him go.</p>\n<p class=\"tape\">He was right, of course. That was the trouble with him. He was nearly always right.</p>", "audio": false, "added": 1790944448385, "pt": [1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385]}, {"num": 8, "title": "The List", "extra": false, "html": "<p>I called Kevin Dunleavy on Friday morning, after the school run, and he did not want to talk to me.</p>\n<p>He was polite about it. He drove a delivery truck, he said, for a beverage company, and he was in the cab between stops with the engine running, and he did not know who I was or what I wanted with his mother, and his mother was eighty-one years old with a bad hip and did not need people calling her about things that happened six years ago.</p>\n<p>\"I understand,\" I said. \"I'm sorry to have bothered you.\"</p>\n<p>\"What was it about, anyway?\"</p>\n<p>I told him. A man who had lived upstairs from his mother on Calloway Street, who went out one Wednesday and didn't come back. That I had been the reporter on a story he had helped with. That I thought his mother might have heard something that morning, through the ceiling.</p>\n<p>There was a silence on the line, with an engine in it.</p>\n<p>\"Upstairs,\" he said. \"The quiet guy. With the cat.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Hang on,\" he said. And then, away from the phone, but not far enough: \"Ma. <em>Ma.</em> It's about the guy upstairs. On Calloway. The quiet one.\"</p>\n<p>There was a pause. Then a different voice, older, sharper, coming from somewhere on the far side of a kitchen, louder than the engine.</p>\n<p>\"Give me that phone.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda wanted to come.</p>\n<p>I had not expected it. I told her on Friday night, over dinner, that I was driving out to Frederick in the morning to see the woman from the second floor, and I expected her to say <em>okay</em> and go back to her phone. Instead she put the phone face down on the table and said, \"Can I come?\"</p>\n<p>\"Why?\"</p>\n<p>\"I'm the transcriber.\" She said it as if it were a job title, which I suppose it was. \"I should meet the sources.\"</p>\n<p>\"She's not a source. She's an old lady who used to complain about the noise.\"</p>\n<p>\"That's literally what a source is,\" said Freda. \"You told me that. When I was like nine.\"</p>\n<p>So she came. She sat in the passenger seat with her feet on the dashboard, which I had stopped telling her not to do, and her headphones around her neck, and a bag of pretzels in her lap, and when we got to the bottom of our street and found 16th Street closed for a fun run, she didn't even look up.</p>\n<p>\"Go up Georgia,\" she said. \"Cut across at Missouri. Then you can get back on.\"</p>\n<p>I went up Georgia. We cut across at Missouri, and got back on.</p>\n<p>\"Since when do you know Georgia Avenue?\"</p>\n<p>\"Since always.\" She ate a pretzel. \"Maddie's sister drives that way.\"</p>\n<p>Maddie's sister, I thought, had become a very generous girl this spring. I didn't say it. I drove.</p>\n<p class=\"break\">&#10043;</p>\n<p>The house was the one from the county website, a split-level at the end of a cul-de-sac on the east side of Frederick, with the basketball hoop over the garage and the newer wooden ramp built up over the front steps. Kevin Dunleavy opened the door before we had knocked. He was a big, tired man in his fifties with a delivery company's polo shirt and his father's bus driver's face, I imagined, patient and a little worn.</p>\n<p>\"She's been up since six,\" he said, in a low voice. \"She's been waiting for you since six. I want you to know that.\"</p>\n<p>\"I'm sorry.\"</p>\n<p>\"Don't be sorry.\" He stood back to let us in. \"She hasn't been this happy since the Orioles fired the manager.\"</p>\n<p>Mrs. Eileen Dunleavy was in the living room in a wheelchair by the window, with a crocheted blanket over her knees and her white hair set, and a cardigan buttoned correctly, all the way to the top. She was very small. She had a face like a walnut and eyes like a bird's, and they went over me from my shoes to my hair before I was halfway across the carpet.</p>\n<p>\"You're the reporter,\" she said.</p>\n<p>\"Yes, ma'am.\"</p>\n<p>\"You're shorter than your picture.\" She looked at Freda. \"Who's this?\"</p>\n<p>\"My daughter. Freda.\"</p>\n<p>\"Hm.\" The bird's eyes went over Freda the same way, shoes to hair. \"You've got your mother's mouth. You look like you've got your own mind, too. Good. Sit there.\" She pointed at the couch. \"Kevin, get the girl a soda. Get the girl a soda and get Darren out of his room and make him say hello to somebody for once in his life.\"</p>\n<p>Kevin went. Mrs. Dunleavy turned back to me.</p>\n<p>\"I read it,\" she said. \"Your story. In the paper. That Sunday.\"</p>\n<p>I didn't say anything. I hadn't expected that.</p>\n<p>\"I read all of it,\" she said. \"I knew it was true the minute I read it. I knew it was him, too, even though you didn't put his name in. Carrow House. The documents. Of course it was him.\" She folded her small hands on the blanket. \"He was a careful man. I could hear him being careful. Every night, ten o'clock, chair back, desk lamp off, two steps, bedroom door. Never once slammed a door in four years. Never had a party. Never had a girl up, never had a boy up. Never had anybody up.\" She looked at me sharply. \"Until that Wednesday.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I had brought my notebook. I had brought the recorder, too, and I asked her if she minded, and she said she had been waiting six years for somebody to record her, and she was not going to be shy about it now.</p>\n<p>So I asked her what I had come to ask. And she told me what Tom had said she would.</p>\n<p>\"I wrote it down,\" she said. \"Of course I wrote it down. I wrote everything down. That man Petrakis stopped answering his phone years before, and after that what was I supposed to do? I wrote it down. Every bang, every pipe, every dog. With the time.\" She nodded toward the hall. \"Kevin's got them in the garage. Kevin! The tub. The blue one.\"</p>\n<p>Kevin brought the tub. It was a plastic storage bin, the kind you buy for sweaters, and it was full to the top with composition notebooks. The black and white marbled kind, the kind Freda used in third grade. There must have been sixty of them. Every one had a date range on the cover in neat ballpoint capitals.</p>\n<p>\"Six years,\" said Mrs. Dunleavy, \"before that. And two after. Then I broke my hip and came here, and Kevin's house is quiet as a church, God help me.\" She pointed. \"That one. Third from the left.\"</p>\n<p>I found it. The dates on the cover took in that spring, and that summer. I turned the pages slowly, very slowly. They were full, every line of every page, in the same small, tidy, furious hand. <em>7:10 AM. Dry cleaner machine started. 20 MIN EARLY.</em> <em>11:45 PM. 4th floor. Television. Loud. Game show.</em> <em>2:15 PM. Dog. Alley. Barking 9 min.</em> Day after day after day. A building's whole life, through one woman's ceiling.</p>\n<p>And then I came to the Wednesday.</p>\n<p>I knew it before I read the date. The handwriting was different. Not messier. Smaller. Pressed down harder into the paper, as if she had known, while she was writing it, that it was something she would need.</p>\n<p><em>WED.</em></p>\n<p><em>9:38 AM. Knock, upstairs (3rd fl). 3 knocks. Then 2 more.</em></p>\n<p><em>9:39. Cat crying. He's shut her in.</em></p>\n<p><em>9:40. His door. Man's voice, NOT HIS. Laughing. Door shut.</em></p>\n<p><em>9:40 to 10:10. Talking. Couldn't hear words. Other one laughing a lot.</em></p>\n<p><em>10:12. His door. TWO on stairs going DOWN. Slow. Heavy. Something banging the wall all the way down. New paint!!</em></p>\n<p><em>10:14. Back door. Car in alley. Engine running. Exhaust coming in my kitchen window AGAIN.</em></p>\n<p><em>10:21. Two back UP. Quick.</em></p>\n<p><em>10:33. Two DOWN again. Slow. Heavy. Banging.</em></p>\n<p><em>10:41. Car door. Car door. Car gone.</em></p>\n<p><em>Called P. No answer. As usual.</em></p>\n<p>And then, on the next line, in the same hard small writing, as if she had gone back to it at the end of the day:</p>\n<p><em>He did not come back up.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>I read it three times. Then I looked up at her, and she was watching me with her bird's eyes, and her small hands folded on the blanket.</p>\n<p>\"He didn't come back up,\" I said.</p>\n<p>\"No.\"</p>\n<p>\"Not that day.\"</p>\n<p>\"Not that day. Not ever.\" She said it very plainly. \"I'd have heard him. I heard everybody come up those stairs for thirty years. He had a step like nobody else's. Very light. Like he was apologizing to the stairs.\" She looked at the notebook in my hands. \"He went down those stairs at twenty to eleven on that Wednesday morning, with whoever that was, carrying whatever that was, and he got into that car, and that was the last time.\"</p>\n<p>\"Did you tell the police?\"</p>\n<p>She laughed. It was not a nice laugh.</p>\n<p>\"The police came on the Friday. Petrakis let them in. One young officer, with a face like a boiled ham. I was standing right in my doorway on the second floor when they went up. Standing right there.\" She jerked her chin at the notebook. \"Nobody asked me. He asked Petrakis. Petrakis told him about the rent, and the carpet. He wrote it all down. Then he went upstairs and looked around, and came down, and went away, and nobody ever asked me a single thing.\"</p>\n<p>\"You could have told them.\"</p>\n<p>\"I called the number on his card,\" she said. \"Twice. They said they'd pass it on.\" She looked out of the window at the cul-de-sac. \"Nobody called me back. Nobody ever calls me back.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda had been sitting on the couch through all of this with a can of soda in her hand, very still. Darren, the grandson, had come out of his room at his father's insistence, a long boy of about sixteen with headphones on, and said <em>hi</em> to the carpet, and sat on the other end of the couch looking at his phone. At some point the two of them had started talking, very quietly, about something on his screen. Now I saw that Freda had stopped, and was looking at the notebook in my lap.</p>\n<p>\"Mrs. Dunleavy,\" she said. \"Did you ever see him? The other man?\"</p>\n<p>Mrs. Dunleavy turned and looked at her, and something in her face changed, and softened, a very little.</p>\n<p>\"No,\" she said. \"I wish I had, sweetheart. My kitchen window looked on the alley, but by the time I got to it with this hip, the car was going. Big. Dark. That's all I saw.\" She paused. \"But I heard him. All that half an hour. Through the ceiling. And going down the stairs, every step.\" She shook her head slowly. \"He had hard heels on. Leather. You don't hear leather heels much anymore. Click, click, click, like a lady. And he laughed.\"</p>\n<p>\"What kind of laugh?\"</p>\n<p>Mrs. Dunleavy thought about it. She took her time.</p>\n<p>\"A big one,\" she said. \"Too big. The kind of laugh a man has when he's used to people laughing with him.\" She looked back at me. \"Your man upstairs didn't laugh. Not once, in four years. That's why I wrote it down. That's what was wrong with it. Somebody was in that apartment having a wonderful time.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>Kevin let me photograph every page of that notebook, and then, when his mother insisted, let me take the notebook itself, on a promise to bring it back, which I wrote down and signed for her on a page of my own. She watched me do it with great satisfaction.</p>\n<p>At the door, she held my hand in both of hers for a moment. Her hands were very cold and very strong.</p>\n<p>\"I knew he didn't run,\" she said. \"I knew. A man who apologizes to the stairs doesn't run off and leave his cat.\" She let go. \"You find out where that car went, Miss Barnett. And then you come back and tell me. You come back. You're the first person who ever did.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda didn't say anything until we were on the highway.</p>\n<p>Then she said, \"She was great.\"</p>\n<p>\"She was.\"</p>\n<p>\"She was so mad. Like, for six years. And she kept every single page.\" She was looking out of her window at the hills going by. \"You're really good at this. You know that? I didn't know you were that good at it. You just sat there and let her talk.\"</p>\n<p>\"That's most of it. Letting people talk.\"</p>\n<p>\"That's what he does,\" said Freda. \"Mr. Hale. That's exactly what he does to you.\"</p>\n<p>I drove for a while.</p>\n<p>\"Mom,\" said Freda. \"When it happened. The story, and all of it. When you lost your job.\" She was still looking out of the window. \"Did Dad ever, like. Help? Or call, or anything?\"</p>\n<p>I kept my eyes on the road. It was a long, straight stretch, with nothing on it.</p>\n<p>\"Your father was in Phoenix,\" I said. \"He sent you a card for your birthday that year. It came in March.\"</p>\n<p>Her birthday was in January. Freda knew that. She didn't say anything. She didn't put her headphones on, either. She sat with her feet on the dashboard and looked out of the window at Maryland until we were home, and when we got out of the car she said she had homework, and went to her room.</p>\n<p>The door didn't slam.</p>\n<p>I sat at the kitchen table with Mrs. Dunleavy's notebook open in front of me and copied out that one page by hand, every line, the way I used to copy out a source's quotes on the night before a story ran, so that they would be in my own hand and I would know I had them right. Then, under it, I wrote:</p>\n<p><em>He let them in. He shut Pearl away. They talked half an hour, and the other one laughed.</em></p>\n<p><em>Two trips. Two boxes, the first time. What was the second?</em></p>\n<p><em>He went down with them. He didn't come back up.</em></p>\n<p>And then the question that I was going to be asking, I already knew, for a very long time.</p>\n<p><em>Where did the car go?</em></p>", "audio": false, "added": 1790944448385, "pt": [1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385]}, {"num": 9, "title": "Monday", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 15, 1912, afternoon</em></p>\n<p class=\"tape\">By noon on that Monday there were more than fourteen hundred passengers on a ship that had sailed with half that many, and nobody was comfortable, and nobody complained.</p>\n<p class=\"tape\">You have to imagine it. Every bunk was full, and every sofa. The officers had given up their cabins. Our own first-class passengers had given up theirs, many of them, and moved in two and three together, and the survivors who were not ill or hurt lay on the floors of the saloons and the smoking rooms and the library, wrapped in blankets, in rows, like wounded after a battle. Which is what they were. Women slept sitting up in chairs with children across their laps. In the third-class dining room, the Hungarian doctor went up and down the rows in his shirtsleeves, and the families from our steerage, who were going home to the mountains with everything they owned in a bundle, opened the bundles and gave away what was in them.</p>\n<p class=\"tape\">That was the thing I hadn't expected. Our own passengers.</p>\n<p class=\"tape\">They'd been told to stay in their cabins and keep out of the way, and the moment the boats came in, almost every one of them disobeyed. The American ladies going to see Italy took off their own coats and put them around strangers. They gave up their nightgowns and their stockings and their hairbrushes. By the afternoon there were a dozen of them sitting in the second-class saloon with scissors and needles, cutting up the ship's blankets and sewing them into little coats and trousers for the children who had come up out of the boats in their nightclothes. They sewed all afternoon, and talked very little, and when they had finished one coat they started another.</p>\n<p class=\"tape\">I carried thread. I carried scissors. I carried everything. I don't believe I stopped once between dawn and dark.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The captain had made up his mind by then about where to go.</p>\n<p class=\"tape\">He could have gone on to the Mediterranean, I suppose, and carried seven hundred people who had nothing, not even shoes, across the Atlantic and back. He could have gone to Halifax, which was nearer. He went back to New York. It was the right choice, the only one, and he made it as he made everything, all at once and without fuss. I heard about it from Stan, who heard it from a quartermaster, who had heard the captain say that the survivors would need their own country, and their own people, and their own papers, and all of that was in New York.</p>\n<p class=\"tape\">So we turned our back on the Mediterranean, and on our own passengers' holidays, and on the Hungarian families going home, and steamed west. Nobody aboard complained about that, either. Not one person, that I ever heard.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The wireless never stopped.</p>\n<p class=\"tape\">I went up to the cabin twice that afternoon with tea, and both times Cottam was at the key, in the same shirt he had been wearing at midnight, with the same one boot unlaced, because he had never had time to lace it. He had not slept. He did not look as if he knew what sleep was. He was sending names.</p>\n<p class=\"tape\">That was the captain's order. Names first. Every survivor, every name, one by one, to the shore stations and to the ships within reach, so that somewhere in New York, or in London, or in a village in Ireland or Sweden or Lebanon, somebody could stop waiting. He was sending them as fast as his hand would go, and his hand was very tired, and there were seven hundred of them, and the purser's lists had been made in a hurry at a cold gangway door by men whose fingers were numb, and half the names were spelled wrong.</p>\n<p class=\"tape\">And on the desk beside him, there was another pile. A growing one.</p>\n<p class=\"tape\">\"What are those?\" I said, the second time I came.</p>\n<p class=\"tape\">He didn't look up from the key. \"Newspapers. Every newspaper in America. And a good many in England.\" He sent something, fast. \"They want the story. They want to know what happened. Who's alive. Who's dead. Whether it's true about the millionaires. What it was like. They'll pay anything. One of them's offered me more than I make in a year.\"</p>\n<p class=\"tape\">\"What are you going to do?\"</p>\n<p class=\"tape\">\"Nothing.\" He reached for the tea without looking at it. \"Captain's orders. Names first, and official business, and nothing to the press. Nothing at all.\" He drank. \"He's right. If I start answering newspapers, I'll never get the names out. And it's the names that matter. It's the names people are waiting for.\" He put the cup down. \"Let them wait. Let them all wait.\"</p>\n<p class=\"tape\">I looked at the pile. It was very tall. I could read the top one from where I stood. It was from a newspaper in New York, and it asked, politely, at great length, for a statement from any survivor, at any price.</p>\n<p class=\"tape\">I thought of Mr. Hatch, in his brown suit, going from blanket to blanket with his notebook.</p>\n<p class=\"tape\">I thought, then, for the first time, that what Mr. Hatch was doing on that ship might be worth a very great deal of money. And that he was not the only man aboard who would know it.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At four o'clock they buried the dead.</p>\n<p class=\"tape\">There were four. They had come up out of the boats that morning, and there had been nothing the doctors could do. One of them had been a passenger, a gentleman, pulled out of the water still alive in the night and died in the boat before dawn. The other three were Titanic's own crew. Two of them had names. One of them, nobody knew. Nobody in his boat had known him, and there was nothing in his pockets to tell.</p>\n<p class=\"tape\">They sewed them into canvas, the way it's done at sea, with a weight at the feet. They laid them on planks at the rail on the after deck, under flags. The engines were stopped again, for the first time since dawn, and in the silence you could hear the wind and the water and the gulls that had found us somewhere in the afternoon.</p>\n<p class=\"tape\">The same clergyman read the service. A few of us stood there. Not many. Most of the survivors stayed inside. I don't blame them.</p>\n<p class=\"tape\">I stood at the back, as I always stood at the back, with my cap in my hands. I have stood at a great many burials, Ms. Barnett, in a great many lives. I have stood at them for people I loved and for people I had never met, and I have buried people with my own hands, more than once. That was the only one I ever stood at for a man whose name nobody knew.</p>\n<p class=\"tape\">When the clergyman reached the words, the seamen tilted the planks, and one by one the four of them slid out from under the flags and went down into the gray water, and were gone.</p>\n<p class=\"tape\">I said the man's name to myself. The nameless one. I didn't know it, so I gave him one. I won't tell you what it was. It wasn't his, and he's had no use for it, and that's between him and me.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The young woman in the dark coat was at the burial.</p>\n<p class=\"tape\">I didn't see her come. She was standing a little apart, at the rail, with her hands in her pockets, alone. No children. She must have left them sleeping with their mother. She stood very straight and watched the service from beginning to end, and when the planks tilted she didn't look away, as most of us did. She watched each of the four go down into the water, all the way, until there was nothing to watch.</p>\n<p class=\"tape\">Then she turned to go in, and saw me.</p>\n<p class=\"tape\">I was standing by the hatch, with my cap in my hands, and I had been watching her watch. She knew it. I saw her know it. She stopped, and looked at me for a moment, quite steadily, as you look at a dog you don't know, to decide if it bites.</p>\n<p class=\"tape\">\"You're the boy from the gangway,\" she said.</p>\n<p class=\"tape\">\"Yes, miss.\"</p>\n<p class=\"tape\">\"You gave me a blanket.\"</p>\n<p class=\"tape\">\"Yes, miss.\"</p>\n<p class=\"tape\">She came a step closer. She had gray eyes, I remember, very clear, set a little too far apart, and a small white scar at the corner of her mouth, and she looked at me as if I were a page in a book she had not expected to find interesting.</p>\n<p class=\"tape\">\"Do you always look at people like that?\" she said.</p>\n<p class=\"tape\">\"Like what, miss?\"</p>\n<p class=\"tape\">\"Like you're counting them.\"</p>\n<p class=\"tape\">I should have said <em>No, miss,</em> and looked at the deck, as Bertie Pike would have. That is what a bell boy says to a lady who speaks to him. I knew that perfectly well.</p>\n<p class=\"tape\">I didn't. I was tired, and I had been on my feet for sixteen hours, and I had just watched four men go into the sea, and I was a very old man, and I had not been spoken to as anything but furniture for three weeks.</p>\n<p class=\"tape\">\"Somebody has to, miss,\" I said. \"The purser wants every name.\"</p>\n<p class=\"tape\">Something moved in her face. Not a smile. Something underneath one, quick, and then gone.</p>\n<p class=\"tape\">\"Yes,\" she said. \"Every name.\" She looked at me a moment longer. Then she nodded, once, as if to herself, as if something had been filed. \"Good afternoon,\" she said, and went in.</p>\n<p class=\"tape\">I stood by the hatch for some time after she'd gone.</p>\n<p class=\"tape\">I have told you that I put her away, that morning, in the saloon, just as I had once put away a waiter in a white jacket. I want to be honest with you. I took her out again, by the hatch, for perhaps a minute. I turned her over. A young Englishwoman, educated, very composed, with gray eyes too far apart and a way of looking at a room. And then Lyle shouted for me from the companionway, and there was a lady in first class who wanted her trunk moved, and I put her away again, and went.</p>\n<p class=\"tape\">I have asked myself since, more times than I could count, what I would have done if Lyle had not shouted.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">It was dark when I next saw Mr. Hatch.</p>\n<p class=\"tape\">He was in the second-class smoking room, in the corner by the window where he had set himself up on the Sunday afternoon with his typewriter. The typewriter was shut now. He had a cup of coffee in front of him that had gone cold, and his notebook open, and he was writing, fast, in pencil, in a hand so small and so cramped that I couldn't have read it if I had stood over him.</p>\n<p class=\"tape\">There were survivors asleep on the benches all around the walls. He was writing very quietly, so as not to wake them.</p>\n<p class=\"tape\">I brought him tea. He looked up, and saw who it was, and smiled, and his face was gray.</p>\n<p class=\"tape\">\"Bertie,\" he said. \"You're a saint.\"</p>\n<p class=\"tape\">\"That's what the Marconi man says, sir.\"</p>\n<p class=\"tape\">\"Then it must be true. He's a man of science.\" He took the tea and wrapped both hands around it. \"Sit down a minute.\"</p>\n<p class=\"tape\">\"I'm not allowed, sir.\"</p>\n<p class=\"tape\">\"Nobody's looking. Everybody's asleep.\" He nodded at the bench. I sat on the very edge of it. He looked at me over the cup. \"I've been talking to them all day,\" he said. \"Since the boats. Forty-one people. Forty-one so far.\" He touched the notebook. \"Do you know what they say, mostly?\"</p>\n<p class=\"tape\">\"No, sir.\"</p>\n<p class=\"tape\">\"They say what they think they ought to say.\" He drank. \"That everyone was very brave. That it was very calm. That the band played. That the men stood back and put the women in the boats and waved goodbye like gentlemen.\" He set the cup down. \"And most of it's true, Bertie. That's the strange thing. Most of it's quite true. But they've all been on this ship eleven hours now, sitting together, telling each other, and every hour it gets a little more the same. By New York they'll all be telling one story. You'll see. The one everyone agrees on.\"</p>\n<p class=\"tape\">\"Is that bad, sir?\"</p>\n<p class=\"tape\">He looked at me for a long moment, and I saw him decide to tell me something, as a man tells a dog things, because the dog won't repeat them.</p>\n<p class=\"tape\">\"It is when it isn't true,\" he said. \"Not all the boats were the same, Bertie. Some of them went back. Most of them didn't. Some of them were half empty and could have gone back and didn't, because the people in them were afraid of being swamped. You can understand that. God knows I can understand that. But some of them...\" He stopped. He turned his cup on the table, a quarter turn, and did not finish. \"Some of them did things in the dark that the people in them would like very much to forget. And they're going to forget them, by Thursday. They're going to agree to forget them. Unless somebody wrote it down first.\"</p>\n<p class=\"tape\">\"Did somebody tell you, sir? What happened? In one of the boats?\"</p>\n<p class=\"tape\">He didn't answer that. He put his hand flat on the notebook, the way you keep a hand on a thing that might blow away.</p>\n<p class=\"tape\">\"They'll want to know who had the oars,\" he said. \"That's all. In New York, when the questions start. Somebody's going to ask who had the oars in every boat, and what they did with them.\" He picked up his pencil. \"And I'm going to know.\"</p>\n<p class=\"tape\">Then he sent me away, quite gently, and went back to his writing.</p>\n<p class=\"tape\">I stood in the door of the smoking room for a moment with the empty tray, and looked back at him, a thin man in a brown suit, in the corner by the dark window, bent over a notebook, writing very small, among all those sleeping people.</p>\n<p class=\"tape\">I've thought about that picture a great deal, since. I thought about it two nights later, more than I wanted to.</p>\n<p class=\"break\">&#10043;</p>\n<p>He put his cup down.</p>\n<p>\"He had two more days,\" he said. \"I didn't know that either.\"</p>", "audio": false, "added": 1790944448385, "pt": [1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944448385, 1790944894265, 1790944448385, 1790944894265]}, {"num": 10, "title": "Two Car Doors", "extra": false, "html": "<p>The bakery had closed on Saturday, as promised, and on Thursday he made eggs.</p>\n<p>\"There's nothing to put soup next to,\" he said, at the door, by way of explanation. \"I tried the bread from the supermarket in town. It's very soft. It's like eating a pillow somebody has been crying into.\" He took my coat, and looked at the moth hole in the sleeve with something like affection, and hung it on the hook. \"So, eggs. Have you eaten?\"</p>\n<p>I had not. I had left before seven, because I wanted to be early, and I had said it was for the traffic.</p>\n<p>We ate at the kitchen table. Scrambled eggs, very soft, as the French do them, with chives from a pot on the windowsill and toast from the crying pillow. He had made too much, and watched me eat it with the expression of a man who does not get to feed people often enough.</p>\n<p>Then I took Mrs. Dunleavy's notebook out of my bag and put it on the table between the plates.</p>\n<p>He didn't touch it at first. He looked at it. A black and white composition book, the marbled kind, with a date range on the cover in small furious capitals, and a strip of masking tape down the spine where it had been mended.</p>\n<p>\"You found her,\" he said.</p>\n<p>\"She found me. She took the phone off her son.\" I told him about the split-level, and the ramp, and the plastic tub in the garage with sixty notebooks in it. \"You were right. She'd written down everything. Every pipe and every dog, for eight years. She said nobody ever asked her.\"</p>\n<p>\"No. They never do.\" He put out one finger and touched the cover, very lightly, as you would touch something in a museum when the guard was not looking. \"May I?\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He read the Wednesday page for a long time.</p>\n<p>I had read it perhaps forty times by then. I had copied it out by hand. I had it nearly by heart. And still I watched him read it, and found that I was holding my breath.</p>\n<p>He read it once straight through. Then he went back to the top and read it again, slowly, with his finger moving down the margin, a line at a time, as if it were a contract.</p>\n<p>\"She's a good witness,\" he said at last.</p>\n<p>\"She's a furious witness.\"</p>\n<p>\"That's often the same thing. Look.\" He turned the book so I could see, and put his finger on a line. \"<em>Man's voice, not his.</em> She doesn't say who she thinks it was. She doesn't guess. She writes down what she heard, and she stops. Most people can't do that. They tell you what it meant, and you have to dig down through the meaning to find out what actually happened.\" He moved the finger. \"She only tells you what it meant once. Here, at the bottom. <em>He did not come back up.</em> And she's earned that one.\"</p>\n<p>He sat back.</p>\n<p>\"Three knocks,\" he said. \"Then two.\"</p>\n<p>\"I noticed that.\"</p>\n<p>\"Of course you did. What did you make of it?\"</p>\n<p>\"That it's a knock you'd agree on,\" I said. \"Somebody you'd told how to knock. So you'd know it was them and open the door.\" I had thought about it all week. \"He was frightened, that week. I'd told him to stay home. He wouldn't have opened his door to just anybody.\"</p>\n<p>\"No. He shut the cat away and opened it to somebody he'd been expecting.\" He moved his finger down. \"And they talked for half an hour first. With a great deal of laughing, on one side. That's not a man who's come to collect something. That's a man who's come to persuade.\"</p>\n<p>\"Persuade him of what?\"</p>\n<p>\"To go with him,\" he said. \"With everything.\" He looked at the next lines, and his face grew very still. \"Two trips. Both heavy. The first time, she writes, something banging the wall all the way down. You told me there were two banker's boxes in the closet by the door.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Two men. One box each. One trip.\" He tapped the line. \"And the banging. A banker's box is light enough to carry in front of you, if you're used to carrying things. A man who bangs it into the wall on every step of a narrow stair, all the way down, is a man who doesn't carry his own boxes, as a rule.\" He looked up at me. \"Then they came back up, quickly. Then down again, heavy, banging. What was the second trip, Ms. Barnett?\"</p>\n<p>I had been trying to answer that all week. I said what I had come up with, which was nothing: more papers, perhaps. A third box I'd never seen.</p>\n<p>He shook his head, very slightly.</p>\n<p>\"You told me once what the police wrote down, in his apartment. The officer who only wrote down what was in front of him. You read it to me off the report.\" He waited. \"What did the officer write down that wasn't there?\"</p>\n<p>It took me a moment. Then I had it, and I felt it go through me like cold water.</p>\n<p><em>Desk. No computer observed.</em></p>\n<p>\"He had a computer,\" I said. \"An old one. A big beige thing, on the desk, with a scanner. He scanned everything. Every document, before he copied it. I saw it the one time I was there. I never even thought about it.\" I put my hand flat on the table. \"It wasn't in the report because it wasn't there. And I always thought, of course it wasn't there, he took it with him. Like the boxes.\"</p>\n<p>\"He did take it with him,\" he said. \"Just not the way you thought. He carried it down the stairs himself, with his friend, at half past ten on a Wednesday morning, and put it in the car.\" He looked at the page again. \"Everything. Every copy, every scan, every piece of paper that could prove a word of your story. He carried it all down to the alley with his own hands, and he left his cat behind a closed door, and his family's photographs on the wall, because he meant to come home that night.\"</p>\n<p>\"He thought they were helping him,\" I said.</p>\n<p>It came out very quietly. I had not meant to say it out loud.</p>\n<p>\"I think so,\" he said. \"I think somebody he trusted came and told him the evidence wasn't safe in his apartment, not with Carrow's lawyers and Carrow's people, and they had a place it would be safe. And a place he would be safe, too, when he moved on Saturday, if he'd let them find it for him.\" He was quiet for a moment. \"<em>Customer to call with address.</em>\"</p>\n<p>I did not say anything for a while. The woodstove ticked. Outside, a crow walked along the fence by the field, and stopped, and looked at the house, and walked on.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"There's one more thing,\" he said.</p>\n<p>I looked up.</p>\n<p>\"It's a small thing. It may be nothing. It's a reason to ask, that's all.\" He turned the book around to face him again and put his finger on the last lines. \"Look at the car.\"</p>\n<p>I looked. I knew those lines as well as I knew my own name.</p>\n<p><em>10:14. Back door. Car in alley. Engine running. Exhaust coming in my kitchen window AGAIN.</em></p>\n<p><em>10:21. Two back UP. Quick.</em></p>\n<p><em>10:33. Two DOWN again. Slow. Heavy. Banging.</em></p>\n<p><em>10:41. Car door. Car door. Car gone.</em></p>\n<p>\"The engine was running when they came down the first time,\" he said. \"With the boxes. She smelled the exhaust from her kitchen. Then both of them went back upstairs, quickly, for the computer, and they were up there for twelve minutes. And all that time, the engine was still running.\"</p>\n<p>\"People leave engines running.\"</p>\n<p>\"They do. In an alley, in the middle of the morning, with nobody in the car, while they go up three flights of stairs and stay twelve minutes, and leave a car full of the only proof of a story the whole city is talking about, unlocked, with the engine running, in an alley.\" He let that sit. \"Some people. Perhaps.\"</p>\n<p>\"Or somebody was sitting in it.\"</p>\n<p>\"Or somebody was sitting in it.\" He touched the last line. \"And then, at the end. <em>Car door. Car door.</em> She heard two doors, Ms. Barnett. Not three. She was listening for doors. She'd been listening to that building for thirty years. If three people had got into that car she'd have written down three doors.\"</p>\n<p>\"Two men got in,\" I said slowly. \"And the one who drove was already in it.\"</p>\n<p>\"It's a reason to ask,\" he said again. \"That's all it is.\"</p>\n<p>I wrote it down. <em>Three knocks, two. Persuaded. 2 boxes, then the computer. Engine running 27 min. Somebody in the car? 2 doors.</em> And under it: <em>Three people. Not two.</em></p>\n<p>Then I looked at what I had written, and at Mrs. Dunleavy's furious little capitals beside it, and I thought about a careful man who apologized to the stairs, going down them for the last time between a friend who laughed and a stranger he may never have seen.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"She said one more thing,\" I said. \"About the other man. The one who laughed. She said he had leather heels. Hard ones. She could hear every step on the stairs. Click, click, click, like a lady, she said. She said you don't hear leather heels much anymore.\"</p>\n<p>He had been reaching for the coffee pot. His hand stopped.</p>\n<p>It was only for a second. I would not have noticed it, before. I had spent twenty weeks learning to notice things about him, and I noticed it now. His hand stopped just short of the pot, and stayed, and then went on, and poured.</p>\n<p>\"Leather heels,\" he said.</p>\n<p>\"Does that mean something?\"</p>\n<p>\"It means he was dressed for an office,\" he said, \"on a Wednesday morning, and he wanted to be.\" He put the pot down. He looked at the window, at the field, where the crow had gone. \"It reminds me of something. That's all. Something a long way off.\"</p>\n<p>He didn't say what. I didn't ask. I had learned, by then, that when he looked at the window like that, the answer was usually coming, and usually on tape.</p>\n<p class=\"break\">&#10043;</p>\n<p>He asked about Freda when we had cleared the plates. I told him she had come with me to Frederick, and had sat on the couch with the grandson and a can of soda, quiet as a mouse, for an hour.</p>\n<p>\"And then she asked the one question I didn't,\" I said. \"Whether Mrs. Dunleavy had ever seen him. The other man.\"</p>\n<p>\"Had she?\"</p>\n<p>\"No. Only heard him.\" I dried the last plate. \"She was good. Freda. She just sat there and let it happen. Mrs. Dunleavy liked her. She said she had her own mind.\" I put the plate away. \"She even got us around the fun run on Sixteenth Street. Up Georgia and across on Missouri. I didn't know she knew that part of town.\"</p>\n<p>He was folding the dish towel. He folded it in half, and in half again, and hung it on the oven door, and didn't say anything at all.</p>\n<p>Then he went through to the living room, and sat in his chair, and picked up the notepad.</p>\n<p>\"Tuesday,\" he said, when the recorders were running. \"We'll start on the Tuesday. Most of what matters happened on the Tuesday, though none of us knew it.\"</p>", "audio": false, "added": 1790944894265, "pt": [1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265]}, {"num": 11, "title": "The Hands", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 16, 1912</em></p>\n<p class=\"tape\">By Tuesday the ship had found a shape for its grief, the way water finds a shape for a jar.</p>\n<p class=\"tape\">There was a routine to it. That was the strange thing. People need one, even then. Breakfast was served in sittings, ours and theirs together, and the women from the boats came to the tables in borrowed clothes and sat with their hands in their laps and ate nothing, and then came back at the next sitting and ate a little. The children ran in the corridors, because children will. The ladies in the second-class saloon went on sewing their blanket coats. The doctors went from cabin to cabin. And all day long, along the rail on the boat deck, there were women standing, one or two at a time, looking out at the sea behind us. Not looking for anything. There was nothing to look for. Only looking.</p>\n<p class=\"tape\">I worked. I think I could have gone on working for a week without sleeping, that week, and I nearly did. When you're a bell boy, the work comes to you. A lady wants a shawl from her cabin. A gentleman wants a message taken to the purser. The doctor wants hot water, the chief steward wants the boys to clear the library, a child has been lost on B deck and must be found. You run, and you run, and you carry, and nobody sees you, and you see everyone.</p>\n<p class=\"tape\">That was the day I learned who was in the boat.</p>\n<p class=\"tape\">I never asked. I want you to understand that. A bell boy who asks questions gets sent below. I only stood where I was put, by doors and in corners and at the ends of tables with a coffee pot, and the survivors talked, as people do on the second day, when the first shock has worn off and the words begin to come. They talked to each other, low, over my head, as if I were a coat stand. <em>Which boat were you in? Oh, we were in the one with the officer who swore. We were in the one with the lady who rowed. We were in the one that went back.</em> By the afternoon I could have drawn you a chart of every boat on that ship and who had been in it, most of them. I had not set out to. It was what I did with my eyes when nobody needed them.</p>\n<p class=\"tape\">And the boat with the young woman in the dark coat, and the mother who didn't speak, and the two children: that one I found I had drawn more carefully than the others.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The wireless cabin had become a place I could hardly get into.</p>\n<p class=\"tape\">Cottam had not slept since Sunday. He was still at the key, gray in the face, sending names, and the pile of newspaper telegrams on the desk had fallen over and been stacked again in the bunk, because there was nowhere else to put it. And now there was a second operator in there with him. A boy not much older than Cottam, with his feet wrapped in bandages up to the ankles, sitting in a chair somebody had carried up, with a pad on his knee, writing out names for Cottam to send.</p>\n<p class=\"tape\">His name was Harold Bride. He was the Titanic's junior wireless man. He had been in the water, and on an overturned boat half the night, with someone standing on his feet, and the feet had been crushed and frozen, and he could not walk. They had carried him up to the wireless cabin because he had asked them to, because he knew the work and Cottam needed help, and he had been there ever since.</p>\n<p class=\"tape\">I brought them tea. Bride looked up when I came in and said, \"Thanks, kid,\" and went back to his pad. I don't think he saw me. He didn't see anybody that week. He was looking at something a long way off, all the time, through the walls.</p>\n<p class=\"tape\">There was a telegram on the top of the press pile that afternoon that was not from a newspaper. Cottam saw me look at it, and turned it toward me so I could read it, without a word.</p>\n<p class=\"tape\">It was from the President of the United States. It asked whether Major Archibald Butt was aboard.</p>\n<p class=\"tape\">\"Is he?\" I said.</p>\n<p class=\"tape\">Cottam shook his head. \"Not on any list.\" He turned it back face down on the pile. \"Captain says names, and nothing but names, to the shore. If the major's name isn't in them, that's the answer.\" He put his hand on the key. \"Names, Bertie. That's all we can do.\"</p>\n<p class=\"tape\">He went on sending. The President's telegram stayed on the pile, face down, with all the others.</p>\n<p class=\"tape\">I have thought about that since. The President of the United States asked a question about his friend, and a boy of twenty-one with no sleep put it face down on a pile, because the names came first. And he was right. I have been on the wrong side of a great many orders, in a great many lives. That one was right.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">There was a gentleman from the boat I want to tell you about.</p>\n<p class=\"tape\">I'll call him Mr. Ainsley. It wasn't his name. I told you I wouldn't give you the names, and I won't. But you need to be able to call him something, and so do I, and Ainsley will do.</p>\n<p class=\"tape\">He was about forty-five. Tall, well made, with a good jaw and a fine head of hair going gray at the sides, the kind of man who looks as if he ought to be on the board of something, and was, I learned later, on the boards of several things. He had been in first class on the Titanic. He was on the boat deck of the Carpathia by Tuesday morning, in his own clothes. That was the first thing I noticed about him. His own clothes. A good gray suit, a little creased, but dry and whole, and a proper collar, and his own shoes. Good black shoes, with hard leather heels, that you could hear on the deck boards from twenty feet away.</p>\n<p class=\"tape\">Most of the men who came off those boats came off them in whatever they'd been wearing at midnight. Evening clothes with a coat over them. Pajamas. One man came up the ladder in his dressing gown and a lifebelt and a bowler hat. Mr. Ainsley had dressed. He had dressed, all the way to his shoes, and come up on deck and got into a boat. And there was only one kind of boat a man could have got into in his own good shoes, with time to tie the laces: one of the early ones, that went down half empty, when nobody yet believed the ship would sink.</p>\n<p class=\"tape\">He talked a great deal. He was a talker, the kind people gather around. By Tuesday afternoon he had a little group of his own in the first-class smoking room, other survivors, and a few of our own passengers too, and he told them about the night, the boat, the cold, and he told it well. He had a way of telling things so that you saw them. He had a big laugh, and he used it, even then, even that week, at the right moments, to let people breathe.</p>\n<p class=\"tape\">And he told them, more than once, that in his boat it had been very calm, and very orderly. That he had sat in the stern, at the tiller, and kept up the ladies' spirits. That they had done everything right. That nobody was turned away.</p>\n<p class=\"tape\">I took him a cup of coffee, at about four o'clock. He took it from the tray without looking at me, as gentlemen did, and said \"Thank you, boy,\" and turned back to his audience.</p>\n<p class=\"tape\">And I saw his hands.</p>\n<p class=\"tape\">He had wrapped the right one in a handkerchief. The left was bare. Across the palm of it, at the base of every finger, there was a row of blisters, big ones, the kind you get from hours on something rough and hard, and all of them had burst, and the skin had come away raw and red underneath. The handkerchief on the right hand had a stain coming through it in the same places. In the same row.</p>\n<p class=\"tape\">I have pulled an oar, Ms. Barnett, in more than one life. I know the hands of a man who has rowed all night. You blister in that row, across the root of the fingers, both hands, because an oar takes both. A tiller you steer with one hand, and you shift it from one to the other when you're tired, and you may get a sore palm, but you don't get that. Not on both hands. Not in that row.</p>\n<p class=\"tape\">Mr. Ainsley had not been sitting in the stern keeping up the ladies' spirits. Mr. Ainsley had been on an oar, all night, as hard as he could pull.</p>\n<p class=\"tape\">There was nothing wrong with that. I want to say that plainly. A man who rows all night in an open boat to keep people alive has nothing to hide. He has something to be proud of. Most men would have shown you their hands.</p>\n<p class=\"tape\">Mr. Ainsley had wrapped one of his up, and was telling a room full of people that he'd sat at the tiller.</p>\n<p class=\"tape\">I put that away. Not where I'd put the young woman. Somewhere nearer.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At about five, I saw him go and talk to Mr. Hatch.</p>\n<p class=\"tape\">Hatch was in his corner of the second-class smoking room, by the window, with his notebook. He had been at it all day. Survivors came and sat with him, one at a time, and talked, and he listened and wrote, and bought them coffee, and they went away. I had carried a good deal of the coffee.</p>\n<p class=\"tape\">Mr. Ainsley came in from the deck, in his hard heels, and the room heard him come, and he went to Hatch's corner and sat down across from him, uninvited, and smiled. I was at the sideboard with a tray of cups. I couldn't hear them. They kept their voices low. But I could see them, and I watched.</p>\n<p class=\"tape\">Ainsley did most of the talking. He leaned f
