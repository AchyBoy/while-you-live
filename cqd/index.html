our.\"</p>\n<p class=\"tape\">I didn't answer.</p>\n<p class=\"tape\">\"You smelled of blacking at breakfast,\" she said. \"I was at the second sitting. You poured the coffee at the first-class tables and then you came through ours with the cream. Your hands smelled of blacking, and you had it in the creases of your knuckles, and on your cuff. You carry shoes for the boots in the mornings, I know. I've seen you. But you don't black them. Nobody touches the blacking but the boots himself, an old man with a limp called Fennimore. Half the ship has heard him say so.\" She tilted her head. \"You went to look at somebody's shoes.\"</p>\n<p class=\"tape\">\"Yes, miss,\" I said.</p>\n<p class=\"tape\">There didn't seem to be any point saying anything else.</p>\n<p class=\"tape\">\"Whose?\"</p>\n<p class=\"tape\">\"You know whose, miss.\"</p>\n<p class=\"tape\">\"Yes,\" she said. \"I do.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">\"You took the typewriter case from the library,\" she said. \"At about seven. It was on the chair on Wednesday night, in his corner, when I came through with the children before bed. It wasn't there when I went past at eight this morning. Nobody had touched anything else of his. His pen was still on the table. Only the case.\" She looked at my hands again. \"It's not with the purser. I asked the purser, at nine, very sadly, whether the poor man's things had been collected, because I'd like to send a note to his family. The purser said he hadn't had time. So you've got it.\"</p>\n<p class=\"tape\">\"Yes, miss.\"</p>\n<p class=\"tape\">\"Why?\"</p>\n<p class=\"tape\">\"Because he typed some of it out on Wednesday, miss,\" I said. \"A fair copy. Five pages. They were in the lid. Mr. Ainsley took the notebook. He doesn't know about the pages.\"</p>\n<p class=\"tape\">She went very still.</p>\n<p class=\"tape\">I watched her take that in. I watched her see the five pages, folded, in the lid of a scuffed case with a mended handle, and see what was on them, and see that she had not known about them, and see what it meant that I had. It took her about as long as it takes to read this sentence. Then her face was calm again.</p>\n<p class=\"tape\">\"You've read them,\" she said.</p>\n<p class=\"tape\">\"Yes, miss.\"</p>\n<p class=\"tape\">\"All of them.\"</p>\n<p class=\"tape\">\"Yes, miss.\"</p>\n<p class=\"tape\">She looked at the lower berth, at the mother's back, turned to the wall.</p>\n<p class=\"tape\">\"Then you know what's in them,\" she said, \"and who.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I want to tell you about the next twenty minutes very carefully, Ms. Barnett, because I've never had another twenty minutes like them, in any life, before or since. I've had longer conversations. I've had cleverer ones, perhaps, with famous men. I've never had one like that.</p>\n<p class=\"tape\">She didn't argue with me. That was the first thing. She didn't pretend. She didn't tell me I was a child who didn't understand, or that I'd imagined it, or that a bell boy had no business in it. She talked to me as if I were exactly what I was, which nobody had done for three weeks, and I think nobody had done for longer than that, in that life or the one before.</p>\n<p class=\"tape\">\"Mr. Ainsley killed him,\" I said. \"On the stairs. You saw the step.\"</p>\n<p class=\"tape\">\"Yes.\"</p>\n<p class=\"tape\">\"You saw the heel. The half moon. You wiped it out.\"</p>\n<p class=\"tape\">\"Yes.\"</p>\n<p class=\"tape\">\"Why?\"</p>\n<p class=\"tape\">She folded her hands in her lap.</p>\n<p class=\"tape\">\"Because there was only one place that step went,\" she said. \"Think about it. You're a clever boy. Cleverer than any boy I've met. Think it all the way through.\" She said it quite gently. \"An officer sees that mark. He asks whose heel. He finds the shoe. Mr. Ainsley is questioned. Mr. Ainsley says he never went near the man. The officer asks why anyone would want to harm a poor writer. Somebody says, he was writing about the boats. The captain is told. The owners are told. In New York there will be an inquiry about the Titanic in any case, a great public one, with senators, and every survivor will be asked what happened in their boat, under oath.\" She looked at the berth. \"And somebody will ask her.\"</p>\n<p class=\"tape\">\"She told Mr. Hatch,\" I said.</p>\n<p class=\"tape\">\"She told him once. At two in the morning, on Tuesday, in a corner of a smoking room, after a doctor had given her brandy. She told him because he was kind, and asked, and she hadn't slept, and she couldn't hold it anymore.\" She was still looking at the berth. \"She'll never say it again. Not if she lives to be a hundred. Not unless somebody makes her. In a room full of newspapermen. Under oath. With her name in every paper in America the next morning. <em>The woman who sat in a boat with twenty empty places and watched.</em> And her children reading it, one day.\" She turned back to me. \"Her husband went down with that ship, Bertie. Did you know? She kissed him at the rail, and he put her into the boat, and he stood back. She has nothing now. Not a husband. Not a house. Two children, and a governess who isn't paid. Your Mr. Hatch's justice would take what's left.\"</p>\n<p class=\"tape\">\"He wasn't my Mr. Hatch.\"</p>\n<p class=\"tape\">\"No,\" she said. \"But you've made him yours. I saw it on the landing. You'd made him yours long before.\"</p>\n<p class=\"tape\">I didn't answer that.</p>\n<p class=\"tape\">\"And you,\" I said. \"You're in the pages too.\"</p>\n<p class=\"tape\">\"Yes.\" She didn't look away. \"I'm the one who said not to go back. I know. I said it, and I'd say it again tomorrow, and I would say it at any inquiry they liked. I don't mind that being known. I mind her.\"</p>\n<p class=\"tape\">\"A man's dead, miss,\" I said. \"A man who did nothing but write it down.\"</p>\n<p class=\"tape\">\"Yes. And a steward is dead who did nothing but swim,\" she said. \"And fifteen hundred others who did nothing at all. And not one of them will come back, whatever is done to Mr. Ainsley.\" She leaned forward a little. \"I'm not defending him. Don't think that. I watched him stand up in that boat. I watched him at the service, afterward, singing the hymn. I know exactly what he is. I knew what he'd done on those stairs before I'd got to the bottom of them. But there's no way to hang him for it that doesn't go through her.\"</p>\n<p class=\"tape\">\"So he walks down the gangway.\"</p>\n<p class=\"tape\">\"Yes.\"</p>\n<p class=\"tape\">\"And he does it again. Men like that do. Somewhere. To somebody.\"</p>\n<p class=\"tape\">\"Perhaps,\" she said. \"And then someone will stop him then. Someone who can.\" She looked at me, a long, level look, with her gray eyes too far apart. \"You and I are a bell boy and a governess, on a ship full of grief, with eleven hours to New York. Neither of us can stop anybody. We can only decide who gets hurt next.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I've thought about what she said, since. Every word of it. I've had a long time to.</p>\n<p class=\"tape\">She was right about the inquiry. There was one, in New York, the next day, in the Waldorf-Astoria, with senators, and they called the survivors and asked them about their boats, and the newspapers printed every word. She was right about that, and about the mother, and about what it would have cost.</p>\n<p class=\"tape\">And she was wrong. A man killed another man on a staircase for writing down the truth, and walked away. I've never been able to make that right, whatever the arithmetic.</p>\n<p class=\"tape\">Both of those are true. I told Freda that, this morning. Nobody likes it. I didn't like it then.</p>\n<p class=\"tape\">\"What do you want from me, miss?\" I said.</p>\n<p class=\"tape\">\"The pages,\" she said simply. \"Give them to me.\"</p>\n<p class=\"tape\">\"No, miss.\"</p>\n<p class=\"tape\">She smiled. It was the first time I'd seen her smile. It was small, and quick, and a little sad, and it reached her eyes, and for a moment she looked about twenty.</p>\n<p class=\"tape\">\"No,\" she said. \"I didn't think you would.\" She stood up. \"Thank you for the milk, Bertie. And for the blanket, on Monday. You can go.\"</p>\n<p class=\"tape\">I went.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I went down four decks to the bell boys' cabin, faster than I should have, because something in the way she had smiled had got under my collar and was sitting there.</p>\n<p class=\"tape\">Stan was there. He was sitting on his bunk, in the middle of the morning, when he should have been on B deck, and he had a shilling. He was turning it over and over in his fingers, and when he saw me in the door he put it in his pocket very quickly and stood up.</p>\n<p class=\"tape\">\"Bertie,\" he said. \"Where've you been?\"</p>\n<p class=\"tape\">I didn't answer. I went to my locker. The door was shut. I opened it.</p>\n<p class=\"tape\">My spare jacket was where I had left it. The typewriter case was where I had left it, behind the jacket, latched.</p>\n<p class=\"tape\">I unlatched it and opened the lid.</p>\n<p class=\"tape\">The pages were gone.</p>\n<p class=\"tape\">I turned round. Stan was standing by his bunk with his hands in his pockets, and his face had gone red from the neck up.</p>\n<p class=\"tape\">\"A lady came,\" he said. \"Down the companionway. They're not supposed to, but she did. She was nice. She said you'd taken a toy of the little girl's to mend, a wooden horse, and the little girl was crying for it, and she couldn't wait, and would I mind.\" He swallowed. \"She gave me a shilling, Bertie. A whole shilling. I opened your locker and she looked in the case and there wasn't any horse, and she said she must have been mistaken and you must have it somewhere else, and she was sorry to trouble me, and went.\" He looked at me. \"I didn't see her take anything. Honest.\"</p>\n<p class=\"tape\">\"No,\" I said. \"You wouldn't have.\"</p>\n<p class=\"tape\">\"Was it a horse? Did you have the kid's horse?\"</p>\n<p class=\"tape\">\"No, Stan.\"</p>\n<p class=\"tape\">\"Oh,\" said Stan. And then, after a moment, unhappily: \"D'you want half the shilling?\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. He put the pencil down on the notepad.</p>\n<p>Freda, on the stairs, had her hand over her mouth.</p>\n<p>\"She kept you talking,\" she said, through her fingers. \"On purpose. The whole time.\"</p>\n<p>\"Twenty minutes,\" he said. \"About right and wrong, and a mother asleep in a berth, and what the two of us could and couldn't do. And I enjoyed every minute of it. God help me. It was the first real conversation I'd had in three weeks, and she'd known I would enjoy it, and she'd known that while I was enjoying it I wouldn't be thinking about my locker.\" He shook his head slowly. \"She asked for the pages so I'd say no. So I'd feel I'd won. She never expected me to give them to her. She'd already sent somebody else to get them.\"</p>\n<p>\"That's so...\" Freda took her hand away from her mouth. \"That's so good, though. That's evil. But it's so good.\"</p>\n<p>\"Yes,\" said Tom. He was smiling, a little, at the window. It was not a happy smile, quite, but it was not an unhappy one either. \"That's exactly what I thought, at the time. Standing in that cabin, looking at an empty case. I thought, that's evil, and it's so good.\"</p>\n<p>\"Did you hate her?\"</p>\n<p>He considered that, seriously, as he considered everything Freda asked him.</p>\n<p>\"No,\" he said at last. \"I think that was the trouble.\"</p>", "audio": false, "added": 1790946074534, "pt": [1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790956055641, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534]}, {"num": 17, "title": "Pages in the Wake", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 18, 1912, afternoon</em></p>\n<p class=\"tape\">I made one try. I want you to know that. Just one.</p>\n<p class=\"tape\">At two o'clock I went to find the officer who had stood at the top of the after companionway with a lantern and written <em>Death accidental</em> in his book. He was on the boat deck, by the bridge ladder, with his hands behind his back, looking at the fog, which had begun to thin. You could see the rail now, and the boats, and a little gray water beyond them.</p>\n<p class=\"tape\">I stood in front of him with my cap in my hands.</p>\n<p class=\"tape\">\"Please, sir,\" I said. \"Can I ask you something? About last night.\"</p>\n<p class=\"tape\">He looked down at me. I don't think he remembered me at all.</p>\n<p class=\"tape\">\"What is it?\"</p>\n<p class=\"tape\">\"If a gentleman slipped at the top of those stairs, sir, and went down them,\" I said, \"and you found a mark on the steps where his heel had gone. Would the mark be going up, sir, or down?\"</p>\n<p class=\"tape\">He stared at me.</p>\n<p class=\"tape\">\"Down, I should think,\" he said. \"If he was going down.\" He frowned. \"What sort of question is that?\"</p>\n<p class=\"tape\">\"Only, sir, I thought I saw one going up. On the fifth step, in the blood, before the lady slipped on it. With a notch out of the heel.\" I made myself say the rest. \"And there's a gentleman's shoe in B-52, sir, with a notch just like it. And something brown in the notch. If somebody looked before it's cleaned...\"</p>\n<p class=\"tape\">He looked at me for a long moment. Then something happened in his face that I had seen happen in a great many faces, in a great many lives, when a person of no account says something that would be a great deal of trouble if it were true. He decided it wasn't.</p>\n<p class=\"tape\">\"You thought you saw,\" he said. \"In the fog. At one in the morning. Where you had no business being. And now you've been handling a first-class gentleman's shoes and making up stories about them.\" He bent down a little, so his face was level with mine. \"Listen to me, boy. A man fell down a flight of stairs in the fog, and the doctor's seen him, and it's written in the log, and there's an end of it. We've got seven hundred people on this ship who've lost everything, and a captain who hasn't slept since Sunday, and we'll be in New York tonight with half the world waiting on the pier. The last thing anybody needs is a bell boy with an imagination.\" He straightened up. \"Now cut along before I tell Mr. Lyle where you were last night.\"</p>\n<p class=\"tape\">I cut along.</p>\n<p class=\"tape\">That was my one try. I had known before I made it how it would end. I had known it on the floor of the bell boys' cabin at four in the morning. But I had to make it, Ms. Barnett. You understand. If I hadn't, I'd have had to wonder.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The fog lifted at about three.</p>\n<p class=\"tape\">It went quite suddenly, as fog does at sea, as if someone had pulled a sheet off a table. One minute the ship was wrapped in white, and the whistle going, and the next the white was tearing apart into rags and drifting off over the water, and there was a pale sun, low in the west, and blue sky in pieces, and a long, slow, gray-green swell. The whistle stopped. The engines came up. You could feel her lift and begin to move again.</p>\n<p class=\"tape\">People came out on deck. Survivors, and our own passengers, to stand in the sun. Nobody said much. They stood along the rails and looked west, where New York was, still below the edge of the world.</p>\n<p class=\"tape\">I went aft, because I was sent with a rug for a lady by the after rail, and on my way back I saw her.</p>\n<p class=\"tape\">She was at the very stern, alone. Right at the back of the ship, by the flagstaff, where the rail curved round and nobody went, because there was nothing to see there but the wake. She was in her dark coat again, with her hair up. Her back was to me.</p>\n<p class=\"tape\">She had something in her hands. White. Paper.</p>\n<p class=\"tape\">As I watched, she took one sheet from the top and held it out over the rail, at arm's length, and opened her fingers.</p>\n<p class=\"tape\">The wind took it. It went up, first, a little, turning over in the sun, white and then white again, like a bird that has been startled off a fence. Then it came down into the wake behind the ship, into the long churned road of green and white water the screws were making, and lay flat on it for a second, and was rolled under.</p>\n<p class=\"tape\">She took another sheet and did the same.</p>\n<p class=\"tape\">I stood by the deckhouse with the rug over my arm and watched her do it. Five times. I counted. I knew how many there were. Five pages, typed with two fingers in the second-class library on a Wednesday afternoon by a man in a brown suit, going up into the sun, one after another, and turning over, and falling into the wake, and lying there, white, and gone.</p>\n<p class=\"tape\">She didn't hurry. She did each one separately, carefully, the way you'd lay flowers on a grave one at a time.</p>\n<p class=\"tape\">When the last one had gone, she stood with her hands on the rail for a moment, looking down at the water where it had gone under.</p>\n<p class=\"tape\">Then she turned around, and saw me.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">She didn't seem surprised. I think she had known I was there for some time.</p>\n<p class=\"tape\">She came along the rail toward me, unhurried, with her hands in the pockets of her coat, and stopped a little way off. The sun was behind her. I couldn't see her face well.</p>\n<p class=\"tape\">\"Bertie,\" she said.</p>\n<p class=\"tape\">\"Miss.\"</p>\n<p class=\"tape\">\"I owe Stan another shilling,\" she said. \"I think I underpaid him. He looked very unhappy about it when I left.\"</p>\n<p class=\"tape\">I didn't answer.</p>\n<p class=\"tape\">\"The notebook's gone too,\" she said. \"If you were wondering. In case you thought you might still find it. Mr. Ainsley went down to the stokehold at six this morning, before anyone was about, with a cigar he didn't light, and came up again without the notebook. I was on the stair.\" She looked past me, at the funnel, where the smoke was going up. \"There's nothing left. Not a page. Not anywhere.\"</p>\n<p class=\"tape\">\"There's me,\" I said.</p>\n<p class=\"tape\">She looked at me then. A long look. I couldn't see her eyes, with the sun behind her, but I felt it.</p>\n<p class=\"tape\">\"Yes,\" she said. \"There's you.\"</p>\n<p class=\"tape\">\"I saw the step. I saw his shoe. I saw his jaw at breakfast.\"</p>\n<p class=\"tape\">\"Yes. And so did I. And neither of us will ever say so to anyone who matters, because no one who matters will ever listen to a bell boy and a governess against a gentleman with a bruise from slipping in the fog.\" She said it quite gently. \"You know that. You've known it since four o'clock this morning. You went and asked that officer anyway, at two, by the bridge ladder. I saw you.\" She was quiet a moment. \"That was brave. It was also quite useless. I'm sorry.\"</p>\n<p class=\"tape\">\"You're not sorry.\"</p>\n<p class=\"tape\">\"No,\" she agreed. \"I'm not sorry I did it. I'm sorry it had to be done. That isn't the same thing.\" She took one hand out of her pocket and pushed a strand of hair off her face. \"I don't expect you to forgive me, Bertie. I'm not sure I would, in your place.\"</p>\n<p class=\"tape\">I didn't say anything for a while. The wake ran away behind us, white and green, very straight, all the way back toward the east, toward the ice, and the place where the boats had been.</p>\n<p class=\"tape\">\"Why did you hum it?\" I said. \"That song. To the little girl. On Tuesday night.\"</p>\n<p class=\"tape\">I don't know why I asked. It wasn't what I'd meant to say. It came out of me before I could stop it.</p>\n<p class=\"tape\">She went very still. For the first time since I had known her, I saw her not know what to say.</p>\n<p class=\"tape\">\"It's an old song,\" she said at last.</p>\n<p class=\"tape\">\"Yes, miss.\"</p>\n<p class=\"tape\">\"My father...\"</p>\n<p class=\"tape\">\"Found it in a book,\" I said. \"Yes, miss. You told her.\"</p>\n<p class=\"tape\">She looked at me for a long time. The wind moved her coat. Down below us, in the wake, there was nothing at all.</p>\n<p class=\"tape\">\"How old are you, Bertie?\" she said.</p>\n<p class=\"tape\">\"Twelve, miss.\"</p>\n<p class=\"tape\">\"No,\" she said quietly. \"You're not.\"</p>\n<p class=\"tape\">And she turned, and walked away along the rail toward the door, and went in, and didn't look back.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. He put the pencil down.</p>\n<p>Nobody said anything. Freda was sitting on the stairs with her arms tight around her knees, perfectly still.</p>\n<p>\"What did she mean?\" said Freda. \"You're not.\"</p>\n<p>\"I don't know,\" he said. \"I've never known.\" He looked at the window. \"Perhaps she meant that I didn't talk like a boy of twelve. I didn't, by then. I'd stopped trying, with her. Perhaps she meant only that.\"</p>\n<p>\"But you don't think so.\"</p>\n<p>He didn't answer that.</p>\n<p>\"It was a long time ago, Freda,\" he said instead. \"And there's still the rest of Thursday. The worst of it.\" He picked the pencil up again, and looked at it, and put it down. \"I think I'd like a cup of tea first. If nobody minds.\"</p>\n<p>Freda got up off the stairs and said she'd make it. He started to protest, and she said, \"Sit,\" in exactly my voice, and went into the kitchen. He sat.</p>\n<p>He looked at me across the little table, with the recorders running between us.</p>\n<p>\"She's a good girl,\" he said quietly.</p>\n<p>\"I know.\"</p>\n<p>\"No,\" he said. \"I mean, she's a good girl, Ms. Barnett.\" He held my eyes a moment longer than he needed to. Then he looked at the notepad on his knee, and said nothing else until the tea came.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 18, 1912, evening</em></p>\n<p class=\"tape\">They came for me at five.</p>\n<p class=\"tape\">I was in the pantry with Evans, drying cups, because there was nothing else for me to do and I couldn't sit still. Lyle came in. He had the purser behind him, and behind the purser, in the doorway, in his good gray suit and his shined shoes, Mr. Ainsley.</p>\n<p class=\"tape\">\"Pike,\" said Lyle. \"Where's the writer's case?\"</p>\n<p class=\"tape\">I put the cup down.</p>\n<p class=\"tape\">It had been very simple, as the worst things often are. At four the purser had finally found time to see to the dead man's effects. He had sent a steward to the library. The steward had found a pen on the table and nothing else. The purser had said that was odd, a writer with no papers, and Mr. Ainsley, who happened to be passing the purser's office, had very kindly mentioned that the poor fellow had a typewriter, and a notebook, a fat one, which he carried everywhere and which, Mr. Ainsley understood, he had been hoping to sell to the New York newspapers. Things like that were worth a great deal of money this week, Mr. Ainsley said. It might be worth asking who had been in the library.</p>\n<p class=\"tape\">And a lady sleeping in the library had seen a bell boy carry a case out of it at seven that morning. A small one, with a mended handle.</p>\n<p class=\"tape\">\"In my locker, sir,\" I said.</p>\n<p class=\"tape\">They went and got it. Lyle carried it back up to the pantry himself and put it on the counter and opened it in front of all of us. A typewriter, and a ribbon tin, and a letter to a sister in Ohio, half finished, and nothing in the lid.</p>\n<p class=\"tape\">\"And the notebook?\" said the purser.</p>\n<p class=\"tape\">\"I never had the notebook, sir.\"</p>\n<p class=\"tape\">\"Then where is it?\"</p>\n<p class=\"tape\">I looked past him at Mr. Ainsley in the doorway. He was looking back at me with an expression of great kindness and a little sorrow, like a man looking at a boy who has disappointed him.</p>\n<p class=\"tape\">\"I don't know, sir,\" I said.</p>\n<p class=\"tape\">\"Took the case and not the notebook,\" said Lyle. \"That's a likely story. And what were you going to do with a typewriter, Pike? Write your memoirs?\" He turned to the purser. \"He's been out of his bunk every night this week, sir. I've had complaints. And there's papers on this ship offering a year's wages for any scrap of a survivor's story.\"</p>\n<p class=\"tape\">\"I was keeping it safe,\" I said. \"For his family. He had a sister.\"</p>\n<p class=\"tape\">It was the truth. Nobody in that pantry believed it, and I don't blame them. I wouldn't have.</p>\n<p class=\"tape\">The purser looked at me for a long moment. He was a fair man, I think. He was also a tired one.</p>\n<p class=\"tape\">\"He'll be put ashore in New York,\" he said to Lyle. \"Discharged. No character.\" He closed the case. \"The company can decide about the notebook. I haven't time.\"</p>\n<p class=\"tape\">\"Go easy on the boy, Purser,\" said Mr. Ainsley, from the doorway. His voice was warm. \"It's been a hard week for everyone. Boys get ideas, at times like these.\" He smiled at me. \"I'm sure he meant no harm.\"</p>\n<p class=\"tape\">And he turned and went away down the corridor, and I listened to his heels go, click, click, click, all the way to the end, until a door shut.</p>\n<p class=\"tape\">At six o'clock we passed the Sandy Hook lightship, and the passengers lined the rails to see the lights of America, and I was in the bell boys' cabin on E deck, with my things in a canvas bag on my bunk, and Stan sitting on the bunk above with his half of a shilling, not saying anything at all.</p>", "audio": false, "added": 1790946074534, "pt": [1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790951242617, 1790948775374, 1790951242617, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374]}, {"num": 18, "title": "Fourteen Photographs", "extra": false, "html": "<p>The records office was in the basement of a building downtown that I had walked past a thousand times, back when I worked six blocks away, and never once gone into.</p>\n<p>There was a counter with a scratched plastic window, and a ticket machine, and eleven chairs bolted together in a row, and a television on the wall showing a cooking show with the sound off. I took a ticket. I was number forty-one. They were serving number thirty-three. I sat in one of the bolted chairs with my bag on my knees and watched a man on the television fold egg whites into something, very slowly, for twenty minutes.</p>\n<p>When they called forty-one, a woman behind the plastic took my license and my letter and looked at both for a long time, and went away, and came back with a manila envelope, the big kind, sealed with tape. She slid a form under the window for me to sign. I signed it. She slid the envelope after it.</p>\n<p>\"Fourteen photographs,\" she said, \"and two pages of notes. Some material withheld under the exemptions on the attached sheet. You can appeal within thirty days.\"</p>\n<p>\"Thank you.\"</p>\n<p>\"You're the third person this year,\" she said, \"who's come in for a file this old.\" She was already looking past me, at forty-two. \"Most people don't bother. Most people just let it go.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I didn't open it there. I didn't open it in the elevator, or on the sidewalk, or in the car. I drove to a coffee place I used to go to, on the corner across from where the paper's building had been, which was a bank now, and I bought a coffee I didn't want, and sat at a table in the back by the window, and opened the envelope.</p>\n<p>The notes first. Two pages, typed, in the flat language of a man who had a great many of these to do that week. I had read the two-page report so many times I could have recited it. These were the notes behind it, the officer's own, and they weren't much longer, and they weren't much better. <em>Landlord states tenant not seen since Wed approx. Tenant owes 2 wks rent. Movers booked Sat. Cat in BR, landlord removed.</em> Then, near the bottom of the second page, a line I had never seen.</p>\n<p><em>Neighbor 2F (Dunleavy) called station x2 re: noise Wed a.m. Msg passed to R/O. Not interviewed. See landlord stmt.</em></p>\n<p>I sat and looked at that line for a long time.</p>\n<p><em>Not interviewed.</em> She had called them twice. They had passed it on. And the responding officer, whose name was on the top of both pages, had read the message and written it down, very neatly, and gone to talk to the landlord about the carpet.</p>\n<p>I thought of Mrs. Dunleavy in her wheelchair by the window, with her hands folded on the crocheted blanket. <em>Nobody ever calls me back.</em></p>\n<p>Then I opened the photographs.</p>\n<p class=\"break\">&#10043;</p>\n<p>They were color prints, glossy, four by six, each one with a number written on the back in marker and a date stamp in the corner. Fourteen of them. I laid them out on the table in order, in two rows of seven, and moved my coffee to the windowsill so I wouldn't spill it on them, and looked.</p>\n<p>The first three were the building. The front, with the dry cleaner's sign and the steam coming out of a vent at the side. The front door. And the stairs, from the bottom, looking up. A narrow staircase with a wooden rail, and the walls painted a pale clean cream, fresh, glossy, the kind of paint that shows everything.</p>\n<p>I picked up the third one and held it closer, because Tom had told me to look at that wall.</p>\n<p>All the way up the left-hand wall of the staircase, at about the height of a man's waist, there was a line of marks. Scuffs, and dents, and in two places small gouges where the cream paint had come away and the old green showed through underneath. Every few steps. All the way up, as far as the photograph went.</p>\n<p><em>Something banging the wall all the way down. New paint!!</em></p>\n<p>It didn't say what had made the marks, or exactly when. Anybody moving anything up or down those stairs could have done it. But it was new paint, and it was marked all the way up, and a woman on the second floor had written down the day she heard it happen.</p>\n<p>I put it down very carefully, as if it might break.</p>\n<p>Four through eight were the living room. It was smaller than I remembered, and more ordinary. A brown couch with a blanket folded on the arm. A rug. A small television on a stand. A bookshelf, full, the books shelved by size. And the wall over the couch, with the photographs on it.</p>\n<p>There were seven. I counted. Seven frames in a careful arrangement, the kind a person measures and marks in pencil before they put in a single nail. An older woman in a sun hat, laughing, in a garden. That would be his mother. A young man in a cap and gown with the same woman beside him, not laughing, very proud. A lake with a dock. A dog. A church. A group of people at a long table, a wedding or a birthday, too small to see faces.</p>\n<p>And one more, at the end. Larger than the others, in a better frame.</p>\n<p>I picked up photograph number seven and held it right up to my face, there at the table in the back of the coffee place, and I didn't care who saw.</p>\n<p>It was him. My source. Bookbinder. In a dark suit that didn't fit him, standing in front of a pair of tall brass doors I would have known anywhere in the world, under a banner I could almost read: <em>CARROW HOUSE</em>, and something else, smaller, <em>SPRING SALE</em>, and a year. He was smiling. Shyly, as he used to smile at me across the diner table when he'd brought me something good and didn't want to seem proud of it.</p>\n<p>And beside him, with one arm around his shoulders, was another man.</p>\n<p>Older. Sixty, perhaps, or a fit seventy. Tall, heavy-shouldered, with a fine head of white hair swept back, and a bow tie, and a beautifully cut gray suit. He had his head thrown back. He was laughing. Not smiling. Laughing, with his whole body, his mouth wide open, as if somebody just out of the frame had said the funniest thing he had ever heard. And his arm was around my source's shoulders, hard, the way a proud father holds a son at a graduation. The way you hold someone who belongs to you.</p>\n<p>I didn't know him. I sat with the photograph in my hand and went through every face I could remember from eight months of Carrow House, every name in every document, every lawyer, every executive in every annual report, and I didn't know him.</p>\n<p>And I thought of the laugh. I had never heard it. I had only a furious little line in a composition book.</p>\n<p><em>A big one. Too big. The kind of laugh a man has when he's used to people laughing with him.</em></p>\n<p>A man laughing in a photograph at a party proves nothing. Half the men at any party are laughing in the pictures. I knew that. I looked at him anyway, for a long time.</p>\n<p class=\"break\">&#10043;</p>\n<p>The rest I went through quickly, because I couldn't help it, and then slowly, because I made myself.</p>\n<p>Nine was the desk. A plain wooden desk under the window, with a lamp and a mug of pens. And on the desk, in the middle, a big pale rectangle in the dust, perfectly clean, with a power strip on the floor beneath it and three cables hanging down off the back of the desk into nothing. You could see exactly where the computer had been, and the scanner beside it. The officer had stood in front of that and written, <em>No computer observed.</em></p>\n<p>Ten was the closet by the door, opened. Coats on hooks. Shoes on the floor. And at the back of the floor, two more rectangles in the dust, side by side, the size and shape of banker's boxes.</p>\n<p>Eleven and twelve were the bedroom. A bed, unmade. A window. A water bowl on the floor by the door, empty, and a litter box in the corner, and the door itself, from inside, with long pale scratches down the paint at the bottom where something with claws had tried for two days to get out.</p>\n<p>Thirteen was the kitchen. Dishes in the sink. A cereal box on the counter. A mug, by the kettle, with a teabag in it, ready, as if he'd put it out to have when he got back.</p>\n<p>Fourteen was the bookshelf again, closer. I don't know why the officer took it. Perhaps he thought he ought to take one more. On the middle shelf, between two books, there was a small gray stuffed mouse with one ear chewed off.</p>\n<p>I put them all back in the envelope, in order, and closed it, and sat with both hands flat on top of it, and looked out of the window at the bank where the paper used to be, until the coffee was cold.</p>\n<p class=\"break\">&#10043;</p>\n<p>I called Freda from the car. It was ten past four. She would be home by now.</p>\n<p>It went to voicemail. I texted. <em>On my way. Want anything from the store?</em></p>\n<p>The answer came a minute later. <em>at maddies, back by 7. no thx</em></p>\n<p>I sat in the car with the engine off and the envelope on the passenger seat, and I looked at the text, and I thought about how long it had been since I'd seen Maddie's mother. Not since the lab. Not since she called me in the winter, very quiet, to apologize for something she couldn't name. I had meant to call her back. I never had. And Maddie's house was on the way home, almost. And I had a car, and a free hour, and a daughter at someone else's kitchen table eating someone else's food.</p>\n<p>I called Maddie's mother.</p>\n<p>She answered on the second ring, and she sounded surprised, and then pleased, and then, when I said I was nearby and thought I'd pick Freda up and save her the bus, she didn't say anything at all for a moment.</p>\n<p>\"Freda?\" she said.</p>\n<p>\"Yes. She's there, isn't she? With Maddie?\"</p>\n<p>\"Iola.\" Her voice had gone careful. \"Maddie's at her dad's this week. In Baltimore. She's been there since Saturday.\" A pause. \"And Freda hasn't been over here since... well. Not since the lab. Not once. I thought you knew. I thought, after everything, you'd rather she didn't.\"</p>\n<p>I said something. I don't know what. I said thank you, I think, and that I must have got the day wrong, and that we should have coffee, and she said yes, we should, in the voice people use when they know they never will.</p>\n<p>I hung up.</p>\n<p>I sat in my car in the parking garage under the building where my career had ended, with fourteen photographs of a man who had gone out one morning and never come back on the seat beside me, and my daughter's text on the screen in my hand.</p>\n<p><em>at maddies, back by 7.</em></p>\n<p>And under it, in my memory, as clear as if I were reading it off the page: <em>Maddie's sister was getting rid of them.</em> And <em>Maddie's sister drives that way.</em></p>\n<p>Maddie didn't have a sister. Maddie had two older brothers, and no sister at all. I had known that for eleven years. I had even made a little joke, in my own head, in the car on the way to Frederick, about how generous Maddie's sister had become. I had known it the whole time.</p>\n<p>I had just never checked.</p>", "audio": false, "added": 1790946074534, "pt": [1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374, 1790948775374]}, {"num": 19, "title": "Petworth", "extra": false, "html": "<p>I had her location on my phone. Every mother I knew did. We had set it up when she got the phone, at twelve, both of us, mine on hers and hers on mine, as you buy a fire extinguisher. In four years I had looked at it twice, both times when she was late from a school trip and the bus had broken down on the highway.</p>\n<p>I looked at it now, in the parking garage, with the engine off.</p>\n<p>It took a moment to load. A map of the city, gray and green, and a small round picture of my daughter's face, the one from her school ID, with the bad bangs she had cut herself in the ninth grade. It was not in the west part of town, where Maddie lived. It was not anywhere near school, or the library, or the coffee place by the metro where she sometimes sat with her friends.</p>\n<p>It was up off Georgia Avenue. In Petworth. On a short street of rowhouses two blocks east of the avenue, between a church and a laundromat.</p>\n<p><em>Go up Georgia. Cut across at Missouri.</em></p>\n<p>I started the car.</p>\n<p class=\"break\">&#10043;</p>\n<p>It took twenty-five minutes, in the traffic. I didn't turn the radio on. I drove up Sixteenth and across and up Georgia, past the hardware store and the Ethiopian place and the new apartment buildings going up where the old ones had been, with the envelope of photographs still on the passenger seat, and the whole way I told myself I was going to be calm. That there would be a reason. A friend I didn't know. A tutor. A boy.</p>\n<p>I knew. I think I had known since the parking garage. I think I had known since the headphones, if I was honest, and I'm honest on paper, and I was trying very hard not to think on paper.</p>\n<p>The street was quiet, with trees just coming into leaf and cars parked tight along both curbs. The rowhouses were brick, two stories, with little iron fences and porches, some painted and some not. The dot on my phone was on the fourth one from the corner on the left. A house with a green door and a porch with two plastic chairs on it.</p>\n<p>Freda was sitting in one of them.</p>\n<p>She had her feet up on the porch rail, and her headphones around her neck, and a can of soda in her hand. She was laughing. The real laugh. I could see it from the car before I could hear it.</p>\n<p>The man in the other chair was tall. Too tall for the chair. He sat with his long legs folded up and his elbows on his knees, as he always used to sit, as if the furniture of the world had been made for somebody smaller and he had stopped complaining about it. He was thinner than I remembered. There was gray at his temples now, and he had a short beard, gray at the chin, that he hadn't had. He was wearing a canvas work jacket with the name of the hardware store on Georgia Avenue stitched over the pocket.</p>\n<p>He was listening to her. He wasn't talking. He was just listening, with his head a little on one side, the way you listen to somebody when you've been waiting a long time to be allowed to.</p>\n<p>I had not seen Desmond Barnett in nine years.</p>\n<p class=\"break\">&#10043;</p>\n<p>I pulled into a space across the street, between a pickup and a minivan, and turned off the engine, and sat there.</p>\n<p>I could have driven away. I want to be honest about that. For about a minute, I could have. I could have gone home and made dinner and waited until seven and let her come in and say <em>hi, I was at Maddie's,</em> and said <em>how's Maddie,</em> and kept it, as I had kept so many things, until I knew exactly what I wanted to do with it.</p>\n<p>Then Freda turned her head, laughing at something, and looked across the street, and saw my car.</p>\n<p>I watched it go out of her. All of it. The laugh, and the color, and the ease, gone out of her face in one second, like water out of a sink. She took her feet off the rail. She put the can down on the porch floor. She didn't get up.</p>\n<p>Desmond saw her face, and turned, and followed her eyes, and saw me through the windshield.</p>\n<p>He stood up.</p>\n<p class=\"break\">&#10043;</p>\n<p>I got out of the car. I crossed the street. I didn't hurry. I stopped at the bottom of the porch steps, on the sidewalk, outside the little iron gate, and didn't open it.</p>\n<p>\"Iola,\" he said.</p>\n<p>\"Get in the car, Freda.\"</p>\n<p>\"Mom...\"</p>\n<p>\"Get in the car.\"</p>\n<p>\"Iola, please. This isn't her fault. I asked her...\"</p>\n<p>\"I know you did,\" I said. I didn't look at him. I looked at my daughter. \"I'm not talking to you, Desmond. I'm talking to my daughter. Freda. Get your things and get in the car.\"</p>\n<p>Freda looked at him. She looked at me. She picked up her bag from beside the chair, very slowly, and put her headphones in it. The white ones.</p>\n<p>\"Those are nice,\" I said. \"Maddie's sister has very good taste.\"</p>\n<p>She went past me through the gate without looking at me, and across the street, and got into the passenger seat, and shut the door, and sat there looking straight ahead through the windshield.</p>\n<p>Desmond came down one step. He stopped there, when I looked at him.</p>\n<p>\"She found me,\" he said quietly. \"In September. I want you to know that. I didn't...\"</p>\n<p>\"I don't want to know anything,\" I said. \"Not today. Not standing on your sidewalk.\" I heard my own voice. It was perfectly level. I sounded, I thought, like somebody's lawyer. \"If you want to talk to me, Desmond, you can call me. You've had my number for nine years.\"</p>\n<p>I turned around and walked back across the street.</p>\n<p class=\"break\">&#10043;</p>\n<p>Neither of us said anything for the first ten minutes. I drove down Georgia in the evening traffic with the photographs on the dashboard, where I'd moved them, and Freda in the passenger seat with her bag on her knees and her feet flat on the floor.</p>\n<p>At a red light by the old theater she said, very quietly, to the window, \"You'd have said no.\"</p>\n<p>\"You don't know that.\"</p>\n<p>\"Yes, I do.\" She turned around. Her face was red and wet and furious. \"You'd have said no. You'd have said he was a drunk and he left and he sent a card in March and he'd do it again. You'd have said all of it. You'd have been <em>right.</em>\" She wiped her face with the heel of her hand. \"And then I'd never have known him. Ever. Not even once.\"</p>\n<p>\"So you lied to me.\"</p>\n<p>\"Yes.\"</p>\n<p>\"For seven months.\"</p>\n<p>\"Since September,\" said Freda. \"Yes.\"</p>\n<p>September. Before the letter. Before Thursdays, and the old man, and 1865. I thought of a night in the fall, the electric bill in red on top of the pile, and Freda on the phone through the wall, laughing the low careful laugh she saved for friends, and the door in her that had stayed shut, and how I had told myself I would find out what was behind it.</p>\n<p>The light changed. I drove.</p>\n<p>\"I check everything,\" I said. \"Everything. It's the only thing I've ever been good at. I checked the lab. I checked the scale. I checked a dead man's cat and a dead man's movers and an old woman's notebooks. I checked the Library of Congress.\" I heard my voice crack, and stopped it. \"And I never once checked you.\"</p>\n<p>\"I know,\" said Freda. \"Because you trusted me.\" She was crying again, quietly, looking straight ahead. \"I knew you did. And I used it. I know I did. I'm sorry. I'm not sorry I found him, but I'm sorry about that.\" She took a breath. \"And it wasn't just me. Mr. Hale knew.\"</p>\n<p>I nearly missed the turn.</p>\n<p>\"What?\"</p>\n<p>\"At spring break. When you went out on the porch for the phone call.\" Freda wiped her nose on the back of her hand. \"He knew. He didn't even do the thing. He just looked at me for like one minute, and I could tell he knew. So I told him. All of it.\" She swallowed. \"He didn't tell me what to do. He just said I had to tell you. That it wasn't his to tell, but it was mine, and the longer I waited, the more it'd cost. Things you keep back don't get lighter, they get heavier, and somebody else ends up carrying them for you.\" Her voice wobbled. \"He said it'd be me, carrying it. And then you, when you found out. And then him, a little, for knowing.\"</p>\n<p>I thought of the kitchen window. Freda's elbows on the table, her hands around her mug, talking fast. Her hand coming up to her eye. A sentence from him, perhaps two. A small wet laugh.</p>\n<p><em>I'm talking about a notebook.</em></p>\n<p>And on the porch, holding my plate: <em>We were talking about Bertie. His sisters.</em></p>\n<p>And on Thursday, in the living room, with the recorders running between us, while Freda made the tea: <em>She's a good girl, Ms. Barnett.</em> And holding my eyes a moment longer than he needed to.</p>\n<p>\"He knew,\" I said. \"Since Thursday.\"</p>\n<p>\"Mom, he said it wasn't his to tell.\"</p>\n<p>\"I know what he said.\"</p>\n<p>I drove the rest of the way home without saying anything else. When we got there, Freda went to her room and shut the door. It didn't slam. She shut it very quietly, which was worse.</p>\n<p>I sat in the kitchen with the envelope of photographs in front of me, unopened again, and my phone face up beside it, and I didn't make dinner. At nine o'clock the phone lit up with a number I didn't know, with a local exchange, and I watched it ring, and let it go.</p>\n<p>At ten past nine it lit up again with a text, from the same number.</p>\n<p><em>It's Dez. I'm sorry. I'll wait as long as you need. She's the best thing I ever had any part of, and I know whose doing that was. D.</em></p>\n<p>D.</p>\n<p>I turned the phone face down on the table, the way my daughter did, and sat there in the kitchen until the light under her door went out.</p>", "audio": false, "added": 1790946372184, "pt": [1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790948775374, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184]}, {"num": 20, "title": "You Knew", "extra": false, "html": "<p>I didn't wear the coat.</p>\n<p>It was hanging on the back of the kitchen chair where it had hung every Thursday since March, and I walked past it on the way out of the door and took my old rain jacket off the hook instead, the thin blue one with the broken zipper, and I knew exactly what I was doing and did it anyway.</p>\n<p>Freda had left for school without breakfast. We had said perhaps forty words to each other since Monday, most of them about whether there was milk. She had typed nothing. Last Thursday's tape, the governess and the pages in the wake, the one she had sat on the stairs for, was sitting untouched on her laptop. I had not asked her to do it. She had not offered.</p>\n<p>It was a bright, hard, cold morning, the kind April throws in once to remind you it can. The fields past Frederick were green now, properly green, and the trees along the road had leaves you could see from a distance. I didn't look at any of it. I drove with both hands on the wheel and the radio off and went over, the whole way, what I was going to say.</p>\n<p>I had it word for word by the state line. I had been a reporter. I knew how to go into a room.</p>\n<p class=\"break\">&#10043;</p>\n<p>He was at the window. He was always at the window.</p>\n<p>He came out onto the porch as I pulled up, and stopped at the top of the steps instead of coming down, and I saw him look at my face through the windshield, and then at the blue jacket, and I saw him understand both. He stood very still with one hand on the rail.</p>\n<p>I got out of the car and shut the door and stood at the bottom of the steps.</p>\n<p>\"You knew,\" I said.</p>\n<p>It wasn't what I had planned to say. I had planned something much longer.</p>\n<p>\"Yes,\" he said.</p>\n<p>\"For a week.\"</p>\n<p>\"Yes.\"</p>\n<p>\"She told you. At your kitchen table. While I was on the porch. And you sat there, and I came in, and you looked me in the eye and told me you were talking about Bertie's <em>sisters.</em>\"</p>\n<p>\"Yes.\"</p>\n<p>\"And an hour later. <em>She's a good girl, Ms. Barnett.</em>\" I heard my voice rising and let it. \"You sat there with the recorders going, while she was in your kitchen making the tea, and said that to my face. And in March you folded a dish towel, when I told you she knew her way round Georgia Avenue. You folded a dish towel. I watched you do it. You knew then, too, didn't you? Before she ever told you.\"</p>\n<p>He didn't answer that at once.</p>\n<p>\"I thought it,\" he said. \"In March. I didn't know.\"</p>\n<p>\"But you thought it.\"</p>\n<p>\"Yes.\"</p>\n<p>\"And you didn't say one word.\"</p>\n<p>\"No,\" he said. \"It wasn't mine to say.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>We had it out in the kitchen. I don't remember going in. I remember standing by the counter with my bag still on my shoulder, and him by the stove, with the kettle on behind him because he had put it on before I came, as he always did, and neither of us touching it.</p>\n<p>\"I'm her mother,\" I said.</p>\n<p>\"Yes.\"</p>\n<p>\"She's sixteen. She was lying to me. Every week. For seven months. Getting on buses to the other side of the city to sit on a porch with a man who walked out on her when she was seven and sent her a birthday card two months late the year her mother lost everything. And you knew, and you let her.\"</p>\n<p>\"I didn't let her do anything, Ms. Barnett. She'd been doing it since September.\"</p>\n<p>\"You let her go on.\"</p>\n<p>\"I told her to tell you.\"</p>\n<p>\"You should have told me <em>yourself.</em>\"</p>\n<p>He was quiet for a moment.</p>\n<p>\"If I had,\" he said, \"you'd have found out from me. Not from her. And she'd have known I told you. She'd have sat at my kitchen table and told me the thing she couldn't tell anyone, and watched me pick up the telephone. And she'd never have told anyone anything again, Ms. Barnett. Not you. Not me. Not anyone, for a very long time.\" He didn't raise his voice. \"It was hers. It wasn't your story, and it wasn't mine. It was hers. The only thing I could do with it was give it back to her and ask her to carry it to you before it got too heavy.\"</p>\n<p>\"And if she hadn't?\"</p>\n<p>\"Then I'd have had to decide,\" he said. \"And I'd have been wrong, whichever I chose. I've had a great deal of practice at that.\"</p>\n<p>\"You decided anyway. You decided something about my daughter without asking me.\" I put my bag down on the counter, hard. \"You don't get to do that. You don't get to know things about her that I don't. You've known her for one morning.\"</p>\n<p>\"Yes.\"</p>\n<p>\"You're a man who pretends to be other people for a living.\"</p>\n<p>I heard it go across the kitchen and land on him. I saw it land. His face didn't change, very much. Something behind it did.</p>\n<p>He didn't say anything. He turned around and took the kettle off the stove, because it had started to whistle, and stood holding it for a moment, as if he had forgotten what it was for.</p>\n<p>I didn't take it back. I stood there and didn't take it back, and I was glad, for about a minute, that I'd said it.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"How is she?\" he said at last, quietly, with his back to me.</p>\n<p>\"You don't get to ask that.\"</p>\n<p>He set the kettle down.</p>\n<p>\"No,\" he said. \"I suppose I don't.\"</p>\n<p>He made the tea anyway. He made it as he always did, the pot warmed first, the cover on, the two cups, and he carried the tray through to the living room and put it down on the little table, and sat down in his chair, and picked up the notepad. I followed him in, because I didn't know what else to do, and because I was being paid six thousand dollars, and because I could not bear to drive away.</p>\n<p>I set out the recorders. I pressed the buttons. I said the date into them, and the time, and <em>Session twenty-six,</em> and nothing else.</p>\n<p>I didn't ask him how his week had been. He didn't ask about mine.</p>\n<p>\"Thursday night,\" I said. \"Pier 54. You stopped on the ship coming into the harbor. Tell me about the pier.\"</p>\n<p>He looked at me for a moment across the little table. He looked older, I thought, than he had looked a week ago. Older than he had looked all winter. There was a gray in his face under the weathering that I had not seen before, and his hands, on the notepad, were very still.</p>\n<p>I noticed it. I didn't care, that morning. I'm telling you that because it's true.</p>\n<p>\"The pier,\" he said.</p>\n<p>He looked down at the notepad, and didn't draw. He didn't draw for the whole of that session. It was the only time, in all the Thursdays, that he didn't. Freda told me that, later, when she typed it. She said the tape was the quietest one she had ever heard. No pencil. No humming. Only his voice, and the woodstove, and sometimes a long time when there was nothing at all.</p>\n<p>\"It was raining,\" he said. \"In New York. That's the first thing.\"</p>", "audio": false, "added": 1790946372184, "pt": [1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790948775374, 1790946372184, 1790946372184, 1790946372184, 1790948775374, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790948775374, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790948775374, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184]}, {"num": 21, "title": "Pier 54", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 18, 1912, night</em></p>\n<p class=\"tape\">It was raining in New York. A cold, hard, driving rain, coming in off the harbor sideways, the kind that finds the gap between your collar and your neck however you stand.</p>\n<p class=\"tape\">I wasn't supposed to be on deck. A boy who has been discharged is nobody's business, and nobody's bell boy, and Lyle had told me to stay in the cabin with my bag and keep out from under people's feet until I was sent for in the morning. I stayed there until we passed the lightship. Then I went up. Nobody stopped me. Everybody on that ship who could stand was at a rail.</p>\n<p class=\"tape\">We came in through the Narrows in the dark, very slowly. And the harbor was full of boats.</p>\n<p class=\"tape\">Tugs, mostly. Dozens of them. Little steam tugs and launches and ferries, crowded right up against our sides, with their lamps lit and their whistles going, and every one of them packed with men in coats and hats, standing on the decks and the cabin roofs in the rain, shouting. Newspapermen. Every paper in New York had hired something that floated. They had megaphones, and they were shouting up at our rails through them, at anybody, at the passengers, at the crew, at the faces looking down.</p>\n<p class=\"tape\"><em>Were you on the Titanic? Is Astor alive? Did you see her go down? Fifty dollars for your story! A hundred! Jump down to us! We'll take you off!</em></p>\n<p class=\"tape\">And in among the shouting there were flashes. White, sudden, blinding. Photographers on the tugs with flash powder, firing up at us in the rain, so that every few seconds the whole side of the ship and every face along the rail jumped out of the dark, white and staring, and then fell back into it.</p>\n<p class=\"tape\">The captain wouldn't let one of them aboard. Not one. He had said so on the wireless, all day, and he meant it. The tugs came alongside, and the men on them shouted and waved money and tried to throw lines up, and our seamen stood at the rails and threw the lines back. We went on up the river through all of it, very slowly, with the tugs following us like gulls after a trawler.</p>\n<p class=\"tape\">I thought of Mr. Hatch. I couldn't help it. <em>In New York they'll all have a story.</em> There they were. Every newspaper in the world, in the rain, shouting for exactly what he'd had in his notebook. And he was lying under a sheet in a cabin on C deck, and his notebook was ash in the stokehold, and his five pages were at the bottom of the Atlantic, and nobody on any of those tugs would ever know his name.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">We didn't go to our own pier first. We went past it, up the river, to the White Star pier, where the Titanic should have come in on Wednesday morning.</p>\n<p class=\"tape\">And there, in the rain, under the lights, with ten thousand people watching from the pier and the street behind it in silence, they lowered the Titanic's boats.</p>\n<p class=\"tape\">They'd been hanging on our davits and stowed on our decks since Monday morning, all the ones we had been able to take aboard. Now our seamen swung them out, one after another, and lowered them down into the black water, empty. And men from the pier rowed them away, one after another, into the dark under the White Star shed, and they were gone.</p>\n<p class=\"tape\">The survivors watched from the rails. Nobody said anything. It was the quietest I ever heard that ship, in all the time I was aboard her. Fourteen hundred people at the rails, and the rain, and the creak of the falls, and the oars.</p>\n<p class=\"tape\">I was standing by the after deckhouse. A little way along the rail from me, I saw the young woman in the dark coat. She had the little boy on her hip, asleep, under her coat, out of the rain. She was watching the boats go down.</p>\n<p class=\"tape\">She watched one boat more carefully than the others. I saw her. As it went down past us on its falls, and touched the water, and swung there empty, and the man from the pier took up the oars and began to pull it away into the dark, she watched it all the way, until it went under the shed, and was gone.</p>\n<p class=\"tape\">I knew which boat. So did she. I won't tell you the number, Ms. Barnett. I said I wouldn't.</p>\n<p class=\"tape\">She didn't look at me.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Then we went back down the river to Pier 54, the Cunard pier, our own, and the gangway went down, and they began to go ashore.</p>\n<p class=\"tape\">You have seen the pictures, perhaps. Everybody has. They don't show it. The pier was a great long shed, lit up inside like a railway station, and it was packed, wall to wall, with people. Thirty thousand, the papers said the next day, or forty, in the shed and outside it and all along the street, in the rain. Families. Friends. Reporters. Doctors, and nurses, and ambulances backed up to the street door, and priests, and the police holding the crowds back with ropes. And the silence. When the first of them came down the gangway, the noise in that shed just stopped, all of it, and thirty thousand people stood under the lights in the rain and didn't make a sound.</p>\n<p class=\"tape\">Then somebody saw somebody, and screamed a name, and it broke, and after that it was all noise.</p>\n<p class=\"tape\">First class came off first. That was how it was done.</p>\n<p class=\"tape\">And among the first of them, in his good gray suit and his good gray hat and his shined black shoes, with his wrapped hand in his pocket and the bruise on his jaw gone yellow at the edges, was Mr. Ainsley.</p>\n<p class=\"tape\">He came down the gangway into the light, and the flashes went off all around him, white, white, white, and from the crowd behind the ropes a woman cried out his name, and he turned, and lifted his good hand, and smiled. A woman in furs came through the ropes, with two girls behind her, young ladies, his daughters, and the police let them through, because of who he was, and they ran to him and he held them, all three, there at the bottom of the gangway, under the lights, with the rain coming in under the roof of the shed. He held them a long time. I watched him do it. He held them well. He was a man who knew how to do that sort of thing so that people saw it, and he did it, and they saw it.</p>\n<p class=\"tape\">Then the reporters had him. They pushed in through the police with their notebooks, a dozen of them, shouting his name, and he let them. He stood with one arm round his wife and talked to them, in the flashes, in his warm, easy, carrying voice. I couldn't hear the words from the rail. I didn't need to. I read them the next morning, in four different papers.</p>\n<p class=\"tape\">How calm it had been. How orderly. How the men had stood back. How in his boat they had done everything they could, and kept up the ladies' spirits, and nobody had been turned away.</p>\n<p class=\"tape\">And at the end, one of the reporters said something, and he laughed. The big laugh. Right there at the bottom of the gangway, with his arm around his wife. And the reporters laughed with him.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He lived another thirty-one years.</p>\n<p class=\"tape\">I know because I read his obituary. He died in his own bed, in a big house, in 1943, with his daughters beside him. The obituary was half a column long, with a photograph. It listed his boards, and his clubs, and his charities, and his grandchildren. Near the end, it said that he had survived the sinking of the Titanic, and that in his lifeboat on that terrible night he had taken his turn at the tiller and kept up the courage of the women and children in his care.</p>\n<p class=\"tape\">I've read it a great many times, Ms. Barnett. I kept it. I've kept it in every life since. It's in a box upstairs.</p>\n<p class=\"tape\">Mr. Hatch's notice was three lines. I never looked for it. You found it for me.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They carried Mr. Hatch off at about eleven, after most of the living had gone. Two stewards, with a stretcher, under a sheet, down the crew gangway at the far end where the crowd had thinned. Nobody was waiting for him. There was a hearse from the company at the street door, and a man from the coroner's office with a clipboard who signed something, and that was all. His sister was in Ohio. She would hear by telegram, I supposed, in the morning, and not know who to ask about anything.</p>\n<p class=\"tape\">I stood at the rail and watched him go all the way to the street door. I don't think anybody else on that ship was watching.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">She came down the gangway late. Most of second class had gone. She had the little boy on her hip still, asleep, and the girl by the hand, in her blanket coat, and the mother on the other side of her on the arm of a stewardess, walking very slowly, like an old woman, though she couldn't have been thirty-five. There was somebody waiting for them behind the ropes. An older couple, gray, the grandparents perhaps, who came forward with their arms out and their faces breaking. I saw the mother see them and stop on the gangway and put her hands over her face.</p>\n<p class=\"tape\">The young woman stopped too, a step behind, to let them have it.</p>\n<p class=\"tape\">And while she stood there, she turned her head and looked up. Along the side of the ship, along the rail, at all the faces still looking down. Quick and complete, as she always did. Until she found mine.</p>\n<p class=\"tape\">She looked at me for a long moment, up through the rain, from the gangway. I looked back.</p>\n<p class=\"tape\">Then she said something. I couldn't hear it. The shed was full of noise, and the rain was loud on the roof. I saw her lips move. I've thought about it since, for a very long time, and I've never been sure. I think it was a name. I think she was telling me her name.</p>\n<p class=\"tape\">Later, on the pier, on the Friday morning, when they put me ashore, a stewardess I didn't know came and found me where I was sitting on my bag by the street door, and gave me an envelope, and said a lady had left it with the purser for the bell boy Pike. There was nothing in it but two shillings, wrapped in a half sheet of paper. On the paper, in a clear, quick, educated hand, it said, <em>For Stan, with apologies. E. P.</em></p>\n<p class=\"tape\">Eleanor Penhallow. That's what I've called her ever since. That's what I said I'd tell you, when it mattered.</p>\n<p class=\"tape\">I looked for that name, afterward, for years. On every list. The Titanic's, and the Carpathia's, and the purser's, and the inquiry's, and the newspapers'. There was no Penhallow on any of them. She had given the purser a different name at the gangway on the Monday morning, and that one is on the lists, and I'm not going to tell you what it was.</p>\n<p class=\"tape\">I gave Stan his two shillings. He cried, a little. He gave me back one.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The last I saw of her, she was going away through the crowd toward the street door, with the little boy asleep on her shoulder and the girl holding her coat, behind the mother and the grandparents. The crowd closed round them. Just before it did, she turned her head, once, and looked back up at the ship. Not at me. At all of it.</p>\n<p class=\"tape\">I could see her lips moving. She wasn't speaking.</p>\n<p class=\"tape\">She was humming.</p>\n<p class=\"tape\">I couldn't hear it. I didn't need to. I knew what it was.</p>\n<p class=\"tape\">Neither of us waved.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>He had not drawn once, all morning. The notepad was on his knee, and the pencil on the notepad, and his hands were folded on top of them both, quite still.</p>\n<p>\"That's the end of the Carpathia,\" he said.</p>\n<p>I didn't say anything. I reached out and turned off the recorders.</p>\n<p>\"What happened to him?\" I said. \"To Bertie. After. A boy of twelve on a pier in New York, with no reference and a bag.\"</p>\n<p>\"He made the best of it,\" he said. \"That's another Thursday.\"</p>\n<p>I stood up. I picked up the recorders and put them in my bag. I didn't stay for lunch. He didn't offer it. He got up when I did, and went ahead of me to the door, and held it open, and stood on the porch in his cardigan in the cold bright noon while I went down the steps.</p>\n<p>At the bottom I heard him say, \"Ms. Barnett.\"</p>\n<p>I stopped. I didn't turn around.</p>\n<p>\"Tell her...\" he said, and stopped.</p>\n<p>\"No,\" I said.</p>\n<p>I got into the car. When I backed it round in the gravel to go, he was still on the porch, with one hand on the rail, looking at me. I didn't wave.</p>\n<p>In the mirror, at the end of the gravel road, he was still there.</p>", "audio": false, "added": 1790946372184, "pt": [1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184, 1790946372184]}, {"num": 22, "title": "The End of the Bed", "extra": false, "html": "<p>Freda typed the pier on Sunday night.</p>\n<p>I didn't ask her to. I had not asked her to do anything since Monday. On Saturday the laptop was still closed on the kitchen table where she'd left it, and on Sunday afternoon it was still closed, and I didn't touch it, and I didn't say anything. And at about eight o'clock on Sunday night I came into the kitchen for a glass of water and she was sitting there with the headphones on and the recorder file open on the screen, typing.</p>\n<p>I got my water and went back to my room. I didn't say anything then, either.</p>\n<p>I could hear her, through the wall, for a long time. Not the words. Only the keys, very fast, and then stopping, and then the little click of the trackpad when she went back to listen again. Then fast again. Then stopping. Then, for a while, nothing at all.</p>\n<p>I was in bed with a book I wasn't reading when the door opened, a little before midnight.</p>\n<p>She didn't knock. She hadn't knocked on my door since she was nine. She stood in the doorway in her pajamas and one of my old sweaters with her arms wrapped around herself, and her face was blotched, and she didn't come in.</p>\n<p>\"I finished it,\" she said.</p>\n<p>\"Okay.\"</p>\n<p>\"The pier.\" Her voice was thick. \"The boy with the bag. Nobody came for him. Everybody else had somebody, behind the ropes, and he just sat on his bag by the door in the rain. Twelve. By himself. In New York.\"</p>\n<p>\"I know.\"</p>\n<p>\"And Mr. Ainsley had his whole family.\" She swallowed. \"And everybody laughed.\"</p>\n<p>\"I know, honey.\"</p>\n<p>She stood in the doorway a moment longer. Then she came in, and sat down on the end of my bed, at the very end, on top of the covers, with her back against the footboard and her knees drawn up, the way she used to sit when she was small and had a bad dream and didn't want to admit it was a bad dream.</p>\n<p>\"I'm going to tell you all of it,\" she said. \"Okay? The parts you didn't find.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>\"It was me,\" she said. \"First. Not him.\"</p>\n<p>I didn't say anything.</p>\n<p>\"In September. Before the letter came. You were out, and I was looking for my birth certificate for the driving thing at school, and it was in your box in the closet, the one with all my stuff. The baby teeth and the drawings.\" She looked at her knees. \"And the card was in there. The one from Phoenix. The one that came in March.\"</p>\n<p>I had kept it. Of course I had. I keep everything.</p>\n<p>\"It had a return address,\" said Freda. \"So I looked him up. That's all. I just looked him up, like you would. And he wasn't in Phoenix anymore. He was here. He'd been back in DC for like a year. He was on the website for the hardware store on Georgia, in one of those staff pictures, in the apron. <em>Dez, plumbing and electrical.</em>\" She almost laughed. \"He's really good at plumbing, apparently.\"</p>\n<p>\"He always was.\"</p>\n<p>\"So I called the store. And asked for him. And he came to the phone, and I said, <em>it's Freda,</em> and he didn't say anything for like ten seconds.\" She pulled the sleeves of the sweater down over her hands. \"And then he hung up.\"</p>\n<p>I sat up a little.</p>\n<p>\"He hung up on me, Mom. I was so mad. I sat on my bed and cried for an hour.\" She shook her head. \"And then a week later he called back. From his own phone. And he said he was sorry, he'd panicked, he didn't think he had any right to talk to me. He said he'd been sober two years and three months, and he'd started over, and he'd thought about calling me every day for two years, and every day he decided I was better off. And then I called him.\" She looked up at me. \"And he said, <em>Okay. Then I guess I don't get to decide that anymore.</em>\"</p>\n<p>That was the phone call, in the fall. That was the low, careful laugh through the wall, the night the electric bill was red. That was the door in her that had stayed shut.</p>\n<p>\"And in October,\" said Freda, \"the day he gave me his real number. I wrote it in the margin of my chem worksheet. Really carefully. Because I was scared I'd lose my phone and never find it again.\" She almost smiled. \"You saw me do it. At the table. You looked right at me.\"</p>\n<p>I had. I remembered it. She had read a text and her face had gone still and shut, and she had written something very carefully in the margin, and I had decided it was about Maddie, and the lab, and the kids who were being cruel to her. I had been right about the kids. I had been wrong about the margin.</p>\n<p>\"Why didn't you tell me,\" I said. \"Then. In October. When you knew he was real.\"</p>\n<p>\"Because he asked me not to.\" She held up a hand before I could say anything. \"Not like that. Not like <em>don't tell your mother.</em> He said...\" She stopped, and got it right. \"He said you'd been carrying everything by yourself for nine years. Me, and the house, and the money, and the story, and losing your job. All of it. He said he'd put most of it on you, by leaving. And he wasn't going to hand you one more thing to carry until he could carry his own. Until he had a real job that lasted, and his own place, and he'd been sober long enough that you'd believe it.\" She wiped her face with her sleeve. \"He said when he could walk up to the door himself, he would. And I said okay. Because I wanted it. I wanted to have him for a while, by myself, before it got complicated.\"</p>\n<p>\"It was always going to be complicated.\"</p>\n<p>\"I know.\" She looked at her knees again. \"I know that now.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>\"When I asked you,\" she said after a while, quietly. \"In the kitchen. If people can tell when they've made a difference to somebody.\"</p>\n<p>\"I remember.\"</p>\n<p>\"He told me I did. Made a difference. To him.\" She pulled at a thread on the sweater. \"He said when I called, he'd been thinking about drinking again. For the first time in like a year. Just that week. He'd had a bad week at work and he was standing outside a liquor store on Kennedy Street and he got the call from the store manager saying some girl named Freda had called asking for him.\" She laughed, a small wet sound. \"He said he went back to work instead. And he hasn't been back to that store since.\"</p>\n<p>I couldn't say anything for a moment.</p>\n<p>\"I didn't know if that was true,\" Freda said. \"Or if he just said it. Like, to make me feel good. You can't check something like that.\"</p>\n<p>\"No,\" I said. \"You can't.\"</p>\n<p>\"Mr. Hale said that's the worst kind. The kind you can't check.\" She looked at me. \"He said that about the cocoa, too. Didn't he. That's the same thing. He never knew if he made a difference. And Dad says I did, and I'll never know either.\"</p>\n<p>\"Sometimes,\" I said, \"you just have to decide whether to believe somebody.\"</p>\n<p>Freda looked at me for a long t
