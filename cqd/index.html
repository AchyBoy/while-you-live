<script>
const BUILD = 1790941967366;
const AUDIO_V = "";
const ROUND = 0;  // only paragraphs changed at or after this build are boxed
const BOOK = {"series": "While You Live", "title": "CQD", "number": 2, "author": "Andrew F. Young"};
const CHAPTERS = [{"num": 1, "title": "The Neighbor", "extra": false, "html": "<p>The coat was at the back of the hall closet, behind Freda's old soccer bag and a vacuum cleaner that had not worked since the fall.</p>\n<p>It was a good coat. Long, dark green wool, with a hood that folded away into the collar and pockets deep enough for two notebooks and a recorder. I had bought it the winter I started working on the Carrow House story, because I was going to be standing in a lot of parking lots, and I had worn it every day until the story ran. After that I had hung it up and not taken it down again. I had not been going anywhere that needed it.</p>\n<p><em>Bring a warmer coat,</em> he had said.</p>\n<p>I took it off the hanger and held it up to the light in the hall. There was a moth hole in one sleeve and a button hanging by a thread, and it smelled of the closet. I put it on anyway, over my sweatshirt, and stood in front of the mirror on the bathroom door. A woman of forty-four in a coat she had bought at thirty-eight, looking about as surprised as you would expect.</p>\n<p>It still fit. I was not sure how I felt about that.</p>\n<p class=\"break\">&#10043;</p>\n<p>If you do not know me, here is how I came to be standing in a hall closet on a Sunday night, thinking about the North Atlantic.</p>\n<p>My name is Iola Barnett. I used to be a reporter. Six years ago I broke a story about forged letters being sold as genuine at Carrow House, the old auction house downtown, and three days after it ran, the man who had given me the story disappeared. Without him, nobody believed a word of it. The paper printed a correction and let me go. Since then I have written whatever people pay me to write: gutter guards, dentists, houses that need to sound bigger than they are.</p>\n<p>Last fall a law firm called Aldine, Mercer and Voss wrote to me on behalf of a client who would not give his name. The client wanted me to drive two hours north every Thursday and record the memories of an old man who lived alone in a small house full of books. He paid three thousand dollars a session, more than I had made in a month in years. The old man's name, as far as anybody knew, was Tom Hale. He was somewhere in his seventies. He told me, on the first day, that he remembered 1865.</p>\n<p>He did not mean that he had read about it. He meant that he had been there. That he had woken up one July afternoon in 1864 in the body of a wounded Confederate soldier outside Washington, and had lived in that body for a year, and had been in the city the night Lincoln was shot. He said it had happened to him a great many times, in a great many places. He said he did not know why.</p>\n<p>I did not believe him. I want to be clear about that. I spent eighteen Thursdays not believing him, and checking everything he said, and finding that everything he said checked out. In the end I went to the Library of Congress and found a letter in a box nobody had asked for in twenty-two years. It said what he had said it would say, in a hand he had never seen. I had a copy of it in a folder in my bag. I had meant to show it to him last Thursday, and I had not, because of the card.</p>\n<p>The card had come by courier on a Monday night, in the client's own hand. That hand had started to shake. There was one line on it.</p>\n<p><em>Please ask him about the Carpathia.</em></p>\n<p>The Carpathia was the ship that picked up the survivors of the Titanic, in April of 1912. In eighteen weeks he had never said a word about it to me, and I had the transcripts to prove it. When I read him the card he sat for forty seconds without moving, which I know because I counted. Then he said he had never told a living soul where he was in April of 1912. Then he said yes. He had been there.</p>\n<p>And then he told me to bring a warmer coat.</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda was at the kitchen table when I came back through, with her laptop open and a pair of big white headphones on, typing.</p>\n<p>She was sixteen. She had her father's height and, lately, a habit of looking up at me as if I had walked into the wrong room. She had started typing my transcripts that week. It had been her idea. Ever since the night I told her about the letter in the archive, she had been asking about him, and on Friday she had heard me complain that it took me three hours to type up every hour of tape, and she had said, without looking up from her phone, that she could do it in two, and that she would do it for fifteen dollars an hour, and that I should think about it. I had thought about it for about a minute. It was the best deal anyone had offered me in six years, and it kept her at the kitchen table on a Sunday night, where I could see her.</p>\n<p>She was doing last Thursday's tape. Her first one, the Carpathia tape. It was a short one. Most of it was snow.</p>\n<p>I put the kettle on and watched her. She typed fast and very straight, with her shoulders up around her ears. Every so often she stopped, and pressed one finger to the headphones, and went back a few seconds, and listened again.</p>\n<p>They were new, the headphones. I noticed it the way you notice a new picture on a friend's wall. Big and white and soft at the ears, the kind that closed out the world. The old ones had been a pair of my earbuds with one side that only worked if you held the wire at an angle.</p>\n<p>\"Those are nice,\" I said.</p>\n<p>She took one side off. \"What?\"</p>\n<p>\"The headphones.\"</p>\n<p>\"Oh.\" She looked at them as if she had forgotten they were on her head. \"Maddie's sister was getting rid of them. She got new ones.\"</p>\n<p>\"That was nice of her.\"</p>\n<p>\"She's nice.\" Freda put the side back on, and then took it off again. \"He sounds really different on this one.\"</p>\n<p>\"Who does?\"</p>\n<p>\"Him. Mr. Hale.\" She turned the laptop so I could see the screen, though there was nothing on it but the words. \"On the bits you play me, he talks like he's reading you a book. He's never in a hurry. On this one he's like...\" She looked for it. \"He's like somebody who just found out his house got broken into.\"</p>\n<p>I had been in the room. I had not thought of it like that. I had thought he sounded frightened, and I had not let myself write the word down.</p>\n<p>\"He was surprised,\" I said.</p>\n<p>\"He's never surprised. That's his whole thing.\" She pulled the laptop back. \"Who's the client, really?\"</p>\n<p>\"I don't know.\"</p>\n<p>\"You must have some idea.\"</p>\n<p>\"I've got lots of ideas. None of them are any good.\"</p>\n<p>\"Somebody who knows about the boat,\" Freda said, \"when nobody's supposed to know about the boat.\" She put the headphones back on. \"So it's either somebody he told and forgot he told, or somebody who was on the boat.\"</p>\n<p>\"Nobody who was on that boat is still alive.\"</p>\n<p>Freda typed for a moment.</p>\n<p>\"Nobody who was at Ford's Theatre is still alive either,\" she said, without looking up. \"And you're still driving up there.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>That night, after she had gone to bed, I sat at the kitchen table with the coat on the back of my chair and did what I had been putting off all week.</p>\n<p>I opened the transcript from the sixth week. Not the Lincoln parts. The lunch.</p>\n<p>It was the day he had made the soup, back in the fall, and asked me about myself, and I had told him the whole Carrow House story, badly and out of order. I had typed it up that night the same as everything else, because the client wanted all of it. I had never read it back. I did not like reading my own voice telling that story. It sounded like every crank who had ever called a newsroom.</p>\n<p>I read it back now, slowly, with a pencil.</p>\n<p>The diner. The grilled cheese and the tomato soup he always ordered and never ate. The laundromat. The building where my source lived, a brick walk-up over a dry cleaner's. Petrakis, the landlord, who complained about everything. The steam that came up through the floor in the mornings, so the whole building smelled of hot cotton.</p>\n<p><em>A woman on the second floor called Petrakis about noise so often that he had stopped answering her.</em></p>\n<p>I put the pencil on that line and left it there.</p>\n<p>All winter I had been going over the same few facts, the way you turn over a stone in your pocket until it is smooth. The cat shut in the bedroom, because somebody was at the door. The family photographs still on the wall. The two banker's boxes of papers gone from the closet by the door, and not a word about them in the police report. He had put it together for me, at his kitchen table, a few weeks ago. My source had not run. He had opened his door to somebody he knew. And somebody had left with his papers.</p>\n<p><em>Who was at the door?</em></p>\n<p>I had written that on the back of an envelope the night I drove home, and I had looked at it every day since, and I had not done one useful thing about it. I had decided it had been six years. That the dry cleaner's was a smoothie place now. That Petrakis had sold the building and moved in with his daughter in Silver Spring, and that the police had never cared, and that nobody remembered a knock on a door on a Wednesday morning six years ago.</p>\n<p>But somebody might. A woman who called the landlord so often about noise that he stopped picking up was a woman who listened. She listened through her ceiling, every day, to a building full of other people's lives. She had lived one floor below him. If anyone in the world had heard that door, it was her.</p>\n<p>And I had known she existed for six years. I had made a joke about her at lunch. I had never once asked her name.</p>\n<p class=\"break\">&#10043;</p>\n<p>Petrakis answered on the fourth ring, and I could hear a television behind him, very loud.</p>\n<p>\"The reporter,\" he said, when I told him who it was. He did not sound pleased, but he did not sound displeased either. Petrakis sounded the same about everything. \"You called about the cat.\"</p>\n<p>\"In the fall. Yes. You were a big help.\"</p>\n<p>\"The cat was a good cat.\" He said something away from the phone, in Greek, and the television got quieter. \"What now? I don't own that building anymore. I told you. Smoothies.\"</p>\n<p>\"I'm not calling about the building. I'm calling about one of your tenants. There was a woman on the second floor, when he lived there. She used to call you about the noise.\"</p>\n<p>There was a pause. Then Petrakis laughed, a short, unhappy bark.</p>\n<p>\"Dunleavy.\"</p>\n<p>\"Is that her name?\"</p>\n<p>\"Mrs. Dunleavy. Second floor, front. Thirty years she lived in that building, and for thirty years she called me.\" He was warming up now. I could hear it. \"The radiator. The pipes. The man upstairs walks too heavy. The dry cleaner's machine starts too early. A dog barks on the street, she calls me, like I own the street. Every day. Some days twice. I had to get a second phone.\"</p>\n<p>\"Is she still living?\"</p>\n<p>\"Still living? She will outlive us all. Out of spite.\" He paused. \"She moved when I sold. Before, even. Went to live with her son, out in Frederick somewhere. I don't have the address. I didn't want the address.\"</p>\n<p>\"Do you remember her first name?\"</p>\n<p>\"Why do you want Mrs. Dunleavy?\"</p>\n<p>I thought about how to answer that. Petrakis had been kind to me, in the fall, in his way. He had remembered the cat's name for me after six years, when I could not.</p>\n<p>\"Because she lived right under him,\" I said. \"And I think she heard everything.\"</p>\n<p>The line was quiet for long enough that I thought we had been cut off. Behind him the television murmured. Somebody on it was winning a car.</p>\n<p>\"Eileen,\" Petrakis said. \"Eileen Dunleavy. She was a widow. Her husband drove a bus.\" Then, grudgingly, as if it cost him money to say it: \"She heard everything. That is true. You could not cough in that building with // Narration: one mp3 per chapter (audio/chNN.mp3) + audio/chNN.json, the start time of each paragraph.
// The paragraph being read is highlighted and kept on screen; at the end it carries on into the next chapter.
const player = document.createElement("div");
player.id = "player";
player.innerHTML = `<button id="pBack" aria-label="Back 15 seconds">&#8634;</button><button id="pPlay" aria-label="Play or pause">&#10074;&#10074;</button>
  <button id="pFwd" aria-label="Forward 15 seconds">&#8635;</button><span class="t" id="pTime"></span><button id="pStop" aria-label="Stop">&#10005;</button>`;
document.body.appendChild(player);
const audio = new Audio();
audio.preload = "auto";
let aCh = null, aMarks = [], aNext = null, aFollow = true, lastPara = -1;
const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function paraEls() { return [...main.querySelectorAll(".chapter > p:not(.end)")]; }
function listenHook(c, next) {
  if (aCh !== c.num && !audio.paused) audio.pause();
  if (aCh !== c.num) { player.classList.remove("on"); lastPara = -1; }
  const b = $("listenBtn");
  if (b) b.onclick = () => startListen(c, next);
  if (aCh === c.num) aNext = next;
}
async function startListen(c, next, fromStart) {
  if (aCh !== c.num) {
    aCh = c.num; aNext = next; lastPara = -1;
    const nn = String(c.num).padStart(2, "0");
    try { aMarks = (await (await fetch(`audio/ch${nn}.json?v=${BUILD}`)).json()).paras; } catch (e) { aMarks = []; }
    audio.src = `audio/ch${nn}.mp3?v=${BUILD}`;
    const saved = store.get("listen", null);
    audio.currentTime = !fromStart && saved && saved.ch === c.num ? saved.t : 0;

}
audio.addEventListener("play", () => $("pPlay").innerHTML = "&#10074;&#10074;");
audio.addEventListener("pause", () => $("pPlay").innerHTML = "&#9654;&#xFE0E;");
audio.addEventListener("timeupdate", () => {
  const t = audio.currentTime;
  $("pTime").textContent = `${fmtT(t)} / ${fmtT(audio.duration || 0)}  \u00b7  ${AUDIO_V}`;
  store.set("listen", { ch: aCh, t });
  let i = -1;
  for (let k = 0; k < aMarks.length; k++) if (aMarks[k] <= t + 0.1) i = k; else break;
  if (i === lastPara) return;
  lastPara = i;
  const ps = paraEls();
  ps.forEach(p => p.classList.remove("reading"));
  const p = ps[i];
  if (!p) return;
  p.classList.add("reading");
  if (aFollow) {
    const r = p.getBoundingClientRect();

  }

$("pPlay").onclick = () => audio.paused ? (aFollow = true, audio.play()) : audio.pause();

$("pStop").onclick = () => { audio.pause(); player.classList.remove("on"); paraEls().forEach(p => p.classList.remove("reading")); lastPara = -1; };
// scrolling by hand stops the page from following until play is pressed again
window.addEventListener("touchmove", () => { if (!audio.paused) aFollow = false; }, { passive: true });

// progress, save place, hide bar while reading down

// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
// Book 2 keeps its notes apart from Book 1's: same key, "-cqd" on the end. A reader who opened Book 1 with ?c= is already signed in here.
const CKEY = (() => { let k = store.get("ckey", null); if (!k) { try { k = JSON.parse(localStorage.getItem("wyl.ckey")); } catch {} } return k ? k + "-cqd" : null; })();
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }

}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");

let cmtAt = null;

  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";

    $("cmtStatus").textContent = ""; renderOld();

}
function openCmt(ch, p, text) {
  if (staleV) { showStale(); return; }
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");

$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {

// ---- fixed since you last looked (pencil readers only) ----
// Each paragraph carries the build time its text last changed (c.pt). "seen" is, per chapter,
// the newest change the reader has acknowledged. A chapter they've never opened is NEW.
// "seen" is kept per review round, so starting a round (or moving it back) shows its boxes fresh on every device.
const SEEN_KEY = "seen-" + ROUND;
function seenAt(num) { return store.get(SEEN_KEY, {})[num] || ROUND - 1; }
function setSeen(num, t) { const s = store.get(SEEN_KEY, {}); s[num] = Math.max(s[num] || 0, t); store.set(SEEN_KEY, s); }
function isFix(c, t) { return t >= ROUND && t > Math.max(seenAt(c.num), c.added); }
function fixCount(c) { return c.pt.filter(t => isFix(c, t)).length; }
function isNew(c) { return c.added > seenAt(c.num); }
function badge(c) {
  if (!CKEY) return "";
  if (isNew(c)) return `<span class="tag new">New</span>`;
  const n = fixCount(c);
  return n ? `<span class="tag">${n} fixed</span>` : "";
}
function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">${c.extra ? c.title : "Ch " + c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => isFix(c, c.pt[i]));
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} changed in the latest round of fixes, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}
