<script>
const BUILD = 1790943066980;
const AUDIO_V = "";
const ROUND = 0;  // only paragraphs changed at or after this build are boxed
const BOOK = {"series": "While You Live", "title": "CQD", "number": 2, "author": "Andrew F. Young"};
const CHAPTERS = [{"num": 1, "title": "The Neighbor", "extra": false, "html": "<p>The coat was at the back of the hall closet, behind Freda's old soccer bag and a vacuum cleaner that had not worked since the fall.</p>\n<p>It was a good coat. Long, dark green wool, with a hood that folded away into the collar and pockets deep enough for two notebooks and a recorder. I had bought it the winter I started working on the Carrow House story, because I was going to be standing in a lot of parking lots, and I had worn it every day until the story ran. After that I had hung it up and not taken it down again. I had not been going anywhere that needed it.</p>\n<p><em>Bring a warmer coat,</em> he had said.</p>\n<p>I took it off the hanger and held it up to the light in the hall. There was a moth hole in one sleeve and a button hanging by a thread, and it smelled of the closet. I put it on anyway, over my sweatshirt, and stood in front of the mirror on the bathroom door. A woman of forty-four in a coat she had bought at thirty-eight, looking about as surprised as you would expect.</p>\n<p>It still fit. I was not sure how I felt about that.</p>\n<p class=\"break\">&#10043;</p>\n<p>If you do not know me, here is how I came to be standing in a hall closet on a Sunday night, thinking about the North Atlantic.</p>\n<p>My name is Iola Barnett. I used to be a reporter. Six years ago I broke a story about forged letters being sold as genuine at Carrow House, the old auction house downtown, and three days after it ran, the man who had given me the story disappeared. Without him, nobody believed a word of it. The paper printed a correction and let me go. Since then I have written whatever people pay me to write: gutter guards, dentists, houses that need to sound bigger than they are.</p>\n<p>Last fall a law firm called Aldine, Mercer and Voss wrote to me on behalf of a client who would not give his name. The client wanted me to drive two hours north every Thursday and record the memories of an old man who lived alone in a small house full of books. He paid three thousand dollars a session, more than I had made in a month in years. The old man's name, as far as anybody knew, was Tom Hale. He was somewhere in his seventies. He told me, on the first day, that he remembered 1865.</p>\n<p>He did not mean that he had read about it. He meant that he had been there. That he had woken up one July afternoon in 1864 in the body of a wounded Confederate soldier outside Washington, and had lived in that body for a year, and had been in the city the night Lincoln was shot. He said it had happened to him a great many times, in a great many places. He said he did not know why.</p>\n<p>I did not believe him. I want to be clear about that. I spent eighteen Thursdays not believing him, and checking everything he said, and finding that everything he said checked out. In the end I went to the Library of Congress and found a letter in a box nobody had asked for in twenty-two years. It matched what he had told me, line for line, and he had never seen it. I had a copy of it in a folder in my bag. I had meant to show it to him last Thursday, and I had not, because of the card.</p>\n<p>The card had come by courier on a Monday night, in the client's own hand. That hand had started to shake. There was one line on it.</p>\n<p><em>Please ask him about the Carpathia.</em></p>\n<p>The Carpathia was the ship that picked up the survivors of the Titanic, in April of 1912. In eighteen weeks he had never said a word about it to me, and I had the transcripts to prove it. When I read him the card he sat for forty seconds without moving, which I know because I counted. Then he said he had never told a living soul where he was in April of 1912. Then he said yes. He had been there.</p>\n<p>And then he told me to bring a warmer coat.</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda was at the kitchen table when I came back through, with her laptop open and a pair of big white headphones on, typing.</p>\n<p>She was sixteen. She had her father's height and, lately, a habit of looking up at me as if I had walked into the wrong room. She had started typing my transcripts that week. It had been her idea. Ever since the night I told her about the letter in the archive, she had been asking about him, and on Friday she had heard me complain that it took me three hours to type up every hour of tape, and she had said, without looking up from her phone, that she could do it in two, and that she would do it for fifteen dollars an hour, and that I should think about it. I had thought about it for about a minute. It was the best deal anyone had offered me in six years, and it kept her at the kitchen table on a Sunday night, where I could see her.</p>\n<p>She was doing last Thursday's tape. Her first one, the Carpathia tape. It was a short one. Most of it was snow.</p>\n<p>I put the kettle on and watched her. She typed fast and very straight, with her shoulders up around her ears. Every so often she stopped, and pressed one finger to the headphones, and went back a few seconds, and listened again.</p>\n<p>They were new, the headphones. I noticed it the way you notice a new picture on a friend's wall. Big and white and soft at the ears, the kind that closed out the world. The old ones had been a pair of my earbuds with one side that only worked if you held the wire at an angle.</p>\n<p>\"Those are nice,\" I said.</p>\n<p>She took one side off. \"What?\"</p>\n<p>\"The headphones.\"</p>\n<p>\"Oh.\" She looked at them as if she had forgotten they were on her head. \"Maddie's sister was getting rid of them. She got new ones.\"</p>\n<p>\"That was nice of her.\"</p>\n<p>\"She's nice.\" Freda put the side back on, and then took it off again. \"He sounds really different on this one.\"</p>\n<p>\"Who does?\"</p>\n<p>\"Him. Mr. Hale.\" She turned the laptop so I could see the screen, though there was nothing on it but the words. \"On the bits you play me, he talks like he's reading you a book. He's never in a hurry. On this one he's like...\" She looked for it. \"He's like somebody who just found out his house got broken into.\"</p>\n<p>I had been in the room. I had not thought of it like that. I had thought he sounded frightened, and I had not let myself write the word down.</p>\n<p>\"He was surprised,\" I said.</p>\n<p>\"He's never surprised. That's his whole thing.\" She pulled the laptop back. \"Who's the client, really?\"</p>\n<p>\"I don't know.\"</p>\n<p>\"You must have some idea.\"</p>\n<p>\"I've got lots of ideas. None of them are any good.\"</p>\n<p>\"Somebody who knows about the boat,\" Freda said, \"when nobody's supposed to know about the boat.\" She put the headphones back on. \"So it's either somebody he told and forgot he told, or somebody who was on the boat.\"</p>\n<p>\"Nobody who was on that boat is still alive.\"</p>\n<p>Freda typed for a moment.</p>\n<p>\"Nobody who was at Ford's Theatre is still alive either,\" she said, without looking up. \"And you're still driving up there.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>That night, after she had gone to bed, I sat at the kitchen table with the coat on the back of my chair and did what I had been putting off all week.</p>\n<p>I opened the transcript from the sixth week. Not the Lincoln parts. The lunch.</p>\n<p>It was the day he had made the soup, back in the fall, and asked me about myself, and I had told him the whole Carrow House story, badly and out of order. I had typed it up that night the same as everything else, because the client wanted all of it. I had never read it back. I did not like reading my own voice telling that story. It sounded like every crank who had ever called a newsroom.</p>\n<p>I read it back now, slowly, with a pencil.</p>\n<p>The diner. The grilled cheese and the tomato soup he always ordered and never ate. The laundromat. The building where my source lived, a brick walk-up over a dry cleaner's. Petrakis, the landlord, who complained about everything. The steam that came up through the floor in the mornings, so the whole building smelled of hot cotton.</p>\n<p><em>A woman on the second floor called Petrakis about noise so often that he had stopped answering her.</em></p>\n<p>I put the pencil on that line and left it there.</p>\n<p>All winter I had been going over the same few facts, the way you turn over a stone in your pocket until it is smooth. The cat shut in the bedroom, because somebody was at the door. The family photographs still on the wall. The two banker's boxes of papers gone from the closet by the door, and not a word about them in the police report. He had put it together for me, at his kitchen table, a few weeks ago. My source had not run. He had opened his door to somebody he knew. And somebody had left with his papers.</p>\n<p><em>Who was at the door?</em></p>\n<p>I had written that on the back of an envelope the night I drove home, and I had looked at it every day since, and I had not done one useful thing about it. I had decided it had been six years. That the dry cleaner's was a smoothie place now. That Petrakis had sold the building and moved in with his daughter in Silver Spring, and that the police had never cared, and that nobody remembered a knock on a door on a Wednesday morning six years ago. I had asked the police for the whole file, the officer's notes and the photographs and anything else behind those two thin pages, and that was all I had done, and the police had not answered.</p>\n<p>But somebody might. A woman who called the landlord so often about noise that he stopped picking up was a woman who listened. She listened through her ceiling, every day, to a building full of other people's lives. She had lived one floor below him. If anyone in the world had heard that door, it was her.</p>\n<p>And I had known she existed for six years. I had made a joke about her at lunch. I had never once asked her name.</p>\n<p class=\"break\">&#10043;</p>\n<p>Petrakis answered on the fourth ring, and I could hear a television behind him, very loud.</p>\n<p>\"The reporter,\" he said, when I told him who it was. He did not sound pleased, but he did not sound displeased either. Petrakis sounded the same about everything. \"You called about the cat.\"</p>\n<p>\"In the fall. Yes. You were a big help.\"</p>\n<p>\"The cat was a good cat.\" He said something away from the phone, in Greek, and the television got quieter. \"What now? I don't own that building anymore. I told you. Smoothies.\"</p>\n<p>\"I'm not calling about the building. I'm calling about one of your tenants. There was a woman on the second floor, when he lived there. She used to call you about the noise.\"</p>\n<p>There was a pause. Then Petrakis laughed, a short, unhappy bark.</p>\n<p>\"Dunleavy.\"</p>\n<p>\"Is that her name?\"</p>\n<p>\"Mrs. Dunleavy. Second floor, front. Thirty years she lived in that building, and for thirty years she called me.\" He was warming up now. I could hear it. \"The radiator. The pipes. The man upstairs walks too heavy. The dry cleaner's machine starts too early. A dog barks on the street, she calls me, like I own the street. Every day. Some days twice. I had to get a second phone.\"</p>\n<p>\"Is she still living?\"</p>\n<p>\"Still living? She will outlive us all. Out of spite.\" He paused. \"She moved when I sold. Before, even. Went to live with her son, out in Frederick somewhere. I don't have the address. I didn't want the address.\"</p>\n<p>\"Do you remember her first name?\"</p>\n<p>\"Why do you want Mrs. Dunleavy?\"</p>\n<p>I thought about how to answer that. Petrakis had been kind to me, in the fall, in his way. He had remembered the cat's name for me after six years, when I could not.</p>\n<p>\"Because she lived right under him,\" I said. \"And I think she heard everything.\"</p>\n<p>The line was quiet for long enough that I thought we had been cut off. Behind him the television murmured. Somebody on it was winning a car.</p>\n<p>\"Eileen,\" Petrakis said. \"Eileen Dunleavy. She was a widow. Her husband drove a bus.\" Then, grudgingly, as if it cost him money to say it: \"She heard everything. That is true. You could not cough in that building without Mrs. Dunleavy telling me what kind of cough it was.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>It was after midnight when I went to hang the coat back up, and that was when I found the receipt.</p>\n<p>It was in the right-hand pocket, folded small, soft as cloth from six years of nothing. I almost threw it away without looking. Then I unfolded it under the hall light.</p>\n<p><em>Grilled cheese 6.50. Tomato soup cup 3.25. Coffee 2.00.</em></p>\n<p>It was from the diner. From one of the winter meetings, the long ones, when he talked and I wrote and the food went cold in front of him. He had ordered it the way he always did, and pushed it a little away from himself, and never touched it, and I had paid, the way I always did, because I was the one with the expense account and he was the one taking the risk.</p>\n<p>I stood in the hall for a long time.</p>\n<p>Then I took the coat off the hanger again and put it over the back of the kitchen chair, where I would not forget it on Thursday, and I put the receipt in my notebook, and on a clean page under it I wrote:</p>\n<p><em>Eileen Dunleavy. Second floor, front. Son in Frederick.</em></p>\n<p><em>She heard everything.</em></p>\n<p>I did not underline anything. I did not have to. Down the hall, under Freda's door, there was still a line of light, and very faintly, through the door and the headphones both, I could hear my daughter laughing at something on her phone. It was the low, careful laugh she saved for friends, and I did not know which friend, and I went to bed.</p>", "audio": false, "added": 1790941967366, "pt": [1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790943066980, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790943066980, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366]}, {"num": 2, "title": "The Warmer Coat", "extra": false, "html": "<p>The snow had gone to rain by Thursday, and the gravel road up to his house had gone to mud.</p>\n<p>I took it slowly, in second gear, with the wipers going and the coat on the passenger seat beside me, folded, like a passenger who had not decided yet whether to come in. The field beyond the house was brown again, with white still lying in the furrows where the sun did not reach. The old blue pickup was where it always was. Smoke came out of the chimney and lay down flat across the roof in the wet.</p>\n<p>He was at the window. He was always at the window. By the time I had parked he was on the porch, with the big umbrella open, coming down the steps one at a time with his free hand on the rail.</p>\n<p>I put the coat on in the car, which is harder than it sounds, and got out.</p>\n<p>He stopped at the bottom of the steps and looked at me. It was a short look, and a thorough one. He took in the hood folded into the collar, and the button hanging by its thread, and the moth hole in the sleeve that I had tried to hide by holding my bag on that arm. Then he smiled, the smile that took ten years off him.</p>\n<p>\"Good,\" he said. \"That's a working coat.\"</p>\n<p>\"It's an old coat.\"</p>\n<p>\"It's both.\" He held the umbrella over me, though I was already wet. \"You bought it for standing about outside in, and you stood about in it a great deal, and then one day you stopped. The pockets have gone out of shape from the notebooks, and the hem is worn on the right side where your bag hangs. You haven't worn it in a long time. It smelled of the closet when you got out of the car. It still does, a little.\" He turned toward the house. \"I'm glad you brought it. Come in. The kettle's on.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>The house was warm, and smelled of woodsmoke and wet wool and something baking. There was a loaf on the kitchen counter in a paper bag from the town bakery, with a hand-lettered sign taped to the bag: <em>LAST WEEK. THANK YOU FOR 61 YEARS.</em></p>\n<p>\"They're closing,\" I said.</p>\n<p>\"Saturday.\" He put the tea things on the tray. \"The grandchildren didn't want it. I bought two loaves. I'll put one in the freezer and feel sorry for myself in June.\" He carried the tray through to the living room. \"You'll have to tell me how your week was. Before we start.\"</p>\n<p>He asked it every Thursday, and every Thursday I had given him the short answer, because I was being paid to listen and not to talk. This Thursday I sat down in the chair that did not eat people and gave him the long one.</p>\n<p>I told him about the transcript from the sixth week, and the line I had put my pencil on. The woman on the second floor. I told him that I had called Petrakis, and that Petrakis had called her a name I would not write down, and then given me her real one. Eileen Dunleavy. A widow, whose husband had driven a bus. Thirty years in that building. Gone to her son's, out near Frederick.</p>\n<p>\"Frederick,\" he said. \"You drove past it this morning.\"</p>\n<p>\"I know.\"</p>\n<p>\"Are you going to find her?\"</p>\n<p>\"I'm going to try.\" I put my cup down. \"I don't know what I expect her to tell me. It was six years ago. She heard everything in that building, every day, for thirty years. Why would she remember one Wednesday?\"</p>\n<p>He was quiet for a moment. He had the notepad on his knee and the pencil in his hand, but he was not drawing.</p>\n<p>\"Ms. Barnett,\" he said. \"Petrakis stopped answering her.\"</p>\n<p>\"He got a second phone. He told me.\"</p>\n<p>\"So for some years, every time Mrs. Dunleavy heard something wrong through her ceiling, she picked up the phone and called the man whose job it was to fix it, and he didn't pick up.\" He tilted his head. \"What does a woman do, when she knows something and nobody will listen to her?\"</p>\n<p>I did not answer at once, because I knew the answer, and I did not much like where it came from.</p>\n<p>\"She writes it down,\" I said.</p>\n<p>\"With the date,\" he said. \"And the time. So that one day, when somebody finally asks, she can prove it.\" He looked at me over his cup. \"You did exactly that. You have a box at the top of a closet that says so. I would be very surprised if Mrs. Dunleavy hasn't got one too.\"</p>\n<p>I sat back. Outside the rain had picked up, and it ran down the window in long uneven lines.</p>\n<p>\"There's something else,\" I said. \"I didn't tell you last week. There wasn't time, after the card.\"</p>\n<p>I told him about the movers. The small outfit from across the river, still in business, with the woman on the phone who said they kept their job sheets for seven years. The job booked by phone eleven days before my source disappeared, with a cash deposit. And the line for the new address, left blank, with a note written beside it in somebody's hand: <em>Customer to call with address.</em></p>\n<p>\"He never called,\" I said.</p>\n<p>He did not say anything for a long moment. The pencil lay still on the pad.</p>\n<p>\"Eleven days,\" he said at last. \"He booked a truck to take everything he owned out of that apartment, eleven days before a Saturday. And he didn't know where it was going.\"</p>\n<p>\"He told me he was going to move after the story ran. Somewhere Carrow couldn't find him.\"</p>\n<p>\"Yes. But a man who is going somewhere knows where it is. He's chosen it, he's paid a deposit on it, he's carried a box of dishes up its stairs in his head a hundred times. Your man had a truck and no address.\" He turned the pencil over in his fingers. \"So either he was going to decide at the last minute, which doesn't sound like a man who kept copies of everything. Or somebody else was finding him the place. And he was waiting to be told.\"</p>\n<p>\"Somebody he trusted.\"</p>\n<p>\"Somebody he trusted enough to let them choose where he would live,\" he said, \"when he was more frightened than he had ever been.\" He looked toward the window. \"Which is a great deal of trust, Ms. Barnett. It's more than most people give anyone.\"</p>\n<p>I wrote it down. I wrote, <em>Somebody finding him a place?</em> and, under it, <em>Same person at the door?</em> and then I looked at what I had written and did not like it at all.</p>\n<p class=\"break\">&#10043;</p>\n<p>At ten past eleven I set the recorders on the little table between us, my phone and the small digital one that had been with me for eleven years, and pressed the buttons and said the date into them, and the time, and <em>Session nineteen.</em></p>\n<p>Then I looked at him and waited. It was his turn.</p>\n<p>\"April 1912,\" he said. \"I was twelve.\"</p>\n<p>I laughed. I did not mean to. It came out of me before I could stop it, a short surprised sound, and I saw it go across the room and land on him, and I was sorry at once.</p>\n<p>He didn't laugh.</p>\n<p>\"I'm sorry,\" I said. \"I didn't...\"</p>\n<p>\"No. It's all right.\" He had not taken offense. He looked, if anything, a little amused at himself. \"It's a strange thing to hear. It was a strange thing to be.\"</p>\n<p>\"I assumed,\" I said, and stopped, and tried again. \"I suppose I'd assumed you'd still be Kit. He'd have been, what. Sixty-seven?\"</p>\n<p>\"He would.\" He looked down at the pad. \"Kit didn't see the new century. He had a good deal more life than he expected, after 1865, and a good deal less than he wanted. That's another Thursday.\" He turned the pencil around in his fingers, once. \"The next time I opened my eyes, I was very small. I was a boy on a ship, in a uniform with too many buttons, and I had been one for about three weeks when the part I want to tell you about began.\"</p>\n<p>\"A boy.\"</p>\n<p>\"A bellboy. On the Carpathia.\" He said the name carefully, as if it were something he had kept wrapped up a long time and was not sure would still be whole. \"A Cunard ship. Not a famous one, not a fast one. Steady. She went back and forth between New York and the Mediterranean with whoever wanted to go, and that spring it was mostly American ladies going to see Italy, and families going home to Hungary. I carried their bags. I ran their messages. I said <em>sir</em> and <em>madam</em> about four hundred times a day.\"</p>\n<p>\"At twelve.\"</p>\n<p>\"At twelve. Boys went to sea younger than that, not so long before.\" He looked at me. \"You're wondering what it's like.\"</p>\n<p>I was. I had not been going to ask. I had been going to keep to the things that could be checked, as I always did, and leave the rest for him.</p>\n<p>\"Yes,\" I said.</p>\n<p>\"It's like being a grown man locked inside a cupboard,\" he said, \"who can see out through the keyhole and is not allowed to speak above a whisper. Everything you know is still in there with you. Nobody on the outside wants any of it. A boy who tells a ship's officer what he ought to do gets a clip round the ear and an extra watch, and he deserves both.\" He smiled a little. \"The first few weeks of that life, I was very angry. Then I remembered something I had learned a long time before, and had to learn again every time it happened.\"</p>\n<p>\"What?\"</p>\n<p>\"When you're small, you don't push. You can't. There's nothing to push with.\" He set the pencil down on the pad. \"So you make the best of what is in front of you. You find out what a small boy can do that a grown man can't. And it turns out, Ms. Barnett, that it's a great deal more than you would think.\"</p>\n<p>\"Such as?\"</p>\n<p>\"Such as nobody ever looks at him.\" He picked the pencil up again, and began, without looking down, to draw. \"A grown man walks into a room, and every person in it decides what he's there for. A boy with a tray walks into the same room, and nobody decides anything. He's furniture. He can stand by the door for ten minutes and hear everything said in that room, and if anyone notices him at all, they ask him for more hot water.\" The pencil moved. \"I heard more on that ship, in four days, than I heard in a year at the National Hotel.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I was going to ask him about the four days. I had the question ready. I had looked up the dates on Sunday night, and I knew the Carpathia had picked up the survivors on a Monday morning and come into New York on the Thursday night, and I was going to ask him where he had been on the Sunday, before any of it.</p>\n<p>But I was looking at the notepad.</p>\n<p>I had seen him draw on it every Thursday for nineteen weeks. The first day, I had even looked properly. I remembered thinking it was the kind of thing people do on the phone. One shape, over and over, gone over so many times that the lead shone. I had noticed it, and noted it, and then it had become part of him, like the cardigan buttoned wrong and the tea gone cold. I had stopped seeing it. You stop seeing anything you see every week.</p>\n<p>A five-pointed star, drawn in one long line, without the pencil ever leaving the paper. And in each of the five points, a tiny letter, crowded in. Greek, I had thought, that first day. Or something like it.</p>\n<p>I had seen that star somewhere else.</p>\n<p>I had seen it ten days ago, in the reading room of the Madison Building, under a lamp, in the left margin of a letter a hundred and sixty years old. Small, beside the last line, drawn in the same brown ink as everything else, as if the pen had moved there by itself while the writer was thinking. A star, the kind you draw without lifting the pen, crowded with some foreign letters. I had looked at it and thought it was vaguely familiar, the way a lot of things are, and I had not given it a second thought. I had been too busy reading the letter.</p>\n<p><em>I am one of those you spoke of.</em></p>\n<p>The folder was in my bag, on the floor by my chair. Six feet from his knee. Again.</p>\n<p>\"Ms. Barnett?\"</p>\n<p>I looked up. He was watching me, the pencil still, his head a little on one side.</p>\n<p>\"Sorry,\" I said. \"Go on. Where were you, the Sunday night?\"</p>\n<p>He looked at me a moment longer. Then he looked at the window, at the rain, and began.</p>\n<p>I did not hear the first thing he said. I had to get it off the tape that night, at the kitchen table, after Freda had gone to bed, with the photocopy laid out flat in front of me under the light and the drawing I had made of his star from memory beside it. I had drawn it four times before I was happy with it. I had never drawn it before. My hand went around the five points in one line, the way his did, the way the letter's did, as if it had been waiting to.</p>\n<p>It was the same star.</p>\n<p>I sat and looked at the two of them for a long time, and then I put on the headphones and pressed play, and listened to him begin, and to myself not saying anything at all.</p>", "audio": false, "added": 1790943066980, "pt": [1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980]}];
const $ = (id) => document.getElementById(id);
const main = $("main");
const store = {
  get(k, d) { try { const v = localStorage.getItem("wyl2." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wyl2." + k, JSON.stringify(v)); } catch {} },
};

// settings
function applySize() { document.documentElement.style.setProperty("--size", store.get("size", 20) + "px"); }
function applyTheme() {
  const t = store.get("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
applySize(); applyTheme();

});
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.theme); applyTheme(); });

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="book">by ${BOOK.author}</div>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
    ${coverFixes()}
    ${shelf()}
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();
  main.querySelectorAll(".fixes [data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
}
// Every book in the series, so the cover doubles as the home screen: pick a book. Book 1 is the site root, Book 2 lives in cqd/.
const SERIES = [{ n: 1, title: "Sic Semper", path: "" }, { n: 2, title: "CQD", path: "cqd/" }];
function shelf() {
  const root = BOOK.number === 1 ? "./" : "../";
  return `<div class="shelf"><div class="lbl">The books</div>${SERIES.map(s =>
    `<a href="${root + s.path}"${s.n === BOOK.number ? ' class="here"' : ""}><span class="n">Book ${s.n}</span><span>${s.title}</span></a>`).join("")}</div>`;
}
function toc() {
  main.innerHTML = `<section class="toc"><button class="tohome" id="toHome">&larr; Home &middot; all books</button><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.extra ? "" : c.num}</span><span>${c.title}</span>${c.audio ? `<span class="hasaudio" title="Has audio">&#127911;</span>` : ""}${badge(c)}</button></li>`).join("")}</ol></section>`;
  $("toHome").onclick = () => cover();
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter${c.extra ? " extra" : ""}">
    <header><div class="num">${c.extra ? "" : "Chapter " + c.num}</div><h2>${c.title}</h2>${c.audio ? `<button class="listen" id="listenBtn">&#9654;&#xFE0E;&nbsp; Listen</button>` : ""}</header>
    <div id="fixbarSlot"></div>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  markFixes(c);
  listenHook(c, next);
  $("where").textContent = c.extra ? c.title : `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();

  main.querySelector(".chapter header").appendChild(box);
  box.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    box.querySelectorAll("[data-v]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    $("vName").textContent = `${b.dataset.v}. ${VOICES[b.dataset.v - 1]}`;
    vClip.src = `audio/samples/tom/s${b.dataset.v}.mp3`;
    vClip.play();
  });
}

// Narration: one mp3 per chapter (audio/chNN.mp3) + audio/chNN.json, the start time of each paragraph.
// The paragraph being read is highlighted and kept on screen; at the end it carries on into the next chapter.
const player = document.createElement("div");
player.id = "player";
player.innerHTML = `<button id="pBack" aria-label="Back 15 seconds">&#8634;</button><button id="pPlay" aria-label="Play or pause">&#10074;&#10074;</button>
  <button id="pFwd" aria-label="Forward 15 seconds">&#8635;</button><span class="t" id="pTime"></span><button id="pStop" aria-label="Stop">&#10005;</button>`;
document.body.appendChild(player);
const audio = new Audio();
audio.preload = "auto";
let aCh = null, aMarks = [], aNext = null, aFollow = true, lastPara = -1;
const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function paraEls() { return [...main.querySelectorAll(".chapter > p:not(.end)")]; }
function listenHook(c, next) {
  if (aCh !== c.num && !audio.paused) audio.pause();
  if (aCh !== c.num) { player.classList.remove("on"); lastPara = -1; }
  const b = $("listenBtn");
  if (b) b.onclick = () => startListen(c, next);
  if (aCh === c.num) aNext = next;
}
async function startListen(c, next, fromStart) {
  if (aCh !== c.num) {
    aCh = c.num; aNext = next; lastPara = -1;
    const nn = String(c.num).padStart(2, "0");
    try { aMarks = (await (await fetch(`audio/ch${nn}.json?v=${BUILD}`)).json()).paras; } catch (e) { aMarks = []; }
    audio.src = `audio/ch${nn}.mp3?v=${BUILD}`;
    const saved = store.get("listen", null);
    audio.currentTime = !fromStart && saved && saved.ch === c.num ? saved.t : 0;
  }
  aFollow = true;
  player.classList.add("on");
  audio.play();
}
audio.addEventListener("play", () => $("pPlay").innerHTML = "&#10074;&#10074;");
audio.addEventListener("pause", () => $("pPlay").innerHTML = "&#9654;&#xFE0E;");
audio.addEventListener("timeupdate", () => {
  const t = audio.currentTime;
  $("pTime").textContent = `${fmtT(t)} / ${fmtT(audio.duration || 0)}  \u00b7  ${AUDIO_V}`;
  store.set("listen", { ch: aCh, t });
  let i = -1;
  for (let k = 0; k < aMarks.length; k++) if (aMarks[k] <= t + 0.1) i = k; else break;
  if (i === lastPara) return;
  lastPara = i;
  const ps = paraEls();
  ps.forEach(p => p.classList.remove("reading"));
  const p = ps[i];
  if (!p) return;
  p.classList.add("reading");
  if (aFollow) {
    const r = p.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 90) window.scrollTo(0, window.scrollY + r.top - innerHeight * 0.25);
  }
});
audio.addEventListener("ended", () => {
  store.set("listen", { ch: aCh, t: 0 });
  if (aNext && aNext.audio) { const n = aNext; aCh = null; go(n.num, 0); startListen(n, CHAPTERS[CHAPTERS.indexOf(n) + 1], true); }
  else player.classList.remove("on");
});
$("pPlay").onclick = () => audio.paused ? (aFollow = true, audio.play()) : audio.pause();
$("pBack").onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 15);
$("pFwd").onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
$("pStop").onclick = () => { audio.pause(); player.classList.remove("on"); paraEls().forEach(p => p.classList.remove("reading")); lastPara = -1; };
// scrolling by hand stops the page from following until play is pressed again
window.addEventListener("touchmove", () => { if (!audio.paused) aFollow = false; }, { passive: true });
window.addEventListener("wheel", () => { if (!audio.paused) aFollow = false; }, { passive: true });


// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });


// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
// Book 2 keeps its notes apart from Book 1's: same key, "-cqd" on the end. A reader who opened Book 1 with ?c= is already signed in here.
const CKEY = (() => { let k = store.get("ckey", null); if (!k) { try { k = JSON.parse(localStorage.getItem("wyl.ckey")); } catch {} } return k ? k + "-cqd" : null; })();
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}
function openCmt(ch, p, text) {
  if (staleV) { showStale(); return; }
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");
  $("cmtText").value = ""; $("cmtStatus").textContent = "";
  renderOld();
  $("cmt").classList.add("open");
}
$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString(), v: BUILD };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// ---- fixed since you last looked (pencil readers only) ----
// Each paragraph carries the build time its text last changed (c.pt). "seen" is, per chapter,
// the newest change the reader has acknowledged. A chapter they've never opened is NEW.
// "seen" is kept per review round, so starting a round (or moving it back) shows its boxes fresh on every device.
const SEEN_KEY = "seen-" + ROUND;
function seenAt(num) { return store.get(SEEN_KEY, {})[num] || ROUND - 1; }
function setSeen(num, t) { const s = store.get(SEEN_KEY, {}); s[num] = Math.max(s[num] || 0, t); store.set(SEEN_KEY, s); }
function isFix(c, t) { return t >= ROUND && t > Math.max(seenAt(c.num), c.added); }
function fixCount(c) { return c.pt.filter(t => isFix(c, t)).length; }
function isNew(c) { return c.added > seenAt(c.num); }
function badge(c) {
  if (!CKEY) return "";
  if (isNew(c)) return `<span class="tag new">New</span>`;
  const n = fixCount(c);
  return n ? `<span class="tag">${n} fixed</span>` : "";
}
function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">${c.extra ? c.title : "Ch " + c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => isFix(c, c.pt[i]));
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} changed in the latest round of fixes, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
</body>
</html>
