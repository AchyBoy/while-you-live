ths that had been laid for breakfast. Evans was there, with his collar still undone. Stan was there, beside me, white as the tablecloths.</p>\n<p class=\"tape\">The chief steward stood on a chair and told us.</p>\n<p class=\"tape\">He told us plainly. The Titanic had struck ice and was sinking. We were going to her. We would be there in about four hours, if we could get there at all. Every man in that room would be wanted, and nobody would sleep tonight, and whatever we saw when we got there, we would do our work and keep our mouths shut and not frighten anybody.</p>\n<p class=\"tape\">Nobody said anything. Then somebody at the back said, \"The Titanic,\" in the voice of a man saying the name of a church that has fallen down.</p>\n<p class=\"tape\">\"Yes,\" said the chief steward. \"The Titanic. Now get moving.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They put me on blankets first. I carried blankets from the linen stores to the gangways and the saloons until my arms shook, armful after armful, a boy with a pile of gray wool up to his eyes running along corridors that were still tilted over into the turn, because she was still leaning, still pushing, still going north-west as fast as she could go.</p>\n<p class=\"tape\">It got cold very fast. That was the heat. Rostron had shut off the steam to every radiator on the ship, every cabin, every saloon, and sent every pound of it down to the engines. Within half an hour you could see your breath in the corridors. Within an hour there was frost on the inside of the portholes.</p>\n<p class=\"tape\">Then Lyle put me and Stan in the second-class corridor on C deck, one at each end, to keep the passengers in.</p>\n<p class=\"tape\">It was strange work. The passengers woke one at a time, from the cold and from the shaking, because the whole ship had begun to shake, a deep hard shudder that came up through the floor and the walls and the bed frames and the teeth. A door would open, and a man in a dressing gown would look out, and I would say, \"Captain's compliments, sir, nothing to be alarmed about, please stay in your cabin,\" and he would look at me, and at the frost on the porthole at the end of the corridor, and go back in, and shut the door, and not believe a word of it.</p>\n<p class=\"tape\">Mr. Hatch came out at about two.</p>\n<p class=\"tape\">He was fully dressed, in the brown suit, with a muffler around his neck and his hat in his hand and a notebook sticking out of his pocket. He came down the corridor toward me, and I stepped in front of him, and he stopped.</p>\n<p class=\"tape\">\"Captain's compliments, sir,\" I said. \"Nothing to be alarmed about. Please stay in your cabin.\"</p>\n<p class=\"tape\">He looked down at me for a moment. He had a long, clever, tired face, and I saw him look at my face, and then at my hands, which were red and raw from the blankets, and then at the frost on the porthole behind me.</p>\n<p class=\"tape\">\"Bertie,\" he said. \"She turned, a little after half past twelve. I felt her go over in my bunk. She's been going flat out ever since, faster than she's ever gone, or the whole ship wouldn't be rattling like a tin of nails. And somebody's turned the heat off to do it, in the middle of the night, in the North Atlantic, with seven hundred paying passengers asleep.\" He put his hat on. \"There's nothing to be alarmed about, is there?\"</p>\n<p class=\"tape\">\"No, sir.\"</p>\n<p class=\"tape\">\"You're a terrible liar, Bertie.\" He smiled. It was not an unkind smile. \"That's all right. Honest boys always are.\"</p>\n<p class=\"tape\">And he stepped around me, quite gently, and went up the stairs.</p>\n<p class=\"tape\">I could have stopped him. I could have shouted for Lyle. I stood in the corridor and watched his brown suit go up the stairs and out of sight, and I did nothing, and I told myself it was because a bell boy cannot lay hands on a passenger.</p>\n<p class=\"tape\">That was true. It was also true that I knew exactly what he was. I had been him, more than once, in other lives. A man who has to see. A man who will go and stand in the cold all night, in a thin suit, with a notebook, because something is happening and he cannot bear to be the one asleep. I've told you. It's the worst thing about me.</p>\n<p class=\"tape\">I let him go because I would have gone.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At about half past two Lyle sent me down to the engine room with a can of coffee.</p>\n<p class=\"tape\">I have tried, since, to tell people what that was like, and I can't. The stokehold of a ship in 1912 was a kind of hell anyway, a long low room of furnaces and coal dust and heat, with men stripped to the waist feeding the fires by hand. That night it was something else. Every stoker on the ship was down there, the watch that should have been sleeping as well as the watch on duty. The furnace doors were open and shutting and open, open and shutting, so fast it was like a light flickering. The men were shoveling as if the coal had done them a personal injury, with the sweat running down their faces through the black, and nobody spoke, because there was no breath to speak with. The noise was a wall.</p>\n<p class=\"tape\">And the ship was shaking. Down there you could feel all of it, every turn of the screws, the whole of her straining, as if she knew. The chief engineer was standing by the gauges watching the needles, and I saw his face, and I understood that they were past where they should have been, and that he was letting them stay there.</p>\n<p class=\"tape\">I gave the coffee to the nearest man. He drank it without stopping, and gave me back the can, and went on shoveling.</p>\n<p class=\"tape\">She had been built to make fourteen knots. People who were there have argued for a hundred years about what she made that night, and I won't argue with them. I'll only tell you I was in her stokehold, and she had never gone like that before, and I don't belie function setSeen(num, t) { const s = store.get(SEEN_KEY, {}); s[num] = Math.max(s[num] || 0, t); store.set(SEEN_KEY, s); }
function isFix(c, t) { return t >= ROUND && t > Math.max(seenAt(c.num), c.added); }
function fixCount(c) { return c.pt.filter(t => isFix(c, t)).length; }
function isNew(c) { return c.added > seenAt(c.num); }
function badge(c) {
  if (!CKEY) return "";
  if (isNew(c)) return `<span class="tag new">New</span>`;
  const n = fixCount(c);
  return n ? `<span class="tag">${n} fixed</span>` : "";
}
function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">${c.extra ? c.title : "Ch " + c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => isFix(c, c.pt[i]));
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} changed in the latest round of fixes, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
