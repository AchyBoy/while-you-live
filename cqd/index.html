ime.</p>\n<p>\"You're doing that,\" she said. \"With Mr. Hale. Aren't you. Every Thursday.\"</p>\n<p>I didn't answer that. I didn't have to. She knew.</p>\n<p class=\"break\">&#10043;</p>\n<p>I told her about the money, then.</p>\n<p>I hadn't planned to. It came out of me because she had told me everything, all of it, sitting on the end of my bed in my sweater at midnight, and I was sitting there with something I hadn't told her, and it had gotten heavy.</p>\n<p>\"The client,\" I said. \"In January, the payments doubled. Six thousand a Thursday, not three, and they've stayed that way. I never told you. And the twenty thousand in February, on top of that, the night the Carpathia card came. I never told you what that was for, because I didn't know. I still don't.\" I looked at my hands. \"I didn't tell you because I didn't know what it meant, and I didn't want you to worry about it, and I wanted to keep it until I understood it.\"</p>\n<p>Freda stared at me.</p>\n<p>\"Mom,\" she said. \"That's literally what I said. About Dad. Word for word.\"</p>\n<p>\"I know.\"</p>\n<p>\"You were doing the exact same thing.\"</p>\n<p>\"I know,\" I said. \"I heard it. While you were saying it.\"</p>\n<p>She looked at me, and then she started to laugh. Not the careful laugh. Not the real one either, quite. Something in between, wet and helpless and a little hysterical, at midnight, on the end of the bed. After a moment I was laughing too. I don't know why. It wasn't funny. We sat there and laughed until she had to wipe her face again, and so did I.</p>\n<p>\"We're so bad at this,\" said Freda.</p>\n<p>\"We're terrible at it.\"</p>\n<p>\"We should be better. We're like, professionally good at finding out stuff.\"</p>\n<p>\"Other people's stuff,\" I said.</p>\n<p class=\"break\">&#10043;</p>\n<p>We worked out the terms, there on the bed, at half past midnight, like two lawyers. I insisted on that. She insisted on writing them down, on the back of a gas bill from my bedside table, in her neat small handwriting, because she said I'd try to change them in the morning.</p>\n<p>She could see him. Not secretly. I would know where, and when, every time. I would meet him first, myself, by myself, somewhere public, in daylight, and we'd talk. Not about her. About him. If I didn't like what I heard, we'd talk about that too, all three of us. No more lies, in either direction. Not about him, and not about money, and not about anything.</p>\n<p>\"And not about Mr. Hale,\" said Freda.</p>\n<p>\"What about him?\"</p>\n<p>\"You have to go back.\" She was writing it down. \"Thursday. And not be mad.\"</p>\n<p>\"I'm allowed to be mad.\"</p>\n<p>\"You can be mad. You have to go back, though.\" She looked up from the gas bill. \"He didn't tell you because I asked him not to. Kind of. I mean, I didn't ask, but he could tell. And he made me promise to tell you, and I didn't, all weekend, because I was scared. That's on me. Not him.\" She held out the pen. \"Sign it.\"</p>\n<p>I signed it. She signed it under me. She folded it in half and put it in the pocket of my sweater, which she was wearing, which meant I would never see it again.</p>\n<p>She fell asleep there, a little while later, on the end of my bed, on top of the covers, curled up like a cat, the way she used to when she was six. I didn't wake her. I put the blanket from the chair over her and turned off the light and lay in the dark listening to her breathe.</p>\n<p>In the morning, before she woke, I took my phone into the kitchen and found the text from the number with the local exchange, and wrote back.</p>\n<p><em>Coffee. Saturday, ten. The place on the corner of Upshur. You're buying.</em></p>\n<p>The answer came in less than a minute. I think he had been awake all night too.</p>\n<p><em>Yes. Thank you. I'll be there at nine.</em></p>", "audio": false, "added": 1790946885832, "pt": [1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790951242617, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832]}, {"num": 23, "title": "Aristeas", "extra": false, "html": "<p>I wore the coat.</p>\n<p>It was too warm for it, by then. The last week of April, and the trees along the highway were full and green, and the farm stands past Frederick had opened again, with hand-painted signs for asparagus and eggs. I wore it anyway, the green wool with the moth hole and the button I had finally sewn back on, on Wednesday night, at the kitchen table, while Freda typed beside me with the headphones around her neck instead of on, so she could talk.</p>\n<p>He wasn't at the window.</p>\n<p>That was the first thing. On every earlier visit he had been at the window, and on the porch before I had the engine off. I sat in the car for a moment with my hand on the key, looking at the house, and the curtain didn't move.</p>\n<p>Then the door opened, and he came out.</p>\n<p>He came out slowly. He came down the porch steps with both hands on the rail, not one, and stopped at the bottom to get his breath, and I saw that he had lost weight since the winter. More than I had let myself notice. The cardigan hung on him. His face had that gray under the weathering that I had seen last week and decided not to care about, and it was worse, and I cared.</p>\n<p>He saw the coat. I saw him see it.</p>\n<p>He didn't say anything. He stood at the bottom of his steps, in the sun, with one hand still on the rail, and waited for me.</p>\n<p>I got out of the car and walked across the gravel and stopped in front of him.</p>\n<p>\"You should have told me,\" I said.</p>\n<p>\"Yes,\" he said.</p>\n<p>\"I know why you didn't.\"</p>\n<p>He looked at me for a long moment. Then he nodded, once, slowly, and something in his shoulders came down that I hadn't known was up.</p>\n<p>\"Thank you,\" he said.</p>\n<p class=\"break\">&#10043;</p>\n<p>We sat on the porch. He suggested it. He said the house was stuffy and the sun was out and he had been indoors too much that week, and I thought that he didn't want to climb the steps again so soon, and I didn't say so. He sat on the bench and I sat in one of the two chairs. He had put the kettle on before he came out. Through the open door I could hear it beginning to tick on the stove.</p>\n<p>\"What I said,\" I said. \"Last week. In the kitchen. About pretending to be other people for a living.\"</p>\n<p>\"It was true,\" he said.</p>\n<p>\"It was cruel.\"</p>\n<p>\"Yes. That's why it hurt. The cruel things that aren't true, you can put down.\" He was looking out at the field. It had been plowed since last week, long dark furrows all the way to the tree line. \"I've been a great many people, Ms. Barnett. I've been them very carefully, so nobody would notice they'd gone. Bertie Pike's mother never knew. Kit's mother never knew. That's what I do. You weren't wrong.\"</p>\n<p>\"You let Freda know you.\"</p>\n<p>\"Freda's very hard to pretend in front of,\" he said. \"So are you.\"</p>\n<p>Inside, the kettle began to whistle. He started to get up, and I said, \"I'll get it,\" and went in and took it off the stove and turned the gas off. I stood for a moment in his kitchen, where I had never once been by myself. Then I came back out.</p>\n<p>\"How is she?\" he said.</p>\n<p>This time I answered. I told him. The end of the bed, and the pier, and the card from Phoenix in the box of baby teeth, and the hardware store on Georgia Avenue, and <em>it's Freda,</em> and ten seconds of nothing, and a man who hung up. I told him about the liquor store on Kennedy Street. I told him about the terms, on the back of a gas bill, signed by both of us, in the pocket of a sweater I would never see again.</p>\n<p>I told him I was meeting Desmond on Saturday, for coffee, at ten. That Desmond had said he'd be there at nine.</p>\n<p>He listened to all of it without interrupting. When I got to the gas bill, he laughed, the real one.</p>\n<p>\"She'll keep that,\" he said. \"For years. You'll find it in a drawer when she's forty.\"</p>\n<p>\"I know.\"</p>\n<p>\"And you'll go on Saturday.\"</p>\n<p>\"I'll go.\" I looked at my hands. \"I don't know what I'll say.\"</p>\n<p>\"You'll check,\" he said. \"That's what you'll say. You'll ask him everything, very politely, and you'll write it all down afterward in the car, and then you'll go and find out whether it's true.\" He smiled at the field. \"And some of it you won't be able to check. And you'll have to decide.\"</p>\n<p>\"Freda said that. About you.\"</p>\n<p>\"She's very like you,\" he said. \"I don't think either of you know how much.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He gave me something, before we went in.</p>\n<p>He reached into the pocket of the cardigan and took out a folded piece of paper, notebook paper, torn from a spiral, and held it out to me.</p>\n<p>\"This came on Tuesday,\" he said. \"By post. It's addressed to me, but I think she'd want you to see it. Since there aren't any secrets now.\"</p>\n<p>It was Freda's handwriting. The small neat handwriting from the back of the gas bill. Three lines.</p>\n<p><em>Mr. Hale. Thank you for not telling. And for telling me to. I told her. All of it. You were right, it got lighter. F.</em></p>\n<p><em>P.S. I typed the pier. I'm sorry nobody came for Bertie.</em></p>\n<p>I read it twice. Then I folded it back up, along the creases she'd made, and gave it back to him. He put it in the pocket of his cardigan, and kept his hand over it for a moment, on the outside, the way Hatch used to keep his hand over the notebook.</p>\n<p class=\"break\">&#10043;</p>\n<p>We went in at eleven. He went up the porch steps slowly, with both hands, and I went behind him, not touching him, close enough. In the living room he sat down in his chair as if he had walked a long way, and picked up the notepad, and did not draw on it.</p>\n<p>I set out the recorders. I didn't turn them on.</p>\n<p>\"Before you do,\" he said.</p>\n<p>I looked up.</p>\n<p>\"Ms. Barnett,\" he said. \"In all these Thursdays, you've never asked me my name.\"</p>\n<p>\"I know your name. You told me. The first day.\"</p>\n<p>\"I told you the name on the mailbox I keep meaning to paint.\" He was looking at the empty frame on the mantel. \"That's the name this body came with. Tom Hale. It's a good name. He was a good man, I think, the one who had it first. I've tried to be careful with it.\" He was quiet a moment. \"It isn't mine.\"</p>\n<p>I waited.</p>\n<p>\"I had one, once,\" he said. \"A long time ago. The first one. Before any of the others. I haven't said it aloud in...\" He stopped, and seemed to count, and gave up. \"In a very long time. I haven't told anybody what it was, in more lives than I could list for you. There didn't seem to be anybody to tell.\" He turned from the mantel and looked at me. \"I'd like somebody to know it. I find I'd like that very much. While I...\" He stopped again. \"While there's time.\"</p>\n<p>\"You don't have to.\"</p>\n<p>\"I know I don't.\" He smiled, a little. \"That's why I'd like to.\"</p>\n<p>He said it.</p>\n<p>It was a Greek name. Old. He said it slowly, carefully, in a way that was not quite English, with the weight in a different place than I would have put it, as if his mouth were remembering how. Four syllables. It sounded like something carved on a stone.</p>\n<p>\"Aristeas,\" he said.</p>\n<p>I didn't write it down. I don't know why. I had written down everything he had said to me for seven months. I sat with my pen in my hand and didn't write it, and I think he saw that, and I think it was the right thing to have done.</p>\n<p>\"Aristeas,\" I said. Badly. I put the weight in the wrong place.</p>\n<p>He laughed, softly.</p>\n<p>\"Close,\" he said. \"Nobody's said it to me in a very long time. Nobody alive.\" He looked down at the notepad, at the star, gone over so many times the lead shone. \"The people who called me that called me Ari, mostly. When I was young. The first time I was young.\"</p>\n<p>\"Can I call you that?\"</p>\n<p>He thought about it, seriously, the way he thought about everything Freda asked.</p>\n<p>\"Not on the tape,\" he said. \"Not in the transcript. Not to your client.\" He paused. \"But here. On the porch. When it's just us.\" He looked at me. \"Yes. I think I'd like that.\"</p>\n<p>\"Ari,\" I said.</p>\n<p>He closed his eyes for a moment, as if he were listening for it to come again. Then he opened them, and picked up the pencil, and settled the notepad on his knee.</p>\n<p>\"Turn them on,\" he said. \"We've got a great deal to do, and I don't know how many Thursdays.\"</p>\n<p>I didn't ask him what he meant. I think I knew. I turned on the recorders, and said the date into them, and the time, and <em>Session twenty-seven,</em> and he looked out of the window at the plowed field, and began to draw.</p>", "audio": false, "added": 1790946885832, "pt": [1790946885832, 1790946885832, 1790946885832, 1790951242617, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790953529797, 1790946885832, 1790948775374, 1790946885832, 1790946885832]}, {"num": 24, "title": "The Letter", "extra": false, "html": "<p>We ate lunch on the porch, too. Soup, from the dented pot, and bread from the supermarket in town that he said was improving, slowly, as a bad student improves when he is frightened of failing. He didn't eat much. He broke his bread into small pieces and moved them about the bowl, and I watched him do it and didn't say anything.</p>\n<p>When we had finished, I went to the car and got the folder out of my bag.</p>\n<p>I had carried it every Thursday since February. Ten Thursdays. It had sat on the floor by my chair, six feet from his knee, through the Carpathia and the boats and the fog and the pier, and every Thursday I had meant to take it out and every Thursday I had found a reason not to. The star, after I'd recognized it. Freda, after that. Being angry, after that.</p>\n<p>On the back of a gas bill in my daughter's handwriting, at half past twelve on a Monday morning, it said <em>No more lies, in either direction.</em> I had signed it. I had not been thinking about Damon when I signed it. I was thinking about him now.</p>\n<p>I came back up the porch steps and sat down and put the folder on the little table between us, on top of the soup bowls, and opened it.</p>\n<p>\"I found something,\" I said. \"In February. Before the Carpathia card. I've been carrying it ever since. I meant to show you the day the card came, and I couldn't, and then I didn't.\" I turned the photocopy round so it faced him. \"I'm sorry. I should have shown you weeks ago.\"</p>\n<p>He looked at it. He didn't pick it up.</p>\n<p>\"What is it?\"</p>\n<p>\"A letter,\" I said. \"From the Lincoln papers. At the Library of Congress. In one of Nicolay's envelopes, the ones nobody's asked for in twenty-two years.\" I heard my voice go careful. \"It's dated April the thirteenth, 1865.\"</p>\n<p>He went very still.</p>\n<p class=\"break\">&#10043;</p>\n<p>He read it slowly. I watched him read it. I had read it so many times myself I knew where his eyes were by how long they stayed.</p>\n<p><em>Mr. President.</em> He stopped there, the first time, for a long moment, on the two words, on the hand. The long looping capitals. The most beautiful hand, he had told me in the winter, that he had ever seen on a bill of fare. I saw him know it. I saw his mouth move, very slightly, around a name he didn't say.</p>\n<p>Then he read on. <em>There is a man in this city who means to take your life.</em> The National Hotel. The speech on the lawn. <em>The last speech you would ever make.</em> Seward. The Kirkwood. The large young man who called himself Wood and Paine. The German who drank. The druggist's clerk.</p>\n<p><em>A young man of Charles County, lately a soldier of the rebellion, lame in the left leg, who is much at his table and knows the roads of Southern Maryland.</em></p>\n<p>He stopped there for a long time.</p>\n<p>\"He named me,\" he said quietly. \"He named all of us. To the President. The day before.\"</p>\n<p>\"Yes.\"</p>\n<p>\"And it went on a pile.\" He didn't look up. \"<em>Anonymous. Warning. Filed.</em> Like mine.\"</p>\n<p>He read the rest. <em>We cannot spare you, Sir. Not now.</em> And the last line, by itself.</p>\n<p><em>I have no name that would carry weight with you. I am one of those you spoke of.</em></p>\n<p>He sat back.</p>\n<p>His eyes had filled. He didn't do anything about it. He sat on the bench on his porch in the April sun with the photocopy in front of him and let them, and looked out at the plowed field, and neither of us said anything for a long time.</p>\n<p>\"He tried,\" he said at last. \"The day before. He tried with everything he had, and he signed it with nothing, so it would only be about the President, and not about him.\" He shook his head slowly. \"I guessed, once. On Seventh Street, that summer, I guessed what he'd been writing. But I never knew. More than a hundred and sixty years, Ms. Barnett. I never knew what he'd said.\"</p>\n<p>\"I'm sorry I kept it from you.\"</p>\n<p>\"Don't be,\" he said. \"You've just given it to me. That's the only part that matters.\" He wiped his face, finally, with the back of his hand, like a boy. \"Thank you.\"</p>\n<p>Then he looked down at the page again, to read the last line one more time, I think.</p>\n<p>And his eyes went to the margin.</p>\n<p class=\"break\">&#10043;</p>\n<p>I had been waiting for it. I had been waiting for it since February, if I'm honest. I watched it happen.</p>\n<p>His eyes went down the last line, <em>I am one of those you spoke of,</em> and came to the end of it, and moved, because eyes do, a little to the left, into the margin. To the small thing drawn there in the same ink, beside the last line. A star, drawn without lifting the pen, crowded with foreign letters.</p>\n<p>He stopped.</p>\n<p>Not the way he stopped for the Carpathia. That was stillness. This was something else. His whole body stopped, like a clock stopping, and his face emptied, and his hand, which had been resting on the edge of the photocopy, stayed there, flat, pressing down, as if the page might lift off the table.</p>\n<p>I didn't count. I had counted, the first day, on the tape. I had counted at the Carpathia. I didn't count now. I sat across the little table from him and waited, and I could hear the wind in the field, and a tractor, very far off, and my own heart.</p>\n<p>Then, without looking down, he reached for the notepad on the bench beside him. He put it on the table, next to the photocopy. The top page was covered in his star, gone over so many times the lead shone.</p>\n<p>He looked from one to the other.</p>\n<p>The same five points. The same single line, never lifting. The same small letters crowded into the points, in the same order. One in pencil, gone over a thousand times by an old man's hand on a porch. One in brown ink, more than a hundred and sixty years old, in the margin of a letter to Abraham Lincoln, in the most beautiful hand on any bill of fare in Washington.</p>\n<p>\"Thank you for bringing this,\" he said.</p>\n<p>That was all. His voice was perfectly level.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"It's your star,\" I said.</p>\n<p>\"Yes.\"</p>\n<p>I made myself say the next thing. \"Did Kit draw it? Did you? On his letter, somehow? Before it went?\"</p>\n<p>\"No,\" he said. \"I never saw this letter. I didn't know it existed until two minutes ago. You know that. You've just watched me find out.\"</p>\n<p>I had. I knew it the way I knew my own hand.</p>\n<p>\"Then how is it on there?\"</p>\n<p>He looked from one star to the other, and back.</p>\n<p>\"I don't know,\" he said.</p>\n<p>He said it as he had said it once before, in the winter, looking at a shaking card in the client's hand. The way a man says it who has not had to say it very often in a very long life, and doesn't like the taste.</p>\n<p>\"Who taught it to you?\" I said. \"The star.\"</p>\n<p>\"Somebody a very long time ago.\" He was still looking at the page. \"The same person who taught me the song.\"</p>\n<p>I sat with that. I thought of a young woman in a deck chair, on a cold night, wrapped in two blankets, humming to a child who couldn't sleep. <em>It's a very old song. Older than anything.</em></p>\n<p>\"The governess hummed your song,\" I said slowly. \"And Damon drew your star.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Two lives. Fifty years apart. Two different people.\"</p>\n<p>\"Yes.\"</p>\n<p>\"And they both had something of yours. Something nobody else has. Nobody alive.\"</p>\n<p>He didn't answer.</p>\n<p>\"Ari,\" I said. Quietly. It was the porch, and it was just us. \"What does that mean?\"</p>\n<p>He looked up from the page, then. At me. And I saw that he didn't know. That he was frightened, a little, that he didn't know. And that underneath the fright there was something else, something I had never seen in his face in all the Thursdays, that I didn't have a word for until I was halfway home.</p>\n<p>Hope. It was hope.</p>\n<p>\"I don't know,\" he said again. \"I don't know, Ms. Barnett. I've spent a very long time thinking I was the only one.\" He put one finger on the star in the margin, very lightly, as you'd touch something in a museum when the guard wasn't looking. \"May I keep this? The copy.\"</p>\n<p>\"It's yours. I made it for you. I just didn't know I had.\"</p>\n<p>He folded it, very carefully, along the creases, and held it in both hands in his lap. Neither of us said anything else. After a while he unfolded it again, and looked at the margin, and folded it back along the same creases, as if he needed to see it was still there.</p>\n<p class=\"break\">&#10043;</p>\n<p>On the drive home I pulled into the gas station at the bottom of the hill, the one with the sign for night crawlers, and sat in the car with the engine running and took out my notebook.</p>\n<p><em>Damon. 1865. The star.</em></p>\n<p><em>E. P. 1912. The song.</em></p>\n<p><em>Two people. Two lives. Fifty years. His marks.</em></p>\n<p>And then, under it, because I was honest on paper even when I was not anywhere else:</p>\n<p><em>He didn't know. He was frightened. He was glad.</em></p>\n<p>I looked at that for a while. Then I wrote one more line, and underlined it, and put the notebook away and drove home.</p>\n<p><em>Who else has he put away?</em></p>", "audio": false, "added": 1790946885832, "pt": [1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790951242617, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790951242617, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790953529797, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832]}, {"num": 25, "title": "Spring Sale", "extra": false, "html": "<p>He was there at nine. I know because I was there at a quarter to, and parked across the street, and watched him go in.</p>\n<p>I want to tell you about that coffee, and I'm not going to, not all of it. It isn't mine to tell, any more than Freda's was Tom's. I'll tell you that he stood up when I came in, and didn't know what to do with his hands, and that he had bought me a coffee already and it had gone cold, and he went and bought another. That he looked at me across the table for a long time before he said anything, and then said, <em>You look exactly the same,</em> which was a lie, and <em>You look tired,</em> which wasn't.</p>\n<p>I'll tell you I asked him everything. Very politely. With my notebook in my bag where he couldn't see it. Where he lived, and since when. Where he worked, and since when. How long sober, and how he knew, and who he called when it was bad. Phoenix, and what happened there. The card in March.</p>\n<p>\"I forgot her birthday,\" he said. He looked at the table. \"I was drunk the whole of that January. I don't remember most of it. I found the card in a drawer in March, already bought, never sent, with her name on it. And I thought, if I send it now it's worse. And then I thought, if I don't send it at all, that's worse still.\" He turned his cup around. \"I sent it. I wrote <em>sorry it's late.</em> That's all I wrote. Three words, on a card two months late, the year you lost everything.\" He looked up at me. \"I knew about the story. I read it in Phoenix, online. I knew what was happening to you. I sent three words.\"</p>\n<p>I didn't say anything to that. I didn't have to. He had said it all himself.</p>\n<p>I wrote everything down in the car afterward, for forty minutes, in the parking space outside. Then I drove home and spent the rest of the weekend checking it. The hardware store. The apartment. The meeting on Tuesday nights at the church on Upshur. Most of it checked. Some of it I couldn't check, and never will.</p>\n<p>Freda asked me on Sunday night what I'd decided.</p>\n<p>\"I haven't,\" I said.</p>\n<p>\"But you're going to see him again.\"</p>\n<p>\"Yes,\" I said. \"I'm going to see him again.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>On Monday I went back to the Library of Congress.</p>\n<p>I hadn't been since February. The same reading room, the same lamps, the same librarian with her glasses on a chain, who looked at my reader card with its terrible photograph and then at me, and said, \"You came back,\" as if she had been keeping track.</p>\n<p>\"I'm looking for auction catalogs,\" I said. \"From a house here in the city. Carrow House. Spring sales, about seven years ago.\"</p>\n<p>She didn't ask why. She went and looked, and came back, and said that the Library had collected auction catalogs for a very long time, from all the major houses and a good many minor ones, because the catalogs were often the only record of where a document had gone. Carrow House was in the collection. Every catalog they had ever printed, more or less, back to the 1950s. She could have the ones I wanted at the desk in an hour.</p>\n<p>I waited the hour. I read the same page of a newspaper eleven times.</p>\n<p>There were three, from the right year and the two around it. Heavy cream paper, as I remembered. Bound in gray card, with the brass doors embossed on the cover in gold. <em>CARROW HOUSE. SPRING SALE. Autograph Letters, Manuscripts and Historical Documents.</em> I had held a dozen of these, once, when I was working on the story, and I had read every lot description in every one of them, looking for forgeries. I had never once read the front matter. Who reads the front matter of an auction catalog?</p>\n<p>The middle one had a foreword. Two pages, with a photograph at the top of the first.</p>\n<p>It was him.</p>\n<p>The same man as in photograph number seven, on the wall over the brown couch. White hair swept back. Bow tie. A beautifully cut gray suit. Not laughing, in this one. Smiling, with his chin up, at the camera, like a man who has been photographed a great many times and knows exactly what his face is doing. Under the picture, in small italic capitals:</p>\n<p><em>GERALD WHITCOMBE, DIRECTOR OF CONSERVATION AND MANUSCRIPTS.</em></p>\n<p>I read the foreword. I read it slowly, as Tom read Mrs. Dunleavy's page. It was about paper. About the care of old documents, and the patience it took, and the honor of handing a letter from one century into the next without harm. It was well written. It was charming. It was the voice of a man who was used to people listening.</p>\n<p>And at the end of the second page, there was a paragraph of thanks. To the staff of the conservation studio, <em>without whom nothing in these pages would have come safely to sale.</em> And then one more line, by itself.</p>\n<p><em>And to my apprentice of many years,</em> it said, and gave his name.</p>\n<p>My source's name. His real one. The one I had never written down, in any notebook, anywhere, in six years.</p>\n<p><em>whose hands are already better than mine.</em></p>\n<p>I sat in the reading room under the lamp, with the catalog open in front of me, and put my hand flat over that line, as Hatch used to keep his hand over his notebook. I didn't want anybody else to see it. There was nobody else at the table.</p>\n<p>His apprentice. Of many years. The man who had taught him everything he knew about paper. Who had stood in front of the brass doors with his arm around his shoulders, hard, laughing, as you hold someone who belongs to you.</p>\n<p><em>Somebody he trusted enough to let them choose where he would live.</em></p>\n<p>I photographed the foreword, both pages, with no flash, as the sign on the wall asked. I didn't ask for a copy. I didn't need to hold this one.</p>\n<p class=\"break\">&#10043;</p>\n<p>It took me an hour that night to find out where Gerald Whitcombe was now.</p>\n<p>He had retired from Carrow House the year after my story ran. There had been a little piece about it in the trade newsletter, with a photograph and a quote about forty years of happy work. He was seventy-nine. A widower. He lived in a stone house on forty acres outside Middleburg, in the hunt country in Virginia, an hour and a half west of my kitchen table. He was on the board of a historical society and a library foundation. He gave a talk, every spring, on the care of old paper.</p>\n<p>And somebody had filmed one of the talks, three years ago, and put it online.</p>\n<p>I watched it at the kitchen table with my headphones on. Forty minutes. He stood at a lectern in a bow tie, with slides behind him, and talked about the enemies of paper: light, damp, acid, and the human hand. He was very good. He was funny. The audience laughed in the right places.</p>\n<p>At thirty-one minutes, somebody in the audience asked a question I couldn't hear. And Gerald Whitcombe put his head back and laughed.</p>\n<p>I took the headphones off. I sat in the kitchen with the screen frozen on him, mid-laugh, his mouth wide open, his head back, exactly as he was in photograph number seven.</p>\n<p>I knew that laugh. I had never heard it before tonight. And I knew it.</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda came with me to Frederick on Wednesday, after school. She asked. I didn't have to think about it this time.</p>\n<p>Kevin opened the door before we knocked again. Mrs. Dunleavy was by the window in her wheelchair with the crocheted blanket over her knees, in the same cardigan buttoned all the way to the top, and she watched us come up the ramp with her bird's eyes, and when we came in she said, \"You came back,\" before we had our coats off.</p>\n<p>\"I said I would.\"</p>\n<p>\"People say all sorts of things.\" She held out her hands. I gave her the composition book, the one with the masking tape on the spine, and she took it in both hands and held it in her lap and looked at it, and then looked at me. \"Well? Did you find out where the car went?\"</p>\n<p>\"Not yet,\" I said. \"But I think I've found out who was in it. One of them.\"</p>\n<p>I sat down on the couch next to her chair. Freda sat on the arm of it. I took out my phone.</p>\n<p>\"Mrs. Dunleavy,\" I said. \"You never saw him. You told me. You only heard him. Through the ceiling, for half an hour, and on the stairs.\"</p>\n<p>\"Every step,\" she said. \"Click, click, click.\"</p>\n<p>\"And the laugh.\"</p>\n<p>\"And the laugh.\" Her mouth went thin. \"I'd know that laugh in my grave.\"</p>\n<p>\"I'm going to play you something,\" I said. \"A man talking. For a minute or two. I'm not going to tell you anything about him. I just want you to listen.\"</p>\n<p>She looked at me for a long moment. Then she nodded, once, and folded her hands on top of the composition book, and closed her eyes.</p>\n<p>I found the place. Thirty minutes and ten seconds. I turned the volume up all the way and held the phone near her ear.</p>\n<p>Gerald Whitcombe's voice came out of it, warm and easy and carrying, talking about the human hand, and how it was the greatest enemy of old paper and also its only friend. Mrs. Dunleavy sat perfectly still with her eyes closed. Freda had stopped breathing. Somewhere in the house, Darren's music thumped faintly through a door.</p>\n<p>At thirty-one minutes, the audience member asked a question. And Gerald Whitcombe laughed.</p>\n<p>Mrs. Dunleavy's eyes opened.</p>\n<p>She didn't say anything at first. She sat there with her hands on the notebook, very small in her wheelchair, and her face did something I had seen a great many faces do in my working life, the moment when a thing you have carried by yourself for years turns out to have been real, and you are not alone with it anymore.</p>\n<p>\"That's him,\" she said.</p>\n<p>\"Are you sure?\"</p>\n<p>\"Six years,\" said Mrs. Dunleavy, \"I've been hearing that laugh in my sleep.\" She looked at the phone. \"That's him. That's the man who went down my stairs with that boy's whole life in a box and banged my new paint all the way to the bottom.\" Her voice cracked. She put one small cold hand over Freda's, on the arm of the chair, without seeming to notice she'd done it. \"Who is he?\"</p>\n<p>I told her.</p>\n<p>She said the name over to herself twice, quietly, as if she were writing it down in her head, with the date, and the time.</p>\n<p class=\"break\">&#10043;</p>\n<p>In the car, at the bottom of Kevin Dunleavy's cul-de-sac, I took my notebook out and wrote it down.</p>\n<p>I had never once written down my source's name. Not in eight months of reporting, not in the six years since. Petrakis was in my notebooks, and Delacroix, and the movers, and every lawyer Carrow ever hired. He wasn't, and he wasn't now, even after the catalog. I wrote this name anyway. This man wasn't my source. He wasn't somebody I was protecting.</p>\n<p><em>Gerald Whitcombe.</em></p>\n<p><em>His teacher. Mrs. D knows the laugh, by ear, six years on, off a phone. Not proof. Leather heels? Two trips?</em></p>\n<p>And under it, because there might have been three of them, and Tom had made me see it, and I couldn't stop seeing it now:</p>\n<p><em>Who was driving?</em></p>\n<p>Freda read it upside down from the passenger seat. She'd been reading over my shoulder since she was four.</p>\n<p>\"Shouldn't you tell the police?\"</p>\n<p>\"With what?\" I said. \"A notebook, a laugh off a phone, and a photograph from a party. They'd put it in the file next to Mrs. Dunleavy's two phone calls, the ones nobody returned. Or somebody would ring him up and ask him about it, politely, and then he'd know exactly who was asking, and how little they had.\" I put the notebook in my bag. \"When I go to them, I want more than another name.\"</p>\n<p>Freda thought about that.</p>\n<p>\"Are you going to go see him?\" she said. \"The teacher?\"</p>\n<p>\"Not yet.\"</p>\n<p>\"When?\"</p>\n<p>\"When I know who was driving,\" I said, and started the car.</p>", "audio": false, "added": 1790946885832, "pt": [1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790948775374, 1790948775374, 1790946885832, 1790946885832, 1790951242617, 1790954068779, 1790951242617, 1790946885832, 1790946885832, 1790946885832, 1790946885832]}, {"num": 26, "title": "The Second Part", "extra": false, "html": "<p>The money came on a Wednesday.</p>\n<p>This wasn't the regular money. The six thousand for each Thursday had come on Mondays since January, and on a Saturday once in March, and it had come that Monday too. This came on the Wednesday, the same Wednesday as Frederick, at a little after eleven in the morning, while I was at the kitchen table writing four hundred words about a dentist's new whitening service. My phone buzzed on the table. It was the bank.</p>\n<p>It was more than the twenty thousand in the winter. It was more than I had made in the two years before the letter came, put together. And it had not come from Aldine, Mercer and Voss. It had come by wire from a bank in a different city, one I had never been to either, a long way from the firm's, and the line in the note was one I had read once before, in February, on the night of the courier and the Carpathia card.</p>\n<p><em>With our client's thanks, at the close of the second part.</em></p>\n<p>I looked at it until the screen went dark. Then I texted Freda, at school, because we had terms, and the terms said money too.</p>\n<p><em>Client paid. A lot. Tell you tonight. Not worried. Just telling you.</em></p>\n<p>She wrote back in under a minute, from what I very much hoped was the hallway between classes.</p>\n<p><em>ok. thank you for telling me. how much is a lot</em></p>\n<p><em>Tonight.</em></p>\n<p><em>thats a LOT a lot isnt it</em></p>\n<p class=\"break\">&#10043;</p>\n<p>The card came that night, by courier, at a quarter to nine.</p>\n<p>The same young man in the same reflective jacket. He knew my name by then. He said, \"Evening, Ms. Barnett,\" and held out the tablet for my finger, and the envelope, and said, \"Have a good one,\" and was gone.</p>\n<p>Freda was at the kitchen table. She didn't say <em>open it.</em> She waited, with her hands folded on top of the closed laptop, and watched me do it.</p>\n<p>One card. No letter. Heavy cream paper, the same as every time.</p>\n<p>I could barely read it.</p>\n<p>The hand had gone. That's the only way I can say it. The shapes were still the old schooled shapes, the long loops, the lean to the right, but they wandered now. They drifted off the line and came back. The pen had stopped and started so many times that the words were made of pieces. It had been written very slowly by someone who could no longer hold a pen properly and had refused to let anyone else hold it for him.</p>\n<p>It took me a long minute, under the kitchen light, to make it out.</p>\n<p><em>Please ask him about New York. 1780.</em></p>\n<p>Freda read it upside down. She didn't say anything for a while.</p>\n<p>\"He's really sick,\" she said at last. Quietly.</p>\n<p>\"Yes.\"</p>\n<p>\"Like, really sick.\"</p>\n<p>\"I think so.\"</p>\n<p>She looked at the card. Then she looked at me.</p>\n<p>\"Mom,\" she said. \"What happened in New York in 1780?\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I read it to him on the porch.</p>\n<p>It was the first week of May, and warm, properly warm, the first day of it. He was sitting on the bench in his shirtsleeves when I drove up, with the cardigan folded beside him, and he didn't get up. He raised one hand from the rail, which was as good as coming down the steps, and I came up and sat in the chair.</p>\n<p>I gave him the card first. Before the words. He took it and held it in the sun, and looked at the hand for a long time, as he had in the winter, the long strokes, the stops, the places where the pen had wandered off the line.</p>\n<p>\"He wrote this in bed,\" he said quietly. \"Propped up. With the card on a tray, or a book. You can see where it slipped.\" He touched one place, where a letter dragged sideways. \"And somebody offered to write it for him. And he wouldn't let them.\" He was quiet. \"I know that look on a page. I've written like that myself, once or twice. Toward the end.\"</p>\n<p>He didn't say the end of what.</p>\n<p>Then he read the words.</p>\n<p>I watched his face. I had watched it for every card. Eleven seconds, the first day. Forty, at the Carpathia. This time I didn't count, and I didn't need to, because what came into his face wasn't stillness at all.</p>\n<p>He smiled. Slowly. Not happily, quite. The smile of a man who has just been dealt a card he knew was in the deck, and had been waiting for, and wishes he hadn't been.</p>\n<p>\"Ah,\" he said.</p>\n<p>\"Were you there?\"</p>\n<p>\"Yes.\"</p>\n<p>\"New York. 1780.\"</p>\n<p>\"Yes.\" He set the card down on the bench beside him, very gently, face up. \"It was a war, Ms. Barnett. The same one everyone learns in school. Only I was on the other side of it.\"</p>\n<p>\"The British?\"</p>\n<p>\"The losing one,\" he said. \"As it turned out.\" He looked out over the field, which was green now, all of it, a low green fuzz over the furrows all the way to the trees. \"I spent the best part of two years in that city hunting a spy. And I lost. And then there was a country, partly because I lost.\" He was quiet a moment. \"I've never decided how I feel about that. Two hundred and forty-seven years, and I've never decided.\"</p>\n<p>\"Is that what you'll tell me? Next?\"</p>\n<p>\"If you'll come,\" he said. \"If you'd still like to.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I told him about Gerald Whitcombe, then. I had been saving it.</p>\n<p>I told him about the catalog, and the foreword, and the apprentice of many years whose hands were already better than his. I didn't say my source's name, even then, and he didn't ask. I told him about the stone house on forty acres in the hunt country, and the talk every spring on the enemies of paper, and the laugh at thirty-one minutes. I told him about Mrs. Dunleavy with her eyes closed and her hands folded on the composition book, and <em>That's him,</em> and her small cold hand on top of Freda's.</p>\n<p>He listened to all of it without moving. At the end he was quiet for a long time.</p>\n<p>\"His teacher,\" he said.</p>\n<p>\"Yes.\"</p>\n<p>\"The man who taught him the trade. Who'd known him since he was a boy, very likely. Who he'd have trusted with anything.\" He shook his head, slowly. \"If anybody was finding him a place to live, that week, it would be somebody like that. Somebody you'd let choose for you, when you were more frightened than you'd ever been.\"</p>\n<p>\"If,\" I said.</p>\n<p>\"If,\" he agreed.</p>\n<p>\"And you haven't gone to see him.\"</p>\n<p>\"No,\" I said. \"Not yet.\"</p>\n<p>He looked at me, and I saw him work out why, and smile, a little.</p>\n<p>\"Who was driving,\" he said.</p>\n<p>\"That's exactly what I said.\"</p>\n<p>\"Of course it is.\" He touched the pocket of the folded cardigan beside him. \"Freda wrote again.\" \"She writes a very good letter. Short. She doesn't waste words.\" He looked at me sideways. \"She says her father fixed your kitchen tap.\"</p>\n<p>I felt my face go hot.</p>\n<p>\"It's dripped for nine years,\" I said. \"Since he left, actually. He knew exactly what was wrong with it. He had it fixed in twenty minutes. With a part he'd brought with him, in his pocket, because he remembered.\"</p>\n<p>\"And you checked it.\"</p>\n<p>\"Afterward. Yes. Twice.\"</p>\n<p>\"And?\"</p>\n<p>\"It doesn't drip,\" I said.</p>\n<p>He laughed. He laughed until he had to hold onto the rail, there on the bench in the first warm sun of May, and after a moment, I did too.</p>\n<p class=\"break\">&#10043;</p>\n<p>He didn't go in, that day. Neither did I. We did the whole of session twenty-eight on the porch, the recorders on the little table between us, with the field going green in front of us and the birds back at the feeder, and he didn't tell me about New York. Not yet. He said he wanted to think about where to start. He said there were people in it he hadn't thought about properly in a very long time, and he wanted to do them justice.</p>\n<p>So instead he told me about the boy on the pier. About Bertie. What happened to him after the bag and the street door and the rain, which he had said was another Thursday, and which turned out to be this one.</p>\n<p>Bertie had his wages, less a fine, a canvas bag, and no character from the company. He still had the shilling Stan had given back. He also had an envelope he hadn't known about. Evans had pushed it into his hand at the crew gangway on the Friday morning, when they put him ashore, without a word, and gone back up the plank before Lyle could see. Inside was a note in Evans's square chapel handwriting, addressed to a widow in Brooklyn who kept a clean house for seamen and sang in a Welsh choir. <em>This boy is honest,</em> it said. <em>I would stake my place on it.</em> That was all. It was the only character Bertie Pike ever had from that ship, and it was worth more than the one he'd lost.</p>\n<p>The widow took him in. By June he was carrying bags in a hotel in Manhattan, in a uniform with even more buttons, and sending most of his wages home every month to the two rooms off the Stanley Road. He wrote one other letter that first week, to a woman in Ohio, care of one of the magazines Hatch had written for. He told her that her brother had been kind to a bell boy nobody else spoke to, and had been writing down what people told him because he thought somebody ought to, and that the last thing he had said to Bertie was <em>good boy.</em> He didn't tell her anything else. She wrote back. He kept her letter.</p>\n<p>He went home the next spring, in steerage, on a ticket he'd paid for himself, and his mother met him at the landing stage with Agnes on her hip, over the croup. The letters he'd sent her all that year talked about the hotel, and the weather, and the price of boots. They never once mentioned the Carpathia. She believed to the end of her life that he'd left the Cunard Company for better money, and he let her.</p>\n<p>\"That's what I meant,\" he said. \"By the best of it.\"</p>\n<p>At three he said that was enough. He stood up, slowly, with his hand on the rail, and picked up the cardigan, and the card from the bench, and held them both.</p>\n<p>\"Next Thursday, Ms. Barnett,\" he said.</p>\n<p>\"Next Thursday.\"</p>\n<p>I went down the steps. At the bottom I turned around, because I had nearly forgotten.</p>\n<p>\"Should I bring the coat?\" I said. \"For New York.\"</p>\n<p>He looked at me from the top of the steps, in his shirtsleeves, with the card in his hand, and the sun on him, and the empty frame on the mantel behind him through the open door, its glass polished clean, still waiting.</p>\n<p>\"No,\" he said. \"You won't need the coat for this one.\" He smiled. \"It was summer. And everybody was lying.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>End of Book Two</em></p>", "audio": false, "added": 1790946885832, "pt": [1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790951242617, 1790951242617, 1790951242617, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790948775374, 1790953529797, 1790956055641, 1790953895325, 1790953529797, 1790953529797, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790946885832, 1790951242617, 1790946885832]}, {"num": 27, "title": "Facts", "extra": true, "html": "<p>The Carpathia sailed from New York on Thursday, April 11, 1912, bound for the Mediterranean and Fiume, with about 740 passengers: American tourists in first class and emigrants going home to Hungary and Croatia in third.</p>\n<p>Her only wireless operator, Harold Cottam, was twenty-one. Just after midnight on April 15 he had been up to the bridge to report the day's messages to the officer of the watch, and had come back to his cabin and started getting ready for bed, with his headphones on while he waited for another ship, the Parisian, to confirm a message. The two ships had exchanged signals on and off that evening, \"merely to keep in touch,\" he told the British inquiry. He had been listening to the Cape Cod station, which had messages for the Titanic, and he called the Titanic to tell her they were waiting. The answer came back: \"Come at once. We have struck a berg. It's a CQD, old man.\"</p>\n<p>Captain Arthur Rostron told the Senate inquiry: \"the wireless operator was in his cabin, at the time, not on official business at all, but just simply listening as he was undressing. He was unlacing his boots at the time. He had this apparatus on his ear, and the message came. That was the whole thing. In 10 minutes, maybe he would have been in bed, and we would not have heard the messages.\"</p>\n<p>Rostron was angry at being woken, then turned the ship within minutes. He shut off the heat and hot water so all the steam went to the engines, posted extra lookouts, put a doctor in each of the three dining saloons, an Englishman, an Italian and a Hungarian, and had chair slings and canvas ash bags ready at the gangways to lift up the people who could not climb, and the children. His crew called him the Electric Spark. He was seen to raise his hand to his cap and pray while he gave orders, and later said, \"I can only conclude another hand than mine was on the helm.\"</p>\n<p>The Carpathia ran fifty-eight miles through the ice in the dark, firing rockets as she came. Rostron believed she made well over her rated fourteen knots; just how much is still argued. The first boat, No. 2, came alongside at about ten past four. Its officer, Joseph Boxhall, told Rostron the Titanic had gone down at 2:20. The last boat, No. 12, came in at about half past eight, overloaded, with Second Officer Charles Lightoller the last survivor up the ladder. The Californian arrived as the rescue was ending. The British inquiry concluded that her officers had seen the Titanic's rockets in the night and that she might have saved many lives; her wireless operator had gone to bed. Her captain, Stanley Lord, disputed that for the rest of his life.</p>\n<p>The Carpathia's passengers gave up their cabins and their clothes, and sewed coats for the children out of the ship's blankets.</p>\n<p>Four people who died in the boats or soon after were buried at sea at four o'clock that afternoon. One of them has never been identified.</p>\n<p>Harold Bride, the Titanic's junior wireless operator, had his feet crushed and frozen. He was carried to the Carpathia's wireless cabin and helped Cottam send the names of the survivors. Rostron testified that two official messages went first, to Cunard and to the White Star Line, then one message to the Associated Press, then the names. Newspapers asking for more got nothing. The papers reported that inquiries made for President Taft about his aide, Major Archibald Butt, who was lost, went unanswered. Rostron told the Senate that his purser remembered a reply going back: \"Not on board.\"</p>\n<p>The Carpathia met thick fog near the Nantucket shoals and groped through it for hours at slow speed, sounding her whistle. It lifted on Thursday afternoon, and at six she passed the Sandy Hook lightship.</p>\n<p>She came up the river at about half past nine on the night of April 18, in a cold driving rain, through a crowd of tugs full of reporters shouting offers through megaphones. Rostron let none of them aboard. She went first to the White Star pier and lowered the Titanic's lifeboats, then to the Cunard pier, Pier 54, where tens of thousands of people were waiting.</p>\n<p>The United States Senate opened its inquiry the next morning at the Waldorf-Astoria. Rostron testified on the first day. Cottam sold his story to the New York Times for $750.</p>\n<p>The Seikilos song was carved on a marble column as a memorial, probably in the first century, at Tralles, near what is now Ayd\u0131n in Turkey. William Ramsay found it in 1883. It is the oldest complete song that survives, its notes and words together. It begins: \"While you live, shine.\"</p>", "audio": false, "added": 1790946885832, "pt": [1790946885832, 1790951242617, 1790946885832, 1790946885832, 1790951242617, 1790946885832, 1790946885832, 1790948775374, 1790946885832, 1790946885832, 1790948775374, 1790951242617]}];
const $ = (id) => document.getElementById(id);
const main = $("main");
const store = {
  get(k, d) { try { const v = localStorage.getItem("wyl2." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wyl2." + k, JSON.stringify(v)); } catch {} },
};

// settings
function applySize() { document.documentElement.style.setProperty("--size", store.get("size", 20) + "px"); }
function applyTheme() {
  const t = store.get("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
applySize(); applyTheme();
document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
  store.set("size", Math.min(28, Math.max(15, store.get("size", 20) + Number(b.dataset.size)))); applySize();
});
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.theme); applyTheme(); });
$("aaBtn").onclick = (e) => { e.stopPropagation(); $("sheet").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!$("sheet").contains(e.target)) $("sheet").classList.remove("open"); });

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="book">by ${BOOK.author}</div>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
    ${coverFixes()}
    ${shelf()}
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();
  main.querySelectorAll(".fixes [data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
}
// Every book in the series, so the cover doubles as the home screen: pick a book. Book 1 is the site root, Book 2 lives in cqd/.
const SERIES = [{ n: 1, title: "Sic Semper", path: "" }, { n: 2, title: "CQD", path: "cqd/" }];
function shelf() {
  const root = BOOK.number === 1 ? "./" : "../";
  return `<div class="shelf"><div class="lbl">The books</div>${SERIES.map(s =>
    `<a href="${root + s.path}"${s.n === BOOK.number ? ' class="here"' : ""}><span class="n">Book ${s.n}</span><span>${s.title}</span></a>`).join("")}</div>`;
}
function toc() {
  main.innerHTML = `<section class="toc"><button class="tohome" id="toHome">&larr; Home &middot; all books</button><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.extra ? "" : c.num}</span><span>${c.title}</span>${c.audio ? `<span class="hasaudio" title="Has audio">&#127911;</span>` : ""}${badge(c)}</button></li>`).join("")}</ol></section>`;
  $("toHome").onclick = () => cover();
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter${c.extra ? " extra" : ""}">
    <header><div class="num">${c.extra ? "" : "Chapter " + c.num}</div><h2>${c.title}</h2>${c.audio ? `<button class="listen" id="listenBtn">&#9654;&#xFE0E;&nbsp; Listen</button>` : ""}</header>
    <div id="fixbarSlot"></div>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  markFixes(c);
  listenHook(c, next);
  $("where").textContent = c.extra ? c.title : `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();
$("where").onclick = () => cover();  // the chapter name in the bar goes home, to the cover and its book picker

  "George (British)", "Lewis (British)", "Daniel (British)", "Fable (British)", "Michael (current)",
  "Lewis, American", "9 + Lewis, American", "Lewis + Onyx, American, slower",
  "NEW model: its own voice", "NEW model: in 9's voice", "NEW model: 9's voice, calmer", "TURBO new model: 9's voice", "IOLA on the new model", "IOLA now (for comparison)"];
const vClip = new Audio();
function voicePicker(c) {
  return;  // the voice audition was Book 1 only
  const box = document.createElement("div");
  box.className = "voices";
  box.innerHTML = `<div class="vt">Tom's voice: tap to hear</div>` + VOICES.map((v, i) =>
    `<button data-v="${i + 1}" title="${v}">${i + 1}</button>`).join("") + `<div class="vn" id="vName">&nbsp;</div>`;
  main.querySelector(".chapter header").appendChild(box);
  box.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    box.querySelectorAll("[data-v]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    $("vName").textContent = `${b.dataset.v}. ${VOICES[b.dataset.v - 1]}`;
    vClip.src = `audio/samples/tom/s${b.dataset.v}.mp3`;
    vClip.play();
  });
}

// Narration: one mp3 per chapter (audio/chNN.mp3) + audio/chNN.json, the start time of each paragraph.
// The paragraph being read is highlighted and kept on screen; at the end it carries on into the next chapter.
const player = document.createElement("div");
player.id = "player";
player.innerHTML = `<button id="pBack" aria-label="Back 15 seconds">&#8634;</button><button id="pPlay" aria-label="Play or pause">&#10074;&#10074;</button>
  <button id="pFwd" aria-label="Forward 15 seconds">&#8635;</button><span class="t" id="pTime"></span><button id="pStop" aria-label="Stop">&#10005;</button>`;
document.body.appendChild(player);
const audio = new Audio();
audio.preload = "auto";
let aCh = null, aMarks = [], aNext = null, aFollow = true, lastPara = -1;
const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function paraEls() { return [...main.querySelectorAll(".chapter > p:not(.end)")]; }
function listenHook(c, next) {
  if (aCh !== c.num && !audio.paused) audio.pause();
  if (aCh !== c.num) { player.classList.remove("on"); lastPara = -1; }
  const b = $("listenBtn");
  if (b) b.onclick = () => startListen(c, next);
  if (aCh === c.num) aNext = next;
}
async function startListen(c, next, fromStart) {
  if (aCh !== c.num) {
    aCh = c.num; aNext = next; lastPara = -1;
    const nn = String(c.num).padStart(2, "0");
    try { aMarks = (await (await fetch(`audio/ch${nn}.json?v=${BUILD}`)).json()).paras; } catch (e) { aMarks = []; }
    audio.src = `audio/ch${nn}.mp3?v=${BUILD}`;
    const saved = store.get("listen", null);
    audio.currentTime = !fromStart && saved && saved.ch === c.num ? saved.t : 0;
  }
  aFollow = true;
  player.classList.add("on");
  audio.play();
}
audio.addEventListener("play", () => $("pPlay").innerHTML = "&#10074;&#10074;");
audio.addEventListener("pause", () => $("pPlay").innerHTML = "&#9654;&#xFE0E;");
audio.addEventListener("timeupdate", () => {
  const t = audio.currentTime;
  $("pTime").textContent = `${fmtT(t)} / ${fmtT(audio.duration || 0)}  \u00b7  ${AUDIO_V}`;
  store.set("listen", { ch: aCh, t });
  let i = -1;
  for (let k = 0; k < aMarks.length; k++) if (aMarks[k] <= t + 0.1) i = k; else break;
  if (i === lastPara) return;
  lastPara = i;
  const ps = paraEls();
  ps.forEach(p => p.classList.remove("reading"));
  const p = ps[i];
  if (!p) return;
  p.classList.add("reading");
  if (aFollow) {
    const r = p.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 90) window.scrollTo(0, window.scrollY + r.top - innerHeight * 0.25);
  }
});
audio.addEventListener("ended", () => {
  store.set("listen", { ch: aCh, t: 0 });
  if (aNext && aNext.audio) { const n = aNext; aCh = null; go(n.num, 0); startListen(n, CHAPTERS[CHAPTERS.indexOf(n) + 1], true); }
  else player.classList.remove("on");
});
$("pPlay").onclick = () => audio.paused ? (aFollow = true, audio.play()) : audio.pause();
$("pBack").onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 15);
$("pFwd").onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
$("pStop").onclick = () => { audio.pause(); player.classList.remove("on"); paraEls().forEach(p => p.classList.remove("reading")); lastPara = -1; };
// scrolling by hand stops the page from following until play is pressed again
window.addEventListener("touchmove", () => { if (!audio.paused) aFollow = false; }, { passive: true });
window.addEventListener("wheel", () => { if (!audio.paused) aFollow = false; }, { passive: true });


// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });


// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
// Book 2 keeps its notes apart from Book 1's: same key, "-cqd" on the end. A reader who opened Book 1 with ?c= is already signed in here.
const CKEY = (() => { let k = store.get("ckey", null); if (!k) { try { k = JSON.parse(localStorage.getItem("wyl.ckey")); } catch {} } return k ? k + "-cqd" : null; })();
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}
function openCmt(ch, p, text) {
  if (staleV) { showStale(); return; }
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");
  $("cmtText").value = ""; $("cmtStatus").textContent = "";
  renderOld();
  $("cmt").classList.add("open");
}
$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString(), v: BUILD };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// ---- fixed since you last looked (pencil readers only) ----
// Each paragraph carries the build time its text last changed (c.pt). "seen" is, per chapter,
// the newest change the reader has acknowledged. A chapter they've never opened is NEW.
// "seen" is kept per review round, so starting a round (or moving it back) shows its boxes fresh on every device.
const SEEN_KEY = "seen-" + ROUND;
function seenAt(num) { return store.get(SEEN_KEY, {})[num] || ROUND - 1; }
function setSeen(num, t) { const s = store.get(SEEN_KEY, {}); s[num] = Math.max(s[num] || 0, t); store.set(SEEN_KEY, s); }
function isFix(c, t) { return t >= ROUND && t > Math.max(seenAt(c.num), c.added); }
function fixCount(c) { return c.pt.filter(t => isFix(c, t)).length; }
function isNew(c) { return c.added > seenAt(c.num); }
function badge(c) {
  if (!CKEY) return "";
  if (isNew(c)) return `<span class="tag new">New</span>`;
  const n = fixCount(c);
  return n ? `<span class="tag">${n} fixed</span>` : "";
}
function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">${c.extra ? c.title : "Ch " + c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => isFix(c, c.pt[i]));
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} changed in the latest round of fixes, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
</body>
</html>
