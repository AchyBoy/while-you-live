<script>
const BUILD = 1790944448385;
const AUDIO_V = "";
const ROUND = 0;  // only paragraphs changed at or after this build are boxed
const BOOK = {"series": "While You Live", "title": "CQD", "number": 2, "author": "Andrew F. Young"};
const CHAPTERS = [{"num": 1, "title": "The Neighbor", "extra": false, "html": "<p>The coat was at the back of the hall closet, behind Freda's old soccer bag and a vacuum cleaner that had not worked since the fall.</p>\n<p>It was a good coat. Long, dark green wool, with a hood that folded away into the collar and pockets deep enough for two notebooks and a recorder. I had bought it the winter I started working on the Carrow House story, because I was going to be standing in a lot of parking lots, and I had worn it every day until the story ran. After that I had hung it up and not taken it down again. I had not been going anywhere that needed it.</p>\n<p><em>Bring a warmer coat,</em> he had said.</p>\n<p>I took it off the hanger and held it up to the light in the hall. There was a moth hole in one sleeve and a button hanging by a thread, and it smelled of the closet. I put it on anyway, over my sweatshirt, and stood in front of the mirror on the bathroom door. A woman of forty-four in a coat she had bought at thirty-eight, looking about as surprised as you would expect.</p>\n<p>It still fit. I was not sure how I felt about that.</p>\n<p class=\"break\">&#10043;</p>\n<p>If you do not know me, here is how I came to be standing in a hall closet on a Sunday night, thinking about the North Atlantic.</p>\n<p>My name is Iola Barnett. I used to be a reporter. Six years ago I broke a story about forged letters being sold as genuine at Carrow House, the old auction house downtown, and three days after it ran, the man who had given me the story disappeared. Without him, nobody believed a word of it. The paper printed a correction and let me go. Since then I have written whatever people pay me to write: gutter guards, dentists, houses that need to sound bigger than they are.</p>\n<p>Last fall a law firm called Aldine, Mercer and Voss wrote to me on behalf of a client who would not give his name. The client wanted me to drive two hours north every Thursday and record the memories of an old man who lived alone in a small house full of books. He paid three thousand dollars a session, more than I had made in a month in years. The old man's name, as far as anybody knew, was Tom Hale. He was somewhere in his seventies. He told me, on the first day, that he remembered 1865.</p>\n<p>He did not mean that he had read about it. He meant that he had been there. That he had woken up one July afternoon in 1864 in the body of a wounded Confederate soldier outside Washington, and had lived in that body for a year, and had been in the city the night Lincoln was shot. He said it had happened to him a great many times, in a great many places. He said he did not know why.</p>\n<p>I did not believe him. I want to be clear about that. I spent eighteen Thursdays not believing him, and checking everything he said, and finding that everything he said checked out. In the end I went to the Library of Congress and found a letter in a box nobody had asked for in twenty-two years. It matched what he had told me, line for line, and he had never seen it. I had a copy of it in a folder in my bag. I had meant to show it to him last Thursday, and I had not, because of the card.</p>\n<p>The card had come by courier on a Monday night, in the client's own hand. That hand had started to shake. There was one line on it.</p>\n<p><em>Please ask him about the Carpathia.</em></p>\n<p>The Carpathia was the ship that picked up the survivors of the Titanic, in April of 1912. In eighteen weeks he had never said a word about it to me, and I had the transcripts to prove it. When I read him the card he sat for forty seconds without moving, which I know because I counted. Then he said he had never told a living soul where he was in April of 1912. Then he said yes. He had been there.</p>\n<p>And then he told me to bring a warmer coat.</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda was at the kitchen table when I came back through, with her laptop open and a pair of big white headphones on, typing.</p>\n<p>She was sixteen. She had her father's height and, lately, a habit of looking up at me as if I had walked into the wrong room. She had started typing my transcripts that week. It had been her idea. Ever since the night I told her about the letter in the archive, she had been asking about him, and on Friday she had heard me complain that it took me three hours to type up every hour of tape, and she had said, without looking up from her phone, that she could do it in two, and that she would do it for fifteen dollars an hour, and that I should think about it. I had thought about it for about a minute. It was the best deal anyone had offered me in six years, and it kept her at the kitchen table on a Sunday night, where I could see her.</p>\n<p>She was doing last Thursday's tape. Her first one, the Carpathia tape. It was a short one. Most of it was snow.</p>\n<p>I put the kettle on and watched her. She typed fast and very straight, with her shoulders up around her ears. Every so often she stopped, and pressed one finger to the headphones, and went back a few seconds, and listened again.</p>\n<p>They were new, the headphones. I noticed it the way you notice a new picture on a friend's wall. Big and white and soft at the ears, the kind that closed out the world. The old ones had been a pair of my earbuds with one side that only worked if you held the wire at an angle.</p>\n<p>\"Those are nice,\" I said.</p>\n<p>She took one side off. \"What?\"</p>\n<p>\"The headphones.\"</p>\n<p>\"Oh.\" She looked at them as if she had forgotten they were on her head. \"Maddie's sister was getting rid of them. She got new ones.\"</p>\n<p>\"That was nice of her.\"</p>\n<p>\"She's nice.\" Freda put the side back on, and then took it off again. \"He sounds really different on this one.\"</p>\n<p>\"Who does?\"</p>\n<p>\"Him. Mr. Hale.\" She turned the laptop so I could see the screen, though there was nothing on it but the words. \"On the bits you play me, he talks like he's reading you a book. He's never in a hurry. On this one he's like...\" She looked for it. \"He's like somebody who just found out his house got broken into.\"</p>\n<p>I had been in the room. I had not thought of it like that. I had thought he sounded frightened, and I had not let myself write the word down.</p>\n<p>\"He was surprised,\" I said.</p>\n<p>\"He's never surprised. That's his whole thing.\" She pulled the laptop back. \"Who's the client, really?\"</p>\n<p>\"I don't know.\"</p>\n<p>\"You must have some idea.\"</p>\n<p>\"I've got lots of ideas. None of them are any good.\"</p>\n<p>\"Somebody who knows about the boat,\" Freda said, \"when nobody's supposed to know about the boat.\" She put the headphones back on. \"So it's either somebody he told and forgot he told, or somebody who was on the boat.\"</p>\n<p>\"Nobody who was on that boat is still alive.\"</p>\n<p>Freda typed for a moment.</p>\n<p>\"Nobody who was at Ford's Theatre is still alive either,\" she said, without looking up. \"And you're still driving up there.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>That night, after she had gone to bed, I sat at the kitchen table with the coat on the back of my chair and did what I had been putting off all week.</p>\n<p>I opened the transcript from the sixth week. Not the Lincoln parts. The lunch.</p>\n<p>It was the day he had made the soup, back in the fall, and asked me about myself, and I had told him the whole Carrow House story, badly and out of order. I had typed it up that night the same as everything else, because the client wanted all of it. I had never read it back. I did not like reading my own voice telling that story. It sounded like every crank who had ever called a newsroom.</p>\n<p>I read it back now, slowly, with a pencil.</p>\n<p>The diner. The grilled cheese and the tomato soup he always ordered and never ate. The laundromat. The building where my source lived, a brick walk-up over a dry cleaner's. Petrakis, the landlord, who complained about everything. The steam that came up through the floor in the mornings, so the whole building smelled of hot cotton.</p>\n<p><em>A woman on the second floor called Petrakis about noise so often that he had stopped answering her.</em></p>\n<p>I put the pencil on that line and left it there.</p>\n<p>All winter I had been going over the same few facts, the way you turn over a stone in your pocket until it is smooth. The cat shut in the bedroom, because somebody was at the door. The family photographs still on the wall. The two banker's boxes of papers gone from the closet by the door, and not a word about them in the police report. He had put it together for me, at his kitchen table, a few weeks ago. My source had not run. He had opened his door to somebody he knew. And somebody had left with his papers.</p>\n<p><em>Who was at the door?</em></p>\n<p>I had written that on the back of an envelope the night I drove home, and I had looked at it every day since, and I had not done one useful thing about it. I had decided it had been six years. That the dry cleaner's was a smoothie place now. That Petrakis had sold the building and moved in with his daughter in Silver Spring, and that the police had never cared, and that nobody remembered a knock on a door on a Wednesday morning six years ago. I had asked the police for the whole file, the officer's notes and the photographs and anything else behind those two thin pages, and that was all I had done, and the police had not answered.</p>\n<p>But somebody might. A woman who called the landlord so often about noise that he stopped picking up was a woman who listened. She listened through her ceiling, every day, to a building full of other people's lives. She had lived one floor below him. If anyone in the world had heard that door, it was her.</p>\n<p>And I had known she existed for six years. I had made a joke about her at lunch. I had never once asked her name.</p>\n<p class=\"break\">&#10043;</p>\n<p>Petrakis answered on the fourth ring, and I could hear a television behind him, very loud.</p>\n<p>\"The reporter,\" he said, when I told him who it was. He did not sound pleased, but he did not sound displeased either. Petrakis sounded the same about everything. \"You called about the cat.\"</p>\n<p>\"In the fall. Yes. You were a big help.\"</p>\n<p>\"The cat was a good cat.\" He said something away from the phone, in Greek, and the television got quieter. \"What now? I don't own that building anymore. I told you. Smoothies.\"</p>\n<p>\"I'm not calling about the building. I'm calling about one of your tenants. There was a woman on the second floor, when he lived there. She used to call you about the noise.\"</p>\n<p>There was a pause. Then Petrakis laughed, a short, unhappy bark.</p>\n<p>\"Dunleavy.\"</p>\n<p>\"Is that her name?\"</p>\n<p>\"Mrs. Dunleavy. Second floor, front. Thirty years she lived in that building, and for thirty years she called me.\" He was warming up now. I could hear it. \"The radiator. The pipes. The man upstairs walks too heavy. The dry cleaner's machine starts too early. A dog barks on the street, she calls me, like I own the street. Every day. Some days twice. I had to get a second phone.\"</p>\n<p>\"Is she still living?\"</p>\n<p>\"Still living? She will outlive us all. Out of spite.\" He paused. \"She moved when I sold. Before, even. Went to live with her son, out in Frederick somewhere. I don't have the address. I didn't want the address.\"</p>\n<p>\"Do you remember her first name?\"</p>\n<p>\"Why do you want Mrs. Dunleavy?\"</p>\n<p>I thought about how to answer that. Petrakis had been kind to me, in the fall, in his way. He had remembered the cat's name for me after six years, when I could not.</p>\n<p>\"Because she lived right under him,\" I said. \"And I think she heard everything.\"</p>\n<p>The line was quiet for long enough that I thought we had been cut off. Behind him the television murmured. Somebody on it was winning a car.</p>\n<p>\"Eileen,\" Petrakis said. \"Eileen Dunleavy. She was a widow. Her husband drove a bus.\" Then, grudgingly, as if it cost him money to say it: \"She heard everything. That is true. You could not cough in that building without Mrs. Dunleavy telling me what kind of cough it was.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>It was after midnight when I went to hang the coat back up, and that was when I found the receipt.</p>\n<p>It was in the right-hand pocket, folded small, soft as cloth from six years of nothing. I almost threw it away without looking. Then I unfolded it under the hall light.</p>\n<p><em>Grilled cheese 6.50. Tomato soup cup 3.25. Coffee 2.00.</em></p>\n<p>It was from the diner. From one of the winter meetings, the long ones, when he talked and I wrote and the food went cold in front of him. He had ordered it the way he always did, and pushed it a little away from himself, and never touched it, and I had paid, the way I always did, because I was the one with the expense account and he was the one taking the risk.</p>\n<p>I stood in the hall for a long time.</p>\n<p>Then I took the coat off the hanger again and put it over the back of the kitchen chair, where I would not forget it on Thursday, and I put the receipt in my notebook, and on a clean page under it I wrote:</p>\n<p><em>Eileen Dunleavy. Second floor, front. Son in Frederick.</em></p>\n<p><em>She heard everything.</em></p>\n<p>I did not underline anything. I did not have to. Down the hall, under Freda's door, there was still a line of light, and very faintly, through the door and the headphones both, I could hear my daughter laughing at something on her phone. It was the low, careful laugh she saved for friends, and I did not know which friend, and I went to bed.</p>", "audio": false, "added": 1790941967366, "pt": [1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790943066980, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790943066980, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366, 1790941967366]}, {"num": 2, "title": "The Warmer Coat", "extra": false, "html": "<p>The snow had gone to rain by Thursday, and the gravel road up to his house had gone to mud.</p>\n<p>I took it slowly, in second gear, with the wipers going and the coat on the passenger seat beside me, folded, like a passenger who had not decided yet whether to come in. The field beyond the house was brown again, with white still lying in the furrows where the sun did not reach. The old blue pickup was where it always was. Smoke came out of the chimney and lay down flat across the roof in the wet.</p>\n<p>He was at the window. He was always at the window. By the time I had parked he was on the porch, with the big umbrella open, coming down the steps one at a time with his free hand on the rail.</p>\n<p>I put the coat on in the car, which is harder than it sounds, and got out.</p>\n<p>He stopped at the bottom of the steps and looked at me. It was a short look, and a thorough one. He took in the hood folded into the collar, and the button hanging by its thread, and the moth hole in the sleeve that I had tried to hide by holding my bag on that arm. Then he smiled, the smile that took ten years off him.</p>\n<p>\"Good,\" he said. \"That's a working coat.\"</p>\n<p>\"It's an old coat.\"</p>\n<p>\"It's both.\" He held the umbrella over me, though I was already wet. \"You bought it for standing about outside in, and you stood about in it a great deal, and then one day you stopped. The pockets have gone out of shape from the notebooks, and the hem is worn on the right side where your bag hangs. You haven't worn it in a long time. It smelled of the closet when you got out of the car. It still does, a little.\" He turned toward the house. \"I'm glad you brought it. Come in. The kettle's on.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>The house was warm, and smelled of woodsmoke and wet wool and something baking. There was a loaf on the kitchen counter in a paper bag from the town bakery, with a hand-lettered sign taped to the bag: <em>LAST WEEK. THANK YOU FOR 61 YEARS.</em></p>\n<p>\"They're closing,\" I said.</p>\n<p>\"Saturday.\" He put the tea things on the tray. \"The grandchildren didn't want it. I bought two loaves. I'll put one in the freezer and feel sorry for myself in June.\" He carried the tray through to the living room. \"You'll have to tell me how your week was. Before we start.\"</p>\n<p>He asked it every Thursday, and every Thursday I had given him the short answer, because I was being paid to listen and not to talk. This Thursday I sat down in the chair that did not eat people and gave him the long one.</p>\n<p>I told him about the transcript from the sixth week, and the line I had put my pencil on. The woman on the second floor. I told him that I had called Petrakis, and that Petrakis had called her a name I would not write down, and then given me her real one. Eileen Dunleavy. A widow, whose husband had driven a bus. Thirty years in that building. Gone to her son's, out near Frederick.</p>\n<p>\"Frederick,\" he said. \"You drove past it this morning.\"</p>\n<p>\"I know.\"</p>\n<p>\"Are you going to find her?\"</p>\n<p>\"I'm going to try.\" I put my cup down. \"I don't know what I expect her to tell me. It was six years ago. She heard everything in that building, every day, for thirty years. Why would she remember one Wednesday?\"</p>\n<p>He was quiet for a moment. He had the notepad on his knee and the pencil in his hand, but he was not drawing.</p>\n<p>\"Ms. Barnett,\" he said. \"Petrakis stopped answering her.\"</p>\n<p>\"He got a second phone. He told me.\"</p>\n<p>\"So for some years, every time Mrs. Dunleavy heard something wrong through her ceiling, she picked up the phone and called the man whose job it was to fix it, and he didn't pick up.\" He tilted his head. \"What does a woman do, when she knows something and nobody will listen to her?\"</p>\n<p>I did not answer at once, because I knew the answer, and I did not much like where it came from.</p>\n<p>\"She writes it down,\" I said.</p>\n<p>\"With the date,\" he said. \"And the time. So that one day, when somebody finally asks, she can prove it.\" He looked at me over his cup. \"You did exactly that. You have a box at the top of a closet that says so. I would be very surprised if Mrs. Dunleavy hasn't got one too.\"</p>\n<p>I sat back. Outside the rain had picked up, and it ran down the window in long uneven lines.</p>\n<p>\"There's something else,\" I said. \"I didn't tell you last week. There wasn't time, after the card.\"</p>\n<p>I told him about the movers. The small outfit from across the river, still in business, with the woman on the phone who said they kept their job sheets for seven years. The job booked by phone eleven days before my source disappeared, with a cash deposit. And the line for the new address, left blank, with a note written beside it in somebody's hand: <em>Customer to call with address.</em></p>\n<p>\"He never called,\" I said.</p>\n<p>He did not say anything for a long moment. The pencil lay still on the pad.</p>\n<p>\"Eleven days,\" he said at last. \"He booked a truck to take everything he owned out of that apartment, eleven days before a Saturday. And he didn't know where it was going.\"</p>\n<p>\"He told me he was going to move after the story ran. Somewhere Carrow couldn't find him.\"</p>\n<p>\"Yes. But a man who is going somewhere knows where it is. He's chosen it, he's paid a deposit on it, he's carried a box of dishes up its stairs in his head a hundred times. Your man had a truck and no address.\" He turned the pencil over in his fingers. \"So either he was going to decide at the last minute, which doesn't sound like a man who kept copies of everything. Or somebody else was finding him the place. And he was waiting to be told.\"</p>\n<p>\"Somebody he trusted.\"</p>\n<p>\"Somebody he trusted enough to let them choose where he would live,\" he said, \"when he was more frightened than he had ever been.\" He looked toward the window. \"Which is a great deal of trust, Ms. Barnett. It's more than most people give anyone.\"</p>\n<p>I wrote it down. I wrote, <em>Somebody finding him a place?</em> and, under it, <em>Same person at the door?</em> and then I looked at what I had written and did not like it at all.</p>\n<p class=\"break\">&#10043;</p>\n<p>At ten past eleven I set the recorders on the little table between us, my phone and the small digital one that had been with me for eleven years, and pressed the buttons and said the date into them, and the time, and <em>Session nineteen.</em></p>\n<p>Then I looked at him and waited. It was his turn.</p>\n<p>\"April 1912,\" he said. \"I was twelve.\"</p>\n<p>I laughed. I did not mean to. It came out of me before I could stop it, a short surprised sound, and I saw it go across the room and land on him, and I was sorry at once.</p>\n<p>He didn't laugh.</p>\n<p>\"I'm sorry,\" I said. \"I didn't...\"</p>\n<p>\"No. It's all right.\" He had not taken offense. He looked, if anything, a little amused at himself. \"It's a strange thing to hear. It was a strange thing to be.\"</p>\n<p>\"I assumed,\" I said, and stopped, and tried again. \"I suppose I'd assumed you'd still be Kit. He'd have been, what. Sixty-seven?\"</p>\n<p>\"He would.\" He looked down at the pad. \"Kit didn't see the new century. He had a good deal more life than he expected, after 1865, and a good deal less than he wanted. That's another Thursday.\" He turned the pencil around in his fingers, once. \"There were others in between, and they're other Thursdays too. In the spring of 1912 I was very small. I was a boy on a ship, in a uniform with too many buttons, and I had been one for about three weeks when the part I want to tell you about began.\"</p>\n<p>\"A boy.\"</p>\n<p>\"A bellboy. On the Carpathia.\" He said the name carefully, as if it were something he had kept wrapped up a long time and was not sure would still be whole. \"A Cunard ship. Not a famous one, not a fast one. Steady. She went back and forth between New York and the Mediterranean with whoever wanted to go, and that spring it was mostly American ladies going to see Italy, and families going home to Hungary. I carried their bags. I ran their messages. I said <em>sir</em> and <em>madam</em> about four hundred times a day.\"</p>\n<p>\"At twelve.\"</p>\n<p>\"At twelve. Boys went to sea younger than that, not so long before.\" He looked at me. \"You're wondering what it's like.\"</p>\n<p>I was. I had not been going to ask. I had been going to keep to the things that could be checked, as I always did, and leave the rest for him.</p>\n<p>\"Yes,\" I said.</p>\n<p>\"It's like being a grown man locked inside a cupboard,\" he said, \"who can see out through the keyhole and is not allowed to speak above a whisper. Everything you know is still in there with you. Nobody on the outside wants any of it. A boy who tells a ship's officer what he ought to do gets a clip round the ear and an extra watch, and he deserves both.\" He smiled a little. \"The first few weeks of that life, I was very angry. Then I remembered something I had learned a long time before, and had to learn again every time it happened.\"</p>\n<p>\"What?\"</p>\n<p>\"When you're small, you don't push. You can't. There's nothing to push with.\" He set the pencil down on the pad. \"So you make the best of what is in front of you. You find out what a small boy can do that a grown man can't. And it turns out, Ms. Barnett, that it's a great deal more than you would think.\"</p>\n<p>\"Such as?\"</p>\n<p>\"Such as nobody ever looks at him.\" He picked the pencil up again, and began, without looking down, to draw. \"A grown man walks into a room, and every person in it decides what he's there for. A boy with a tray walks into the same room, and nobody decides anything. He's furniture. He can stand by the door for ten minutes and hear everything said in that room, and if anyone notices him at all, they ask him for more hot water.\" The pencil moved. \"I heard more on that ship, in four days, than I heard in a year at the National Hotel.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I was going to ask him about the four days. I had the question ready. I had looked up the dates on Sunday night, and I knew the Carpathia had picked up the survivors on a Monday morning and come into New York on the Thursday night, and I was going to ask him where he had been on the Sunday, before any of it.</p>\n<p>But I was looking at the notepad.</p>\n<p>I had seen him draw on it every Thursday for nineteen weeks. The first day, I had even looked properly. I remembered thinking it was the kind of thing people do on the phone. One shape, over and over, gone over so many times that the lead shone. I had noticed it, and noted it, and then it had become part of him, like the cardigan buttoned wrong and the tea gone cold. I had stopped seeing it. You stop seeing anything you see every week.</p>\n<p>A five-pointed star, drawn in one long line, without the pencil ever leaving the paper. And in each of the five points, a tiny letter, crowded in. Greek, I had thought, that first day. Or something like it.</p>\n<p>I had seen that star somewhere else.</p>\n<p>I had seen it ten days ago, in the reading room of the Madison Building, under a lamp, in the left margin of a letter a hundred and sixty years old. Small, beside the last line, drawn in the same brown ink as everything else, as if the pen had moved there by itself while the writer was thinking. A star, the kind you draw without lifting the pen, crowded with some foreign letters. I had looked at it and thought it was vaguely familiar, the way a lot of things are, and I had not given it a second thought. I had been too busy reading the letter.</p>\n<p><em>I am one of those you spoke of.</em></p>\n<p>The folder was in my bag, on the floor by my chair. Six feet from his knee. Again.</p>\n<p>\"Ms. Barnett?\"</p>\n<p>I looked up. He was watching me, the pencil still, his head a little on one side.</p>\n<p>\"Sorry,\" I said. \"Go on. Where were you, the Sunday night?\"</p>\n<p>He looked at me a moment longer. Then he looked at the window, at the rain, and began.</p>\n<p>I did not hear the first thing he said. I had to get it off the tape that night, at the kitchen table, after Freda had gone to bed, with the photocopy laid out flat in front of me under the light and the drawing I had made of his star from memory beside it. I had drawn it four times before I was happy with it. I had never drawn it before. My hand went around the five points in one line, the way his did, the way the letter's did, as if it had been waiting to.</p>\n<p>It was the same star.</p>\n<p>I sat and looked at the two of them for a long time, and then I put on the headphones and pressed play, and listened to him begin, and to myself not saying anything at all.</p>", "audio": false, "added": 1790943066980, "pt": [1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943399861, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980, 1790943066980]}, {"num": 3, "title": "The Bellboy", "extra": false, "html": "<p class=\"tape tape-head\"><em>March 1912</em></p>\n<p class=\"tape\">The first thing I knew was that I was holding a tray, and the floor was moving.</p>\n<p class=\"tape\">Not much. A long slow lean to one side, and a long slow lean back, the kind you stop noticing after a day at sea and never stop noticing in your knees. There was a cup and saucer on the tray, and a little silver pot, and a plate with two biscuits on it, and all of it was sliding very gently toward my chest. My hands were already tilting the tray to stop it. They knew how. I didn't.</p>\n<p class=\"tape\">I have told you my rule for the first hour of a life. Say nothing. Move as little as you can. Watch.</p>\n<p class=\"tape\">It's a hard rule to keep with a full pot of tea.</p>\n<p class=\"tape\">I was in a corridor. White painted walls, a long red carpet, brass rails, doors with numbers on them, electric lights in little glass shades that swung a quarter inch every time the floor leaned. The air smelled of coal smoke and polish and the sea, and very faintly of cabbage from somewhere below. A ship, then. A big one. The hum of her engines came up through the soles of my feet, through the whole of my body, like a cat purring against your chest.</p>\n<p class=\"tape\">And my body was very small.</p>\n<p class=\"tape\">You notice it at once. Everything is too high. The door handles were at the height of my ribs. The brass rail along the wall was at my shoulder. My wrists stuck out of a pair of navy sleeves with a row of brass buttons up the front of the jacket, more buttons than any jacket has needed in the history of the world, and there was a tight little cap on my head held on by a strap under the chin. I could feel that my knees were bony, and my feet hurt in a pair of boots a size too small, and somewhere in the front of my mouth there was a tooth that wobbled when I pressed my tongue to it.</p>\n<p class=\"tape\">A boy. A child. I had not been one in a very long time.</p>\n<p class=\"tape\">\"Boy!\"</p>\n<p class=\"tape\">A door down the corridor had opened, and a woman was leaning out of it. American, in a pink wrapper, with her hair in a net and a face that had been waiting.</p>\n<p class=\"tape\">\"Is that my tea? I rang for it twenty minutes ago.\"</p>\n<p class=\"tape\">\"Yes, madam,\" said my mouth, in a high clear voice I had never heard before, flat and quick, with every vowel squeezed. Liverpool. The body knows its own accent. \"Sorry, madam. Busy in the pantry, madam.\"</p>\n<p class=\"tape\">I carried the tray down the corridor without spilling anything, which was the body's doing and not mine, and she took it from me at the door and looked at me, and I looked at the carpet, because the body seemed to think that was the right place to look.</p>\n<p class=\"tape\">\"You're the one who's always whistling,\" she said.</p>\n<p class=\"tape\">\"Yes, madam.\"</p>\n<p class=\"tape\">\"Well, don't,\" she said, and shut the door.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">It took me most of that first day to find out who I was. It always does. You don't ask. You listen, and you let other people tell you, and they always do, if you wait.</p>\n<p class=\"tape\">My name was Albert Pike. Nobody called me that. I was Bertie, to the other boys, and <em>boy</em> to the passengers, and <em>Pike</em> to the second steward, a heavy, tired man called Lyle who ran the bell boys like a farmer runs dogs. I was twelve years old. I had been at sea for a year. I came from Bootle, outside Liverpool, where my mother lived with my three younger sisters in two rooms off the Stanley Road, and every month most of my wages went home to her. I knew that because there was a letter from her in my locker, in pencil, thanking me for the last one and telling me Agnes had the croup again.</p>\n<p class=\"tape\">I knew the ship was the Carpathia, because it was written on everything, on the towels and the life rings and the menus and the little brass plate by the purser's office. She was a Cunarder. Not one of the great ones. She had one tall red funnel with a black top, and she rolled, and she was slow, and the passengers who had sailed on the Mauretania told you so. She went back and forth between New York and the Mediterranean, carrying whoever wanted to go: tourists going east to see Italy, and families going home, and families leaving home for good.</p>\n<p class=\"tape\">We were coming west, then, toward New York, and still a good way out. I worked that out from the menu cards.</p>\n<p class=\"tape\">I learned the rest from Stan Malley. Stan was fourteen, the oldest of the bell boys, with a broken front tooth and a talent for knowing which passengers tipped. He slept in the bunk over mine, in a cabin down on E deck with four other boys and no porthole, and he talked to the underside of the deck above him every night until he fell asleep in the middle of a word.</p>\n<p class=\"tape\">\"You're quiet,\" he said to me, the second night. \"You been quiet since yesterday.\"</p>\n<p class=\"tape\">\"Got a headache.\"</p>\n<p class=\"tape\">\"You never get headaches.\"</p>\n<p class=\"tape\">\"Got one now.\"</p>\n<p class=\"tape\">\"You want to watch Lyle,\" said Stan. \"He's got his eye on you since the business with the soap.\" And he told me, before I had to ask, all about the business with the soap, which had happened before I arrived, and which I had apparently enjoyed very much.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">That is the strangest part of it, Ms. Barnett, every time. Not the waking. The finding out what kind of person you've been.</p>\n<p class=\"tape\">The body keeps what it knows how to do. I've told you that. Bertie Pike's body knew every ladder and passage on that ship. It could go from the boat deck down to the third-class dining saloon and back without touching a rail, at a speed that made the stewards swear. It knew how to carry six cups on a tray in a swell. It knew how to take a coin from a passenger's hand without seeming to, and say <em>thank you, sir</em> in a way that made the next coin larger. It could whistle through the gap in its teeth, loud enough to make a lady in a pink wrapper complain.</p>\n<p class=\"tape\">What it did not keep was anything Bertie had thought. Whether he was happy. Whether he missed his mother. Whether he was the kind of boy who took the extra biscuit or the kind who gave his to Stan. I had to work all of that out from the outside, from how the others treated him, from the soap, from the letter in the locker. And then I had to go on being him, as near as I could, so that nobody noticed he had gone.</p>\n<p class=\"tape\">I have done that a great many times. It never gets easier when the body is a child. A grown man who changes overnight is thought to be ill, or in love, or in trouble. A boy who changes overnight is thought to be up to something. Lyle watched me for a week.</p>\n<p class=\"tape\">I gave him nothing to see. I carried the trays and ran the messages and took the coins and said <em>sir</em> and <em>madam</em>, and I did not whistle, which Stan noticed and Lyle noticed and neither of them understood. The truth was that I couldn't. Bertie whistled through the gap where a tooth had been. I had never had that gap before, and I could not work out how to use it.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The one thing I could not do was sleep.</p>\n<p class=\"tape\">The body was tired. It went to sleep the moment it lay down, every night, like a stone dropped down a well. But I did not go with it. I lay in the dark in the bunk under Stan's, with the engines going through the hull and the other boys breathing, and I was wide awake inside a sleeping child, the way you are wide awake in a strange house.</p>\n<p class=\"tape\">An old man's sleep, in a boy's body. It happens. It passes, after a few weeks, when the mind settles into the body and they agree on things. Until then, you get up.</p>\n<p class=\"tape\">So I got up. The third night, and most nights after. I put on my trousers and my jacket and went up through the ship in my socks, carrying my boots, because a boy in socks can go anywhere on a ship at two in the morning and a boy in boots is heard.</p>\n<p class=\"tape\">I learned her that way. Every corridor, every ladder, every door that stuck. The night steward in the first-class pantry, an old Welshman called Evans who could not sleep either, and who would give a boy a mug of cocoa if the boy would sit and let him talk about his chapel. The quartermaster on the bridge wing who pretended not to see me. The engine room, where I was not allowed, and where the stokers let me stand at the top of the ladder and watch them feed the fires with the sweat running into their eyes.</p>\n<p class=\"tape\">And the wireless cabin.</p>\n<p class=\"tape\">It was a little room on the boat deck, not much bigger than a cupboard, with a bunk at one side and a desk at the other, and on the desk a great deal of brass and wire and black boxes, and a key, and a pair of headphones. The Marconi Company had put it there, and the Marconi Company owned it, and the young man who sat in it all day and half the night was a Marconi man, not a Cunard one. His name was Harold Cottam. He was twenty-one years old. He was the only wireless operator on the ship.</p>\n<p class=\"tape\">He had the light on, the first time I went past, at a quarter to one in the morning. The door was hooked open for the air, and he was sitting at the desk with the headphones on, writing on a pad, and his tea had gone cold beside him with a skin on top.</p>\n<p class=\"tape\">He looked up and saw a bell boy in socks, holding his boots, looking in at his door.</p>\n<p class=\"tape\">\"You're up late,\" he said.</p>\n<p class=\"tape\">\"Can't sleep, sir.\"</p>\n<p class=\"tape\">\"Nor can I, it seems.\" He took one side of the headphones off. \"Don't call me sir. I'm not an officer. They don't know what to do with me.\" He looked at the cold tea and made a face. \"I don't suppose you know where a man could get a hot drink at this hour?\"</p>\n<p class=\"tape\">I did. I went down to Evans in the pantry, and Evans made two mugs of cocoa and told me about his chapel, and I carried them up to the boat deck without spilling a drop.</p>\n<p class=\"tape\">That was the first night. After that, most nights, if the light was on in the wireless cabin, I brought him cocoa. He would take off one side of the headphones and drink it, and I would stand in the door, and he would tell me what he was hearing.</p>\n<p class=\"tape\">It was a whole world, Ms. Barnett. I had never thought about it. All across that ocean, in the dark, the ships were talking to each other. Not in voices. In sparks, in dots and dashes, each operator with his own hand that the others knew the way you know a friend's knock. Messages for passengers. Weather. Ice. Prices on the stock exchange in New York for gentlemen in first class who could not bear not to know. Gossip, between the operators, late at night, when the traffic was slow. Who had a cold. Who was in trouble with his chief. Which ship had the best food.</p>\n<p class=\"tape\">He let me listen, once. He put the headphones over my cap. It was a thin dry crackle, like frying, far away, and through it, now and then, a tiny high whine that came and went in a pattern.</p>\n<p class=\"tape\">\"That's Cape Cod,\" he said. \"Talking to a German, I think. You can tell by the hand.\"</p>\n<p class=\"tape\">I could not tell anything. But I was in the room, and the room was warm, and the sea was black and enormous on the other side of the wall, and in that little cupboard of brass and wire a young man was listening to the whole of it.</p>\n<p class=\"tape\">I want you to understand that I didn't know anything, Ms. Barnett. I am not a prophet. I've told you so. I didn't know what ship had sailed from Southampton the day before we sailed from New York, or what was waiting for her, or that it would have anything to do with us. I was an old man who couldn't sleep, in the body of a boy, and I liked that room better than any other place on the ship. That's all it was.</p>\n<p class=\"tape\">That is what I keep coming back to. That's all it was.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">We came into New York in the first days of April, and lay at the Cunard pier on the North River for some days, and took on coal and stores and passengers for the run back east.</p>\n<p class=\"tape\">I saw the city from the boat deck. I had seen it before, in another life, and it had grown since, upward, as it always does. Bertie Pike had seen it a dozen times and found it ordinary, and his body didn't even turn to look. I stood at the rail with a broom I was supposed to be using and looked until Lyle shouted.</p>\n<p class=\"tape\">On Thursday, the eleventh of April, we sailed.</p>\n<p class=\"tape\">You have to picture that pier, that morning. Piles of trunks with labels on them for Gibraltar and Genoa and Naples and Trieste and Fiume. The first-class passengers coming up the gangway in good coats, Americans mostly, going to see the Old World, with guidebooks under their arms and their maids behind them. The families in third class, going home to Hungary and Croatia and the mountains behind Fiume, with everything they owned in bundles and baskets, and children asleep on top of the bundles. A band, somewhere, playing something cheerful and out of tune.</p>\n<p class=\"tape\">I carried bags for two hours without stopping.</p>\n<p class=\"tape\">There was a man in second class I remember from that morning, though there was no reason to then. A thin man, about forty, in a brown suit gone shiny at the elbows, carrying his own bag, which nobody in a brown suit ever does. A typewriter case, a small one, which he would not let me take from him.</p>\n<p class=\"tape\">\"I'll manage it,\" he said, when I reached for it. \"It's all I've got that's worth stealing.\"</p>\n<p class=\"tape\">He gave me a nickel anyway, at the door of his cabin, and asked my name. Passengers never ask your name. I told him.</p>\n<p class=\"tape\">\"Bertie.\" He looked at me, properly, the way passengers never look at you either. \"I'm Hatch. I write things, for the magazines, when they'll have me. Going to Naples to write about Vesuvius, if Vesuvius will cooperate.\" He smiled. \"If you see anything worth writing about, Bertie, you come and tell me. I pay better than a nickel.\"</p>\n<p class=\"tape\">I said I would. I didn't think about him again for four days.</p>\n<p class=\"tape\">We cast off at noon, or near it. The tugs took us out into the river, and the city slid away behind us, and we turned south past the Statue and out through the Narrows into the open sea. I watched from the boat deck with a tray of beef tea for the ladies, until Lyle found me.</p>\n<p class=\"tape\">That night the light was on in the wireless cabin, and I brought up the cocoa.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there, and reached for his tea, and found it cold, and drank it anyway.</p>\n<p>\"Thursday,\" he said. \"We sailed on the Thursday. On the Sunday night, I couldn't sleep again.\"</p>", "audio": false, "added": 1790943540925, "pt": [1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925, 1790943540925]}, {"num": 4, "title": "The Wireless Room", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 14, 1912</em></p>\n<p class=\"tape\">Sunday was a long day. They always were, at sea.</p>\n<p class=\"tape\">There was a service in the first-class saloon in the morning, and the bell boys stood at the back in clean collars and held the hymn books for the ladies who had forgotten theirs. The captain came down for it. He was a new captain, that year, a slight, quick man called Rostron, with a way of turning his whole body toward whatever he was looking at. The stewards called him the Electric Spark, though never where he could hear. He gave orders faster than any officer I had ever served under, in any life, and he gave them quietly, and he did not give them twice.</p>\n<p class=\"tape\">I watched him through the hymns. I watched everyone. It was a habit I could not have broken if I had wanted to, and on that ship it was the only thing I had that was mine. A boy who cannot speak still has his eyes.</p>\n<p class=\"tape\">In the afternoon I carried beef tea and letters and rugs. Mr. Hatch, the man with the typewriter, had set himself up in a corner of the second-class smoking room with the case open on his knees, and he was typing with two fingers, very fast, and smoking, and frowning at the window. He looked up as I went by with the tray and said, \"Anything worth writing about yet, Bertie?\" and I said, \"No, sir,\" and he said, \"Me neither,\" and went back to his two fingers.</p>\n<p class=\"tape\">Lyle found me at four and made me polish the brass on the main stair, all of it, because a lady had complained that I looked at her. I don't know which lady. I looked at all of them. It took until dinner.</p>\n<p class=\"tape\">That night the body fell asleep at ten, like a stone down a well, and I lay awake inside it and listened to the engines and to Stan, above me, talking to the deck about a girl in Bootle he had never spoken to.</p>\n<p class=\"tape\">At a quarter to twelve I got up.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Evans was in the pantry with his feet up on a crate and his collar undone, reading his Welsh Bible by the light over the sink. He looked up when I came in carrying my boots, and sighed, and put the kettle on without being asked.</p>\n<p class=\"tape\">\"He'll be in bed, that one,\" he said. \"He's been on that machine since seven this morning. Even a Marconi man has to sleep.\"</p>\n<p class=\"tape\">\"His light's on, Mr. Evans.\"</p>\n<p class=\"tape\">\"His light's always on.\" He made the cocoa in two mugs and put a saucer over each to keep the heat in. \"Go on, then. And you come straight back down and get in your bunk, or Lyle will have your hide and mine with it.\"</p>\n<p class=\"tape\">I went up through the ship.</p>\n<p class=\"tape\">You have to understand how quiet a ship is, at that hour, on a calm night. The passengers are asleep. The stewards are asleep, except the one or two on watch, and they are sitting down. The engines are the only thing awake, and after a while you stop hearing them, and the whole great ship seems to be holding its breath and gliding.</p>\n<p class=\"tape\">I came out onto the boat deck, and the cold took the breath out of me.</p>\n<p class=\"tape\">It had been cold all evening. Now it was something else. The kind of cold that has no wind in it, that just stands there. The sea was perfectly flat. I had never seen the Atlantic like that, in any life, before or since. Not a ripple. Black, and still, and polished, like a floor somebody had just finished waxing. There was no moon. And the stars came all the way down to the water on every side, so many of them, so bright, that I could not tell where the sky stopped and the sea began, and for a moment I stood at the top of the ladder with a mug of cocoa in each hand and did not know which way was up.</p>\n<p class=\"tape\">Then I went along to the wireless cabin.</p>\n<p class=\"tape\">The door was hooked open, and the light was on. He was sitting on the edge of his bunk with his jacket off and his collar off and one boot already unlaced, bent over, working at the laces of the other. He still had the headphones on. The wire ran from his head across the little room to the desk, as if the machine had him on a leash.</p>\n<p class=\"tape\">\"Bertie,\" he said, without looking up. \"You're a saint. Put it on the desk.\"</p>\n<p class=\"tape\">I put it on the desk. I gave him the other mug, and he sat back against the wall of the cabin with his one boot off and the other half off and drank it, with his eyes closed.</p>\n<p class=\"tape\">\"I'm going to bed,\" he said. \"As soon as this is gone. I'm waiting on the Parisian. I sent her something this afternoon and she's to confirm it, and then I'm going to bed, and nobody is to wake me until we're in Gibraltar.\"</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">\"Don't call me sir.\" He opened his eyes. \"Cape Cod's been at it all evening. Messages for the Titanic, piles of them. Private traffic. Rich men on board telling other rich men where to put their money.\" He tapped the headphones. \"She's out of Cape Cod's reach, out where she is. They'll have to wait till she comes in range of Cape Race in the morning.\"</p>\n<p class=\"tape\">\"Is she really as big as they say, sir? The Titanic?\"</p>\n<p class=\"tape\">I want to be careful here, Ms. Barnett, because I have gone over this a great many times, and I want to tell it to you exactly as it was and no better.</p>\n<p class=\"tape\">I asked him that because I wanted to keep him talking.</p>\n<p class=\"tape\">That's all. I didn't know anything. I've told you. I was a boy who couldn't sleep, holding a mug of cocoa in a warm room on a cold night, and I didn't want to go back down to the bunk under Stan and lie awake in the dark. If he went to bed, I'd have to go too. So I asked him a question I knew he would like to answer, because all the wireless men were talking about her that month, about her set, the most powerful at sea, and her two operators, who were Marconi men like him and whom he knew by their hands. I asked it to buy myself ten more minutes in that room.</p>\n<p class=\"tape\">He laughed. He liked the question, as I knew he would.</p>\n<p class=\"tape\">\"Bigger,\" he said. \"She's the biggest thing ever put on water. Phillips and Bride are on her. Jack Phillips. He's the senior man. They've been working that set flat out since Southampton, poor devils, every millionaire on board wanting to send a telegram to his mother.\" He drank his cocoa and looked at the desk, at the pile of forms from Cape Cod, all addressed to the same ship. \"You know what, Bertie. I'll tell her. She can't hear Cape Cod, but she'll hear me. I'll tell them there's a pile waiting for them, and they can take it off Cape Race in the morning and save themselves the trouble of asking.\" He set the mug down and leaned across to the desk, his one boot still on, the laces trailing. \"Do a fellow operator a good turn.\"</p>\n<p class=\"tape\">He put his hand on the key.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I couldn't read what he sent. Not then. It was only a stutter of sound to me, his wrist moving, the spark crackling in the box behind the wall. He sent it, and sat back, and reached for his cocoa.</p>\n<p class=\"tape\">And then his hand stopped.</p>\n<p class=\"tape\">It stopped just short of the mug. I saw it. I had been watching his face, because I always watched faces, and I saw it change. Not much, at first. The way a man's face changes when he hears his name called in a crowd and isn't yet sure it was his. His head tilted. His other hand came up and pressed the headphones tighter to his ears.</p>\n<p class=\"tape\">Then he grabbed the pencil.</p>\n<p class=\"tape\">He wrote very fast, on the pad, in capitals, and I stood in the door and watched the pencil, because I could read that. I could read it upside down, as it went.</p>\n<p class=\"tape\"><em>COME AT ONCE. WE HAVE STRUCK A BERG. ITS A CQD OM.</em></p>\n<p class=\"tape\">And then a position, in numbers. Latitude and longitude.</p>\n<p class=\"tape\">He sat and looked at it. He did not move for perhaps two seconds, and I will tell you that in all the lives I have lived I have seen a great many people receive bad news, and I have never seen it land on anyone as completely as it landed on Harold Cottam that night, sitting on the edge of his bunk with one boot off.</p>\n<p class=\"tape\">Then his hand went to the key again, very fast.</p>\n<p class=\"tape\">\"What are you sending?\" I said. My voice came out of Bertie high and thin.</p>\n<p class=\"tape\">\"Asking if they're sure. Asking if I should tell my captain.\" He was listening hard. He wrote again, three words.</p>\n<p class=\"tape\"><em>YES COME QUICK.</em></p>\n<p class=\"tape\">He was on his feet before the pencil hit the desk. He tore the headphones off, and the sheet off the pad, and he went out of that door past me so fast that I felt the air of it on my face. He was running along the boat deck in his shirtsleeves, with one boot laced and one boot flapping, toward the bridge.</p>\n<p class=\"tape\">I went after him. I still had the cocoa in my hand. I don't know why I didn't put it down. I think the body was holding it.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The bridge was dark and enormous and full of cold. The officer of the watch was the first officer, Mr. Dean. He was standing by the wheelhouse with his hands behind his back, and he turned when he heard the running feet, and saw the Marconi man in his shirtsleeves with a paper in his hand, and a bell boy behind him with a mug.</p>\n<p class=\"tape\">Cottam pushed the paper at him. Dean read it under the shaded lamp, and I watched his face do what Cottam's had done, only faster, because he was an officer and had been trained to let it.</p>\n<p class=\"tape\">He didn't say anything. He went. He went straight down the ladder toward the captain's quarters with Cottam at his heels, and I went after them both, and nobody stopped me, because nobody saw me. A boy on a ship at night is furniture.</p>\n<p class=\"tape\">Dean knocked once and opened the door.</p>\n<p class=\"tape\">The captain was asleep. He woke the way a man wakes who has been woken at sea before, all at once, up on one elbow in his bunk, and his first words were angry ones. He didn't like his door opened without leave, and he said so, sharply, to both of them.</p>\n<p class=\"tape\">Then Cottam told him.</p>\n<p class=\"tape\">I was standing in the passage, behind them, in the dark. I saw the captain's face in the light from the corridor. I saw the anger go out of it, all at once, like a lamp being turned down, and something else come into it, and settle, and stay.</p>\n<p class=\"tape\">\"Are you sure?\" he said.</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">\"Absolutely certain?\"</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">He was already getting up. He was in his nightshirt, a slight man with bare feet on a cold floor, and he was giving orders before his feet had found his slippers. Turn the ship. Steer north-west. He would work out the course himself and bring it to the bridge. Call the chief engineer. Call out another watch of stokers. He was pulling his trousers on while he spoke. He did not raise his voice once, and he did not say anything twice.</p>\n<p class=\"tape\">Then he turned around, buttoning his shirt, and saw me.</p>\n<p class=\"tape\">I don't know what he saw. A bell boy in socks, with no cap, holding a mug of cocoa, in the passage outside his cabin at half past midnight, where no bell boy had any business to be. He looked at me for exactly as long as it took to decide I was useful.</p>\n<p class=\"tape\">\"You,\" he said. \"What's your name?\"</p>\n<p class=\"tape\">\"Pike, sir.\"</p>\n<p class=\"tape\">\"Pike. Do you know where the chief steward sleeps?\"</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">\"Go and wake him. Tell him the captain wants him in the chart room at once. At once. Then wake the purser and tell him the same. Then come back here.\" He looked at the mug in my hand. \"And put that down somewhere.\"</p>\n<p class=\"tape\">I put it down on the floor of the passage, very carefully, and ran.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I ran down the stairs I had polished that afternoon, and along the corridor on B deck, in my socks, faster than I had run in that body or perhaps any body, and as I ran I felt the ship begin to lean.</p>\n<p class=\"tape\">She was turning. Under my feet, slowly, all thirteen thousand tons of her, she was leaning over into the turn, the way a big ship does when the helm is put hard across, and the long red carpet tilted under me, and the electric lights in their little glass shades swung out on their chains and stayed there, all of them, all down the corridor, leaning together toward the north.</p>\n<p class=\"tape\">I have thought about those ten minutes for a hundred and fourteen years, Ms. Barnett.</p>\n<p class=\"tape\">I'll tell you what I know, and what I don't. I know Harold Cottam was going to bed. He told me so. I know he was waiting on the Parisian, and that he had the headphones on while he took his boots off, and that he was the one who decided to call the Titanic, out of kindness, to save two tired men some work. Those are his. Nobody gave them to him.</p>\n<p class=\"tape\">What I don't know is whether he would still have been sitting there, with his headphones on, if a bell boy had not come up the ladder with a mug of cocoa and asked him whether the Titanic was really as big as they said. Whether he would have drunk his cocoa a little faster without me, and finished his laces, and put the headphones on the hook, and lain down, five minutes before the call came. Or whether he would have sat there anyway, exactly as long, waiting on the Parisian, and called her anyway, and I was only a boy in the room.</p>\n<p class=\"tape\">I don't know. I have never known. I never will.</p>\n<p class=\"tape\">I had done a great many things in a great many lives on purpose, and some of them had worked and most of them had not. That night I did nothing on purpose at all. I carried a cup of cocoa up a ladder because I couldn't sleep.</p>\n<p class=\"tape\">And I have never been sure, in all the years since, whether it was the most important thing I have ever done, or nothing.</p>", "audio": false, "added": 1790944011597, "pt": [1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597]}, {"num": 5, "title": "Did You Know?", "extra": false, "html": "<p>He stopped at one, as he always did, and said that was enough for the morning, and went to heat the soup.</p>\n<p>I sat with the recorders still running for a minute after he had gone into the kitchen. I did that sometimes. I used to say it was to catch anything said in the doorway, which people often did, the important thing saved for when they thought you had stopped listening. Really it was to give myself a minute before I had to talk.</p>\n<p>On the arm of his chair, the notepad lay face up. The star was on it, gone over so many times the lead shone.</p>\n<p>I turned the recorders off.</p>\n<p class=\"break\">&#10043;</p>\n<p>The soup was split pea, and the bread was from the bakery, the second of his two last loaves, which he had decided not to freeze after all.</p>\n<p>\"I'd only eat it in June and be sad,\" he said. \"Better to eat it now and be sad in March, when it's appropriate.\"</p>\n<p>We ate at the kitchen table, with the rain going on outside, and for a while neither of us said anything. He looked tired. He had looked tired the week before, too, and I had put it down to the card. Now I was not sure what to put it down to. He ate slowly, and broke his bread into small pieces, and did not finish them.</p>\n<p>\"Can I ask you something off the tape?\" I said.</p>\n<p>\"You can ask me anything off the tape.\"</p>\n<p>\"Did you know?\"</p>\n<p>He did not pretend not to understand. He put his spoon down.</p>\n<p>\"That night? No.\"</p>\n<p>\"Not the ship. Not the iceberg. I understand you couldn't have known that.\" I turned my glass on the table. \"I mean, did you know you'd done something. Afterward. When it was over, and they'd picked them all up. Did you ever think, that was me, I did that.\"</p>\n<p>\"No,\" he said.</p>\n<p>\"Never?\"</p>\n<p>\"I thought, I don't know whether that was me.\" He looked at the window. \"It's not the same thing. It's worse, in some ways. If I'd known I had done it, I could have been proud of it, or got tired of being proud of it, and put it away. If I'd known I hadn't, I could have forgotten it. Instead I've carried it around for a hundred years like a stone in my shoe.\"</p>\n<p>\"You could have told it differently. This morning.\" I said it carefully. \"You could have said you kept him at the set. That you saved them. I'd have written it down.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Why didn't you?\"</p>\n<p>\"Because I don't know that I did,\" he said. \"And you asked me to tell it the way it was.\" He picked up his spoon again. \"Besides. Harold Cottam heard that call. Arthur Rostron turned the ship. Every man in that engine room shoveled coal until his hands bled, to get her there. They were the ones who did it. All I did was carry a cup.\"</p>\n<p>\"Evans made the cocoa,\" I said.</p>\n<p>He laughed, the real laugh, the one that surprised him.</p>\n<p>\"So he did,\" he said. \"I'd forgotten that. Put it in. Evans made the cocoa.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He did not go back to 1912 after lunch. He said he would rather tell the next part fresh, on a morning, from the beginning of it, and I did not argue, because he looked as if he needed the afternoon more than I needed the tape.</p>\n<p>He asked about Freda before I left. He did, most weeks, at the door. I told him she was typing the transcripts now, for fifteen dollars an hour, and that she was faster than I was, and that she had told me he sounded on the last tape like a man whose house had been broken into.</p>\n<p>He stood on the porch with the umbrella furled, and thought about that.</p>\n<p>\"She's right,\" he said. \"That's a good ear.\" He looked at me. \"She'll hear what you leave out, you know. When you type, you tidy. You take out the ums, and the places where I stop and start again. She won't, not at first, because she doesn't know which parts you'd want gone. Read what she types. You'll learn things about me you missed sitting in the chair.\"</p>\n<p>\"Is that a warning?\"</p>\n<p>\"It's a compliment,\" he said. \"To her.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I passed the Frederick exit at a quarter past three, in the rain, and did not take it.</p>\n<p>I had found the son's address on Sunday night, after the receipt, after Petrakis. It had taken about twenty minutes. There was only one Dunleavy household in the county with an Eileen in it, a split-level on a cul-de-sac on the east side of town, owned by a Kevin Dunleavy and his wife. There was a picture of the house on the county site. A basketball hoop over the garage. A ramp, newer than the house, built over the front steps.</p>\n<p>I had not called. I did not know what I would say. <em>Hello, Mrs. Dunleavy, you won't remember me, but six years ago a man who lived above you went out one Wednesday and never came back, and I wondered if you happened to write down who knocked on his door.</em> I had made calls like that a thousand times, once. I had been good at them. I was not sure, anymore, that I was the person who made them.</p>\n<p>I drove past, and watched the exit go by in the mirror, and decided it was because I needed to be home for Freda.</p>\n<p class=\"break\">&#10043;</p>\n<p>That night, after Freda had gone to her room, I did what I always did. I checked.</p>\n<p>It did not take long. The Senate had held hearings on the Titanic within days of the Carpathia getting into New York, and every word of them had been printed, and every word of the printed record was online, searchable, on a site run by people who cared about it more than anyone has ever cared about anything. Rostron had been the very first witness, on the very first morning. The nineteenth of April, 1912. The day after he brought them in.</p>\n<p>I read his testimony from the beginning. He had a plain way of talking, short sentences, no fuss, and you could hear in it the man Tom had described, turning his whole body toward whatever he looked at. He told them about the course he set, and the stokers, and the ice. And then, partway through, a senator asked him about the message, and how it was that he had happened to receive it, and he said this.</p>\n<p><em>I will tell you this, that the wireless operator was in his cabin, at the time, not on official business at all, but just simply listening as he was undressing. He was unlacing his boots at the time. He had this apparatus on his ear, and the message came. That was the whole thing. In 10 minutes, maybe he would have been in bed, and we would not have heard the messages.</em></p>\n<p>I read it twice. Then I sat back in the kitchen chair and looked at the screen for a long time.</p>\n<p><em>I have thought about those ten minutes for a hundred and fourteen years.</em></p>\n<p>There it was, the boots, the headphones, the ten minutes. All of it, in black and white, in a public record, under oath. Every detail he had given me that morning that I could check, I could check right here, in one sitting, at my own kitchen table.</p>\n<p>Which was exactly the problem. I knew it was, and I made myself look at it squarely, as I would have made a junior reporter look at it. A man who had read this testimony would know about the boots. He would know about the ten minutes. He could build a beautiful story around them, with a bell boy and a mug of cocoa and a Welshman with a Bible, and every piece I could check would check, because he had taken it from the very place I would go to check it. That was how a clever liar worked. I had written about clever liars. I had been called one.</p>\n<p>And it was also exactly what a man who had been there would say.</p>\n<p>I had been going back and forth like that for twenty weeks. I wrote it down, as I wrote everything down: <em>Rostron, Senate, day 1. Boots, headphones, 10 min. All public. Proves nothing either way.</em> Then under it, because I was honest with myself on paper even when I was not anywhere else: <em>He didn't claim it. He could have. He said it was Evans's cocoa.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>Freda came out at eleven for a glass of water. She had her headphones around her neck, the new white ones, and her laptop under her arm, and she put it down on the table across from me and opened it.</p>\n<p>\"I finished this morning's,\" she said. \"You can check it. I left in the ums.\"</p>\n<p>\"He said you would.\"</p>\n<p>\"He said what?\"</p>\n<p>\"That you'd leave things in. That I should read what you type, because I'd learn things I missed.\" I took the laptop. \"He said you had a good ear.\"</p>\n<p>Freda looked at the table. She did a thing with her mouth, a small pressed thing, that she had done since she was very small whenever someone praised her and she did not want them to see it land.</p>\n<p>\"He doesn't know,\" she said. \"If he did it. The cocoa thing.\"</p>\n<p>\"No.\"</p>\n<p>\"That's worse. Right?\" She filled her glass at the sink and stood with her back to me, drinking it. \"Not knowing if you made a difference. To someone. Like, you'd rather know either way.\"</p>\n<p>\"He said the same thing. Almost word for word.\"</p>\n<p>She turned around. \"Do you think people can tell? If they made a difference to someone. Or do you just never find out?\"</p>\n<p>I looked at her. She was standing very straight, with the glass in her hand, and the question was too careful, and I did not know what it was about.</p>\n<p>\"Sometimes you find out,\" I said. \"Usually much later. Usually when you'd stopped expecting to.\"</p>\n<p>Freda nodded, as if that were an answer to something, and put the glass in the sink, and said good night, and went. The door to her room closed. It didn't slam. I sat with her transcript open in front of me, all his ums and stops and starts left in, just as he had said, and read it through to the end, and learned that he had said <em>I don't know</em> nine times in a single morning, which I had not noticed sitting in the chair.</p>\n<p class=\"break\">&#10043;</p>\n<p>The money came on Saturday.</p>\n<p>It had always come on a Monday. For twenty weeks, Monday, like the electric bill. On Saturday morning, at nine o'clock, my phone buzzed on the kitchen counter, and it was the bank, and it was the payment for Session 19, the same amount as the last few, with the same short line in the note.</p>\n<p><em>With our client's thanks.</em></p>\n<p>I had sent the transcript on Friday at noon. Somebody, somewhere, had read it on Friday afternoon, every word, and had not been able to wait for Monday.</p>\n<p>I stood at the counter with the phone in my hand. Then I took my notebook out of my bag, and turned to a clean page, and drew the star from memory, in one line, the way his hand did it and the letter's did. Five points. A small letter crowded into each.</p>\n<p>Under it I wrote: <em>Same star. On his pad. On the letter. Does he know?</em></p>\n<p>And then, after a long while: <em>Not yet.</em></p>\n<p>I meant that I would not show him yet. I am still not sure, now, which of us I meant it about.</p>", "audio": false, "added": 1790944011597, "pt": [1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597, 1790944011597]}, {"num": 6, "title": "Full Speed", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 15, 1912, a little after half past twelve</em></p>\n<p class=\"tape\">The chief steward slept in a cabin on C deck, aft, and he slept like a dead man. I knocked, and then I hammered, and then I opened the door and shook him by the shoulder, which a bell boy does not do to a chief steward in any life, and said the captain wanted him in the chart room at once, sir, at once.</p>\n<p class=\"tape\">He sat up and looked at me with his hair on end.</p>\n<p class=\"tape\">\"What's the time?\"</p>\n<p class=\"tape\">\"Half past twelve, sir. Something's happened, sir. The Marconi man ran to the bridge.\"</p>\n<p class=\"tape\">He didn't ask me anything else. I saw him feel the lean of the ship under him, the long steady tilt of the turn, and understand it, the way a man who has been at sea for thirty years understands the floor. He was out of his bunk before I had got back to the door.</p>\n<p class=\"tape\">I woke the purser the same way. Then I went back up to the captain's passage, as I had been told, and stood against the wall by the mug of cocoa I had left on the floor, and waited to be useful.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I want to tell you what Rostron did in the next hour, Ms. Barnett, because I watched most of it, and because I have watched a great many men in a great many emergencies, and I have never seen anything like it.</p>\n<p class=\"tape\">He did not hurry. That was the first thing. The ship was hurrying, every inch of her, but he did not. He stood in the chart room in his uniform with his cap on, and the officers came to him one at a time, and he gave each of them a list. He gave the lists quietly, and he did not say anything twice, and he did not leave anything out. I stood in the doorway and ran wherever I was sent, and every time I came back there was another officer at the table and another list.</p>\n<p class=\"tape\">The doctors. There were three on board, the ship's own surgeon and two who happened to be sailing with us, an Italian and a Hungarian. One saloon each. The English doctor in the first-class dining room, the Italian in the second, the Hungarian in the third, each with blankets and brandy and hot water and whatever he needed, so that anyone brought up out of the cold would find a doctor who spoke their language, or near it.</p>\n<p class=\"tape\">The purser, the assistant purser and the chief steward at the gangways, to take the names of everyone who came aboard. Every name. He said that twice, actually. It was the only thing I ever heard him say twice. <em>Every name.</em></p>\n<p class=\"tape\">Every spare berth on the ship made up. Officers to give up their cabins. Hot coffee, hot soup, hot drinks of every kind, ready, in quantity, all night. The gangway doors in the side of the ship opened, and ladders and lines rigged over the side. Chair slings at every gangway, for anyone who could not climb. Canvas bags, the kind they used for ashes, for lifting up children who were too small to hold on.</p>\n<p class=\"tape\">Oil ready in the forward lavatories, to pour down the drains and calm the sea if the sea was rough. The boats swung out, in case we needed our own. And rockets, once we were near, every quarter of an hour, and the company's signals with them, so that anyone out there in the dark would know a ship was coming, and know whose.</p>\n<p class=\"tape\">And the passengers. Our own passengers, seven hundred of them, asleep. They were to be kept in their cabins, and kept quiet, and kept out of the way. Stewards in every corridor. No alarm. No running. If a passenger asked what was happening, the passenger was to be told, politely, to go back to bed.</p>\n<p class=\"tape\">I remember thinking, as I stood in that doorway, that he had thought of everything, and that he had thought of it all in about ten minutes, in his nightshirt, before he even knew how bad it would be. I have planned battles with men who took a week to think of less.</p>\n<p class=\"tape\">And when he had finished giving the orders, and the officers had gone, he did a thing I didn't expect. He stood for a moment alone at the chart table, with his hand raised to the peak of his cap, and his eyes open, and his lips moving.</p>\n<p class=\"tape\">He was praying. I don't think he knew anyone saw. I have seen men pray before a battle, and before a hanging, and on their deathbeds, and I don't think I have ever seen it done so plainly, by a man who so plainly had no time for it, and did it anyway.</p>\n<p class=\"tape\">Then he put his hand down and went up to the bridge.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They mustered the stewards in the first-class dining saloon at one o'clock. Everybody, the bedroom stewards and the saloon stewards and the pantry men and the bell boys, forty or fifty of us, half dressed, with our hair on end, in a room full of white tableclo
