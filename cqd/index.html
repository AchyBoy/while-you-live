tape\">I unlatched it and opened the lid.</p>\n<p class=\"tape\">The pages were gone.</p>\n<p class=\"tape\">I turned round. Stan was standing by his bunk with his hands in his pockets, and his face had gone red from the neck up.</p>\n<p class=\"tape\">\"A lady came,\" he said. \"Down the companionway. They're not supposed to, but she did. She was nice. She said you'd taken a toy of the little girl's to mend, a wooden horse, and the little girl was crying for it, and she couldn't wait, and would I mind.\" He swallowed. \"She gave me a shilling, Bertie. A whole shilling. I opened your locker and she looked in the case and there wasn't any horse, and she said she must have been mistaken and you must have it somewhere else, and she was sorry to trouble me, and went.\" He looked at me. \"I didn't see her take anything. Honest.\"</p>\n<p class=\"tape\">\"No,\" I said. \"You wouldn't have.\"</p>\n<p class=\"tape\">\"Was it a horse? Did you have the kid's horse?\"</p>\n<p class=\"tape\">\"No, Stan.\"</p>\n<p class=\"tape\">\"Oh,\" said Stan. And then, after a moment, unhappily: \"D'you want half the shilling?\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. He put the pencil down on the notepad.</p>\n<p>Freda, on the stairs, had her hand over her mouth.</p>\n<p>\"She kept you talking,\" she said, through her fingers. \"On purpose. The whole time.\"</p>\n<p>\"Twenty minutes,\" he said. \"About right and wrong, and a mother asleep in a berth, and what the two of us could and couldn't do. And I enjoyed every minute of it. God help me. It was the first real conversation I'd had in three weeks, and she'd known I would enjoy it, and she'd known that while I was enjoying it I wouldn't be thinking about my locker.\" He shook his head slowly. \"She asked for the pages so I'd say no. So I'd feel I'd won. She never expected me to give them to her. She'd already sent somebody else to get them.\"</p>\n<p>\"That's so...\" Freda took her hand away from her mouth. \"That's so good, though. That's evil. But it's so good.\"</p>\n<p>\"Yes,\" said Tom. He was smiling, a little, at the window. It was not a happy smile, quite, but it was not an unhappy one either. \"That's exactly what I thought, at the time. Standing in that cabin, looking at an empty case. I thought, that's evil, and it's so good.\"</p>\n<p>\"Did you hate her?\"</p>\n<p>He considered that, seriously, as he considered everything Freda asked him.</p>\n<p>\"No,\" he said at last. \"I think that was the trouble.\"</p>", "audio": false, "added": 1790946074534, "pt": [1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534]}, {"num": 17, "title": "Fourteen Photographs", "extra": false, "html": "<p>The records office was in the basement of a building downtown that I had walked past a thousand times, back when I worked six blocks away, and never once gone into.</p>\n<p>There was a counter with a scratched plastic window, and a ticket machine, and eleven chairs bolted together in a row, and a television on the wall showing a cooking show with the sound off. I took a ticket. I was number forty-one. They were serving number thirty-three. I sat in one of the bolted chairs with my bag on my knees and watched a man on the television fold egg whites into something, very slowly, for twenty minutes.</p>\n<p>When they called forty-one, a woman behind the plastic took my license and my letter and looked at both for a long time, and went away, and came back with a manila envelope, the big kind, sealed with tape. She slid a form under the window for me to sign. I signed it. She slid the envelope after it.</p>\n<p>\"Fourteen photographs,\" she said, \"and two pages of notes. Some material withheld under the exemptions on the attached sheet. You can appeal within thirty days.\"</p>\n<p>\"Thank you.\"</p>\n<p>\"You're the third person this year,\" she said, \"who's come in for a file this old.\" She was already looking past me, at forty-two. \"Most people don't bother. Most people just let it go.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I didn't open it there. I didn't open it in the elevator, or on the sidewalk, or in the car. I drove to a coffee place I used to go to, on the corner across from where the paper's building had been, which was a bank now, and I bought a coffee I didn't want, and sat at a table in the back by the window, and opened the envelope.</p>\n<p>The notes first. Two pages, typed, in the flat language of a man who had a great many of these to do that week. I had read the two-page report so many times I could have recited it. These were the notes behind it, the officer's own, and they weren't much longer, and they weren't much better. <em>Landlord states tenant not seen since Wed approx. Tenant owes 2 wks rent. Movers booked Sat. Cat in BR, landlord removed.</em> Then, near the bottom of the second page, a line I had never seen.</p>\n<p><em>Neighbor 2F (Dunleavy) called station x2 re: noise Wed a.m. Msg passed to R/O. Not interviewed. See landlord stmt.</em></p>\n<p>I sat and looked at that line for a long time.</p>\n<p><em>Not interviewed.</em> She had called them twice. They had passed it on. And the responding officer, whose name was on the top of both pages, had read the message and written it down, very neatly, and gone to talk to the landlord about the carpet.</p>\n<p>I thought of Mrs. Dunleavy in her wheelchair by the window, with her hands folded on the crocheted blanket. <em>Nobody ever calls me back.</em></p>\n<p>Then I opened the photographs.</p>\n<p class=\"break\">&#10043;</p>\n<p>They were color prints, glossy, four by six, each one with a number written on the back in marker and a date stamp in the corner. Fourteen of them. I laid them out on the table in order, in two rows of seven, and moved my coffee to the windowsill so I wouldn't spill it on them, and looked.</p>\n<p>The first three were the building. The front, with the dry cleaner's sign and the steam coming out of a vent at the side. The front door. And the stairs, from the bottom, looking up. A narrow staircase with a wooden rail, and the walls painted a pale clean cream, fresh, glossy, the kind of paint that shows everything.</p>\n<p>I picked up the third one and held it closer.</p>\n<p>All the way up the left-hand wall of the staircase, at about the height of a man's waist, there was a line of marks. Scuffs, and dents, and in two places small gouges where the cream paint had come away and the old green showed through underneath. Every few steps. All the way up, as far as the photograph went.</p>\n<p><em>Something banging the wall all the way down. New paint!!</em></p>\n<p>I put it down very carefully, as if it might break.</p>\n<p>Four through eight were the living room. It was smaller than I remembered, and more ordinary. A brown couch with a blanket folded on the arm. A rug. A small television on a stand. A bookshelf, full, the books shelved by size. And the wall over the couch, with the photographs on it.</p>\n<p>There were seven. I counted. Seven frames in a careful arrangement, the kind a person measures and marks in pencil before they put in a single nail. An older woman in a sun hat, laughing, in a garden. That would be his mother. A young man in a cap and gown with the same woman beside him, not laughing, very proud. A lake with a dock. A dog. A church. A group of people at a long table, a wedding or a birthday, too small to see faces.</p>\n<p>And one more, at the end. Larger than the others, in a better frame.</p>\n<p>I picked up photograph number seven and held it right up to my face, there at the table in the back of the coffee place, and I didn't care who saw.</p>\n<p>It was him. My source. Bookbinder. In a dark suit that didn't fit him, standing in front of a pair of tall brass doors I would have known anywhere in the world, under a banner I could almost read: <em>CARROW HOUSE</em>, and something else, smaller, <em>SPRING SALE</em>, and a year. He was smiling. Shyly, as he used to smile at me across the diner table when he'd brought me something good and didn't want to seem proud of it.</p>\n<p>And beside him, with one arm around his shoulders, was another man.</p>\n<p>Older. Sixty, perhaps, or a fit seventy. Tall, heavy-shouldered, with a fine head of white hair swept back, and a bow tie, and a beautifully cut gray suit. He had his head thrown back. He was laughing. Not smiling. Laughing, with his whole body, his mouth wide open, as if somebody just out of the frame had said the funniest thing he had ever heard. And his arm was around my source's shoulders, hard, the way a proud father holds a son at a graduation. The way you hold someone who belongs to you.</p>\n<p>I didn't know him. I sat with the photograph in my hand and went through every face I could remember from eight months of Carrow House, every name in every document, every lawyer, every executive in every annual report, and I didn't know him.</p>\n<p>But I knew the laugh. I had never heard it. I knew it anyway, from a furious little line in a composition book.</p>\n<p><em>A big one. Too big. The kind of laugh a man has when he's used to people laughing with him.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>The rest I went through quickly, because I couldn't help it, and then slowly, because I made myself.</p>\n<p>Nine was the desk. A plain wooden desk under the window, with a lamp and a mug of pens. And on the desk, in the middle, a big pale rectangle in the dust, perfectly clean, with a power strip on the floor beneath it and three cables hanging down off the back of the desk into nothing. You could see exactly where the computer had been, and the scanner beside it. The officer had stood in front of that and written, <em>No computer observed.</em></p>\n<p>Ten was the closet by the door, opened. Coats on hooks. Shoes on the floor. And at the back of the floor, two more rectangles in the dust, side by side, the size and shape of banker's boxes.</p>\n<p>Eleven and twelve were the bedroom. A bed, unmade. A window. A water bowl on the floor by the door, empty, and a litter box in the corner, and the door itself, from inside, with long pale scratches down the paint at the bottom where something with claws had tried for two days to get out.</p>\n<p>Thirteen was the kitchen. Dishes in the sink. A cereal box on the counter. A mug, by the kettle, with a teabag in it, ready, as if he'd put it out to have when he got back.</p>\n<p>Fourteen was the bookshelf again, closer. I don't know why the officer took it. Perhaps he thought he ought to take one more. On the middle shelf, between two books, there was a small gray stuffed mouse with one ear chewed off.</p>\n<p>I put them all back in the envelope, in order, and closed it, and sat with both hands flat on top of it, and looked out of the window at the bank where the paper used to be, until the coffee was cold.</p>\n<p class=\"break\">&#10043;</p>\n<p>I called Freda from the car. It was ten past four. She would be home by now.</p>\n<p>It went to voicemail. I texted. <em>On my way. Want anything from the store?</em></p>\n<p>The answer came a minute later. <em>at maddies, back by 7. no thx</em></p>\n<p>I sat in the car with the engine off and the envelope on the passenger seat, and I looked at the text, and I thought about how long it had been since I'd seen Maddie's mother. Not since the lab. Not since she called me in the winter, very quiet, to apologize for something she couldn't name. I had meant to call her back. I never had. And Maddie's house was on the way home, almost. And I had a car, and a free hour, and a daughter at someone else's kitchen table eating someone else's food.</p>\n<p>I called Maddie's mother.</p>\n<p>She answered on the second ring, and she sounded surprised, and then pleased, and then, when I said I was nearby and thought I'd pick Freda up and save her the bus, she didn't say anything at all for a moment.</p>\n<p>\"Freda?\" she said.</p>\n<p>\"Yes. She's there, isn't she? With Maddie?\"</p>\n<p>\"Iola.\" Her voice had gone careful. \"Maddie's at her dad's this week. In Baltimore. She's been there since Saturday.\" A pause. \"And Freda hasn't been over here since... well. Not since the lab. Not once. I thought you knew. I thought, after everything, you'd rather she didn't.\"</p>\n<p>I said something. I don't know what. I said thank you, I think, and that I must have got the day wrong, and that we should have coffee, and she said yes, we should, in the voice people use when they know they never will.</p>\n<p>I hung up.</p>\n<p>I sat in my car in the parking garage under the building where my career had ended, with fourteen photographs of a man who had gone out one morning and never come back on the seat beside me, and my daughter's text on the screen in my hand.</p>\n<p><em>at maddies, back by 7.</em></p>\n<p>And under it, in my memory, as clear as if I were reading it off the page: <em>Maddie's sister was getting rid of them.</em> And <em>Maddie's sister drives that way.</em></p>\n<p>Maddie didn't have a sister. Maddie had two older brothers, and no sister at all. I had known that for eleven years. I had even made a little joke, in my own head, in the car on the way to Frederick, about how generous Maddie's sister had become. I had known it the whole time.</p>\n<p>I had just never checked.</p>", "audio": false, "added": 1790946074534, "pt": [1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534, 1790946074534]}, {"num": 18, "title": "Pages in the Wake", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 18, 1912, afternoon</em></p>\n<p class=\"tape\">I made one try. I want you to know that. Just one.</p>\n<p class=\"tape\">At two o'clock I went to find the officer who had stood at the top of the after companionway with a lantern and written <em>Death accidental</em> in his book. He was on the boat deck, by the bridge ladder, with his hands behind his back, looking at the fog, which had begun to thin. You could see the rail now, and the boats, and a little gray water beyond them.</p>\n<p class=\"tape\">I stood in front of him with my cap in my hands.</p>\n<p class=\"tape\">\"Please, sir,\" I said. \"Can I ask you something? About last night.\"</p>\n<p class=\"tape\">He looked down at me. I don't think he remembered me at all.</p>\n<p class=\"tape\">\"What is it?\"</p>\n<p class=\"tape\">\"If a gentleman slipped at the top of those stairs, sir, and went down them,\" I said, \"and you found a mark on the steps where his heel had gone. Would the mark be going up, sir, or down?\"</p>\n<p class=\"tape\">He stared at me.</p>\n<p class=\"tape\">\"Down, I should think,\" he said. \"If he was going down.\" He frowned. \"What sort of question is that?\"</p>\n<p class=\"tape\">\"Only, sir, I thought I saw one going up. On the fifth step. Before the lady slipped on it.\"</p>\n<p class=\"tape\">He looked at me for a long moment. Then something happened in his face that I had seen happen in a great many faces, in a great many lives, when a person of no account says something that would be a great deal of trouble if it were true. He decided it wasn't.</p>\n<p class=\"tape\">\"You thought you saw,\" he said. \"In the fog. At one in the morning. Where you had no business being.\" He bent down a little, so his face was level with mine. \"Listen to me, boy. A man fell down a flight of stairs in the fog, and the doctor's seen him, and it's written in the log, and there's an end of it. We've got seven hundred people on this ship who've lost everything, and a captain who hasn't slept since Sunday, and we'll be in New York tonight with half the world waiting on the pier. The last thing anybody needs is a bell boy with an imagination.\" He straightened up. \"Now cut along before I tell Mr. Lyle where you were last night.\"</p>\n<p class=\"tape\">I cut along.</p>\n<p class=\"tape\">That was my one try. I had known before I made it how it would end. I had known it on the floor of the bell boys' cabin at four in the morning. But I had to make it, Ms. Barnett. You understand. If I hadn't, I'd have had to wonder.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The fog lifted at about three.</p>\n<p class=\"tape\">It went quite suddenly, as fog does at sea, as if someone had pulled a sheet off a table. One minute the ship was wrapped in white, and the whistle going, and the next the white was tearing apart into rags and drifting off over the water, and there was a pale sun, low in the west, and blue sky in pieces, and a long, slow, gray-green swell. The whistle stopped. The engines came up. You could feel her lift and begin to move again.</p>\n<p class=\"tape\">People came out on deck. Survivors, and our own passengers, to stand in the sun. Nobody said much. They stood along the rails and looked west, where New York was, still below the edge of the world.</p>\n<p class=\"tape\">I went aft, because I was sent with a rug for a lady by the after rail, and on my way back I saw her.</p>\n<p class=\"tape\">She was at the very stern, alone. Right at the back of the ship, by the flagstaff, where the rail curved round and nobody went, because there was nothing to see there but the wake. She was in her dark coat again, with her hair up. Her back was to me.</p>\n<p class=\"tape\">She had something in her hands. White. Paper.</p>\n<p class=\"tape\">As I watched, she took one sheet from the top and held it out over the rail, at arm's length, and opened her fingers.</p>\n<p class=\"tape\">The wind took it. It went up, first, a little, turning over in the sun, white and then white again, like a bird that has been startled off a fence. Then it came down into the wake behind the ship, into the long churned road of green and white water the screws were making, and lay flat on it for a second, and was rolled under.</p>\n<p class=\"tape\">She took another sheet and did the same.</p>\n<p class=\"tape\">I stood by the deckhouse with the rug over my arm and watched her do it. Five times. I counted. I knew how many there were. Five pages, typed with two fingers in the second-class library on a Wednesday afternoon by a man in a brown suit, going up into the sun, one after another, and turning over, and falling into the wake, and lying there, white, and gone.</p>\n<p class=\"tape\">She didn't hurry. She did each one separately, carefully, the way you'd lay flowers on a grave one at a time.</p>\n<p class=\"tape\">When the last one had gone, she stood with her hands on the rail for a moment, looking down at the water where it had gone under.</p>\n<p class=\"tape\">Then she turned around, and saw me.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">She didn't seem surprised. I think she had known I was there for some time.</p>\n<p class=\"tape\">She came along the rail toward me, unhurried, with her hands in the pockets of her coat, and stopped a little way off. The sun was behind her. I couldn't see her face well.</p>\n<p class=\"tape\">\"Bertie,\" she said.</p>\n<p class=\"tape\">\"Miss.\"</p>\n<p class=\"tape\">\"I owe Stan another shilling,\" she said. \"I think I underpaid him. He looked very unhappy about it when I left.\"</p>\n<p class=\"tape\">I didn't answer.</p>\n<p class=\"tape\">\"The notebook's gone too,\" she said. \"If you were wondering. In case you thought you might still find it. Mr. Ainsley went down to the stokehold at six this morning, before anyone was about, with a cigar he didn't light, and came up again without the notebook. I was on the stair.\" She looked past me, at the funnel, where the smoke was going up. \"There's nothing left. Not a page. Not anywhere.\"</p>\n<p class=\"tape\">\"There's me,\" I said.</p>\n<p class=\"tape\">She looked at me then. A long look. I couldn't see her eyes, with the sun behind her, but I felt it.</p>\n<p class=\"tape\">\"Yes,\" she said. \"There's you.\"</p>\n<p class=\"tape\">\"I saw the step. I saw his shoe. I saw his jaw at breakfast.\"</p>\n<p class=\"tape\">\"Yes. And so did I. And neither of us will ever say so to anyone who matters, because no one who matters will ever listen to a bell boy and a governess against a gentleman with a bruise from slipping in the fog.\" She said it quite gently. \"You know that. You've known it since four o'clock this morning. You went and asked that officer anyway, at two, by the bridge ladder. I saw you.\" She was quiet a moment. \"That was brave. It was also quite useless. I'm sorry.\"</p>\n<p class=\"tape\">\"You're not sorry.\"</p>\n<p class=\"tape\">\"No,\" she agreed. \"I'm not sorry I did it. I'm sorry it had to be done. That isn't the same thing.\" She took one hand out of her pocket and pushed a strand of hair off her face. \"I don't expect you to forgive me, Bertie. I'm not sure I would, in your place.\"</p>\n<p class=\"tape\">I didn't say anything for a while. The wake ran away behind us, white and green, very straight, all the way back toward the east, toward the ice, and the place where the boats had been.</p>\n<p class=\"tape\">\"Why did you hum it?\" I said. \"That song. To the little girl. On Tuesday night.\"</p>\n<p class=\"tape\">I don't know why I asked. It wasn't what I'd meant to say. It came out of me before I could stop it.</p>\n<p class=\"tape\">She went very still. For the first time since I had known her, I saw her not know what to say.</p>\n<p class=\"tape\">\"It's an old song,\" she said at last.</p>\n<p class=\"tape\">\"Yes, miss.\"</p>\n<p class=\"tape\">\"My father...\"</p>\n<p class=\"tape\">\"Found it in a book,\" I said. \"Yes, miss. You told her.\"</p>\n<p class=\"tape\">She looked at me for a long time. The wind moved her coat. Down below us, in the wake, there was nothing at all.</p>\n<p class=\"tape\">\"How old are you, Bertie?\" she said.</p>\n<p class=\"tape\">\"Twelve, miss.\"</p>\n<p class=\"tape\">\"No,\" she said quietly. \"You're not.\"</p>\n<p class=\"tape\">And she turned, and walked away along the rail toward the door, and went in, and didn't look back.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. He put the pencil down.</p>\n<p>Nobody said anything. Freda was sitting on the stairs with her arms tight around her knees, perfectly still.</p>\n<p>\"What did she mean?\" said Freda. \"You're not.\"</p>\n<p>\"I don't know,\" he said. \"I've never known.\" He looked at the window. \"Perhaps she meant that I didn't talk like a boy of twelve. I didn't, by then. I'd stopped trying, with her. Perhaps she meant only that.\"</p>\n<p>\"But you don't think so.\"</p>\n<p>He didn't answer that.</p>\n<p>\"It was a long time ago, Freda,\" he said instead. \"And there's still the rest of Thursday. The worst of it.\" He picked the pencil up again, and looked at it, and put it down. \"I think I'd like a cup of tea first. If nobody minds.\"</p>\n<p>Freda got up off the stairs and said she'd make it. He started to protest, and she said, \"Sit,\" in exactly my voice, and went into the kitchen. He sat.</p>\n<p>He looked at me across the little table, with the recorders running between us.</p>\n<p>\"She's a good girl,\" he said quietly.</p>\n<p>\"I know.\"</p>\n<p>\"No,\" he said. \"I mean, she's a good girl, Ms. Barnett.\" He held my eyes a moment longer than he needed to. Then he looked at the notepad on his knee, and said nothing else until the tea came.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 18, 1912, evening</em></p>\n<p class=\"tape\">They came for me at five.</p>\n<p class=\"tape\">I was in the pantry with Evans, drying cups, because there was nothing else for me to do and I couldn't sit still. Lyle came in. He had the purser behind him, and behind the purser, in the doorway, in his good gray suit and his shined shoes, Mr. Ainsley.</p>\n<p class=\"tape\">\"Pike,\" said Lyle. \"Where's the writer's case?\"</p>\n<p class=\"tape\">I put the cup down.</p>\n<p class=\"tape\">It had been very simple, as the worst things often are. At four the purser had finally found time to see to the dead man's effects. He had sent a steward to the library. The steward had found a pen on the table and nothing else. The purser had said that was odd, a writer with no papers, and Mr. Ainsley, who happened to be passing the purser's office, had very kindly mentioned that the poor fellow had a typewriter, and a notebook, a fat one, which he carried everywhere and which, Mr. Ainsley understood, he had been hoping to sell to the New York newspapers. Things like that were worth a great deal of money this week, Mr. Ainsley said. It might be worth asking who had been in the library.</p>\n<p class=\"tape\">And a lady sleeping in the library had seen a bell boy carry a case out of it at seven that morning. A small one, with a mended handle.</p>\n<p class=\"tape\">\"In my locker, sir,\" I said.</p>\n<p class=\"tape\">They went and got it. Lyle carried it back up to the pantry himself and put it on the counter and opened it in front of all of us. A typewriter, and a ribbon tin, and a letter to a sister in Ohio, half finished, and nothing in the lid.</p>\n<p class=\"tape\">\"And the notebook?\" said the purser.</p>\n<p class=\"tape\">\"I never had the notebook, sir.\"</p>\n<p class=\"tape\">\"Then where is it?\"</p>\n<p class=\"tape\">I looked past him at Mr. Ainsley in the doorway. He was looking back at me with an expression of great kindness and a little sorrow, like a man looking at a boy who has disappointed him.</p>\n<p class=\"tape\">\"I don't know, sir,\" I said.</p>\n<p class=\"tape\">\"Took the case and not the notebook,\" said Lyle. \"That's a likely story. And what were you going to do with a typewriter, Pike? Write your memoirs?\" He turned to the purser. \"He's been out of his bunk every night this week, sir. I've had complaints. And there's papers on this ship offering a year's wages for any scrap of a survivor's story.\"</p>\n<p class=\"tape\">\"I was keeping it safe,\" I said. \"For his family. He had a sister.\"</p>\n<p class=\"tape\">It was the truth. Nobody in that pantry believed it, and I don't blame them.     setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
