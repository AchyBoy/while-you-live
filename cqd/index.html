r. Cottam saw me look at it, and turned it toward me so I could read it, without a word.</p>\n<p class=\"tape\">It had come relayed from shore, and it was sent on behalf of the President of the United States. It asked whether Major Archibald Butt was aboard.</p>\n<p class=\"tape\">\"Is he?\" I said.</p>\n<p class=\"tape\">Cottam shook his head. \"Not on any list.\" He folded the form and held it out to me. \"Take that to the purser. He answers anything official. He'll want to say <em>not on board.</em>\" He put his hand on the key. \"I've no time for it, Bertie. Names. That's all I can do.\"</p>\n<p class=\"tape\">I took it to the purser's office and put it in the purser's hand, and went back up with more tea.</p>\n<p class=\"tape\">I have thought about that telegram since. The newspapers said afterward that the President never got an answer from the Carpathia. The captain told the senators that his purser remembered one going back: <em>Not on board.</em> I carried it to the purser's office. I never saw what went out. I don't know which of them is right, and I don't think anybody alive does. What I know is that a boy of twenty-one with no sleep looked at a question from the President of the United States and went on sending names, because there were seven hundred families waiting for those. I've been on the wrong side of a great many orders, in a great many lives. I don't think that one was wrong.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">There was a gentleman from the boat I want to tell you about.</p>\n<p class=\"tape\">I'll call him Mr. Ainsley. It wasn't his name. I told you I wouldn't give you the names, and I won't. But you need to be able to call him something, and so do I, and Ainsley will do.</p>\n<p class=\"tape\">He was about forty-five. Tall, well made, with a good jaw and a fine head of hair going gray at the sides, the kind of man who looks as if he ought to be on the board of something, and was, I learned later, on the boards of several things. He had been in first class on the Titanic. He was on the boat deck of the Carpathia by Tuesday morning, in his own clothes. That was the first thing I noticed about him. His own clothes. A good gray suit, a little creased, but dry and whole, and a proper collar, and his own shoes. Good black shoes, with hard leather heels, that you could hear on the deck boards from twenty feet away.</p>\n<p class=\"tape\">Most of the men who came off those boats came off them in whatever they'd been wearing at midnight. Evening clothes with a coat over them. Pajamas. One man came up the ladder in his dressing gown and a lifebelt and a bowler hat. Mr. Ainsley had dressed. He had dressed, all the way to his shoes, and come up on deck and got into a boat. A man who had time to dress down to his laces had most likely gone in one of the early boats, the ones that went down half empty, when nobody yet believed the ship would sink.</p>\n<p class=\"tape\">He talked a great deal. He was a talker, the kind people gather around. By Tuesday afternoon he had a little group of his own in the first-class smoking room, other survivors, and a few of our own passengers too, and he told them about the night, the boat, the cold, and he told it well. He had a way of telling things so that you saw them. He had a big laugh, and he used it, even then, even that week, at the right moments, to let people breathe.</p>\n<p class=\"tape\">And he told them, more than once, that in his boat it had been very calm, and very orderly. That he had sat in the stern, at the tiller, and kept up the ladies' spirits. That they had done everything right. That nobody was turned away.</p>\n<p class=\"tape\">I took him a cup of coffee, at about four o'clock. He took it from the tray without looking at me, as gentlemen did, and said \"Thank you, boy,\" and turned back to his audience.</p>\n<p class=\"tape\">And I saw his hands.</p>\n<p class=\"tape\">He had wrapped the right one in a handkerchief. The left was bare. Across the palm of it, at the base of every finger, there was a row of blisters, big ones, the kind you get from hours on something rough and hard, and all of them had burst, and the skin had come away raw and red underneath. The handkerchief on the right hand had a stain coming through it in the same places. In the same row.</p>\n<p class=\"tape\">I have pulled an oar, Ms. Barnett, in more than one life. I know what hours on one do to a man's hands. You blister in that row, across the root of the fingers, both hands, because an oar takes both. A tiller you steer with one hand, and shift to the other when you're tired, and you may get a sore palm, but you don't usually get that.</p>\n<p class=\"tape\">I couldn't know it was an oar. A man can tear his hands on a rope, or on the falls coming down, or holding on to something in the dark. I couldn't know for how long. But they looked like an oarsman's hands to me, both of them, and he was telling a room full of people that he'd sat at the tiller.</p>\n<p class=\"tape\">If he had rowed, there was nothing wrong with that. A man who rows in an open boat to keep people alive has nothing to hide. Most men would have shown you their hands.</p>\n<p class=\"tape\">Mr. Ainsley had wrapped one of his up, and was telling a room full of people that he'd sat at the tiller.</p>\n<p class=\"tape\">I put that away. Not where I'd put the young woman. Somewhere nearer.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At about five, I saw him go and talk to Mr. Hatch.</p>\n<p class=\"tape\">Hatch was in his corner of the second-class smoking room, by the window, with his notebook. He had been at it all day. Survivors came and sat with him, one at a time, and talked, and he listened and wrote, and bought them coffee, and they went away. I had carried a good deal of the coffee.</p>\n<p class=\"tape\">Mr. Ainsley came in from the deck, in his hard heels, and the room heard him come, and he went to Hatch's corner and sat down across from him, uninvited, and smiled. I was at the sideboard with a tray of cups. I couldn't hear them. They kept their voices low. But I could see them, and I watched.</p>\n<p class=\"tape\">Ainsley did most of the talking. He leaned forward with his elbows on his knees and his wrapped hand hanging loose, very friendly, very easy, and talked, and once he laughed, the big laugh, loud enough to make heads turn, and put his good hand on Hatch's shoulder for a moment. Hatch didn't laugh. He sat back in his chair with his own hand flat on the notebook and listened, and his face went very still, and then a little white, and at the end he shook his head, once. Only once.</p>\n<p class=\"tape\">Ainsley looked at him for a moment, still smiling. Then he stood up and went out, with his heels going across the boards.</p>\n<p class=\"tape\">I took Hatch his tea.</p>\n<p class=\"tape\">\"Bertie,\" he said, when he saw me. He looked very tired, and something else. Something I couldn't read, at first. \"Do you know what a story's worth?\"</p>\n<p class=\"tape\">\"No, sir.\"</p>\n<p class=\"tape\">\"Five hundred dollars.\" He laughed, not the big laugh, a small dry one. \"I've just been offered five hundred dollars for a notebook. Cash, on the pier, on Thursday night. That's more than I made last year.\" He picked up the tea. His hand wasn't quite steady. \"And a good deal of very friendly advice about what happens to men who write things down that aren't true.\"</p>\n<p class=\"tape\">\"Is it true, sir? What you wrote?\"</p>\n<p class=\"tape\">He looked at me over the cup for a long moment.</p>\n<p class=\"tape\">\"Every word,\" he said. \"I've got it from three people now, Bertie. Three. In the same boat. Two of them didn't know the others had talked to me.\" He put his hand flat on the notebook again, on his knee. \"That's when you know it's true. When three people who haven't spoken to each other tell you the same thing they all agreed to forget.\"</p>\n<p class=\"tape\">He didn't say what. And I didn't ask, because I didn't need to. I had seen the hands.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">That night I couldn't sleep, again. I went up through the ship in my socks with my boots in my hand, as I always did, and on the boat deck, in the lee of one of the boats, I found her.</p>\n<p class=\"tape\">The young woman in the dark coat. She was sitting in a deck chair wrapped in two blankets, and in her lap, wrapped in a third, was the little girl, the six-year-old, wide awake, staring up at the stars. The child had not slept since Sunday night, I learned later. Not really. She would close her eyes and see the water and open them again. So the young woman had brought her up into the air, where it was cold and dark and quiet, and was holding her.</p>\n<p class=\"tape\">And she was singing to her. Very softly. Not even singing. Humming.</p>\n<p class=\"tape\">I stopped dead in the shadow of the boat with my boots in my hand.</p>\n<p class=\"tape\">I knew that tune.</p>\n<p class=\"tape\">I'm going to be very careful how I tell you this, Ms. Barnett, because I've never told anyone, and I want to get it right. I knew that tune the way you know your own mother's voice. Better. I had known it longer than I had known anything. I had hummed it to myself in more lives than I can count, in cells and on battlefields and in sickbeds and on long night watches, as some people say a prayer. I hummed it on that ship. I had hummed it in the bunk under Stan the first night, very quietly, to find out whether Bertie Pike's voice could carry it. It was mine.</p>\n<p class=\"tape\">And I had never, in all those lives, in all that time, heard another living soul hum it.</p>\n<p class=\"tape\">The little girl said something. I couldn't hear what. The young woman stopped humming, and bent her head, and answered her.</p>\n<p class=\"tape\">\"It's a very old song,\" she said. \"Older than anything. My father found it in a book. Somebody carved it on a stone, a long time ago, so it wouldn't be lost.\" Her voice was quiet and level and very English. \"It's about how life is short. So you mustn't spend it being sad. <em>While you live, shine.</em> That's how it starts.\"</p>\n<p class=\"tape\">\"What does that mean?\"</p>\n<p class=\"tape\">\"It means be as bright as you can,\" the young woman said, \"for as long as you're here.\" And she began to hum it again, from the beginning.</p>\n<p class=\"tape\">I stood in the shadow of the boat until my feet were numb.</p>\n<p class=\"tape\">Then I did the thing I have regretted more than almost anything I have done in all my lives. I explained it.</p>\n<p class=\"tape\">I told myself what she had told the child: that it had been found. That some Englishman had dug a stone out of the ground in Turkey thirty years before, with the song carved on it, notes and all, and printed it in a journal, and that any clever girl with a father who read the right journals could have learned it off the page. That it was a coincidence. A strange one. The kind you get, in a long enough life.</p>\n<p class=\"tape\">I believed it, because it was true, as far as it went. And because the other thing was impossible.</p>\n<p class=\"tape\">I went back down to my bunk, and lay under Stan, and didn't sleep at all.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. He was looking at the window, at nothing.</p>\n<p>\"What is it?\" I said. \"The song.\"</p>\n<p>He was quiet for so long that I thought he wasn't going to answer. Then, very softly, not well, in an old man's thin voice, he hummed a few bars of it for the tape. It was a simple tune. It rose and fell and turned back on itself, like something you would sing to a child. It was over almost before it began.</p>\n<p>\"An old song,\" he said.</p>\n<p>\"That's all?\"</p>\n<p>\"That's all, today.\"</p>\n<p>I found it that night. It wasn't hard. The oldest complete song in the world, the websites said, carved on a marble column for a man's wife, somewhere around the first century, in a town that is now in Turkey. Dug up by a Scottish archaeologist in 1883, exactly as the young woman on the deck had said. There were recordings. I played one, very quietly, at the kitchen table, with Freda asleep down the hall, and it was the tune he had hummed.</p>\n<p><em>While you live, shine. Have no grief at all. Life exists only a short while, and time demands its due.</em></p>\n<p>The first century. It was the oldest complete song anyone had. Then I went back to the transcript, and the place where he had said he'd known it longer than he'd known anything, and I found I didn't want to think about the arithmetic.</p>\n<p>Freda typed that session the following Sunday. When she got to the humming, she stopped, and played it back, and played it again.</p>\n<p>\"What's this?\" she said.</p>\n<p>\"An old song.\"</p>\n<p>\"I know that,\" said Freda. \"I've heard it. I've heard him do it. On the other tapes. In the background, when he's drawing.\" She took the headphones off. \"He hums it all the time, Mom. Like, every session. You never noticed?\"</p>\n<p>I hadn't.</p>", "audio": false, "added": 1790944894265, "pt": [1790948775374, 1790944894265, 1790951242617, 1790944894265, 1790944894265, 1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790948775374, 1790944894265, 1790948775374, 1790948775374, 1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790948775374, 1790948775374, 1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790951242617, 1790944894265, 1790951242617, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265]}, {"num": 12, "title": "The Foot of the Stairs", "extra": false, "html": "<p>Session twenty-three was the first of April. Freda had typed the song on the Sunday and left the transcript on the kitchen table with every place he hummed it marked in yellow, on every tape she had typed since February. I didn't show him. I set out the recorders and asked him about the Wednesday.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 17, 1912</em></p>\n<p class=\"tape\">On Wednesday evening the fog came down.</p>\n<p class=\"tape\">We were getting near the American coast by then, off the shoals south of Nantucket, and the fog came up out of the sea in the late afternoon and closed over us like a lid. In an hour you couldn't see the bow from the bridge. In two you couldn't see the rail from the deck chairs. The captain brought her down to half speed, and then to dead slow, and the ship's whistle began.</p>\n<p class=\"tape\">Every minute. A long, low, terrible sound, out into the white, and then nothing, and then a minute later the same sound again. It went on all night. It went through the hull and the decks and the walls and the bunks and the people in them. I have heard a great many sounds in a great many lives that I would rather not hear again. That one is near the top. Seven hundred people who had heard a ship's whistle at sea three nights before, and what came after it, lay in their bunks and on the floors of the saloons and listened to it, once a minute, all night long.</p>\n<p class=\"tape\">Nobody slept much, on the Wednesday. Not them, and not us.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Mr. Hatch spent the afternoon typing.</p>\n<p class=\"tape\">He had moved from the smoking room to a table in the corner of the second-class library, where it was quieter, and he had the typewriter out of its case again, and he was typing with two fingers, very fast, from the notebook propped open beside the machine. The notebook was twice the size it had been on Monday. He had been writing in it for three days.</p>\n<p class=\"tape\">I asked him once, when I brought him tea, what he was typing.</p>\n<p class=\"tape\">\"A fair copy,\" he said, without stopping. \"Some of it. The worst of my handwriting. In case a man in New York can't read it.\" He stopped then, and looked at the page in the machine, and at the notebook, and then at me. \"I'll never finish. There's too much. I'll do the rest on the train.\"</p>\n<p class=\"tape\">\"What train, sir?\"</p>\n<p class=\"tape\">\"Whichever one's going out of New York first on Friday morning,\" he said, \"to wherever is furthest from Mr. Ainsley.\" He smiled. It was a tired smile, but a real one. \"Don't look like that, Bertie. Men like Mr. Ainsley don't do anything. They hire lawyers. In a year I'll be in court, and I'll be broke, and I'll have the best story of my life with my name on it.\" He went back to his two fingers. \"There are worse ways to be broke.\"</p>\n<p class=\"tape\">I looked at the typewriter case, open on the chair beside him. There were already pages in the lid, a little stack of them, typed and folded. Not many. Five or six.</p>\n<p class=\"tape\">I didn't know then that I would carry that case off the ship myself, and that it would cost me more than anything I had carried on it.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At half past ten that night I brought him his last cup of tea.</p>\n<p class=\"tape\">He was back in his corner in the smoking room by then. The library had been given over to survivors to sleep in. He was sitting by the black window with the fog pressed against the glass outside, with his coat on, and the notebook on his knee, and his pencil, and he wasn't writing. He was reading it, from the beginning, slowly, turning the pages, the way you read a letter you're about to send to somebody who matters.</p>\n<p class=\"tape\">The whistle went, outside. The glasses on the sideboard rattled.</p>\n<p class=\"tape\">\"Bertie,\" he said.</p>\n<p class=\"tape\">\"Sir.\"</p>\n<p class=\"tape\">\"When this is printed.\" He closed the notebook, and slid it into the inside pocket of his coat, and buttoned the pocket, and patted it once, as I had seen him do every time. \"When it's printed, I'm going to put you in it. <em>A bell boy named Bertie, who brought tea.</em> How's that?\"</p>\n<p class=\"tape\">\"I'd rather you didn't, sir.\"</p>\n<p class=\"tape\">He laughed. \"Why on earth not?\"</p>\n<p class=\"tape\">\"Lyle would have my hide, sir.\"</p>\n<p class=\"tape\">He laughed again, properly this time, and took the tea, and drank it, and made a face at it, because it had been standing.</p>\n<p class=\"tape\">\"I'm going to walk once round the deck,\" he said, \"in this pea soup, and get the cobwebs out, and then I'm going to bed. If anybody asks you, Bertie.\" He looked at me over the cup, and for a moment he wasn't smiling. \"If anybody asks you, you never saw this notebook.\"</p>\n<p class=\"tape\">\"No, sir.\"</p>\n<p class=\"tape\">\"Good boy.\"</p>\n<p class=\"tape\">That was all. That was the last thing he ever said to me. <em>Good boy.</em> I took the cup back to the pantry and Evans washed it and I went down to my bunk.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I didn't sleep. The whistle wouldn't let me, and nor would I.</p>\n<p class=\"tape\">At a quarter to one I got up and went up through the ship in my socks.</p>\n<p class=\"tape\">You couldn't see anything on deck. I came out through the door onto the boat deck and stepped into white. Not white like snow. White like the inside of a cloud, wet and cold and close against your face, so thick the electric lights along the deckhouse were only yellow smears in it, a few feet apart, with nothing between them. Everything dripped. The rail dripped. The boats over my head dripped. The deck was black and shining and slick under my socks.</p>\n<p class=\"tape\">The whistle went. I felt it in my chest.</p>\n<p class=\"tape\">And when it stopped, in the silence after it, I heard footsteps.</p>\n<p class=\"tape\">Somewhere ahead of me, along the deck, in the fog. Going away. Quick, and even, and hard. Click, click, click, click, on the wet boards, getting fainter. Then a door. Then nothing.</p>\n<p class=\"tape\">I stood still. I knew that step. Anyone on that ship would have known it, by then.</p>\n<p class=\"tape\">Leather heels.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The after companionway was a steep stair that went down from the boat deck, inside, to the promenade deck below. Teak steps with brass on the edges, a brass handrail on each side, and a light at the top and a light at the bottom. It was how the second-class passengers went up and down to the boat deck. It was where I'd seen Mr. Hatch go up and down, every day, with his notebook.</p>\n<p class=\"tape\">The door at the top was standing open, and the light at the top was on, and the fog was drifting in over the sill.</p>\n<p class=\"tape\">There was a hat on the top step.</p>\n<p class=\"tape\">A gray felt hat, a cheap one, lying upside down on the top step, with its crown on the tread and the inside of it facing up at the light. I stopped in the doorway and looked at it. The fog was blowing in all around it, and the tread was wet, and the brass edge was wet. The inside of the hat was dry.</p>\n<p class=\"tape\">Then I looked down the stairs.</p>\n<p class=\"tape\">He was lying at the bottom. On his back, on the landing, with one leg still up on the lowest step and his arms out, and his head at an angle a head should not be at, against the wall. His eyes were open. He was looking up the stairs, straight at me. Under his head, on the boards of the landing, there was blood, not a great deal, dark, spreading very slowly.</p>\n<p class=\"tape\">I have seen a great many dead men, Ms. Barnett. I knew before I was halfway down.</p>\n<p class=\"tape\">I went down anyway. I went down very carefully, on the edges of the steps, close to the rail, not touching it, and I knelt beside him on the dry side of the landing and put two fingers under his jaw, as I had done in other lives, and there was nothing. He was still warm. He had not been there long. Minutes.</p>\n<p class=\"tape\">I didn't touch anything else. I looked.</p>\n<p class=\"tape\">I want to tell you what I saw, in the order I saw it, because I have gone over it so many times since that it's worn smooth, and I want you to have it exactly.</p>\n<p class=\"tape\">His coat. The inside pocket, on the left. The one he buttoned every time, and patted. It was unbuttoned. It was hanging open, and it was empty. I could see the lining. There was nothing in it.</p>\n<p class=\"tape\">His right hand, the one flung out toward the wall. The knuckles were skinned. All four of them, raw and fresh, evenly across the tops, with a little blood in the creases. A man falling down a stair on his back might skin a hand on the wall. To me, all four together, like that, looked like a fist that had hit something hard.</p>\n<p class=\"tape\">His pencil. It was on the third step from the top, lying across the tread. Not at the bottom with him. At the top.</p>\n<p class=\"tape\">And on the fifth step, near the wall side, there was a mark. Half a mark, dark on the pale scrubbed teak. The back of a shoe heel, printed in blood. A neat, sharp-edged, curved half-moon, the kind a hard leather heel makes, with one small square notch out of the curve of it, on the inside edge, where a nail had worked loose or a bit of the leather had chipped. The only blood anywhere was on the landing, by his head. So whoever made that mark had stood down there, after he fell, and then gone up. The round back of the heel was toward the landing, which is how a heel sits when a man is climbing.</p>\n<p class=\"tape\">I knelt there, beside him, with the whistle going, and I made a story out of it. I want to be honest about that. It was the story that fitted, and not all of it was in front of me. A man at the top of the stairs, in the fog, at night, with his notebook buttoned in his pocket. Somebody with him. A hat knocked off on the top step before the fog had time to wet the inside of it. A fist thrown. A pencil dropped. A fall. And then somebody coming down after him, kneeling where I was kneeling now, unbuttoning a dead man's pocket. And going back up, fast, on hard heels, one of them coming down in the blood he'd stood in and leaving half a moon on the fifth step.</p>\n<p class=\"tape\">Click, click, click. A door.</p>\n<p class=\"tape\">Most of that I couldn't have proved to anybody. The hat and the pencil said something had happened at the top of the stairs. The knuckles said he had hit something, or somebody. The pocket said somebody had emptied it, or he had. The heel said somebody had stood in his blood and gone up. The rest was me.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">There was a sound behind me. Below me. On the promenade deck, at the bottom of the stairs, a door opening.</p>\n<p class=\"tape\">I turned.</p>\n<p class=\"tape\">It was the young woman in the dark coat.</p>\n<p class=\"tape\">She had come up the corridor from the second-class cabins below, I learned later, because the little girl had woken with the whistle and cried, and she had come up to find somebody, anybody, to get the child some warm milk. She was in a nightdress with her coat over it, and her hair down her back, and a pair of borrowed felt slippers on her feet, the soft kind they had given out to the women who came off the boats with no shoes.</p>\n<p class=\"tape\">She stopped in the doorway at the bottom of the stairs and saw him. Then she saw me.</p>\n<p class=\"tape\">She didn't scream. She didn't make any sound at all. She stood in the doorway with one hand on the frame and looked.</p>\n<p class=\"tape\">And I watched her look, Ms. Barnett. I watched her eyes. I have never forgotten it, and I never will.</p>\n<p class=\"tape\">They went to his face first, as anyone's would. Then, without any pause at all, they went to the coat. The open pocket. Then to his right hand, against the wall, and the knuckles. Then up the stairs, quickly, step by step, to the pencil on the third step, to the hat on the top step, upside down in the light. Then down again. To the fifth step.</p>\n<p class=\"tape\">To the half moon.</p>\n<p class=\"tape\">Every one. In order. In about the time it takes to say it.</p>\n<p class=\"tape\">Then she looked at me.</p>\n<p class=\"tape\">We stayed like that for I don't know how long. A boy of twelve kneeling by a dead man on a landing, and a young woman in a nightdress and a coat, standing in a doorway three feet from him, with the fog drifting down the stairs between us and the whistle going, once, and then the silence after it. And neither of us said anything at all, because there was nothing to say. We had both just done the same thing. We both knew it. We were both, for the first time in that life, looking at somebody who could see.</p>\n<p class=\"tape\">I can't tell you what it was like. I've tried. It was like being alone in a dark house for a very long time, and hearing somebody in the next room put down a cup.</p>\n<p class=\"tape\">\"You've seen it,\" she said. Very quietly.</p>\n<p class=\"tape\">\"Seen what, miss?\"</p>\n<p class=\"tape\">\"Don't,\" she said. \"Not with me.\"</p>\n<p class=\"tape\">I didn't say anything.</p>\n<p class=\"tape\">She came in off the doorway, then, and knelt on the other side of him, on the landing, and put her fingers to his throat, the way I had. Her face didn't change. She took her hand away.</p>\n<p class=\"tape\">\"Go and get the doctor,\" she said. \"And the officer on watch. I'll stay with him.\"</p>\n<p class=\"tape\">I looked at her. I looked at the felt slippers on her feet, soft, silent, the kind you couldn't have heard on those boards if you'd been standing beside them. I looked up the stairs at the half moon on the fifth step.</p>\n<p class=\"tape\">I didn't want to leave her there with it. I knew that. I knew it as clearly as I've ever known anything.</p>\n<p class=\"tape\">And I was twelve, and a dead man was lying on the landing, and a lady had told me to go for the doctor.</p>\n<p class=\"tape\">So I went.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">When I came back with the doctor and the officer of the watch and two stewards, it was ten minutes later, perhaps a little more. She was still there, kneeling beside him, exactly where I had left her. She had closed his eyes.</p>\n<p class=\"tape\">The doctor knelt and looked and shook his head. The officer stood at the top of the stairs with a lantern and looked down, and swore under his breath, and then said he was sorry, miss.</p>\n<p class=\"tape\">\"Stairs like glass in this,\" he said. \"Poor devil must have gone straight down them in the dark. The whole deck's like a skating rink. I nearly went over myself an hour ago.\"</p>\n<p class=\"tape\">\"Yes,\" said the doctor. \"A fall. Look at the angle of the neck.\" He sat back on his heels. \"Does anybody know who he is?\"</p>\n<p class=\"tape\">\"His name's Hatch,\" I said. \"Second class, sir. He's a writer.\"</p>\n<p class=\"tape\">The officer looked at me as if he'd only just noticed I was there. Which I suppose he had.</p>\n<p class=\"tape\">I looked past him, up the stairs, at the fifth step.</p>\n<p class=\"tape\">The half moon was gone.</p>\n<p class=\"tape\">There was a smear there instead. A long, soft, shapeless smear across the wet teak, as if somebody had slipped on it. Somebody in soft shoes.</p>\n<p class=\"tape\">I looked at the young woman. She was getting up off her knees, with one hand on the rail, and her coat had come open, and I saw that the hem of her nightdress was wet and dark across the front, as if she'd knelt in something. Everybody there could see she had knelt beside him. Nobody but me had seen the fifth step before she went up it.</p>\n<p class=\"tape\">\"I'm sorry,\" she said to the officer. Her voice was perfectly steady. \"I went up to see if there was anyone on deck to help, and I slipped. I'm afraid I've made a mess of your stairs.\"</p>\n<p class=\"tape\">\"Not at all, miss,\" said the officer. \"Easily done. That's just what I'm saying. Easily done, in this.\"</p>\n<p class=\"tape\">He wrote it in his book, standing there under the lantern. I watched him write it. I could read it upside down.</p>\n<p class=\"tape\"><em>Fell on after companionway in fog. Death accidental.</em></p>\n<p class=\"tape\">And the young woman pulled her coat around her, and nodded to the doctor, and went back down the corridor toward the second-class cabins, to get the little girl her milk. She didn't look at me as she went.</p>\n<p class=\"tape\">She didn't need to.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>I realized I had been holding my pen without writing anything for some time. I put it down.</p>\n<p>\"She couldn't have taken it,\" I said. \"The pocket was empty before she came.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Then did she know who had?\"</p>\n<p>\"That's what I wondered,\" he said. \"For about a day.\"</p>\n<p>\"And the mark on the step. She wiped it out. On purpose.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Why?\"</p>\n<p>He didn't answer that. He looked at the window. Outside, the rain had stopped, and the field was standing in water, and the sky was low and white and close, almost like fog.</p>\n<p>\"The officer wrote down what was in front of him,\" I said. I heard my own voice, a little strange. \"<em>Death accidental.</em> And went to bed.\"</p>\n<p>\"Yes,\" he said. \"There's always one of those.\"</p>\n<p>I thought of a young policeman with a face like a boiled ham, standing in an apartment on Calloway Street, writing <em>Desk</em> in his book and going away. And then I thought of something else, and it went through me, and I looked at him.</p>\n<p>\"Leather heels,\" I said.</p>\n<p>He met my eyes.</p>\n<p>\"I told you,\" he said. \"It reminded me of something a long way off.\"</p>\n<p>\"That's why your hand stopped. On the coffee pot.\"</p>\n<p>\"Yes,\" he said. \"That's why.\"</p>", "audio": false, "added": 1790944894265, "pt": [1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790948775374, 1790944894265, 1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790948775374, 1790944894265, 1790948775374, 1790948775374, 1790944894265, 1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790948775374, 1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790948775374, 1790944894265, 1790948775374, 1790948775374, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265, 1790944894265]}, {"num": 13, "title": "The Little Girl's Name", "extra": false, "html": "<p>The card came on Monday night, by courier, at a quarter to nine.</p>\n<p>It was the same young man in the same reflective jacket, with the same motorcycle idling at the curb and the same tablet for me to sign with my finger. He said, \"Barnett?\" and I said yes, and he gave me the envelope, heavy cream paper, <em>Aldine, Mercer and Voss</em>, and was gone before I had the door shut.</p>\n<p>Freda was at the kitchen table. She had stopped typing when the doorbell went, and she had taken her headphones off, and she was watching me come back down the hall with the envelope just as she had watched me in the winter, when the last one came.</p>\n<p>\"Is it him?\"</p>\n<p>\"It's the firm.\"</p>\n<p>\"It's him,\" said Freda. \"Open it.\"</p>\n<p>There was one card inside. No letter, no typed note. One line, in ink, in the old schooled hand that leaned too far to the right.</p>\n<p>It was worse than the last one. I saw that before I had read a word. The tremor in the long strokes had got into all of them now, the short ones too, so that every letter wavered a little, like something seen through water. In two places the pen had stopped, and started again, and left a blot. Whoever had written it had held the pen very hard, and it had taken him a long time.</p>\n<p><em>Please ask him the little girl's name.</em></p>\n<p>I read it out. Freda held out her hand, and I gave it to her, and she tilted it under the kitchen light.</p>\n<p>\"His hand's worse,\" she said.</p>\n<p>\"Yes.\"</p>\n<p>\"Like, a lot worse.\" She turned the card over, as if there might be something on the back. There wasn't. \"What little girl?\"</p>\n<p>\"In the boat. The one the governess was holding. On the deck, at night, when she hummed.\" I sat down across from her. \"It's in Thursday's tape. You typed it.\"</p>\n<p>\"I know who she is. I mean, why her?\" Freda put the card down on the table between us, very carefully, as if it might break. \"Of everybody on the whole ship, he wants to know her name. Not the bad guy's. Not the governess's. A little kid's.\"</p>\n<p>\"He's told me he won't give any names from the boat.\"</p>\n<p>\"I know. I typed that too.\" Freda looked at the card. \"So it's like a test. Right? To see if he'll do it.\"</p>\n<p>\"Maybe.\"</p>\n<p>\"Or to see if he knows it,\" said Freda.</p>\n<p>I didn't say anything to that. I didn't have anything to say. I picked up the card and put it in my notebook, beside the first letter and the Carpathia card, three of them now in a row, the steady hand and the shaking one and this one, which was something worse than shaking.</p>\n<p class=\"break\">&#10043;</p>\n<p>On Tuesday I went looking for Mr. Hatch.</p>\n<p>I had been putting it off. I knew why. Every name Tom had given me so far that I could check, I had checked, and every one had come back true. Rostron, Cottam, Bride, the Californian, the four buried at four o'clock. But those were famous names, in a famous story, with a hundred books about them. A clever man could have read the books. Hatch was different. Hatch was a nobody. A thin man in a brown suit with a typewriter, going to Naples to write about a volcano. If Hatch had been on the Carpathia, and had died on the Carpathia, there might be nothing anywhere in the world to say so. And if there was nothing, I would never know whether that was because Hatch had never existed, or because nobody had cared.</p>\n<p>So I didn't want to look, and I looked.</p>\n<p>The Library of Congress has put millions of pages of old American newspapers online, every page photographed, every word run through a machine so you can search it, badly. I sat at the kitchen table after the school run with a cup of coffee going cold and searched April 1912 for <em>Hatch</em>, and got four hundred results, most of them about chickens.</p>\n<p>I narrowed it down. <em>Hatch</em> and <em>Carpathia</em>. Nothing. <em>Hatch</em> and <em>fell</em>. Nothing useful. I tried the papers one at a time, the New York ones, for the days after the Carpathia came in, the nineteenth and the twentieth and the twenty-first, when every page of every paper was about the Titanic and nothing else, and the machine had read the small print so badly it was nearly useless. I read the pages myself. Column by column. It took most of the day.</p>\n<p>I found it at a quarter past three, in the New-York Tribune for Saturday, April 20, 1912, on page seven, at the bottom of a long column of short items headed <em>INCIDENTS OF THE RESCUE SHIP'S VOYAGE.</em> Between a paragraph about a dog that had not been saved and a paragraph about a collection taken up among the Carpathia's passengers for her crew.</p>\n<p>Three lines.</p>\n<p><em>Among the Carpathia's own passengers, a magazine writer named Lowell Hatch, bound for Naples, was killed on Wednesday night by a fall on a companionway, the decks being made slippery by the fog. His body was brought into port.</em></p>\n<p>That was all.</p>\n<p>I sat at the kitchen table and read it, and read it again, and then I got up and walked around the kitchen, and came back, and read it again. <em>A magazine writer. Bound for Naples. Wednesday night. A fall on a companionway. The fog.</em></p>\n<p>Every fact in it was one he'd told me. Nothing in it was anything he couldn't have known if he'd been there. And I had just spent six hours finding it, and I had been very good at finding things, once. If it was anywhere easier, I hadn't found that either.</p>\n<p>Or he had found it first. Years ago. On some long night of his own. And built a man around it.</p>\n<p>I made myself write that down. I made myself look at it. Then I wrote under it: <em>Three lines. Brown suit, two fingers, \"Good boy.\" Nobody builds that from three lines.</em></p>\n<p>And then: <em>I don't know that.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>I read him the card on Thursday morning, the twenty-fourth session, before the recorders, at the kitchen table, with the coffee.</p>\n<p>He took it out of my hand and held it near the window, in the gray light, and looked at it for a long time. He looked at the handwriting more than at the words. I watched his eyes go along the long strokes, the blots, the places where the pen had stopped and started.</p>\n<p>\"He's not well,\" he said quietly.</p>\n<p>\"No.\"</p>\n<p>\"He's worse than in the winter. A good deal worse.\" He turned the card in his fingers. \"And he's in a hurry now. He wasn't, before.\"</p>\n<p>Then he read the words, and something in his face shut, very gently, like a door closed on a sleeping child.</p>\n<p>\"I told you,\" he said. \"No names from the boat.\"</p>\n<p>\"I know. I told him that you'd said that. In the transcript.\"</p>\n<p>\"Then he knows.\" He put the card down on the table. He was quiet for a while. Then he reached past me for the notepad on the windowsill, the one he kept for shopping lists, and tore off the top sheet, and picked up a pencil, and turned his shoulder to me, a little, like a boy in a classroom covering his answers, and wrote something. One word, I thought. Perhaps two. He folded the paper in half, and in half again.</p>\n<p>\"Have you got an envelope?\"</p>\n<p>I had. I always had. He put the folded paper inside it, and licked the flap, and sealed it, and pressed it down with his thumb, all the way along. Then he handed it to me.</p>\n<p>\"Send him that,\" he said. \"Sealed. Not in the transcript. Not typed. Just that.\"</p>\n<p>I looked at the envelope in my hand. Then I looked at him.</p>\n<p>\"You won't tell me,\" I said. \"But you'll tell him.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Why?\"</p>\n<p>\"Because I'm not telling him,\" he said. \"Not really.\" He folded his hands on the table. \"Ms. Barnett, if I'm wrong about why he's asking, then it's a little girl's name, nearly a hundred and fifteen years old, sealed in an envelope, and it goes to an old man who will read it once and put it in a drawer, and no harm in the world comes of it. And if I'm right about why he's asking...\" He stopped.</p>\n<p>\"Then what?\"</p>\n<p>\"Then he knows it already,\" he said. \"Better than I do.\"</p>\n<p>He wouldn't say anything else about it. I asked him three ways, as I used to ask a source who had decided to stop talking, and he answered every one of them with that same gentle shut-door look. In the end I put the envelope in my notebook, beside the card, and didn't open it.</p>\n<p>I want to be clear about that. I didn't open it. Not then, not in the car, not at the kitchen table that night with a kettle on the stove and nobody watching. I sent it to Aldine, Mercer and Voss by registered mail on Friday morning, sealed, exactly as he'd given it to me, with a short note of my own: <em>From the gentleman. At his request, not opened.</em></p>\n<p>When I told Freda, she looked at me as if I had grown a second head.</p>\n<p>\"You didn't open it?\"</p>\n<p>\"No.\"</p>\n<p>\"Mom. You open <em>everything.</em> You opened my report card from the eighth grade before I got home and you resealed it with a glue stick.\"</p>\n<p>\"That was different.\"</p>\n<p>\"How?\"</p>\n<p>\"He asked me not to,\" I said.</p>\n<p>Freda looked at me for a long moment. Then she went back to her laptop, and put her headphones on, and said, to the screen, so quietly I almost didn't hear it, \"Who even are you.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I told him about the Tribune, before I left.</p>\n<p>I had not been going to. I had thought I would keep it, as I'd kept Pearl in the winter, to be the one who knew. But at the door, with my coat on, I found I wanted to see his face.</p>\n<p>\"I found Mr. Hatch,\" I said.</p>\n<p>He had been holding the door. He stopped.</p>\n<p>\"In the New-York Tribune. April the twentieth. Page seven.\" I had it on my phone. I read it to him, all three lines, standing on his porch, with the field behind me still standing in water.</p>\n<p>He listened to the end without moving. When I had finished, he looked out over my shoulder at the field for a moment.</p>\n<p>\"Three lines,\" he said.</p>\n<p>\"Yes.\"</p>\n<p>\"Bound for Naples. He'd have liked that they got Naples in.\" He was quiet. \"That's more than most of them got, you know. Most of the ones who die like that. Three lines, with your name spelled right.\" He looked back at me. \"Thank you for finding him, Ms. Barnett.\"</p>\n<p>\"It doesn't prove anything,\" I said. \"You know that. You could have found it too.\"</p>\n<p>\"I could have,\" he said. \"Yes.\"</p>\n<p>\"Did you?\"</p>\n<p>\"No,\" he said. \"I've never looked.\" And then, when I didn't say anything: \"I didn't want to see how short it was.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>On the step I turned back, because I had nearly forgotten.</p>\n<p>\"Next week is Freda's spring break,\" I said. \"She asked if she could come. On Thursday. She's typed every one of these since the winter. She wants to meet you.\" I hesitated. \"She says she's met you already, really. From the tapes. But she wants to see if you're the same.\"</p>\n<p>Something came into his face that I hadn't seen there before. It took ten years off him, and then another five.</p>\n<p>\"I'd like that very much,\" he said. \"Tell her I'll make the eggs.\"</p>", "audio": false, "added": 1790945753737, "pt": [1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790951242617, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737]}, {"num": 14, "title": "Spring Break", "extra": false, "html": "<p>Freda changed her clothes three times before we left.</p>\n<p>I didn't say anything. I sat in the car in the driveway with the engine running and the heater on and waited, and when she came out the third time, in the jeans she'd started with and a sweater of mine that she had stopped asking to borrow sometime around Christmas, she got in and put her feet on the dashboard and said, \"Don't.\"</p>\n<p>\"I didn't say anything.\"</p>\n<p>\"You were going to.\"</p>\n<p>We drove north. The trees along the highway had gone a faint, uncertain green, the color of a thing that hasn't made up its mind yet, and past Frederick the fields were plowed and dark and wet, with gulls following the tractors. Freda didn't put her headphones on. She sat with her phone face down on her knee and watched it all go by.</p>\n<p>\"What do I call him?\" she said, somewhere past the state line.</p>\n<p>\"Mr. Hale.\"</p>\n<p>\"He calls you Ms. Barnett. Still. After like six months.\" She thought about it. \"That's so weird. That's like a guy in a movie about a butler.\"</p>\n<p>\"He's from another time.\"</p>\n<p>\"Mom,\" said Freda, \"that's literally the whole question.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He was on the porch when we came up the gravel road. No umbrella, for once. It wasn't raining. He was standing at the top of the steps in his cardigan, buttoned wrong by one, with his hands behind his back, and when the car stopped he came down the steps one at a time with his hand on the rail and stood at the bottom to wait for us, and I realized that he had been waiting at the window for a long time.</p>\n<p>Freda got out of the car slowly. She stood by the door and looked at him, and he looked at her, and for a moment neither of them said anything.</p>\n<p>Then he put out his hand.</p>\n<p>\"Miss Barnett,\" he said.</p>\n<p>\"Freda,\" said Freda. She shook it. \"Nobody calls me Miss Barnett. Not even at school.\"</p>\n<p>\"Freda, then.\" He didn't let go of her hand at once. He held it, and looked at her, and I saw his face do something I had only seen it do once before, on the porch the week before, when I asked him if she could come. \"I'm Tom. I've heard a great deal about you.\"</p>\n<p>\"I've heard a great deal about <em>you</em>,\" said Freda. \"Like, hours. I've typed about forty hours of you.\"</p>\n<p>\"I'm so sorry.\"</p>\n<p>She laughed. It surprised her. It was the real laugh, the one she used to have when she was small, before she learned the careful one, and I had not heard it in a long time.</p>\n<p class=\"break\">&#10043;</p>\n<p>He made the eggs.</p>\n<p>He made them the slow way, in a pan over a low flame, stirring all the time with a wooden spoon, and he made toast from the crying pillow, and he put a jar of marmalade on the table that I had never seen before and that I suspected he had bought that week in town for the occasion. Freda sat at the kitchen table with her chin on her hand and watched him do all of it as if she were watching a magic trick, trying to see where the card went.</p>\n<p>\"Mom says you do a thing,\" she said.</p>\n<p>\"What thing?\"</p>\n<p>\"Where you look at somebody and tell them stuff about themselves. Like the guy on TV. Where they were, what they had for lunch.\" She tilted her head. \"Do it to me.\"</p>\n<p>He turned around from the stove with the spoon in his hand and looked at her. Freda sat up very straight and looked back, ready, as she used to stand at the plate in Little League.</p>\n<p>He looked at her for what felt like a long time. Then he turned back to the pan.</p>\n<p>\"No,\" he said.</p>\n<p>\"Why not?\"</p>\n<p>\"Because your mother tells it better than I do it,\" he said. \"And because it's rude.\" He stirred the eggs. \"And because you'd spend the rest of the morning wondering what I'd seen that I hadn't said. People always do. It spoils the eggs.\"</p>\n<p>Freda looked at me. I shrugged. She looked back at him, at his back, at the cardigan buttoned wrong, and I saw her decide something about him, and file it, and I recognized the look, because it was mine.</p>\n<p class=\"break\">&#10043;</p>\n<p>She asked him about the song over breakfast.</p>\n<p>\"You hum it all the time,\" she said. \"On the tapes. Every one. When you're drawing. Did you know?\"</p>\n<p>\"Yes,\" he said. \"I've been told before.\"</p>\n<p>\"What is it, really? Mom found it online. It's like the oldest song in the world.\"</p>\n<p>\"It's an old song,\" he said.</p>\n<p>\"You always say that.\"</p>\n<p>\"Then it must be true.\" He buttered a piece of toast and gave it to her, without asking, as you would for a child, and she took it without noticing, as a child does. \"Would you like to hear it properly? Not on the tape.\"</p>\n<p>Freda nodded.</p>\n<p>So he hummed it, there at the kitchen table, over the plates, in his thin old voice, all the way through. It took less than a minute. It went up, and turned, and came down, and turned back on itself, and ended almost where it began. Freda sat very still with the toast in her hand. And the second time through, so quietly I almost didn't hear it, she hummed it with him. She had learned it off the tapes.</p>\n<p>He stopped, and looked at her.</p>\n<p>\"You've got a good ear,\" he said. \"Your mother told me.\"</p>\n<p>Freda did the thing with her mouth, the small pressed thing, and looked at her plate.</p>\n<p class=\"break\">&#10043;</p>\n<p>My phone rang at a quarter past ten.</p>\n<p>I almost didn't answer. It was a number I didn't know, a city exchange. But I had been waiting two months for a number I didn't know, so I took it out onto the porch and shut the door behind me.</p>\n<p>It was a woman at the police department's records unit. She had the voice of somebody who had been reading out the same sentences all morning. My request for the complete file in the missing persons case had been processed, she said, and approved in part. Some material was withheld under the usual exemptions. The rest, including the responding officer's notes and the photographs taken at the scene, was ready to be collected in person, with identification, at the records office downtown, any weekday between nine and four.</p>\n<p>\"Photographs,\" I said.</p>\n<p>\"Fourteen photographs,\" said the woman. \"And two pages of notes. You'll need to sign for them.\"</p>\n<p>I said I would come on Monday. I stood on the porch for a while after she'd hung up, with the phone in my hand, looking at the field. Fourteen photographs. I had been in that apartment once, six years ago, and a cat had sat on my notebook. On Monday I was going to walk through it again.</p>\n<p>It was cold on the porch, and I hadn't brought my coat out. Through the kitchen window beside me I could see the two of them at the table.</p>\n<p>I didn't mean to watch. I want to say that. But I was a reporter for a long time, and a mother for longer, and the window was right there.</p>\n<p>Freda was talking. She had her elbows on the table and her hands around her mug, and she was talking to him, quickly, looking down at the mug, and then up at him, and then down again. I couldn't hear anything through the glass. He was sitting very still across from her, just as he sat when I talked about Carrow, with his hands folded on the table and his head a little on one side, listening. Not interrupting. Not doing anything at all but letting her talk.</p>\n<p>Then she stopped. She put one hand up, quickly, and wiped under her eye with the heel of it, the way she had done since she was small when she didn't want anyone to see.</p>\n<p>He said something. Not much. A sentence, perhaps two.</p>\n<p>Freda looked at him for a long moment. Then she laughed, a small wet surprised laugh, and shook her head, and picked up her toast.</p>\n<p>I went back in.</p>\n<p class=\"break\">&#10043;</p>\n<p>They both looked up when the door opened. I came across the kitchen, rubbing my arms against the cold, and as I came I heard the end of what he was saying, quietly, to her.</p>\n<p>\"...they don't get lighter, Freda. That's the thing nobody tells you. They get heavier, every day you carry them. And sooner or later, somebody else ends up carrying them for you.\"</p>\n<p>Freda had her eyes on him. \"Are you talking about me?\"</p>\n<p>\"I'm talking about a notebook,\" he said. And then he looked up and saw me, and smiled, and said, \"Was that your police file?\"</p>\n<p>\"Yes. How did you know?\"</p>\n<p>\"You went out with your shoulders up and came back with them down,\" he said. \"And you said <em>photographs</em> on the porch loud enough to hear through a window.\" He got up to take my plate. \"Good news?\"</p>\n<p>I told him. Fourteen photographs. Monday. He nodded slowly, and said that he'd like to hear about them, if I wanted to tell him, and put the plate in the sink.</p>\n<p>\"What did I miss?\" I said, to the room.</p>\n<p>Freda looked at her toast.</p>\n<p>\"We were talking about Bertie,\" said Tom. \"His sisters, in Bootle. Freda wanted to know if he ever went home.\"</p>\n<p>\"Did he?\"</p>\n<p>\"That's another Thursday,\" he said, and ran the water.</p>\n<p>I looked at Freda. Freda looked at me, and then out of the window, at the field, and her face was perfectly calm and her eyes were a little red, and I knew my daughter, and I knew she was not going to tell me anything, and I let it go.</p>\n<p>I let it go. I have thought about that since.</p>\n<p class=\"break\">&#10043;</p>\n<p>We went through to the living room at eleven. He sat in his chair and settled the notepad on his knee. I set out the recorders on the little table and said the date into them, and the time, and <em>Session twenty-five,</em> and then, because it was true and because it was going on the tape forever, <em>Freda Barnett present.</em></p>\n<p>Freda had not taken the chair I'd pulled up for her. She was sitting on the stairs, on the third step, among the books that climbed up them one to a step, with her knees drawn up and her arms around them. From there she could see him, and he could see her.</p>\n<p>\"Thursday,\" he said. \"The last day.\"</p>\n<p>He looked at Freda, on the stairs.</p>\n<p>\"I'm going to tell you how I lost,\" he said. \"It's a long story. You might want to get comfortable.\"</p>\n<p>\"I'm comfortable,\" said Freda.</p>\n<p>He nodded. He picked up the pencil, and without looking down he began to draw the star, around and around, and began.</p>", "audio": false, "added": 1790945753737, "pt": [1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737]}, {"num": 15, "title": "The Boot Room", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 18, 1912, before dawn</em></p>\n<p class=\"tape\">I didn't go back to my bunk that night. There didn't seem to be any point.</p>\n<p class=\"tape\">I sat on the floor of the bell boys' cabin with my back against Stan's bunk and my knees drawn up, in the dark, with the whistle going once a minute through the hull, and I did what I have always done when something has happened that I can't undo. I went over it. Not what I felt. I have never been much use at that. What I saw.</p>\n<p class=\"tape\">The hat, dry inside. The pencil on the third step. The knuckles. The open pocket. The half moon on the fifth step, with the little square notch out of its curve. The click of heels going away along the deck, and a door. And a young woman in felt slippers, kneeling on the other side of a dead man, looking at all of it in the same order I had.</p>\n<p class=\"tape\">And a smear on the fifth step, where the half moon had been.</p>\n<p class=\"tape\">I could have told the officer, of course. I thought about it, very carefully. I could have stood up on that landing in my socks and said, <em>Sir, there was a heel print on the fifth step and the lady wiped it out with her nightdress, and I heard a man in hard shoes walking away along the deck, and it was Mr. Ainsley, who offered Mr. Hatch five hundred dollars on Tuesday.</em></p>\n<p class=\"tape\">And the officer would have looked at a bell boy with no cap on, at one in the morning, out of his bunk where he had no business to be, telling tales about a first-class gentleman who sat on the boards of several things. And then at the young lady, who had just told him she slipped. And then at the step, which had nothing on it but a smear.</p>\n<p class=\"tape\">And he would have sent me below, and told Lyle, and that would have been the end of me. And of Hatch.</p>\n<p class=\"tape\">I've told you. When you're small, you don't push. You make the best of what's in front of you.</p>\n<p class=\"tape\">So I sat on the floor in the dark and asked myself what was in front of me. And at about four o'clock in the morning, I found it.</p>\n<p class=\"tape\">Shoes.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">You'll have forgotten this, or you never knew it. In those days a gentleman traveling first class didn't clean his own shoes. Nobody would have expected him to. At night, before he went to bed, he put them outside his cabin door, in the passage, and in the morning they were back, polished, with his cabin number chalked on the sole. Somebody had come along the passage in the small hours and taken them away and cleaned them and brought them back. On the Carpathia that was the boots, an old steward called Fennimore. On a busy crossing he had a bell boy to fetch and carry for him, taking the cleaned shoes back up in the morning, and that week, with seven hundred extra people on board, he had two. I was one. The blacking he did himself. Nobody touched Fennimore's brushes but Fennimore.</p>\n<p class=\"tape\">I'd been carrying shoes for three weeks. I didn't think about it any more than you think about brushing your teeth.</p>\n<p class=\"tape\">Mr. Ainsley had been given a cabin on B deck, by one of our own first-class gentlemen who had moved in with his brother. I knew which one. I knew every cabin on that deck, by then, and who was in it.</p>\n<p class=\"tape\">And this is the thing I sat on the floor and turned over, Ms. Barnett, until I thought I knew what he'd do. A man who has done what Mr. Ainsley did on that staircase wants, more than anything in the world, the next morning, to be a man who did nothing. He wants to be ordinary. He wants to do every single thing he would have done anyway. And a first-class gentleman, every night of his life, puts his shoes out.</p>\n<p class=\"tape\">If he didn't, Fennimore would notice. Fennimore noticed everything about shoes. He'd mention it to the bedroom steward, who'd mention it to somebody else, and by breakfast half the stewards on the ship would know that the gentleman in B-52 had kept his shoes in, the night the writer fell.</p>\n<p class=\"tape\">I thought a careful man would put them out. Wet as they were. And hope. If I was wrong, there would be a gap on the rack where B-52's shoes should be, and that would tell me something too.</p>\n<p class=\"tape\">At half past four I went to the boot room.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">It was a little steel cupboard of a place down on C deck, with a bench and a gas ring and a hundred pairs of shoes in rows on racks, and a smell of blacking that I can call up now if I close my eyes. Fennimore wasn't there yet. He came at five. I lit the lamp.</p>\n<p class=\"tape\">Fennimore did his round of the first-class passages at three every morning, racked what he'd collected, and went back to his bunk for two hours before he cleaned them. The shoes were on the second rack, in the row he had brought down from B deck. Black, good leather, a gentleman's shoes, still damp across the toes from the deck. And on the sole of the right one, in Fennimore's chalk, the number of his cabin.</p>\n<p class=\"tape\">I picked up the right shoe and turned it over under the lamp.</p>\n<p class=\"tape\">The heel was a hard one, stacked leather, the kind that clicks. And on the inside edge of it, at the curve, there was a notch. One small square notch, where a nail had worked loose and a bit of the leather had chipped away. Just there. Just that shape. And down in the notch, dried brown, a little crust of something the walk back along a wet deck hadn't washed out. It might have been anything, to anyone who hadn't seen the fifth step.</p>\n<p class=\"tape\">I stood under the lamp with that shoe in my hand for a long time.</p>\n<p class=\"tape\">I was sure. In that cupboard, at twenty to five in the morning, I was as sure as I have ever been of anything. Hatch's pocket and Hatch's knuckles and Hatch's pencil, and a half moon on the fifth step with a notch in it, and the shoe that made it, in my hand.</p>\n<p class=\"tape\">It wasn't nothing. But it wasn't enough, and I knew exactly how far short it fell. The half moon was gone. Wiped away. Nobody had seen it but me, and the man who made it, and a young woman who had made very sure no one else would. And the shoe, by itself, was a gentleman's shoe with a chipped heel and a speck of something brown in it. Being sure isn't proving.</p>\n<p class=\"tape\">I thought about taking it. Walking it up to the doctor, who had already written <em>a fall</em>, or to the purser, who had seven hundred names to take before New York. But a bell boy with a first-class gentleman's shoe in his hand at five in the morning is a boy who has stolen a shoe. Mr. Ainsley would miss it by six and know somebody had been looking. And by the time anyone who mattered looked into that notch, the brown in it would be whatever the gentleman said it was. Rust. Polish. Dirt from the deck.</p>\n<p class=\"tape\">So I did the one thing I could do that kept it where it was. I didn't clean it. Fennimore would clean the rest of the rack at five and send them up, and the right shoe of B-52 would go up with the others, and I didn't want a brush or a cloth to touch that heel. So I took a rag and did the toes of both, quickly, the way Fennimore liked, and the uppers, and put a shine on them you could see your face in. And I left the heels alone. I put them back on the rack exactly where they'd been, with the chalk on the sole.</p>\n<p class=\"tape\">Then I put out the lamp, and went up, and at breakfast I saw Mr. Ainsley.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He was at the head of a table in the first-class dining saloon, at the first sitting, in his good gray suit and his shined shoes, with his little group around him. He was talking. He looked rested. He had a bruise on the left side of his jaw. A fresh one, going purple, just at the corner, about where a right-handed man's fist lands if he swings up at somebody taller. A fall against a rail could have done it too.</p>\n<p class=\"tape\">He was telling them about it. I could hear him from the sideboard. He'd slipped on deck, he said, in that confounded fog, last night, coming back from a turn around the deck. Gone down like a sack of potatoes and hit his chin on the rail. He laughed about it. The big laugh. His group laughed too.</p>\n<p class=\"tape\">And then one of the ladies said, had he heard, about the poor man on the stairs? The writer? Killed, in the fog, last night. Fell all the way down. Wasn't it dreadful. And they'd all been saying, hadn't they, how slippery the decks were.</p>\n<p class=\"tape\">Mr. Ainsley put down his cup. He shook his head. He said it was a terrible thing, and he'd heard, and he was very sorry, and that only went to show. And then he said that he had spoken with the man himself, on Tuesday. Rather a sad case, he said. Hard up. Had been going about the ship trying to sell people's stories to the newspapers. He had told him, quite kindly, that it wasn't the thing. Not that week. Not with people grieving.</p>\n<p class=\"tape\">The ladies all agreed it wasn't the thing.</p>\n<p class=\"tape\">I poured the coffee and looked at the bruise on his jaw, and the hand that was holding his cup, the right one, still wrapped in a handkerchief. And I thought of four skinned knuckles on a dead man's hand, flung out against a wall.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The other thing came to me while I was pouring coffee. It's often that way. You stop looking for something and it walks up and sits down beside you.</p>\n<p class=\"tape\">The typewriter case.</p>\n<p class=\"tape\">Mr. Hatch had typed all Wednesday afternoon, in the library. A fair copy, he'd said. The worst of his handwriting. And when I took him his tea, I had seen the little stack of typed pages, folded, in the lid of the case. Five or six. And the case had been on the chair beside him.</p>\n<p class=\"tape\">I thought Mr. Ainsley still had the notebook. I couldn't know it. He might have put it over the side in the fog before he was ten steps from the stairs. But a man like Ainsley, in my experience, keeps a thing like that. He wants to know whose names are in it. Who talked. Three people, Hatch had said. Three people in the same boat, who'd agreed to forget. In New York, Mr. Ainsley would want to see each of the three of them, very privately, and be very kind.</p>\n<p class=\"tape\">But Mr. Ainsley hadn't been in the library on Wednesday afternoon. He'd been in the smoking room, with his group, telling them about the tiller.</p>\n<p class=\"tape\">He didn't know about the pages.</p>\n<p class=\"tape\">I put down the coffee pot. I asked Lyle if I could go to the lavatory, and he said I had a bladder like a sparrow, and I went.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The library had been given over to survivors to sleep in. It was half dark, with the curtains drawn against the fog and the whistle going, and there were people asleep on the sofas and on mattresses on the floor and in the armchairs, under blankets, and a smell of wet wool and coal smoke. Nobody had touched Mr. Hatch's corner. Nobody had thought to. A dead man's things are the purser's business, and the purser, that morning, had seven hundred living people's business, and Hatch was a three-line paragraph.</p>\n<p class=\"tape\">The typewriter case was on the chair where I'd last seen it. Shut. Latched.</p>\n<p class=\"tape\">I picked it up.</p>\n<p class=\"tape\">It was heavier than it looked. I remember thinking that. A small case, scuffed at the corners, with a leather handle that had been mended with string. <em>It's all I've got that's worth stealing,</em> he had said, on the gangway at New York, when I tried to take it from him.</p>\n<p class=\"tape\">I carried it out of the library past the sleeping people, and nobody woke. A bell boy carrying a case is the most ordinary thing in the world. I carried it down four decks to the bell boys' cabin and put it in my locker and shut the door.</p>\n<p class=\"tape\">Then I sat down on the floor in front of the locker, in my socks, and opened the case, and took the pages out of the lid, and read them.</p>\n<p class=\"break\">&#10043;</p>\n<p>He looked up then. At the stairs.</p>\n<p>Freda was sitting very still on the third step, with her arms around her knees and her chin on them.</p>\n<p>\"I'm not going to tell you everything that was on those pages,\" he said. \"I'll tell you what you need, and no more, and no names. I'm sorry. I know you'll want them.\"</p>\n<p>\"It's okay,\" said Freda. Her voice was small.</p>\n<p>He nodded. He looked down at the notepad.</p>\n<p>\"It was an early boat,\" he said. \"Lowered with a good deal of room left in it, the way the early ones were, when nobody believed yet. There were men in it. Mr. Ainsley at an oar. The mother, with the little boy. The young woman with the girl. Others.\" He drew around the star. \"They pulled away from the ship as they'd been told, and lay off, and watched her go down. And then, when she'd gone, there were the people in the water.\"</p>\n<p>He was quiet for a moment.</p>\n<p>\"You've read about it. Everyone has. The sound of it. There was room in that boat for twenty more. Some of them wanted to go back. And the young woman said no. She said it very clearly, Hatch wrote, so that everyone could hear. She said if they rowed back into that, there were a thousand people in the water and a boat with room for twenty, and the people in the water would come over the sides and turn the boat over, and then nobody would be saved at all. Not the children. Nobody. She said it as plainly as that.\" He stopped drawing. \"And she was right. That's the thing. She was probably right. Boats that went back too soon, into the thick of it, had a terrible time. She did the arithmetic, and she said it out loud, and nobody else in that boat was brave enough to.\"</p>\n<p>\"And they didn't go back,\" I said.</p>\n<p>\"They lay off and waited. Rowed a little way, to be safe.\" He looked at the window. \"And a man swam to them. One man. A steward, from the Titanic, in his white jacket. He'd swum a long way, in that water, which nobody could do for long. He got to them. He got his hands on the side of the boat.\"</p>\n<p>Freda had gone very still.</p>\n<p>\"Mr. Ainsley stood up in the boat,\" he said, \"with his oar. And hit his hands. Twice. Until he let go.\"</p>\n<p>Freda put her forehead down on her knees. He waited until she lifted it again.</p>\n<p>\"Then he sat down,\" said Tom, \"and took up his oar, and pulled. And he told everyone in that boat it hadn't happened. That the man had been gone already. That nobody had seen anything, in the dark. And they all agreed. They sat in that boat until dawn, and they agreed. Hatch got it from three of them. The mother was one. She'd been holding the little boy, at the side, right there, and she'd seen the man's face.\" He put the pencil down. \"That was what was in Hatch's notebook. That was what Mr. Ainsley was going to walk off the ship with in his pocket. And that was what I had in a typewriter case in my locker, five pages of it, typed with two fingers, at a quarter past seven on Thursday morning.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there. He reached for his tea.</p>\n<p>Freda was looking at him from the stairs.</p>\n<p>\"He hit his hands,\" she said. Very quietly.</p>\n<p>\"Yes.\"</p>\n<p>\"And she said not to go back.\"</p>\n<p>\"Yes.\"</p>\n<p>\"So she's...\" Freda stopped. \"Is she bad? Or is he? Or...\"</p>\n<p>\"He hit a drowning man's hands with an oar,\" he said, \"and then lied about it, and then killed a man on a staircase to keep the lie.\" He said it quite gently. \"And she looked at a boat full of children and did a terrible sum and said the answer out loud. Those aren't the same thing, Freda.\"</p>\n<p>\"But nobody went back.\"</p>\n<p>\"No.\"</p>\n<p>\"And if they had, they all might have died.\"</p>\n<p>\"Very likely.\"</p>\n<p>\"So she was right,\" said Freda, \"and it was still awful.\"</p>\n<p>\"Yes.\"</p>\n<p>Freda put her chin back down on her knees. She ran her thumb down the spine of the book on the step beside her, and up again.</p>\n<p>\"I don't like that both of those are true,\" she said.</p>\n<p>\"No,\" said Tom. \"Nobody does.\" He picked up the pencil again. \"You don't have to like it. You only have to not pretend one of them away.\"</p>", "audio": false, "added": 1790945753737, "pt": [1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790956055641, 1790956055641, 1790945753737, 1790948775374, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790948775374, 1790945753737, 1790948775374, 1790951242617, 1790954068779, 1790951242617, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790945753737, 1790948775374, 1790945753737, 1790948775374]}, {"num": 16, "title": "The Governess", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 18, 1912, morning</em></p>\n<p class=\"tape\">I had read the pages twice, sitting on the floor in front of my locker. I put them back in the lid of the case, and shut it, and latched it, and put it at the back of the locker behind my spare jacket, and shut the locker door. Then I sat there a while longer.</p>\n<p class=\"tape\">I knew what I had to do with them. That was the easy part. They had to go to somebody who could do something. Not a bell boy. Somebody with gold on his sleeve.</p>\n<p class=\"tape\">The hard part was how.</p>\n<p class=\"tape\">I couldn't walk into the purser's office with a dead man's typewriter case and say, <em>Sir, I took this from the library, and inside it there's an account of a first-class gentleman beating a drowning steward off a lifeboat with an oar, and I believe he killed the man who wrote it.</em> I'd have been in irons before I got to the second sentence. A bell boy who takes a dead passenger's property is a thief. That's all he is. Whatever's in the property.</p>\n<p class=\"tape\">No. It had to be found. By the right man, in the right way, so that he found it himself and believed what he'd found. That's the trick, Ms. Barnett. It's always been the trick, when you're small. You don't hand a grown man the answer. You put it where he'll trip over it, and then you stand back and let him be clever.</p>\n<p class=\"tape\">I was still working out where to put it when Lyle put his head round the door.</p>\n<p class=\"tape\">\"Pike. There you are. There's a lady in second class asking for you.\"</p>\n<p class=\"tape\">\"For me, sir?\"</p>\n<p class=\"tape\">\"By name. God knows why.\" He looked at me as if I might have been stealing the spoons. \"One of the survivors. D deck, forward. She says you were very kind to the children and she'd like a word, and some hot milk for the little one. Get the milk from Evans and go. And Pike.\" He narrowed his eyes. \"Whatever she gives you, you give half to me.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">It was an inside cabin, small, with two berths and a washstand and no porthole. Somebody from our own second class had given it up for them. The mother was asleep in the lower berth, on her side, facing the wall, very still, with the doctor's sleeping draught on the washstand beside her. The little boy was asleep in the upper berth with his thumb in his mouth. The girl, the six-year-old, was sitting on the floor in the corner wrapped in a blanket coat that one of our ladies had sewn, drawing on the back of a menu card with a pencil.</p>\n<p class=\"tape\">The young woman in the dark coat was sitting on the only chair, by the door, with her hands in her lap. She was dressed now, properly, in a gray skirt and a white blouse that were not hers, too short in the sleeves, and her hair was up. She looked tired. She looked as if she had not slept at all. She looked, also, as if she had been waiting for me, and had known exactly how long I would take.</p>\n<p class=\"tape\">\"Thank you,\" she said, and took the milk, and gave it to the little girl, and said something to her low, and the little girl went on drawing.</p>\n<p class=\"tape\">Then she turned the chair a little toward me, and looked at me, and didn't say anything.</p>\n<p class=\"tape\">I stood by the door with my cap in my hands, and didn't say anything either.</p>\n<p class=\"tape\">It went on for some time. The ship's whistle went, outside, muffled, through the steel. The little girl's pencil scratched.</p>\n<p class=\"tape\">\"You were in the boot room this morning,\" she said at last. \"At about half past f
