, in a war. A week late is a week in which Washington didn't know something. And those were the first real dispatches since April, and the boat that should have carried it had been shot up in the night by men who knew where it would be.\" He looked at me. \"They knew, after that, that somebody knew. It wasn't a road anymore. It was a road with somebody standing on it. You can feel the difference, from inside. I've been on both sides of it.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>August 1780</em></p>\n<p class=\"tape\">The last week of August I was out in Westchester again, with a troop of DeLancey's refugee horse, the Westchester men, hunting the rebels' dispatch riders.</p>\n<p class=\"tape\">Washington's army was up the Hudson by then, around the forts in the Highlands, and his letters to his officers in Connecticut went across the Neutral Ground by express, a dragoon on a good horse, riding hard, alone or in pairs. There was a bridge over the Croton River called Pine's Bridge that every one of them used, because it was the only good crossing for miles and the fords were deep in summer. Caesar had known it since he was a boy, long before I was in him. The body knew the bridge. It had driven cattle over it.</p>\n<p class=\"tape\">We lay up in the woods above Pine's Bridge for two days. On the second evening, a rebel dragoon came down the road from the north, alone, on a tired horse, with a leather satchel on his back. DeLancey's men took him on the bridge without a shot. He'd been riding since dawn. He looked very young, and very tired, and he didn't even try to run.</p>\n<p class=\"tape\">We brought him into New York with his satchel. I never saw what was in it. Letters to and from officers in Connecticut about horses and forage and pay. Nothing very much, Beckwith said afterward. But nothing very much is still something, if it's the enemy's, and it was in our hands and not theirs.</p>\n<p class=\"tape\">I remember the bridge, Ms. Barnett. That's why I'm telling you. Pine's Bridge. Rough planks, on stone piers, over brown water, with the road going up through the trees on the far side toward Tarrytown. I lay above it for two days and learned every board of it, without trying, because that's what Caesar's eyes did.</p>\n<p class=\"tape\">A month later, almost to the day, a gentleman in a civilian coat would cross that bridge on a borrowed horse, heading south for the British lines, and I would be on the wrong road.</p>\n<p class=\"tape\">But not yet.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape tape-head\"><em>September 1780</em></p>\n<p class=\"tape\">On the twelfth of September Andr\u00e9 sent me to Oyster Bay with a letter.</p>\n<p class=\"tape\">It was the first time he'd ever sent me with one of his own. Sealed, with his own seal, which was a little classical head, very fine. To Colonel Simcoe, whose Rangers were in quarters at Oyster Bay again, on the north shore, in the house of a merchant family called Townsend.</p>\n<p class=\"tape\">I took the letter out by the ferry and along the north shore road on a good horse of Andr\u00e9's, and gave it to Simcoe in the front parlor of the Townsend house, a plain wooden house with a big tree in front and a hall that smelled of beeswax. Simcoe was a tall, cold, clever man with a long face, and his Rangers were the best soldiers the King had in that whole country, and the most feared. He broke the seal standing up, and read it at the window, and then he laughed, a short laugh, not unkind, and read a line of it aloud, to himself, in a tone of great amusement.</p>\n<p class=\"tape\">\"<em>Apparent arrangements</em>,\" he said, \"<em>are not always real ones.</em>\" He folded the letter and put it in his coat. \"Tell the Major I understand him perfectly. And tell him my men are ready.\"</p>\n<p class=\"tape\">I didn't know what it meant. I didn't know what his men were ready for. Every messenger was to remain ignorant. I rode back to the city with the answer and gave it to Andr\u00e9 word for word, as I gave everything, and Andr\u00e9 smiled and said, \"Good,\" and went back to his papers.</p>\n<p class=\"tape\">I stood in the front hall of that house, Ms. Barnett, with my hat in my hands, while Simcoe read his letter. And while I stood there, one of the sons of the house came down the stairs. Home from the city for a day or two, a servant said afterward. A pale young man a few years younger than me, with a long nose and a careful mouth, in a good plain coat. He stood aside on the bottom step to let a Ranger officer go by, and glanced at me, the way a man glances at another man's servant, and went out by the back. I looked at him for perhaps three seconds. I have him still, every line.</p>\n<p class=\"tape\">It was another hundred and fifty years before anybody in the world knew who he was. I'd stood in his own father's hall, with Andr\u00e9's letter in my hand, and watched him go by, and thought of nothing at all.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"Who was he?\" I said.</p>\n<p>He looked at me for a long moment. Then he picked up his glass and drank the rest of the water in it.</p>\n<p>\"Look it up,\" he said. \"Oyster Bay. Townsend. You're quicker than I was.\" He set the glass down. \"That's as far as I'll go today, Ms. Barnett. Next week is the rest of September. I'd like you to bring Freda, if she'll come.\" He looked out at the pale field, and the heat lying on it, and the line of trees. \"I don't think I want to tell September twice.\"</p>\n<p>I looked it up that night, at the kitchen table. It took me about four minutes.</p>\n<p>Robert Townsend. Of Oyster Bay. Merchant. Proven in 1930, by a historian with a handwriting expert, to have been the man in the city. The man who wrote the letters. The one who stopped writing in April, and started again in July, and whose dispatches were left sitting on the shore in August when Brewster's boat was driven off.</p>\n<p>I sat and looked at the screen for a long time. Then I wrote in my notebook, under the date: <em>Tom stood in his father's hall. 1780. Watched him go by for three seconds.</em> And then, because I couldn't help it: <em>Didn't know.</em></p>\n<p>And then, because I really couldn't help it: <em>Neither did anyone. For 150 years.</em></p>", "audio": true, "added": 1791140015879, "pt": [1791140015879, 1791140015879, 1791225670814, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791225670814, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791225670814, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791225670814, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791225670814, 1791140015879, 1791140015879, 1791225670814, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140015879, 1791140022405, 1791140015879, 1791140015879, 1791140015879, 1791225670814, 1791140015879, 1791140015879, 1791140015879, 1791140015879]}, {"num": 17, "title": "What Ice Does to Sound", "extra": false, "html": "<p>Freda came.</p>\n<p>I'd asked her on the Thursday night, at the kitchen table, carefully, the way you ask a sixteen-year-old anything in July. He'd asked for her, I said. He'd said he didn't want to tell September twice. She'd looked at me over her laptop for a long moment, and then said, \"Is it the bad part?\" and I'd said I thought it was, and she'd said, \"Okay,\" and gone back to typing, and then stopped typing and said, \"Should I bring something? Like, a thing?\"</p>\n<p>She brought a pie. She made it herself, on the Wednesday night, peach, from a recipe of her father's mother's that Dez had texted her, and it came out of the oven at eleven o'clock looking like something from a magazine, and she stood over it with her hands on her hips and said, \"That's going to be a disaster,\" and covered it with a dish towel and wouldn't let me look at it again.</p>\n<p>She sat in the front seat with it on her knees the whole way up. Two hours. She didn't put her headphones on once. When we turned onto the gravel road, she sat up and looked at everything: the long field, mowed short and pale, and the line of trees, and the little house at the end with the porch and the maple, and him at the bottom of the steps, under the maple, with his hands in his pockets, watching the car come up the road.</p>\n<p>\"He's waiting for us,\" Freda said.</p>\n<p>\"He's been doing that.\"</p>\n<p>\"Since when?\"</p>\n<p>\"Since last week.\"</p>\n<p>She was quiet. Then she said, very quietly, \"That's nice,\" in a voice I hadn't heard her use since she was about nine.</p>\n<p class=\"break\">&#10043;</p>\n<p>He was delighted with the pie. Not polite. Delighted. He lifted the dish towel and looked at it for a long time, and then at Freda, and then he said, \"Peach,\" as if she'd brought him something he'd been trying to remember the name of for a hundred years. He made her tell him the recipe, all of it, standing in his kitchen, and asked whose it was, and when she said her grandmother's, her dad's mom's, he said, \"Then it'll be good,\" and she went pink to the ears.</p>\n<p>We had it for breakfast. He said that was allowed, in July, and that he had it on good authority. He made coffee, and put the pie on the kitchen table with three plates and three forks and a knife, and let Freda cut it, and it was not a disaster. It was the best pie I've ever eaten. I've told her so since, and she says I'm just saying it, and I'm not.</p>\n<p>I said the date into the recorders with my mouth full. <em>Session thirty-eight. Thursday, July fifteenth. Freda's here.</em></p>\n<p>\"Freda's here,\" he said, and lifted his coffee to her.</p>\n<p class=\"break\">&#10043;</p>\n<p>I told him about the silence while we ate. Two weeks, now. No letter from Carrow House. No call from their lawyers. No call from Claire Whitcombe. Nothing.</p>\n<p>\"I think she's protecting herself,\" I said. \"I think she's decided the safest thing is to do nothing. If she tells her father I came, he'll panic, and call the lawyers, and then there'll be lawyers, and then there'll be questions, and somebody might ask her where she was on a Wednesday morning six years ago. So she says nothing. And if she says nothing to him, she'll certainly say nothing to me.\" I put my fork down. \"I think it's over. I think she's just going to wait me out.\"</p>\n<p>He finished his piece of pie first. He took his time.</p>\n<p>\"Freda,\" he said. \"Did your mother ever tell you about the ice?\"</p>\n<p>Freda looked up, surprised. \"The ice in the harbor? I typed it. When it froze. When you lay on the blanket and listened to the sleighs.\"</p>\n<p>\"What did I say about it?\"</p>\n<p>She thought. She'd typed every word of it. I watched her find it.</p>\n<p>\"You said sound carries. On the ice. When it's still and cold. You could hear a dog bark in New Jersey.\"</p>\n<p>\"I did. And what's the other half of it?\"</p>\n<p>She didn't know. Neither did I. He waited, and when neither of us said anything, he turned his cup a quarter turn on the table.</p>\n<p>\"When an army's coming,\" he said, \"the dogs stop barking. On a still night on the ice you can hear every dog on the Jersey shore, every night, all night, barking at the cold and the dark and each other. And one night, they stop. A whole village of dogs, gone quiet. And it's the loudest thing you've ever heard. Because a dog stops barking for one reason. Somebody it knows has come into the yard, and told it to be still.\"</p>\n<p>Freda had stopped eating.</p>\n<p>\"Your mother's right,\" he said to her, \"that the dog's gone quiet. She's wrong about why.\" He looked at me. \"If Claire Whitcombe were protecting herself, she'd have told her father the same night. That's what you do, if it's yourself you're afraid for. You call the strongest person you know and say, <em>somebody came</em>. You get your lawyers ready. You get ahead of it. Every frightened person in the world does that.\"</p>\n<p>\"She didn't,\" I said slowly.</p>\n<p>\"She didn't. She's kept quiet two weeks. She's kept it from the strongest person she knows, who's also the person who'd most want to know.\" He set his cup down. \"People don't keep quiet like that for themselves, Ms. Barnett. They keep quiet like that for somebody else. Somebody who'd be in danger if her father panicked, and started making telephone calls. Somebody the telephone calls might reach.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>Nobody said anything for a while. Outside, the bees were working in the clover. In the field a hawk was hanging over the short grass, quite still, with its wings moving very slightly, the way they do when they're watching something.</p>\n<p>\"Who?\" Freda said at last. She said it to him, not to me.</p>\n<p>He didn't answer. He looked at me. He was waiting for me to say it, the way he'd waited in June for me to find the eggs, and the way he'd waited on the first day, last October, for me to decide whether he was mad.</p>\n<p>I didn't want to say it. I'd stopped letting myself think it, years ago. You do, after a while. You put a thing down so you can carry everything else.</p>\n<p>\"Somebody they're hiding,\" I said.</p>\n<p>\"Yes.\"</p>\n<p>\"Somebody who'd be in danger if Carrow House's lawyers started asking where they'd gone. Somebody who's been somewhere, all this time, that only the Whitcombes know about.\" I could hear my voice going thin. \"You think he's alive.\"</p>\n<p>\"I think,\" he said carefully, \"that a woman sat in an alley for twenty-seven minutes with the engine running, while her father and another man carried two boxes and a computer down a flight of stairs. And that the other man was the one whose cat was shut in the bedroom. And that she drove them both away. And that six years later, when a stranger came to her barn and asked how long she'd waited, she went white, and asked her to leave, and then told nobody, not even her father. Not for her own sake.\" He paused. \"I think you should let yourself think it, Ms. Barnett. I think you've earned that much. I don't know any more than you do. But I've been on the ice. I know what it means when the dogs go quiet.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda reached across the table and put her hand on top of mine. She didn't say anything. She didn't need to. She'd been ten, the summer it happened. She'd sat on the stairs at night, the week after, and listened to me crying in the kitchen and pretending to be on the phone. We'd never once talked about it.</p>\n<p>\"So what do I do?\" I said.</p>\n<p>\"Nothing,\" he said. \"Nothing at all. You've done the one thing. She knows you know. She knows you came yourself, with nothing in your hands, and asked her one question, and went away when she asked you to. She knows you haven't told her father, or the lawyers, or the newspaper, because if you had, she'd have heard about it by now.\" He picked up the knife and cut himself a second, very small piece of pie. \"You've left her a card on a bench. That's the most frightening thing you can give a person who's been keeping a secret for six years. A way out that they have to choose for themselves.\"</p>\n<p>\"How long?\" I said. \"You said longer than I'd like.\"</p>\n<p>He thought about it.</p>\n<p>\"If I'm right about why she's quiet,\" he said, \"she's asking him. Whoever it is. She's driven out to wherever it is and sat with him and told him a woman came to the barn, and he's had to decide what he wants. And he's had six years of wanting not to be found.\" He ate the piece of pie. \"But he chose you, once. Out of every reporter in the city. He picked up a telephone and called a newsroom and asked for you by name. A man doesn't forget why he did that.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>Then he got up, and took the plates to the sink, and stood there for a moment with his back to us and his hands on the edge of the counter, looking out of the window at the hawk over the field.</p>\n<p>\"Freda,\" he said, without turning round. \"Have you typed all of it? The whole year so far?\"</p>\n<p>\"Everything,\" Freda said. \"Up to last week. The boat and the hounds and the man coming down the stairs.\"</p>\n<p>\"Then you'll have noticed the eggs.\"</p>\n<p>I looked at Freda. She looked at me. Then she looked at the back of his head, and said, with great dignity, \"I'm not stupid.\"</p>\n<p>He laughed. He turned round, still laughing, with his hand on the counter.</p>\n<p>\"No,\" he said. \"No, you are very much not. Don't tell me what you think. I don't want to hear it. Not yet. I want you to hear the next part the way I lived it.\" He came back to the table and sat down, and folded his hands on it, and the laughing went out of his face, slowly, the way the light goes off a field when a cloud comes over. \"Because I didn't know, then, about the eggs. I didn't know anything. I knew a young man in a beautiful coat had trusted me with a secret, and that I'd have done anything for him. And that's what I want you to have, both of you, for the next part. Just that.\"</p>\n<p>He looked at the recorders, and at me, and nodded.</p>\n<p>\"September,\" he said.</p>", "audio": true, "added": 1791140104496, "pt": [1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791225670814, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496, 1791140104496]}, {"num": 18, "title": "The Vulture", "extra": false, "html": "<p class=\"tape tape-head\"><em>September 1780</em></p>\n<p class=\"tape\">I worked out whose letters they were on the seventeenth of September, from a piece of paper about a house.</p>\n<p class=\"tape\">Andr\u00e9 hadn't told me. He'd kept his own rule to the end: every messenger ignorant. But that summer I'd carried a great many of his papers, and stood by a great many of his tables, and I couldn't help what I saw, any more than I could help breathing. And on the sixteenth Colonel Robinson went up the Hudson on a sloop of war called the <em>Vulture</em>, with a letter in his pocket under a flag of truce, to an American general. About his house.</p>\n<p class=\"tape\">I've told you about Robinson's house. The fine house in the Highlands, up the river, that he'd lived in like a duke before the war, among his tenants. The rebels had taken it when he wouldn't swear to them. And now an American general was living in it, because it stood right across the river from the great fortress at West Point, and the general had made it his headquarters when he took command of the fort in August.</p>\n<p class=\"tape\">Robinson's letter asked that general, very politely, for a meeting under a flag, to discuss his confiscated property.</p>\n<p class=\"tape\">Robinson didn't care about his property that week. I knew Robinson. I'd watched him for a year. He'd been nervous for days, in the way a careful man is nervous when he's doing something he's not built for. He'd been going in and out of Andr\u00e9's office with the door shut. He'd stopped talking to me about the country. And now he was going up the river, in person, at his age, to talk about a house he'd been trying to get back for four years through lawyers, to the one man in America who happened to be living in it, and who happened to command West Point.</p>\n<p class=\"tape\">I knew whose letters they were. I knew what was being sold. And I knew, from the way Andr\u00e9 had been all that month, that it was nearly done.</p>\n<p class=\"tape\">General Benedict Arnold. Gustavus. Mr. Moore. Those were the names he signed himself. He'd been writing to Andr\u00e9 for more than a year, and Andr\u00e9 was going up the river to buy West Point from him, and the war was nearly over.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I went to Andr\u00e9 that night.</p>\n<p class=\"tape\">I shouldn't have. It wasn't my place. A guide doesn't knock on the Adjutant General's door at ten at night. But we had our secret, the two of us, and I think he'd have been more surprised if I hadn't come.</p>\n<p class=\"tape\">He was at his long table under the window, alone, with one candle and a great many papers, and he looked up when I came in and didn't seem surprised at all. He looked tired. It was the only time I ever saw him tired. He was writing the last canto of his poem about Wayne and the cows, of all things, for Rivington to print, and there was a pile of crossed-out verses at his elbow.</p>\n<p class=\"tape\">\"Freeman,\" he said. \"You've guessed.\"</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">\"I thought you might. I told the General you would.\" He put the pen down. \"Sit down. No, sit. Nobody's going to come in.\"</p>\n<p class=\"tape\">I sat. In the other chair, across the table from him, in the Adjutant General's office at headquarters, at ten at night. I don't think I've told you how strange that was. In that body, in that city, in that whole year, it was the only chair anybody ever offered me.</p>\n<p class=\"tape\">\"You want to tell me something,\" he said.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I told him what I knew about the Neutral Ground.</p>\n<p class=\"tape\">He knew some of it. Everybody at headquarters knew some of it. But he'd never been there, not the way I had, on foot, at night, on the roads. He'd ridden through it with escorts of dragoons. He'd never been alone in it, and I had, and I tried to tell him what that meant.</p>\n<p class=\"tape\">\"There are men on every road between the river and the Sound, sir,\" I said. \"Ours and theirs and nobody's. DeLancey's Cowboys on the south side. The rebel militia on the north. And bands of men who belong to neither, who'll stop anybody on a horse with a good coat and take the coat and the horse and whatever's in his pockets, and if they find anything worth money on him, they'll sell it, and him, to whichever side pays. They don't care whose pass you carry. Half of them can't read it.\" I leaned forward. \"If you go up the river, sir, come back down it. On the ship. In your own coat. Whatever happens. Whatever he says to you.\"</p>\n<p class=\"tape\">He looked at me for a long moment.</p>\n<p class=\"tape\">\"That's the arrangement,\" he said. \"I'm to go up to the <em>Vulture</em>, and meet him under a flag, by water, and come back the same way. The General was very clear about it. So was I.\" He smiled. \"I'm a staff officer, Freeman. Not a spy. I've no intention of creeping about Westchester in a farmer's hat.\"</p>\n<p class=\"tape\">\"He'll want you to.\"</p>\n<p class=\"tape\">\"Who will?\"</p>\n<p class=\"tape\">\"General Arnold, sir.\" It was the first time either of us had said the name aloud. It sat in the room between us like a third person. \"He's selling his country for money. He'll be frightened. A man selling his country is frightened all the time, every minute, from the first letter to the last. He'll want the meeting somewhere he controls. On his side of the river. In a house. And when it's done, if anything's gone wrong, if the ship's moved, if there's a shot fired, if anybody's seen you, he won't want you anywhere near him. He'll want you gone the fastest way he can find. And the fastest way won't be the safe way. It'll be a horse, and a pass in his own hand, and a civilian coat over your uniform so nobody stops you.\" I stopped. \"And if they do stop you, sir, in a civilian coat, behind their lines, with papers, you're not a staff officer any more. You're a spy. And they'll hang you.\"</p>\n<p class=\"tape\">He didn't say anything for a while. He picked up a crossed-out verse and looked at it and put it down again.</p>\n<p class=\"tape\">\"You've thought about this a great deal,\" he said.</p>\n<p class=\"tape\">\"Yes, sir. I've thought about very little else since I saw Colonel Robinson's letter about the house.\"</p>\n<p class=\"tape\">\"And what would you have me do?\"</p>\n<p class=\"tape\">\"Take me with you,\" I said. \"If you go ashore. If anything happens. If it has to be the land road. Take me. I know every road in that county. I know which farm has a dog and which ford is deep and which tavern keeper sells news. I can get you from the river to our lines in a night, by roads nobody watches, and nobody looks twice at a gentleman's servant. Nobody ever looks at me at all.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He thought about it. I'll always be grateful for that. He didn't wave it away. He sat there with the candle between us and thought about it honestly, the way he thought about a puzzle, turning it over.</p>\n<p class=\"tape\">Then he shook his head.</p>\n<p class=\"tape\">\"No,\" he said, gently. \"Thank you. No.\"</p>\n<p class=\"tape\">\"Sir...\"</p>\n<p class=\"tape\">\"Two reasons.\" He held up one finger. \"First, the arrangement. Arnold's been told one person. One officer, coming up under a flag. If I come ashore with a servant he doesn't know, he'll think he's been betrayed, and the whole thing will stop dead, and a year's work with it. He's frightened, as you say. A frightened man sees a stranger and runs.\" He held up a second finger. \"And second, I'm coming back by water. On the <em>Vulture</em>. In my own coat. I've given the General my word. So there won't be a land road, and I shan't need a guide.\" He smiled. \"You've been too long in the Neutral Ground, Freeman. Everything looks like an ambush to you.\"</p>\n<p class=\"tape\">\"Everything is an ambush, sir. In the Neutral Ground.\"</p>\n<p class=\"tape\">He laughed. Then he stopped laughing and looked at me in the candlelight with his dark bright eyes, and said something I've never forgotten.</p>\n<p class=\"tape\">\"I know what you're afraid of,\" he said. \"You're afraid I'll be too clever. That I'll see a quicker way and take it, because I always do. You're right to be afraid of that. I'm afraid of it too.\" He picked up his pen. \"So I'll make you a promise, since you've been honest with me. If I have to come back by land, I'll come back in my own coat. Whatever Arnold says.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. Freda had stopped eating pie some time ago. She was sitting with both arms wrapped round her knees, on the kitchen chair, with her chin on them.</p>\n<p>\"He promised,\" she said.</p>\n<p>\"He promised,\" he said. \"And he meant it. He always meant it.\"</p>\n<p>Freda looked at him. Then at me. Then she put her face down on her knees for a moment, and brought it up again.</p>\n<p>\"I looked it up,\" she said. \"Last night. After Mom said it was September. I'm sorry. I couldn't not.\" Her voice wobbled, and she steadied it. \"He wore a different coat.\"</p>\n<p>\"Yes,\" he said gently. \"He did.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>September 1780</em></p>\n<p class=\"tape\">I should go back a week. The first attempt was on the eleventh, at Dobbs Ferry, before Robinson's letter about the house. Andr\u00e9 and Robinson went up by boat to meet Arnold on the river, and Arnold came down by barge from his side, and the British gunboats on the river, who hadn't been told, saw a rebel barge on the water and fired on it, and Arnold turned round and went home. That was nearly the end of it, right there. A gunboat lieutenant doing his duty.</p>\n<p class=\"tape\">They tried again. Arnold wrote, under his false name, that he'd be on the river on the night of the twentieth. Robinson went up on the <em>Vulture</em> on the sixteenth with his letter about the house, and the <em>Vulture</em> anchored off a long low point of land on the east shore called Teller's Point, a few miles below King's Ferry, and waited.</p>\n<p class=\"tape\">And on the morning of the twentieth, Andr\u00e9 went up to join it.</p>\n<p class=\"tape\">I went down to the slip to see him off. I had no business there. He saw me, standing at the back of the little crowd of boatmen and porters, and lifted his hand to me, quite openly, the way he'd lift it to Robinson or to the General, and I lifted mine.</p>\n<p class=\"tape\">He was in his uniform. The scarlet coat, and the gold lace, and the gorget at his throat. Under his boat cloak, but in it. I looked very carefully, because I'd been afraid of exactly that. He had nothing else with him but a small valise. No other coat. I let out a breath I'd been holding since the seventeenth.</p>\n<p class=\"tape\">He'd said he'd come back in his own coat, and there wasn't another coat in that boat to put on.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I was sent to the lines that night, with a party of DeLancey's horse, to the advanced posts below the Neutral Ground, on the east side of the river, to wait for him in case he came back by land after all. Andr\u00e9 had arranged it, in spite of what he'd said, which tells you that he'd thought about what I'd told him more than he'd let me see. If he came down by road, we were to meet him at the edge of the Neutral Ground and bring him in. If he came by water, we'd never see him, and that would be best of all.</p>\n<p class=\"tape\">My orders, from Beckwith, through the officer of DeLancey's party, were to wait at the lines, and on no account go forward into the Neutral Ground on my own. Two days. Then come home.</p>\n<p class=\"tape\">I waited.</p>\n<p class=\"tape\">On the night of the twentieth, nothing. On the night of the twenty-first, nothing. The river was very still. Nothing moved on it that we could see, from the heights, but the moon on the water and a fishing boat or two.</p>\n<p class=\"tape\">And at first light on the twenty-second, very far up the river, nearly thirty miles off, so faint I felt it in the ground before I heard it, somebody began firing a cannon.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. He put his hands flat on the kitchen table, on either side of his cup, and sat looking at them.</p>\n<p>Nobody said anything. The kitchen clock ticked. Outside, the hawk had gone from the field.</p>\n<p>\"That's enough for this morning,\" he said at last. \"We'll go on after lunch. I'd like to walk down the road a little way first, if you two don't mind. I'd like to see the car again.\" He got up, with his hand on the edge of the table. \"It's a good thing to see. A car on a road. In the sun.\"</p>\n<p>He went out. Through the window I watched him go slowly down the porch steps with his hand on the rail and across the gravel and out to the end of the drive, where the car was, and stand there in the hot white sun beside it, with his hand resting on the roof, looking down the long straight gravel road toward the south.</p>\n<p>Freda came and stood beside me at the window.</p>\n<p>\"He's waiting for somebody,\" she said.</p>\n<p>\"No,\" I said. \"I think he's waiting for somebody who didn't come.\"</p>", "audio": true, "added": 1791140303380, "pt": [1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791225670814, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791225670814, 1791140303380, 1791140303380, 1791225670814, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380]}, {"num": 19, "title": "The Wrong Road", "extra": false, "html": "<p>He came back from the end of the drive after a quarter of an hour, slowly, and washed his hands at the kitchen sink for a long time, and then made sandwiches, because it was lunchtime, and he made lunch for us every Thursday, and I think he needed to do something that he always did.</p>\n<p>Freda helped. He let her. She buttered the bread and he cut the cheese, and neither of them said anything, and I sat at the table and watched them, the tall girl and the old man, side by side at the counter, moving around each other in the small kitchen as if they'd done it for years.</p>\n<p>We ate on the porch. Nobody was very hungry.</p>\n<p>Afterward he sat back on the bench, in the shade, and looked out at the field for a while. Then he said, \"All right,\" to nobody in particular, and I started the recorders again.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>September 1780</em></p>\n<p class=\"tape\">A cannon is a very simple sound, at thirty miles. It isn't a bang. It's a push, in the air and in the ground, that you feel in your chest more than hear. Then another. Then a long pause. Then another.</p>\n<p class=\"tape\">I stood on the heights above the lines in the gray light with the officer of DeLancey's party beside me, and we counted. Fourteen shots, in perhaps half an hour. Then nothing.</p>\n<p class=\"tape\">\"Our people?\" the officer said. \"Or theirs?\"</p>\n<p class=\"tape\">I didn't know. Nobody could have known, at that distance. But I knew where it came from. Up the river, on the east side, about where Teller's Point would be. Where the <em>Vulture</em> was anchored. Where there was no reason for anybody to be firing a cannon at dawn unless they were firing at a ship.</p>\n<p class=\"tape\">\"Theirs,\" I said. \"From the shore. At the <em>Vulture</em>.\"</p>\n<p class=\"tape\">He looked at me. \"How can you know that?\"</p>\n<p class=\"tape\">\"Because the <em>Vulture</em>'s been sitting off a rebel shore for six days doing nothing, sir, and the rebels have guns, and sooner or later somebody was going to get bored.\" I was already thinking past it. \"If they've hit her, or frightened her, she'll drop down the river. Out of range. And if she drops down the river...\"</p>\n<p class=\"tape\">I didn't finish. I didn't have to. If the ship had dropped down the river, then wherever Andr\u00e9 was, he wasn't on it. He'd gone ashore in the night, to meet Arnold, and he'd come back to the shore at dawn to find his ship gone, or going.</p>\n<p class=\"tape\">And then the only way home was the land road.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">A fishing boat came down that afternoon with the news. The <em>Vulture</em> had been hit, more than once, and had dropped a few miles down the river, out of range, and anchored again off Sing Sing. She was in no hurry. Nobody aboard her was signaling anybody.</p>\n<p class=\"tape\">I didn't need to see. I knew. I knew the way you know a thing about a person you've watched for a long time, as I'd known Robinson was nervous, and the carter was frightened, and Beckwith was angry. Andr\u00e9 was ashore. On the rebel side of the river. And Arnold, who was frightened, every minute, from the first letter to the last, had his visitor on his hands in broad daylight with a rebel shore battery wide awake and every militiaman for miles round looking up the river at the British warship.</p>\n<p class=\"tape\">He'd want him gone. The fastest way he could find.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I'd spent all summer thinking about the land road, and I'd thought it through to the end long before that morning. I want you to know that, so you'll understand what I did next. It wasn't a guess.</p>\n<p class=\"tape\">If Andr\u00e9 came down by land, he'd start on the west side of the river, where Arnold would have taken him ashore, away from his own headquarters and the people who knew his face. And he'd have to cross to our side somewhere. The nearest crossing to Teller's Point was King's Ferry, a few miles up, and Arnold controlled King's Ferry. He'd send Andr\u00e9 over there, with a pass. And a pass from Arnold would be good on the roads Arnold commanded, which were the roads through his own posts. Down from the ferry, east, through the country behind the American lines, to their outposts. To North Castle, where a lieutenant colonel called Jameson kept a post of dragoons. And then through the outposts, on Arnold's pass, to White Plains. And from White Plains, into the Neutral Ground and down to us.</p>\n<p class=\"tape\">The White Plains road. A man with a pass from the commanding general would take the road his pass was written for. He'd go through the posts openly, because his pass was good at the posts. He'd ride in daylight. He'd look like what he was pretending to be, a gentleman on business, with a paper from the general. That was the sensible road. The safe road. The only road where the paper in his pocket meant anything.</p>\n<p class=\"tape\">And Andr\u00e9 was a soldier. He'd never been in the Neutral Ground on his own. He didn't know the back roads, and there'd be nobody to show him. He'd do what soldiers do in a strange country. He'd follow his orders, and his orders would be his pass.</p>\n<p class=\"tape\">So I went up the White Plains road to meet him.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">My orders were to wait at the lines and on no account to go forward. I want you to know that too. I disobeyed them. I'd do it again. I'd do it every time.</p>\n<p class=\"tape\">I took a horse from DeLancey's party, the best one, without asking, and rode north out of the British lines a little before sunset on the twenty-second, alone, into the Neutral Ground. I took Robinson's paper, which was no use to me at all where I was going, and a knife, and a loaf of bread. And I rode up toward White Plains by the back ways, by the farm tracks and the wood roads and the fords, by every road Caesar's body had known since it was a boy, in the dark.</p>\n<p class=\"tape\">It was a clear night. Very still. There was a half moon. You could see a long way on the roads, and I watched them all. Every rider. Every horse tied at a tavern door. Every lantern on every porch. I passed farmhouses I'd guided Loyalist horse to, and farmhouses I'd helped burn, and farmhouses where I knew the dogs. I passed the crossroads at Young's, where the house had been, and didn't look at it. By midnight I was on the high ground above White Plains, looking north up the long road that came down from North Castle, from the American posts. The road he'd come down, if he came.</p>\n<p class=\"tape\">I waited there all night. In a stand of cedars above the road, with the horse tied behind me and the bread uneaten in my coat, watching that road come down out of the dark.</p>\n<p class=\"tape\">Nobody came.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At first light I went further north. I couldn't help it. Up the road toward North Castle, as far as I dared, which was further than I should have. I thought he might have been held up, at a post, by a careful sentry. I thought he might have lodged somewhere for the night, the way travelers did. I thought a great many things. I asked a boy driving cows, keeping my head down like a hired man, whether he'd seen a gentleman ride by, and he said there'd been gentlemen riding by all week with the armies the way they were, and asked me if I was a runaway, and I said no and gave him half the bread.</p>\n<p class=\"tape\">The sun came up. It got warm. Nine o'clock came, and went, on that empty road. I can tell you the exact moment, because I've worked it out since, a thousand times, from the records. At about nine o'clock on the morning of the twenty-third of September, while I sat on a borrowed horse in a stand of cedars above the White Plains road, looking north, with my bread in my coat, Major John Andr\u00e9 was sitting on a borrowed horse on a different road, perhaps eight miles to the west of me, being asked to get down.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He'd come down the river road. Through Tarrytown.</p>\n<p class=\"tape\">Not the road his pass was for. The other road. The river road, that ran down along the Hudson through the Neutral Ground, through country that was nobody's, where his pass from Arnold was no use to him at all. Where every band of men on the road was either the King's Cowboys or the rebels' militia, or nobody's, and a gentleman alone in a good coat was a gift from heaven to any of them.</p>\n<p class=\"tape\">Why? I've asked that every year since. The man who crossed with him at King's Ferry left him near Pine's Bridge that morning, after breakfast, and turned back. The story goes that somebody had told Andr\u00e9, the night before or that morning, that the river road was safer. That it was in the Cowboys' country, and that the Cowboys were friends to the King. Which they were, mostly, if you were the King. Perhaps somebody told him that. Perhaps he worked it out for himself, and was too clever, the way he'd been afraid he'd be. He took the road toward people he thought were his own side.</p>\n<p class=\"tape\">At a little stream above Tarrytown, three men stepped out of the trees with muskets. One of them was wearing a faded Hessian coat that he'd taken off somebody somewhere. And Andr\u00e9 looked at the coat, and thought he was among friends, and said the thing you never say.</p>\n<p class=\"tape\">He told them he was a British officer.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">There were seven or eight of them, in the end, rebel militia, out on the road that morning on their own account, looking for cattle thieves and anything else worth taking. Three stopped him, and searched him. They made him take off his boots. And in his stockings, under his feet, they found papers in General Arnold's own hand: the state of the works at West Point, the strength of the garrison, the placing of the guns, the minutes of a council of war.</p>\n<p class=\"tape\">He offered them his horse. Any sum of money they liked to name. They took his watch, and took him to the American post at North Castle.</p>\n<p class=\"tape\">He was wearing somebody else's coat.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>He didn't stop the way he'd stopped before, to drink his water or to look at the field. He stopped the way a clock stops. His hands were on his knees, and he was looking at nothing, and he didn't move.</p>\n<p>Freda didn't move either. She was sitting on the top step of the porch, where she'd gone after lunch, with her back against the post and her arms round her knees, and she was looking at him, and her face was wet. She wasn't making any sound at all.</p>\n<p>I reached over, after a while, and turned off the recorders. Both of them. I didn't ask. It was the first time I'd ever done that, in all those Thursdays, without being asked. He didn't seem to notice.</p>\n<p>We sat there. The three of us, on the porch, in the afternoon, in the heat. Somewhere a long way off a tractor was working, and the sound of it came and went on the hot air. A car passed, on the paved road at the end of the gravel, a mile off, and he turned his head very slightly toward the sound, and then away.</p>\n<p>\"He took the coat,\" he said at last. Quietly. Not to us. \"He promised me, and he took the coat.\"</p>\n<p>Nobody said anything.</p>\n<p>\"Arnold made him,\" he said. \"I know that now. I've read all of it, everything anybody ever wrote down. Arnold was frightened, and in a hurry, and the ship was gone, and he talked Andr\u00e9 into it, into the coat and the pass and the papers in his boots, all three, every one of the three things that hanged him. And Andr\u00e9 let him. Because he was a soldier who'd been told to do a thing by a general. Because he was clever, and he could see that the coat was quicker. Because he didn't know the roads, and he trusted the man who did.\" He turned his head and looked at me, and I'd never seen his face like that. \"He trusted the wrong man who knew the roads, Ms. Barnett. That's all. He had two of us. He trusted the wrong one.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>After a long time he said I could turn the recorders back on.</p>\n<p>\"Not because I want to go on,\" he said. \"Because I want it written down. Freda will type it. I want the rest of it on the tape, the way it was, so it's said once, and done.\"</p>\n<p>I turned them on. He said the rest of it in a level voice, looking at the field.</p>\n<p>He'd ridden back to the British lines on the afternoon of the twenty-third, with no news, and been put under arrest by DeLancey's officer for taking a horse and disobeying orders, and released the next morning when Beckwith sent for him. On the twenty-fourth, nothing. The <em>Vulture</em> lay in the river, waiting. Robinson sent a letter down to Clinton that day saying they'd heard nothing of Andr\u00e9 since he left the ship. On the twenty-fifth, a rumor, from the river, that something had happened at West Point, that Arnold had come down to the <em>Vulture</em> in his barge in a great hurry, under a flag, and gone aboard her and not come off.</p>\n<p>And on the twenty-sixth, General Benedict Arnold came into New York.</p>\n<p>\"The people exult much,\" the Chief Justice wrote in his diary that night. <em>But it is not known yet that Andr\u00e9 was catched.</em></p>\n<p>\"That's the only time I ever saw him,\" he said. \"Arnold. On the twenty-seventh, on the Broadway, coming out of headquarters with two of Clinton's aides, in his new British coat, with his limp. He walked straight past me. I was standing at the gate, holding a horse. He didn't look at me, and I didn't look at him.\" He was quiet a moment. \"I told you I never met him, and then I didn't. That's what I meant. I stood six feet from the man who'd talked Andr\u00e9 into that coat, and I didn't do anything at all. I held the horse.\"</p>\n<p>He looked at Freda, on the step.</p>\n<p>\"That's the end of the road part,\" he said, gently. \"You can stop now. Both of you. The rest is a week of waiting. I'll tell it next Thursday.\"</p>\n<p>Freda wiped her face on the knees of her jeans, first one side, then the other.</p>\n<p>\"No,\" she said. \"I want to hear it now. All of it. I don't want to wait a week knowing.\"</p>\n<p>He looked at her for a long time.</p>\n<p>\"You're very like your mother,\" he said.</p>\n<p>\"Everybody says that,\" Freda said, and her voice cracked in the middle, and she didn't care. \"Tell it anyway.\"</p>", "audio": true, "added": 1791140303380, "pt": [1791225670814, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791225670814, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791225670814, 1791140303380, 1791140303380, 1791140303380, 1791146243217, 1791140303380, 1791140303380, 1791225670814, 1791225670814, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380, 1791140303380]}, {"num": 20, "title": "A Deserter Is Never Given Up", "extra": false, "html": "<p class=\"tape tape-head\"><em>September 1780</em></p>\n<p class=\"tape\">Clinton wrote to Washington the day Arnold came in. He said Major Andr\u00e9 had gone up the river under a flag, at General Arnold's invitation, and so could not be held as a prisoner, still less as anything worse, and he asked for him back. Very correct. Very polite. Everybody at headquarters agreed it was a very good letter.</p>\n<p class=\"tape\">The town didn't know yet. Not for a day or two. The town knew only that General Arnold had come over to the King, and it was delighted. People stood outside headquarters to see him come and go. A printer called Gaine wrote in his journal that it was to the great surprise of everybody. And then, the next day, he wrote that Major Andr\u00e9 had been taken by General Washington, and that it was supposed he would be ill used.</p>\n<p class=\"tape\">Supposed he would be ill used. That's how the city found out.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I'll tell you the week the way I lived it. In pieces. That's how it came.</p>\n<p class=\"tape\">On the twenty-eighth, word came down the river, the way word does, by boatmen and deserters and market women, that the rebels had moved Andr\u00e9. Across the Hudson, under a heavy guard, to a village called Tappan, on the Jersey side, near the border with New York, where Washington had his headquarters that week. They'd put him in a tavern, in an upstairs room, with two officers in the room with him day and night, and the door open.</p>\n<p class=\"tape\">On the thirtieth, in the morning, the news that there'd been a board. Fourteen of Washington's generals, at a table in a church in Tappan, with Andr\u00e9 in front of them, answering their questions. He'd answered them all, truthfully, the deserters said. He'd told them everything about himself and nothing about anybody else. He'd been so frank and so courteous that some of the generals hadn't been able to look at him. And at the end of the afternoon they'd found that he'd come behind their lines in disguise, under a false name, with papers, and that by the laws of war that made him a spy. And that he ought to suffer death.</p>\n<p class=\"tape\">I heard that in the yard at headquarters, from a groom, while I was holding a horse. I remember the horse. A bay mare, with a white sock behind. She stood on my foot, and I didn't notice until somebody pointed it out.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">On the thirtieth, a Saturday, I went over to Paulus Hook.</p>\n<p class=\"tape\">It was an accident. I want to tell you that, because if I'd planned it I'd have been prouder of it, and I wasn't proud of anything that week. An officer of the garrison there needed a guide to take a party up into Bergen the next day after some cattle, and Beckwith sent me, because he wanted me out of the city and out of his sight, I think. I'd been going about headquarters for three days like a ghost.</p>\n<p class=\"tape\">That evening, a rebel captain came down to the post at Paulus Hook under a flag of truce, with a troop of dragoons and a packet of letters from Washington for Clinton. The commandant of the post asked him to supper, as officers did, under a flag, in that war. And because the commandant's servant had a fever, and I was there, and a Black man in a decent coat is a servant to anybody who needs one, I waited at the table.</p>\n<p class=\"tape\">I stood behind the commandant's chair with a bottle, and filled the glasses, and listened.</p>\n<p class=\"tape\">They talked about nothing, at first. The weather. The cattle in Bergen. The roads. And then, near the end, when the wine had gone round twice, the rebel captain leaned a little toward the commandant, and lowered his voice, and said something that he plainly hadn't been told to write down.</p>\n<p class=\"tape\">He said, as one of them remembered it long afterward, that if Sir Henry Clinton were to give up General Arnold to General Washington, Major Andr\u00e9 would very likely be set free.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I didn't drop the bottle. I've always been rather proud of that.</p>\n<p class=\"tape\">The commandant didn't answer. He looked at the rebel captain for a long moment, and then he got up from the table, and called for his horse, and went down to the boat, and was rowed across the river to the city in the dark to see the General himself, at that hour, with that in his pocket. The rebel captain sat on alone at the table with his wine. I filled his glass. He looked up at me once, a young, tired, decent face, and I think he was ashamed of what he'd been sent to say, and I think he hoped it would work, as much as I did.</p>\n<p class=\"tape\">I stood behind that empty chair for two hours.</p>\n<p class=\"tape\">I've thought, since, about what I'd have given, in those two hours. Everything. Arnold. Of course Arnold. I'd have carried him over to Tappan myself, on my back, tied in a sack, and laid him at Washington's feet. A man who'd sold his country for money, and talked the best man I knew into somebody else's coat to save his own skin, and then run. What was he worth? What was he worth to anybody?</p>\n<p class=\"tape\">The boat came back in two hours. The commandant came up the steps from the landing, slowly, and stood in the doorway, and the rebel captain stood up.</p>\n<p class=\"tape\">\"Sir Henry's answer,\" the commandant said, \"is that a deserter was never given up.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>He wasn't looking at the field now. He was looking at Freda, on the top step, with her back against the post. She'd stopped crying some time back. She was very white.</p>\n<p>\"That's not fair,\" she said. \"He could have. He could have just... swapped.\"</p>\n<p>\"He could have,\" he said. \"And every man who'd ever come over to the King, in that war, on a promise, would have known that the King's promise was good only until it became inconvenient. Every Loyalist in New York. Every deserter. Every Black man who'd come in on a proclamation.\" He looked at her steadily. \"Every one of us, Freda. Me. If Clinton gave up Arnold, then the next time it was convenient, he could give up any of us. To be hanged, or to be sold back to the men who'd owned us. And everybody would know it.\"</p>\n<p>Freda stared at him.</p>\n<p>\"So he saved you,\" she said slowly. \"By not saving Andr\u00e9.\"</p>\n<p>\"That's what I've had to think about, ever since,\" he said. \"Yes. A deserter was never given up. Arnold was a deserter. So was I.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>October 1780</em></p>\n<p class=\"tape\">On the first of October, a schooner called the <em>Greyhound</em> went up the river under a flag, with three gentlemen from the city aboard: a general, and the lieutenant governor, and the Chief Justice. They were to plead for Andr\u00e9. They'd been up half the night before, at a council at headquarters, deciding what to say, and they'd decided he wasn't a spy at all, and they'd written it all down very carefully.</p>\n<p class=\"tape\">The rebels let one of them ashore. General Greene came down to meet him at Dobbs Ferry. They talked for a long time, by the river. Greene listened, and was courteous, and said, at the end, that the decision had been made, and nothing could alter it. And then he hinted, the general wrote afterward, that Andr\u00e9 might be safe if Arnold were given up.</p>\n<p class=\"tape\">And our general, the record says, <em>answered with a Look</em>.</p>\n<p class=\"tape\">That's all. Answered with a look. I've read those three words in an old letter more times than I can count. I can see the look. I don't need anybody to describe it to me.</p>\n<p class=\"tape\">They hanged Andr\u00e9 the next day, at noon, on a hill outside Tappan. The second of October.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">We didn't know for three days.</p>\n<p class=\"tape\">On the third, Gaine wrote in his journal that the general had come back down the river, and that Major Andr\u00e9 was not hanged. The whole city believed it, for a day. I believed it. I went down to the slip at the bottom of Queen Street, where I'd watched him go up the river in his scarlet coat, and stood there half the afternoon, watching every boat that came down, as if he'd be in one of them.</p>\n<p class=\"tape\">On the fifth, it came. The lieutenant governor wrote that an account had come to town that morning that Major Andr\u00e9 was executed at Tappan. And on the sixth and seventh, Gaine wrote that it was confirmed, and that there were great lamentations.</p>\n<p class=\"tape\">There were. I'll say that for the city that week, and for the army. They loved him. The General put out an order to the whole army mourning him as a gentleman of the highest integrity and honour. Robinson, I was told, sat on the edge of his bed in his lodgings with his face in his hands. Every officer in the army put a band of black cr\u00eape round his arm.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They told it all over the city, afterward, what had happened at Tappan. The rebels had told it to the boatmen and the boatmen to everybody.</p>\n<p class=\"tape\">That he'd been courteous to everybody to the end. To his guards, who wept. To the officers who came to see him. That he'd drawn a picture of himself, the night before, with a pen, sitting at the table by the window, and given it to the officer of the guard. That he'd shaved, and put on his uniform, which his servant had been allowed to bring him from the city, and come out and walked to the hill between two officers, arm in arm, talking to them. That he'd asked Washington to let him be shot, like a soldier, and not hanged, like a thief, and Washington hadn't answered. That when he saw the gallows, he'd stopped for a moment, and then gone on. That he'd put the noose round his own neck, and tied the handkerchief over his own eyes. That when they asked if he had anything to say, he'd said only that he wanted them to bear witness that he met his fate like a brave man.</p>\n<p class=\"tape\">And that the American officers who stood round that hill, the officers of the army he'd come to destroy, had wept like children. Every one of them.</p>\n<p class=\"tape\">His servant came back to the city at the end of the month, under a flag, with his master's things. His uniform. His watch, which had been taken by the men who stopped him on the road, and which Andr\u00e9's friends had bought back from them for forty guineas.</p>\n<p class=\"tape\">I saw the servant come up from the slip, carrying them. A thin young Englishman with red eyes, with the scarlet coat folded over his arm.</p>\n<p class=\"tape\">It was his own coat. It came home. He didn't.</p>\n<p class=\"break\">&#10043;</p>\n<p>Nobody said anything for a very long time.</p>\n<p>The sun had gone round. The porch was in shade now, all of it, and the field had turned the color it turns in the late afternoon in July, a deep tired gold, with the shadows of the trees reaching right across it.</p>\n<p>\"I have his face,\" he said at last. Quietly. \"From the night in his office, with the candle. Saying he'd come back in his own coat. I have it exactly. I'll have it as long as I have anything. And I find I don't know if I'm glad.\"</p>\n<p>He stood up, with his hand on the rail.</p>\n<p>\"There's one more thing,\" he said. \"And then I'll stop, and you can drive home.\" He looked at me. \"The man in the city stopped writing, that October. After Arnold came over. I'll tell you how, next week. He was frightened, and he had every reason to be. But before he stopped, he wrote one more letter. And in it, he wrote this. I've read it so often I don't need to look at it.\" He closed his eyes. \"<em>I never felt more sensibly for the death of a person whom I knew only by sight, and had heard converse, than I did for Major Andr\u00e9.</em>\"</p>\n<p>He opened his eyes.</p>\n<p>\"That's the man I'd been hunting all year,\" he said. \"The man whose road I'd shut, and whose carter I'd frightened, and whose boat I'd had shot up in a creek. And he sat in his room, in that city, and grieved for Andr\u00e9, the same week I did.\" He was quiet for a moment. \"That was a war, Ms. Barnett. Freda. That's what a war is. We were on opposite sides of it, he and I, and we were the only two men in that city who'd have understood each other completely, and he never knew I existed, and I never knew his name.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda typed it on the Sunday.</p>\n<p>I offered to do it myself. She wouldn't let me. She took the laptop into her room and shut the door, and I heard her through it all afternoon, stopping and starting the tape, and once, about four o'clock, I heard her crying, quite hard, for a minute or two, and then the typing again. I didn't go in. She wouldn't have wanted me to.</p>\n<p>At six she came out and put the laptop on the kitchen table and said, \"It's done,\" and went and stood at the back door looking out at the yard for a while.</p>\n<p>\"He was thirty,\" she said, without turning round. \"That's not that much older than Dad was when he left.\"</p>\n<p>I didn't say anything.</p>\n<p>\"He's been dead nearly two hundred and forty-seven years,\" Freda said. \"Why does it feel like somebody died this week?\"</p>\n<p>\"Because somebody told you about him who loved him,\" I said. \"That's how it works. That's all it takes.\"</p>\n<p>She thought about that, looking out at the yard. Then she turned round, and wiped her face with both hands, and said, \"I'm going to make Mr. Hale another pie,\" and went to the cupboard to see if we had any flour.</p>", "audio": true, "added": 1791140420688, "pt": [1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791225670814, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791225670814, 1791140420688, 1791140420688, 1791140420688, 1791225670814, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791225670814, 1791140420688, 1791146243217, 1791140420688, 1791225670814, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791140420688, 1791146243217, 1791140420688, 1791140420688]}, {"num": 21, "title": "The Provost", "extra": false, "html": "<p>Freda made a blueberry pie, the second time, and it fell apart when she cut it, and he said it was the best thing that had happened to him all week and had two pieces to prove it. She came up with me again. She hadn't asked if she could. She'd just been sitting in the car when I came out of the house on the Thursday morning, with the pie on her knees and her seat belt on, looking straight ahead, and I'd got in and started the engine and neither of us said anything about it.</p>\n<p>He was at the bottom of the steps again, under the maple.</p>\n<p><em>Session thirty-nine. Thursday, July twenty-second.</em> It was cooler. A front had come through in the night with a long grumble of thunder that never quite turned into rain, and the air had a clean, washed edge to it, and there was a little wind in the maple. He sat on the bench in the cardigan, for the first time in weeks, and Freda sat on the top step with her back against the post, which was her place now, and he looked at the two of us and said, \"October,\" and then, \"This is the part where I win.\"</p>\n<p>\"After Andr\u00e9?\" Freda said.</p>\n<p>\"After Andr\u00e9.\" He looked out at the field. \"I've told you the truth about everything else. I'll tell you the truth about this. I don't think I've ever worked as hard as I did that autumn, or as well. And I've never been as unhappy doing it.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>October 1780</em></p>\n<p class=\"tape\">Arnold gave them a list.</p>\n<p class=\"tape\">That was the first thing that happened, before Andr\u00e9 was even dead. Arnold came over to the King on the twenty-sixth of September, and on the twenty-eighth, while Andr\u00e9 was being moved to Tappan, men from the Provost Marshal's office went through the city with a list of names in Arnold's hand and took people out of their houses. Merchants, mostly. Gentlemen. A few tradesmen. People Arnold said, from what he'd learned as a rebel general, had been sending news to Washington. Some of them had, I expect. Most of them hadn't. A Hessian officer wrote in his diary that more of them were taken to the prison every day.</p>\n<p class=\"tape\">I watched them taken. I watched a man I knew by sight, a respectable old merchant from Hanover Square who'd once given me a penny for holding his horse, led down the Broadway between two soldiers in his nightcap, with his wife running after them in the street. They held him six weeks and let him go. I don't believe he'd ever written a word to anybody.</p>\n<p class=\"tape\">That's what a list from a man like Arnold is worth, in a war. He didn't know who Washington's people in New York were. Nobody had ever told him. He was a general. Generals aren't told. So he gave them every name he'd ever heard spoken in a rebel camp with any kind of look on the speaker's face, and they filled the Provost with them.</p>\n<p class=\"tape\">It frightened the city. I'll give it that. It frightened everybody. That's the trouble with a list like that. It frightens the innocent and the guilty exactly the same amount, and the innocent have nothing to hide, so they go on as before. The guilty were frightened already.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">There was a new man in Andr\u00e9's office by the middle of October. Oliver DeLancey, a New Yorker, a Loyalist, a cavalry officer, cousin to the DeLanceys whose refugee horse I'd ridden with in the Neutral Ground. He was made Adjutant General in Andr\u00e9's place, and he took over Andr\u00e9's secret business, with Beckwith beside him.</p>\n<p class=\"tape\">He sent for me his first week.</p>\n<p class=\"tape\">He wasn't Andr\u00e9. Nobody was. He was a brisk, square, practical man with no imagination, and he didn't offer me a chair. But he'd read what Beckwith had written about me, and he'd read what Andr\u00e9 had written, and he looked at me across Andr\u00e9's long table under the window, with Andr\u00e9's drawing board still in the corner with nothing pinned to it, and he said, \"The Major thought very highly of you.\"</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">\"So did he of a great many people. He was a generous man.\" He put his hands flat on the table. \"I'm not. I want Washington's people in this city, Freeman. The real ones. Not Arnold's merchants. I want them in the Provost, and then I want them on the end of a rope, the way they put the Major on the end of one. Can you find them?\"</p>\n<p class=\"tape\">I looked at him. And then I looked at the drawing board in the corner, for longer than I should have.</p>\n<p class=\"tape\">\"I can make them stop, sir,\" I said. \"I think that's better.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I want to tell you why I said that, because Freda's going to ask me if I don't.</p>\n<p class=\"tape\">It wasn't mercy. Not only. I'd spent a year in that city by then. I'd watched what the Provost did to people, and what the gallows did, and what a list did. And I'd watched Andr\u00e9 go up the river and come back folded over his servant's arm. And I'd found, sitting in a cedar wood above the White Plains road on the morning of the twenty-third of September, that I didn't want to put anybody else in a coat that would hang them. Not even the people I was hunting. Not even the man in the city.</p>\n<p class=\"tape\">And it was better. That was the other half of it, and it was true. A hanged spy tells you nothing. A frightened one stops, and goes on being frightened, and frightens the next one, and the one after. Andr\u00e9 had said that. I'd heard him. <em>A hanged spy is a wasted opportunity.</em> I wasn't going to waste his last idea on DeLancey.</p>\n<p class=\"tape\">DeLancey looked at me for a long time. Then he said, \"Make them stop, then,\" in the voice of a man who thought I was being soft, and would hang me too if I failed, and I went out.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">So I made them stop. I'll tell it quickly, because it's mostly small things, done well, one after another.</p>\n<p class=\"tape\">I watched the ferry. I'd never stopped watching it. And on Monday, the ninth of October, I went past the dry goods shop in Hanover Square that I'd watched in the spring, the one the carter had come out of with the quire of paper. And the shutters were up. In the middle of a Monday. And they stayed up. I went past every day for eighteen days, and the shutters stayed up, and on the twenty-seventh they came down again, and the young partner was back behind the counter, very pale. That day, I read long afterward in his own account book, he drew a great deal of money out of the business in cash.</p>\n<p class=\"tape\">I didn't go in. I didn't tell DeLancey. I knew what DeLancey would do with a shop that had shut its shutters for eighteen days, two weeks after Arnold came over. He'd have had the partner in the Provost by dinner, and the shop turned out, and nothing would have been found, because there'd be nothing to find. And then DeLancey would have had to decide what to do with a frightened young merchant with nothing against him but his shutters. And DeLancey didn't like waste.</p>\n<p class=\"tape\">I let it be. I'd frightened that shop once. It was frightened again. That was the round.</p>\n<p class=\"tape\">I've told you the man in the city wrote one more letter, after Andr\u00e9 died. His last for a long time. He said in it that he was glad Arnold didn't know his name. And then he stopped writing. For the whole winter. Their man in Setauket wrote to Tallmadge at the end of October that the man in the city had <em>resolved for the present to quit writing and retire into the country for a time</em>, and that the enemy were <em>very severe</em>, and that he himself <em>did not think myself safe there a moment</em>.</p>\n<p class=\"tape\">Very severe. That was me, Ms. Barnett. And Freda. That was me, and DeLancey, and the ghost of a young man in a scarlet coat.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The second thing was the boat.</p>\n<p class=\"tape\">The rebels had boats on the Sound besides Brewster's: whaleboats, with crews of Long Island men who'd gone over to Connecticut and came back raiding. One of them was commanded by a Captain Conklin. And there was a man in Setauket, a Loyalist, called Abijah Tooker, who knew a great deal about who came and went on that shore and liked to be paid for it. I'd found him in August, through Glover. I'd never met him. I'd sent him a little money now and then by a Loyalist sloop, and he sent back what he knew.</p>\n<p class=\"tape\">At the beginning of October, Tooker sent word of where Conklin's crew would be. Refugee boats went out and took them, near a place on that shore called Treadwell's Banks. A rebel lieutenant was killed. The rest were taken. And the man in Setauket wrote to Tallmadge that week, angry and frightened, that <em>their misfortune is owing to Abijah Tooker of Seatauket</em>.</p>\n<p class=\"tape\">He was right. It was. It was owing to Abijah Tooker, and to me.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">And the third thing. The one I want to tell you properly.</p>\n<p class=\"tape\">There was a man who helped them. Not one of the ring. One of the people around it, who carried a thing here and there, who held a horse, who kept a letter in his house for a night. Every chain has people like that. They're never in the books. They're never in anybody's books. He was a ferryman on the Brooklyn ferry, an old man with one eye, who'd worked the sweeps on those flat boats for thirty years. I'd watched him all year. I'd watched him take a folded paper from the carter, once, in the spring, and put it inside his hat, and give it to somebody on the Brooklyn side. I'd never done anything about it. I'd been saving him.</p>\n<p class=\"tape\">In the first week of November, after the shutters, I gave him to DeLancey. They had to see one of their own taken and not hanged. Taken, so they'd stop. Not hanged, so I could live with it.</p>\n<p class=\"tape\">Not as a spy. I was very careful. As a man who'd been seen carrying letters for persons unknown. DeLancey had him taken up at the ferry stairs and put in the Provost. And they questioned him, and he said nothing. Nothing at all. He said he was an old man who rowed a boat, and he'd carried a great many things for a great many people in thirty years, and he couldn't remember any of them, and he was sorry. He said it for three weeks. They didn't hurt him. I'd asked DeLancey not to, and DeLancey had looked at me as if I were mad, and then, I think because Andr\u00e9 would have, agreed.</p>\n<p class=\"tape\">I went to see him in the Provost. Twice. I brought him a blanket, because it was cold, and bread, and once a little tobacco. He looked at me through the bars with his one eye and knew perfectly well who'd put him there, I think. And he took the blanket. And he said thank you. And he said nothing else, to me or to anybody, ever.</p>\n<p class=\"tape\">The man in Setauket wrote to Tallmadge in the middle of November. <em>Several of our dear friends were imprisoned,</em> he wrote. <em>In particular one that hath been ever serviceable to this correspondence. This step so dejected the spirits of C. Junr.,</em> he wrote, meaning the man in the city, <em>that he resolved to leave New York for a time.</em></p>\n<p class=\"tape\">Ever serviceable. That was my ferryman. With one eye, and my blanket, and his mouth shut.</p>\n<p class=\"tape\">They let him out after Christmas. Nobody had ever been able to say what he'd done. He went back to the ferry and worked the sweeps till he died.</p>\n<p class=\"tape\">And that was the end of it. The road was shut. The man in the city had gone to the country. The man in Setauket was afraid to go to New York. The boats were watched, and some of them were taken. The ring that had written to Washington every two weeks all summer was silent, all that winter. Nobody was hanged. Nobody was ever going to be.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped and drank some water. The wind moved in the maple. Freda was sitting very still on the top step.</p>\n<p>\"You won,\" she said.</p>\n<p>\"I won.\"</p>\n<p>\"But you don't look like you won.\"</p>\n<p>He thought about it.</p>\n<p>\"There's a thing that happens,\" he said, \"after a loss like Andr\u00e9. You go on. You do the work. You do it better than you've ever done it, because the work's the only thing in front of you that you can get right. And you win, and you win, and you win, and it doesn't help at all.\" He looked at her. \"I'm not telling you that so you'll be sad. I'm telling you because one day you'll lose something, and you'll go on, and win things, and wonder what's wrong with you that it doesn't help. Nothing's wrong with you. It just doesn't. Not for a while.\"</p>\n<p>Freda looked at him for a long moment.</p>\n<p>\"How long's a while?\" she said.</p>\n<p>\"In that case,\" he said, \"about two hundred years.\" Then he smiled at her, properly, the first real smile all morning. \"But I'm very slow.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He was right about Claire. I want to put that down here, out of order, because it happened six days later, and I don't want it to get lost in the rest.</p>\n<p>It was the Wednesday. The twenty-eighth of July. I was at the kitchen table at a little after ten in the morning, writing three hundred words about a roofing company. Freda was asleep. The house was quiet. And my phone, face down on the table where it had been face down for four weeks, buzzed once, and then again.</p>\n<p>A number I didn't know. A Virginia number.</p>\n<p>I turned it over and looked at it for a long time, while it buzzed. Then I picked it up.</p>\n<p>\"Hello?\"</p>\n<p>There was nothing on the line for a moment. Just breathing, and behind it, very faint, a radio playing country music, and a horse blowing out through its nose, a long, soft, rattling breath.</p>\n<p>\"It was twenty-seven minutes,\" Claire Whitcombe said.</p>\n<p>I looked at the clock on the stove. It said ten fourteen. On a Wednesday morning, in summer.</p>\n<p>\"I know,\" I said.</p>", "audio": true, "added": 1791140553921, "pt": [1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791225670814, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791225670814, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791225670814, 1791225670814, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791225670814, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921, 1791140553921]}, {"num": 22, "title": "Bookbinder", "extra": false, "html": "<p>She wouldn't talk on the phone. I hadn't expected her to.</p>\n<p>\"Not like this,\" she said, after the twenty-seven minutes, after a long silence with the radio and the horse in it. \"Saturday. Not the barn. Somewhere else.\" She named a diner on Route 7 outside Leesburg, halfway between us. \"Noon.\"</p>\n<p>\"Noon,\" I said.</p>\n<p>There was another silence. Then, \"You didn't tell him,\" she said. \"My father. You could have. You didn't.\"</p>\n<p>\"No.\"</p>\n<p>\"Why not?\"</p>\n<p>I thought about how to say it.</p>\n<p>\"Because I asked you a question,\" I said. \"Not him.\"</p>\n<p>She hung up without saying goodbye. I sat at the kitchen table with the phone in my hand for a long time. Then I went and woke Freda, which I never do in summer, and told her, and she sat bolt upright in bed with her hair over her face and said, \"I'm coming,\" and I said she wasn't coming into the diner, and she said she'd sit in the car, and I said fine, because I wanted her there, and we both knew it.</p>\n<p class=\"break\">&#10043;</p>\n<p>The next day was Thursday, so I went up. Freda came. She'd had her learner's permit since March and she drove the first hour, both hands on the wheel, while I sat beside her and tried not to hold the door handle.</p>\n<p>I told him on the porch, about the call. <em>It was twenty-seven minutes.</em> He listened, and then he sat back and closed his eyes for a moment in the sun.</p>\n<p>\"Saturday,\" he said. \"Good.\"</p>\n<p>And then he wouldn't do any 1780 at all. \"Not th
