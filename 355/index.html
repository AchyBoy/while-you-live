hat she was humming.\"</p>\n<p>He didn't answer for a moment. On the far side of the field the tractor had reached the end of its row and was turning, slowly, to come back.</p>\n<p>\"Because I remember everything else about that morning,\" he said. \"Every word anybody said on those stairs. The color of the ice. The number of eggs in her basket, which was eleven, before I bought two.\" He turned his glass of water slowly on the little table, a quarter turn, and another. \"And the one thing I didn't catch is the one thing I'd give the rest of it for. That's how it goes, I find. You notice everything, and then the river makes a noise.\" He looked at me. \"Write down that it was eleven. You'll want it later.\"</p>\n<p>I wrote it down. <em>Eleven eggs.</em> I didn't ask why. I'd learned by then that he'd tell me, and that he'd tell me when it would do the most good, and that asking only made him wait longer.</p>\n<p>Then he picked up his glass and stood, with his hand on the rail, and said we'd go out onto the ice after lunch, and went in to see about the lunch. And I sat on the porch in the heat with the green coat beside me, and found, when I looked down, that I had my hand on its sleeve.</p>", "audio": false, "added": 1791134072614, "pt": [1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614, 1791134072614]}, {"num": 6, "title": "Five Deserters", "extra": false, "html": "<p class=\"tape tape-head\"><em>January 1780</em></p>\n<p class=\"tape\">You've never walked on the sea. I had, by then, once or twice, in other lives, on the Baltic in a bad year. It doesn't get easier. Every part of you knows that there's forty feet of black water under your boots, moving, and that the only thing between you and it is something that was water itself last week. The body doesn't believe the ice. It never does. It walks on it the way you'd walk on the back of a sleeping animal.</p>\n<p class=\"tape\">The wood sleigh took me across from the city at first light, behind two horses with sacking tied over their hooves for grip. Five miles of white, flat as a table, with the sun coming up red on the left and the Jersey hills on the right, and the little black shape of Staten Island ahead of us getting bigger very slowly. The driver was a Loyalist from Long Island who talked the whole way about his cousin, who'd fallen through near Bedloe's Island the week before and been pulled out by his hair. Every so often the ice under us made a noise. Not a crack. A long, low, singing note, like somebody running a wet finger round the rim of a glass the size of the harbor, that started somewhere far off and ran toward us and under us and away. The horses flattened their ears every time. So did I.</p>\n<p class=\"tape\">\"Tide,\" the driver said, the first time. \"Just the tide, lifting it.\" He said it every time after that too. I think he said it for himself.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The British held Staten Island under a brigadier called Thomas Stirling, a Scotsman, a good plain soldier who'd been in America since the beginning and didn't trust anything he hadn't seen. Most of his men were Loyalists: New Jersey Volunteers, Skinner's men, who'd been run off their own farms across the water by the rebels and who could look across the ice, on a clear day, at the steeples of the towns they came from. They hated the rebels the way only neighbors can. They had built a line of small forts, redoubts, along the heights above the watering place on the north shore, with log walls and earth and ditches full of snow.</p>\n<p class=\"tape\">I spent four nights on that ice.</p>\n<p class=\"tape\">I'd go out after dark, alone, a few hundred yards from the shore, where the snow on the ice had been blown thin, and lie down flat on a horse blanket with another one over me, and listen. If you've never done it, you can't imagine how loud the world is on a still night on the ice. The cold makes the air heavy and holds the sound down low, the way a lid holds steam, and it carries along the flat for miles. I could hear dogs on the Jersey shore. I could hear a door bang at Elizabethtown Point, two miles off, and a man swear at it. I could hear the ice itself, every few minutes, singing its long note across the bay. And under all of it, I could hear the rebels.</p>\n<p class=\"tape\">Not much, the first two nights. Sentries calling. A cart. Somebody chopping wood. The ordinary noise of a cold, hungry army's outposts trying to stay alive till morning.</p>\n<p class=\"tape\">On the third night, the thirteenth, it changed.</p>\n<p class=\"tape\">There were sleighs. Many sleighs, on the roads behind the Point, coming down out of the hills from the direction of Morristown, one after another, and stopping, and more coming behind. The runners sang on the packed snow of the roads the way they sing on ice, a high hissing whine, and the horses blew, and men talked to the horses, low. Some of the sleighs still had their bells on. Somebody in charge of them didn't know about ice, or didn't think it mattered. I lay there on my blanket with my cheek on the cold and counted. I counted until two in the morning. I stopped counting at three hundred, because after that it was one long noise and I couldn't separate the sleighs in it anymore.</p>\n<p class=\"tape\">Three hundred sleighs. More. Gathering behind Elizabethtown Point, in the night, in the coldest winter in living memory, where there was nothing on earth for a sleigh to do except cross the ice to Staten Island.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I went back to the redoubts before dawn and asked for the officer of the guard, and he was a captain of the Jersey Volunteers, a big red-faced man called Rudd with frost in his eyebrows, and he didn't believe a word I said.</p>\n<p class=\"tape\">I don't blame him, now. Look at it from where he stood. It was four in the morning. He'd been on his feet all night in a log hut that was colder inside than out. And here was a Black man he'd never seen, in a horse blanket, with frost on his face, telling him that he'd lain on the ice and listened and counted three hundred sleighs in the dark, on the other side of two miles of frozen sea. He laughed at me. Then he got angry, because I didn't go away. Then he told me that if I'd been listening to the rebels all night, it was a wonder I hadn't gone over and joined them, and that if I didn't take myself off, he'd have me in the guardhouse for a spy.</p>\n<p class=\"tape\">I showed him Robinson's paper, with Beckwith's note on it. He held it to the fire to read it. Then he handed it back and said that Captain Beckwith was in New York, and he was here, and he'd send my report up in the morning with the others. And I knew he would. I knew exactly where it would go: into a pile on a table, under a stone, with all the other reports from all the other people who'd seen rebels behind snowdrifts that week. Rudd wasn't a fool. He'd just been told the rebels were coming every night for a fortnight, by every frightened Loyalist on the island, and none of them had come.</p>\n<p class=\"tape\">I went out of the redoubt and stood in the snow, and thought.</p>\n<p class=\"tape\">A report from me wasn't going to move anybody. I was nobody. A pair of ears on a horse blanket. What would move them was something they could see.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">So I went back out on the ice, in the gray before sunrise, and I walked toward Jersey.</p>\n<p class=\"tape\">Not all the way. A mile, or a little more, until I could see the smoke of the outposts on the far shore against the brightening sky. And then I lay down again on my blanket and waited, because I was fairly sure, by then, of what I was waiting for.</p>\n<p class=\"tape\">You have to think about that army. Washington's men at Morristown. I knew a good deal about them, because deserters had been coming in all winter, and I'd seen them at the lines. They were starving. That isn't a figure of speech. That January the army at Morristown went days at a time without bread or meat, and the snow had cut the roads, and the men were eating bark and boiling their shoes. They had no coats, a lot of them. They'd built their huts in the snow and they were dying in them. And somebody had just ordered three thousand of them to get into sleighs and ride across two miles of ice in the dark, in the coldest night of the coldest winter there had ever been, to attack a line of forts.</p>\n<p class=\"tape\">Some of them were going to decide they'd rather not.</p>\n<p class=\"tape\">And a man who deserted that night wouldn't run back up into the hills, into the snow, toward the officers who'd hang him. He'd go the only way left. Across the ice, to us. Tonight, while there was still time to be worth something when he got there. And he'd come out on the ice exactly where I was lying, because it was the shortest way across, and because the ice was thickest there, and because a man running for his life over the sea goes the way the ice tells him to.</p>\n<p class=\"tape\">They came about an hour after sunrise. Five of them.</p>\n<p class=\"tape\">I saw them first as black specks against the white, a long way off, moving in a bunch, stopping, moving again. They stopped a great deal. As they came closer I saw why. Three of them had no shoes. They'd wrapped their feet in rags and old blanket tied on with string, and the rags had frozen, and they walked like old men. One had a coat, a real one, blue, with the facings torn off. The others had blankets round their shoulders like women's shawls. They were young. They were all young. The oldest might have been twenty-five.</p>\n<p class=\"tape\">When they were close enough I stood up, slowly, with my hands open, as I'd stood up in front of the Hessian at Kingsbridge. They stopped dead. One of them made a sound, not a word. For a moment I thought they'd run, back the way they'd come. But there was nowhere to run. They'd used up their running.</p>\n<p class=\"tape\">\"You're coming in?\" I said.</p>\n<p class=\"tape\">The one in the blue coat nodded. His lips were cracked through. He couldn't make them say anything.</p>\n<p class=\"tape\">\"Then you'll want to tell somebody what's coming behind you,\" I said. \"Tonight. Before it comes. That's what'll make them glad to see you.\" I looked at each of them. \"Is it tonight?\"</p>\n<p class=\"tape\">The one in the coat looked at the others. Then he found his voice. It came out cracked and very young.</p>\n<p class=\"tape\">\"Tonight,\" he said. \"All of us. Lord Stirling's taking the whole lot over. Three thousand men. Five hundred sleighs. They told us at evening parade. Tonight, and take the forts in the dark before they know.\" He swallowed. \"We're not going. We're not dying on the ice for a fort.\"</p>\n<p class=\"tape\">I believed him. I'd have believed him without the words. I looked at his feet in their frozen rags, and his hands, cracked across the knuckles from cutting logs for huts, and the bones of his face. A man sent over to deceive us would have been fed first, and given shoes. You don't send a liar across the sea barefoot. You need him to get there.</p>\n<p class=\"tape\">\"Come with me,\" I said. \"Walk where I walk. Don't stop. I'll take you to a fire.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I didn't take them to Rudd.</p>\n<p class=\"tape\">I took them straight past the redoubt where he was, along the shore, half a mile, to the house above the watering place where the brigadier had his quarters, and I walked them up to the sentry at the door, five starving rebels in frozen rags and me in my horse blanket, and I said, very loudly, so that it would carry into the house through the window that had a light in it, that these five men had deserted from Lord Stirling's army that morning, and that they'd come to tell General Stirling that three thousand men in five hundred sleighs were coming across the ice to attack him that night.</p>\n<p class=\"tape\">The window opened. A man put his head out. Gray hair, nightcap, no wig, his breath smoking in the cold. Thomas Stirling, brigadier general, in his shirt.</p>\n<p class=\"tape\">He looked down at the five of them, standing in the snow with their rag feet. He looked at them for a long time. He didn't look at me at all. Then he said, \"Bring them in to the fire. Give them something hot. Send for my brigade major,\" and shut the window.</p>\n<p class=\"tape\">And by noon every man on Staten Island was inside the redoubts, with the gates shut and the guns loaded and the ditches swept, and sentries doubled all along the heights, and a boat had gone off as far as the ice would let it toward the city to beg for help. Rudd among them. He passed me in the afternoon, carrying cartridges, and looked at me, and I looked at him, and neither of us said a word about it. I've always rather liked him for that.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They came after dark. Exactly as the boy in the blue coat had said.</p>\n<p class=\"tape\">I watched from the wall of the biggest redoubt. You could see them coming for the last mile, black on the white under the stars, the sleighs in long dark lines, like ink running across paper. And you could hear them. You could hear them the whole way. The runners singing, and the bells, and the horses, and the men. Three thousand men, coming at what they thought was a sleeping fort in the dark, and you could hear them from the far shore, every one.</p>\n<p class=\"tape\">They landed and found every gate shut and every gun manned. Lord Stirling looked at the forts from the snow below, and saw what he'd have had to do to take them, and wouldn't. He was a brave man, but he wasn't a murderer. So his three thousand men spent the night in the open, on the hills above the watering place, in the snow, without tents, without fires, most of them, in the coldest night of that whole winter. We watched them from the walls. Nobody fired. There wasn't any point.</p>\n<p class=\"tape\">They stayed all the next day, looking at us, and another night after it. By then a third of them had frostbite. Some of them never walked right again. And on the morning after that they loaded the sleighs with whatever they, and the Jersey farmers who'd followed them over, could steal from the Loyalist farms on the island, which was a good deal, and went back across the ice to Jersey. And the boats that New York sent out to help us all came back, because they couldn't get through.</p>\n<p class=\"tape\">Almost nobody died. That's the thing I want you to write down, Ms. Barnett. Three thousand men came across the ice to fight, and the fight never happened, and almost nobody on either side died of it. Not a single one of the five boys who came across barefoot that morning. Not a single one of Rudd's men. Not, as far as I ever heard, a single one of Lord Stirling's, though some of them lost their toes.</p>\n<p class=\"tape\">It's the cleanest win I ever had. In that life or any other.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped and sat back against the porch wall, and closed his eyes for a moment, in the heat, with his face turned up.</p>\n<p>It was late in the afternoon. The tractor had gone from the field and the hay lay in long, combed rows all the way to the trees, and the shadows of the rows were getting long. The green coat was still on the chair beside me. At some point while he was talking about the ice, I'd taken it off the chair and put it across my knees. I didn't remember doing that either.</p>\n<p>\"What happened to them?\" I said. \"The five.\"</p>\n<p>He opened his eyes.</p>\n<p>\"They were fed, and given shoes, and questioned for a week,\" he said. \"Then two of them enlisted with Skinner's men and fought for the King for the rest of the war. One went to sea. The boy in the blue coat went to work for a baker in Hanover Square and married the baker's daughter.\" He smiled. \"And one walked back across the ice in February, when it was still hard enough, and rejoined his regiment in Jersey, and told them he'd been lost in a snowstorm for a month. And they believed him. Or they were so short of men by then that they decided to.\"</p>\n<p>\"You know all that?\"</p>\n<p>\"I kept track,\" he said. \"I kept track of all five.\" He picked up his water glass, found it empty, and set it down again. \"I've done a great many things in a great many lives that I'm not proud of, Ms. Barnett. You'll hear about some of them, if you keep driving up here. But I've never once regretted those five boys on the ice.\" He looked out at the hay. \"I'd like you to have one like that. Before the rest of it.\"</p>\n<p>I wrote it down. <em>Session 31. The five. Nobody died.</em> I underlined <em>nobody</em>, which I don't usually do either.</p>\n<p>Then I folded the coat over my arm and put the recorders in my bag, and he walked me as far as the top of the steps, slowly, with his hand on the rail, and stood there in the long light while I went down. When I got to the car, I looked back. He was still standing there, looking out over the field toward the east, toward the sea, a hundred and fifty miles away, and I knew without asking that he was hearing the ice.</p>", "audio": false, "added": 1791134892438, "pt": [1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438, 1791134892438]}, {"num": 7, "title": "The Person Who Wasn't Laughing", "extra": false, "html": "<p>I spent that week on Gerald Whitcombe, and I did it the way I used to, in the newsroom, when I still had a desk and a phone with my name on it. Records first. People later. People last of all, if you can manage it, because a person can only be asked a question once for the first time.</p>\n<p>It's surprising how much of a life is public, if you know which counter to stand at.</p>\n<p>The stone house outside Middleburg was in his name, and had been for thirty-one years. Forty-two acres, not forty, the county said, with a barn and a run-in shed and a pond, assessed at a figure that made me put my pen down for a moment. He'd bought it the year he became head of conservation at Carrow House. He owned no other property in Virginia or the District or Maryland. He'd never been sued, never been arrested, never been in a newspaper for anything but his talks and his retirement and a letter to the editor of the Middleburg paper, nine years ago, about a proposal to widen a road. He was against it. The road had not been widened.</p>\n<p>He'd been married for forty-four years to a woman called Margaret, who taught piano and died eleven years ago, of a stroke, in the spring. Her obituary was still up on the funeral home's website, with a photograph of a gray-haired woman at a piano laughing at somebody off to one side. It said that she was survived by her husband, Gerald, <em>her partner in all things,</em> and by their daughter, Claire, of Loudoun County, and two grandsons. It said that in lieu of flowers the family asked for donations to a horse rescue in Purcellville.</p>\n<p>I read it twice. I made a note of the daughter, because I make a note of everybody. Then I moved on to the board of the historical society and the library foundation, and his talk, every spring, on the enemies of paper. Light. Damp. Acid. The human hand.</p>\n<p>By Wednesday night I had six pages on Gerald Whitcombe and I still had exactly what I'd had on Monday, which was an old woman's memory of a laugh.</p>\n<p class=\"break\">&#10043;</p>\n<p>He made eggs, that Thursday.</p>\n<p>It was cooler, the first cool morning in two weeks, with rain in the night and the yard still dripping, and he'd lit the stove more for comfort than for need. He made the eggs the way he'd made them in the spring, when the bakery in town was shut and we'd had nothing else: scrambled very slowly in a pan with a lot of butter, stirred with the back of a fork, and toast from the bakery bread, and the tea in the brown pot. I said the date into the recorders. <em>Session thirty-two, Thursday, June third.</em> Then he put a plate in front of me and sat down across the kitchen table with his own, and looked at me, and waited.</p>\n<p>He always knew when I had something. I've never worked out how. I've watched my own face in the car mirror afterward and it doesn't look like anything.</p>\n<p>\"I've got a laugh,\" I said. \"And nothing else.\"</p>\n<p>\"Tell me.\"</p>\n<p>So I told him. The six pages. The house, the acres, the road he didn't want widened. The talk every spring. The way the audience laughed at his jokes. And Mrs. Dunleavy, in her son's front room in Frederick, with her eyes closed and her hands on the composition book, saying <em>That's him</em> before the laugh was even finished.</p>\n<p>\"I believe her,\" I said. \"I think she's right. But I can't print a laugh. I can't take a laugh to a lawyer. I can't even take it to Whitcombe, because if I drive out to Middleburg and knock on his door and say, <em>Mr. Whitcombe, a woman heard you laugh on a staircase six years ago,</em> he's going to laugh at me, the same laugh, and close the door, and call Carrow House's lawyers, who I already know, all of them, by their first names. And then the one thing I've got that he doesn't know I've got, I won't have anymore.\"</p>\n<p>He ate some of his eggs. He took his time over it.</p>\n<p>\"You're right not to go,\" he said.</p>\n<p>\"I know I'm right. That's not the problem.\"</p>\n<p>\"No.\" He put his fork down. \"Tell me about the laugh.\"</p>\n<p>\"I just did.\"</p>\n<p>\"No. You told me about Mrs. Dunleavy. Tell me about the laugh. The one in the video.\"</p>\n<p>I thought about it. I'd watched that video eleven times. I'd watched the laugh at thirty-one minutes more often than that.</p>\n<p>\"It's big,\" I said. \"Too big for the room. He puts his head back. It's the kind of laugh that tells everybody else in the room that they can laugh now too. And they do.\" I hesitated. \"It's a laugh that's used to people laughing with it.\"</p>\n<p>\"Yes,\" he said. \"A man who laughs like that is used to being believed.\" He picked up his tea. \"Don't give him the chance to be.\"</p>\n<p>\"Meaning what?\"</p>\n<p>\"Meaning you're right. Leave him alone. He's the strongest thing in your whole story. He's been standing at lecterns for forty years with people laughing in the right places. He'll be very good at your questions, because he's very good at everybody's questions. You'll come home with nothing but the sound of him being charming, and so will anybody you send.\" He set the cup down. \"So don't go to the man who was laughing, Ms. Barnett. Find the one who wasn't.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I didn't understand him for a moment. Then I did, and I felt it go down my arms, the way it used to in the newsroom.</p>\n<p>\"The car,\" I said.</p>\n<p>\"The car.\"</p>\n<p>\"Somebody waited in the car.\"</p>\n<p>\"Somebody sat in an alley behind a dry cleaner's for twenty-seven minutes,\" he said, \"with the engine running, on a Wednesday morning, while two men went up and down the stairs of a building with a woman on the second floor who wrote down every footstep. They didn't get out. They didn't help carry anything. They sat there.\" He turned his cup a quarter turn on the table. \"Think about those twenty-seven minutes from inside the car. It's the longest half hour of that person's life. They can hear nothing. They can see the back door and the alley mouth and nothing else. Every car that goes past the end of the alley is the police. Every minute the door doesn't open is a minute something's gone wrong upstairs.\" He looked at me. \"The man upstairs was laughing. The person in the car wasn't. I'd bet you your coat on it.\"</p>\n<p>\"You'd lose the coat. I'd keep you on the bet just to win it.\"</p>\n<p>\"That's a yes,\" he said, and went back to his eggs.</p>\n<p>I sat there with my fork in my hand.</p>\n<p>\"Whoever it was,\" I said slowly, \"is the weak place. Not him. He's done this sort of thing all his life, probably, a version of it. Talking. Making people comfortable. Whoever was in that car isn't like that, or they'd have been upstairs carrying boxes. They were the one he trusted not to talk, and not to ask, and to sit still.\" I thought about it. \"And they've been carrying those twenty-seven minutes ever since.\"</p>\n<p>\"Six years,\" he said. \"Every time they hear an engine idle.\" He spread butter on a piece of toast, right to the edges, the way he did everything. \"And when you find them, don't ask them what they did. They've told themselves what they did a thousand times, at night, and they've got it smooth. Ask them how long they waited.\"</p>\n<p>\"Why?\"</p>\n<p>\"Because nobody's ever asked them that. And they know the answer to the minute.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I wrote it all down. Then I sat and looked at the page.</p>\n<p>\"I don't know who it was,\" I said. \"That's the trouble. I've got six pages and there's nobody in them. A dead wife. A historical society. The man's never even had a parking ticket.\"</p>\n<p>\"Who drives a man into the city?\" he said.</p>\n<p>I looked at him.</p>\n<p>\"I'm not going to do it for you,\" he said, mildly. \"I've had my turn this year. Just ask yourself the question properly. Not who would help him. Lots of people would help him. Who'd drive him? Who'd sit in a car for him, in an alley, and not ask?\" He finished the toast. \"How old was he? Six years ago?\"</p>\n<p>\"Seventy-three.\"</p>\n<p>\"And he lives an hour and a half out, in the country, on forty acres. Does a man of seventy-three who lives on forty acres in the hunt country drive himself into the middle of Washington on a weekday morning?\"</p>\n<p>I didn't answer. He didn't need me to.</p>\n<p>\"Eat your eggs,\" he said. \"They're getting cold, and I don't make them for everybody.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He took me back out onto the ice after that, in the afternoon. I'll come to it. But that night, at home, I did something I hadn't done all week.</p>\n<p>I didn't look at Gerald Whitcombe.</p>\n<p>I sat at the kitchen table with my six pages and a highlighter, and I went through them again, and I highlighted every other person in them. Every single one. The road-widening people. The president of the historical society. His late wife, Margaret, who taught piano. The funeral home. The horse rescue in Purcellville. The daughter, Claire, of Loudoun County. Two grandsons, no names. A neighbor who'd sold him six acres of pasture in the nineties. A man from the library foundation who'd introduced him at the talk.</p>\n<p>Fourteen names. I wrote them in a column on a fresh page. Then I sat and looked at them, and I couldn't make any of them get into a car.</p>\n<p>Freda came in at ten from her father's, where she went on Thursdays now, by agreement, from four until nine, and he drove her home and waited at the curb until she was inside and the porch light had gone off and on again, which had been his own idea, and which I'd been more touched by than I'd let him see. She dropped her bag by the door and came and stood behind my chair, as she always does, and read my column over my shoulder, as she always does.</p>\n<p>\"Who are they?\"</p>\n<p>\"People who know Gerald Whitcombe.\"</p>\n<p>\"The laugh guy.\" She leaned on the back of my chair. \"Why?\"</p>\n<p>\"Because one of them might have been in the car.\"</p>\n<p>I told her what Tom had said. Not all of it. The person who wasn't laughing. The twenty-seven minutes. Who drives a man of seventy-three into the city. She listened with her chin on the top of my head, which she hasn't been tall enough to do for very long, and which she does now whenever she can, because she knows I can't stop her.</p>\n<p>\"That's a really good question,\" she said, when I'd finished.</p>\n<p>\"I know. I can't answer it.\"</p>\n<p>\"Can I see the video again?\"</p>\n<p>\"You've seen it.\"</p>\n<p>\"I saw the laugh,\" Freda said. \"We were all watching for the laugh. Mrs. Dunleavy had her eyes shut.\" She came round the table and pulled her laptop out of her bag. \"I want to watch the whole thing. All forty minutes. The beginning and the questions and the end.\" She opened it. \"Everybody always leaves off the end. That's where the people are.\"</p>\n<p>I looked at her.</p>\n<p>\"What people?\"</p>\n<p>\"I don't know yet,\" Freda said. \"That's why I want to watch it.\" She put her big white headphones on, and found the video, and dragged the little slider all the way back to the beginning, and hit play.</p>\n<p>I watched her watch it for a while. Then I went and put the kettle on, and when I came back with the tea she had her elbows on the table and her chin in her hands, and on the screen a white-haired man in a bow tie was standing at a lectern in front of a slide of a water-stained letter, and she wasn't watching him at all. She was watching the edges.</p>", "audio": false, "added": 1791135010949, "pt": [1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949, 1791135010949]}, {"num": 8, "title": "Over the Ice", "extra": false, "html": "<p class=\"tape tape-head\"><em>January 1780</em></p>\n<p class=\"tape\">I said I'd give you one clean one first, and I have. The next two aren't clean. I'm going to tell them anyway, and I'm going to tell you exactly what my part in them was, no more and no less, and you can decide what you think. That's the bargain.</p>\n<p class=\"tape\">After the night of the five deserters, Beckwith sent for me again. He'd had General Stirling's report by then. He didn't say anything about it. He didn't need to. He looked at me across his cold little table for a while, the way he'd looked at me the first time, and then he unrolled a map.</p>\n<p class=\"tape\">\"They came to us across the ice,\" he said. \"Now we go to them.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">You have to understand the mood in the city that week. It wasn't relief. It was rage.</p>\n<p class=\"tape\">The Loyalists on Staten Island had watched three thousand rebels, their own neighbors from across the water, sit on the hills above their farms for two days, and then strip those farms on the way home: the cattle, the grain, the blankets off the beds. Jersey farmers had followed the soldiers across the ice with empty sleighs, on purpose, to fill them. Men had come back to their houses on the island and found the doors off and the furniture gone. And every one of those Loyalists knew some of the faces that had done it.</p>\n<p class=\"tape\">The army wanted to answer. The Loyalist regiments wanted to answer more. And for once there was a road to answer on. Elizabethtown was just across the water from the island, on the Jersey shore, where Lord Stirling's sleighs had gathered. There was a rebel guard in the town, and stores, and officers in billets. And for a few more weeks, maybe days, there was a road of ice straight to it.</p>\n<p class=\"tape\">The question was how to get there without being heard. Lord Stirling had come across the ice like a brass band. Everybody in the city knew it by then, from the deserters and from me.</p>\n<p class=\"tape\">\"You heard them,\" Beckwith said. \"Could they hear us?\"</p>\n<p class=\"tape\">\"If you go the way they came, sir, yes. Straight across from the watering place to the Point. It's the shortest way and the thickest ice and they'll be listening for it every night now.\"</p>\n<p class=\"tape\">\"Then how?\"</p>\n<p class=\"tape\">I showed him. South, along the island's own shore, close in, where the snow lay thick on the ice and swallowed the sound. Then across the narrow water at the south end of the bay, not to the Point but below it, to a place called Trembly's Point, where the marsh came down to the shore and nobody kept a guard because nobody could imagine an army landing in a salt marsh. No sleighs. Men on foot, and the cavalry walking their horses, with sacking on the hooves. No bells. No torches. No talking. Then up through the marsh to the town in the last hour before light, and take the guard in their beds, and the officers with them, and come away by the same road before the country woke.</p>\n<p class=\"tape\">It was a good plan. I want to say that plainly. It was the best plan anybody made that winter, on either side. It went right to the end. It was what happened at the end that wasn't mine.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They went on the night of the twenty-fifth. About four hundred men, mostly Jersey Volunteers, under their lieutenant colonel, Abraham Van Buskirk, a Dutch doctor from Bergen County who'd raised a battalion of his own neighbors for the King, and a troop of the Seventeenth Light Dragoons. I went with them as the guide.</p>\n<p class=\"tape\">We went down the island's shore in the dark, close in, on the soft snow. It worked. It was like walking on wool. Four hundred men, and the loudest thing on the bay was the ice singing its long note under us now and then, and the breath of the horses. We crossed at the narrows below Trembly's Point and came up through the frozen marsh with the reeds crackling round our knees, and nobody heard us. At four in the morning we were in the streets of Elizabethtown, and the guard was in its beds, and the officers were in theirs.</p>\n<p class=\"tape\">They took about fifty prisoners. Some officers, some militiamen, and a few men who were only in the wrong house. Almost nobody fired a shot. The rebel guard came out of the houses with their hands up and their breeches in their hands. It was over in twenty minutes. It was everything Beckwith had wanted.</p>\n<p class=\"tape\">And then somebody set fire to the church.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I'll tell you what I saw. I've thought about it for two hundred and forty-seven years and I can't make it more than what it was.</p>\n<p class=\"tape\">There was a Presbyterian meeting house in the middle of the town. A big wooden building with a tall steeple, the finest building in Elizabethtown. The rebels had used it as a barracks, and before that, the Loyalists said, its minister had preached rebellion from the pulpit every Sunday since '75 and rung its bell to call out the militia. The Loyalists hated it more than any building in Jersey. Some of them had sat in its pews as boys.</p>\n<p class=\"tape\">When the prisoners were being collected in the street, a party of men came down the street with torches. They weren't Van Buskirk's regulars, the Volunteers. They were Loyalist militia from the island who'd come along on their own account, the way the Jersey farmers had followed Lord Stirling, men whose farms had been stripped the week before. And they went into the meeting house, and a few minutes later there was light in the windows, and then there was light coming out of the windows, and then the steeple was burning like a candle against the dark.</p>\n<p class=\"tape\">Van Buskirk came running. I heard him. He was shouting at them to put it out, in Dutch and English both, that he hadn't ordered it, that they were to put it out at once. Nobody did. Nobody could have, by then, with buckets and snow. And while he was shouting at them, somebody else set fire to the courthouse across the green.</p>\n<p class=\"tape\">I stood in the street and watched them burn. There was nothing I could do. I was a Black man with a guide's paper in a town full of armed white men with their blood up. If I'd so much as touched one of those torches they'd have thrown me in after it.</p>\n<p class=\"tape\">We went back across the ice in the gray light with fifty prisoners and both buildings still burning behind us, and you could see the glow of them from the middle of the bay, from Staten Island, from the Battery in the city, the people told me afterward. The rebels said it all over Jersey for the rest of the war: that the King's men had come across the ice in the night and burned a house of God. They were right. They had.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. We were back on the porch by then; the rain had cleared and the boards were drying in patches. He'd brought his tea out with him, and he set it down on the rail.</p>\n<p>\"You said it wasn't yours,\" I said. \"The end.\"</p>\n<p>\"It wasn't. I didn't light it. I didn't order it. The man who did order the raid tried to stop it, and couldn't.\" He looked at me. \"And the road those men walked to the church that night, across the ice, through the marsh, in the dark, so quietly that nobody heard them coming, was mine. I made it. I was very proud of it.\" He was quiet. \"I'm not asking you to forgive anybody. I'm telling you what happened. You can do something useful with a road, Ms. Barnett, and somebody else will always be waiting at the end of it with a torch. I learned that in Elizabethtown, and I've never once been able to unlearn it.\"</p>\n<p>\"Was there another one?\" I said. \"That night.\"</p>\n<p>\"There was. Not mine.\" He picked up the tea again. \"The same night, another column went over the ice from the city itself, across the North River in sleighs to Paulus Hook, and then by road up to Newark. They burned the academy there. And they pulled a magistrate called Hedden out of his bed in his nightshirt and marched him off barefoot in the snow, and his wife tried to stop them, and one of them ran her through with a bayonet.\" He said it plainly, the way he'd said everything about that night. \"Nobody I knew. Nobody I'd have trusted with a road. I only mention it because if I left it out, you'd find it, and you'd think I'd hidden it.\"</p>\n<p>\"I would have found it.\"</p>\n<p>\"I know,\" he said. \"That's why I like you.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>February 1780</em></p>\n<p class=\"tape\">The other one was Young's House, a week later, and that one was mine from beginning to end.</p>\n<p class=\"tape\">I'll tell it quickly. There was a farmhouse up in Westchester, in the middle of the Neutral Ground, at a crossroads near the Saw Mill River, called Young's, after the family. The rebels had made it an outpost, the most forward post they had on that side of the river, with a few hundred men, Continentals and militia, in and around the house. It was a thorn. Every foraging party the King's army sent up into the county that winter got news of it sent ahead by Young's, and every Loyalist farm within ten miles got visited.</p>\n<p class=\"tape\">I knew the house. I knew every house up there. It was eleven miles from Captain Reynolds's farm.</p>\n<p class=\"tape\">On the second of February, in the evening, a strong column left the old fort at the top of the island, the one the British had renamed Fort Knyphausen: a battalion of the Guards, Hessians, and the Westchester refugee horse, DeLancey's men, who knew that country nearly as well as I did and hated everybody in it, under a lieutenant colonel of the Guards called Norton. And sleighs, to carry the foot, and two small field guns. The snow in Westchester was two feet deep on the level and more in the drifts. The roads were gone. You couldn't see where they'd been.</p>\n<p class=\"tape\">But I knew where they'd been. Caesar's body knew. It had driven those roads under snow every winter of its life.</p>\n<p class=\"tape\">I sat on the front of the first sleigh, next to the driver, all that night, and I told him where the road was. Left here, where the stone wall comes down to the drift. Now straight, between the two big oaks; the road runs between them. Mind the brook; it's under there; keep to the right of the willow. Twenty miles, in the dark, in two feet of snow, with a column of men behind me who'd have been lost in the first hour without somebody who knew where the ground was under all that white.</p>\n<p class=\"tape\">We came out of the woods above Young's crossroads a little before nine in the morning, with the sun on the snow so bright it hurt your eyes, and the rebels at the house were cooking their breakfast.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">It was over in about a quarter of an hour.</p>\n<p class=\"tape\">They fought. I want you to know that. They came out of the house and the barns and stood in the snow and fought, and some of them fought very well, but they had no guns that could answer ours, and DeLancey's horse came round behind them through the orchard. In a quarter of an hour fourteen of them were dead and thirty-seven wounded and more than seventy were standing in the yard with their hands up.</p>\n<p class=\"tape\">I have the fourteen. All of them. Where each one lay. The colors of their coats against the snow, and the snow under them. I didn't kill any of them. I'd never fired a shot. I'd only told a sleigh driver where the road was under the drifts.</p>\n<p class=\"tape\">And I have the seventy-six in the yard. I went down to the yard afterward, because Norton wanted somebody who knew the county to tell him who the prisoners were. Which were Continentals, which were militia, which were the local men who'd hang if the Loyalists got hold of them on their own. I walked along the line of them in the snow, slowly, with Norton's adjutant beside me writing down names.</p>\n<p class=\"tape\">And the ninth man in the line was Captain Joseph Reynolds.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He'd been at the house with a company of his militia. He was standing in the snow in his good blue coat with no hat, with his hands tied in front of him, and blood on his cheek from a cut over the eye, and he looked older than I remembered, and smaller, and very cold.</p>\n<p class=\"tape\">He knew me at once. I saw him know me. I watched it go across his face, all of it: surprise, and then disbelief, and then something I think was nearly fear, and then, last, the thing I'd seen on the first morning I woke up in that body, at noon, in his barnyard, with his account book under his arm. He was looking at his property. Six months gone, and turned up in the wrong army, with a British officer at its elbow.</p>\n<p class=\"tape\">\"Caesar,\" he said.</p>\n<p class=\"tape\">The adjutant looked up from his paper. At me, and then at Reynolds.</p>\n<p class=\"tape\">\"You know this man?\"</p>\n<p class=\"tape\">Everything I had was in that moment, Ms. Barnett. I want you to see it. I could have said anything. Norton's adjutant would have written it down. <em>This man is a militia captain and a committeeman, sir, and he hanged a Loyalist neighbor in '77.</em> It wasn't true, but it would have been believed, and DeLancey's men were standing ten feet away, listening, and some of them had neighbors who'd been hanged. I could have ended him with a sentence. And he knew it. I watched him know that too.</p>\n<p class=\"tape\">\"Yes, sir,\" I said. \"His name is Joseph Reynolds. He's a captain of the Westchester militia, from Bedford. He farms there. He's a decent man to his neighbors.\" I looked at Reynolds. \"He'll do for exchange. He's no use to anybody dead.\"</p>\n<p class=\"tape\">The adjutant wrote it down. <em>Reynolds, Jos., Capt., militia, Bedford. Exchange.</em></p>\n<p class=\"tape\">And Reynolds looked at me, there in the snow, as if he'd never seen me before in his life. Which, I suppose, he hadn't.</p>\n<p class=\"tape\">\"Caesar,\" he said again. Quieter.</p>\n<p class=\"tape\">\"Freeman,\" I said. \"It's Freeman now, Captain.\"</p>\n<p class=\"tape\">I walked on down the line. I didn't look back. I heard later that he was exchanged in the spring, for a Loyalist lieutenant, and went home to Bedford, to his bottom land and his account book, and lived a long time. I don't know if he ever told anyone about the man in the yard at Young's. I don't know if he ever thought of it again. I've thought of it a great deal.</p>\n<p class=\"break\">&#10043;</p>\n<p>It was nearly four. The sun had come right round onto the porch, and the boards had dried, and steam came off the rail where it was still wet in the shade.</p>\n<p>I'd stopped writing a while back. I realized it when I looked down and saw that my pen had been lying across the page, on the word <em>Reynolds</em>, for I didn't know how long.</p>\n<p>\"Why?\" I said. \"He owned you. You could have...\" I stopped.</p>\n<p>\"I could have,\" he said. \"Yes.\"</p>\n<p>\"Why didn't you?\"</p>\n<p>He thought about it, honestly, the way he thinks about everything I ask him, as if it's the first time anyone's ever asked.</p>\n<p>\"Because I'd spent six months being something he'd paid for,\" he said. \"And I'd walked thirty miles in the dark so that I'd never have to be that again. And the moment that man in the yard was in my power, I found I didn't want to be the kind of thing that does what it likes with a man in its power.\" He picked up his cup, which was empty, and looked into it. \"It wasn't goodness. I'd like to say it was. It was pride. I wanted him to know, for the rest of his life, that I'd had him in my hand and opened it.\" He set the cup down. \"Write down that it was pride. You'll make it something nicer if you don't.\"</p>\n<p>I wrote it down. <em>Pride.</em> And then, because I'm a reporter and not a saint, and because I couldn't help it, I wrote underneath it, very small, where he couldn't read it from his side of the table:</p>\n<p><em>Not only.</em></p>", "audio": false, "added": 1791136917378, "pt": [1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378, 1791136917378]}, {"num": 9, "title": "Five Rockets", "extra": false, "html": "<p>Freda watched the lecture four times that week, all forty minutes, start to finish, and found nothing.</p>\n<p>She watched the beginning, where a man from the library foundation came to the lectern and read a very long introduction off a card. She watched the slides. She watched the questions at the end, all six of them, and the faces of the people asking them, as far as the camera showed them, which wasn't far. She watched the last ninety seconds, after the applause, where the camera stayed on for no reason and people stood up and put on their coats and a woman in the second row dropped her program. She made notes, in a document on her laptop with a title I wasn't allowed to see. On Wednesday night she shut the laptop and said, in a voice I knew from her chemistry homework, that it was a stupid video and the camera person was an idiot and she was going to bed.</p>\n<p>I didn't say anything. I'd watched it eleven times myself.</p>\n<p class=\"break\">&#10043;</p>\n<p>On the Thursday it rained again, a long gray rain that came in sideways across the field and drummed on the porch roof, and we sat in the kitchen with the door shut and the stove going and the window streaming. I said the date into the recorders, <em>session thirty-three, Thursday, June tenth</em>, and he poured the tea, and looked at the rain on the window, and smiled.</p>\n<p>\"Good,\" he said. \"That's about right for this one. Only colder.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>February 1780</em></p>\n<p class=\"tape\">Beckwith wanted Washington.</p>\n<p class=\"tape\">He didn't put it like that, the first time he spoke to me about it. He put it as a question about roads, the way he always did. But I knew what he meant before he'd finished the sentence, and so did he, and he watched me know it, and that was the first time I saw him nervous.</p>\n<p class=\"tape\">It was the week after Young's House. The ice was still hard. And Washington was sitting in a house in Morristown, in Jersey, thirty miles off, in the middle of a starving army in its huts, with a guard of a few hundred men round him, in the worst winter in living memory, when nobody in his army could imagine anything coming at them across the snow except more snow.</p>\n<p class=\"tape\">\"A troop of horse,\" Beckwith said. \"Three hundred, perhaps. Over the ice, at night, and across Jersey before light, by roads nobody's watching. Into the town. Out again with him in a sleigh, before his army knows he's gone.\" He had a map of Jersey on the table between us. His finger kept going back to one place on it. \"What would they do, without him? That army? It's held together with string as it is. Take him away and the string goes.\"</p>\n<p class=\"tape\">\"You'd have to get there, sir.\"</p>\n<p class=\"tape\">\"That's what I'm asking you.\" He looked up. \"Can it be done?\"</p>\n<p class=\"tape\">I thought about it for a long time. I want you to know that I thought about it honestly, with everything I had, the way I'd have thought about it if it had been my own idea. Because there was a part of me, I'll admit it, that wanted to see it done. To be the man who brought George Washington across the ice to New York in a sleigh, and set him down in front of Knyphausen like a parcel. It would have been the greatest stroke of the whole war, from that side. It might have ended it.</p>\n<p class=\"tape\">And I knew, of course, that it hadn't happened. I'd known Washington's name for a hundred and fifty years before I was Caesar, and I knew how his life went. He died in his bed at Mount Vernon, an old man, the first president of a country. Nobody ever carried him anywhere in a sleigh.</p>\n<p class=\"tape\">That's the strange part of what I am, Ms. Barnett, and I've never found a good way to explain it. I don't know what's going to happen in the lives I'm living. Not the small things. Not the things that only matter to the people in front of me. But some of the big things I know the way you know how a book ends that you read as a child. And I'd already learned, by then, a long time before, that knowing how it ends doesn't tell you what you're for. Only that the ending's already paid for. Somebody's got to pay it.</p>\n<p class=\"tape\">So I didn't tell Beckwith it couldn't be done. I told him the truth about the roads.</p>\n<p class=\"tape\">\"It can be done, sir,\" I said. \"In good snow. Not this snow.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He wanted to know why, and I told him.</p>\n<p class=\"tape\">The snow in Jersey was deep and soft that week, after the storms of January, too deep for horses to go fast. That was bad, but it wasn't the worst of it. The worst of it was the weather that was coming. I could smell it, the way Caesar's body had smelled it every winter of its life. A warm wind from the south, and rain on top of the snow, and then the cold coming back behind the rain, hard, overnight. When that happens, the top of the snow melts and freezes again, into a crust. A hard crust, like a pie, an inch thick, with soft snow underneath.</p>\n<p class=\"tape\">\"A man can walk on a crust like that, sir, mostly, if he's careful,\" I said. \"A horse can't. A horse goes through it at every step. Down through the crust into the soft snow, and up again, and down. And every time it goes through, the edge of the crust is like the edge of a knife, round the leg, just above the hoof, where there's no meat at all.\" I touched my own ankle. \"Three miles of that and you'll have horses bleeding from all four legs. Six miles and they'll stop. They won't go on. No rider alive can make them.\"</p>\n<p class=\"tape\">\"How do you know the rain's coming?\"</p>\n<p class=\"tape\">\"I don't know, sir. I'm telling you what the wind smells like.\"</p>\n<p class=\"tape\">He looked at me for a long moment. Then he looked at the map. His finger was on Morristown again.</p>\n<p class=\"tape\">\"Thank you,\" he said. \"That'll be all.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He went to Knyphausen with the plan on the seventh of February, and the old general approved it. On the eighth, the rain came. Snow first, then rain, all day, warm and gray, just as I'd said. They put it off.</p>\n<p class=\"tape\">And then, on the night of the tenth, the cold came back hard, and froze the whole country over again, crust on top of snow, just as I'd said, and they went anyway.</p>\n<p class=\"tape\">I wasn't with them. Jersey wasn't my country, and they had Jersey Loyalists for guides who'd been born on those roads. About three hundred horse: the hussars of the Queen's Rangers, and the Seventeenth Dragoons, under their lieutenant colonel, a man called Birch, a good cavalry officer, quiet, who looked after his horses. And at the same time, to keep the rebels looking the wrong way, parties of foot went over from Staten Island under Simcoe and General Skinner, to make a noise along the shore.</p>\n<p class=\"tape\">Beckwith sent me to the Jersey shore that night, to the British post at Paulus Hook, across the river from the city, to listen. That was my whole part. To lie on the ice in the dark at the edge of Jersey and tell him in the morning what I'd heard.</p>\n<p class=\"tape\">I heard them go. A long way off, inland, the sound of horses moving fast on hard snow, and then not fast, and then hardly at all. I heard, very faintly, a horse screaming. Then another. If you've never heard a horse scream you won't know what I mean, and I hope you never do.</p>\n<p class=\"tape\">And at about two in the morning, I saw the rockets.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Five of them. One after another, going up out of the dark country to the west, very small at that distance, little threads of red fire climbing into the sky and bursting, one, two, three, four, five. Then nothing.</p>\n<p class=\"tape\">It was the signal for every party to turn back. Birch had got five miles, perhaps six, with his horses bleeding from every leg on the crust exactly as I'd told Beckwith they would, and he'd looked at the country still ahead of him, twenty-odd miles of it, and at his horses, and he'd done the only thing a good cavalry officer could do. He'd sent up the rockets and turned round.</p>\n<p class=\"tape\">I lay there on the ice and watched the last one fade, and I'll tell you honestly what I felt. I felt two things at once, and I've never been able to separate them, not in two hundred and forty-seven years. I felt sorry. For Beckwith, who'd wanted it so much, and for Birch's horses, and a little, God help me, for myself, who'd been one road away from being the man who caught Washington. And under that, lower down, I felt something I didn't have a name for, that was very much like relief.</p>\n<p class=\"tape\">Because I'd known how it ended. And it had ended. The ending was already paid for, and it had been the weather that paid it, not me. I'd told the truth, and the truth hadn't been enough, and the weather had done what the truth couldn't.</p>\n<p class=\"tape\">Hugh Gaine, the printer, wrote in his journal the next day that the troops had gone out to surprise General Washington at Morristown. That's very nearly all anybody wrote. That's all it ever was, in the record. A night ride that came to nothing.</p>\n<p class=\"tape\">I don't know that Washington ever knew how close it came. I've never found that he did.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped, and got up, and stood at the window with his back to me, looking at the rain. It had settled in for the afternoon. The field was gray with it, and the hay rows had gone dark and flat.</p>\n<p>\"You were right,\" I said. \"About the crust.\"</p>\n<p>\"I was right about the crust,\" he said, to the window. \"Remember that, later. You'll need it.\" He came back and sat down. \"That's twice now I've been right and been thanked and sent away. The first time it didn't matter. It didn't matter at all.\" He picked up his tea. \"Let's do something smaller. I could do with something smaller.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>February 1780</em></p>\n<p class=\"tape\">The thaw came at the end of February. The ice in the harbor went gray, and then soft, and then it began to break up at the edges, with great groans and cracks you could hear all over the city at night, and the first boats tried the river again and got through. Everybody in the city was glad. The wood boats came back. The firewood came back. People stopped dying in their cellars.</p>\n<p class=\"tape\">And everybody who wanted to leave the city without being seen knew that they had about a week left.</p>\n<p class=\"tape\">There was a soldier in one of the British regiments in the city, a corporal, whose name I won't give you, because he has descendants, and he was a fool rather than a villain, and he's been punished enough. He'd decided to desert to the rebels. Lots of men did, from both sides, every week of that war. But he'd decided to take something with him, so that the rebels would be glad to see him. He'd made a drawing. All the posts on the north end of the island, the guns at each, the number of men, the hours the guard changed. He'd done it well. He'd been a draughtsman's apprentice in Bristol before the army got him.</p>\n<p class=\"tape\">Prince found out about it first. He was building a gun platform at one of those posts, and he'd watched the corporal pacing out distances with his lips moving, and drawing in a little book when he thought nobody was looking. Nobody ever thinks a carpenter is looking.</p>\n<p class=\"tape\">Prince told me, in the shed, at night. He wasn't sure what to do with it. A Black workman accusing a British corporal of anything, in that city, with nothing but his own eyes to show for it, was likely to end up with his back laid open for insolence, and the corporal free.</p>\n<p class=\"tape\">\"Then we don't accuse him,\" I said. \"We wait till he goes. And we bring him back with the book in his pocket. Nobody argues with a book.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">There was a third man with us. A wagoner called Isaac, who'd come in from Jersey the year before, a big slow good-tempered man who could lift the back of a cart off the ground by himself. We needed him for that. We didn't need anything clever. We needed somebody the corporal couldn't argue with.</p>\n<p class=\"tape\">I worked out where the corporal would go. It wasn't hard. The ice was going everywhere except in one place, at the top of the island, in the narrow water by Kingsbridge, where it still held, just, in the cold mornings. And I worked out when: the first night the guard on that post was men from another regiment, who didn't know his face. It took him four nights to find one. We waited all four, the three of us, in the cold, in a cowshed above the shore. Prince sang hymns under his breath. Isaac slept. I watched.</p>\n<p class=\"tape\">On the fourth night he came down to the shore in the dark with a bundle, and stepped out onto the ice, and we stepped out behind him.</p>\n<p class=\"tape\">He ran, of course. They always run. He got about forty yards out, and then the ice under him made the long low singing sound it made when it was thinking about going, and he stopped dead, as anybody would, and Isaac walked out behind him, quite calmly, on the thicker ice I showed him, and picked him up round the waist like a sack of meal and carried him back to the shore.</p>\n<p class=\"tape\">The book was in his coat. Prince found it. He held it up in the starlight so the corporal could see it, and didn't say a word.</p>\n<p class=\"tape\">We walked him to the guard at Kingsbridge, the three of us, with his hands tied with Isaac's belt, and handed him and his little book to the officer of the guard. The officer read the book by his lantern for a long time, turning the pages, and then he looked at the three of us standing in the snow, and he looked at the corporal, and he didn't say thank you. He said, \"Wait there,\" and went in, and wrote something, and came out again, and gave each of us a shilling, and told us to go home.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"That's it?\" I said. \"A shilling?\"</p>\n<p>\"A shilling each.\" He smiled. \"Isaac bought a hat with his. A good one. He wore it till he died.\"</p>\n<p>\"What happened to the corporal?\"</p>\n<p>\"They didn't hang him. They should have, by their own rules. But he'd been caught before he got anywhere, by three men nobody was ever going to call as witnesses at a court martial, and so it was easier to flog him and send him to the West Indies, where the fever would very likely do it for them.\" He was quiet. \"It did, I think. A year later.\"</p>\n<p>\"And you three?\"</p>\n<p>\"We went back to the shed.\" He looked at the rain. \"But that one's in the record, Ms. Barnett. I've always rather liked that. It's the only time I'm in the record that whole war, under any name at all. In Clinton's papers, somewhere, there's a line. The officer wrote it up, that night, and it went to headquarters with the corporal's book, and it's still there, as far as I know, in a box in a library.\" He turned his cup. \"It doesn't say Caesar Freeman. It doesn't say Prince, or Isaac. It says the corporal was caught and brought in by three Black men. That's all. Three of them, no names, in a line on a page.\" He looked at me. \"But it's true. It's the truest line anybody ever wrote about me.\"</p>\n<p>I wrote down the words exactly as he'd said them. <em>A deserter, caught and brought in by three Black men.</em> And under it, <em>Clinton's papers.</em> And under that, <em>Find it.</em> Then I underlined <em>Find it</em> twice, which I really don't do, and he watched me do it from across the table, with the rain behind him, and didn't say anything at all, and I saw that he was pleased.</p>", "audio": false, "added": 1791137567548, "pt": [1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548, 1791137567548]}];

  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });


// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
// Book 3 keeps its notes apart: same key, "-355" on the end. A reader who opened Book 1 with ?c= is already signed in here.
const CKEY = (() => { let k = store.get("ckey", null); if (!k) { try { k = JSON.parse(localStorage.getItem("wyl.ckey")); } catch {} } return k ? k + "-355" : null; })();
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}
function openCmt(ch, p, text) {
  if (staleV) { showStale(); return; }
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");
  $("cmtText").value = ""; $("cmtStatus").textContent = "";
  renderOld();
  $("cmt").classList.add("open");
}
$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString(), v: BUILD };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// ---- fixed since you last looked (pencil readers only) ----
// Each paragraph carries the build time its text last changed (c.pt). "seen" is, per chapter,
// the newest change the reader has acknowledged. A chapter they've never opened is NEW.
// "seen" is kept per review round, so starting a round (or moving it back) shows its boxes fresh on every device.
const SEEN_KEY = "seen-" + ROUND;
function seenAt(num) { return store.get(SEEN_KEY, {})[num] || ROUND - 1; }
function setSeen(num, t) { const s = store.get(SEEN_KEY, {}); s[num] = Math.max(s[num] || 0, t); store.set(SEEN_KEY, s); }
function isFix(c, t) { return t >= ROUND && t > Math.max(seenAt(c.num), c.added); }
function fixCount(c) { return c.pt.filter(t => isFix(c, t)).length; }
function isNew(c) { return c.added > seenAt(c.num); }
function badge(c) {
  if (!CKEY) return "";
  if (isNew(c)) return `<span class="tag new">New</span>`;
  const n = fixCount(c);
  return n ? `<span class="tag">${n} fixed</span>` : "";
}
function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">${c.extra ? c.title : "Ch " + c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => isFix(c, c.pt[i]));
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} changed in the latest round of fixes, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
</body>
</html>
