<script>
const BUILD = 1791133315293;
const AUDIO_V = "";
const ROUND = 0;  // only paragraphs changed at or after this build are boxed
const BOOK = {"series": "While You Live", "title": "355", "number": 3, "author": "Andrew F. Young"};
const CHAPTERS = [{"num": 1, "title": "Everybody Was Lying", "extra": false, "html": "<p>I hung the coat up on the Thursday night, as soon as I got home.</p>\n<p>It was the green one. Long wool, a hood that folded into the collar, pockets deep enough for two notebooks and a recorder. I had bought it the winter I was working on the Carrow House story, and taken it out of the closet again in March, because he had told me to bring a warmer coat, and for nine Thursdays I had worn it up and down his porch steps while he told me about the North Atlantic. There was a new button on it now, sewn on by Freda, in a slightly wrong shade of green. There was a receipt in the pocket from a diner that wasn't there anymore. I left the receipt where it was.</p>\n<p><em>You won't need the coat for this one,</em> he had said, from the top of the steps, in his shirtsleeves. <em>It was summer. And everybody was lying.</em></p>\n<p>I put it at the back of the hall closet, behind the vacuum cleaner, and shut the door on it. Then I stood in the hall for a moment with my hand on the knob, because it felt like shutting a door on more than a coat, and I'm not a sentimental person, and I didn't like it.</p>\n<p class=\"break\">&#10043;</p>\n<p>If you don't know me, here is the short version.</p>\n<p>My name is Iola Barnett. I used to be a reporter. Six years ago I broke a story about forged letters being sold as genuine at Carrow House, the old auction house downtown, and three days after it ran, the man who gave me the story disappeared. I called him Bookbinder, in my notebook, and nowhere else. Without him nobody believed a word I'd written. The paper printed a correction and let me go. Since then I've written whatever people pay me to write: gutter guards, dentists, houses that need to sound bigger than they are.</p>\n<p>Last October a law firm wrote to me on behalf of a client who wouldn't give his name. The client wanted me to drive north every Thursday, to a small house on a gravel road in Adams County, Pennsylvania, and record the memories of an old man who lived there alone with a great many books. His name, as far as anybody knew, was Tom Hale. He told me, the first day, that he had been in Washington the night Lincoln was shot. He didn't mean he'd read about it. He meant he had been there, in another body, with his own mind, and that it had happened to him a great many times, in a great many places, and that he didn't know why.</p>\n<p>I didn't believe him. I want to be clear about that. I spent the winter not believing him and checking everything he said, and finding that everything I could check, checked out. Then a card came from the client, in a shaking hand, asking about a ship called the Carpathia, and I spent the spring the same way, only worse, because by then I liked him.</p>\n<p>The client pays six thousand dollars a session. Twice now, when a part of the story was over, he has sent a great deal more. My daughter types the transcripts for fifteen dollars an hour. Her father, who left when she was seven, is back in her life on terms we agreed at this kitchen table, written on the back of a gas bill. He fixed the kitchen tap last weekend. It doesn't drip. I have checked.</p>\n<p>That's where we were, the first week of May. And then the next card came.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>Please ask him about New York. 1780.</em></p>\n<p class=\"tape\">Freda had asked me, the night it came, what happened in New York in 1780, and I had said I didn't know. It was true. I knew there had been a war. I knew roughly who won it. I'd been to Yorktown on a school trip and remembered the gift shop better than the battlefield.</p>\n<p class=\"tape\">So on the Thursday night, with the coat in the closet and Freda at the kitchen table typing the porch tape, I opened the laptop at the other end of the table and looked it up, the way anybody would.</p>\n<p class=\"tape\">New York in 1780, it turned out, was a British city. They had taken it in the summer of 1776, a few weeks after the Declaration, and held it for seven years, until the very end of the war. Washington's army sat out in the hills of New Jersey and up the Hudson, looking at it. The British sat in it, looking back. Most of what happened between them in 1780 happened in the dark.</p>\n<p class=\"tape\">\"He said he was on the losing side,\" I said.</p>\n<p class=\"tape\">Freda took one side of her headphones off. \"What?\"</p>\n<p class=\"tape\">\"Tom. He said he was on the other side of it. The British.\" I scrolled. \"In 1780 they were in New York. The whole city. And he said he spent two years there hunting a spy.\"</p>\n<p class=\"tape\">\"So he's a spy now.\"</p>\n<p class=\"tape\">\"He said he was hunting one.\"</p>\n<p class=\"tape\">\"Same thing.\" She pulled her chair round the corner of the table so she could see my screen, which she has done since she was four, and which I have never once managed to stop. \"Which spy?\"</p>\n<p class=\"tape\">I typed <em>spy New York 1780</em> and the internet, which had been waiting all its life for that question, told me.</p>\n<p class=\"tape\">There was a ring of them. Washington's own spies, inside British New York, sending him letters across Long Island and over the water in whaleboats. Written in invisible ink, some of them. Coded with numbers. They had a name, the Culper Ring, and a television show, and a great many websites with a great many exclamation marks. And on almost every one of those websites, somewhere near the top, there was a woman.</p>\n<p class=\"tape\">\"Agent 355,\" Freda read, over my shoulder. \"A female spy whose real identity has never been discovered.\" She sat back. \"Okay. That's actually cool.\"</p>\n<p class=\"tape\">\"It says she was arrested.\"</p>\n<p class=\"tape\">\"It says she died on a prison ship.\" Freda leaned in again. \"Having a baby. Oh, that's so sad. Wait.\" She pointed. \"That one says nobody knows if she was arrested at all. And that one says she might not have been a spy, she might have just been, like, somebody's friend.\" She frowned at the screen. \"They can't all be right.\"</p>\n<p class=\"tape\">\"No,\" I said. \"They can't.\"</p>\n<p class=\"tape\">It is a very particular feeling, reading a story online that everybody tells and nobody has checked. I used to get it in the newsroom, about once a week. The same quote passed from site to site with the same commas in it. The same date, wrong in the same way. Somebody, somewhere, a long time ago, had said a thing, and everybody since had been too pleased with it to look.</p>\n<p class=\"tape\">I wrote <em>355</em> in my notebook, and next to it, <em>check.</em> Then I underlined <em>check</em>, which I don't usually do.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The other name was easier. Everybody knew the other name.</p>\n<p class=\"tape\">Benedict Arnold had been an American general, one of the best they had, a hero. In the summer of 1780 he was given command of West Point, a fortress on the Hudson that both armies thought of as the key to the river. And he had been writing to the British for more than a year, in code, offering to sell it to them.</p>\n<p class=\"tape\">The man he wrote to was a young British officer called John Andr\u00e9. In September of 1780 Andr\u00e9 went up the river to meet Arnold in the night and settle the price. On the way back he was stopped on a country road by militiamen, three of them in the usual telling, and they searched him, and found the plans of West Point in his boots. Arnold got away, to the British, and lived a long time, rich and despised. Andr\u00e9 was hanged.</p>\n<p class=\"tape\">\"He was thirty,\" Freda said, reading. \"The British guy.\" She scrolled down. \"Everybody liked him. Even Washington's people. It says some of Washington's own officers cried.\" She was quiet for a moment. \"That's weird. Why would you cry over the enemy?\"</p>\n<p class=\"tape\">\"Maybe he was very likeable.\"</p>\n<p class=\"tape\">\"That's what everybody says about Mr. Hale,\" Freda said, \"and you still check everything he tells you.\"</p>\n<p class=\"tape\">I looked at her. She was sixteen, and her father's height, and she had found her father by herself, last fall, with nothing to go on but a postmark and a staff page on a hardware store's website, and not told me for seven months. She checked things too. She had learned it somewhere.</p>\n<p class=\"tape\">\"Summer,\" I said. \"He said it was summer.\"</p>\n<p class=\"tape\">\"In 1780?\"</p>\n<p class=\"tape\">\"When he said I wouldn't need the coat. He said, <em>it was summer, and everybody was lying.</em>\"</p>\n<p class=\"tape\">Freda looked at the screen. Arnold, writing his letters. Andr\u00e9, going up the river in the dark. The ring in the city with their invisible ink and their numbers. A woman nobody could name.</p>\n<p class=\"tape\">\"Well,\" she said. \"He wasn't wrong.\"</p>\n<p class=\"tape\">She put her headphones back on and pulled her chair back round to her own end of the table, and went on typing him. On the porch tape, through the tinny leak of her headphones, I could hear his voice, small and warm and very far away, telling her about a boy who carried bags in a hotel in Manhattan in 1912 and sent his wages home to Liverpool.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I didn't sleep much.</p>\n<p class=\"tape\">It wasn't the war. I went to bed thinking about the war, and Arnold, and a hanged man the enemy cried over, and I suppose I did think, as I lay there, that it would be strange to hear Tom tell it from the British side, after a winter of hearing him tell Lincoln from the wrong side of that one too. He had a habit, I was beginning to see, of having been where he shouldn't.</p>\n<p class=\"tape\">But that wasn't what kept me up. What kept me up was my own notebook, on the kitchen table, under the lamp, where I'd left it open.</p>\n<p class=\"tape\">I had function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">${c.extra ? c.title : "Ch " + c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => isFix(c, c.pt[i]));
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} changed in the latest round of fixes, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
