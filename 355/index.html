is week,\" he said. \"You wouldn't hear a word of it. Neither of you.\" So I said the date into the recorders anyway, <em>session forty, Thursday, July twenty-ninth</em>, and they ran for an hour and ten minutes on the three of us sitting on his porch talking about pie crust, and a hawk over the field, and whether a cat with white feet could be called anything but Socks. Freda typed it on the Sunday and said it was her favorite tape of the whole year, and I've never asked her why, because I know.</p>\n<p class=\"break\">&#10043;</p>\n<p>It was the kind of diner I'd done half my reporting in, years ago. Chrome and red vinyl, a long counter with stools, pies under plastic domes, a waitress with a coffee pot who called everybody hon. I got there at a quarter to twelve and sat in a booth by the window where I could see the lot. Freda was in the car, at the far end of it, with the windows down and her headphones round her neck, pretending to look at her phone.</p>\n<p>At five to twelve a dusty white pickup with a vet's box on the back pulled in and parked, and Claire Whitcombe sat in it with the engine running for a minute, looking at the diner. Then she turned off the engine and got out.</p>\n<p>She'd come straight from a call. She was in the same kind of jeans and flannel and boots, with her sleeves rolled, and she came in and looked round once and saw me and came over and sat down across the booth without saying anything. The waitress came. Claire ordered coffee. I ordered coffee. When the waitress had gone, she put both hands flat on the table, the way he does, and looked at them.</p>\n<p>\"I've been sick about you for six years,\" she said.</p>\n<p class=\"break\">&#10043;</p>\n<p>I'm going to tell it the way she told it. As near as I can. I didn't have a recorder. I didn't take a note, the whole time, not one, and I'd only done that once before, in a barn. I wrote it all down that night at the kitchen table, for an hour, while Freda sat across from me and didn't say a word.</p>\n<p>Her father had called her on the Wednesday morning at seven. She was at home, in Purcellville, getting ready for the day. He'd never called her that early in her life. He said he needed her to drive him into the city, right away, and not to ask him why, and could she please come.</p>\n<p>She'd come. Of course she had. He was seventy-three and he didn't drive in the city anymore, and he'd never once asked her for anything like that.</p>\n<p>On the way in he told her a little. That a young man who worked for him at Carrow, a man she'd known since she was a teenager, who'd been to their house at Christmas, who'd been her father's apprentice for fifteen years, had done something brave and foolish. That he'd given a newspaper a great deal of Carrow's private paperwork. That the paper had run a story on the Sunday. And that on Tuesday night, very late, someone at Carrow had telephoned her father at home and told him they knew who it was.</p>\n<p>\"He didn't tell me who called,\" Claire said. \"He's never told me. Somebody high up. Somebody he'd known for thirty years.\" She turned her coffee cup round on the table. \"They told him they knew. They told him they'd be at the apartment with the police by the end of the week, with a warrant, for the papers. Stolen company documents. They said they'd prosecute. They said they'd make sure he never worked with a piece of paper again in his life, and that he'd go to prison if they could manage it. And they said...\" She stopped. \"They said my father should think very carefully about whose side he was on.\"</p>\n<p>\"So he went to get the papers.\"</p>\n<p>\"He went to get the papers. Before they could. Because he said the papers were the only proof that your story was true, and if Carrow got them, they'd disappear.\" She looked up at me for the first time. \"That's what he said. I've thought about it for six years. I believe he meant it. I think he also meant that if Carrow got the papers they'd find out what was in them, and some of what was in them was letters he'd been asked to repair, himself, over the years. And had.\" She looked back down. \"Both of those. I don't know which was more.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>She told me about the morning. The building over the dry cleaner's, with the steam coming up through the grates. The alley behind it. Her father going in by the back door, which stuck, and which he had to fight. Her father laughing on the stairs, once, too loud, the way he always laughs when he's frightened. She'd heard it from the car. Her sitting in the car with the engine running because she was afraid to turn it off, in case they needed to leave in a hurry, in case somebody came. Every car that passed the end of the alley.</p>\n<p>\"Twenty-seven minutes,\" she said. \"I watched the clock on the dash the whole time. I've never been so frightened in my life. I've had a horse go down on me in a trailer on the interstate, and I wasn't as frightened as that.\" She almost smiled. \"Nobody's ever asked me how long. You're the only person who's ever asked.\"</p>\n<p>\"Somebody told me to.\"</p>\n<p>\"Who?\"</p>\n<p>\"A man who knows what it's like to wait in the wrong place for somebody who doesn't come,\" I said.</p>\n<p>She looked at me oddly, but she didn't ask.</p>\n<p>They'd brought down two boxes and his computer, she said. And him. He'd come down the stairs white as paper and got into the back seat with the boxes and not said a word all the way out of the city. He thought he was going for a day or two. To the country, to her father's house, until things calmed down. He'd shut his cat in the bedroom, because her father was at the door, and he'd left food, and he'd meant to go back for her that night, or ask a neighbor.</p>\n<p>\"And that afternoon,\" Claire said, \"at the house, my father told him the rest. About the warrant, and the prosecution, and what they'd said. And he said he couldn't go back. Not that night. Maybe not ever. He said if he went back to that apartment he'd walk straight into them.\" She closed her eyes. \"And he said, <em>Who'll feed Pearl?</em> That was the first thing he said. Not his job. Not you. <em>Who'll feed Pearl?</em>\"</p>\n<p>I couldn't say anything.</p>\n<p>\"My father said he'd see to it. He said he'd call the landlord.\" She opened her eyes. \"He didn't. He forgot. Or he didn't want to call anyone who might ask where the tenant was. I don't know which. I found out on the Saturday. I've never forgiven him for that, either.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>The waitress came back and filled our cups, and asked if we were ready to order, and we both said no, and she went away.</p>\n<p>\"Why are you telling me this?\" I said. \"Now.\"</p>\n<p>She was quiet for a long time.</p>\n<p>\"Because I'm angry,\" she said. \"Because I've been angry for six years and there's nobody I can tell. My father says it was the right thing. He says the papers are safe and the young man's safe and the lawsuit went away and everything worked out. He says you'd be fine. He said that, at the time. <em>Reporters always land on their feet.</em>\" She looked at me. \"And then I read about you. The correction. You losing your job. People on the internet calling you a liar, for years. And I thought, that's us. We did that. We took the one thing that would have shown she was right, and put it in our barn, and let her...\"</p>\n<p>She stopped.</p>\n<p>\"Let me hold it,\" I said. \"By myself.\"</p>\n<p>\"Yes.\"</p>\n<p>\"For six years. While everybody decided I'd made him up.\"</p>\n<p>\"Yes,\" Claire said, and her voice broke, and she put her hand over her mouth.</p>\n<p>And I understood that the thing I'd been carrying for six years, she'd been carrying too. From the other end. And that she'd been carrying it with nobody to put it down in front of, because the only other people who knew were the two men she'd driven out of that alley, and one of them thought it had all worked out, and the other one was hiding.</p>\n<p>\"He's alive,\" I said. \"Isn't he.\"</p>\n<p>She took her hand away from her mouth.</p>\n<p>\"He wants to see you,\" she said.</p>\n<p class=\"break\">&#10043;</p>\n<p>She drove. I want that on the record. Claire Whitcombe drove, and I sat in the passenger seat of her pickup, with her vet's kit rattling in the back, and Freda in the narrow back seat behind us, two hours west, over the Blue Ridge, into the Shenandoah Valley, to a small town with a courthouse and a college and a main street of old brick buildings with mountains standing up at both ends of it. She drove the way she'd watched that horse: carefully, not fast, all the way.</p>\n<p>He lived in a little white frame house on a side street, near the college, with a porch and a big garage behind it with the door rolled up. He was in the garage when we pulled up. I saw him before he saw me.</p>\n<p>He was at a workbench, under a lamp, with a book open in front of him. An old book, big and heavy, with the spine coming away. He had a brush in one hand and a little pot of glue at his elbow, and he was laying a strip of cloth along the inside of the spine, very slowly, very carefully, smoothing it with the side of his thumb. He was thinner. His hair had gone gray at the temples. He had glasses on that he hadn't had before. He looked exactly the same.</p>\n<p>He'd always worked like that. I'd forgotten. When we met in diners, he used to fold the paper napkin into smaller and smaller squares while he talked, exactly matching the corners, and then unfold it and smooth it out flat with the side of his thumb.</p>\n<p>Claire turned off the engine. He looked up.</p>\n<p>He saw her first. Then me.</p>\n<p>He put the brush down in the glue pot, carefully, so it wouldn't drip. He took off his glasses and folded them and put them in his shirt pocket. And then he stood there behind his workbench, in his garage, with his hands at his sides, and looked at me across six years, and I saw that he was more frightened than I'd ever seen him, more frightened than in any parking lot or diner, more frightened than the first night in the diner, when he slid into the booth across from me with a folder under his arm and asked if I was Iola Barnett.</p>\n<p>I got out of the truck.</p>\n<p>I'd thought about what I'd say, for six years. On bad nights, when I was furious with him, I'd had whole speeches. On worse nights, I'd thought he was dead, and there'd been nothing to say at all. I stood in his driveway in the sun and every word of every speech went out of my head.</p>\n<p>\"I kept the receipt,\" I said. \"From the diner. The grilled cheese. You never ate it.\"</p>\n<p>He looked at me for a long moment. And then something happened to his face that I'd never seen happen to it before, in eight months of meetings, and he came round the end of the workbench and across the garage, and I don't remember which of us got there first.</p>\n<p class=\"break\">&#10043;</p>\n<p>We sat in his kitchen, after. Claire and him and me. Freda had climbed out of the truck and stood in the garage door, uncertain, and he'd looked at her and said, \"You're the daughter. You were ten,\" and she'd said yes, and he'd said, \"I'm sorry,\" and she'd said, \"It's okay,\" in a voice that meant it mostly was, and gone to sit on the porch, where she could hear.</p>\n<p>He made grilled cheese. In a black iron pan, on an old gas stove, with tomato soup from a can heated in a little saucepan beside it. He didn't ask if we wanted any. He made four, and put them on four plates, and sent one out to Freda on the porch, and sat down with us at his kitchen table.</p>\n<p>And he ate it. All of it. The whole sandwich, and the soup, with a spoon, slowly, while I watched him.</p>\n<p>\"Six years,\" he said, when he'd finished. \"I couldn't eat in front of you. Every time. I used to go home after and eat two.\" He looked at the empty plate. \"I was so frightened, all those months. All the time. I was frightened walking into that diner and frightened walking out. And you were the only person I'd ever met who didn't think I was mad.\"</p>\n<p>\"I didn't think you were mad.\"</p>\n<p>\"I know.\" He looked up. \"That's why I chose you.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I asked him about Pearl. He asked me first, really. Before the papers, before the lawsuit, before anything else. The first thing he asked me, sitting at his kitchen table with his hands round his coffee cup, was whether I knew what had happened to his cat.</p>\n<p>I told him what I knew. That Petrakis had found her on the Friday, shut in the bedroom, half starved, and taken her to the shelter himself, and complained about the carpet. That I'd never asked, after.</p>\n<p>He nodded slowly.</p>\n<p>\"I called the shelter,\" he said. \"A month later. From a pay phone, in a gas station in Front Royal. I said I was a neighbor. They told me she'd been adopted. A family with two little girls.\" He was quiet for a moment. \"I've thought about those girls a great deal. I hope they let her sleep on the bed.\"</p>\n<p>He had another cat now. A big gray one with white feet, asleep in a basket on top of the refrigerator, that he'd taken from the same kind of shelter in the valley, three years ago. He didn't say why he'd picked that one. He didn't need to.</p>\n<p class=\"break\">&#10043;</p>\n<p>The boxes were in Gerald Whitcombe's barn, in Middleburg, Claire said, in the loft, under a tarp, where they'd been for six years, with the computer. Her father went up and looked at them once a year, she thought. She'd seen him do it.</p>\n<p>\"They're yours,\" Bookbinder said to me. \"They always were. I'd have given them to you that week, if...\" He stopped. \"I want you to have them. All of it. I want it printed. I want it in the paper with your name on it, the way it should have been, and I want...\" He stopped again, and took off his glasses, and put them back on. \"I want my name on it too. If you'll have it. I've spent six years being nobody in a garage in a valley. I'd like to be somebody again before I'm too old to enjoy it.\"</p>\n<p>\"Your name,\" I said.</p>\n<p>\"My real one.\" He told it to me. Across his kitchen table, at last. He'd never needed to before. He'd always just been the man in the booth.</p>\n<p>I didn't write it down. I've never written it down, and I'm not going to now. He says I may. He says I should. He says it doesn't matter anymore, and that he'd like it in the paper, and it was, on the fifteenth of August, in black and white, under mine.</p>\n<p>But in my notebook, and here, he's still what he was the first night I came home from the diner and opened a fresh page and needed something to call him. A man who mended old books, and kept copies of everything, and folded his napkin into smaller and smaller squares while he talked, and smoothed it flat again with the side of his thumb.</p>\n<p>Bookbinder.</p>\n<p class=\"break\">&#10043;</p>\n<p>Claire drove us back over the mountains in the dark, to the diner on Route 7, where our car had sat all day. Freda drove us home from there. She drove carefully, not fast, the whole way, with both hands on the wheel, and I sat beside her with the window down and the night air coming in, and didn't say anything for a long time.</p>\n<p>\"Mom,\" Freda said, somewhere past Leesburg.</p>\n<p>\"Mm.\"</p>\n<p>\"You have to tell Mr. Hale.\"</p>\n<p>\"I know.\"</p>\n<p>\"He said the dogs had gone quiet,\" Freda said. \"He knew. He knew it was this.\"</p>\n<p>\"He didn't know,\" I said. \"He thought it.\"</p>\n<p>\"He knew,\" Freda said, with great certainty, watching the road. \"He always knows. He just waits for you to get there, so you'll have had it yourself.\" She was quiet for a mile. \"That's what he does with the eggs, too.\"</p>\n<p>I turned my head and looked at her in the dashboard light.</p>\n<p>\"Don't say it,\" I said. \"He asked us not to.\"</p>\n<p>\"I'm not saying anything,\" Freda said. \"I'm driving.\"</p>", "audio": true, "added": 1791140677443, "pt": [1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791146243217, 1791146243217, 1791146243217, 1791146243217, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791225670814, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791225670814, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791225670814, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791225670814, 1791140677443, 1791140677443, 1791225670814, 1791225670814, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443, 1791140677443]}, {"num": 23, "title": "The Garden Wall", "extra": false, "html": "<p>On the Thursday, he was at the bottom of the steps when we drove up. Under the maple, with his hands in his pockets, watching the car come up the gravel road.</p>\n<p>And I understood, all at once, with my hands on the wheel, what he'd meant. <em>It's a good thing to see, a car coming up a road. You'll understand later.</em> He'd been waiting at the bottom of those steps every Thursday since July for a car to come up a road. Not ours. Somebody else's. A dusty white pickup with a vet's box on the back, turning into a side street in a valley town, with a man in a garage looking up from his workbench.</p>\n<p>He hadn't known. He couldn't have. He hadn't known the town, or the garage, or the grilled cheese. But he'd guessed there'd be a car, and a road, and somebody looking up. And he'd stood at the bottom of his own steps for a month so that when it came, I'd remember he'd been waiting for it.</p>\n<p>I stopped the car. Freda got out first. She didn't say anything. She went straight across the gravel and stood in front of him, and he took his hands out of his pockets, and she put her arms round him, which she'd never done, and he stood very still for a moment, and then put one hand on the back of her head, the way you do with a child, though she was taller than he was.</p>\n<p>\"He's alive,\" she said into his shoulder. \"He makes grilled cheese. He's got a cat with white feet.\"</p>\n<p>\"Has he,\" he said. \"Has he, now.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I told it all on the porch. Every word, from the diner to the drive home over the mountains in the dark. He didn't interrupt once. Freda sat on the top step against the post and corrected me twice, about the soup, and about the color of the cat. When I got to the receipt, and what I'd said in the driveway, he closed his eyes. When I got to Pearl, and the pay phone in Front Royal, and the family with two little girls, he took off his glasses, which he almost never wore, and cleaned them on his shirt for a long time.</p>\n<p>At the end he sat with his hands folded on his knee and looked out at the field.</p>\n<p>\"You won,\" he said.</p>\n<p>\"We won.\"</p>\n<p>\"No.\" He turned his head and looked at me. \"You won. I sat on a porch and talked about ice. You drove to a barn with nothing in your hands and asked one question and went away, and waited a month without knowing, and didn't tell anybody, and didn't give up.\" He looked back at the field. \"Six years, Ms. Barnett. You've held it six years by yourself. And you got there.\"</p>\n<p>I didn't trust myself to answer. I said the date into the recorders instead. <em>Session forty-one. Thursday, August fifth.</em> My voice wasn't very steady, and I've left it on the tape.</p>\n<p>\"And now,\" he said, \"since it's a day for it, I'll tell you about the best thing I did that whole year. For the worst man I never met.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>October 1780</em></p>\n<p class=\"tape\">General Arnold was in New York, and Washington wanted him back.</p>\n<p class=\"tape\">Not to forgive. To hang. Washington had been more hurt by Arnold than by anything else in that war, I think. He'd trusted Arnold above almost anybody, and given him West Point, and Arnold had sold it, and run, and left Andr\u00e9 to hang in his place. Washington couldn't have Andr\u00e9 back. But he thought he could have Arnold. In a sack, if necessary. Across the river. Alive.</p>\n<p class=\"tape\">I didn't know any of that, at the time. Nobody in New York did. I learned it afterward, like the rest, from the letters. Washington wrote to one of his cavalry officers, a young major called Henry Lee, on the twentieth of October, that he agreed to the plan, and that the essential point was that Arnold be <em>brought to me alive</em>. He wanted to make a public example of him.</p>\n<p class=\"tape\">And that same night, a sergeant of Lee's dragoons, a big, steady Virginian called Champe, deserted.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I saw him come in.</p>\n<p class=\"tape\">I was at Paulus Hook again, by chance, the morning of the twenty-first. There were two British galleys lying off the Jersey shore, and in the gray light we saw a man come pelting down the beach at Bergen with a troop of rebel dragoons galloping behind him, shouting, close enough that we heard them, and he ran straight into the water in his boots and swam for the nearest galley, with a valise strapped on his back, and the sailors pulled him out by his collar just as the dragoons reached the shore and pulled up their horses at the edge of the surf and shook their fists.</p>\n<p class=\"tape\">Everybody cheered. The sailors, the garrison, me. It was the best desertion anybody had seen all war. A sergeant-major of the famous Lee's Legion, chased to the very water's edge by his own comrades, and saved by a boat's length.</p>\n<p class=\"tape\">They took him to the city that afternoon. He was questioned by the Adjutant General's office, as every deserter was, and then by Sir Henry Clinton himself, because a sergeant-major of Lee's was worth asking. He answered everything readily and well. He passed all the forms of the garrison. And a few days later he enlisted in the new corps that General Arnold was raising, of Americans who'd come over to the King, and was made a sergeant in it, and went about the town in his new coat.</p>\n<p class=\"tape\">I watched him do all of it. Because I watched everybody. And because something about that desertion had stayed with me, the way things did, that morning on the beach.</p>\n<p class=\"tape\">He'd run for his life, by his own account, with his whole regiment behind him, from the middle of his own camp, in the dark.</p>\n<p class=\"tape\">And he'd found the time to pack a valise. With his orderly book in it.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"He was a spy,\" Freda said. \"Wasn't he. The sergeant.\"</p>\n<p>\"He was the bravest man I saw that whole war,\" he said. \"On either side. He deserted his own army, with his own friends chasing him, who didn't know, some of them, and would have shot him if they'd caught him. They'd told only the major. He swam the river in October with his valise on his back, and walked into the enemy's city, and stood in front of the enemy's commander-in-chief and lied to his face for an hour, and joined the traitor's own regiment, to get near enough to him to take him.\" He shook his head. \"If I'd been caught doing half that, they'd have hanged me from the nearest tree. He did all of it, and they made him a sergeant.\"</p>\n<p>\"And you knew.\"</p>\n<p>\"I didn't know. I wondered.\" He held up one finger, the way he does. \"That's not the same, and I'm going to be honest with you about the difference. I wondered, because of the valise. A man can be chased so hard by his own side that he has to swim for it, and get away by a boat's length, and it's very lucky. Or it's very well arranged. I'd arranged things myself, that year. I knew what arranged looked like.\"</p>\n<p>\"Did you tell anybody?\"</p>\n<p>\"No,\" he said.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>December 1780</em></p>\n<p class=\"tape\">Arnold lived on the Broadway that winter, near the bottom, next door to the General's own headquarters, in a big brick house with a garden behind it that went down toward the river, and an alley along one side of the garden, with a fence of tall wooden palings between the alley and the garden. His wife came to him from Philadelphia in November, with their baby. He kept an orderly, and two servants, and he walked in his garden every night before he went to bed, alone, for a quarter of an hour, with his hands behind his back and his bad leg dragging a little. Everybody knew it. It was a thing people said about him, the way people said things about Arnold, that he walked in his garden at midnight like a man with something on his conscience.</p>\n<p class=\"tape\">I knew the alley. It went down to the river between the backs of the houses, and at the bottom of it, among the slips, boats tied up at night: oyster boats, wood boats, small craft from the Jersey side. I'd walked it a hundred times. I'd stood in it holding horses.</p>\n<p class=\"tape\">And on a gray afternoon in early December, walking down it, I saw that somebody had been at the fence.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I'd never have seen it myself. I want to be honest about that, too. It was Prince who saw it, really. He was with me that afternoon. We'd been hired to carry a load of planks down to a boat at the bottom of the alley, and he was ahead of me with his end, and he stopped so suddenly I nearly walked into him.</p>\n<p class=\"tape\">\"Look at that,\" he said. \"Somebody's drawn those nails.\"</p>\n<p class=\"tape\">I looked. It was a stretch of the paling fence along Arnold's garden, five or six boards, just where the alley was darkest, under the overhang of a stable roof. To me it looked like any other stretch of fence. To Prince, who'd built more fences than I'd walked past, it looked like a door. The nails at the top and bottom of each paling had been drawn, and then pushed back into their holes, so the heads showed and the boards stood straight. But they weren't holding anything. You could have taken those palings out with your fingers, one by one, in the dark, without a sound, and stepped through into Arnold's garden, and put them back.</p>\n<p class=\"tape\">\"That's careful work,\" Prince said, with professional respect. \"Somebody knew what they were about.\"</p>\n<p class=\"tape\">I stood in the alley and looked at those palings, and then at the bottom of the alley, at the boats tied up among the slips. And I thought of a sergeant who'd swum the river with a packed valise on his back. And of a man who walked in his garden at midnight, alone, every night, for a quarter of an hour. And of February, and five rockets going up out of the dark country to the west, and Beckwith's finger on his map going back and back to Morristown.</p>\n<p class=\"tape\">I'd planned this. That's what I thought, standing there. I'd sat in a cold office ten months before and planned exactly this, for the other side. Take a general out of his own headquarters at night, in the middle of his own army, and carry him off across the water before anybody knew he was gone.</p>\n<p class=\"tape\">They'd only done it better.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I went to DeLancey that evening. I didn't tell him about the sergeant. I told him about the fence.</p>\n<p class=\"tape\">I told him that somebody had drawn the nails in the palings along General Arnold's garden, at the darkest place in the alley, and pushed them back so nobody would see, and that the alley went down to the boats, and that the General walked in that garden alone every night at midnight, and that if I were Washington, and I wanted him alive, that was where I'd take him.</p>\n<p class=\"tape\">DeLancey looked at me for a long time. He didn't like me. He never did. But he wasn't a fool.</p>\n<p class=\"tape\">\"Who drew the nails?\" he said.</p>\n<p class=\"tape\">\"I don't know, sir.\"</p>\n<p class=\"tape\">That was true. I didn't. I didn't know it was the sergeant. I'd wondered. That's all. And a man can be hanged on a wonder, in that city, as easily as on a fact. I'd seen it done.</p>\n<p class=\"tape\">\"I'll have the alley watched,\" DeLancey said.</p>\n<p class=\"tape\">\"If you watch the alley, sir, they'll see you watching, and wait. And try again somewhere else, some other night, and you won't know where.\" I'd thought it through on the way. \"Don't watch the alley. Move the General. Tomorrow. Quietly. To other quarters, without saying why. Have the fence mended. Let whoever drew those nails come to that garden on their night and find it empty, and the fence nailed shut, and the General gone, and nobody waiting for them, and nothing to show that anybody ever knew.\" I paused. \"They'll think it was chance. They'll think the General just moved. And they'll be frightened for the rest of the war that it wasn't.\"</p>\n<p class=\"tape\">DeLancey said nothing at all for a moment.</p>\n<p class=\"tape\">\"The Major would have liked that,\" he said finally, in a strange voice.</p>\n<p class=\"tape\">\"Yes, sir,\" I said. \"I think he would.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">General Arnold changed his quarters the next day. Nobody told him why, I believe, or if they did, they told him something else. The fence was mended by a carpenter from the Engineers, who complained about the state of it.</p>\n<p class=\"tape\">And a night or two later, the story goes, a sergeant of Arnold's Legion and a man from Newark came down that alley in the dark to the place where the palings were loose, with a boat waiting at the bottom among the slips and a gag and a rope in their coats, and found the fence nailed shut, and the garden dark, and the house empty.</p>\n<p class=\"tape\">Nobody was waiting for them. Nobody took them. They went away. The sergeant sailed with Arnold's Legion for Virginia a week or two later, on the twentieth of December, with the rest of the corps, in his British coat. And a long time after that, in Virginia, he walked away one night and found his way back to his own side, and to his major, and was given his discharge, so he'd never be taken and hanged as a deserter. I've always been glad of that. I'd like to have shaken his hand.</p>\n<p class=\"tape\">Arnold lived to be an old man. In London, rich and despised, with nobody on either side of the ocean who'd sit at a table with him if they could help it. He died in his bed, twenty-one years later. They say he asked to be buried in his old American uniform. I don't know if that's true. I'd like it to be. It would be the only thing about him I ever understood.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. Freda was looking at him from the top step with an expression I couldn't read.</p>\n<p>\"Why?\" she said. \"You hated him. You said he was the worst man you never met. You could have just... not said anything. Let them take him. Nobody would ever have known.\"</p>\n<p>He thought about it, honestly, the way he thinks about everything she asks him. He'd always been honest with Freda. More honest, sometimes, than he was with me.</p>\n<p>\"Because of what Clinton said,\" he said. \"At Paulus Hook. <em>A deserter was never given up.</em> I'd stood behind that chair for two hours, Freda, and hated that sentence more than anything I'd ever heard. And then I'd understood it. If they could take Arnold, out of his own garden, in the middle of the King's own city, then they could take anybody who'd come over. Any deserter. Any Loyalist. Any man who'd run from his master on a proclamation.\" He looked at her. \"Arnold was a traitor and a coward and he got a better man killed. I'd have watched them hang him with pleasure. But he'd come in on the same promise I had. If the promise didn't hold for him, it didn't hold for me. Or for Prince. Or for any of us.\"</p>\n<p>\"So you saved him for you,\" Freda said.</p>\n<p>\"I saved him for all of us,\" he said. \"And for Andr\u00e9, I think. Because Andr\u00e9 would have.\" He picked up his glass. \"And I did it without giving them the sergeant. So nobody hanged. On either side. That's the part I'm proud of.\" He drank. \"The best work I did that whole year, Freda. For the worst man I never met. That's how it goes, sometimes. You don't get to pick who you're good for.\"</p>\n<p>Freda thought about that for a long time, with her chin on her knees.</p>\n<p>\"That's really annoying,\" she said at last.</p>\n<p>He laughed so hard he had to hold on to the rail.</p>\n<p class=\"break\">&#10043;</p>\n<p>When he'd stopped laughing, and wiped his eyes, he looked at the two of us. At me in my chair, with my notebook. At Freda on the step.</p>\n<p>\"Next week,\" he said, \"is still December. After Christmas. The end of the year.\" He folded his hands on his knee. \"The eggs.\"</p>\n<p>Freda went very still.</p>\n<p>\"I'm going to tell you how I found her,\" he said. \"The way I found her. In the order I found her in. And I'd like you both to be here.\" He looked out at the field. \"I've never told anybody. In all this time. I'd like to tell it to the two of you.\"</p>", "audio": true, "added": 1791140984732, "pt": [1791225670814, 1791140984732, 1791225670814, 1791140984732, 1791140984732, 1791140984732, 1791146243217, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791146243217, 1791225670814, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140990984, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791225670814, 1791140984732, 1791225670814, 1791140984732, 1791140984732, 1791140984732, 1791225670814, 1791140984732, 1791140984732, 1791140984732, 1791140984732, 1791225670814, 1791140984732, 1791140984732]}, {"num": 24, "title": "The Egg Widow", "extra": false, "html": "<p>It rained on the Thursday. A steady, gentle, all-day rain, the first in three weeks, the kind farmers stand at windows and watch. He had the stove lit in the kitchen when we came in, though it wasn't cold, and the kettle on, and three cups set out on the table, and in the middle of the table, on a plate, there was a little brown bowl with a dozen eggs in it.</p>\n<p>Freda saw them and stopped in the kitchen doorway.</p>\n<p>\"Sit down,\" he said. \"They're for later. I'll make you an omelet when it's done. I make a very good omelet.\" He poured the tea. \"Session forty-two, Ms. Barnett.\"</p>\n<p>I said it into the recorders. <em>Session forty-two. Thursday, August twelfth. Raining. Freda's here.</em> And then, because I couldn't help it, <em>There are eggs on the table.</em></p>\n<p>\"Twelve,\" Freda said, from the doorway. She hadn't moved.</p>\n<p>\"Twelve,\" he agreed, and smiled at her. \"Come and sit down, Freda. Nothing's happening today. It's a dozen.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>December 1780</em></p>\n<p class=\"tape\">They let the ferryman out of the Provost two days after Christmas.</p>\n<p class=\"tape\">I was there. I'd asked to be told, and I was told, and I went and stood across the street from the gate in the gray morning and waited. It was cold, not like the winter before, an ordinary December cold with a little snow in the gutters. The gate opened at about nine, and the old man came out alone, in his own clothes, with my blanket folded over his arm, blinking, and stood in the street for a moment as if he didn't know which way the river was.</p>\n<p class=\"tape\">Then he turned and walked down toward the East River. Slowly, an old man's walk, in the cold. And I followed him, the way I'd followed a hundred people that year, at a distance, on the other side of the street.</p>\n<p class=\"tape\">He went straight to the ferry. I'd thought he would. Thirty years on those sweeps. Where else would he go?</p>\n<p class=\"tape\">He didn't go down the stairs to the boats. He stopped at the top. At the cart.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I'd seen her there a hundred times. Two hundred. Twice a week for a year and a half, with her eggs in their two rows on the white cloth and her butter in its crock and her little iron pot of coals for the cold mornings. I'd bought eggs from her and put them inside my shirt and walked away without ever once looking at her face.</p>\n<p class=\"tape\">I watched her look up and see him.</p>\n<p class=\"tape\">She didn't say anything. She didn't make anything of it. She took two eggs out of the basket, without asking, and put them in his hand, and closed his fingers over them with her own. And held his hand closed, round the eggs, for a moment longer than anybody would have needed to. And said something to him, very low. And he nodded, and put the eggs in his coat, and went down the stairs to the boats without looking back.</p>\n<p class=\"tape\">She didn't charge him. I watched her not charge him.</p>\n<p class=\"tape\">And she looked up, then, across the street, straight at me.</p>\n<p class=\"tape\">Just for a moment. Not long. The way you'd look at a man you'd sold eggs to twice a week for a year and a half, standing across the street on a cold morning for no reason. And then she looked away, and straightened the rows of eggs with one finger, and rubbed her hands over her little pot of coals.</p>\n<p class=\"tape\">I stood there in the snow in the gutter. And something went down my arms, the way it does when a thing goes click, the way your mother's told me it does for her. And I didn't know yet what it was. I knew only that I'd been looking at the wrong thing for a year and a half, and that I'd just looked at the right one, and that it had looked back.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. The rain was steady on the roof. Freda had come and sat down, finally, at the table, with her hands round her cup, and she was looking at the bowl of eggs.</p>\n<p>\"You didn't know,\" Freda said. \"Even then.\"</p>\n<p>\"Not then. Not on the street. It took me the whole night.\" He turned his cup a quarter turn. \"I want to tell you how. Because it's the only time in my life that body's eyes did exactly what they were for. And I want you to see it the way I saw it.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>December 1780</em></p>\n<p class=\"tape\">I went back to the shed by the North River that night, and lay down on my bed with my coat over me, and shut my eyes, and went back.</p>\n<p class=\"tape\">You've never had eyes like Caesar's. Nobody has. I can't make you understand what it was like. The nearest I can come is this: imagine every day of your life were a book on a shelf, and you could take any one of them down and open it at any page and the page would be there, exactly as his eyes had seen it, every word, every face, the light on it. Only what he saw. Never what he heard. But all of that. And imagine that you'd never once taken down most of the books, because you hadn't known there was anything in them worth reading.</p>\n<p class=\"tape\">I took them down. All night. One after another.</p>\n<p class=\"tape\">I took down every morning I'd stood at the top of the ferry stairs, from the summer of '79 to that very morning. Every one. And I didn't look at the people waiting for the boat this time. I didn't look at the carters or the boatmen or the farmers with their baskets. I looked at the corner where the cart stood, and the woman behind it, and the basket on top of it, under its cloth.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I'll give you what I found. In the order I found it.</p>\n<p class=\"tape\">The first thing was her face. I'd never looked at it, in a year and a half. But Caesar's eyes had, every time, without me. It was there on every one of those mornings, on every page, waiting. A woman of perhaps thirty-five, or a little more, with a broad plain face, weathered, and a strong chin, and gray hair coming out from under a plain cap, and a little white scar through her left eyebrow. Gray cloak. Every morning, the same gray cloak.</p>\n<p class=\"tape\">The second thing was the eggs. Your mother wrote them down for me, Freda, every time I told her, and so did you, I suppose, when you typed it. In January, on the frozen stairs, with no boat running at all, eleven. They'd found some other way across the ice that week, I suppose. I never learned it. In March, a morning I'd been watching for the carter, eleven. In May, every time I passed, twelve. And on the twentieth of July, at dawn, with the carter going over in the first boat with his face gray and no cart, eleven.</p>\n<p class=\"tape\">Now I went through them all again. Every morning Caesar's eyes had caught that cart, one after another. Not every morning there was. I was away a great deal, in the Neutral Ground, on the Island, on the ice. But every morning I'd passed. And it was the same. On the days I'd seen the carter come over with a parcel the shape of a quire, or go back in a hurry, or anything at all to do with their road, there were eleven eggs in her two rows when the sun came up. A gap in the front row. One gone, before she'd sold a single one. On every other morning I'd seen, there were twelve. A full dozen. Every morning I'd passed in May, when the road was shut, twelve. Every morning I'd passed since October, when the man in the city stopped writing, twelve.</p>\n<p class=\"tape\">I'd counted them every time I passed, for a year and a half. I couldn't help it. I counted everything. And I'd never once asked myself why a woman who sold eggs by the dozen started some mornings with one missing.</p>\n<p class=\"tape\">She'd been standing at the top of the only road out of the city, in plain sight, telling them. One egg gone: there's something to carry today. A full basket: there's nothing; stay home. Every carter and boatman and courier on that road had only to walk past her cart on his way to the boat, and look at her basket, and he'd know. And nobody had to say a word. Nobody had to carry a scrap of paper. Hill could search them all to the skin.</p>\n<p class=\"tape\">The cleanest thing I ever saw in that war. From either side.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">And the third thing.</p>\n<p class=\"tape\">I went back. Back past all of it, back into the summer before, the summer I came in, to a morning in late August of '79 at Mr. Hill's new table on the Brooklyn landing. A morning I'd told your mother about, Freda, months ago, because I remember everything and can't leave anything out. A thin anxious farmer of about thirty, in a brown coat, coming off the boat from the city. And his wife on his arm, a little older than him. In a gray cloak and a plain cap. Scolding him the whole way up to the table about what he'd paid in the city for a pound of tea.</p>\n<p class=\"tape\">I took that page down and looked at her face.</p>\n<p class=\"tape\">A broad plain face, weathered. A strong chin. A little white scar through her left eyebrow.</p>\n<p class=\"tape\">She wasn't his wife. She'd walked a frightened man past Hill's table with his letters on him, in the first week Hill was there, when every man was searched, by scolding him so loudly about the price of tea that Hill had been glad to see the back of them both. Everybody in the line had laughed. I'd laughed.</p>\n<p class=\"tape\">That was her. The first time I ever saw her. And she'd been at the top of the ferry stairs every morning since, with her basket, for a year and a half, and I'd bought eggs from her twice a week, and never once looked up.</p>\n<p class=\"break\">&#10043;</p>\n<p>Nobody said anything.</p>\n<p>The rain went on, soft and steady, on the roof and in the yard. The stove ticked. Freda was holding her cup in both hands and looking at him with her eyes very wide, and I realized I'd stopped writing a while ago, and that my pen was lying across the page on the word <em>eggs</em>.</p>\n<p>\"I said it,\" Freda said, in a small voice. \"I said it was the egg lady. In the car. I said that's what you do with the eggs.\"</p>\n<p>\"You did,\" he said. \"And your mother saw it in July. You were both a great deal quicker than I was.\" He smiled at her, a little. \"I had every single piece of it in my head from the first week. Every page. And it took me a year and a half and an old man with one eye to make me open the book.\"</p>\n<p>\"Why didn't you see it?\" Freda said. \"If you saw everything?\"</p>\n<p>He thought about that for a long time.</p>\n<p>\"Because I was looking for a man,\" he said. \"A gentleman. A man of business, with good paper and a good coat. That's who I told Beckwith I was looking for, in March, with my finger on his map. And I never once thought to look at a woman selling eggs. Not because I thought she couldn't. Because I didn't think of her at all.\" He looked down at his hands. \"And I'd spent my whole life in that body being the man at the edge of the room nobody thought of at all. I should have known better than anybody alive. That's what I've never forgiven myself for, Freda. Not that I lost her. That I didn't see her, because she was standing exactly where I stood.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>December 1780</em></p>\n<p class=\"tape\">I didn't sleep. At first light I was at the top of the ferry stairs.</p>\n<p class=\"tape\">The cart was there. The shallow basket on top, the eggs in their two rows on the white cloth. The butter in its crock. The little iron pot of coals, with the coals just catching.</p>\n<p class=\"tape\">And a different woman behind it.</p>\n<p class=\"tape\">Younger. Stout, red-faced, cheerful, with her hands wrapped in rags against the cold, stamping her feet. I'd never seen her in my life. And Caesar's eyes were quite certain of that.</p>\n<p class=\"tape\">I asked her, as carelessly as I could, as a man who bought eggs there twice a week and was used to another face, where the widow was.</p>\n<p class=\"tape\">\"Gone over to the Island,\" the young woman said. \"Yesterday, on the noon boat. Her sister's poorly, out Setauket way. I'm minding the cart for her.\" She tipped the basket toward me. \"Eggs? They're good. She'd want me to keep her people.\"</p>\n<p class=\"tape\">I looked down into the basket. I didn't need to count them. I counted them anyway.</p>\n<p class=\"tape\">Twelve.</p>\n<p class=\"tape\">\"What's her name?\" I said. \"The widow.\"</p>\n<p class=\"tape\">The young woman looked at me oddly. A Black man asking a white woman's name, at the top of the ferry stairs, at dawn.</p>\n<p class=\"tape\">\"Widow Ames,\" she said. \"Everybody knows Widow Ames.\" She nudged an egg back into its row. \"You'd know her if you saw her. She's been here forever.\"</p>\n<p class=\"tape\">I bought two eggs. I don't know why. I stood at the top of the stairs with them warm in my hand, and watched the first boat of the morning push off for Brooklyn, with half a dozen people in it, none of whom was a woman in a gray cloak. She'd gone over the day before. On the noon boat. A few hours after an old one-eyed ferryman came out of the Provost and walked straight to her cart, and she'd looked up and seen me across the street.</p>\n<p class=\"tape\">One day.</p>\n<p class=\"tape\">If I'd seen it on the street, instead of in the night. If I'd gone to the cart, then and there, in the snow in the gutter, instead of home to my bed to take down my books. One day. Not to take her. I've never known what I'd have done. To look at her once, knowing. That's all.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. He got up from the table, slowly, with one hand on its edge, and went to the counter, and took a pan down from the hook over the stove, and put it on the burner, and a lump of butter in it, and stood watching the butter melt.</p>\n<p>\"Did you go after her?\" I said. \"To Setauket?\"</p>\n<p>He didn't turn round.</p>\n<p>\"No,\" he said.</p>\n<p>\"Did you tell DeLancey? Her name? What she looked like?\"</p>\n<p>The butter began to foam. He picked up the brown bowl from the table, and took out four eggs, one at a time, and cracked them, one-handed, into a bowl, the way people do who've done it ten thousand times.</p>\n<p>\"Next week,\" he said. \"That's next week. The last one. I'd like to make you both an omelet now.\"</p>\n<p>He beat the eggs with a fork, briskly, and tipped them into the pan, and the kitchen filled with the smell of it, warm and plain and good, with the rain on the roof. And I looked at the bowl on the table.</p>\n<p>Eight left. He'd taken four.</p>\n<p>Freda was looking at it too. She looked up at me. She didn't say anything. She didn't need to.</p>\n<p>He made the omelet, and folded it in the pan, and cut it in three, and put it on three plates, with toast, and sat down with us, and we ate it, the three of us, at the kitchen table, in the rain, and it was the best omelet I have ever had in my life, and nobody said one word about eggs for the rest of the afternoon.</p>", "audio": true, "added": 1791141370878, "pt": [1791141370878, 1791141370878, 1791146243217, 1791146243217, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791146243217, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791146243217, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791146243217, 1791141370878, 1791141370878, 1791141370878, 1791146243217, 1791146243217, 1791146243217, 1791146243217, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791146243217, 1791141370878, 1791141370878, 1791141370878, 1791146243217, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791146243217, 1791141370878, 1791141370878, 1791225670814, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878, 1791141370878]}, {"num": 25, "title": "The Story Runs", "extra": false, "html": "<p>I haven't told you the rest of that first week. I called my old editor on the Monday after the valley, the second of August, three days before I told Tom any of it.</p>\n<p>Her name is Ruth Okafor. She was the one who'd hired me, and the one who'd stood in the doorway of the conference room six years ago while the lawyers talked, with her arms folded, and said nothing, and the one who'd handed me the box at the end. She was managing editor now. I'd seen her name on the masthead every Sunday for six years and never once called the number underneath it.</p>\n<p>She picked up on the second ring.</p>\n<p>\"Iola,\" she said. Not surprised. Wary. The way you'd say the name of somebody who'd been dead and was now apparently on the phone.</p>\n<p>\"He's alive,\" I said. \"My source. I found him. I've sat in his kitchen. He's got the papers, all of them, the originals he copied, in two boxes, and he wants to go on the record. With his name. Under mine.\"</p>\n<p>There was a long silence on the line. I could hear the newsroom behind her, faintly, the way you hear the sea in a shell. Phones. Somebody laughing.</p>\n<p>\"Come in,\" Ruth said. \"Today. Bring nothing. We'll talk in my office with the door shut.\" She paused. \"And Iola. Don't tell anybody else. Not one person.\"</p>\n<p>\"I'm going to tell one person,\" I said. \"On Thursday. He's in his seventies and he lives in Pennsylvania and he's never going to tell anyone anything.\"</p>\n<p>\"Well,\" Ruth said, after a moment. \"That's a start.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>It took two weeks. That's very fast, for a story like that. It should have taken two months. It would have, except for one thing Claire found, on the second day.</p>\n<p>Carrow House had a fall sale coming. <em>Autograph Letters, Manuscripts and Historical Documents</em>, the same heavy cream catalog with the brass doors on the cover. It was already printed. It was on their website. And in it, on page forty-one, there was a letter, signed by a general from the Revolutionary War, estimated at forty to sixty thousand dollars, that was described, word for word, as a letter my source had been asked to repair, eight years ago, with damage that was new. It was in his copies. It was in the boxes.</p>\n<p>They were selling it again.</p>\n<p>\"Then we haven't got two months,\" Ruth said, when I showed her. \"We've got until the sale.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>The boxes came out of the barn in Middleburg on the third of August.</p>\n<p>Claire went to her father. She went alone, and she told me afterward that she'd sat at his kitchen table, in the stone house, the way he'd sat with her at the kitchen table six years before, and told him that a woman had come to her barn and asked how long she'd waited, and that she'd answered, and that she'd driven the woman over the mountains to the valley, and that it was done.</p>\n<p>\"What did he say?\" I asked her.</p>\n<p>\"Nothing, for a long time,\" Claire said. \"Then he laughed.\" She was quiet. \"Not the big one. A small one. And then he cried. I've never seen him cry. Not when Mom died. Not ever.\" She looked at her hands. \"And then he got up and went out to the barn and climbed up the ladder to the loft himself. At seventy-nine. I couldn't stop him. He brought the first box down himself, on his shoulder, one rung at a time. He said he'd carried it up, and he'd carry it down.\"</p>\n<p>I met him once. Only once. On the fourth, at the stone house, because he'd asked to see me, and Claire said I didn't have to, and I went anyway.</p>\n<p>He was smaller than in the video. He sat in a wing chair by a cold fireplace in a room full of books, in a cardigan, with a rug over his knees in August, and he didn't get up when I came in, and he didn't laugh. He looked at me for a long time, and then he said the thing I'd known since the diner that he'd say, and that I'd been afraid of, because I didn't know what I'd do with it.</p>\n<p>\"I told my daughter,\" he said, \"that reporters always land on their feet.\" He looked at the cold fireplace. \"I've been wrong about a great many things in my life, Ms. Barnett. I've been wrong about paper. I've been wrong about people. I was very wrong about that.\" He looked back at me. \"And I repaired some of those letters. Myself. Before he ever did. Over many years. I'd like you to know that from me, and not from a box.\"</p>\n<p>I didn't say anything. I didn't trust myself to.</p>\n<p>\"Print it,\" Gerald Whitcombe said. \"Print all of it. My name too. I'm seventy-nine. I'd rather it was true than kind.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>The paper sent the letters to two independent document examiners, one in New York and one in London, and they came back in eight days, both of them, and said what my source had said seven years before. New damage. Old paper. Modern ink, very cleverly aged, in places that had been made to look like repairs. The lawyers read everything three times. Carrow House was given forty-eight hours to respond, by email and by courier, and didn't, and then, at five minutes to the deadline, sent a statement saying they were reviewing their consignment procedures and had withdrawn three lots from the fall sale <em>out of an abundance of caution</em>.</p>\n<p>The story ran on Sunday, the fifteenth of August, on the front page, above the fold.</p>\n<p>Two bylines. Mine first. His second. His real name, which I'd never written in eight months and six years, in black type on newsprint on every doorstep in the city, under mine.</p>\n<p>And on page two, in a box, a short note from the editors. It said that six years before, the paper had published a correction to a story by Iola Barnett about forged documents at Carrow House. It said that the correction had been wrong. It said that the paper regretted it, and apologized to Ms. Barnett and to her source.</p>\n<p>It was eleven lines long. The correction, six years ago, had been longer than some of my stories. I counted the lines in the apology twice, at the kitchen table, at six in the morning, in my bathrobe, with the paper spread out in front of me and a cup of coffee going cold at my elbow.</p>\n<p>Eleven.</p>\n<p>I didn't know whether to laugh or cry, so I did both, for a while, by myself, before Freda woke up.</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda took a copy to Mrs. Dunleavy. She asked to. She took the bus to Frederick on the Monday, with the paper in a plastic sleeve so it wouldn't get creased, and sat in Kevin Dunleavy's front room while his mother read the whole thing, every word, with a magnifying glass, sitting very upright in her chair.</p>\n<p>\"She read it twice,\" Freda reported that night. \"Then she said, <em>I told Petrakis that man upstairs was up to something. He never listened.</em> Then she made me take a cookie.\" Freda paused. \"Then she asked if Mr. Hale was the one who figured out the car. Because she'd liked the sound of him, when Freda told her. I said yes. She said, <em>Tell him from me, he's got a good ear for stairs.</em>\"</p>\n<p>Petrakis called on the Tuesday, from his daughter's house in Silver Spring, with the television on. He said he'd read it. He said he'd always known that tenant was a good tenant, except the rent. He said, \"And the cat? The cat is all right?\" and I told him about the family with two little girls, and he was quiet for a moment, and then he said, \"Good. Good. Stupid cat. Nice cat,\" and hung up.</p>\n<p>I got eleven hundred emails that week. Most of them were kind. Some of them were from people who'd written very unkind things about me six years before, and wanted me to know they'd been wrong, which was more than most people do. Three of them were offers of work. Real work. I didn't answer any of them yet.</p>\n<p>Bookbinder called on the Sunday night, from the valley, after it ran. He didn't say anything for a while. Then he said, \"They spelled it right,\" and I said I'd checked, three times, and he laughed, a small, startled laugh, as if he'd forgotten he could.</p>\n<p class=\"break\">&#10043;</p>\n<p>And on the Monday, the regular money came. The six thousand, for the Thursday before, as it had come every Monday since January.</p>\n<p>But this time something was wrong with it.</p>\n<p>I wouldn't have noticed, a year ago. I'd have looked at the amount and closed the app. But I'd spent a year with a man who noticed eleven eggs instead of twelve, and I'd learned to look at the edges of things. And at the bottom of the deposit, where the bank shows you who sent it, where for ten months it had said only the name of the law firm, <em>Aldine, Mercer and Voss</em>, and once, in May, the name of a bank in another city, there was a longer line than usual. Somebody, somewhere, in some office, had made a mistake, and sent it from the wrong account, and the bank had printed the whole thing.</p>\n<p><em>ORIG: TRUSTEES OF THE HALLORAN FUND (EST. 1938) / HARTFORD CT / FBO A M &amp; V CLIENT ACCT.</em></p>\n<p>I sat and looked at it for a long time.</p>\n<p>Then I did what I do. I looked it up. And it was real. The Halloran Fund was a charitable trust, registered in Connecticut, established in 1938. Its purpose, according to the one filing I could find, a single page from the 1950s scanned into the state's archive, was <em>the support of historical inquiry and the preservation of testimony</em>. Its trustees were a bank in Hartford. It had no website. It had never, as far as I could find, given a single grant to anybody.</p>\n<p>Except me. For ten months.</p>\n<p>1938. Eighty-nine years ago. Before the war.</p>\n<p>I didn't know what it meant. I still don't. But it was real, and it held up, and it was the first true thing I'd ever learned about the man who sent me the cards, apart from the shaking in his hand. Somebody, eighty-nine years ago, had set up a fund to preserve testimony. And the testimony it had been waiting for, all that time, was being told on a porch in Adams County, Pennsylvania, every Thursday, to me.</p>\n<p>I wrote it in my notebook. <em>Halloran Fund. Est. 1938. Hartford. \"Preservation of testimony.\"</em> And underneath, because it was the only honest thing I could think of: <em>Waiting since before the war. For what?</em></p>\n<p class=\"break\">&#10043;</p>\n<p>And one more thing, that week, because I'd promised myself.</p>\n<p>On the Wednesday, the eighteenth, I spent the afternoon looking for a line in a box in a library. The way he'd told me to. <em>Find it.</em></p>\n<p>The Clinton Papers are at the William L. Clements Library, at the University of Michigan. Hundreds of volumes of them. Every letter, every report, every scrap of paper that crossed Sir Henry Clinton's desk in the whole war, bound into big books and numbered. I couldn't go to Michigan. But the library has a guide, a long, dry, wonderful list, volume by volume, of what's in each one, written by archivists over many years. I read it for four hours. Volume after volume. Spies, deserters, returns of troops, complaints about firewood.</p>\n<p>And there, in volume eighty-seven, among the papers for the last days of February and the first days of March 1780, in the plain flat language of an archivist cataloguing a box, there was a line.</p>\n<p><em>British deserter caught and turned in by three African Americans.</em></p>\n<p>That's all. Three of them, no names, in a line in a guide to a box in a library in Michigan. The archivist had used a modern word, the polite word of our own time, for whatever word the officer had written by his lantern at Kingsbridge on a cold night in 1780. But it was there.</p>\n<p>He'd told me in June. I'd found it in August. It had taken me four hours, and I'd known exactly what I was looking for, and where.</p>\n<p>I turned to the back of my notebook, to the last page. The one I write on only when he tells me something before I find it. And I wrote it down, and dated it, the way I do.</p>\n<p>Then I closed the notebook, and sat at the kitchen table in the late afternoon with my hand flat on the cover. And thought about a big good-tempered wagoner called Isaac, who'd bought a hat with his shilling, and worn it till he died.</p>", "audio": true, "added": 1791141477431, "pt": [1791225670814, 1791141477431, 1791141477431, 1791141477431, 1791225670814, 1791141477431, 1791141477431, 1791225670814, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791225670814, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791225670814, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791225670814, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431, 1791141477431]}, {"num": 26, "title": "A Certain Woman", "extra": false, "html": "<p>On the Thursday, I brought him the paper.</p>\n<p>Not a copy off the internet. The real thing, the Sunday paper, the whole heavy fat front section of it, folded under my arm. I'd bought six at the gas station on the Sunday morning, at five, when the bundles came off the truck, and the man behind the counter had looked at me as if I'd lost my mind, and I'd told him I had a story in it, and he'd said, \"Well, congratulations,\" and given me a free coffee.</p>\n<p>He was at the bottom of the steps. Of course he was. Freda didn't wait for me. She was out of the car before I'd turned off the engine, with a copy of her own, the one she'd kept back from Mrs. Dunleavy's, and she held it out to him across the gravel with both hands, the way you'd hand somebody a baby.</p>\n<p>He took it. He didn't open it. He held it, and looked at the front page, above the fold, at the headline and the two names under it, for a very long time. Then he looked at me.</p>\n<p>\"They spelled his right?\" he said.</p>\n<p>\"Three times,\" I said. \"I checked.\"</p>\n<p>\"Of course you did,\" he said, and folded the paper carefully under his arm, the way I'd been carrying mine, and went up the steps with it, one hand on the rail.</p>\n<p class=\"break\">&#10043;</p>\n<p>He read the whole thing on the porch, every word, slowly, with his glasses on, while Freda and I sat and watched him and the recorders sat on the little table, not running yet. It took him half an hour. When he'd finished he turned to page two, and read the box, the eleven lines, twice. Then he took his glasses off and folded the paper and put it on the bench beside him, on top of the cardigan, and laid his hand flat on it.</p>\n<p>\"Eleven,\" he said.</p>\n<p>\"I know.\"</p>\n<p>He looked at me, and then he laughed, and it was the laugh that made him hold the rail. Freda started laughing too, without knowing why, and then I did, and the three of us sat on that porch in the August heat laughing at the number eleven until Freda had to put her head down on her knees.</p>\n<p>\"Mrs. Dunleavy says you've got a good ear for stairs,\" Freda said, when she could.</p>\n<p>He wiped his eyes.</p>\n<p>\"Tell her,\" he said, \"that I learned it from her.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I said the date into the recorders. <em>Session forty-three. Thursday, August nineteenth.</em> And then, because I'd promised myself, before we started, I told him about the money.</p>\n<p>The deposit on the Monday, with the wrong account on it. <em>Trustees of the Halloran Fund, established 1938, Hartford.</em> The single scanned page from the 1950s. <em>The support of historical inquiry and the preservation of testimony.</em> Eighty-nine years.</p>\n<p>He'd been looking at the field while I talked. When I said <em>1938</em>, he didn't move. Nothing in his face moved at all. I'd learned what that meant, that year. I'd watched it at the Carpathia card, and at Damon's letter. It's what his face does when it's decided to do nothing.</p>\n<p>\"1938,\" he said, after a while. Quietly. To the field.</p>\n<p>\"Does it mean something?\"</p>\n<p>\"It was a good year to start waiting,\" he said. \"If you knew what was coming.\" He turned and looked at me, and his face had come back. \"Write it down, Ms. Barnett. You were right to. It's true, and it's the first true thing, and he didn't mean you to have it.\" He picked up his glass of water. \"Which means somebody in a bank in Hartford is having a very bad week. Leave it there for now. It'll keep. It's kept eighty-nine years.\"</p>\n<p>And then he wouldn't say anything else about it. I didn't ask twice. I'd learned that, too.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"And I found it,\" I said. \"The line. The three Black men.\"</p>\n<p>He went very still.</p>\n<p>\"In the guide to the Clinton Papers,\" I said. \"Volume eighty-seven. The last days of February and the first of March, 1780. <em>British deserter caught and turned in by three African Americans.</em> That's how the archivist wrote it. It took me four hours.\"</p>\n<p>I opened my notebook to the last page, the one I keep, the one with nothing crossed out. And I read it to him. All three entries. Ned Hurly in the Point Lookout register, from the winter. Lowell Hatch in the <em>Tribune</em>, from the spring. And the new one.</p>\n<p>When I'd finished, he didn't say anything for a long time. He was looking at the field, and his hands were folded on his knee, and they weren't quite steady.</p>\n<p>\"Isaac would be pleased,\" he said at last. \"He'd want to know if they'd spelled him right.\" He smiled, a little. \"They didn't spell any of us. That's all right. That's how it was. We knew who we were.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>\"You said next week,\" I said. \"Last week. You said this would be the last one.\"</p>\n<p>\"I did.\"</p>\n<p>\"Did you tell DeLancey? About her?\"</p>\n<p>He didn't answer straight away. He looked at Freda, on the top step, and she looked back at him, and something passed between them that I wasn't part of, and didn't mind not being part of.</p>\n<p>\"I'll tell you exactly what I told him,\" he said. \"And then I'll tell you why. And then you can decide what you think, the way you always do.\"</p>\n<p>He folded his hands.</p>\n<p>\"Yes,\" he said.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>January 1781</em></p>\n<p class=\"tape\">DeLancey sent for me at the beginning of January, as the year turned, the way a man calls in his accounts.</p>\n<p class=\"tape\">He wanted to know what I'd found. All of it. The whole year. He'd had my reports, in bits, as they came, through Beckwith and Robinson and Andr\u00e9, and now Andr\u00e9 was dead and he wanted it all in one place, laid out on Andr\u00e9's long table, so he could see it. So I gave it to him. The paper, and the ink that answered only to its own key. The carter, without his face. The road along the north shore, fifty-five miles. Setauket. The boat, and the man who came over in it, whose name everybody knew. The officer in Connecticut who took the letters at the other end. The man in the city, a gentleman of business, without his name, because I didn't know it, and without his shop, because I did.</p>\n<p class=\"tape\">And then DeLancey asked the question I'd known he'd ask. Because he wasn't a fool.</p>\n<p class=\"tape\">\"And in Setauket?\" he said. \"Where does the boat take them up? From whom?\"</p>\n<p class=\"tape\">I'd lain awake three nights over that question, Ms. Barnett. Freda. In the shed by the North River, with my eyes shut and her face on every page.</p>\n<p class=\"tape\">\"At or near a certain woman's, sir,\" I said.</p>\n<p class=\"tape\">He looked up.</p>\n<p class=\"tape\">\"Which woman?\"</p>\n<p class=\"tape\">\"I don't know, sir,\" I said.</p>\n<p class=\"tape\">I had to give him something, or he'd have sent a man who'd look harder than I had. So I gave him Setauket, which he had already, and a woman, and there are a great many women in Setauket. No face. No cart. I sent him looking fifty-five miles from the ferry stairs.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"You lied,\" Freda said.</p>\n<p>\"I lied,\" he said. \"To his face. Across Andr\u00e9's table. The only time in that whole two years I ever lied to any of them about anything that mattered.\" He looked at her. \"And I'd do it again. I'd do it every time.\"</p>\n<p>\"Why?\"</p>\n<p>He was quiet for a long time. A long time. The bees went in the clover. Somewhere down the gravel road a car went by, slowly, and the dust drifted across the field, and settled.</p>\n<p>\"Because I knew what they'd do,\" he said finally. \"DeLancey would have had her taken on the Island, and brought to the city, and put in the Provost, and asked. And she wouldn't have told them anything, any more than my ferryman did. And then he'd have had to decide what to do with her. And he'd have done what they did with Andr\u00e9.\" He turned his cup on the table, a quarter turn. \"I'd have put her in a coat that hanged her. I'd promised myself, on the White Plains road, that I'd never do that to anybody again. Not even them. Not even her.\"</p>\n<p>\"That's not all,\" I said.</p>\n<p>He looked at me.</p>\n<p>\"No,\" he said. \"That's not all. You're right.\" He looked back at the field. \"She'd beaten me, Ms. Barnett. Fairly. Every morning for a year and a half, at the top of the only road, in front of everybody, in plain sight, with a basket of eggs. She'd beaten the best I had, and I'd had the best eyes that ever lived, and she'd done it by standing where I stood. At the edge of the room. Where nobody looks.\" He was quiet. \"If I'd given them her face, I'd have taught them to look there. At the edge. At the woman with the cart and the man holding the horse and the carpenter mending the fence. They'd never once looked at us, that whole war. That was the only safety any of us had.\" He looked at Freda. \"If I'd taught them to look at her, the next people they looked at would have been Prince. And Isaac. And me.\"</p>\n<p>Freda had her arms round her knees again.</p>\n<p>\"So you let her go,\" she said. \"For you. Again.\"</p>\n<p>\"For all of us,\" he said. \"Again.\" And then, gently, \"And for her. Because she was the best I ever saw. And I didn't want to be the man who caught her.\" He picked up his glass and found it empty and set it down. \"I've never once been sorry. Not once, in all the years since. I've been sorry about nearly everything else.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>\"The line,\" I said. \"In my notebook. From the research I did, for the Facts. There's a British agent's letter, from February of 1781, to DeLancey. It says the letters come <em>by the way of Setauket, where a certain Brewster receives them at, or near, a certain woman's.</em>\"</p>\n<p>He smiled. Slowly.</p>\n<p>\"That was a man in Connecticut,\" he said. \"A double agent of sorts, called Heron, who sold the British news and sold the rebels news and was never quite sure himself which side he was on. DeLancey sent him what I'd said, and asked him to find out more, from the other side. And Heron wrote back in February and told him exactly what I'd told him, in my own words, as if he'd found it out himself.\" He shook his head. \"A certain woman's. I recognized it the moment DeLancey read it to me. That was the closest the British ever came, in the whole war, to the woman with the eggs. Two words. Mine.\"</p>\n<p>\"And nobody ever found her.\"</p>\n<p>\"Nobody ever found her,\" he said. \"I looked, myself. Afterward. In every record there is. There's no Widow Ames. Not in New York, not in Setauket, not anywhere. She was never caught, and never named, and never written down, except once as a number in a letter, and once as two words of mine in somebody else's.\" He looked at me. \"Three hundred and fifty-five. Lady. That's all anybody will ever know about her. That's all she ever wanted anybody to know.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He told the rest quickly. He said it was his story, not the war's, and that the war's ending was in every book.</p>\n<p>The war went on another year. In October of 1781, at Yorktown, in Virginia, Cornwallis surrendered his whole army to Washington and the French, and that was the end, though nobody in New York would believe it for a long time. The British held the city for two more years while the diplomats talked in Paris. And in the treaty they signed, there was a line that said the British would leave without <em>carrying away any Negroes or other property of the American inhabitants</em>.</p>\n<p>\"Property,\" he said. \"That was us. In the treaty. Between the cattle and the furniture.\"</p>\n<p>In May of 1783, Washington came to meet the new British commander, Sir Guy Carleton, at a village near the Hudson, to arrange the handing over of the city. And to ask for his property back. Including the people who had run from Mount Vernon, his own household, who were in New York.</p>\n<p>\"It was Tappan,\" he said. \"Orangetown, the letters call it, after the township it sits in. The same village. I've always thought that was something. The same village where they hanged Andr\u00e9, three years before.\" He looked at the field. \"Carleton said no. He said the men and women who'd come in on the King's proclamations were free before the treaty was ever signed, and that handing them back would be, I'll give you his words, <em>a dishonourable violation of the public faith</em>. He said the King's promise would be kept. And he wrote down all our names in a book, every one of us, with our ages and where we'd come from and who'd owned us, so that if Britain was ever found to be wrong, the owners could be paid for us instead.\"</p>\n<p>\"The Book of Negroes,\" I said. I'd read about it, for the Facts.</p>\n<p>\"Three thousand names,\" he said. \"Mine's in it. Not Caesar Freeman. The clerk wrote something else, and I let him, by then. I won't tell you what. You'd find it in an afternoon, and I'd like one thing in that whole life left that you didn't.\"</p>\n<p>And each of them was given a certificate, he said, signed on behalf of the new Commandant of the city, General Birch. The same Birch who'd led the cavalry over the crusted snow toward Morristown, that February, and sent up the five rockets, and turned round. <em>This is to certify,</em> the certificates said, <em>that the Bearer hereof, a Negro, resorted to the British Lines, in consequence of the Proclamations of Sir William Howe, and Sir Henry Clinton.</em> And that he had permission to go to Nova Scotia, or wherever else he might think proper.</p>\n<p>\"Any occupation which he shall think proper,\" he said. \"Wherever else he may think proper. They never could bring themselves to say the word. But they kept the promise.\" He rubbed his thumb along the folded edge of the newspaper beside him. \"I've never decided how I feel about that either.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>\"Where did you go?\" Freda said.</p>\n<p>\"Nova Scotia,\" he said. \"In the summer of '83. On a ship full of people with certificates in their pockets. With Prince, and Isaac, and Isaac's hat.\" He smiled. \"It was colder than the Hard Winter. The land they gave us was rock and spruce and fog, and they gave it late, and less of it than they'd promised, and some of us never got any at all. We built a town there and named it after Birch, because his name was on our papers. Prince built half of it. He finally got to build something.\"</p>\n<p>\"And then?\"</p>\n<p>\"And then, nine years later, a man called Thomas Peters, who'd been a sergeant in the Black Pioneers, went to London and talked his way into the government and came back with ships. And twelve hundred of us went with him, in fifteen ships, out of Halifax harbor in January, across the whole Atlantic, to Africa. To Sierra Leone. To build a town of our own, where nobody owned anybody.\" He looked at the field. \"We called it Freetown. Caesar Freeman went to Freetown. I thought that was rather good, at the time.\"</p>\n<p>\"Is that where you...\"</p>\n<p>\"The second year,\" he said. \"Of fever. A great many of us did. I was forty-three, and free, and I'd built my own house with Prince, with a door that shut.\" He looked down at his hands. \"And Caesar's eyes went with him. Everything I saw after that, in the lives since, I've had to remember the ordinary way. Badly.
