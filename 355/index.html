 With the edges worn off.\" He looked at Freda, and then at me. \"Except the two of you. I'll remember the two of you the ordinary way. And I find that I don't mind at all.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>The card came on the Wednesday after. The twenty-fifth.</p>\n<p>By courier, at a quarter to nine at night, the same young man in the same reflective jacket. \"Evening, Ms. Barnett.\" The tablet for my finger. The envelope. \"Have a good one.\"</p>\n<p>Freda was at the kitchen table, with her school supplies spread out in front of her, labeling folders, because school started on the Monday and she'd decided, this year, to be organized, which I didn't expect to last. She looked up when I came back with the envelope. She put the label maker down.</p>\n<p>One card. Heavy cream paper.</p>\n<p>I could barely read it. The hand was worse. Much worse. The letters were very large, as if somebody had been holding the pen close to the paper and close to his eyes, and they leaned and wandered and came apart, and in one place the pen had gone right through the card.</p>\n<p>It took me a long time.</p>\n<p><em>Please ask him about the war. The second one. All of it.</em></p>\n<p>Freda read it upside down. Then she looked at me.</p>\n<p>\"All of it,\" she said.</p>\n<p class=\"break\">&#10043;</p>\n<p>I read it to him on the porch, on the Thursday. The last Thursday of August. The light was already different, the way it gets at the end of summer, lower and more golden, with the long shadows coming early across the field. I said the date into the recorders before anything else, because I'd promised myself I would, this time. <em>Session forty-four. Thursday, August twenty-sixth.</em></p>\n<p>I gave him the card first, before the words, the way I always do now. He held it in the sun for a long time and looked at the hand. He touched the place where the pen had gone through.</p>\n<p>\"He's very near the end,\" he said quietly. \"He's asking for all of it because he knows there isn't time to ask for it a piece at a time.\" He looked up at me. \"He's right. There isn't.\"</p>\n<p>Then he read the words.</p>\n<p>I watched his face. Eleven seconds, the first card. Forty, at the Carpathia. A slow smile, at New York. This time it was none of those. This time his face did something I'd never seen it do before, in a whole year of watching it. It got older. All at once, in the sun, in front of me. As if every one of the years he'd lived had come and sat down on him together.</p>\n<p>\"All of it,\" he said.</p>\n<p>\"Were you there?\" I said. \"In the war. The second one.\"</p>\n<p>He laughed. It wasn't much of a laugh. It was mostly breath.</p>\n<p>\"Several times,\" he said.</p>\n<p>I didn't understand. And then I did, and I felt it go down my arms.</p>\n<p>\"Several...\"</p>\n<p>\"It was a long war, Ms. Barnett. Six years. Seventy million people died in it. Some of them were me.\" He set the card down on the bench beside him, face up, very gently, the way he'd set down the New York card in the spring. \"And not always on the same side.\"</p>\n<p>Freda, on the top step, had gone completely still.</p>\n<p>He looked out at the field. The swallows were going over it low, in long curves, the way they do at the end of August, feeding before they leave.</p>\n<p>\"I'd like to ask you for two small things,\" he said, still watching them. \"And I'd like you not to ask me why. Not today.\"</p>\n<p>\"All right.\"</p>\n<p>\"Don't ever change your email. Or your telephone number. People do, these days, every few years, for no reason at all. Don't.\"</p>\n<p>I almost laughed. It was such an old man's thing to ask. \"I've had the same number for eighteen years.\"</p>\n<p>\"Keep it for eighteen more.\" He turned his head and looked at me, and he wasn't smiling. \"And the second thing. If you ever get a letter, or one of those emails, from somebody you don't know, from anywhere, however young they sound, and it starts with the number of a session, read it to the end.\"</p>\n<p>\"Which session?\"</p>\n<p>\"The last one we had,\" he said. \"Whichever that turns out to be. You'll know it. You write them all down.\"</p>\n<p>Freda had turned round on the step and was looking at him. He didn't look at her. He looked at me until I nodded. Then he looked back out at the field, and the swallows, and the long gold light going across it toward the trees.</p>\n<p>\"Bring a bigger notebook,\" he said.</p>\n<p class=\"break\">&#10043;</p>\n<p><em>End of Book Three</em></p>", "audio": true, "added": 1791141610545, "pt": [1791225670814, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791146243217, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791225670814, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791225670814, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791146243217, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791225670814, 1791141610545, 1791141610545, 1791141610545, 1791225670814, 1791225670814, 1791141610545, 1791141610545, 1791141610545, 1791146243217, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791225670814, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791225670814, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791166065183, 1791166065183, 1791166065183, 1791166065183, 1791166065183, 1791166065183, 1791166065183, 1791166065183, 1791141610545, 1791141610545]}, {"num": 27, "title": "Facts", "extra": true, "html": "<p>The British took New York in September 1776 and held it for seven years, until November 25, 1783. Days after they marched in, a fire burned something like a quarter of the town, Trinity Church with it. People lived in the cellars of the burned houses under old sails. They called it Canvas Town.</p>\n<p>On June 7, 1779, the British commandant of New York, Major General Daniel Jones, ordered that \"All Negroes that fly from the Enemy's Country are Free.\" Three weeks later Sir Henry Clinton's Philipsburg Proclamation promised any runaway from a rebel master \"full Security to follow within these Lines, any Occupation which he shall think proper.\" It never uses the word free.</p>\n<p>The winter of 1779 to 1780 was the hardest anyone on that coast had recorded. New York harbor froze. Men, sleighs, cavalry and, by one account, the heaviest cannon crossed the ice to Staten Island and New Jersey. The city needed about six hundred cords of firewood a week and at times had seventy. The Chief Justice wrote that \"We often hear of the Deaths of the Poor, frozen in their Houses.\"</p>\n<p>On the night of January 14, 1780, some three thousand Americans crossed the ice in sleighs to attack Staten Island. Deserters had warned the British commander, Brigadier Thomas Stirling, and his men were inside their forts. The Americans spent two freezing nights in the open, and about five hundred were frostbitten. On February 10, three hundred British cavalry set out across New Jersey to seize George Washington at Morristown. A crust of frozen sleet cut the horses' legs, and after five or six miles their commander, Lieutenant Colonel Samuel Birch, sent up five rockets and turned back.</p>\n<p>The William L. Clements Library's guide to the Clinton Papers describes an item from the end of February 1780 as a \"British deserter caught and turned in by three African Americans.\" The words are the catalog's. No names are given.</p>\n<p>Washington's spies in New York, the Culper Ring, wrote in an invisible \"sympathetic stain\" made by Dr. James Jay, which showed only when brushed with a second liquid. They hid their letters among blank sheets of writing paper and used a codebook of numbers. 711 was Washington. 727 was New York. 355 was the word \"lady.\" It appears once, in a letter of August 15, 1779, from Abraham Woodhull of Setauket: \"by the assistance of a 355 of my acquaintance, shall be able to out wit them all.\" The day before, the Royal Gazette had announced that John Hill, inspector at the Brooklyn ferry, would examine everyone crossing. The lady in that line has never been conclusively identified. Some historians have suggested Anna Strong, a Setauket neighbor of Woodhull's; others think the evidence too thin to name anyone.</p>\n<p>The ring's man in the city was Robert Townsend, a merchant. In April 1780 he refused to keep writing, and on May 19 Washington wrote that \"the intercourse may be dropped.\" It started again in July, when the French landed at Newport. On July 20, 1780, Woodhull, sick in bed, sent the city's news to the boat with a note: \"let not an hour pass: for this day must not be lost.\" It was not the first warning to reach Newport. Townsend's part in the ring was proved only in 1930, when the historian Morton Pennypacker had his handwriting matched to the letters.</p>\n<p>Benedict Arnold, commanding West Point, wrote to the British for more than a year in a cipher of page, line and word, and asked twenty thousand pounds for the fort. Major John Andr\u00e9, Clinton's adjutant general, went up the Hudson on the sloop Vulture to meet him on the night of September 21, 1780. At dawn American guns drove the Vulture downriver. Arnold sent Andr\u00e9 back by land, in a civilian coat, with papers in his stockings. On the morning of September 23, near Tarrytown, three militiamen stopped him. He told them he was a British officer.</p>\n<p>The last canto of Andr\u00e9's comic poem \"The Cow-Chace,\" about General Wayne's failed attack on a Loyalist blockhouse, was printed in New York on September 23, the day he was taken.</p>\n<p>On September 30, an American officer at a supper at Paulus Hook hinted that Andr\u00e9 would be freed if Arnold were given up. Clinton's answer, as it was remembered, was that \"a deserter was never given up.\" Andr\u00e9 was hanged at Tappan at noon on October 2, 1780. He asked to be shot. He tied the handkerchief over his own eyes and asked those present to bear witness that he met his fate like a brave man. In New York every British officer wore cr\u00eape. Two weeks later Townsend wrote: \"I never felt more sensibly for the death of a person whom I knew only by sight, and had heard converse, than I did for Major Andr\u00e9.\"</p>\n<p>On October 20, 1780, Washington approved a plan to kidnap Arnold from New York and bring him back \"alive.\" Sergeant Major John Champe of Lee's Legion deserted that night, swam to a British galley and enlisted in Arnold's own regiment. The plan, according to his commander's memoir, failed because Arnold changed his quarters the day before. Champe sailed with Arnold for Virginia in December and slipped back to his own side there.</p>\n<p>In May 1783, at Orangetown, the village where Andr\u00e9 was hanged, Washington met Sir Guy Carleton to arrange the British departure. Carleton refused to return the Black men and women who had come in under the proclamations, calling it \"a dishonourable violation of the public faith.\" He recorded about three thousand of them in a ledger now called the Book of Negroes, which also lists people still enslaved to departing Loyalists. A joint board heard claims from American owners, and a few people were handed back. Most of those who had come in under the proclamations were given a certificate \"By Order of Brigadier General Birch,\" the same Birch who had sent up the rockets.</p>\n<p>Most of them went to Nova Scotia, where they founded Birchtown. In January 1792 about twelve hundred sailed from Halifax in fifteen ships for Sierra Leone, led in part by Thomas Peters, once a sergeant in the Black Pioneers, and founded Freetown.</p>\n<p>Britain passed the act ending slavery in its empire in 1833. The United States ended it in 1865.</p>", "audio": true, "added": 1791141610545, "pt": [1791141610545, 1791141610545, 1791141610545, 1791148080125, 1791148080125, 1791146243217, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791146243217, 1791141610545, 1791141610545]}, {"num": 28, "title": "Iola's Notebook", "extra": true, "html": "<p><em>The last page of my notebook. I write on it only when he tells me something before I find it. Nothing on it gets crossed out. If I turn out to be wrong, I write that underneath.</em></p>\n<p><em>What he knew before I did</em></p>\n<p><strong>1.</strong> <em>Session 7.</em> Pvt. E. Hurly, \"Ned.\" Point Lookout register: <em>Hurly, E. Pvt.,</em> d. Feb. 6, 1865, chr. diarrhoea. It's on the microfilm. Anyone with an afternoon could find it. BUT he told me the clerks spelled it three ways before I looked, and when I held back the date, he gave it to me. Not proof. Keeping the page anyway.</p>\n<p><strong>2.</strong> <em>Session 23.</em> Lowell Hatch. <em>New-York Tribune,</em> Sat. Apr. 20, 1912, p. 7, bottom of <em>Incidents of the Rescue Ship's Voyage.</em> Three lines. Most of a day, reading columns by eye, because the search can't read the small print. I didn't choose the Carpathia. The client did, on a card, in February. He had one week between the card and the first Thursday in March. Possible. Not likely. Brown suit, two fingers, \"Good boy.\" Nobody builds that from three lines. <em>I don't know that.</em></p>\n<p><em>Session 24.</em> Read it to him on the porch. He says he never looked. \"I didn't want to see how short it was.\"</p>\n<p><strong>3.</strong> <em>Session 33.</em> A deserter, a British corporal with a book of drawings of the posts, caught on the last of the ice at Kingsbridge at the end of February 1780 by three Black men. Caesar, Prince, Isaac. He said there was a line about it somewhere in Clinton's papers, with no names in it. Found it on Aug. 18: the William L. Clements Library's guide to the Henry Clinton Papers, vol. 87, papers of Feb. 27 to Mar. 3, 1780: <em>British deserter caught and turned in by three African Americans.</em> Four hours, and I knew what I was looking for and where. The words are the archivist's, not the officer's. I haven't seen the page itself. No names. He said there wouldn't be. Not proof. Anyone could find it, if they knew to look. He knew to look in June.</p>\n<p><em>Session 43.</em> Read it to him on the porch. \"Isaac would be pleased.\" They didn't spell any of them, he says, and that's all right. \"We knew who we were.\"</p>", "audio": true, "added": 1791141610545, "pt": [1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791141610545, 1791225670814]}];

  $("toHome").onclick = () => cover();

function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter${c.extra ? " extra" : ""}">
    <header><div class="num">${c.extra ? "" : "Chapter " + c.num}</div><h2>${c.title}</h2>${c.audio ? `<button class="listen" id="listenBtn">&#9654;&#xFE0E;&nbsp; Listen</button>` : ""}</header>
    <div id="fixbarSlot"></div>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  markFixes(c);
  listenHook(c, next);
  $("where").textContent = c.extra ? c.title : `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}

  if (aCh !== c.num) { player.classList.remove("on"); lastPara = -1; }
  hookC = c.audio ? c : null; hookNext = next;
  resume.classList.toggle("on", !!hookC && !player.classList.contains("on") && aCh === c.num);
  const b = $("listenBtn");
  if (b) b.onclick = () => startListen(c, next);
  if (aCh === c.num) aNext = next;
}
async function startListen(c, next, fromStart) {
  if (aCh !== c.num) {
    aCh = c.num; aNext = next; lastPara = -1;
    const nn = String(c.num).padStart(2, "0");
    try { aMarks = (await (await fetch(`audio/ch${nn}.json?v=${BUILD}`)).json()).paras; } catch (e) { aMarks = []; }
    audio.src = `audio/ch${nn}.mp3?v=${BUILD}`;
    const saved = store.get("listen", null);
    audio.currentTime = !fromStart && saved && saved.ch === c.num ? saved.t : 0;
  }
  aFollow = true;
  player.classList.add("on");
  resume.classList.remove("on");
  audio.play();
}
audio.addEventListener("play", () => $("pPlay").innerHTML = "&#10074;&#10074;");
audio.addEventListener("pause", () => $("pPlay").innerHTML = "&#9654;&#xFE0E;");
audio.addEventListener("timeupdate", () => {
  const t = audio.currentTime;
  $("pTime").textContent = `${fmtT(t)} / ${fmtT(audio.duration || 0)}  \u00b7  ${AUDIO_V}`;
  store.set("listen", { ch: aCh, t });
  let i = -1;
  for (let k = 0; k < aMarks.length; k++) if (aMarks[k] <= t + 0.1) i = k; else break;
  const ps = paraEls();
  if (i !== lastPara) {
    lastPara = i;
    ps.forEach(p => p.classList.remove("reading"));
    if (ps[i]) ps[i].classList.add("reading");
  }
  const p = ps[i];
  if (!p) return;
  // Follow the reading: after a hand scroll, pick it up again by itself after a few seconds of no touching.
  if (!aFollow && Date.now() - touchedAt > 6000) aFollow = true;
  if (aFollow) {
    const r = p.getBoundingClientRect(), vh = window.visualViewport ? visualViewport.height : innerHeight;
    const bottom = vh - (player.classList.contains("on") ? player.offsetHeight : 0) - 16;   // the audio bar covers the bottom
    if (r.bottom < 70 || r.top > bottom) {
      window.scrollTo(0, window.scrollY + r.top - vh * 0.3);              // lost entirely (a jump, a new chapter): bring it back
    } else {
      // Only nudge: keep the line being read (estimated from how far through the paragraph the audio is) just above the bar.
      const next = i + 1 < aMarks.length ? aMarks[i + 1] : (audio.duration || t);
      const frac = Math.min(1, Math.max(0, (t - aMarks[i]) / Math.max(0.1, next - aMarks[i])));
      const y = r.top + frac * r.height + 32;
      if (y > bottom) window.scrollBy({ top: y - bottom, behavior: "smooth" });
    }
  }
});
audio.addEventListener("ended", () => {
  store.set("listen", { ch: aCh, t: 0 });
  if (aNext && aNext.audio) { const n = aNext; aCh = null; go(n.num, 0); startListen(n, CHAPTERS[CHAPTERS.indexOf(n) + 1], true); }
  else player.classList.remove("on");
});
$("pPlay").onclick = () => audio.paused ? (aFollow = true, audio.play()) : audio.pause();
$("pBack").onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 15);
$("pFwd").onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
$("pStop").onclick = () => { audio.pause(); player.classList.remove("on"); paraEls().forEach(p => p.classList.remove("reading")); lastPara = -1;
  if (hookC) resume.classList.add("on"); };
resume.onclick = () => { if (hookC) startListen(hookC, hookNext); };
// scrolling by hand stops the page from following until play is pressed again
let touchedAt = 0;
window.addEventListener("touchmove", () => { if (!audio.paused) { aFollow = false; touchedAt = Date.now(); } }, { passive: true });
window.addEventListener("wheel", () => { if (!audio.paused) { aFollow = false; touchedAt = Date.now(); } }, { passive: true });


// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });


// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
// Book 3 keeps its notes apart: same key, "-355" on the end. A reader who opened Book 1 with ?c= is already signed in here.
const CKEY = (() => { let k = store.get("ckey", null); if (!k) { try { k = JSON.parse(localStorage.getItem("wyl.ckey")); } catch {} } return k ? k + "-355" : null; })();
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}
function openCmt(ch, p, text) {
  if (staleV) { showStale(); return; }
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");
  $("cmtText").value = ""; $("cmtStatus").textContent = "";
  renderOld();
  $("cmt").classList.add("open");
}
$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString(), v: BUILD };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// ---- fixed since you last looked (pencil readers only) ----
// Each paragraph carries the build time its text last changed (c.pt). "seen" is, per chapter,
// the newest change the reader has acknowledged. A chapter they've never opened is NEW.
// "seen" is kept per review round, so starting a round (or moving it back) shows its boxes fresh on every device.
const SEEN_KEY = "seen-" + ROUND;
function seenAt(num) { return store.get(SEEN_KEY, {})[num] || ROUND - 1; }
function setSeen(num, t) { const s = store.get(SEEN_KEY, {}); s[num] = Math.max(s[num] || 0, t); store.set(SEEN_KEY, s); }
function isFix(c, t) { return t >= ROUND && t > Math.max(seenAt(c.num), c.added); }
function fixCount(c) { return c.pt.filter(t => isFix(c, t)).length; }
function isNew(c) { return c.added > seenAt(c.num); }
function badge(c) {
  if (!CKEY) return "";
  if (isNew(c)) return `<span class="tag new">New</span>`;
  const n = fixCount(c);
  return n ? `<span class="tag">${n} fixed</span>` : "";
}
function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">${c.extra ? c.title : "Ch " + c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => isFix(c, c.pt[i]));
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} changed in the latest round of fixes, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
</body>
</html>
