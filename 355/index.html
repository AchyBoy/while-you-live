 do.\"</p>\n<p>\"She's been unbearable all week.\"</p>\n<p>\"Good. She's earned a week.\" He drank some tea. \"And you haven't gone.\"</p>\n<p>\"No. I wanted to ask you how.\"</p>\n<p>He thought about it. Outside it was clear and hot and very still, and the bees were loud in the clover at the edge of the yard.</p>\n<p>\"Go where she works,\" he said. \"Not where she lives. People are braver at their work. Their hands know what they're doing, even when the rest of them doesn't. And don't go as a reporter. Go as a woman who wants to ask her one question.\" He set his cup down. \"And not this week. Let her have one more week of not knowing anybody's looking. You'll need her to have had it.\"</p>\n<p>I didn't understand that. I wrote it down anyway.</p>\n<p>\"Now,\" he said. \"Spring. Beckwith had lost his ice, and he wanted something to show for it.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>March 1780</em></p>\n<p class=\"tape\">When the ice went out of the harbor, the letters started moving again. We knew because the deserters told us.</p>\n<p class=\"tape\">Not in so many words. But every deserter who came in from Jersey that spring was questioned at headquarters, and some of them had been servants to rebel officers, and grooms and cooks, and they'd heard things at their officers' tables. And what they'd heard, more than once, was that General Washington knew what was happening in New York. Which regiments had gone south with Clinton and which were still in the city. How many cords of wood were left in the yards. When a fleet was fitting out. Not quickly. Weeks late, sometimes. But he knew.</p>\n<p class=\"tape\">Beckwith had me in his office in the second week of March, with the window open for the first time since December and the noise of the slips coming in with the smell of the river, and he was angry. Not with me. He was angry the way a man is when he's done everything right and it hasn't worked.</p>\n<p class=\"tape\">\"Hill finds nothing,\" he said. \"Seven months at that table. He's opened four thousand letters. He's turned out every basket on Long Island. He's made half the farmers in Kings County stand in their stockings. Nothing.\" He pushed a paper across the table at me, face down; I suppose he'd forgotten I couldn't read. \"We've had the letters held to the fire. We've had them washed with every acid the surgeons have got. Nothing comes up. They're letters about butter. About cousins. About the price of salt. And Washington is still getting his news.\"</p>\n<p class=\"tape\">\"Then it isn't in the letters, sir.\"</p>\n<p class=\"tape\">\"I've thought of that,\" he said, sharply.</p>\n<p class=\"tape\">\"Yes, sir. I meant something else.\" I thought about how to say it. \"Mr. Hill looks at what a man's carrying. He opens it and reads it. If it says nothing, he gives it back. So whatever's carrying the news has got to be something a man can carry openly, that Mr. Hill will look at and give straight back. Something that says nothing, on its face.\" I paused. \"There's nothing that says less than a blank sheet of paper.\"</p>\n<p class=\"tape\">Beckwith looked at me.</p>\n<p class=\"tape\">\"You've had letters held to the fire, sir,\" I said, \"and nothing came up. So it's an ink that doesn't answer to fire. Or to the surgeons' acids. Only to its own key. A man would need to carry a little bottle of the key with him, wherever the letter was going. And he'd need to write on paper that didn't look written on.\" I stopped. \"If I were doing it, I'd write on a clean sheet, and put the sheet in the middle of a quire of clean sheets, and carry the quire to the country as if I'd bought it for somebody, in a basket, with the tea and sugar. And Mr. Hill would riffle through it and see twenty-four sheets of good paper, and put it back in the basket.\"</p>\n<p class=\"tape\">There was a long silence. Somewhere down at the slips a man was shouting at a horse.</p>\n<p class=\"tape\">\"And how,\" Beckwith said, slowly, \"would the man at the other end know which of the twenty-four?\"</p>\n<p class=\"tape\">\"He'd know because they'd agreed it. The fourth sheet. The one with a pinprick in the corner. The one folded a certain way.\" I shrugged. \"Or he wouldn't, and he'd have to try every sheet with his bottle. Which would waste a great deal of his bottle.\"</p>\n<p class=\"tape\">I didn't know then, of course, how right that was. I've read their letters since. A good many of them, Ms. Barnett, are two frightened men complaining to each other that they've run out of the key, and can't read what's been sent, and can't get more. One of them wrote, once, that he'd sent three blank sheets instead of one, for fear of sending the wrong one. I laughed out loud in a library when I read that. A librarian asked me to leave.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">So I went looking for paper.</p>\n<p class=\"tape\">It's a strange thing to hunt, a sheet of blank paper. But paper wasn't cheap in New York in 1780. Most of it came from England, across the sea, in war time, and it cost a good deal, and people who bought it were people who wrote. Merchants. Clerks. Officers. Lawyers. Not farmers. Not carters. A Long Island farmer might buy a few sheets in a year, to write to a cousin or settle a debt. He didn't buy it by the quire.</p>\n<p class=\"tape\">There were perhaps a dozen shops in the city that sold good writing paper. Stationers. Printers. A few dry goods merchants who kept it among the cloth and the tea. I couldn't go into any of them and ask who'd been buying paper, of course. A Black man asking a merchant about his customers would have been thrown out at best, and reported at worst, and the man I was looking for would have heard about it by supper. But I didn't need to ask. I only needed to stand outside, at the right hour, holding somebody's horse, or carrying somebody's parcel, or sitting on the step of the next house with my hat over my eyes. Nobody looks at a Black man sitting on a step in New York. I'd learned that much.</p>\n<p class=\"tape\">I watched what came out of those shops, and where it went, for three weeks.</p>\n<p class=\"tape\">And I watched the ferry. That was the end of every road east. Everything that went to Long Island went over the ferry, and everything that went over the ferry went past me, sooner or later, if I stood at the top of the stairs long enough. I stood there a great deal, that March. The widow had her cart back at the top of the stairs as soon as the ice was gone, with her eggs and her butter and her little iron pot of coals for the cold mornings. I bought eggs from her twice a week, as I had before, and put them inside my shirt, and stood and watched the people waiting for the boat. She had eleven, one of those mornings. I remember thinking she'd had a slow week. I didn't buy any that day. I had enough.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The carter came on a Tuesday.</p>\n<p class=\"tape\">He wasn't anybody. That was what caught me. A Long Island man, about thirty, broad and quiet, with a good wagon and a good gray horse, who carted goods between the city and the north shore of the Island for anybody who'd pay him, every week or two. Butter and cheese and firewood in. Rum and sugar and nutmeg and cloth out. There were twenty men doing the same thing. He was a carpenter by trade, the boatmen said, a joiner, and cart work paid better in a war. I'd seen him a dozen times and never once thought about him.</p>\n<p class=\"tape\">But the week before, I'd seen him come out of a dry goods shop with his hands full, and put a parcel in his wagon. And the parcel was the right size and the right shape and the right weight for a quire of good paper, wrapped in brown paper and tied with string. And now here he was at the ferry with his wagon, and the parcel was in among the sugar. I crossed on the same boat, and when Hill's men turned his load over at the Brooklyn landing, they found the parcel and opened it, and riffled through twenty-four sheets of good clean writing paper, and asked him what a carter wanted with all that, and he said it was for a gentleman in Setauket who'd asked him to get it, and had paid for it, and would want it.</p>\n<p class=\"tape\">And they gave it back to him. Of course they did. It was paper.</p>\n<p class=\"tape\">Setauket. A village of a few hundred people on the north shore of Long Island, fifty-five miles from the city, a long day's ride, with a harbor that faced straight across the Sound at Connecticut. Where, as it happened, the rebels had a whaleboat officer called Brewster who came over in the dark with armed crews to raid the Loyalist farms and carry off whatever he could, and who'd been born there, and was known to every soul in the place.</p>\n<p class=\"tape\">It wasn't proof. It was a parcel. But I'd watched the ferry for eight months by then, and I knew every carter on that road, and none of the others had ever carried paper out to the country. Not once.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I went to Beckwith with it. Not with the carter's face. With the road.</p>\n<p class=\"tape\">I drew it for him on his own map with my finger, since I couldn't be seen to write. A man in the city, a man of business, who could buy good paper without anyone wondering, writes his news in an ink that only answers to its own key, on one sheet of a quire. A carter takes the quire out with his load, over the ferry, past Mr. Hill, along the north shore, fifty-five miles, to Setauket. Somebody in Setauket opens it, and finds the right sheet, and reads it, and adds his own news of the Island. And on an agreed night a whaleboat comes over from Connecticut, twenty miles, in the dark, and takes it back across the Sound, and a dragoon rides it to Washington.</p>\n<p class=\"tape\">\"Five men,\" I said. \"Perhaps six. The man in the city. The carter. The man in Setauket. The boat. The officer in Connecticut who gets it at the other end. And the man in the city has never once set foot outside it, so far as anyone knows. He's not on the road. He's never searched. He's a gentleman. He goes about his business. He keeps a shop, or a counting house, or a desk, and he listens, and he writes it down at night.\"</p>\n<p class=\"tape\">Beckwith was silent for a long time, looking at my finger on his map.</p>\n<p class=\"tape\">\"And his name?\" he said, at last.</p>\n<p class=\"tape\">\"I don't know it, sir.\"</p>\n<p class=\"tape\">\"The carter's?\"</p>\n<p class=\"tape\">I'd known the question was coming. I'd thought about it, walking up from the slips, all the way to his door. If I gave him the carter's face, he'd have the carter taken at the ferry the next time he came over, and searched to the skin, and the quire held to every flame in the city, and nothing would come up, because the ink only answered to its own key. And the carter would say the paper was for a gentleman in Setauket, which was true. And they'd let him go, eventually, or hang him on suspicion, and the man in the city would hear of it before the day was out, and cut the road, and start another one I didn't know about.</p>\n<p class=\"tape\">You don't pull up the first root you find, Ms. Barnett. You find out where it goes.</p>\n<p class=\"tape\">\"I'd know his horse anywhere, sir,\" I said. \"I don't know his name. And I don't think you want him yet. If you take him, they'll only find another carter. I think you want the road to feel watched. Every mile of it.\" I took my finger off the map. \"I think you want them frightened.\"</p>\n<p class=\"tape\">He looked up at me then, the long cool look, and I saw him think about all the reasons a man in my position might not want to give him a name. Then I saw him decide that the one I'd given was the true one, which it was. Mostly.</p>\n<p class=\"tape\">\"Frightened,\" Beckwith said. He picked up his pen. \"Yes. I think I can frighten Setauket.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped and looked out of the window. The bees were still going in the clover. A car went by on the gravel road, slowly, raising a long plume of white dust that hung in the still air and drifted across the field and settled.</p>\n<p>\"Mostly?\" I said.</p>\n<p>He turned back.</p>\n<p>\"You said it was the true reason. Mostly.\"</p>\n<p>He smiled a little.</p>\n<p>\"I didn't want to give anybody a face,\" he said. \"Not yet. I'd seen what happened to faces in that city. I'd given one at Young's House, to Norton's adjutant, and it had been the man who owned me, and I'd spent it getting him exchanged. I'd given the corporal at Kingsbridge, and the fever had him.\" He turned his cup on the table, a quarter turn. \"The carter whistled when he drove, and he gave his horse half his bread. I wanted to be sure. That's all. I wanted to be quite sure, before I gave anybody a face.\"</p>\n<p>\"And were you? Sure?\"</p>\n<p>\"Oh, yes,\" he said. \"He was one of them. He rode that road for them for two more years. Nobody ever took him.\" He looked at me. \"And I never gave anybody his face, Ms. Barnett. Not that spring and not ever. You can write that down too. Next week I'll tell you what I did instead.\"</p>\n<p>I wrote it. <em>Never gave the carter's face.</em> And then I sat looking at what I'd written, and at the word <em>frightened</em> a few lines above it, and I understood, or thought I did, that the hunt he was about to tell me about wasn't going to be the kind where somebody gets caught.</p>", "audio": true, "added": 1791137942844, "pt": [1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791225670814, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791225670814, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791225670814, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791137942844, 1791225670814, 1791137942844, 1791137942844, 1791137942844]}, {"num": 12, "title": "Shutting the Road", "extra": false, "html": "<p>The week he'd told me to wait was the longest week of the summer.</p>\n<p>I didn't go to Purcellville. I didn't drive past the practice, which I'd found on the map, a long low barn with green trim on a road outside town, with a gravel lot and a sign with a jumping horse on it. I didn't call. I didn't look at the horse rescue's website more than twice a day. I wrote nine hundred words about a dentist's new chair and a thousand about seamless gutters, and I took Freda to buy a dress for her friend's sister's wedding, and I didn't sleep very well.</p>\n<p>On the Thursday it was ninety-one degrees by eleven, and the porch was in full sun, and he'd moved us to the kitchen with the fan going and the shades half down. I said the date into the recorders, <em>session thirty-five, Thursday, June twenty-fourth</em>, and he said, before I could ask, \"Next week. Go next week,\" and I let out a breath I hadn't known I was holding.</p>\n<p>\"Now,\" he said. \"Frightening Setauket.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 1780</em></p>\n<p class=\"tape\">It's easy to frighten people in a war. Anybody can do it. You burn a barn, you hang a man at a crossroads, you send a troop of horse galloping through a village at midnight. People are frightened. And then they get used to it, the way people get used to anything, and in a month they're doing exactly what they were doing before, only angrier.</p>\n<p class=\"tape\">That wasn't the kind of frightened I meant.</p>\n<p class=\"tape\">I wanted them frightened the way you're frightened when you realize somebody's been reading your letters. Not by noise. By quiet. By the sense, slowly, at every step of the road, that somebody had been there first, and was being very polite about it.</p>\n<p class=\"tape\">So we did small things. Beckwith did most of them. He had the authority and the men, and he was cleverer at this than he looked, once he understood what I meant. I just told him where.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The first thing was the paper.</p>\n<p class=\"tape\">An officer from the Commandant's office, a polite young lieutenant with a writing board and a cold, went round the shops in the city that sold good writing paper. All of them. Stationers, printers, the dry goods men who kept a few quires among the cloth. He told each of them the same thing, pleasantly. That because of the war, and the shortage of paper, and certain irregularities that had come to the notice of headquarters, the Commandant would be grateful to know, from now on, the name of anybody who bought writing paper by the quire or the ream to carry out of the city. Purely for the record. Nothing more. He wrote the shopkeeper's name on his writing board, thanked him, and left.</p>\n<p class=\"tape\">That was all. He didn't search anything. He didn't threaten anybody. He went to fourteen shops in two days, and in every one of them, he left behind a man who now knew that the army had begun to wonder about paper.</p>\n<p class=\"tape\">In one of them, I knew, he'd left behind a man who'd gone very white indeed after the door closed. I didn't know which one. I've worked it out since.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The second thing was the road.</p>\n<p class=\"tape\">Fifty-five miles from the ferry to Setauket, along the north shore of the Island, through Jamaica and Flushing and Hempstead, through a dozen villages, past a hundred farms. Most of that country was quartered with the King's troops that spring, one regiment or another, Loyalists mostly, in winter quarters. And the men who rode that road with anything to hide knew every post on it. Which taverns the officers drank in. Which bridges had a guard. Where you could ride through a village at dusk and nobody would look up.</p>\n<p class=\"tape\">Beckwith changed it. Not much. A sentry where there hadn't been one, at a bridge near Huntington. A picket moved half a mile down the road from where everybody knew it was. A troop of the Seventeenth Dragoons riding out along the north shore on an exercise, through Setauket and out the other side, and back again three days later, for no reason anybody could see. A deserter's story, let slip on purpose in a Jamaica tavern by one of Beckwith's men, that headquarters had a list of names on the north shore. There was no list. There didn't need to be.</p>\n<p class=\"tape\">And a rumor. That was the best of them, and half of it was mine. It had started on its own, in the winter. A quartermaster's clerk on the north shore had been asked to look into the forage at Setauket, and how many cords of wood the village could furnish, and he'd asked about it, loudly, at every farm, and by the middle of March the farmers were telling each other that two whole regiments were to be put into winter quarters in Setauket itself, next season. Two regiments, in a village of a few hundred people. Every house with soldiers in the kitchen. Every barn with an officer's horse in it. Every cove on the harbor with a sentry. It wasn't decided. Nobody had decided it. All I did was make sure it didn't die. A word in a Jamaica tavern. A question from a dragoon at a Setauket well. The same clerk, sent back in April to count the barns again.</p>\n<p class=\"tape\">I read the letter, a long time afterward, that their man in Setauket wrote in the middle of March, when the rumor was still new. Two regiments, he told Tallmadge, were to be stationed there. And then: <em>If it should take place it will I fear entirely ruin our correspondence.</em></p>\n<p class=\"tape\">I can't tell you how I felt when I read that. Two hundred years later, in a library, in a reading room, with my gloves on. I hadn't started that fear. But I'd sat in a cold office with my finger on a map and made sure it lasted all spring.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The third thing was the carter.</p>\n<p class=\"tape\">I never gave him to anybody. I told you that. But I didn't leave him alone either.</p>\n<p class=\"tape\">On a morning in April I was at the Brooklyn landing, on the far side of the ferry, by Hill's table, when his wagon came off the boat from the city with his good gray horse in the shafts. Hill's men turned his load over, as they did everybody's: sugar, a cask of rum, a bolt of blue cloth, the usual. No paper, that morning. And while they did it, I went and stood at the gray horse's head.</p>\n<p class=\"tape\">I didn't say anything to the carter. I didn't look at him. I looked at the horse. I put my hand on its neck and stroked it, slowly, the way Caesar had stroked horses all his life, and the horse leaned into my hand the way horses always leaned into Caesar's. And I said, to the horse, not loudly, \"Good horse. You go to Setauket a great deal, don't you? Every week or two. Good long road, that.\"</p>\n<p class=\"tape\">Then I took my hand away and went back to Hill's table and stood there with my arms folded, watching the boat go back across the river.</p>\n<p class=\"tape\">The carter didn't move for a long moment. Then he got up on his wagon and drove off up the Brooklyn road, not fast, not slow, whistling, like any man on any morning. But I'd watched his hands on the reins while I stroked his horse, and they'd gone white at the knuckles. And he wasn't whistling a tune. He was whistling one note, over and over, the way a man does when he's forgotten what tune he meant to whistle.</p>\n<p class=\"tape\">He came back over the ferry eleven days later. No paper. And the next time, three weeks after that, no paper. And the next.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The paper stopped in the middle of April.</p>\n<p class=\"tape\">I didn't know why. I didn't know anything then except what I could see from the ferry: that the carter still came, with his rum and his sugar and his nutmeg, but never again that spring with a parcel the shape of a quire. That the rumors about Setauket went round the north shore and came back to us bigger. That the dragoons rode out and rode back. That the polite lieutenant's writing board had fourteen names on it and not one purchase of paper by the quire.</p>\n<p class=\"tape\">And that the widow at the top of the ferry stairs on the city side had a full dozen eggs in her two rows every morning I passed that May. Every one of them. I noticed it, as I noticed everything. I remember thinking her business must be very bad, and buying an extra two, once or twice, because I felt sorry for her.</p>\n<p class=\"tape\">That's what I could see. Here is what I couldn't, which I learned a long time afterward, reading their own letters, in that library, with my gloves on.</p>\n<p class=\"tape\">The man in the city stopped writing. Their man in Setauket went into New York in the middle of April, as he'd planned, to see him, and found him frightened, and begged him to go on, and got nothing but what he called <em>his utter denial</em>. In May he wrote to Tallmadge that the man in the city <em>declines serving any longer</em>. He'd still talk, if somebody came, he said. But he wouldn't put another word on paper.</p>\n<p class=\"tape\">And on the nineteenth of May, at his headquarters in Jersey, George Washington sat down and wrote to Tallmadge that since the man in the city had <em>totally declined</em>, and the man in Setauket <em>seems to wish to do it</em>, he thought <em>the intercourse may be dropped</em>.</p>\n<p class=\"tape\">Dropped. Washington's own word. His best spies in New York, his only real eyes inside the city, dropped. For two months, from the middle of April to the middle of July, nothing came out of New York to Washington by that road. Not a word. In the spring of 1780, while Clinton was taking Charleston and the war was going worse for the rebels than it ever had or would again.</p>\n<p class=\"tape\">Nobody was hanged. Nobody was arrested. Nobody was searched to the skin or held to a flame. Nobody on the other side ever knew who'd done it. A polite lieutenant had gone round some shops with a writing board, and a troop of horse had ridden through a village and back, and a clerk had asked about firewood, and a Black man had stroked a horse at a ferry landing. And Washington's best spies had stopped writing to him.</p>\n<p class=\"tape\">That was the best work I did in that war, Ms. Barnett. Better than the ice. Better than any of it. I've never been prouder of anything than of the things in that war that nobody ever knew happened.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped, and got up, and went to the window, and lifted the shade an inch with one finger and looked out at the glare.</p>\n<p>I didn't say anything for a while. The fan ticked round on the counter. I had written <em>the intercourse may be dropped</em> in my notebook and drawn a box round it, and I sat looking at the box.</p>\n<p>\"Washington got other news,\" I said finally. \"Didn't he? From somewhere.\"</p>\n<p>\"He did.\" He let the shade fall. \"He opened another road, through Staten Island, with other people. It was slower, and it was worse, and it didn't see what the man in the city saw.\" He came back to the table. \"I'm not going to tell you I won the war that spring. I won a road. That's all. For two months.\" He sat down. \"But I won it without a single person in that whole chain coming to harm. That's rare enough, in any life, that I count them.\"</p>\n<p>\"And the eggs,\" I said.</p>\n<p>He looked at me.</p>\n<p>\"Twelve,\" I said. \"Every time you passed, in May. You said she always had eleven, the morning in January, and the morning in March, and now in May it was twelve. A full dozen.\" I tapped my notebook, where I'd written it, each time, because he'd told me to. \"You told me to write down eleven. You said I'd want it later.\"</p>\n<p>He was quiet for a long time. The fan went round.</p>\n<p>\"Did I,\" he said at last. And then, very gently, \"Keep writing them down, Ms. Barnett. Every time I tell you. That's all I'll say.\"</p>\n<p>I kept looking at him. He kept looking back. And then he smiled, and got up to make more tea, and wouldn't say another word about eggs for the rest of the afternoon, though I gave him four separate chances.</p>", "audio": true, "added": 1791138059495, "pt": [1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791225670814, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791225670814, 1791225670814, 1791225670814, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791225670814, 1791146243217, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791225670814, 1791138059495, 1791138059495, 1791138059495, 1791138059495, 1791225670814, 1791138059495, 1791138059495, 1791146243217, 1791138059495, 1791138059495, 1791138059495]}, {"num": 13, "title": "Claire", "extra": false, "html": "<p>I went on the Tuesday, at the end of June, in the morning, because he'd said people were braver at their work, and vets work mornings.</p>\n<p>It was an hour and a quarter west of my kitchen, out past Leesburg, where the suburbs give up and the country starts all at once, between one traffic light and the next. Rolling fields, white board fences, stone walls, big trees standing alone in pastures with horses in their shade. The kind of country where the mailboxes have names on them instead of numbers. The road to the practice was gravel for the last half mile. The sign at the gate had a jumping horse on it, the same horse as the patch on the fleece, and under it, <em>Catoctin Equine, C. Whitcombe, DVM</em>, and under that, smaller, <em>Emergencies call anytime</em>.</p>\n<p>I sat in the car in the gravel lot for ten minutes with the engine off.</p>\n<p>I'd decided, driving out, what I'd say, and I'd decided it again at every traffic light, and every time it came out differently. In the end I'd decided on the thing he'd told me. Not a reporter. A woman with one question. I'd left my notebook in the car. I'd left both recorders in the car. I had my phone in my pocket, switched off, and nothing in my hands at all, which was the strangest part. I couldn't remember the last time I'd gone to ask somebody a question with nothing in my hands.</p>\n<p class=\"break\">&#10043;</p>\n<p>The barn was long and low, with green trim and a wide center aisle open at both ends so the air could go through, and it smelled the way barns smell, of hay and horse and something medicinal and clean. A radio somewhere was playing country music very quietly. A young woman in breeches came out of an office by the door, with a coffee mug, and asked if she could help me, and I said I was hoping to see Dr. Whitcombe, for a few minutes, about something personal.</p>\n<p>\"She's with a horse,\" the young woman said. \"She'll be a while. You're welcome to wait.\" She looked at my shoes, which were the wrong shoes. \"There's a bench.\"</p>\n<p>There was a bench, by the office door, and I sat on it, and waited.</p>\n<p>Halfway down the aisle, in a stall with the door open, there was a big brown horse standing very still, with his head low, and a woman crouched at his front feet. She had her back to me. I could see the gray coming into short dark hair, and a flannel shirt with the sleeves rolled to the elbows, and her hands on the horse's leg, running down it, slowly, from the knee to the hoof, the way you'd run your hands down a banister in the dark, feeling for a splinter. She had a tool beside her on the straw, a big steel thing like a pair of tongs, and every now and then she picked it up and pressed it, very gently, against a part of the horse's hoof, and watched his face. When he flinched, she said something to him, too low to hear. When he didn't, she moved the tool a little and tried again.</p>\n<p>She didn't hurry. Not once, the whole time. The horse knew it. You could see him know it. He stood for her like a statue.</p>\n<p>I watched her for twenty minutes. I knew already, watching her hands on that horse's leg, that I was going to get this wrong.</p>\n<p class=\"break\">&#10043;</p>\n<p>When she came out of the stall, she was wiping her hands on a towel, and she saw me on the bench and came down the aisle, unhurried, and the young woman with the coffee said, \"Claire, this lady's been waiting to see you,\" and went back into the office.</p>\n<p>\"Hi,\" Claire Whitcombe said. \"What can I do for you?\"</p>\n<p>She was taller than she'd looked in the video. Her face was her mother's, from the obituary photograph, the same wide mouth, but not laughing. A plain, tired, intelligent face, that had been up since five and expected to be up till nine, and wasn't going to waste any of the time in between. She had a smear of something on her cheek. She didn't know it was there.</p>\n<p>\"My name is Iola Barnett,\" I said.</p>\n<p>I'd thought about that, too, in the car. Whether to give her my name. Whether she'd know it. Six years ago my name had been on the front page of a newspaper above a story about her father's employer, and then on a correction underneath it, and then on a great many angry blogs. People who'd never heard of Carrow House knew my name for about a month. People who had, didn't forget it.</p>\n<p>She knew it. I watched it arrive. It didn't arrive in her face. It arrived in her hands, which had been folding the towel, and stopped.</p>\n<p>\"I know who you are,\" she said.</p>\n<p>\"I thought you might.\"</p>\n<p>\"What do you want?\"</p>\n<p>And I could feel it, the way you feel a tide turn under a boat. Everything I'd planned in the car, about being a woman with one question, and being gentle, and going slowly. I could feel her waiting for me to say it, so that she could say no to it and be done. She was already halfway through saying no. She'd been ready for this for six years.</p>\n<p>So I said the question. The only one. The one he'd told me to ask, because nobody had ever asked it.</p>\n<p>\"How long did you wait?\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I'll tell you exactly what happened, because it's the only part I got right.</p>\n<p>She didn't say anything. She didn't move. She stood in the barn aisle with the towel in her hands and the country music playing very quietly somewhere behind her, and she looked at me, and the color went out of her face from the top down, slowly, like water going out of a basin. I've seen that happen to people perhaps three times in my life. The last time had been my editor, the morning the correction ran.</p>\n<p>The horse in the stall behind her shifted his weight and blew out through his nose, a long, soft, rattling breath, and she turned her head toward the sound, the way you'd turn toward a child who'd called you, and I saw her see that he was all right. And then she turned back to me, and her face had closed.</p>\n<p>\"I'd like you to leave,\" she said.</p>\n<p>\"Dr. Whitcombe...\"</p>\n<p>\"I don't know what you're talking about.\" Her voice was very even. \"I don't know what you think you know, or who's been telling you things, but I'm working, and I have a mare to see in Hamilton in forty minutes, and I'd like you to leave my barn. Now, please.\"</p>\n<p>\"I'm not going to write anything,\" I said. \"I don't write anything anymore. I write about gutters. I just want...\"</p>\n<p>\"Now,\" she said. \"Please.\"</p>\n<p>It was the <em>please</em> that did it. It wasn't rude. It was the opposite. It was a woman holding on to the last thing she had, which was her manners, with both hands.</p>\n<p>I took a card out of my pocket. A plain one, with my name and my phone number and nothing else. I'd had them made the week before, for this, because my old cards had the paper's name on them. I held it out. She didn't take it. So I put it down on the bench where I'd been sitting, and stood up, and said, \"I'm sorry for coming to your work,\" and meant it, and walked out of the barn into the sun.</p>\n<p>She didn't call after me. I didn't look back. I got into the car and sat there, and through the open end of the barn I could see her, still standing in the aisle, exactly where I'd left her, with the towel in her hands. She stood there all the time it took me to start the car and turn it round in the gravel. When I pulled out of the gate, she was still there.</p>\n<p class=\"break\">&#10043;</p>\n<p>I drove a mile and then pulled into the gravel at the side of the road, under a big oak in a pasture with three horses standing in its shade, and turned the engine off, and got my notebook out of the glove box, and wrote it all down. Every word she'd said. The towel. The <em>please</em>. The color going out of her face from the top down. The horse breathing, and her turning to it. I wrote for half an hour, the way I used to in the car after an interview, before I forgot anything. When I'd finished, I read it back.</p>\n<p>She hadn't asked what I meant.</p>\n<p>That was the thing I saw, reading it back. I'd come into her barn, a stranger, a woman she knew only from a newspaper six years ago, and asked her how long she'd waited. Not waited for what. Not waited where. And she hadn't asked. She'd said <em>I don't know what you're talking about</em>, which is what everybody says. But she hadn't asked me what I was talking about. She hadn't needed to.</p>\n<p>And I understood, finally, sitting under the oak, what he'd meant the week before. <em>Let her have one more week of not knowing anybody's looking. You'll need her to have had it.</em></p>\n<p>She'd had six years of thinking it was over. Of driving her father to his talks, and putting her hand under his elbow, and parking in loading zones, and not thinking about one Wednesday morning in an alley in Washington more than she could help, at night, every night. And then one more week. One more ordinary week, of horses and mornings and coffee in the office, while a woman she'd never met sat at a kitchen table an hour away, waiting.</p>\n<p>I'd taken that week away from her this morning in a barn aisle with five words. And she would know, now, for the rest of her life, the exact difference between the week before and the week after. Every time she heard an engine idle.</p>\n<p>He'd wanted her to have it. One last ordinary week. He knew I was going to take the six years away from her, and he couldn't stop me, only make me wait.</p>\n<p>I sat under the oak for a long time after that. The three horses in the pasture came over, slowly, one at a time, and put their heads over the fence by the car, and looked at me through the window, and I looked back at them, and none of us said anything.</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda was waiting at the kitchen table when I got home, with the laptop shut and her hands flat on it, which meant she'd been waiting a while.</p>\n<p>\"Well?\"</p>\n<p>\"She asked me to leave.\"</p>\n<p>\"Oh.\" Freda's face fell. \"That's... okay. That's bad.\"</p>\n<p>\"It's not bad,\" I said. I put my bag down. \"She didn't ask what I meant.\"</p>\n<p>Freda looked at me. I watched her think about it. It took her about four seconds.</p>\n<p>\"Oh,\" she said again, differently.</p>\n<p>\"Yes.\"</p>\n<p>\"So it's her.\"</p>\n<p>\"It's her. She was in the car.\" I sat down across from her. \"And she's not going to tell me anything. Not now. Maybe not ever.\" I put my notebook on the table between us. \"And by tonight, or tomorrow, she's going to have told her father that I came. And he's going to call Carrow House, and Carrow House is going to call their lawyers. And in about a week I'm going to get a letter.\"</p>\n<p>Freda put her hand on top of the notebook.</p>\n<p>\"Maybe she won't tell him,\" she said.</p>\n<p>\"Why wouldn't she?\"</p>\n<p>\"Because she didn't ask what you meant,\" Freda said slowly, working it out as she went. \"Because she's been not telling anybody anything for six years. Not even him, maybe. People who don't tell anybody anything don't suddenly start.\" She looked at me. \"I didn't tell you about Dad for seven months. And I didn't tell Dad I hadn't told you. I just didn't tell anybody anything, about any of it. It's easier.\" She took her hand off the notebook. \"It's like a habit.\"</p>\n<p>I looked at my daughter for a long time across the kitchen table.</p>\n<p>\"We'll see,\" I said. \"In a week.\"</p>", "audio": true, "added": 1791138478563, "pt": [1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791225670814, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563, 1791138478563]}, {"num": 14, "title": "Major Andr\u00e9", "extra": false, "html": "<p>\"She didn't ask what you meant,\" he said.</p>\n<p>It was the first thing he said. I'd told him all of it, on the porch, before I'd even said the date into the recorders, standing at the top of the steps with my bag still on my shoulder. The barn, the hoof testers, the towel, the <em>please</em>. He'd listened without moving. And then he said that, and I knew he'd seen it the moment I said it, where I'd needed half an hour under an oak.</p>\n<p>\"No.\"</p>\n<p>\"And there's been no letter.\"</p>\n<p>\"Two days. It's early.\"</p>\n<p>\"There won't be one.\" He moved the cardigan off my chair for me, though it was eighty-five degrees, and I sat. \"She hasn't told him. She'll be deciding whether to, for a while. She'll decide not to. She'll decide it every night.\" He looked out at the field. The hay was all in now, baled and gone, and the field was short and pale and already greening at the roots. \"And one night she'll decide something else. Not because of anything you say. Because you came to her barn and didn't say anything else.\"</p>\n<p>\"How long?\"</p>\n<p>\"I don't know. Longer than you'd like.\" He smiled. \"Say the date, Ms. Barnett. It's July. That's when I met him.\"</p>\n<p><em>Session thirty-six, Thursday, July first.</em></p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>June 1780</em></p>\n<p class=\"tape\">Clinton came home in the middle of June, with Charleston in his pocket.</p>\n<p class=\"tape\">You have to understand what that meant to the city. Charleston was the greatest victory the King's army ever had in that whole war. A rebel army of five thousand men, surrendered, with all its guns and its general, in the biggest city in the South. The bells rang for a day. The Loyalists drank the King's health in every tavern on Queen Street. Rivington printed the surrender terms on the front of the <em>Gazette</em> with a border round them like a wedding notice. For the first time since I'd come into the lines, the city felt like a place that thought it might win.</p>\n<p class=\"tape\">And Major Andr\u00e9 came home with the General, and the whole secret business of the army came home with him.</p>\n<p class=\"tape\">I'd seen him twice before, at a distance, as I've told you.</p>\n<p class=\"tape\">He was too busy to see me for a month, with the General home and a war to restart. It was a morning in the first days of August before Robinson took me to him, at headquarters on the Broadway, at the bottom of the island, a big house with a garden that went down toward the water. Andr\u00e9 had an office on the first floor at the back, looking out over the garden, with a long table under the window covered in papers and maps, and a smaller table to one side with a drawing board on it, and a half-finished pencil sketch pinned to the board of a man in a cocked hat asleep in a chair. I recognized the man. It was one of Clinton's aides. It was very good, and very unkind.</p>\n<p class=\"tape\">Andr\u00e9 was standing at the window with a letter when we came in. He turned round.</p>\n<p class=\"tape\">He was beautiful. I don't know how else to put it. Not in a soft way. He was thirty, slim, not tall, with dark hair tied back and very dark, very bright eyes, and a way of standing that made everybody else in a room look as if they'd been put together in a hurry. His coat was the best-cut coat I saw in that whole war. And he smiled the moment he saw Robinson, a real smile, delighted, and came across the room with his hand out, as if Robinson were the one person in New York he'd been hoping would walk through his door that morning.</p>\n<p class=\"tape\">He made everybody feel like that. I was going to tell you it was a trick. It wasn't. That was the extraordinary thing about him. He meant it every time.</p>\n<p class=\"tape\">\"Colonel,\" he said. \"And this is the famous Freeman.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He knew all about me. Beckwith had written it all down for him, the ice and the deserters and the paper and the road, and he'd read it on the ship coming home, he said, twice, the way he read everything. He'd been in Charleston for six months and come back to find that Beckwith had shut down Washington's best correspondence in his absence, and Beckwith had told him, with the scrupulous honesty that was the best thing about Beckwith, exactly whose idea it had been.</p>\n<p class=\"tape\">\"I don't believe a word of it,\" Andr\u00e9 said cheerfully. \"So I'm going to test you. You don't mind?\"</p>\n<p class=\"tape\">\"No, sir.\"</p>\n<p class=\"tape\">He went to the long table and took a paper off it, and held it up in front of my face, about a foot away, for perhaps two seconds, and took it away again.</p>\n<p class=\"tape\">It was a return. A list of figures. The strength of every British regiment in the southern army, as it had stood at the end of May, regiment by regiment, rank and file, sick and present, with the totals at the bottom.</p>\n<p class=\"tape\">\"Well?\" Andr\u00e9 said.</p>\n<p class=\"tape\">I gave it to him. All of it. Twenty-three regiments and corps, in the order they were written, with every figure in every column, and the totals. It took me about four minutes. A man who can't read can recognize numbers, Ms. Barnett. Lots of men who couldn't read could count, in those days, and knew their figures off a bill. I'd decided, on the way up the stairs, that numbers were safe.</p>\n<p class=\"tape\">Andr\u00e9 listened to the whole thing with the paper in his hand, following it down with his finger. When I'd finished he looked up at Robinson, and then at me, and his eyes were shining.</p>\n<p class=\"tape\">\"That is the most remarkable thing I have ever seen,\" he said. And then, to Robinson, \"He's got the sick wrong in the Seventy-first. Hasn't he? Two hundred and seventy?\"</p>\n<p class=\"tape\">\"Two hundred and ten, sir,\" I said. \"The clerk makes his ones like sevens.\"</p>\n<p class=\"tape\">Andr\u00e9 looked at the paper. He laughed out loud.</p>\n<p class=\"tape\">\"So he has,\" he said. \"So he has.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">That would have been the end of it, if it had been anybody else. It was the end of it for Robinson. He went off to see Clinton about something, and left me there, to be told what Andr\u00e9 wanted done with me.</p>\n<p class=\"tape\">Andr\u00e9 wasn't finished.</p>\n<p class=\"tape\">He was a man who couldn't leave a puzzle alone. It was the thing that made him so good at what he did, and in the end it was the thing that killed him, though neither of us knew that yet. He walked round his drawing table a couple of times with his hands behind his back, looking at the floor. Then he went to a little writing desk in the corner, and picked up a sheet of paper that was covered in his own handwriting, crossed out and written over and crossed out again, and came back and held it up in front of me, the same way, a foot from my face, for two seconds.</p>\n<p class=\"tape\">And I read it. Of course I read it. I couldn't not. That's what reading is, once you can do it; you can't look at words and not read them, any more than you can hear your own name and not turn round.</p>\n<p class=\"tape\">It was a poem. Verses, rhymed, very bad on purpose, about a rebel general called Wayne who'd attacked a Loyalist blockhouse on the Jersey shore late in July and been beaten off, and had consoled himself by stealing the local farmers' cattle. Andr\u00e9 was writing a mock epic about it, for Rivington to print. It was called <em>The Cow-Chace</em>. It was rather funny.</p>\n<p class=\"tape\">He took it away.</p>\n<p class=\"tape\">\"What's the fourth line?\" he said, quite gently.</p>\n<p class=\"tape\">I didn't answer for a long moment. And then I made the only mistake I made with him in all those months.</p>\n<p class=\"tape\">\"<em>And all the cows in Jersey</em>,\" I said.</p>\n<p class=\"tape\">And then I heard myself, and stopped.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He didn't say anything at all for a while. He stood there with the poem in his hand and looked at me, and I looked at the floor, and I thought about the man outside the tavern on Queen Street, the free man born on Long Island, who'd come out of the Provost after six weeks with his papers gone. I thought that I'd spent a year in that city and been careful every single day, every hour, and that it had taken a man who couldn't leave a puzzle alone about two minutes.</p>\n<p class=\"tape\">Then Andr\u00e9 went and shut his office door. Quietly. And came back. And sat down on the edge of his long table, so that his face was lower than mine, which I don't think any white man had done in that body's whole life.</p>\n<p class=\"tape\">\"Where did you learn?\" he said.</p>\n<p class=\"tape\">\"I don't know, sir.\"</p>\n<p class=\"tape\">He smiled. \"That's not true. But I can see why you'd say it.\" He turned the poem over in his hands. \"Does Robinson know?\"</p>\n<p class=\"tape\">\"I think he wonders, sir. I've never told him.\"</p>\n<p class=\"tape\">\"And Beckwith?\"</p>\n<p class=\"tape\">\"No, sir.\"</p>\n<p class=\"tape\">\"Good.\" He put the poem down on the table beside him. \"Then we shan't tell either of them. They're both very fine officers, and neither of them could keep that sort of thing to himself for a week if his life depended on it. Robinson would tell his wife, and Beckwith would put it in a report.\" He looked at me. \"And then it would go round the town, and some Loyalist with a grudge would decide that a reading Black man was a forger, and you'd be in the Provost, and I'd have to waste a great deal of my time getting you out. And I'm very busy.\" He paused. \"So you'll go on not being able to read. And I'll go on not having noticed. And you'll be a great deal more use to me than either of them knows. Is that agreeable?\"</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">\"Then we shall both have a secret, Freeman.\" He stood up, and picked up the poem, and looked at it, and made a face. \"Was the fourth line any good?\"</p>\n<p class=\"tape\">\"No, sir,\" I said. \"It was very bad.\"</p>\n<p class=\"tape\">He laughed so hard he had to sit down again.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. He was smiling, out at the field, the way you smile at something nobody else can see.</p>\n<p>\"That was the once,\" I said. \"You told me someone found out. Once.\"</p>\n<p>\"That was the once.\" He turned the smile on me. \"Nobody else, in that body. Not ever. He kept it to the end.\" He was quiet for a moment. \"You'll want to know whether I liked him. I liked him more than anybody I met in that war. More than Prince, and I loved Prince. Andr\u00e9 was the only man in the British army who ever looked at me as if I might be interesting. Not useful. Interesting. And I've thought, since, that that's a very dangerous thing for a man in my position to be grateful for, and that I was grateful for it anyway, with my whole heart, and that he knew it, and used it.\" He picked up his glass. \"Both of those are true. You don't get to pick.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>August 1780</em></p>\n<p class=\"tape\">He used me, that summer, for the thing he cared about most. And I didn't know whose it was for nearly two months.</p>\n<p class=\"tape\">He never told me. That was the rule of his correspondence, which he'd written down himself in a letter long before, though I didn't see that letter till much later: every messenger was to remain ignorant of what he carried. There was a man, on the other side, an American general, writing to Andr\u00e9 in secret. That was all I knew, that summer. Letters came in from him, by roundabout roads: under flags of truce with other business, with ladies' letters about bonnets and gloves, with exchanged prisoners coming back. The letters were in a cipher made of numbers, three numbers to a word. Page, line, word, out of some big book. I glimpsed one, once, on Andr\u00e9's table, and it stayed with me, the way everything did, and could have read it in a moment if I'd had the book. I didn't have the book. I didn't try to find it. I knew better.</p>\n<p class=\"tape\">What I did was the thing I was good at. I watched the roads the letters came by, and the men who touched them, and made sure nothing leaked.</p>\n<p class=\"tape\">Something did, once, in August. A clerk in the Adjutant General's office, a young Loyalist from Philadelphia with debts, who copied the outsides of letters, the covers and the seals and the names they were addressed to, and sold the copies to a man from Jersey who came into town on market days. He didn't know what was in them. He didn't need to. Somebody on the other side, putting those covers together, week by week, would have seen a pattern in where they went, and who they went to, and when.</p>\n<p class=\"tape\">I saw him do it. I saw him slip a folded paper to the man from Jersey at the Fly Market, between two baskets of peaches, one hot Saturday. I told Andr\u00e9. Andr\u00e9 thanked me, and said nothing more about it. And the next week the clerk was posted to a regiment in Halifax, Nova Scotia, with a good character and no explanation, and the man from Jersey stopped coming to market.</p>\n<p class=\"tape\">Nobody was hanged for it. Andr\u00e9 wasn't a man for hanging people if he could help it. He said once, in my hearing, that a hanged spy was a wasted opportunity, and that he'd much rather have a frightened one. Beckwith had told him what I'd said, I suppose, about frightening Setauket. He'd liked it.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"The general,\" I said. \"The American general writing to Andr\u00e9.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Arnold.\"</p>\n<p>He looked at me for a long moment.</p>\n<p>\"You looked it up,\" he said.</p>\n<p>\"Everybody knows it. It's the one thing everybody knows about that whole war. Benedict Arnold.\"</p>\n<p>\"Everybody knows it now.\" He set his glass down. \"That summer, in all New York, I'd guess a dozen people knew it. Clinton. Andr\u00e9. Beckwith. Robinson. A clergyman called Odell, who decoded for them. Perhaps the General's secretary. I wasn't one of them. I guarded his letters for two months and didn't know whose they were. I worked it out in the end, from a letter about a house. You'll hear it. Not today.\"</p>\n<p>\"Did you like him? Arnold?\"</p>\n<p>\"I never met him,\" he said. \"Not until the end. And then I didn't.\" He looked out at the pale field, at the line of trees beyond it, blue in the heat. \"But I knew what he was doing. Even before I knew who he was. A man selling his own people for money. I knew exactly what that was.\" He looked back at me. \"I'd been sold, Ms. Barnett. In that body. Reynolds bought Caesar for forty pounds from a man in White Plains when he was nineteen. It's in Reynolds's account book, under the cow.\"</p>\n<p>He picked up his glass again, and found it empty, and set it down.</p>\n<p>\"I worked very hard for Andr\u00e9 that summer,\" he said. \"I'd do it again. But I never once, in all of it, stopped knowing it was treason I was guarding.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He was right about the letter.</p>\n<p>I checked the mail every day the rest of that week, and my email every hour, and my phone, which I left switched on, on the kitchen table, face up, all day and all night. I didn't get a letter from Carrow House's lawyers. I didn't get a call. Nobody wrote anything about me on any blog. Nobody came to my door.</p>\n<p>Nothing happened at all. And by the end of the week, I'd understood that nothing happening was the loudest thing that had happened to me all summer.</p>", "audio": true, "added": 1791139385705, "pt": [1791139385705, 1791225670814, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791225670814, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791225670814, 1791225670814, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791225670814, 1791225670814, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791225670814, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791225670814, 1791225670814, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791139385705, 1791225670814, 1791139385705, 1791139385705, 1791139385705, 1791225670814, 1791225670814, 1791225670814, 1791225670814]}, {"num": 15, "title": "Newport", "extra": false, "html": "<p>\"I've told you some of this a little out of order,\" he said, that same Thursday, when he brought the lunch out. \"I'm going to go back two weeks. To the middle of July. Before Andr\u00e9 and I had our secret. Because something happened in those two weeks that I didn't see at the time, and I want you to see it the way I didn't.\"</p>\n<p>He'd made sandwiches, tomato and mayonnaise on the bakery bread, with the first tomatoes from the plant by the back step, and salt and pepper, nothing else. We ate them on the porch, in the shade at the north end, with the plates on our knees. It was too hot to eat anything else. It was too hot, really, to eat that.</p>\n<p>\"Lose a round,\" he said. \"That's what this one is. I want you to have one of those too. It's only fair.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>July 1780</em></p>\n<p class=\"tape\">The French came on the tenth of July.</p>\n<p class=\"tape\">Everybody had known they were coming. The King of France had joined the rebels' war two years before, and sent a fleet once already that had done nothing much, and now he was sending an army: five or six thousand soldiers, real ones, regulars, in white coats, with a squadron of warships to carry them. They came into the harbor of Newport, in Rhode Island, on the tenth and eleventh of July, and landed, and started to dig.</p>\n<p class=\"tape\">Clinton had known they were coming too. He'd planned for it. If he could get his own army up the Sound to Rhode Island fast enough, before the French were dug in, he could fall on them while they were still unloading their tents, and that would very likely be the end of the French army in America before it had fired a shot. He needed two things. He needed the navy, to carry his men and to beat the French squadron. And he needed the French not to know he was coming.</p>\n<p class=\"tape\">He didn't get either. But it was a near thing on the second. That's my part.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The news that the French had landed came to the city on the eighteenth, by a courier from the far end of Long Island. And that same night the whole army began to move.</p>\n<p class=\"tape\">I'd never seen anything like it, in that war. Six thousand men, perhaps more, marching out of their camps and quarters on the island and the Jersey shore and the city itself, all heading east, for the narrows at the top of the East River where the Sound begins, at Whitestone and Throg's Neck, where the transports were coming round to meet them. All the roads full. Every wagon in the city commandeered, every horse. All but a few: the carters who worked the Long Island road for the army's own forage were left their wagons, because the army needed the forage too. I knew which ones. I'd guided half of them. Officers shouting at each other in the dark. And every guide the Quartermaster had on his books called in, to take the columns along the roads that were too small for them.</p>\n<p class=\"tape\">I was one. I spent four days and three nights on horseback, going back and forth along the north shore of the island, between the camps and the landing places, with columns of men behind me. I didn't sleep. Nobody slept. And I didn't stand at the ferry once in all that time, or go to the shops, or near the Setauket road. There wasn't a minute for it.</p>\n<p class=\"tape\">I've thought since that if anybody on the other side had wanted the best possible week to send a letter out of New York, they couldn't have chosen better. Every eye in the British army was looking at the Sound. Including mine.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">On the morning of the twentieth, very early, before it was light, I was sent back into the city with a message for the Quartermaster, and I came down Queen Street to the river just as the sun came up, because it was the quickest way, and I passed the top of the ferry stairs.</p>\n<p class=\"tape\">The widow was there with her cart. Her eggs were on top, in their two rows on the white cloth, and I saw them as I went by, because I saw everything. Eleven. A gap in the front row, where the sixth should have been. I noticed it without noticing it, as I'd noticed it before. I didn't stop. I was on a horse, with a message.</p>\n<p class=\"tape\">And at the bottom of the stairs the first boat of the morning was pushing off for Brooklyn, with half a dozen people in it, and one of them was the carter.</p>\n<p class=\"tape\">I knew his back. I'd have known it anywhere. Broad, in a brown coat, sitting very upright on the thwart. But there was something wrong about him, and I'd ridden fifty yards on along the waterfront before I knew what it was.</p>\n<p class=\"tape\">He didn't have his wagon. He didn't have his good gray horse. He was going over to Long Island in the first boat of the morning with nothing in his hands at all, sitting upright on the thwart like a man in church, and his face, when he turned it to look back at the city, was gray.</p>\n<p class=\"tape\">A carter without a cart. Going home in a hurry, at dawn, with his whole army on the move round him, empty-handed.</p>\n<p class=\"tape\">I knew what it meant. I knew it in my stomach, on that horse, on the waterfront, with the sun coming up over Brooklyn. And I had a message to deliver to the Quartermaster, who would have had me flogged if I'd been an hour late with it, and a column waiting for me at Flushing by noon, and no officer anywhere near me who'd have listened to a guide on a horse telling him that a carter had gone home without his cart.</p>\n<p class=\"tape\">So I delivered the message. And I rode back out to Flushing, and took my column to Whitestone. And I told myself I'd find Beckwith that night and tell him.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I found him the next night. Not that night. There wasn't a minute for it, that night either.</p>\n<p class=\"tape\">I told him about the carter. He listened, in a tent on the shore at Whitestone, with a candle and a hundred papers and men coming in and out every minute. Then he said what I'd known he'd say.</p>\n<p class=\"tape\">\"Then Washington knows. Or will, in two or three days.\" He rubbed his eyes. \"It doesn't signify now. We're past being secret. You can't move six thousand men without every farmer on Long Island knowing it, and every farmer on Long Island has a cousin in Connecticut.\" He looked at me. \"You couldn't have stopped him. You know that.\"</p>\n<p class=\"tape\">\"I could have stopped him at the ferry,\" I said. \"If I'd got off my horse.\"</p>\n<p class=\"tape\">\"And had him searched, and found nothing, and let him go,\" Beckwith said. \"Because there'd have been nothing on him. Would there?\"</p>\n<p class=\"tape\">I thought about it. I thought about him sitting on the thwart with empty hands.</p>\n<p class=\"tape\">\"No, sir,\" I said. \"Nothing on him. It was all in his head. He was going to ride fifty-five miles and say it out loud to somebody.\"</p>\n<p class=\"tape\">\"Then there's your answer.\" Beckwith went back to his papers. \"Get some sleep, Freeman. We start embarking in a day or two, and I'll want you awake.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Here is what had happened. I learned it a long time afterward, reading their letters, in that library, in the reading room with the green lamps.</p>\n<p class=\"tape\">Washington had dropped the man in the city in May, as I've told you. On the eleventh of July, the day after the French landed, he'd written to Tallmadge to start him up again, at once, at any price, because he needed to know what Clinton was going to do. Tallmadge got the letter three days later and went to the Connecticut shore. The boat went over to Setauket. The man in Setauket was sick in bed with a fever. So he sent the carter to the city.</p>\n<p class=\"tape\">And the man in the city was frightened, still. I'd seen to that. But he wasn't too frightened to do it once more, for this. He wrote a letter on the nineteenth or twentieth, in the stain, on a sheet with an ordinary letter on the other side of it, to a well-known Loyalist colonel on Long Island, about some goods the colonel had ordered, so that if the carter was stopped and searched, it would look like the most loyal letter in the world. So I'd been wrong, in Beckwith's tent. There was something on him after all. And then I think he told the carter the rest, out loud, in case the letter was lost. And the carter took a horse at Brooklyn and rode it fifty-five miles in a day. He was back in Setauket on the evening of the twentieth, the man in Setauket wrote, <em>in great haste</em>.</p>\n<p class=\"tape\">The man in Setauket got up out of his sickbed and wrote a covering note and sent it down to the boat with a message I've never forgotten, because it's the most frightened, most urgent thing I've ever read in that whole correspondence. <em>Let not an hour pass,</em> he wrote. <em>For this day must not be lost. You have news of the greatest consequence perhaps that ever happened to your country.</em></p>\n<p class=\"tape\">Eight thousand troops, he said, embarking at Whitestone, for Rhode Island. The fleet sailed. The French had only seven ships of the line.</p>\n<p class=\"tape\">Two days later it was in Tallmadge's hands, and the day after that in Washington's.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped and ate the last corner of his sandwich, slowly.</p>\n<p>\"So they won,\" I said.</p>\n<p>\"They won the round.\" He wiped his fingers on the napkin. \"But I want to be honest with you about what the round was worth, because a great many people since have made it worth a great deal more. They say the man in the city saved the French army. He didn't. Their letter wasn't the first warning. It wasn't even the second. A colonel in a sloop got to Newport half a day ahead of it, with the same news from somebody else. A man in Jersey had told Washington's own aide the day before. That's how it is, in a war. The truth comes in by six doors at once, and afterward everybody claims they opened the one it came through.\"</p>\n<p>\"Then why did Clinton turn back? I read that he turned back.\"</p>\n<p>\"He did. Ten days later. From Huntington Bay, halfway up the Island, with seventy transports full of men.\" He folded the napkin in half. \"Because the navy wouldn't move fast enough, and the admiral and the general hated each other and wouldn't talk, and by the time they'd stopped hating each other long enough to sail, the French had dug in so deep it'd have been murder to go at them. And because Washington, who's the cleverest of them all, marched his whole army down to the Hudson as if he were going to attack New York while Clinton was away. So Clinton came home. That's all.\" He looked at me. \"The man in the city did a brave thing, and got his news through, and it changed nothing at all. Neither did my failing to stop him. Neither of us decided it, that time. The weather mattered, and two old men who couldn't stand each other.\"</p>\n<p>\"So why tell me?\"</p>\n<p>He was quiet.</p>\n<p>\"Because I had it in front of me,\" he said, \"and I didn't see it. The carter on the thwart, with no cart. I saw that. I knew what it meant. But I didn't see the rest of what was in front of me that morning, and I've had every year since to wish I had.\" He folded the napkin again, smaller. \"It was in front of me the whole time, Ms. Barnett. All year. I just didn't look at it, because it was the kind of thing nobody looks at.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I looked down at my notebook.</p>\n<p>I'd written it while he talked, without thinking, the way you write a phone number somebody's reading out to you. <em>July 20. Widow at top of ferry stairs. Eleven.</em> And I'd drawn a circle round the eleven, and I didn't remember doing that either.</p>\n<p>I looked up. He was watching me.</p>\n<p>\"Eleven,\" I said.</p>\n<p>\"Yes.\"</p>\n<p>\"January, eleven. March, eleven. May, twelve, every day. The twentieth of July, the day the carter goes home without his cart, eleven.\" I looked at the circle. \"You said keep writing them down. You said you'd say nothing else.\"</p>\n<p>\"I did say that.\"</p>\n<p>\"Are you going to say anything else?\"</p>\n<p>\"No,\" he said, and smiled, and picked up both our plates, and stood up with his hand on the rail. \"Not yet. It's July. I didn't see it until December.\" He looked down at me. \"You've seen it in July. You're quicker than I was, Ms. Barnett. I'd like you to remember that, when you're feeling slow.\"</p>\n<p>And he went in with the plates, and I sat alone on the north end of the porch, in the heat, with the circle on the page, and the field going pale gold in the afternoon light, and in my head, very clearly, a woman at the top of a flight of stone stairs above a river, at sunrise, setting out her eggs in two rows on a white cloth, counting.</p>", "audio": true, "added": 1791139493684, "pt": [1791225670814, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791225670814, 1791225670814, 1791139493684, 1791139493684, 1791146243217, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791225670814, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791225670814, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791146243217, 1791139493684, 1791139493684, 1791146243217, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791139493684, 1791146243217]}, {"num": 16, "title": "Glover and Hoyt", "extra": false, "html": "<p>Nine days, and nothing from Purcellville.</p>\n<p>I'd stopped checking the mail every hour. I checked it every three. I'd stopped leaving my phone face up on the kitchen table all night and started leaving it face down, which Freda said was worse, because it meant I was pretending. She was right. She was right about most things that summer, and insufferable about all of them, and I'd never liked her more.</p>\n<p>On the Thursday he was waiting for me at the bottom of the porch steps, standing in the shade of the maple by the gravel with his hands in his pockets.</p>\n<p>\"I wanted to see the car come up the road,\" he said, when I asked. \"It's a good thing to see, a car coming up a road. You'll understand later.\" He turned and went up the steps, slowly, one hand on the rail. \"Nothing from her?\"</p>\n<p>\"Nothing.\"</p>\n<p>\"Good.\"</p>\n<p>I said the date, <em>session thirty-seven, Thursday, July eighth</em>, and he settled himself on the bench in the shade with the cardigan beside him and his glass of water on the little table, and looked out at the field.</p>\n<p>\"August,\" he said. \"The ring was back. And this time I knew where the boat came in.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>August 1780</em></p>\n<p class=\"tape\">The road was open again. I'd known it since the twentieth of July, from a carter on a thwart with no cart. And at the beginning of August he had a parcel the shape of a quire again, under his sugar, for the first time since April. He'd been over the ferry and back, and I'd watched him go through Hill's table at the Brooklyn landing, and seen the parcel, and seen Hill's men riffle it and hand it back.</p>\n<p class=\"tape\">I didn't stroke his horse that time. I let him go. I'd frightened that road once, and it had worked, and now it was open again, because Washington needed it more than they were frightened. You can't frighten people twice the same way. The second time, they're ready for it. So I didn't try to close the road again. I went to the other end of it.</p>\n<p class=\"tape\">The boat.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I've told you about Brewster. The rebels' whaleboat officer, born in Setauket, who came over the Sound from Connecticut in the dark with armed crews to raid the Loyalist farms on the north shore. Everybody knew Brewster. He didn't hide. He used his own name, and he fought, and he took Loyalist boats in the Sound and Loyalist cattle off the shore, and the Loyalists on the Island hated him the way you hate weather.</p>\n<p class=\"tape\">What nobody at headquarters had worked out was that Brewster wasn't only raiding. He was collecting the mail.</p>\n<p class=\"tape\">I'd worked it out in the spring, with my finger on Beckwith's map, as I told you. The carter went to Setauket. Somebody in Setauket put it in a boat. There was only one rebel boat that came over to Setauket regularly, and everybody knew its captain's name. So it was Brewster. It had to be. And if it was Brewster, then on the nights the letters went across, Brewster had to come over to the Island and wait. Not raid. Wait. In a cove somewhere near Setauket, in the dark, with his boat drawn up in the reeds, for somebody to come down to the shore with a packet.</p>\n<p class=\"tape\">A raider moves. A man waiting for a letter has to sit still.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">There were Loyalist boatmen on the Island too, of course. Refugees, mostly, men who'd been run out of Connecticut by the rebels, who'd armed boats of their own and fought Brewster's men up and down the Sound for years, a little private war on the water, raid for raid, boat for boat. The two best of them were called Glover and Hoyt. They worked out of Lloyd's Neck, a big hook of land on the north shore with a Loyalist fort on it, halfway between the city and Setauket.</p>\n<p class=\"tape\">I went to see them at the beginning of August, with a pass from Beckwith, on a borrowed horse.</p>\n<p class=\"tape\">They were not men who expected to take advice from anybody, and certainly not from a Black man on a borrowed horse with a paper they couldn't read very well. Glover was small and dark and quick, Hoyt was big and slow and red, and they both looked at me the way Captain Rudd had looked at me in the redoubt on Staten Island. But they listened. They listened because I didn't tell them anything about spies, or letters, or Washington. I told them about Brewster.</p>\n<p class=\"tape\">\"He waits,\" I said. \"Near Setauket. Not every week. Every two or three weeks. He comes over on a dark night and lies up in a cove all next day and goes back the night after, without raiding anything. Have you never wondered what he's doing?\"</p>\n<p class=\"tape\">Hoyt said he'd supposed Brewster was visiting his mother.</p>\n<p class=\"tape\">\"He's waiting for something to be brought down to him,\" I said. \"And while he's waiting, he can't move. He's got to stay where he said he'd be. He's got to be there when they come. That's the only time Brewster's ever in one place for twenty-four hours, with his boat drawn up on the shore and his men asleep in the grass.\"</p>\n<p class=\"tape\">Glover was looking at me differently by then.</p>\n<p class=\"tape\">\"Which cove?\" he said.</p>\n<p class=\"tape\">\"I don't know. One of the ones east of the harbor. Behind the Strong farm, perhaps, on the Neck. There's good cover there.\" I'd never been there. I'd heard a hundred carters and boatmen and farmers at the ferry talk about that shore, for a year, and I'd looked at Beckwith's map till I could see every cove on it. \"And I don't know which night. But it'll be a dark one, near the new moon, when the carter's just come back from the city with a parcel. Watch the carter. When the carter's been to the city, watch the coves. And when you find him, take the boat while they sleep. Push it off. Without a boat he can't carry a letter, and nobody needs to be shot.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They watched.</p>\n<p class=\"tape\">It took them two weeks. And on the seventeenth or eighteenth of August, I don't know the exact night, I wasn't there, they found Brewster lying up near Setauket with his boat, waiting, exactly as I'd said. Waiting for dispatches from the man in the city that hadn't come down to the shore yet.</p>\n<p class=\"tape\">They went at him in the dark. It was a hard little fight, in the reeds and the shallows, the way all those fights on the Sound were. Brewster lost one man taken and one wounded. His men killed one of Glover's on the spot. And Brewster got back into his boat and got away across the Sound to Connecticut in the night, the way he always did, with half his crew and none of his letters.</p>\n<p class=\"tape\">The letters stayed on the Island. The man in the city's dispatches, the first he'd written since he'd started again, were sitting in Setauket waiting for a boat that had just been driven off. Tallmadge wrote to Washington a couple of days later, I read it afterward, that his boatman had been <em>drove from Long Island so suddenly</em> that the dispatches had been left behind. Brewster wrote, in his own letter, which was a very angry letter, that Glover and Hoyt <em>never stayed to bury their dead man</em>.</p>\n<p class=\"tape\">That's true. They didn't. And I never went to look for him, either.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. The bees were in the clover at the edge of the porch again. Somewhere down the road a dog was barking at nothing, on and off, the way they do in the heat.</p>\n<p>\"A man died,\" I said.</p>\n<p>\"A man died. One of ours. One of Glover's crew, a boatman from Stamford whose name I never knew.\" He was quiet. \"I'd told them where to go and when. I hadn't told them to fight. But you don't send armed men at Caleb Brewster in the dark and expect a conversation.\" He looked at his water glass. \"I said I'd tell you my part exactly, no more and no less. That's my part. A man I never met died in a creek on Long Island because I'd worked out that a raider who's waiting for a letter has to sit still.\"</p>\n<p>\"And the letters got through anyway.\"</p>\n<p>\"They got through anyway. A week late.\" He smiled a little, without much in it. \"Brewster came back over at the end of the month and lay up behind the Strong farm again, the same cove, because he was a stubborn man and it was a good cove, and a lieutenant of dragoons went out on foot looking for the Strong family's hounds and walked within gunshot of him. Brewster wrote that the lieutenant <em>begged so hard</em> not to be taken, when they jumped him, that he let him go, because he was too near the house.\" He shook his head. \"That's the Sound, in that war. Everybody knew everybody. Half the time they let each other go.\"</p>\n<p>\"So you lost that round too.\"</p>\n<p>\"No,\" he said. \"No, that one I won. A week is a long time
