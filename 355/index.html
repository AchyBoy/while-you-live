<script>
const BUILD = 1791137567548;
const AUDIO_V = "";
const ROUND = 0;  // only paragraphs changed at or after this build are boxed
const BOOK = {"series": "While You Live", "title": "355", "number": 3, "author": "Andrew F. Young"};
const CHAPTERS = [{"num": 1, "title": "Everybody Was Lying", "extra": false, "html": "<p>I hung the coat up on the Thursday night, as soon as I got home.</p>\n<p>It was the green one. Long wool, a hood that folded into the collar, pockets deep enough for two notebooks and a recorder. I had bought it the winter I was working on the Carrow House story, and taken it out of the closet again in March, because he had told me to bring a warmer coat, and for nine Thursdays I had worn it up and down his porch steps while he told me about the North Atlantic. There was a new button on it now, sewn on by Freda, in a slightly wrong shade of green. There was a receipt in the pocket from a diner that wasn't there anymore. I left the receipt where it was.</p>\n<p><em>You won't need the coat for this one,</em> he had said, from the top of the steps, in his shirtsleeves. <em>It was summer. And everybody was lying.</em></p>\n<p>I put it at the back of the hall closet, behind the vacuum cleaner, and shut the door on it. Then I stood in the hall for a moment with my hand on the knob, because it felt like shutting a door on more than a coat, and I'm not a sentimental person, and I didn't like it.</p>\n<p class=\"break\">&#10043;</p>\n<p>If you don't know me, here is the short version.</p>\n<p>My name is Iola Barnett. I used to be a reporter. Six years ago I broke a story about forged letters being sold as genuine at Carrow House, the old auction house downtown, and three days after it ran, the man who gave me the story disappeared. I called him Bookbinder, in my notebook, and nowhere else. Without him nobody believed a word I'd written. The paper printed a correction and let me go. Since then I've written whatever people pay me to write: gutter guards, dentists, houses that need to sound bigger than they are.</p>\n<p>Last October a law firm wrote to me on behalf of a client who wouldn't give his name. The client wanted me to drive north every Thursday, to a small house on a gravel road in Adams County, Pennsylvania, and record the memories of an old man who lived there alone with a great many books. His name, as far as anybody knew, was Tom Hale. He told me, the first day, that he had been in Washington the night Lincoln was shot. He didn't mean he'd read about it. He meant he had been there, in another body, with his own mind, and that it had happened to him a great many times, in a great many places, and that he didn't know why.</p>\n<p>I didn't believe him. I want to be clear about that. I spent the winter not believing him and checking everything he said, and finding that everything I could check, checked out. Then a card came from the client, in a shaking hand, asking about a ship called the Carpathia, and I spent the spring the same way, only worse, because by then I liked him.</p>\n<p>The client pays six thousand dollars a session. Twice now, when a part of the story was over, he has sent a great deal more. My daughter types the transcripts for fifteen dollars an hour. Her father, who left when she was seven, is back in her life on terms we agreed at this kitchen table, written on the back of a gas bill. He fixed the kitchen tap last weekend. It doesn't drip. I have checked.</p>\n<p>That's where we were, the first week of May. And then the next card came.</p>\n<p class=\"break\">&#10043;</p>\n<p><em>Please ask him about New York. 1780.</em></p>\n<p>Freda had asked me, the night it came, what happened in New York in 1780, and I had said I didn't know. It was true. I knew there had been a war. I knew roughly who won it. I'd been to Yorktown on a school trip and remembered the gift shop better than the battlefield.</p>\n<p>So on the Thursday night, with the coat in the closet and Freda at the kitchen table typing the porch tape, I opened the laptop at the other end of the table and looked it up, the way anybody would.</p>\n<p>New York in 1780, it turned out, was a British city. They had taken it in the summer of 1776, a few weeks after the Declaration, and held it for seven years, until the very end of the war. Washington's army sat out in the hills of New Jersey and up the Hudson, looking at it. The British sat in it, looking back. Most of what happened between them in 1780 happened in the dark.</p>\n<p>\"He said he was on the losing side,\" I said.</p>\n<p>Freda took one side of her headphones off. \"What?\"</p>\n<p>\"Tom. He said he was on the other side of it. The British.\" I scrolled. \"In 1780 they were in New York. The whole city. And he said he spent two years there hunting a spy.\"</p>\n<p>\"So he's a spy now.\"</p>\n<p>\"He said he was hunting one.\"</p>\n<p>\"Same thing.\" She pulled her chair round the corner of the table so she could see my screen, which she has done since she was four, and which I have never once managed to stop. \"Which spy?\"</p>\n<p>I typed <em>spy New York 1780</em> and the internet, which had been waiting all its life for that question, told me.</p>\n<p>There was a ring of them. Washington's own spies, inside British New York, sending him letters across Long Island and over the water in whaleboats. Written in invisible ink, some of them. Coded with numbers. They had a name, the Culper Ring, and a television show, and a great many websites with a great many exclamation marks. And on almost every one of those websites, somewhere near the top, there was a woman.</p>\n<p>\"Agent 355,\" Freda read, over my shoulder. \"A female spy whose real identity has never been discovered.\" She sat back. \"Okay. That's actually cool.\"</p>\n<p>\"It says she was arrested.\"</p>\n<p>\"It says she died on a prison ship.\" Freda leaned in again. \"Having a baby. Oh, that's so sad. Wait.\" She pointed. \"That one says nobody knows if she was arrested at all. And that one says she might not have been a spy, she might have just been, like, somebody's friend.\" She frowned at the screen. \"They can't all be right.\"</p>\n<p>\"No,\" I said. \"They can't.\"</p>\n<p>It is a very particular feeling, reading a story online that everybody tells and nobody has checked. I used to get it in the newsroom, about once a week. The same quote passed from site to site with the same commas in it. The same date, wrong in the same way. Somebody, somewhere, a long time ago, had said a thing, and everybody since had been too pleased with it to look.</p>\n<p>I wrote <em>355</em> in my notebook, and next to it, <em>check.</em> Then I underlined <em>check</em>, which I don't usually do.</p>\n<p class=\"break\">&#10043;</p>\n<p>The other name was easier. Everybody knew the other name.</p>\n<p>Benedict Arnold had been an American general, one of the best they had, a hero. In the summer of 1780 he was given command of West Point, a fortress on the Hudson that both armies thought of as the key to the river. And he had been writing to the British for more than a year, in code, offering to sell it to them.</p>\n<p>The man he wrote to was a young British officer called John Andr\u00e9. In September of 1780 Andr\u00e9 went up the river to meet Arnold in the night and settle the price. On the way back he was stopped on a country road by militiamen, three of them in the usual telling, and they searched him, and found the plans of West Point in his boots. Arnold got away, to the British, and lived a long time, rich and despised. Andr\u00e9 was hanged.</p>\n<p>\"He was thirty,\" Freda said, reading. \"The British guy.\" She scrolled down. \"Everybody liked him. Even Washington's people. It says some of Washington's own officers cried.\" She was quiet for a moment. \"That's weird. Why would you cry over the enemy?\"</p>\n<p>\"Maybe he was very likeable.\"</p>\n<p>\"That's what everybody says about Mr. Hale,\" Freda said, \"and you still check everything he tells you.\"</p>\n<p>I looked at her. She was sixteen, and her father's height, and she had found her father by herself, last fall, with nothing to go on but a postmark and a staff page on a hardware store's website, and not told me for seven months. She checked things too. She had learned it somewhere.</p>\n<p>\"Summer,\" I said. \"He said it was summer.\"</p>\n<p>\"In 1780?\"</p>\n<p>\"When he said I wouldn't need the coat. He said, <em>it was summer, and everybody was lying.</em>\"</p>\n<p>Freda looked at the screen. Arnold, writing his letters. Andr\u00e9, going up the river in the dark. The ring in the city with their invisible ink and their numbers. A woman nobody could name.</p>\n<p>\"Well,\" she said. \"He wasn't wrong.\"</p>\n<p>She put her headphones back on and pulled her chair back round to her own end of the table, and went on typing him. On the porch tape, through the tinny leak of her headphones, I could hear his voice, small and warm and very far away, telling her about a boy who carried bags in a hotel in Manhattan in 1912 and sent his wages home to Liverpool.</p>\n<p class=\"break\">&#10043;</p>\n<p>I didn't sleep much.</p>\n<p>It wasn't the war. I went to bed thinking about the war, and Arnold, and a hanged man the enemy cried over, and I suppose I did think, as I lay there, that it would be strange to hear Tom tell it from the British side, after a winter of hearing him tell Lincoln from the wrong side of that one too. He had a habit, I was beginning to see, of having been where he shouldn't.</p>\n<p>But that wasn't what kept me up. What kept me up was my own notebook, on the kitchen table, under the lamp, where I'd left it open.</p>\n<p>I had written a name in it on Wednesday, in the car, at the bottom of a cul-de-sac in Frederick. Not my source's name. I have never written his name down, not once in eight months of reporting and not in the years since. Another name, a man in a bow tie in the front of an auction catalog, smiling, with his arm around my source's shoulders. Gerald Whitcombe. Director of Conservation and Manuscripts at Carrow House for forty years. My source's teacher. Seventy-nine now, a widower, retired to a stone house on forty acres in the hunt country of Virginia, an hour and a half west of my kitchen table.</p>\n<p>On the morning my source disappeared, six years ago, a woman on the floor below him heard somebody knock on his door, and heard him let them in, and heard a man laugh on the stairs. A big laugh. Too big. She wrote it down in a composition book, because she wrote everything down. And an hour before I wrote that name, in her son's house, with her eyes closed and her small cold hands folded on that composition book, she had listened to Gerald Whitcombe laugh in a video of a talk he gave every spring to a historical society. She said, <em>That's him.</em></p>\n<p>It wasn't proof. It was a laugh. An old woman's memory of a laugh, through a ceiling, six years ago. No lawyer alive would let me print it, and I knew it, and so did Tom. He hadn't said a word about it on the porch except the only thing that mattered.</p>\n<p>That morning, the woman downstairs had heard two people go down the stairs with something heavy, twice. She had heard a car in the alley, and its engine running, a long time, and the doors. Two car doors. Not three.</p>\n<p>Somebody had stayed in the car. Somebody had sat in that alley with the engine running for twenty-seven minutes while two men carried my source's life down the stairs, and then driven them away.</p>\n<p>At one in the morning I got up and went into the kitchen in my socks. Freda's laptop was shut. The house ticked. Out on the street a car went by slowly, the way they do at that hour, and its lights moved across the ceiling and were gone.</p>\n<p>I sat down at the table, under the lamp, and turned to the page with the name on it, and under <em>Gerald Whitcombe</em>, in pencil, I wrote it again, the thing I'd said to Tom on the porch and he had said back to me, smiling.</p>\n<p><em>Who was driving?</em></p>\n<p>Then I sat and looked at it for a long time, in the quiet, in a warm kitchen in May, with the window open a crack and the first moths of the year bumping softly at the screen.</p>", "audio": false, "added": 1791133315293, "pt": [1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791133315293, 1791135016503, 1791133315293, 1791133315293, 1791133315293, 1791133315293]}, {"num": 2, "title": "The Side That Let Me In", "extra": false, "html": "<p>The hay was down in the long field when I drove up on the Thursday, cut and lying in rows to dry, and the whole valley smelled of it with the windows open. I had never been up there in hay weather. In the fall it had been leaves and woodsmoke, and in the spring it had been mud, and now it was this, sweet and heavy and a little like tea, and for the last mile of the gravel road I drove slowly so it would last.</p>\n<p>He was on the porch bench, in his shirtsleeves again, with the cardigan folded beside him out of habit. He didn't need it. It was eighty degrees at eleven in the morning. When he saw the car he raised one hand off the rail, the way he had the week before, and I came up the steps and sat in my chair, and put the two recorders on the little table between us, and he watched me do it with the look he had for small rituals.</p>\n<p>\"You found the coat a good home,\" he said.</p>\n<p>\"Back of the closet. Behind the vacuum.\"</p>\n<p>\"Good.\" He looked out at the field.</p>\n<p>I started both recorders. The red lights came on. \"Session twenty-nine,\" I said to them. \"Thursday, the thirteenth of May.\"</p>\n<p>\"You said it was summer,\" I said.</p>\n<p>\"It was.\"</p>\n<p>\"I looked it up. You said you spent two years in New York hunting a spy. I found the spies. And I found Benedict Arnold, and Major Andr\u00e9, and a lot of websites about a woman called Agent 355.\"</p>\n<p>He turned his head and looked at me, and something happened at the corner of his mouth that wasn't quite a smile.</p>\n<p>\"Did you,\" he said.</p>\n<p>\"They don't agree about her. Some of them say she was arrested and died on a prison ship. Some of them say she had a baby on it. One of them says nobody knows anything about her at all.\"</p>\n<p>\"That one's right.\"</p>\n<p>\"So she was real.\"</p>\n<p>\"There was no Agent 355,\" he said. \"Nobody in that war was ever called that. It was made up a long time afterward, by people who liked the sound of it.\" He settled back against the porch wall. \"Washington's spies wrote to each other in a little code. They had a book of numbers, each number a word, so a letter that fell into the wrong hands would read like a page out of an almanac. Seven hundred and eleven was Washington. Seven hundred and twenty-seven was New York. Three hundred and fifty-five,\" he said, \"was the word <em>lady</em>.\"</p>\n<p>I wrote that down. I wrote it down exactly, and the number, and then I looked at it.</p>\n<p>\"Just lady,\" I said.</p>\n<p>\"Just lady. One of them used it once, in one letter, in August of my first summer there. He wrote that he meant to go into New York, past the men searching everybody at the ferry, <em>by the assistance of a lady of my acquaintance.</em> That's the whole of her. One line. A word in a code book.\" He was quiet a moment. \"Everything else people have said about her since, they made up because one line wasn't enough for them.\"</p>\n<p>\"Was she real?\" I said. \"The lady.\"</p>\n<p>He didn't answer straight away. Down in the field a pair of crows had come down on the hay rows and were walking along them like men inspecting a fence.</p>\n<p>\"Oh, yes,\" he said. \"She was real.\"</p>\n<p>And then he didn't say anything else about her at all, and I knew him well enough by then to know that he wasn't going to, not that day, and that I'd be a fool to push. I put a small mark in the margin next to <em>lady</em>, which is a thing I do when I've been told I'll be told later.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"Why the British?\" I said.</p>\n<p>I'd been carrying it since the porch the week before, and I'd meant to come to it slowly. It came out instead, the way questions do when you've practiced them too much in the car.</p>\n<p>\"I asked you, in the winter, why the Confederate side,\" I said. \"You said you didn't choose. You woke up in a body that was already wearing the uniform. Is that what happened again?\"</p>\n<p>\"No,\" he said. \"Not this time. This time I chose.\"</p>\n<p>\"Why?\"</p>\n<p>\"Because they let me in.\"</p>\n<p>I waited. He looked at me, and I saw him decide something, the way I had seen him decide things all winter: not whether to tell me, I think, but how much it was going to cost to say it plainly, and whether I was going to be worth the cost. Then he folded his hands on his knee.</p>\n<p>\"My name that time was Caesar,\" he said. \"I woke up in him in the winter of 1778, in the dark, in a loft over a barn in Westchester County, north of New York, under a horse blanket, with two other men breathing next to me. He was about twenty-nine years old. He was strong, and he'd been worked hard all his life, and he belonged to a man called Reynolds, who had a farm with good bottom land and a captain's commission in the rebel militia.\" He paused. \"He was owned, Ms. Barnett. That body was owned. That's how I came into that war.\"</p>\n<p>I didn't say anything. I don't think there was anything to say. In the field the crows went up all at once, for no reason I could see, and came down again further along.</p>\n<p>\"You don't have to make a face,\" he said, gently. \"You're thinking of the winter. Of the Keene farm in Maryland, and Damon, who worked it twenty years for nothing and read in secret, fast, when nobody was looking. And now me, here, on the other end of the same thing.\"</p>\n<p>\"Something like that.\"</p>\n<p>\"It's the same thing,\" he said. \"It's exactly the same thing, eighty-five years earlier and two hundred miles north. Slavery wasn't a Southern word yet, in 1778. There were more enslaved people in New York City than in any city in the North. It was everywhere. It was normal. The men who signed the Declaration of Independence owned people while they signed it, some of them, and the men I'd be fighting the next two years were fighting for liberty with their own property waiting at home to bring in the hay.\" He looked at the field. \"Captain Reynolds was a decent man by the measure of his neighbors. He went to church. He didn't beat anybody that I saw. He believed every word of the Declaration. He just didn't think it meant me.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>\"I want to tell you how it felt,\" he said, after a while, \"so that you understand the rest. Not because it's the interesting part. It's not the interesting part. But I'd be lying to you about the whole two years if I skipped it.\"</p>\n<p>\"All right.\"</p>\n<p>\"I've woken up in a great many bodies,\" he said. \"I told you that, the first day. Some of them were rich. Some of them were sick. Some of them were children, which is its own kind of prison. But I had never once, in all of it, woken up as property. As a thing on a list, between the plow and the cow, with a value written next to me in a man's account book.\" He was quiet a moment. \"The first morning, I went out to the barn with the other two men in the dark, and I did the work, because the body knew how, and I watched my own hands do it. And around noon, Reynolds came out of the house with his account book under his arm, to count the hay, and he looked straight at me, and I understood that he wasn't seeing anybody. He was seeing a pair of arms he'd paid for. And I had been, in that life and a hundred others, a man people listened to.\"</p>\n<p>\"What did you do?\"</p>\n<p>\"I did the work,\" he said. \"For six months. I didn't have a choice. The roads were watched by both armies, and by men who weren't in either one, who'd sell a runaway back to his owner for a reward or to somebody else for more. There was nowhere to go. I'd have been dead or sold before I reached the river.\" He turned one hand over on his knee and looked at the palm. \"So I learned. That body knew every road in that county, and every ford, and every farm, and which dogs bit. It knew horses better than I've ever known them in any life since. It knew how to read the ice on a pond from a hundred yards away. Those were his, not mine. He'd learned them from being sent everywhere, all his life, to fetch and carry. And I learned the rest. Who was on which side. Which neighbor was a rebel and which one was only pretending to be, for safety. Where the British lines were, down at Kingsbridge, and how the men who crossed them did it.\"</p>\n<p>\"And then you crossed.\"</p>\n<p>\"In June of 1779,\" he said. \"Because of two pieces of paper.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He told me about the two pieces of paper the way he'd told me about the knots and the coal in the Carpathia's stokehold, in March: slowly, with numbers, as if he wanted me to be able to check every one of them later. Which I did.</p>\n<p>The first was older, and it wasn't even New York's. In November of 1775, at the very beginning of the war, the British governor of Virginia, Lord Dunmore, had promised freedom to any enslaved man who belonged to a rebel and could carry a gun for the King. Only rebels' men, only men who could fight, only in Virginia. But word of it went everywhere. It went up and down the coast in a few weeks, in the way that news goes when the people carrying it can't read and can't be stopped from talking.</p>\n<p>\"Every enslaved man in Westchester knew about Dunmore,\" he said, \"years before I got there. They'd talked about nothing else. And they knew what happened to most of the men who went: they died of smallpox in camps on the Virginia shore. The other two in that loft could tell you the whole story of it, and they did, at night, over and over. It was the only story they had that went anywhere.\"</p>\n<p>The second paper was the one that mattered. In June of 1779, the British commander in New York, Sir Henry Clinton, issued a proclamation from a place called Philipsburg, up the Hudson. He said that any enslaved person who ran away from a rebel master to the British lines would be given full security, inside those lines, to follow any occupation he thought proper.</p>\n<p>\"Full security,\" Tom said. \"To follow any occupation which he shall think proper. I can still say it. I read it over a hundred times, because I wanted to find the word that wasn't in it.\"</p>\n<p>\"Which word?\"</p>\n<p>\"<em>Free</em>,\" he said. \"It isn't there. It never once says free. It says you'll be safe and you can work, which isn't the same thing at all, and a man who reads the way I read could see exactly how much room the King's lawyers had left themselves. It said nothing about Loyalists' people. A man who belonged to a Loyalist could run to the British and be handed straight back. And it said that any Black man taken in arms in the rebel army would be bought from whoever caught him, at a fixed price, like a horse.\" He shook his head slightly. \"It was a careful piece of paper. It was written by men who wanted the rebels' farms emptied of workers, and didn't want to frighten their own side, and didn't much mind what happened to anybody in between.\"</p>\n<p>\"So why go?\"</p>\n<p>\"Because of the other one.\" He held up one finger. \"A few weeks before Clinton's proclamation, the commandant of New York City, a general called Daniel Jones, issued an order to his own officers, plainer than anything his commander ever signed. One line. <em>All Negroes that fly from the Enemy's Country are Free.</em>\" He let it sit a moment. \"Free. Capital F. In a general order, in New York, in June of 1779. That one made it up to the farms in about a week, the same way Dunmore had.\"</p>\n<p>I wrote <em>Gen. Daniel Jones, June 1779, \"Free\"</em> in my notebook and drew a box round it. I could see him watching me do it.</p>\n<p>\"Check it,\" he said. \"People get his name wrong. Somebody misprinted it once, in a book people trust, and he's been David ever since. It was Daniel.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He went in at noon and came out with lunch on a tray: cold chicken, a loaf of the bread from the bakery in town, which had opened again, and a jar of iced tea with mint in it from the bed by the back step. We ate on the porch with the plates on our knees and the recorders running between us. He ate more than I'd seen him eat in weeks. I noticed it, and I noticed myself noticing it, and I didn't write it down.</p>\n<p>\"How did you get away?\" I said. \"In June.\"</p>\n<p>\"I walked.\" He tore a piece of bread in half. \"Reynolds sent me to a mill on the Croton with a wagon of grain, on a Saturday, alone, because I'd been there a dozen times and always come back. I left the wagon at the mill, with the grain still in it and the horses fed and watered, so nobody could say I'd stolen a single thing from him. And I walked south. Two nights, through the Neutral Ground. That's what they called the country between the armies, thirty miles of it, where neither side could keep order and both sides' bandits did as they liked. I slept in the day in a hollow by a creek. I knew every road, so I didn't use any of them.\" He chewed. \"The second night I came down to the British lines at Kingsbridge, at the top of Manhattan Island, and walked up to a picket of Hessians with my hands open, and said, in English, that I was come in on the General's proclamation. They didn't understand a word. They sent for somebody who did.\"</p>\n<p>\"And they let you in.\"</p>\n<p>\"They let me in.\" He set the bread down. \"I've been asked, more than once, in more than one century, how I could have served the King against a country being born. That's how. I knocked on a door, and one side opened it, and the other side owned me.\" He looked at me. \"I don't say the British were good. They weren't, particularly. Their officers used men like me exactly as long as we were useful, and their Loyalist friends in the city spat at us in the street. Half the men who came in on those proclamations died of fever in the camps. Some of them were sold to the West Indies by the very officers who'd promised them security. The British were the side that wanted something from me. That's all. But they were the side that let me in.\"</p>\n<p>\"You said last week,\" I said, carefully, \"that you'd never decided how you felt about it. About losing. About there being a country, partly because you lost.\"</p>\n<p>\"I haven't.\"</p>\n<p>\"Because of this.\"</p>\n<p>\"Because of this,\" he said. \"Britain passed the law ending slavery in its empire in 1833. In this country it took another thirty years, and a war that killed more than six hundred thousand. If the side I was on that summer had won...\" He stopped himself, and shook his head. \"No. That's the kind of sum I don't do. You can't run history backward and pick out the parts you like. A different war is a different everything. Maybe it ends sooner. Maybe it never ends at all. I don't know. Nobody knows.\" He looked out at the field. \"I only know that I've lived in this country a long time, since. I've loved it. I still do. And that the first time I ever saw it, it was a man in a militia coat counting me with his hay.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>We didn't do any more 1780 that day. I think we both knew we wouldn't. At half past two he said he'd start properly next Thursday, at the beginning, at Kingsbridge, if I'd bring a fresh notebook, and I said I always did.</p>\n<p>I put the recorders in my bag. Then I stopped, on the top step, because there was a question I'd forgotten I had, and it had come back to me with the hay smell, the way things come back.</p>\n<p>\"What was his name?\" I said. \"Caesar what?\"</p>\n<p>He had picked up the cardigan, out of habit, though he didn't need it. He held it in both hands.</p>\n<p>\"He didn't have one,\" he said. \"Not when I woke up in him. He was Reynolds's Caesar, the way the gray mare was Reynolds's gray mare. That's how they wrote him down.\" He folded the cardigan over his arm. \"The British wanted a surname, for their books. The officer at Kingsbridge asked me for one, that first night, with his pen over the page. A lot of men who came in that year took their master's name, because it was the only one they'd ever been called. I wasn't going to do that.\"</p>\n<p>\"What did you tell him?\"</p>\n<p>\"Freeman,\" he said. \"Caesar Freeman. It was the first thing I'd owned in that body. I chose it myself, with a Hessian holding a lantern over me, and I watched him write it down.\" He smiled, very slightly. \"He spelled it right. I checked.\"</p>\n<p>I went down the steps and across the gravel to the car. When I looked back, he had gone in, and the door was open behind him, and through it I could see the mantel and the empty frame, and the hay smell came across the yard on the heat, and somewhere in the field the crows were still walking up and down the rows, counting.</p>", "audio": false, "added": 1791133611991, "pt": [1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991, 1791133611991]}, {"num": 3, "title": "Kingsbridge", "extra": false, "html": "<p class=\"tape tape-head\"><em>June 1779</em></p>\n<p class=\"tape\">The Hessian who found me that night was about nineteen, and frightened, and trying very hard not to look it, and I liked him at once.</p>\n<p class=\"tape\">He was standing in the road at the top of the Kingsbridge lines with his musket across his body and a lantern on a pole stuck in the ditch beside him, which is the worst place a picket can put his lantern, because it shows the enemy exactly where he is and blinds him to everything outside its circle. I had watched him from the trees for half an hour. He had not looked into the dark once. He had looked at the lantern, mostly, the way you look at a fire.</p>\n<p class=\"tape\">So I came out of the trees slowly, into the edge of the light, with my hands open in front of me so he could see they were empty, and I said, in English, clearly, as I'd practiced it on the walk down, \"I am come in on the General's proclamation.\"</p>\n<p class=\"tape\">He pointed his musket at my stomach and shouted something in German. Then he shouted it again, louder, as men do with foreigners, and backed up two steps into the lantern pole and nearly knocked it into the ditch.</p>\n<p class=\"tape\">I didn't move. I said it again, the same words, the same tone. <em>I am come in on the General's proclamation.</em> Then I said it in German, as well as I could, which wasn't very well. I hadn't spoken German in that life, or for a long time before it, and the body's mouth had never made those sounds. It came out like a man talking with stones in his cheeks. But he understood the word <em>General</em>, and he understood that I wasn't running, and after a while he stopped shouting and shouted instead, over his shoulder, for somebody called Friedrich.</p>\n<p class=\"tape\">Friedrich was older and had a lantern of his own and a pipe in his mouth, and he looked at me for a long time without saying anything. Then he took the pipe out and said, in English nearly as bad as my German, \"Run from rebel?\"</p>\n<p class=\"tape\">\"Yes.\"</p>\n<p class=\"tape\">\"Which rebel?\"</p>\n<p class=\"tape\">\"Captain Joseph Reynolds,\" I said. \"Of the Westchester militia.\"</p>\n<p class=\"tape\">That mattered more than anything else I'd say that night, and I knew it. The proclamation covered a man who ran from a rebel. It didn't cover a man who ran from a Loyalist. If my master had been a friend to the King, the King's soldiers would have tied my hands and walked me back up the road to him in the morning, and been paid for it. Everything turned on Reynolds being what he was. I was ready to prove it six ways if they asked: his company, his lieutenant's name, the house where they mustered, the tavern where they drank afterward. They didn't ask. Friedrich only nodded, as if he'd heard all of it before, which I suppose he had, many times that month, and jerked his head toward the dark behind the lines.</p>\n<p class=\"tape\">\"Come,\" he said.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They kept me that night in a barn at the back of the post, with two other men who'd come in the same week. One was from New Jersey, a big quiet man who had come across the Hudson in a stolen boat and didn't want to talk about it. The other was a boy of fifteen or so from somewhere near Tarrytown, who wanted to talk about nothing else and couldn't stop. He'd been there four days. He had a blanket, and he shared it, and he told me everything he knew about what happened next, most of which was wrong.</p>\n<p class=\"tape\">In the morning an English officer came out with a book under his arm.</p>\n<p class=\"tape\">It was the book I'd been waiting for, though I didn't know that's what it would look like. A long ledger, bound in brown calf, half full already, with columns ruled down each page in red ink. The officer was a lieutenant, young and sunburned, with a cold, and he sat on an upturned bucket in the barn door and opened the ledger on his knee and dipped his pen and asked us, one at a time, our names.</p>\n<p class=\"tape\">I've told you about that already. <em>Caesar.</em> And what else? <em>Freeman.</em> He wrote it, and spelled it right, and I read it upside down from four feet away while he blotted it, and in that moment I had it, the whole page, every name above mine. Twenty-two of them. Where each man came from. Whom he had belonged to. Which ones could drive a team or swing an axe or handle a boat. And a note in the margin by one name from the week before, in a different hand: <em>Returned to owner, a loyal subject.</em></p>\n<p class=\"tape\">It was the first time I understood what that body could do.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I should tell you about it properly, because it's the reason for everything that happened to me over the next two years, and I didn't understand it myself for a long time.</p>\n<p class=\"tape\">Caesar's body had a memory such as I've never had before or since, in any life. I don't mean a good memory. I've had good memories. I mean that anything his eyes fell on stayed, as it was, as long as I lived in him. A page, a face, a list of numbers, the pattern of a quilt on a bed I walked past once. I didn't have to try. It went in like light into a room. And afterward, if I wanted it, I could go back and stand in front of it and read it off again, as if I were holding the paper.</p>\n<p class=\"tape\">Caesar himself had never known. How could he? He couldn't read. Nobody had ever let him. All his life he'd had the most remarkable eyes in the county and nothing to point them at but fields and cattle and the roads he was sent down. He'd known every road, and every farm, and every horse he'd ever handled, better than any man alive, and everybody thought him slow, because he didn't say much, and because he was owned, and people find it very easy to think slowly of anyone they own.</p>\n<p class=\"tape\">I could read. I'd been reading for two thousand years. Put my reading behind his eyes, and the two of us together could take in a page at a glance and keep it.</p>\n<p class=\"tape\">It was a gift, Ms. Barnett. It was also the most dangerous thing about me, and I knew that by the second day.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Because I couldn't let a soul know I could read.</p>\n<p class=\"tape\">You have to understand how a Black man reading looked in 1779, in British New York, to the people who held the power over him. The British officers didn't much care, one way or the other, as long as you were useful. But the British officers weren't the city. The city was full of Loyalists, men who'd lost their farms and their businesses to the rebels and run to New York with nothing, and a good many of them had brought their own enslaved people with them, or meant to get them back. To them a reading Black man was a man who could forge a pass. He could read a newspaper and learn the war was going badly. He could write a letter to a rebel. He was the worst thing they could imagine.</p>\n<p class=\"tape\">And a Black man suspected of anything, in that city, had nobody. No court. The city was under the army, and the army's justice ran up a chain of officers who might hear him or might not, depending on their dinner. I watched a man taken off the street outside a tavern in Queen Street, that first summer, because a Loyalist merchant said he'd seen him reading a handbill on a wall. He was a free man, born free on Long Island. He had his papers in his coat. It took him six weeks to get out of the Provost, and he came out with his papers gone.</p>\n<p class=\"tape\">So I learned to look at a page without looking at it. A glance, while I was doing something else. Holding a horse beside a man reading a letter. Carrying a candle past a desk. Standing behind a chair. One look, and I'd have it, and then I'd look away and never look back. The glance was all I ever got, all those two years. It was all I ever needed.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They took me to Colonel Robinson on the third day.</p>\n<p class=\"tape\">Beverley Robinson was a Virginian by birth, which nobody ever let you forget, and a New Yorker by marriage. He'd married a Philipse, one of the great land families of the Hudson, and before the war he had owned a great part of the Highlands, up the river, and lived in a fine house there among his tenants like a duke. The rebels took the house and the land when he wouldn't swear to them. He came down to New York, raised a regiment of Loyalists at his own expense, and spent the rest of the war trying to get his country back, and, I think, his house.</p>\n<p class=\"tape\">He was nearly sixty then, heavy and gray and courteous, with a gentleman's soft voice and the patience of a man who has spent his life collecting rents. And he collected information the way he'd collected rents: steadily, from everybody, without ever seeming to ask. Every man who came in through the lines from Westchester was sent to him sooner or later, because Westchester was his country, and nobody knew it better.</p>\n<p class=\"tape\">Until I came.</p>\n<p class=\"tape\">He saw me in a farmhouse behind the lines that his officers used, in a room with a table and two chairs and a map of the county on the wall, painted, very fine, with the farms marked in tiny red squares and the names written beside them in a careful copperplate hand. He sat in one chair. He didn't offer me the other, and I didn't expect it. A clerk sat in the corner with a writing board on his knee.</p>\n<p class=\"tape\">\"You're Reynolds's man,\" he said. \"From Bedford.\"</p>\n<p class=\"tape\">\"I was, sir.\"</p>\n<p class=\"tape\">\"I knew Reynolds's father.\" He looked at me for a while, pleasantly. \"Tell me how you came down.\"</p>\n<p class=\"tape\">So I told him. The mill on the Croton, the wagon left with the grain still in it. The two nights. The hollow by the creek where I slept in the day. And because I could see the map on the wall behind him, and because I could see, as I talked, that it was wrong, I told him that too, without seeming to.</p>\n<p class=\"tape\">\"I didn't come by the Post Road, sir,\" I said. \"There's a picket at the Hammond place now, since the spring. They moved it from the crossroads.\" His map had it at the crossroads. \"And I didn't come by the Saw Mill road, because the bridge over the river at Odell's is down. It went in the April flood.\"</p>\n<p class=\"tape\">His clerk stopped writing. Robinson didn't turn round to look at his map. He didn't have to. He knew perfectly well what was on it.</p>\n<p class=\"tape\">\"The bridge at Odell's,\" he said.</p>\n<p class=\"tape\">\"Yes, sir. Half of it. You can still get a man across. Not a horse.\"</p>\n<p class=\"tape\">He looked at me with a different sort of attention then. Not suspicion, exactly. More the look a man gives a field he has driven past for years, when he notices for the first time that it's better land than he thought.</p>\n<p class=\"tape\">\"Tell me the rest,\" he said. \"Everything you passed. Every house, and who's in it now.\"</p>\n<p class=\"tape\">It took me two hours. I gave him every farm between Bedford and Kingsbridge, all of them, the way Caesar had known them from twenty years of being sent down those roads, and everything I had added to it myself in the six months I'd been in him. Who'd gone over to the rebels and who was only pretending, for safety. Which houses had men in them who'd been out with the militia and which had men hiding in the cellar from it. Where the rebel guard boats lay up on the river, and which widow on the Sawmill River took in their wounded. The clerk filled six sheets. Robinson listened to all of it without interrupting, and at the end he sat for a moment, quite still, and then stood up and took a quill and went to his own map on the wall, and moved the picket from the crossroads to the Hammond place, and drew a small neat line through the bridge at Odell's.</p>\n<p class=\"tape\">\"You'll guide for us,\" he said, with his back to me. \"There's a fee. The Quartermaster General keeps the guides on his books. You'll be paid by the day when we use you and not when we don't, and you'll come when you're sent for, day or night.\" He turned round. \"Can you ride?\"</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">\"Can you read?\"</p>\n<p class=\"tape\">He said it in exactly the same voice. Pleasantly. As if it were the next question on a list. I suppose it was. Behind him on the table, under his hand, there was a letter he'd been reading when I came in, face up, and I had read it, all of it, at a glance, through the door, before I'd taken my second step into the room. A report from one of his agents in the Highlands. Eight lines about the rebels' boats at Peekskill.</p>\n<p class=\"tape\">\"No, sir,\" I said.</p>\n<p class=\"tape\">He looked at me a moment longer. Then he nodded, and sat down, and folded the letter in half, without hurrying, and put it in his coat.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">That was how it started. A guide, on the books, at a fee by the day.</p>\n<p class=\"tape\">They gave me a paper with Robinson's name on it, to show any sentry who stopped me, and a place to sleep in a long wooden shed by the North River, near the Commons, with other men who'd come in the same way and worked for the army: wagoners, axemen, men who drove cattle and men who dug. The army fed us, some days, and paid us, most weeks. The shed leaked. The man in the next place along was a carpenter from Virginia who'd come all the way up with Dunmore's people in '76 and lived through the smallpox camp, and had the marks of it all over his face, and he could build anything, and nobody would let him, because they only wanted him to dig. His name was Prince. I've thought about him a great deal, since.</p>\n<p class=\"tape\">And in July, Robinson sent for me in the middle of the night, and I went, the way he'd said, and he put me on a horse with a troop of Loyalist horse going up into the Neutral Ground after a rebel who'd been seen at a farmhouse near Eastchester. I took them round by the back of the farm, by the creek, and we came in quietly and the man was asleep in his bed and his boots by the fire, and he came back with us to the lines with his hands tied, swearing. He wasn't a spy. He was a rebel militia lieutenant who'd come home to see his wife. They exchanged him a month later for a Loyalist captain.</p>\n<p class=\"tape\">It was a small thing. The officer in charge thanked me, at the end, and gave me a shilling of his own, and said Robinson had told him I knew the country, and that Robinson was right. I don't think he thought of me again.</p>\n<p class=\"tape\">But Robinson did. And so, before very long, did somebody else.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped and looked down at his hands. We were in the kitchen that day, because the porch had been in full sun since eleven, and he'd brought the tea in from the stove and forgotten it, and it had gone cold in the pot.</p>\n<p>\"Did he know?\" I said. \"Robinson. That you'd read his letter.\"</p>\n<p>\"I've wondered that for two hundred and forty-seven years.\" He reached for the pot, found it cold, and poured himself a cup anyway, and drank it. \"I think he knew there was something. He couldn't have said what. He was the kind of man who notices that his dog is cleverer than other people's dogs, and doesn't like to think too hard about why.\" He set the cup down. \"He folded that letter very carefully, after I said no. And he never once left another one on the table when I was in the room. Not in two years.\"</p>\n<p>\"Did anyone ever find out?\" I said. \"That you could read.\"</p>\n<p>He looked at me over the cup for a long moment.</p>\n<p>\"Once,\" he said.</p>\n<p>Then he looked at the clock on the wall over the stove, which said a quarter to two, and got up to put the kettle on again, and didn't say who. I wrote it in my notebook under the date, <em>Session 30, Thursday, May 20,</em> the way I always do: <em>Once.</em> And the recorders ran on in the warm kitchen with the window open and the hay smell coming in, and the kettle began, very quietly, to tick.</p>", "audio": false, "added": 1791133789737, "pt": [1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737, 1791133789737]}, {"num": 4, "title": "The Ferry", "extra": false, "html": "<p class=\"tape tape-head\"><em>August 1779</em></p>\n<p class=\"tape\">I should tell you what the city was like, because you won't find it in the pictures. The pictures are all of the harbor, with the ships in it, and the church spires, and little figures in good coats walking about on the Battery. That was there. It wasn't the city.</p>\n<p class=\"tape\">The city was half burned.</p>\n<p class=\"tape\">Three years before, in September of '76, a few days after the British marched in, a fire had started near the Whitehall slip in the middle of the night and run up the west side of the island with the wind behind it. It took Trinity Church and something like a quarter of the town. Then in '78 another fire took more. Nobody had rebuilt any of it. There was no money, and no lumber to spare, and no one sure enough of the future to build on it. So for two blocks either side of Broadway, all the way up past the ruins of Trinity, there were only cellars. Black holes in the ground where houses had been, with chimneys standing up out of them like gravestones.</p>\n<p class=\"tape\">And people lived in them. That was Canvas Town. They'd stretched old sails and tarpaulins over the cellars, and propped them up with spars from wrecked ships, and lived underneath, whole families, with their cooking fires smoking through holes in the canvas. Sailors' women. Refugees from the country with nowhere else to go. Deserters from both armies. And a good many people like me, who'd come in on a promise and found that the promise didn't include a roof. In the summer it stank. In the winter it froze. The officers' wives held their handkerchiefs to their noses and took the long way round to church.</p>\n<p class=\"tape\">Everybody in that city had come there from somewhere else, running from something. Loyalist farmers whose farms the rebels had taken. Rich men who'd lost their money and poor men who'd lost their nerve. Soldiers of three nations, the British and the Hessians and the Loyalist regiments, and sailors of a dozen more. Thirty thousand people, maybe, in a town built for half that, on an island they were cutting down for firewood a tree at a time. Everybody watched everybody. Everybody was afraid of somebody. Nobody said what they meant, if they could help it.</p>\n<p class=\"tape\">That's what I meant, when I told you everybody was lying. It wasn't wickedness. It was the weather in that town. You breathed it.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The British had a letter.</p>\n<p class=\"tape\">That was the thing everybody in Robinson's rooms was talking about, that August, in low voices, the way men talk about a thing they're pleased with and not supposed to mention.</p>\n<p class=\"tape\">At the beginning of July, a British cavalry raid under a young colonel called Tarleton had hit a rebel cavalry camp up at Pound Ridge, in the north of the county, and caught it so badly by surprise that one of the officers there, a major, left his horse behind. In the saddlebags of the horse there was money, and there were papers, and among the papers there was a letter from General Washington himself.</p>\n<p class=\"tape\">Robinson had a copy of it. I saw it once, in the second week of August, for about the time it takes to put a candle on a table and take your hand away again. Robinson was reading it to another officer at the table, under the window, and he had asked me to bring the light. I brought the light. I put it down. And it was mine.</p>\n<p class=\"tape\">It was a short letter, and most of it was about money. Washington was telling his officer, a major called Tallmadge, how to pay for the intelligence he was getting from New York. There was a man who wrote to them from inside the city. The letter called him <em>C\u2014\u2014r</em>, with a long dash in the middle, the way people wrote a name they didn't want to write. And it said that this man might need a new way to send his letters, and it named somebody who might carry them: <em>a man on York Island, living on or near the North River,</em> called George Higday.</p>\n<p class=\"tape\">They took Higday within the week. He was a farmer, on the island, up toward the top, as the letter said. He swore he knew nothing, and I think he was mostly telling the truth. He had been asked. He hadn't yet said yes. They tried to turn him, too, and I don't think they found much in him worth turning.</p>\n<p class=\"tape\">But the other name they couldn't find. <em>C\u2014\u2014r.</em> A man in the city who wrote to Washington, through Tallmadge, for guineas. That was all they had. It wasn't nothing. Before Pound Ridge, they hadn't even known he existed.</p>\n<p class=\"tape\">\"Culper,\" the other officer said, that night, to Robinson. \"Some of the men say Culper. It'd fit.\"</p>\n<p class=\"tape\">\"It might fit a great many things,\" Robinson said. He folded the letter. \"A name with six letters in it is no name at all.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I want to be honest with you about where my mind was, that summer.</p>\n<p class=\"tape\">It wasn't on Culper. Culper was Robinson's business, and Major Andr\u00e9's, up at headquarters. I'd seen Andr\u00e9 twice by then, at a distance, coming down Robinson's steps: a slim young man in a beautiful coat, laughing at something, with a sketchbook under his arm. He was Sir Henry Clinton's favorite, everybody said, and he ran the secret correspondence for the whole army, the agents and the codes and the money. He didn't look at me, either time. Why would he? I was holding somebody's horse.</p>\n<p class=\"tape\">My mind was on staying alive, and on being useful enough to stay alive, and on the men in the shed.</p>\n<p class=\"tape\">That's the truth. I was a guide on the Quartermaster's books, paid by the day when I was used. Most days I wasn't. The rest of the time I worked where I could, for whoever paid: unloading at the docks, cutting wood, carrying for the Engineers. I ate what the army gave us and what Prince could talk out of the cooks at the Engineers' yard. I kept my head down and my eyes open. I learned the city: every street, every slip, every sentry post and the hour it changed, every tavern where the officers drank and every one where the sailors did. I couldn't help learning it. Everything I looked at stayed.</p>\n<p class=\"tape\">And I learned the ferry.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The Brooklyn ferry ran from the city across the East River to the Long Island shore, all day, in all weathers, so long as the river wasn't full of ice. It was the only road between the city and the whole of Long Island. Everything that came into New York from the east came across it: cattle and hay and firewood, farmers with butter and eggs and cheese for the markets, officers going out to their regiments on the Island and coming back, letters, newspapers, women visiting their sisters, men visiting other men's sisters. Twenty crossings a day, maybe more.</p>\n<p class=\"tape\">I crossed it often. The army had cattle grazing on Long Island, and forage stacked there, and Robinson's people had business out there too, and somebody had to guide the parties to the right farms and back. So I knew the ferry well. The flat boats with their big sweeps, and the boatmen who swore at the tide. The stairs down to the water on the city side, slimy with weed at the bottom. The crowd at the top of the stairs waiting for the next boat, with their baskets and their bundles and their complaints. The carts selling things to the crowd: hot cakes, cider, oysters in season. A widow selling eggs and butter from a handcart, whom I bought from twice a week for two years and could not then have described to you if you'd held a pistol to my head, which tells you how good she was.</p>\n<p class=\"tape\">I could describe her to you now. But I'll come to that.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">On the fourteenth of August the <em>Royal Gazette</em> announced that a gentleman called Mr. John Hill had been appointed inspector at the Brooklyn ferry, and that from now on every person crossing would be examined.</p>\n<p class=\"tape\">I had something to do with that. Not much. I want to be careful not to make it bigger than it was.</p>\n<p class=\"tape\">A few days before, Robinson had asked me, as he sometimes did, what the country was saying. Not the rebels. The farmers. The people who came over the ferry with their butter. I told him what I'd heard, and then I told him something I hadn't heard, but seen. That there were more letters coming across that ferry than there ought to be. Farmers who couldn't write, as far as anybody knew, carrying sealed letters to cousins in the city they'd never mentioned before. A young man, three times in a month, who came over with nothing to sell and went back with nothing he'd bought. I'd noticed because I noticed everything. I couldn't help it.</p>\n<p class=\"tape\">\"Washington's letter,\" I said, \"talks about a way for this Culper to send what he writes. If he's in the city, and his letters go to Tallmadge, and Tallmadge is in Connecticut, they have to go out somehow. Not north. The country north is ours and the rebels' both, and it's full of thieves. Out by the east, across Long Island, is quieter.\"</p>\n<p class=\"tape\">Robinson looked at me for a long time.</p>\n<p class=\"tape\">\"That's a long sentence for a guide,\" he said.</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">He didn't say anything else. But a week later there was Mr. Hill, with two soldiers and a table at the top of the ferry stairs, opening every letter and turning out every basket and making grown men take off their boots.</p>\n<p class=\"tape\">I learned afterward, a long time afterward, from people who could read the other side's letters, what it did. One of their couriers was coming back from the city with a letter that very week. When he saw the table at the stairs, he destroyed it before they could find it on him, and went home with nothing. Their man in Setauket wrote to Tallmadge, the next day: <em>Every letter is opened at the entrance of New York, and every man is searched.</em> And he wrote, <em>They have some knowledge of the route our letters take.</em></p>\n<p class=\"tape\">We did. A little. Because of me.</p>\n<p class=\"tape\">It was the first round of the game, and I didn't even know that I'd won it. I didn't know there was a game. I only knew that I'd noticed something, and said it, and that the next week grown men were standing in their stockings at the top of the ferry stairs, swearing at Mr. Hill.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I watched that table a good deal, the rest of that summer. Sometimes I stood near it on purpose, if I was waiting for a boat, and I watched Hill work.</p>\n<p class=\"tape\">He wasn't good at it. He was a clerk, not a hunter. He opened the letters and read them, and found nothing in them, because the letters said nothing, because anybody clever enough to be worth catching wasn't going to put anything in a letter that a clerk at a ferry table could read. He turned out baskets. He made men take off their boots. He never once looked at the women.</p>\n<p class=\"tape\">I saw a young man searched very hard there, one morning in September. Thin, pale, sweating, with a satchel. Hill had him empty it on the table, and turned every paper over twice, and held the letters up to the light, and found nothing, and let him go. The young man went down the ferry stairs without looking back, and I watched him all the way down, and I thought, <em>that is a man who has just been very lucky</em>. I never saw him again. I don't know his name. I've often thought I'd like to.</p>\n<p class=\"tape\">And I saw a farmer and his wife go through, one morning in late August. I'm only telling you because I remember everything, and I can't leave it out. He was about thirty, thin, anxious, in a brown coat, with the look of a man who's never been anywhere and doesn't like it. She was on his arm, a little older than him, in a gray cloak and a plain cap, scolding him the whole way up to the table about what he'd paid for a ham. Hill opened their basket, and found butter and a ham, and the wife told him what she thought of men who put their hands in other people's butter, at some length. Hill was glad to see them go. So was everybody in the line. I laughed, I think. Most people did.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">In October, Andr\u00e9 was made Adjutant General of the whole army, at twenty-nine, over the heads of men twice his age. The officers in Robinson's rooms were furious and delighted in about equal parts. In November and December the talk was all about the South. Clinton was going to take an army down by sea and attack Charleston, in South Carolina, and finish the war in the southern colonies, where there were more Loyalists. Everybody knew it. It was meant to be a secret. In that city nothing was.</p>\n<p class=\"tape\">On the twenty-sixth of December, the day after Christmas, the fleet sailed. Ninety ships, the sailors said, and eight thousand men. Clinton went, and Andr\u00e9 went with him, with his sketchbook, and a good part of the army. The city was left to the old Hessian general Knyphausen, who'd commanded at the Brandywine and had very little English, and to his aide, a sharp young British captain called Beckwith, who took over Andr\u00e9's secret business while Andr\u00e9 was away.</p>\n<p class=\"tape\">I was on the Battery the morning they sailed, with half the town, to watch them go. It was very cold. The wind came straight down the river from the north with nothing in the way of it, and there was ice already along the edges of the slips, thin and gray, and pieces of it turning in the current out in the stream, the size of cart wheels.</p>\n<p class=\"tape\">The old men on the Battery said they'd never seen ice in the harbor so early.</p>\n<p class=\"tape\">They were right. They'd never seen anything like what came next. Nobody alive had.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. It was very hot in the kitchen, the hottest day yet, and he had the door open to the porch and a fan going on the counter that pushed the warm air round without doing anything about it. I had my sleeves pushed up past my elbows. There was a glass of iced tea by my notebook, sweating a ring onto the page.</p>\n<p>\"Next week,\" he said, \"you'll want the coat.\"</p>\n<p>I looked up. \"You said I wouldn't need the coat for this one.\"</p>\n<p>\"I said it was summer.\" He smiled. \"It was. When I got there.\"</p>\n<p>I wrote that down. I'm not sure why. Then I turned back a page and looked at what I'd written while he was talking about the ferry, and I saw that somewhere in the middle of it I'd drawn, without meaning to, a little cart, with two wheels and a handle, in the margin, next to the words <em>eggs and butter.</em></p>\n<p>I didn't remember drawing it. I left it there.</p>", "audio": false, "added": 1791133935852, "pt": [1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852, 1791133935852]}, {"num": 5, "title": "The Hard Winter", "extra": false, "html": "<p>I brought the coat.</p>\n<p>It was eighty-eight degrees the next Thursday, the last one in May, and I drove up with the air conditioning on full and the green wool coat folded on the back seat like a passenger. When I came up the porch steps I had it over my arm. He was on the bench in the shade with a glass of water, and he looked at the coat, and then at me, and then he laughed, properly, the laugh that made him hold the rail.</p>\n<p>\"I was told to,\" I said.</p>\n<p>\"You were.\" He wiped his eyes. \"Put it on the chair. It can listen.\"</p>\n<p>I put it over the back of the other chair, and set the recorders on the little table, and said the date into them, <em>session thirty-one, Thursday, May twenty-seventh</em>, and he looked at the coat for a while, hanging there in the heat, as if it really were going to listen.</p>\n<p>\"Good,\" he said. \"Now. Cold.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>January 1780</em></p>\n<p class=\"tape\">You won't believe me about the cold. Nobody does, now. You've never had a winter like it, and nobody alive has. It was the worst winter anyone on this coast had ever written down.</p>\n<p class=\"tape\">It began before Christmas, with the ice in the slips. By the third week of December the floes in the North River were so thick the boats from the Jersey shore couldn't get through them, and the farmers who brought wood and food across stopped coming. Then, in the first days of January, the snow came. It snowed for three days. In the hills of Jersey, where Washington's army was in its huts, it lay four and five and six feet deep, and drifted over the huts so the men had to dig their way out in the morning. In the city it was less, but it didn't matter. It didn't melt. It didn't melt for two months.</p>\n<p class=\"tape\">And then the rivers froze.</p>\n<p class=\"tape\">Not the edges. All of it. The North River, which is a mile wide at the city and has the whole tide of the ocean pushing in and out of it twice a day, froze from shore to shore, solid. The bay froze. The water between the city and Staten Island, which is five miles of open harbor, froze hard enough to walk on, and then hard enough to ride on, and then hard enough to drive a sleigh full of firewood across, and then, about the middle of January, hard enough to drag the army's heaviest cannon across it, which nobody in the history of the place had ever seen or imagined.</p>\n<p class=\"tape\">New York was an island. That's all it had been for three years, a fortress on an island, safe behind its water, with the King's navy all round it. In the second week of January it stopped being an island. You could walk to it from New Jersey. You could walk to it from anywhere.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The city ran out of wood.</p>\n<p class=\"tape\">That's the thing I remember most, of that winter, and I remember all of it. Not the snow. Not the ice, though the ice was a wonder. The wood. A town of thirty thousand people needs a great deal of firewood to get through a winter, and in an ordinary year it came in by water, from Long Island and Jersey and up the river, every day, boatload after boatload. That year nothing came. The water was stone.</p>\n<p class=\"tape\">They burned everything. The army cut down every tree left standing on the island, the old orchards and the shade trees on the Bowery lanes, the trees in the gentlemen's gardens with the gentlemen watching from their windows. They pulled down empty houses and burned them. They bought up old ships and broken hulks lying in the slips and broke them up for firewood, and the bits of old ships burned blue and green in the grates from the copper and the salt. The soldiers' fuel was cut, and cut again. Gentlemen burned their furniture. I saw a man on Queen Street burning a harpsichord.</p>\n<p class=\"tape\">The officers at headquarters said the city needed six hundred cords of wood a week. I know because I heard Beckwith say it, more than once, in the way a man repeats a number that's frightening him. Some weeks there were seventy cords in all the army's yards.</p>\n<p class=\"tape\">And in Canvas Town, under the sails, over the burnt cellars, people froze to death.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I'm going to tell you about one of them, because I have to tell somebody. I'll be short.</p>\n<p class=\"tape\">There was a family in a cellar on the west side of Broadway, near where Trinity had been. A man and his wife and three children, sailors' people, from somewhere in the West Country of England. I passed them most days, that winter, on my way down to the river. The man had been pressed off a merchant ship and then dismissed from the navy sick, and he had no work and no way home. They'd made a sort of room down in their cellar, with a canvas roof and an old door for a wall, and a little fire in the corner of what had been somebody's kitchen hearth. The youngest child was about four. A girl, with very fair hair and a red woolen scarf that went round her neck three times. She used to sit at the top of the cellar steps in the mornings when it was sunny, with the scarf up to her eyes, and watch the people go by.</p>\n<p class=\"tape\">On the eleventh of January there was no smoke coming out of the hole in their canvas. I noticed it on my way down to the river. On my way back, at dusk, there was still none, and two men from the Barrack Master's office were carrying them up the cellar steps, one at a time, wrapped in their own blankets.</p>\n<p class=\"tape\">The red scarf was round the smallest one. They'd left it on her.</p>\n<p class=\"tape\">That's all. It happened in a hundred cellars that month. The Chief Justice of the province wrote in his diary, that winter, that they often heard of the deaths of the poor, frozen in their houses. He was a decent man, and I believe it upset him, and he was writing in a warm room.</p>\n<p class=\"tape\">I've told you about Caesar's eyes, how anything they fell on stayed. I've told you it was a gift. This is the other side of it. I have that cellar, Ms. Barnett. I have the steps, and the old door, and the color of the scarf, and the way the second man held the child, under the knees and the shoulders, as if she might still mind being carried badly. I've had it for two hundred and forty-seven years. I lost Caesar's eyes when I lost him, in the end, and everything I saw after that I've remembered the way anyone remembers, which is to say badly, with the edges worn off. But the things I saw with his eyes I still have the way he saw them. As if I were holding the page.</p>\n<p class=\"tape\">I wouldn't give them back. I want you to understand that. Even the cellar. Somebody ought to keep it.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. Across the field, at the far edge, the line of trees had gone blue in the heat haze, and a tractor was turning the hay in long slow rows, very small and far away, and the sound of it came to us a little after we saw it move.</p>\n<p>I didn't say anything. There wasn't anything to say that wouldn't have been for my sake rather than his. He drank some of his water. The green coat hung over the chair beside me, in the heat, absurd and patient.</p>\n<p>\"All right,\" he said, after a while. \"That's that one.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>January 1780</em></p>\n<p class=\"tape\">Beckwith sent for me in the second week of January.</p>\n<p class=\"tape\">I'd never spoken to him. I knew him by sight, as I knew everybody: a young man, younger than Andr\u00e9, quick and thin and pale, with a sharp nose and sharp eyes, the kind of officer who reads every paper put in front of him twice and trusts none of them. With Andr\u00e9 and the General gone south, the whole secret business of the army in New York had landed on his desk. The agents. The letters. The deserters coming in over the ice, more every day, with stories, some true. And the rebels, sitting out there in the Jersey hills four and five miles off, looking at a city that wasn't an island anymore.</p>\n<p class=\"tape\">He saw me in a cold little office at the back of the Commandant's house, with his greatcoat on and a candle on the table and his breath showing. He had a paper in front of him, Robinson's paper about me. He didn't ask me to sit down either. But he looked up at me when I came in, straight up, the way Robinson had looked at me the second time, and not the first.</p>\n<p class=\"tape\">\"Colonel Robinson says you see things,\" he said.</p>\n<p class=\"tape\">\"I try to, sir.\"</p>\n<p class=\"tape\">\"He says you notice what people carry, and where they go, and who they talk to, and that you never forget a face.\" He tapped the paper. \"He says that's why the rebels' letters stopped coming over the Brooklyn ferry in the summer. Because you noticed them.\"</p>\n<p class=\"tape\">\"They didn't stop, sir. They went another way.\"</p>\n<p class=\"tape\">He looked at me a moment longer. Then he smiled, which surprised me. It was a thin, quick smile, and it went as fast as it came.</p>\n<p class=\"tape\">\"Yes,\" he said. \"That's exactly what I'd have said. Good.\" He leaned back. \"Here is my difficulty. You may have noticed that the harbor has frozen.\"</p>\n<p class=\"tape\">\"Yes, sir.\"</p>\n<p class=\"tape\">\"We've been sitting behind our water for three years. Now we have no water. Washington has an army in the hills at Morristown, thirty miles off, starving and freezing and very angry, and every day the ice gets thicker, and every night I lie awake thinking about what an angry general does when somebody builds him a road.\" He put both hands flat on the table. \"I have deserters coming in who tell me he's coming. I have agents who tell me he isn't. I have Loyalists on Staten Island who see rebels behind every snowdrift. What I don't have is anybody who can stand on that ice in the dark and tell me what's really out there.\"</p>\n<p class=\"tape\">\"The ice talks, sir,\" I said.</p>\n<p class=\"tape\">He raised his eyebrows.</p>\n<p class=\"tape\">\"At night,\" I said. \"When it's very cold and there's no wind. A sound will carry across it for miles. You can hear a dog bark on the Jersey shore from the middle of the bay, as if it were on the next street. You can hear men talking at Elizabethtown Point from the Staten Island side, if they're careless. You can hear sleighs.\" I paused. \"Caesar learned it on the ponds up in Westchester, as a boy. Sent out to cut ice. Any man who's worked on ice knows it. The officers don't, because they've never had to.\"</p>\n<p class=\"tape\">He was very still.</p>\n<p class=\"tape\">\"Sleighs,\" he said.</p>\n<p class=\"tape\">\"If anybody's coming across from Jersey to you, sir, they'll come by sleigh. There's nothing else that'll carry men and guns over that much ice at night. And you can hear a sleigh on the ice, on a still night, a long way off. The runners sing. And the horses' bells, if they're fools enough to leave them on.\"</p>\n<p class=\"tape\">Beckwith picked up his pen and wrote something on Robinson's paper, very small, in the margin. I read it, of course, upside down. <em>Staten Island. Nights.</em></p>\n<p class=\"tape\">\"You'll go over tomorrow,\" he said. \"There's a sleigh going across with the wood party at first light. Report to General Stirling's people at the watering place. Not the American Stirling,\" he added, dryly. \"Ours. We have one each.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I want to tell you one more thing about that week, and then we'll go out on the ice.</p>\n<p class=\"tape\">The ferry to Brooklyn wasn't running. The East River was jammed with ice, great broken slabs of it heaved up against each other the full width of the water, grinding and groaning with every tide, too rough to walk across and too thick for any boat. But people still came down to the ferry stairs every morning out of habit, the way you go and look at a shop you know is shut. And the carts still came. There was nowhere better to sell to a crowd of people with nothing to do.</p>\n<p class=\"tape\">I went down there the morning before I went across to Staten Island, to look at the ice on the East River before I trusted myself to the bay. It was very early, and so cold that the air hurt the inside of your nose. The sun was just up, red, over the Brooklyn shore. The ice in the river was pink with it.</p>\n<p class=\"tape\">The widow was at the top of the stairs with her cart. She had a little iron pot of coals on a tray underneath it, to keep the butter from freezing hard, and she'd wrapped her hands in strips of old blanket so that only the tips of her fingers showed. She was looking at the ice too. And she was humming, very quietly, to herself, under her breath, the way people do on a cold morning to keep themselves company.</p>\n<p class=\"tape\">I couldn't hear what. The ice was too loud. Every time the tide moved, the whole river creaked and cracked and boomed, like a great house settling. I caught a turn of something, under it. Up, and a little turn, and down. And then a slab of ice somewhere out in the stream gave way with a noise like a cannon, and everybody on the stairs jumped, and when I looked back, she had stopped, and was rubbing her hands over the little pot of coals, and the tune was gone.</p>\n<p class=\"tape\">I bought two eggs from her. I remember them perfectly, the weight of them, warm from the coals, in my hand. I put them inside my shirt for later. She didn't look at me any more than I looked at her.</p>\n<p class=\"tape\">I've wondered since what she was humming. I've wondered it for two hundred and forty-seven years.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there and looked over at the coat on the chair, and so did I.</p>\n<p>\"Why does that matter?\" I said. \"W
