<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<title>While You Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e7; --ink: #2a251d; --soft: #7a6f5d; --rule: #d9cfbc; --accent: #8a2b1d;
    --size: 20px;
  }
  :root[data-theme="dark"] { --paper: #16140f; --ink: #e6dfd0; --soft: #9a907e; --rule: #3a342a; --accent: #d4826f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #16140f; --ink: #e6dfd0; --soft: #9a907e; --rule: #3a342a; --accent: #d4826f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "EB Garamond", Georgia, "Times New Roman", serif; font-size: var(--size); line-height: 1.6;
         -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
         gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--paper);
         border-bottom: 1px solid var(--rule); font-size: 15px; color: var(--soft); transition: transform .25s; }
  .bar.hide { transform: translateY(-100%); }
  .bar .where { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar button { padding: 6px 8px; border-radius: 6px; font-size: 15px; }
  .bar button:active { background: var(--rule); }

  main { max-width: 34em; margin: 0 auto; padding: 0 22px calc(env(safe-area-inset-bottom) + 40px); }

  .cover { min-height: 88vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cover .series { letter-spacing: .3em; text-transform: uppercase; font-size: .7em; color: var(--soft); }
  .cover h1 { font-weight: 500; font-size: 2.6em; margin: .4em 0 .1em; letter-spacing: .02em; }
  .cover .book { font-style: italic; color: var(--soft); }
  .cover .star { color: var(--accent); font-size: 1.4em; margin: 1.4em 0; }
  .cover .begin { margin-top: 1.2em; padding: .5em 1.6em; border: 1px solid var(--ink); border-radius: 999px; font-size: .9em; }
  .cover .resume { margin-top: .8em; font-size: .8em; color: var(--soft); text-decoration: underline; }

  .toc h2 { font-weight: 500; text-align: center; margin: 2em 0 1em; }
  .toc ol { list-style: none; padding: 0; margin: 0; }
  .toc li button { display: flex; width: 100%; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--rule); text-align: left; }
  .toc .n { color: var(--soft); min-width: 2em; }

  .chapter header { text-align: center; margin: 2.2em 0 1.8em; }
  .chapter .num { letter-spacing: .3em; text-transform: uppercase; font-size: .7em; color: var(--soft); }
  .chapter h2 { font-weight: 500; font-size: 1.6em; margin: .3em 0 0; }
  .chapter p { margin: 0; text-indent: 1.4em; hyphens: auto; -webkit-hyphens: auto; }
  .chapter header + p, .chapter p.break + p { text-indent: 0; }
  .chapter header + p { display: flow-root; }
  .chapter header + p::first-letter { float: left; font-size: 3.4em; line-height: .85; padding: .06em .08em 0 0; color: var(--accent); }
  .chapter p.break { text-align: center; text-indent: 0; margin: 1em 0; color: var(--soft); }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin: 3em 0 1em; padding-top: 1.2em; border-top: 1px solid var(--rule); font-size: .85em; }
  .nav button { max-width: 48%; text-align: left; }
  .nav button.next { text-align: right; margin-left: auto; }
  .nav small { display: block; color: var(--soft); font-size: .8em; }
  .end { text-align: center; color: var(--soft); font-style: italic; margin: 3em 0 1em; }

  .progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; z-index: 6; }
  .sheet { position: fixed; inset: auto 0 0 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--rule);
           padding: 18px 22px calc(env(safe-area-inset-bottom) + 18px); font-size: 16px; display: none; box-shadow: 0 -10px 30px rgba(0,0,0,.15); }
  .sheet.open { display: block; }
  .sheet .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  .sheet .seg { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .sheet .seg button { padding: 8px 14px; }
  .sheet .seg button.on { background: var(--ink); color: var(--paper); }
  .pen { margin-left: .2em; padding: .15em .45em; font-size: .85em; color: var(--soft); opacity: .7; vertical-align: .05em; }
  .pen.has { opacity: 1; }
  .pen.has { color: var(--accent); }
  .cmt { position: fixed; inset: auto 0 0 0; z-index: 12; background: var(--paper); border-top: 1px solid var(--rule);
         padding: 16px 18px calc(env(safe-area-inset-bottom) + 16px); font-size: 16px; display: none;
         box-shadow: 0 -10px 30px rgba(0,0,0,.18); max-height: 75vh; overflow: auto; }
  .cmt.open { display: block; }
  .cmt .quote { color: var(--soft); font-style: italic; margin-bottom: 10px; }
  .cmt .old { border-left: 3px solid var(--accent); padding: 4px 10px; margin: 8px 0; display: flex; gap: 10px; justify-content: space-between; }
  .cmt .old button { color: var(--soft); }
  .cmt textarea { width: 100%; min-height: 90px; font: inherit; font-size: 16px; color: var(--ink); background: transparent;
                  border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
  .cmt .acts { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .cmt .save { padding: 8px 20px; border-radius: 999px; background: var(--ink); color: var(--paper); }
  .cmt .status { color: var(--soft); font-size: 14px; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <button id="homeBtn" aria-label="Contents">Contents</button>
  <div class="where" id="where"></div>
  <button id="aaBtn" aria-label="Text settings">Aa</button>
</div>
<main id="main"></main>
<div class="progress" id="progress"></div>
<div class="sheet" id="sheet">
  <div class="row"><span>Text size</span>
    <div class="seg"><button data-size="-1">A&minus;</button><button data-size="1">A+</button></div></div>
  <div class="row"><span>Page</span>
    <div class="seg" id="themeSeg"><button data-theme="auto">Auto</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div></div>
</div>
<div class="cmt" id="cmt">
  <div class="quote" id="cmtQuote"></div>
  <div id="cmtOld"></div>
  <textarea id="cmtText" placeholder="Your note on this paragraph"></textarea>
  <div class="acts"><button id="cmtClose">Close</button><span class="status" id="cmtStatus"></span><button class="save" id="cmtSave">Save</button></div>
</div>
<script>
const BOOK = /*BOOK*/null;
const CHAPTERS = /*CHAPTERS*/[];
const $ = (id) => document.getElementById(id);
const main = $("main");
const store = {
  get(k, d) { try { const v = localStorage.getItem("wyl." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wyl." + k, JSON.stringify(v)); } catch {} },
};

// settings
function applySize() { document.documentElement.style.setProperty("--size", store.get("size", 20) + "px"); }
function applyTheme() {
  const t = store.get("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
applySize(); applyTheme();
document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
  store.set("size", Math.min(28, Math.max(15, store.get("size", 20) + Number(b.dataset.size)))); applySize();
});
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.theme); applyTheme(); });
$("aaBtn").onclick = (e) => { e.stopPropagation(); $("sheet").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!$("sheet").contains(e.target)) $("sheet").classList.remove("open"); });

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();
}
function toc() {
  main.innerHTML = `<section class="toc"><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.num}</span><span>${c.title}</span></button></li>`).join("")}</ol></section>`;
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter">
    <header><div class="num">Chapter ${c.num}</div><h2>${c.title}</h2></header>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  $("where").textContent = `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();

// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });


// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
const CKEY = store.get("ckey", null);
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}
function openCmt(ch, p, text) {
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");
  $("cmtText").value = ""; $("cmtStatus").textContent = "";
  renderOld();
  $("cmt").classList.add("open");
}
$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString() };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
</body>
</html>
