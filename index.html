 seen since approximately Wednesday, per the landlord. It said there were no signs of forced entry, no signs of a struggle, and that the tenant's vehicle was not at the address, which I could have told them, since he did not own a vehicle and never had. Petrakis had given the police a statement too, which was mostly about money. The tenant was two weeks behind on the rent. A moving company had been booked for the Saturday, a small outfit from across the river, and the movers had shown up and knocked and gone away again, and then sent Petrakis a bill for the trip, which he wanted the police to know he did not intend to pay. There was a list of what the officers had seen in the apartment, one line to a thing: <em>bed, unmade. Kitchen, dishes in sink. Framed family photographs on living room wall. Desk. No computer observed. Cat (1) in bedroom, door closed, removed by landlord.</em></p>\n<p>\"Two weeks behind on the rent,\" I said. \"I didn't know that at the time. I'd have lent it to him. He never said.\" I put the report back in its folder. \"And the movers. He'd told me he was going to move after the story ran, somewhere Carrow couldn't find him. I thought he meant eventually. He'd already booked them.\"</p>\n<p>\"For the Saturday,\" he said.</p>\n<p>\"For the Saturday.\" I shook my head. \"Anyway. It didn't help. I don't know why I brought it.\"</p>\n<p>I closed the box, and put it on the floor by my chair, and turned on the recorders.</p>\n<p>He did not say anything about any of it. He poured the tea, and looked at the box on the floor for a moment, and then he looked at the window.</p>\n<p>\"The fourteenth,\" he said. \"Good Friday.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 14, 1865</em></p>\n<p class=\"tape\">It was Good Friday. I want you to remember that, because nobody does. The churches were full that morning. The Catholics in the city were at their long service, and Mrs. Surratt would have been at St. Patrick's, the way she was most mornings, and the Protestant churches were open too, for the ones who kept the day. And the rest of the city was still half drunk on the end of the war, and the flags were still up, and the theaters were all playing, because it was Washington, and Washington had never been as pious as it pretended.</p>\n<p class=\"tape\">I did not go to church. I went to the National at ten o'clock, to find Booth.</p>\n<p class=\"tape\">He was not in. The clerk said he had gone out early, to the barber's, and would be back for his mail. I stood in the lobby for a while, not knowing what to do with myself. The dining room was being laid for luncheon. I looked for Damon among the waiters, the way I always did by then, and he was not there. I asked the headwaiter, in passing, as if it were nothing, and he said the man had asked for the morning off, which he never did, and had gone out early.</p>\n<p class=\"tape\">I thought: the woman on the west side of town. And I was glad for him, a little. And I put it away.</p>\n<p class=\"tape\">At a little after eleven I saw Booth come down the Avenue from the barber's, freshly shaved and in a very good humor, and turn up Tenth Street. And I followed him.</p>\n<p class=\"tape\">I do not know why I did it. I had been with him for two days waiting for him to tell me when. I think I had simply run out of patience with waiting. He did not look back. He walked the way he always walked, as if the street had been laid down for him that morning. And he went a block up Tenth Street and in at the front of Ford's Theatre.</p>\n<p class=\"tape\">He had his mail sent there. All the actors in Washington did; Ford's was a kind of home to them. I knew that. I had walked him there a dozen times. So I crossed to the other side of Tenth Street, and stood in the doorway of a shop across the way, and watched the door.</p>\n<p class=\"tape\">He was inside for no more than a few minutes. When he came out, he had a letter in his hand, and he was not reading it.</p>\n<p class=\"tape\">I have told you that I could not read his face on the night of the tenth. I could read it now. He stopped on the steps of the theater with a letter in his hand that he had forgotten he was holding, and he looked up at the front of that building, at the upper windows, the way a man looks at a house he has just been told is his.</p>\n<p class=\"tape\">Then he went down the steps, and walked away down Tenth Street toward the Avenue, fast, and did not see me.</p>\n<p class=\"tape\">I stayed where I was.</p>\n<p class=\"tape\">A minute later, a young man came out of the theater's front door onto the steps, bareheaded, in shirtsleeves, and called across the street to a man he knew who was passing. He called it cheerfully, the way a man calls it who has tickets to sell.</p>\n<p class=\"tape\">\"The President's coming tonight,\" he called. \"And General Grant! Tell everyone!\"</p>\n<p class=\"tape\">The man he called to waved his hat. A woman who was passing turned to look. A boy ran off down the street, already shouting it.</p>\n<p class=\"tape\">I stood in the doorway across Tenth Street and watched the news go out into the city from the steps of Ford's Theatre, the way a stone goes into a pond.</p>\n<p class=\"tape\">Tonight. Here.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>The woodstove ticked.</p>\n<p>\"That's how he found out,\" I said. \"Collecting his mail.\"</p>\n<p>\"That's how he found out. It's in every book. He went to get his letters, and they told him.\"</p>\n<p>\"And you were across the street.\"</p>\n<p>\"I was across the street.\" He picked up his cup, drank, and made a face. \"Cold,\" he said, and put it down. \"I had three names and three places, and now I had a time. The only one who didn't know what I knew was the one man who could have stopped all of it by simply staying home.\" He looked at me. \"Nobody was going to tell him. That was the thing I understood, standing in that doorway. The whole city was about to know he was coming. And the one thing nobody in it was going to tell him was <em>don't.</em>\"</p>\n<p>He was quiet for a moment.</p>\n<p>\"Except one,\" he said. \"But I didn't know that yet.\"</p>", "audio": false, "added": 1790597457671, "pt": [1790857526860, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790597457671, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790597457671, 1790694240640, 1790694240640, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790604858193, 1790597457671, 1790597457671, 1790861984290, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790784418993, 1790694240640, 1790597457671, 1790597457671, 1790743124692, 1790597457671, 1790597457671]}, {"num": 18, "title": "The Afternoon", "extra": false, "html": "<p>He did not make soup that day. He made sandwiches, and we ate them standing in the kitchen, and neither of us suggested sitting down. The box with <em>CARROW</em> on the lid stayed on the living room floor by my chair, where I had left it. I saw him glance at it once, through the doorway, and then away.</p>\n<p>When we went back in, he did not sit. He stood by the window.</p>\n<p>\"I had ten hours,\" he said. \"I want to tell you how I spent them, because I spent them well. That's important. I don't want you to think what happened that night happened because I was slow.\" He was quiet a moment. \"My leg was slow. I was not. Those are different things, and that night the difference mattered.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 14, 1865, afternoon</em></p>\n<p class=\"tape\">The first thing I did, a little after noon, was decide.</p>\n<p class=\"tape\">I had three men and three places and a time. I could not be in three places. I had to choose one, and I chose the theater, for two reasons. Booth was the only one of the three who would not lose his nerve; Powell would do anything, but Powell would do it only because Booth had told him to, and Atzerodt would go wherever the most brandy was. And Booth was the one I could get near. I was his friend. I could walk up to him anywhere in that city and he would smile and put his arm through mine.</p>\n<p class=\"tape\">It meant leaving Mr. Seward to his sons and his soldier nurse and a locked door. I knew that. I told myself that without Booth the others would lose their shape. I was half right.</p>\n<p class=\"tape\">So I would stop Booth. And I would do it the way I had taken back my drawings: quietly, so that nobody would ever know anything had almost happened.</p>\n<p class=\"tape\">The second thing I did was follow him.</p>\n<p class=\"tape\">When he came away from Ford's he went straight down to the Avenue and round behind the National, to a livery stable on C Street, a man named Pumphrey's, where he usually hired a horse. I stood across the street and watched him through the big open doors. He talked with Pumphrey a long time. He did not get the horse he usually had. They brought out a small bay mare instead, quick and nervous, with a white star on her forehead, and he walked round her twice and ran his hand down her legs, which he had not bothered to do with any horse in Charles County, and then said something and left her there, and came away. As he went out into the street, Pumphrey called after him, loud enough for the whole street to hear, not to tie the mare to anything, because she would break her halter.</p>\n<p class=\"tape\">A fast horse, chosen carefully, for later in the day. I thought about the Navy Yard Bridge. I thought about the sentry who stopped the ones coming in and let the ones going out go home, and about the backs of my mother's tobacco receipts, which I had burned, but which I had drawn in the first place, and which Booth had studied for three months.</p>\n<p class=\"tape\">He did not need the receipts anymore. He knew the road. I had taught it to him.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">A little after two, he went to H Street.</p>\n<p class=\"tape\">I did not go in. I stood on the corner, down the block, where I could see the steps. There was a hired buggy at the curb, with a horse and a young man holding it: Weichmann, who I had never let hear my name. Booth went up the steps and in at the door, and he was inside for a few minutes, no more. Then he came out alone and went away down the street, and did not look at the buggy.</p>\n<p class=\"tape\">A little while after, Mrs. Surratt came out and down the steps in her bonnet and shawl, ready for a drive. She was carrying a small package, done up in paper and string, about the size of a man's two fists. She put it in the buggy without looking at it. Then Weichmann helped her up and they drove away, south, toward the Navy Yard and the bridge and the county. Toward the tavern.</p>\n<p class=\"tape\">I stood on that corner and thought about that package for a long time.</p>\n<p class=\"tape\">I did not know what was in it. I want to be honest with you about that, because it came to matter a great deal, later, to a great many people. I did not know, and I could not have known, from the corner of the street. I only knew that Booth had gone into her house and talked with her, and that she had come out after him with a package, and was driving that afternoon to a tavern on the road he would take that night.</p>\n<p class=\"tape\">A woman who asks no questions she does not want the answers to. I had thought that of her the first night I met her. I thought it again, standing on that corner, and I did not like it any better.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At four o'clock I was on the Avenue near Willard's, because I had lost him for an hour and the Avenue was where you found people. Near Twelfth Street a tall Black man in a dark coat crossed the Avenue fast, toward the Kirkwood House, fast enough that a cab driver shouted at him. I noticed him the way you notice anyone moving faster than a crowd, and forgot him, because just then I found Booth. He was on the bay mare now, sitting her the way he sat every horse, as if he had been born on it, talking down from the saddle to a man on the sidewalk, an actor I knew a little, named Mathews. He handed Mathews an envelope. Mathews put it in his coat.</p>\n<p class=\"tape\">I have read since what was in it. Everyone has. It was a letter to the editor of the <em>National Intelligencer,</em> explaining to the country why he had done what he was about to do, and Mathews was to take it to the paper the next day. He was writing the reviews before the play had opened.</p>\n<p class=\"tape\">And while I watched, an open carriage came down the Avenue from the direction of the President's house, with a soldier driving and trunks strapped on the back, and a stocky man with a short beard in the back seat beside a woman in a traveling bonnet. People on the sidewalk pointed. Somebody cheered. It was General Grant and his wife, leaving the city.</p>\n<p class=\"tape\">Booth turned the mare's head and watched the carriage go by, and I watched his face. I had seen that face laugh, and rage, and play a whole theater fire on a church step. I had never seen it look the way it did then: like a man who has turned to the last page of a play and found it torn out. Then he wheeled the mare and went after the carriage at a walk, and drew up alongside it, close, and looked into it, at the general and his wife, for longer than any stranger should. Mrs. Grant drew back in her seat. Then the traffic closed between us, and I lost him again.</p>\n<p class=\"tape\">I went down to the railroad station later, because I had understood, and I needed to be sure. The Grants had taken the train north. They were going to see their children in New Jersey. They were not going to the theater.</p>\n<p class=\"tape\">Only the President, then. And his wife, and whoever they asked to sit with them in Grant's place. And no general in that box, with a general's instincts and a general's aides.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At six I went to Ford's and bought a ticket.</p>\n<p class=\"tape\">That was the third thing I did, and I was proud of it. I stood at the box office window and asked the man for a seat in the dress circle, and while he found me one I looked past him at the plan of the house pinned to the wall behind his head, the way a man looks at a picture while he waits. The dress circle ran round the theater in a horseshoe, one floor up. At the right-hand end of it, the stage end, there was a narrow door, drawn on the plan as a little break in the line. That door led into a short passage, and the passage led to the two boxes that had been thrown together to make the President's box.</p>\n<p class=\"tape\">One door. Anybody going into that box had to go through it. I bought the seat nearest to it that he had.</p>\n<p class=\"tape\">\"You won't see much of him from there, sir,\" the man said, handing me the ticket, meaning the President. \"Wrong side.\"</p>\n<p class=\"tape\">I said that was all right.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I will tell you my plan. It was a good one.</p>\n<p class=\"tape\">I did not mean to fight him. I was a lame boy with a cane, and he was one of the finest swordsmen on the American stage and had a pistol in his coat. I did not mean to go to the guard, because there would be a guard, and a guard would ask how I knew, and we have been through where that door led.</p>\n<p class=\"tape\">I meant to be loud.</p>\n<p class=\"tape\">Booth needed, more than anything, not to be seen. He needed to walk through that crowded dress circle as if he were nobody, one more gentleman going to the back for air. And he was the most famous young actor in America. If a man stood up in that dress circle, with the whole house there, and called out <em>Mr. Booth! Mr. John Wilkes Booth, as I live!</em> and came limping toward him with his hand out, delighted, making a fuss, then every head in that half of the theater would turn. Every one. Women would stand up to see him. The ushers would come. And he could not go through that little door with three hundred people watching him do it. Not then. Perhaps not that night at all.</p>\n<p class=\"tape\">It would not stop him forever. I knew that. But the Grants were gone, and the war was over, and the President might never be so easy to reach again. Every night I could buy was a night for somebody else to notice what I had noticed. It was the best plan I had.</p>\n<p class=\"tape\">It needed only one thing. It needed me to be in that dress circle when Booth came in.</p>\n<p class=\"tape\">At about half past eight I was standing on the pavement outside Ford's, in the crowd, with my ticket in my pocket, when the President's carriage came up Tenth Street. The play had already begun. The President was late.</p>\n<p class=\"tape\">I watched him get down. He was tired. You could see it in the way he stood a moment on the pavement, as if deciding. His wife on his arm, and a young officer and a young lady I did not know, and he went in through the front doors past me, near enough to touch. And a minute later, through the open doors, I heard the orchestra stop in the middle of whatever it had been playing, and start \"Hail to the Chief,\" and the whole house come to its feet with a roar.</p>\n<p class=\"tape\">I went in after them, and up the stairs, and found my seat, and turned it a little, so that I could see the door.</p>\n<p class=\"tape\">I sat there for an hour, with the play going on below me and people laughing, and I did not take my eyes off that door, or off the stairs from the lobby.</p>\n<p class=\"tape\">I was not the only one near it. There was a chair by the passage door, and a policeman in it when I sat down. After the first act he got up and went away down the stairs, and the chair stayed empty, and it did not fill again. And a few seats along from me, near the door, sat the President's man, a footman in livery, with his hat on his knee. I noted them both. A guard who was gone, and a servant who was not a guard.</p>\n<p class=\"tape\">And at a little after half past nine, somebody touched my shoulder from behind, very lightly, and said, in a low voice that had to wait for its first word:</p>\n<p class=\"tape\">\"M-Mister Keene.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there.</p>\n<p>I waited for him to turn around, to tell me who had spoken. When he didn't, I looked down at the notebook in my lap. I had stopped taking notes without noticing. The last thing on the page was one word in the margin, written very small: <em>loud.</em> I had underlined it twice.</p>\n<p>\"That was a good plan,\" I said. I had meant to ask what happened next.</p>\n<p>\"It was a very good plan,\" he said. \"I've had a long time to look for the hole in it, and I've only ever found one.\"</p>\n<p>\"Someone else was watching the same door.\"</p>", "audio": false, "added": 1790597725855, "pt": [1790694240640, 1790694240640, 1790767768318, 1790597725855, 1790767768318, 1790597725855, 1790604858193, 1790767768318, 1790597725855, 1790604858193, 1790597725855, 1790597725855, 1790597725855, 1790604858193, 1790604858193, 1790597725855, 1790861984290, 1790597725855, 1790767768318, 1790597725855, 1790597725855, 1790767768318, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790604858193, 1790604858193, 1790767768318, 1790597725855, 1790597725855, 1790597725855, 1790861984290, 1790597725855, 1790604858193, 1790597725855, 1790597725855, 1790597725855, 1790604858193, 1790597725855, 1790597725855, 1790597725855, 1790861984290, 1790768285184, 1790768285184, 1790768285184]}, {"num": 19, "title": "The Message", "extra": false, "html": "<p>\"Go on,\" I said.</p>\n<p>He looked at the clock on the wall. It was twenty past three.</p>\n<p>\"I'll tell you what he said,\" he said, \"and then I'll tell you what each of us saw. Everything I saw gave me a reason to believe him, Ms. Barnett. That's what makes it unbearable.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 14, 1865, a little after half past nine</em></p>\n<p class=\"tape\">I turned in my seat, and Damon was standing in the aisle behind me, bent a little toward me.</p>\n<p class=\"tape\">He was in his white jacket from the National. That was how he had got in. I understood it at once, and I admired it, even then. A Black man in the dress circle of Ford's Theatre on a Friday night would have been stopped at the foot of the stairs and asked his business. But a hotel waiter in a hotel jacket, with a folded note in his hand, looking for a gentleman, is not a man. He is a message. The ushers had let him up without a second look. The people in the seats around me did not look at him at all.</p>\n<p class=\"tape\">He held out a folded note, the way a waiter holds out a bill on a tray.</p>\n<p class=\"tape\">\"F-from Mister B-Booth, sir,\" he said, very low, under the laughter from the stage.</p>\n<p class=\"tape\">Then he straightened up, and stepped back, and stood waiting, with his hands behind him, to see whether there would be an answer.</p>\n<p class=\"tape\">I unfolded it. It was Booth's hand. I had seen that hand all winter, on letters and cards and the backs of playbills, big and fast and slanting, the hand of a man who has signed a great many autographs and enjoyed every one. Four lines, written in a hurry:</p>\n<p class=\"tape\"><em>Kit. The Dutchman has lost his nerve. I have gone to the Kirkwood to see to it myself. Come at once. The theater will keep. J.W.B.</em></p>\n<p class=\"tape\">I read it twice. For a man in a hurry, there was not a blot on it. In the aisle, Damon's hand came out from behind his back, an inch, no more, the way a waiter reaches for a plate before you have quite finished. Then it went back.</p>\n<p class=\"tape\">I noticed how cleanly it was written, and let it go. The play had half an hour left in it, the Kirkwood was four blocks off, and I had a bad leg. At four o'clock that afternoon I had watched him hand Mathews a letter to the newspapers explaining the whole thing. A man who puts his reasons in a letter to the <em>Intelligencer</em> does not worry about four lines to a friend. And he had sent them by the one messenger nobody ever looks at.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I want to tell you what I thought, in the next half minute, because I thought very clearly, and every step of it felt sound.</p>\n<p class=\"tape\">First: that the note was Booth's. I knew the hand. And it knew things nobody knew who was not inside: the Kirkwood, the Vice President, that there was a man assigned to him, and that the man was a German, the kind to lose his nerve.</p>\n<p class=\"tape\">Second: that Booth had trusted Damon to carry it. And if he had, then everything I had seen in six weeks turned over and showed a second face. Damon had been at Booth's elbow, one way or another, since the first night I saw him at the National. Waiting on Booth's table. Listening to every word Booth said. Standing at the top of the back stairs at midnight outside Booth's room, as if he had been waiting there for somebody to come out. On the lawn when Booth said <em>the last speech he will ever make.</em> Taking the morning off, today of all days, the day Booth learned the President was coming. Everywhere Booth went, Damon had been, a few steps off, unseen.</p>\n<p class=\"tape\">And Booth, I knew, tipped every waiter in that hotel too much, and knew them all by name, and thought of them as furniture. What better man for an errand, on a night like this, than one nobody would ever look at twice? Booth was vain, and careless with paper, but he was not a fool. A waiter from the National, who could go anywhere in a white jacket, carrying messages, watching doors. It was exactly what I would have done.</p>\n<p class=\"tape\">And he knew where to find me. Nobody had told Booth I would be at Ford's that night. So somebody had been watching me for him, and there was his waiter, standing in the aisle.</p>\n<p class=\"tape\">I had thought the letter at midnight was a love letter. That turned over too.</p>\n<p class=\"tape\">Third: that the message made sense. That was the worst of it. It fit everything I knew. Atzerodt losing his nerve was the most likely thing in the world; I had thought, the first time I met him, that when the thing came close he would find he had somewhere else to be. And if he had, then Booth was exactly the man to go and do it himself. The play had more than half an hour to run. Booth knew every line of it. He could be at the Kirkwood and back before the third act turned. Two in one night, instead of one. That was Booth. That was the man who had walked up and down Gautier's with his cigar, lowering an invisible President over an invisible rail.</p>\n<p class=\"tape\">And fourth: that if Booth was at the Kirkwood, then Booth was not here. He was four blocks away, alone, in a hotel, going up a staircase toward the Vice President. And if I could reach him there, I could stop both of them. Johnson and the President. In one place. Tonight.</p>\n<p class=\"tape\">If I stayed, I kept the door and lost Johnson, and Booth would come back up those stairs with one murder behind him and nothing left to lose. If I went, I might stop both.</p>\n<p class=\"tape\">I would check. I was not a fool either. I would ask at the Kirkwood desk before I did anything at all, and if Booth had not been there, I would know the message was false, and I would come straight back.</p>\n<p class=\"tape\">It took me perhaps half a minute to think all of that. I got up, and took my cane, and went past Damon up the aisle toward the stairs.</p>\n<p class=\"tape\">At the top of the stairs I looked back.</p>\n<p class=\"tape\">Damon had not followed me. He was standing against the back wall of the dress circle, near the corner, not far from that narrow door at the end, with his hands behind him, still and patient, like a servant waiting for his gentleman to come back. Waiting, I thought, for Booth.</p>\n<p class=\"tape\">It was exactly where I would have put him.</p>\n<p class=\"tape\">Then I went down. I missed the second stair and caught the rail.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>\"And what had he seen?\" I said. \"Damon.\"</p>\n<p>\"He saw a man he had known on a farm, who came back from the war changed, and cold, and whom he had never liked. Who went to Washington in the winter and began to eat his dinners at John Wilkes Booth's own table, in a coat that Booth had paid for. Who came to the side door of the National on the night of the seventeenth of March, the night the plotters were supposed to take the President, with mud to his knees and a saddled horse on a lead with nobody to ride it. Who stood at Booth's elbow on the lawn when Booth said <em>the last speech he will ever make,</em> and did not so much as turn his head. Who came out of Booth's room at midnight with his shirt full of papers.\" He held up his hand, and turned it over, and looked at it. \"And who, on the night the President came to Ford's Theatre, had bought the seat in the dress circle nearest to the only door into the President's box, and sat in it for an hour, with his eyes on that door and on the stairs, and did not watch the play.\"</p>\n<p>He put his hand down.</p>\n<p>\"What would you have thought I was?\"</p>\n<p>I did not answer.</p>\n<p>\"He thought I was the one who would hold the door,\" he said. \"Booth's man, placed there to keep the way clear. And he was right about everything he had seen. Every single thing. He was only wrong about me, and there was no way on earth for him to know that, because the only thing that had changed was inside my head.\" He smiled, very slightly.</p>\n<p>\"So he sent you to the Kirkwood.\"</p>\n<p>\"The Kirkwood.\" He picked up the pencil and turned it in his fingers. \"In Booth's own hand. I would have sworn to that note in any court in the country. He had carried Booth's letters to and from the hotel desk all winter, dozens of them. That was enough for him. It was the best forgery I have ever held, and I have held a few.\"</p>\n<p>\"Do you still have it?\"</p>\n<p>\"It went into a gutter on Tenth Street that night, in pieces. A letter in Booth's hand, calling me to come and help him, was not a thing to be found with.\" He turned the pencil over. \"I've spent a long time wondering how he knew about Atzerodt. That he'd lose his nerve. Booth never said it in front of him. I'm nearly sure of that. He must have watched Atzerodt the way he watched all of us, and worked it out for himself.\" He shook his head. \"He was right about that too.\" He put the pencil down. \"And he knew about the card. I have never worked out how he knew about the card. But that's the Kirkwood, and we aren't there yet.\"</p>\n<p>I looked at the clock. It was nearly four.</p>\n<p>\"You checked,\" I said. \"At the Kirkwood. You said you would check.\"</p>\n<p>\"I did check.\" He stood up, slowly, one hand on the arm of the chair. \"And it was true. That's next week, Ms. Barnett. I find that I'm tired.\"</p>\n<p>I wanted to argue. Then I looked at his face and did not.</p>\n<p>On the porch, while I was finding my keys, he said, \"The box.\" He nodded at it, under my arm, the one with <em>CARROW</em> on the lid. \"You brought it for a reason. You just haven't found the reason yet.\"</p>\n<p>\"I told you. I don't know why I brought it.\"</p>\n<p>\"No,\" he agreed. \"But you will.\"</p>", "audio": false, "added": 1790597844961, "pt": [1790694240640, 1790604858193, 1790861698841, 1790597844961, 1790861984290, 1790597844961, 1790768771004, 1790768771004, 1790861984290, 1790768771004, 1790768771004, 1790769224526, 1790863360036, 1790855175738, 1790768771004, 1790768771004, 1790768771004, 1790604858193, 1790604858193, 1790861984290, 1790597844961, 1790604858193, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790604858193, 1790597844961, 1790855175738, 1790597844961, 1790597844961, 1790597844961, 1790694240640, 1790604858193, 1790604858193, 1790768893322, 1790768771004, 1790768771004, 1790694240640, 1790694240640, 1790597844961, 1790694240640, 1790694240640, 1790597844961, 1790597844961]}, {"num": 20, "title": "The Kirkwood", "extra": false, "html": "<p>I did not bring the box the next week. I thought about it, standing in the closet with the light on, and left it where it was.</p>\n<p>But on the Monday I looked up Petrakis. It took me twenty minutes. He had sold the building four years ago, and the dry cleaner's was a smoothie place now, and he lived with his daughter in a split-level house in Silver Spring. The daughter answered and said he didn't talk to reporters, and then Petrakis took the phone from her and said he would talk to whoever he liked.</p>\n<p>He remembered me. He remembered the carpet, and he told me again who had never paid for it, and I let him.</p>\n<p>Then I asked about the cat.</p>\n<p>\"Pearl,\" he said at once. \"Gray, white feet. Nice cat. Stupid, but nice.\"</p>\n<p>Pearl. I wrote it down, and something in my chest let go that I had not known was holding on.</p>\n<p>\"The police found her shut in the bedroom,\" I said. \"Did he do that often?\"</p>\n<p>\"Only when somebody came up. Every time that door opened, out she went, down the stairs and into the cleaner's, and then I'm the one on my knees under the pressing machine. Twice I did that. After the second time I told him, somebody comes to your door, you put the cat away first. And he did. He was a good tenant, except the rent.\"</p>\n<p>I did not say anything for a moment.</p>\n<p>\"So if she was shut in,\" I said, \"somebody had come up.\"</p>\n<p>\"Sure. Somebody came up.\" I could hear a television somewhere behind him, and his daughter asking who it was. \"Six years, and you call about the cat?\"</p>\n<p>\"Mostly about the cat.\"</p>\n<p>\"You found him? You know where he went?\"</p>\n<p>\"No,\" I said. \"I don't.\"</p>\n<p>I did not tell him about Pearl that Thursday. It had been his idea to ask. I wanted, this once, to be the one who knew what the answer meant.</p>\n<p>He was waiting on the porch when I drove up, already in his coat, as if he had been standing there a while, with the umbrella furled though it was not raining. He did not make small talk. He did not make tea. When I had set out the recorders and said the date and the time, he began before I had finished writing it down, as if he had been saying it to himself all week and was only now letting me hear.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 14, 1865, a quarter to ten</em></p>\n<p class=\"tape\">The Kirkwood House stood at the corner of Twelfth Street and the Avenue. It was not grand, the way the National was. It was a plain, busy, respectable hotel, the kind congressmen stayed in when they did not want to be seen spending money, and it was four blocks from Ford's. I did those four blocks faster than I had walked anywhere since Fort Stevens. My leg did not like it. I did not ask it.</p>\n<p class=\"tape\">The lobby was bright and nearly empty. A clerk at the desk. Two men in chairs with newspapers. And through an open door on the left, the bar, with the noise of a Friday night coming out of it.</p>\n<p class=\"tape\">I went to the desk. I made myself slow down before I got there, and lean on the cane a little, and smile. A lame young man with a pleasant face, asking after a friend.</p>\n<p class=\"tape\">\"Has Mr. Booth been in?\" I said. \"The actor. John Wilkes Booth.\"</p>\n<p class=\"tape\">The clerk's face did what everyone's face did at that name. \"Mr. Booth? Yes, sir, he was in.\" He was pleased to know it. \"Left his card for Mr. Browning. That's the Vice President's secretary.\" He lowered his voice, the way people do when they are telling you something about the great. \"Wanted to know was Mr. Johnson at home.\"</p>\n<p class=\"tape\">So it was true.</p>\n<p class=\"tape\">I stood at that desk and felt it go through me. Damon had not lied. Booth had been here, asking for Johnson. Everything in the note had held.</p>\n<p class=\"tape\">I would have asked when in the next breath. I never got to the next breath.</p>\n<p class=\"tape\">Through the open door of the bar, over the clerk's shoulder, I saw Atzerodt.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He was at the far end of the bar, alone, in a dark coat, with a glass in front of him that was not his first. His hat was pushed back. His face had the loose, shining look of a man who has been drinking for courage for an hour and has found it does not come from there. As I watched, he leaned across the bar and said something to the bartender, low, and the bartender looked at him oddly and shook his head and moved away to someone else.</p>\n<p class=\"tape\">I found out later what he had asked. Everyone did. It came out at the trial. He had asked where the Vice President's room was, and what sort of man he was.</p>\n<p class=\"tape\">And upstairs, I knew, one floor above the Vice President's rooms, was a room Atzerodt had taken that morning in his own name. I did not know then what he had left in it. They found it the next day: a loaded revolver under the pillow, and a long knife between the sheets and the mattress, and Booth's bankbook in the pocket of a coat.</p>\n<p class=\"tape\">I did not need to know that, standing in the lobby. I only needed to look at him.</p>\n<p class=\"tape\">I have told you what I thought about Atzerodt the first time I met him: that he would say yes to anything, cheerfully, as long as it was far away, and that if it ever came close, he would find he had somewhere else to be. Looking at him through that door, I saw that I had been right, and also that I had not been right enough. He had not found somewhere else to be. He was sitting forty feet below the Vice President, with a room upstairs and a weapon in it, and he was drinking. A frightened man who drinks can go either way. He can drink himself out of it. Or he can drink until the fear goes quiet for ten minutes, and in those ten minutes he can climb a flight of stairs.</p>\n<p class=\"tape\">Booth was not in the bar or the lobby. He had asked whether Johnson was in and left a card, the way a man checks a door before he comes back to open it. So either he was coming back, or he was upstairs already. Either way, the man with the room and the knife was sitting in front of me.</p>\n<p class=\"tape\">So I did the only thing that made sense. I went into the bar.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Atzerodt saw me in the mirror behind the bar before I reached him, and I saw his face do three things, one after another. Fear, first, because anyone coming toward him that night was something to fear. Then he knew me, and there was relief: Keene, the lame boy, the one who knew the roads. And then, right behind the relief, a terrible hope.</p>\n<p class=\"tape\">I did not sit down. I leaned on the bar beside him with my cane between us, and I did not look at him. I looked at the bottles, the way two men do who are not together.</p>\n<p class=\"tape\">\"He says leave it,\" I said.</p>\n<p class=\"tape\">I said it quietly, the way I had heard Booth say things all winter, as if it were already settled and I were only passing it along.</p>\n<p class=\"tape\">Atzerodt turned his head and stared at me.</p>\n<p class=\"tape\">\"Leave it,\" I said again. \"It's off. He said to find you and tell you. Go get your horse and go home. Go anywhere. Don't go upstairs, don't go back to your room. Just go.\"</p>\n<p class=\"tape\">That was the lie I told him. I had worked it out on the four blocks from Ford's, in case I needed it. It was not a clever lie. It did not need to be. It only needed to be the thing he most wanted to hear, said by someone he believed was close to Booth. Nobody questions the thing he most wants to hear. I have used that in a great many lives. I am not proud of how often.</p>\n<p class=\"tape\">He did not question it. I watched it go into him like warmth. His shoulders came down. He let out a breath that he must have been holding since eight o'clock.</p>\n<p class=\"tape\">\"He is not angry?\" he said. His accent was always thicker when he drank. \"I told him. At the house, tonight. I told him, I did not come for killing. I came for the other thing, the taking. Not this. I told him.\"</p>\n<p class=\"tape\">\"He's not angry,\" I said. \"Go.\"</p>\n<p class=\"tape\">He put money on the bar, too much of it. He picked up his hat. He went out of the bar and through the lobby and out the front doors onto the Avenue without once looking at the staircase, and I stood at the bar and watched him in the mirror until he was gone.</p>\n<p class=\"tape\">He said afterward, in the statements he gave after they arrested him, that he had refused Booth. That he had never meant to go through with it. I believe that was true, as far as it went. He had refused the moment somebody gave him leave to.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I stood there for a moment, with my hand on the bar.</p>\n<p class=\"tape\">The Vice President was asleep upstairs. I learned later that he had gone to bed early that night. He did not know, and he never knew, that a drunk carriage painter with a knife in his room had sat forty feet below him, working up to it, and that a lame boy had sent him home. It is not in any book. It is not in the trial record. The record says only that Atzerodt lost his nerve, and drank, and left. That is true. That is exactly what happened.</p>\n<p class=\"tape\">It was the only thing I did that night that worked.</p>\n<p class=\"tape\">And standing there, with the noise of the bar going on around me, I thought: <em>where is Booth?</em></p>\n<p class=\"tape\">He had sent me here to help with Johnson. The note said he had come to see to it himself. He was not in the bar, and Atzerodt had not seen him, or he would have said. He was not upstairs either. The house was quiet, and a clerk does not sit calmly at his desk under a floor where the Vice President is being killed. If Booth had meant to come, he would have been here before me. He had a fast horse, and I had a cane.</p>\n<p class=\"tape\">I went back to the desk.</p>\n<p class=\"tape\">\"Mr. Booth,\" I said to the clerk. \"When he left his card. What time was that?\"</p>\n<p class=\"tape\">The clerk thought about it. \"This afternoon, sir,\" he said. \"Three o'clock, maybe. Half past. Mr. Browning had it by five.\" He looked at me, curious now. \"Were you to meet him?\"</p>\n<p class=\"tape\">This afternoon.</p>\n<p class=\"tape\">I have told you that knowing a thing is not the same as knowing it. That was a night I learned it again. It all turned over in me at once, the whole half minute in the dress circle, every step that had felt so sound, like a card turned face up on a table.</p>\n<p class=\"tape\">Booth had not come to the Kirkwood tonight. Booth had never been coming. The card was six hours old, and it was true, and it had been chosen because it was true, because I would check, and it would hold. Somebody had wanted me out of that dress circle. Out of the seat by the only door. And had found the one message that would move me, and made it true enough to check.</p>\n<p class=\"tape\">Written in Booth's hand, down to the last stroke, and not a blot on it. I had noticed that in the dress circle and let it go. Anyone can write four clean lines in a hurry, once. But a man copying another man's hand does not hurry at all. He sits up with it, and gets every letter right, and it comes out clean because it has to.</p>\n<p class=\"tape\">He was not Booth's man. Booth's man would never have sent Booth's backup away from the door. There was only one reason to empty that seat.</p>\n<p class=\"tape\">He thought I was guarding it.</p>\n<p class=\"tape\">And he was standing by it now, in his white jacket, against the back wall, alone. And Booth, who had not been at the Kirkwood, was somewhere I had just walked away from.</p>\n<p class=\"tape\">I looked at the clock over the desk. It was eight minutes past ten.</p>\n<p class=\"tape\">I went out through the doors onto the Avenue and turned east, toward Tenth Street, and I ran. I had not run since July. I had a cane and a leg with a Union bullet hole through it, and I ran.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. His hands were shaking. I had never seen them shake.</p>\n<p>\"I'm going to stop there,\" he said, \"for a minute.\"</p>\n<p>He got up and went into the kitchen, and I heard the tap run, and run, and after a while stop. I sat in the living room with the woodstove ticking and the two red lights on the recorders, and I did not follow him, and I did not turn them off.</p>", "audio": false, "added": 1790598338018, "pt": [1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790649507387, 1790694240640, 1790694240640, 1790784418993, 1790694240640, 1790694240640, 1790784418993, 1790784418993, 1790784418993, 1790694240640, 1790694240640, 1790784418993, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790768771004, 1790604858193, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790604858193, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790861984290, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790768771004, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790855175738, 1790598338018, 1790769216738, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790694240640, 1790598338018, 1790694240640]}, {"num": 21, "title": "Tenth Street", "extra": false, "html": "<p>He came back after ten minutes with a glass of water he did not drink. He set it on the table by the notepad and sat down, and his hands had stopped shaking, and he put them flat on his knees anyway, as if to keep them there.</p>\n<p>\"Four blocks,\" he said. \"I had done them in six minutes on the way there. I did them in seven on the way back, running, because the leg had spent everything it had on the way there. I've gone over it more times than I can tell you. There was nothing in those seven minutes I could have done faster.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 14, 1865, a quarter past ten</em></p>\n<p class=\"tape\">Tenth Street was quiet when I turned into it. That is what I remember first. A quiet street at night, gaslit, with carriages waiting along the curb for the end of the play, and the drivers dozing on their boxes, and a boy selling something at the corner. The front of Ford's was lit and its doors were open to the street, and I could hear the play from the street, faintly, one man's voice.</p>\n<p class=\"tape\">I knew that play. Everyone did; it had been running in one theater or another for years. And I knew where in it we were. I had sat through the first two acts from my seat by the door, listening with half my mind. We were in the third act. One of the actors was alone on the stage, and I could hear his voice rising toward the line that always got the biggest laugh of the night.</p>\n<p class=\"tape\">I was thirty yards from the doors. I was running on a leg that had stopped being a leg some blocks back and become only a thing I threw forward and landed on.</p>\n<p class=\"tape\">The laugh came out through the open doors like a wave breaking. The whole house, all at once.</p>\n<p class=\"tape\">And inside it, very small, very flat, a single crack. Like a stick broken over a knee.</p>\n<p class=\"tape\">Most of the people on Tenth Street did not hear it. The drivers did not stir. I heard it because I was listening for it, and because I had heard a great many pistols, and there is no other sound in the world quite like one fired indoors.</p>\n<p class=\"tape\">For a moment nothing happened. Then small things happened, all along Tenth Street. A carriage horse threw up its head, and its driver did not wake. The boy at the corner stopped calling whatever he was selling and turned to look at the doors. My foot came down wrong, and the leg went, and I caught myself on the wheel of a hack and hung there. And inside, the laugh went on for a second longer than it should have. Then it broke off, raggedly, the way a laugh does when half the people laughing have stopped and the other half have not yet understood why. And then, in the silence after it, a woman screamed.</p>\n<p class=\"tape\">I have heard that scream in my sleep for a hundred and sixty years.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I got to the doors. I got into the lobby. People were beginning to come out of the inner doors toward me, not running yet, only standing up and turning, with their faces open and stupid, the way faces are in the first second before they understand. I pushed through them. I got to the inner doors and I could see the stage, down the long slope of the house, bright under the gas.</p>\n<p class=\"tape\">A man was on the stage.</p>\n<p class=\"tape\">He was down on one knee, in the middle of it, as if he had fallen, and he was getting up. He had something in his hand that caught the light, and a flag was trailing from somewhere above him, torn half off the front of the box, hanging. He got to his feet. He turned toward the audience, toward all of us, and he raised the thing in his hand, and he shouted something.</p>\n<p class=\"tape\">I could not hear the words. The screaming had started by then, and the noise of a thousand people getting to their feet at once. People told the newspapers afterward that it was <em>Sic semper tyrannis,</em> thus always to tyrants, the motto of Virginia. Some of them heard that. Some heard <em>the South is avenged.</em> Some heard nothing at all. I heard nothing. I only saw his face, from the back of the house, lit from below by the footlights, the way I had seen it a dozen times on a stage, playing a king.</p>\n<p class=\"tape\">It was the happiest I ever saw him.</p>\n<p class=\"tape\">Then he turned and ran across the stage, limping, and into the wings, and was gone.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I knew where he was going.</p>\n<p class=\"tape\">That was the one thing I still had. I knew him. I knew the mare with the white star, and I knew he had not tied her at the front. The front of the theater was on Tenth Street, with a hundred people in it. The back of the theater opened onto an alley, and the alley ran out to F Street and to the dark, and that was where a man would leave a fast horse, with somebody to hold her, because Pumphrey had told him she would break her halter if he tied her.</p>\n<p class=\"tape\">I could not go through. Between me and that stage were a thousand people on their feet, and half of them were already pouring down the aisles toward it, and men were climbing up over the footlights. The quickest way to the back of Ford's was around the outside.</p>\n<p class=\"tape\">I turned around in that lobby and fought my way back out through the doors against the crowd that was beginning to come out behind me, and down the steps, and along the front of the building, to where the narrow passage ran between Ford's and the building next door, back toward the alley.</p>\n<p class=\"tape\">It was dark in the passage. I ran into the wall once and did not feel it. I came out at the far end into the alley behind the theater, and the back door of the stage was standing open, and there was light coming out of it and noise.</p>\n<p class=\"tape\">And there was a boy on the ground, holding his head. And there were hoofbeats going away fast up the alley toward F Street, and then nothing.</p>\n<p class=\"tape\">I stood in the alley with my cane.</p>\n<p class=\"tape\">I had taught him that road. The Navy Yard Bridge, the sentry who stopped the ones coming in and let the ones going home go home. The ridge road. The long way round the swamp. The farms where a man could be hidden. I had drawn every inch of it on my mother's tobacco receipts, and I had burned the receipts, and it did not matter in the least, because he knew it all by heart.</p>\n<p class=\"tape\">The boy on the ground was crying. I helped him up. He was the boy who held horses for the actors; I had seen him before, running errands around the theater. Booth had struck him with the handle of a knife, he said, to make him let go of the reins. He did not know why. He kept asking me why. I did not tell him.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">When I came back around to Tenth Street it was full.</p>\n<p class=\"tape\">It had filled the way water fills a lock, all at once, from every direction. People had come out of Ford's and people had come out of every house and saloon and boarding house on the street, and soldiers were arriving, running, from somewhere, and nobody knew anything, and everybody was shouting what they knew. The President was shot. The President was dead. The President was not hurt at all. It was a rebel army. It was an actor. It was Booth, it was Booth, somebody had seen him, it was John Wilkes Booth.</p>\n<p class=\"tape\">Across the city, in the same minutes, though I did not know it yet, Powell was standing on the steps of the Seward house on Lafayette Square, with a little package in his hand, telling the young Black servant who opened the door that he had brought medicine from Mr. Seward's doctor, and that he had orders to put it into no hands but the patient's. The servant told him he could not go up. Powell went up anyway, heavy on the stairs, and the servant followed him, protesting all the way.</p>\n<p class=\"tape\">Seward's son Frederick met him on the landing, and told him his father was asleep, and to give him the medicine. They argued there, at the top of the stairs, in low voices, for a minute or more. Then Powell turned as if to go down, and turned back with a revolver in his hand, and pulled the trigger, and it misfired. So he beat Frederick Seward over the head with it until the gun broke, and went through the bedroom door with a knife. There was a soldier nurse in that room, and a daughter, and then another son, and then a messenger from the State Department who had come in the door at the wrong moment, and Powell cut every one of them who came near him, and reached the bed, and stabbed the Secretary of State in the face and the neck as he lay there with his broken jaw and his broken arm. Then he ran down the stairs and out into Lafayette Square, shouting <em>I'm mad! I'm mad!</em>, and got on his horse. Herold, who was meant to be holding it and guiding him out of a city he did not know, had heard the screaming and ridden away.</p>\n<p class=\"tape\">Seward lived. The metal brace on his jaw, they said, turned the knife. Nobody in that house died. I have always counted that as the one piece of luck in the whole night, and it was not mine.</p>\n<p class=\"tape\">Powell had ridden to Seward's door on a big dark bay that was blind in one eye. It was the horse Booth had bought from Gardiner in December, the poor horse for a rich man that the whole of Charles County had laughed about. Soldiers found it a little after midnight on the eastern edge of the city, lathered and riderless. Within a week they knew where it had been bought, and who had sold it, and that Dr. Mudd had been standing beside Booth when he paid for it.</p>\n<p class=\"tape\">And at the Kirkwood, the Vice President was asleep upstairs, and in the bar below him the stool where Atzerodt had sat was empty.</p>\n<p class=\"tape\">I had spent my ten hours well. I had bought a ticket and chosen a seat and watched a door for an hour, and walked away from it on a forged note, and the old man I had left to his sons and a locked door had been stabbed in his bed. That was what I had done with my ten hours.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Then the doors of Ford's opened wider, and I saw that they were carrying him out. A knot of men came down the steps, slowly, carefully, carrying something between them, and the crowd fell back and went silent in a wave that ran out ahead of them down the street. I saw a long body, and a head held in a man's hands, and a pair of long legs. Somebody was shouting to clear the way. Somebody was shouting, <em>Where can we take him? Where?</em></p>\n<p class=\"tape\">Across the street, a door opened, at the top of a flight of curving steps, in a narrow brick house, and a man stood in it with a candle, and called to them to bring him in there.</p>\n<p class=\"tape\">They carried him across Tenth Street and up those steps and in, and the door closed.</p>\n<p class=\"tape\">I stood on the pavement across from that door, in the crowd, with my cane.</p>\n<p class=\"tape\">And after a while I understood that the man standing next to me, very still, in a white hotel jacket, was Damon.</p>", "audio": false, "added": 1790598705203, "pt": [1790598705203, 1790604858193, 1790598705203, 1790604858193, 1790598705203, 1790598705203, 1790861984290, 1790598705203, 1790861984290, 1790861984290, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790784418993, 1790598705203, 1790598705203, 1790604858193, 1790598705203, 1790598705203, 1790604858193, 1790598705203, 1790598705203, 1790784418993, 1790784418993, 1790784418993, 1790692270737, 1790598705203, 1790784418993, 1790861984290, 1790598705203, 1790598705203, 1790598705203, 1790598705203]}, {"num": 22, "title": "The Vigil", "extra": false, "html": "<p class=\"tape tape-head\"><em>April 14 to 15, 1865</em></p>\n<p class=\"tape\">We did not speak for a long time.</p>\n<p class=\"tape\">The soldiers came, a whole company of them at the double, and pushed the crowd back from the house and out of the street, and made a line. We were pushed back with everyone else, the two of us, and we ended up against the front of a building on the Ford's side of the street, almost opposite those curving steps, and we stood there. Neither of us left. There was nowhere either of us could have gone.</p>\n<p class=\"tape\">The crowd never went home. It grew. It stood in the street all night and hardly made a sound. Every so often a carriage came, and a man got down and was let through the line and went up the steps and in: a general, a senator, a member of the Cabinet, one of the President's secretaries. And every time the door opened, the whole street leaned toward it, and the door closed again, and the street settled back.</p>\n<p class=\"tape\">The upstairs windows were lit. Somebody said he was in a room at the back, on the ground floor, in a bed too short for him, so that they had to lay him across it slantwise. Somebody said the surgeon general was there. Somebody said there was no hope. Somebody said there was. Once or twice a doctor came out onto the steps for air, with his sleeves pushed up to the elbow, and went back in.</p>\n<p class=\"tape\">Damon stood beside me in his white jacket, which was too thin for the night. The fog was coming up off the river. He did not move. He watched the door.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">It was past midnight when I spoke.</p>\n<p class=\"tape\">\"You sent me to the Kirkwood.\"</p>\n<p class=\"tape\">He did not turn his head. After a long time, he said, \"Y-yes.\"</p>\n<p class=\"tape\">\"Because you thought I was holding the door for him.\"</p>\n<p class=\"tape\">\"You were s-sitting by it.\" Each word pushed through. \"For an hour. W-watching it. Not the play.\"</p>\n<p class=\"tape\">\"I was waiting to stop him.\"</p>\n<p class=\"tape\">He turned then, and looked at me, and I watched him read my face in the light from the windows across the street. Left to right, and down. The way he had read the newspaper in the kitchen yard, and me on the porch the morning he left. He did it slowly this time. He was looking for the lie.</p>\n<p class=\"tape\">He did not find one. I saw the moment he did not find one. Something in his face went, very quietly, the way a wall goes when the mortar has been washed out of it for years and it is only now, all at once, that anyone sees.</p>\n<p class=\"tape\">\"H-how?\" he said.</p>\n<p class=\"tape\">So I told him. Not all of it. The seat by the door. The plan to stand up and shout Booth's name, so that the whole dress circle would turn and look and he could not go through. He listened without moving.</p>\n<p class=\"tape\">Then I told him what I had worked out on the pavement in the last hour, because I could not stop myself working things out, not even that night.</p>\n<p class=\"tape\">\"And you stayed,\" I said. \"After I left. You meant to tell the President's man? The footman by the door? One servant to another, the only man in that dress circle who might have listened to a waiter.\"</p>\n<p class=\"tape\">He nodded once. \"I tried. He wouldn't listen.\"</p>\n<p class=\"tape\">\"And then you were only a Black man standing in the dress circle of Ford's Theatre, with no gentleman to wait on.\" I watched his face. \"An usher told you to go down? To the lobby, the foot of the stairs, where every man going up had to pass you?\"</p>\n<p class=\"tape\">He nodded again.</p>\n<p class=\"tape\">\"Did you try to stop him?\"</p>\n<p class=\"tape\">His jaw set. I watched him wait for the first word, the way I had watched him wait for it at the National, with that terrible patience. It would not come. His mouth worked, and nothing, and nothing, and he closed his eyes.</p>\n<p class=\"tape\">And I thought I understood. Booth had come in off the street, and walked across the lobby past a waiter in a white jacket, and the waiter had opened his mouth to say <em>stop,</em> or <em>help,</em> or <em>that man,</em> or anything at all to anyone in that lobby. And the first sound had caught, the way it always caught. And by the time he got it out, Booth was up the stairs.</p>\n<p class=\"tape\">\"Yes,\" he said at last. Very quietly. It came without a stumble.</p>\n<p class=\"tape\">Then he told me the rest, in short pieces, looking at the house across the street and not at me.</p>\n<p class=\"tape\">\"I stood in his way. At the foot of the stairs.\" A breath. \"The usher knew him. He took my arm and moved me to the wall, so the gentleman could pass.\" Another. \"I had the word ready. I never got it out. He was on the stairs by then, and the usher still had my arm.\"</p>\n<p class=\"tape\">I had pictured him standing in that lobby, waiting for a word that would not come. I had not pictured the usher's hand.</p>\n<p class=\"tape\">For a while I could not say anything at all.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I will tell you the rest of what was said between us, because it was not much, and I have remembered all of it.</p>\n<p class=\"tape\">Somewhere around three in the morning he said, without looking at me, \"Y-you were his.\"</p>\n<p class=\"tape\">\"Until Tuesday. Yes.\"</p>\n<p class=\"tape\">\"B-before Tuesday.\"</p>\n<p class=\"tape\">\"Yes.\"</p>\n<p class=\"tape\">\"Then you p-put the gun in his hand,\" he said. \"As much as anyone.\"</p>\n<p class=\"tape\">It was true. I had given Booth the road, and the bridge, and three months of my best thinking, and the mare with the white star was carrying him down every mile of it now, in the dark, while we stood there.</p>\n<p class=\"tape\">\"Yes,\" I said. \"And you took away the one man who was between him and that door.\"</p>\n<p class=\"tape\">That was true too. I watched it land. I was not sorry I had said it, and I was sorry. Both.</p>\n<p class=\"tape\">Neither of us said anything else for a long time.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Toward morning the sky went gray. It was a dark and gloomy morning, and rain set in, a thin, cold, steady rain that came down on all of us, and nobody left. The crowd had changed in the night. There were a great many Black men and women in it by morning, more than there had been at midnight, standing together in the rain, very quiet, and many of them weeping. I have never forgotten that. They had come from every part of the city, in the dark, and they stood there without umbrellas, and they did not make a sound.</p>\n<p class=\"tape\">Then the door at the top of the steps opened, and a man came out. Not one of the great men. A doctor, one of the younger ones, in his shirt, with his coat over his arm. He stood at the top of the steps for a moment in the rain, looking at nothing.</p>\n<p class=\"tape\">I saw it, and Damon saw it, at the same moment. I know that, because we said it at the same moment, very low, both of us:</p>\n<p class=\"tape\">\"His sleeves.\"</p>\n<p class=\"tape\">The doctor's sleeves were rolled down and buttoned at the wrist. All night, every doctor who came to that door had them pushed up to the elbow.</p>\n<p class=\"tape\">Damon turned and looked at me. We stood there in the rain.</p>\n<p class=\"tape\">I had put him down, on the farm, as a word spelled wrong. Standing there, I had the strangest feeling that he was spelled wrong in the same way I was.</p>\n<p class=\"tape\">Then the word came down the steps, and ran out into the crowd, and went up Tenth Street and down it, the way the news had gone out from the steps of Ford's the morning before. And the bells began. First one church, somewhere up toward the Avenue, and then another, and then all of them, all over the city, in the rain.</p>\n<p class=\"tape\">He had died at twenty-two minutes past seven. I learned that later.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Damon took off his hat and held it against his chest. He stood like that for a long time, with the rain on his face.</p>\n<p class=\"tape\">Then he put the hat back on, and turned to go.</p>\n<p class=\"tape\">\"What will you do?\" I said.</p>\n<p class=\"tape\">He stopped. He looked back up the street, toward the Avenue, toward the window where the man in that house had stood four nights before, in the candlelight, and talked about what came after the war. About votes, for the men who had worn the uniform.</p>\n<p class=\"tape\">\"W-what comes next,\" he said. \"S-somebody has to s-see to it.\"</p>\n<p class=\"tape\">And he walked away up Tenth Street, through the crowd, in the rain, in his thin white jacket, and did not look back. I watched him until I could not see him anymore.</p>\n<p class=\"tape\">I did not see him again in that life.</p>", "audio": false, "added": 1790599355195, "pt": [1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790604858193, 1790604858193, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790604858193, 1790599355195, 1790599355195, 1790861698841, 1790861698841, 1790861698841, 1790861698841, 1790599355195, 1790599355195, 1790861698841, 1790856540826, 1790856540826, 1790856540826, 1790856540826, 1790856540826, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790604858193, 1790599355195, 1790599355195, 1790858372551, 1790858372551, 1790858372551, 1790604858193, 1790604858193, 1790599355195, 1790599355195, 1790599355195, 1790784418993, 1790784418993, 1790599355195, 1790599355195]}, {"num": 23, "title": "The Tape", "extra": false, "html": "<p>He stopped, and did not start again.</p>\n<p>My pen was still above the notebook. The last thing on the page was <em>the sleeves,</em> and under it a line that ran off into nothing where my hand had stopped. The woodstove had burned down to a red glow. The window had gone blue. I did not know when that had happened.</p>\n<p>He was sitting with his hands flat on his knees, the way he had put them there two hours before, looking at the floor between his feet. He was not crying. I had half expected him to, and would have known what to do if he had. People cried in interviews all the time. You waited, and you did not look away, and you did not touch the recorder.</p>\n<p>He looked like a man who had carried something up a very long flight of stairs and set it down at the top, and did not yet know whether he could stand up again without it.</p>\n<p>I reached over and turned off the recorders. First the phone, then the old one. The two red lights went out.</p>\n<p>Never once, in my whole career, had I turned off a recorder before the subject said they were done.</p>\n<p>He looked up at the sound of the click, and saw what I had done, and for a moment something moved in his face that I did not have a word for.</p>\n<p>\"Thank you,\" he said.</p>\n<p class=\"break\">&#10043;</p>\n<p>I stayed another half hour. I did not ask him anything. I made the tea, for the first time, in his kitchen, finding the cups by opening the wrong cupboards first, and brought it to him, and he drank it, and after a while some color came back into his face.</p>\n<p>At the door, in the dark, with my bag over my shoulder and my keys in my hand, I said, \"Are you going to be all right?\"</p>\n<p>It was not a question I had ever asked a source.</p>\n<p>\"I'm always all right,\" he said. \"That's the trouble.\" He tried to smile, and very nearly did. \"Drive carefully. It's late for that road.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>It was nearly eight when I got home.</p>\n<p>The house was lit, every window. I sat in the car for a minute in the driveway, looking at it, before I went in.</p>\n<p>Freda was asleep at the kitchen table, with her head on her arms on top of a chemistry textbook and her pencil still in her hand. Her phone lay face down beside the book. There was a plate by her elbow with a sandwich on it, cut into triangles, with plastic wrap over it, and a sticky note on the plastic wrap that said <em>MOM</em> in capital letters.</p>\n<p>I stood in the doorway and looked at her for a long time.</p>\n<p>Then I took the blanket off the back of the couch and put it over Freda's shoulders, carefully, so as not to wake her. She stirred and said something that was not a word, and did not wake. I sat down across from her and ate the sandwich, in the bright kitchen, with every light in the house on, and did not turn any of them off.</p>\n<p class=\"break\">&#10043;</p>\n<p>That night I did not sleep.</p>\n<p>At eleven I woke Freda enough to walk her up to bed, one arm around her, the way I used to when she fell asleep in the car, and she said \"you're back\" and \"how was the guy\" and was asleep again before I could answer. At midnight I sat down at the kitchen table with my headphones and my laptop and began typing up the transcript, because the lawyers wanted it by Monday and because I did not know what else to do with myself.</p>\n<p>It was very strange, typing it. In the room, I had been inside it. At the kitchen table, with my fingers on the keys, I was outside it again, the way I had always been outside every story, and I could hear it for what it was.</p>\n<p>It was too good.</p>\n<p>That was the thing I kept coming back to, at two in the morning, and at three. Not the facts. The facts were the easy part; I had checked a hundred facts for him by now, and anyone could learn facts. It was the rest of it. The seven minutes on the bad leg. The boy on the ground in the alley asking why. The doctor at the top of the steps with his sleeves rolled down. A man standing beside him in a thin white jacket who could not get out the one word that mattered.</p>\n<p>I had interviewed liars. Good ones, some of them. Liars tell a story from the outside. They know how it ends, so they build toward it. They give you the big moments large and clear, the shot, the leap, the famous words, because those are the parts they have read about.</p>\n<p>He had not heard the famous words. He had been in the lobby, with a crowd screaming, and he had not heard them. He had seen the man's face, and it was the happiest he had ever seen it.</p>\n<p>A liar would have heard the words.</p>\n<p>At three, I stopped typing and looked it up. I searched every way I could think of for a doctor rolling down his sleeves on the steps of the Petersen House. For anyone who had noticed it, or written about it. There was nothing. There were a hundred accounts of that morning and none of them mentioned it. It was exactly the kind of detail nobody could check. Like the color of the thread.</p>\n<p>I thought: either he is the best liar I have ever met in my life, or</p>\n<p>I did not finish the sentence. I sat at the kitchen table in the lit house and looked at the words on the screen, and I did not finish it.</p>\n<p class=\"break\">&#10043;</p>\n<p>At four I finished the transcript and read it through once, the way I always had, for typos. When I got to the part about the sleeves I stopped, and read it twice.</p>\n<p><em>I saw it, and Damon saw it, at the same moment. I know that, because we said it at the same moment, very low, both of us: \"His sleeves.\"</em></p>\n<p>I thought about the client, whoever he was, reading this on Monday. Somebody who read carefully. Somebody who had asked about the color of a thread, and the National Hotel, and whether the old man had ever spoken to the waiter again. I wondered what he would make of the sleeves.</p>\n<p>I attached the file to an email to Aldine, Mercer and Voss, and wrote <em>Session 11</em> in the subject line, and sent it.</p>\n<p>Then I sat in the kitchen with every light on until the windows went gray, and it was Friday, and somewhere upstairs Freda's alarm began to go off, and went on going off, the way it did every morning, until I went up the stairs to wake her.</p>", "audio": false, "added": 1790599688184, "pt": [1790599688184, 1790784418993, 1790694240640, 1790861984290, 1790694240640, 1790694240640, 1790694240640, 1790599688184, 1790694240640, 1790694240640, 1790694240640, 1790599688184, 1790694240640, 1790694240640, 1790599688184, 1790694240640, 1790694240640, 1790694240640, 1790784418993, 1790694240640, 1790599688184, 1790861984290, 1790694240640, 1790599688184, 1790599688184, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790599688184, 1790694240640, 1790694240640, 1790694240640]}, {"num": 24, "title": "The Blue Coat", "extra": false, "html": "<p>The payment for Session 11 landed on Monday afternoon, four days late, which it had never been. Nothing had come on Thursday.</p>\n<p>I looked at it on my phone in the parking lot of the grocery store, and then looked again, and then sat in the car with the engine off and the groceries getting warm in the back. It was six thousand dollars. Twice the rate. The note on the transfer, instead of the session number, said: <em>Our client asks you to take all the time the gentleman needs.</em></p>\n<p>There was no question with it. There was no email at all.</p>\n<p>That afternoon I called the number at Aldine, Mercer and Voss, the one I had called in the beginning. The same woman answered on the second ring. I said there must have been a mistake in the payment. She said there was no mistake. I asked whether the client had a question for the next session. She said the client did not, and that he had asked her to say, if Ms. Barnett called, that he had read the transcript with great attention, and that he was grateful.</p>\n<p>\"Grateful for what?\" I said.</p>\n<p>\"He didn't say, Ms. Barnett.\"</p>\n<p>I hung up, and sat in the car a while longer.</p>\n<p>In eleven sessions the client had never once said anything about the story itself. He had asked his odd, narrow questions, one at a time, like a man picking a lock. He had never said whether he believed it, or liked it, or what it was for. And now he had read the part where a lame boy and a waiter said <em>his sleeves</em> in the same breath on a street in 1865, and he had doubled my money, and he was grateful, and he did not have a question anymore.</p>\n<p>I put the car in gear and drove home, and put the groceries away, and did not tell Freda about the money, because I did not know how to explain it.</p>\n<p class=\"break\">&#10043;</p>\n<p>I told him on Thursday. I read him the note from my phone.</p>\n<p>He listened without moving. When I got to <em>take all the time the gentleman needs,</em> he looked at the mantel, at the empty frame with its polished glass, for longer than he had ever looked at it before. His face did not change. But he was quiet for a long time.</p>\n<p>\"Well,\" he said finally. \"That's kind of him.\"</p>\n<p>\"Is it?\"</p>\n<p>\"I don't know yet.\" He turned back to me, and some of the usual dryness came back into his voice. \"I find I don't know a great many things about your client. I'm not used to that.\" He picked up his pencil. \"The fifteenth of April. Everybody in Washington was looking for someone. I was one of the someones.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 15, 1865</em></p>\n<p class=\"tape\">I did not go home that morning. I walked.</p>\n<p class=\"tape\">The city had changed in the hours we had been standing on Tenth Street. The flags from the victory were still up, but somebody had already begun hanging black crepe over them, and by noon the whole of the Avenue was black and white, the bunting of Monday and the mourning of Saturday on the same buildings. The saloons were closed by order. The theaters were closed. Soldiers were everywhere, at every corner, stopping men and asking their names.</p>\n<p class=\"tape\">And they were arresting people. Anyone. Everyone. A man who had said something careless about the President in a barbershop. A man who looked like Booth. Every actor in Ford's company, and the stagehands, and the Ford brothers who owned the theater. Anyone who had ever been seen with Booth. Hundreds of them, in those first days, until the jails were full. The ones they thought mattered most were put in irons below decks on ironclad ships in the river.</p>\n<p class=\"tape\">I knew, walking through it, that I was one of the people they wanted. I did not yet know how much.</p>\n<p class=\"tape\">I found out that afternoon.</p>\n<p class=\"tape\">The family I lodged with by the Navy Yard met me at the door. Their faces told me before they said a word. Two men had come that morning, detectives, in plain clothes. They had not asked for me by name. They did not have my name. They had asked whether a young man boarded there who walked with a cane. A young Marylander, lame in one leg. They had a description, the detectives said, from the desk clerk at a hotel, of a lame young man who had come in at ten o'clock on Friday night asking for John Wilkes Booth. They were going house to house along the streets to the bridge. Everyone knew by then that Booth had gone out that way.</p>\n<p class=\"tape\">The family had told them no. They had lied for me, to men from the War Department, the morning after the President was murdered, because my mother's people had hidden their sons in the war. They told me so, standing in the hall. They were shaking.</p>\n<p class=\"tape\">\"You have to go,\" the woman of the house said. \"Not for your sake. For ours.\"</p>\n<p class=\"tape\">She was right.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I sat on the edge of the bed in my narrow room and went through it, one door at a time, the way I always did. I had perhaps an hour.</p>\n<p class=\"tape\">What did they have? Not my name. I had kept it out of every mouth that could have given it to them: out of Weichmann's hearing, off Booth's papers. They had a clerk's description. A lame young man, a Maryland voice, a cane, asking for Booth. That was all, unless Weichmann had given them more.</p>\n<p class=\"tape\">But it was enough. A lame young man was a thing you could see from across a street. I could not walk ten steps without it announcing me. Every soldier on every corner of Washington was looking for Booth and for a lame young Marylander, and I was the second of those, and I could not stop being him.</p>\n<p class=\"tape\">Unless I was someone else who limped.</p>\n<p class=\"tape\">Washington in April of 1865 was full of lame young men. That is the thing I saw, sitting there. The hospitals were overflowing. There were thousands of wounded soldiers in that city, on crutches and in slings and on canes, in the streets every day, going to and from the hospitals and the pension offices and the railroad depots. Union soldiers. Nobody looked at them twice. Nobody could. There were too many of them.</p>\n<p class=\"tape\">A lame young man in a good civilian coat, asking after Booth, was a suspect.</p>\n<p class=\"tape\">A lame young man in Union blue was furniture.</p>\n<p class=\"tape\">I went down to the rag shops on Seventh Street, where the soldiers sold what they did not need and the dealers sold it on to the next soldier, and for two dollars I bought an army coat that had belonged to somebody bigger than me, faded, with a darned place at the elbow. I looked at the darn for a long moment in the shop. It had been mended with the right thread.</p>\n<p class=\"tape\">The dealer looked at the cane and the leg. \"Discharged?\" he said.</p>\n<p class=\"tape\">\"In the winter,\" I said. \"I sold mine the week I got home. I never wanted to see it again.\" I put the two dollars on the counter. \"And then this morning.\"</p>\n<p class=\"tape\">He nodded. He did not need the rest
