 frightened, badly, for some weeks.</p>\n<p>I have made worse trades, in other lives. I have made better ones.</p>\n<p>\"What would you need from me?\" I asked.</p>\n<p class=\"break\">&#10043;</p>\n<p>He did not need much, at first. That is how these things begin.</p>\n<p>He needed to know the roads. So in the evenings, while my mother thought we were talking about horses, I drew them for him on the backs of old tobacco receipts: the road south from the Navy Yard Bridge, the tavern at Surrattsville, the turn toward Bryantown, the long way around the swamp, the farms where a man could be hidden, and the landing places on the river where the boats went across at night. He needed to know whose houses were friendly and whose were not. He needed a place to rest a horse, if it came to that.</p>\n<p>He was going back to Washington before Christmas, he said. There was a young man there that Dr. Mudd had promised to introduce him to, a courier who carried letters back and forth to Richmond and knew every road between. He would write to me. I was to answer him at the National Hotel, where he kept a room.</p>\n<p>\"And your mother?\" he asked.</p>\n<p>\"My mother,\" I said, \"thinks you've come to buy a horse.\"</p>\n<p>He laughed at that. Two days later he bought a horse at last, from Dr. Mudd's next-door neighbor, a man named Gardiner, as if to prove me right. It was a big dark bay, and it was blind in one eye. Everyone in the county knew about it by the end of the week, because it was a poor horse for a rich man to buy, and nobody could understand why a man who rode like that would want it.</p>\n<p>I would see that horse again.</p>\n<p>On his last evening in the county, he stood on our porch in his fine coat, with the rain finally stopped and the fields gone blue in the cold, and he shook my hand.</p>\n<p>\"Home for planting,\" he said.</p>\n<p>\"Home for planting,\" I said.</p>\n<p>Lottie watched him ride away from the upstairs window. My mother came out onto the porch and stood beside me, and put her hand in her apron pocket, and asked me what we had talked about all that time.</p>\n<p>\"Horses,\" I said.</p>\n<p>It was the first real lie I told in that life. Everything before it had only been pretending to be someone. This one was mine.</p>", "added": 1790546996279, "pt": [1790568656957, 1790568656957, 1790568656957, 1790546996279, 1790546996279, 1790546996279, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790567141236, 1790567141236, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279]}, {"num": 9, "title": "Point Lookout", "html": "<p>He walked her out to the car at four o'clock, slowly, with one hand on the porch rail going down the steps. The light was already going. Somebody down the road was burning leaves, and the smoke hung low over the fields and made everything smell like the end of the year.</p>\n<p>\"How is your daughter?\" he asked.</p>\n<p>It was the kind of thing people asked. She nearly said <em>fine,</em> the way you do. But it had been a long day of listening to him, and he had listened to her at lunch the week before, and she found that she wanted to answer properly.</p>\n<p>So she told him. She told him that Freda was good. That she was taking chemistry this year with a teacher named Mr. Ostrowski, who wore a bow tie every single day and had once set his own sleeve on fire in front of the class, and that Freda, who had said all through ninth grade that she hated science, now came home and explained things to Iola about moles and molecules whether Iola wanted to hear them or not. Last week it had been a long complaint about the scale at her bench, which weighed everything two grams heavy, so that her whole lab came out wrong and she had to write an extra paragraph at the end explaining why. That she had grown two inches since spring and none of her jeans fit. That she had started doing her homework at the kitchen table instead of in her room, which was new, and which Iola was not complaining about, because it meant she got to see her. That every light in the house was on whenever Iola came home, like Freda was expecting a party.</p>\n<p>\"And her phone buzzed all through dinner on Tuesday,\" Iola said. \"She turned it face down on the table without looking at it. She's been doing that. I thought, well, at least she's not texting at the table. I've been trying to get her to stop that for three years.\"</p>\n<p>He had stopped at the bottom of the steps. He was looking at her in the way he had, the mechanic listening to the engine.</p>\n<p>\"She knows who it is,\" he said.</p>\n<p>\"What?\"</p>\n<p>\"When the phone buzzes. She doesn't need to look, because she already knows who it is. And she doesn't want to read it.\" He said it gently. \"Somebody is saying things to your daughter that she doesn't want to hear, and she doesn't want to be alone with them. That's why she works at the kitchen table now, where you are. And it's why every light in the house is on when you come home.\"</p>\n<p>Iola stood very still by the car.</p>\n<p>She had said the thing about the lights as a joke, one line in a long list, the way you say things about your children. She had not thought about it twice. He had picked it out of everything else she said and put it next to the phone.</p>\n<p>\"You don't know her,\" she said.</p>\n<p>\"No,\" he agreed. \"But you do. And you'd noticed already, or you wouldn't have told me about the phone. You'd have told me about the chemistry teacher and stopped there.\"</p>\n<p>She did not answer that. She got into the car. He stood at the bottom of the steps with his hands in his cardigan pockets, and when she had turned the car around on the gravel, he lifted one hand, and she lifted hers, and she drove away down the road through the smoke.</p>\n<p class=\"break\">&#10043;</p>\n<p>She did not say anything to Freda that night.</p>\n<p>She had thought about it all the way home, two hours, with the radio off. She had thought about sitting her down and asking straight out, <em>Is someone bothering you?</em> She could picture exactly how that would go. Freda would say <em>no, Mom,</em> in the voice that meant the conversation was over, and go to her room, and shut the door, and take her homework with her. And then she would not be at the kitchen table anymore. And whoever it was would have her all to themselves.</p>\n<p>So Iola came in, and said hello, and hung up her coat, and did not look at the phone lying face down beside the chemistry book. Freda had made pasta. There was some left in the pot for her, with a plate on top to keep it warm, which was not a thing Freda had ever done before. Iola ate it standing at the counter and said it was very good, which it was.</p>\n<p>Then she got out her own laptop and sat down at the kitchen table across from her daughter, and went to work.</p>\n<p class=\"break\">&#10043;</p>\n<p>Point Lookout was real. She had known it would be.</p>\n<p>It was all there, the way everything was always there, a few clicks down: the long peninsula between the Potomac and the Chesapeake, and at the very bottom of it, where the two waters met, a flat, sandy point that was now a state park, with campsites and a fishing pier and a lighthouse. People went there on weekends to catch rockfish. There were photographs of families on the beach.</p>\n<p>In 1863 the Union had put a prison camp there. It was built to hold ten thousand men. At times it held nearly twice that. There were no barracks, only tents, on open sand, behind a high board fence, with water on three sides. Men wrote about the heat in summer and the wind off the bay in winter, about the bad water, about the rations. The exchange of prisoners had broken down in 1863, and after that, the men who went in mostly stayed until the war was over, or until they died.</p>\n<p>About a mile up the road from the park, beside the highway, there was a tall granite obelisk. The United States government had put it up in 1911. It said that three thousand three hundred and eighty-four Confederate prisoners had died at Point Lookout and been buried there, and that their graves had been moved, more than once, and could no longer be told apart. They were all together now, under the grass by the road. Their names were on bronze plaques around the base.</p>\n<p>Other websites gave other numbers, some of them much higher. None of them agreed with each other.</p>\n<p>She sat back.</p>\n<p>None of it proved anything. That was the first thing she wrote in her notebook, because it was the thing she needed to remember. Everything he had told her about Point Lookout was on the first page of results. A man with ten thousand books and a lot of time could have read all of it in an afternoon. He could have read it forty years ago. He could have built a whole life, a whole Kit Keene, on top of an afternoon's reading, and believed it by now.</p>\n<p>But there were records. There were always records. That was the other thing she knew.</p>\n<p>The prisoner-of-war records were at the National Archives, and somebody had scanned a great many of them, and a genealogy company had put them online behind a paywall, at twenty-nine ninety-nine a month. A month ago she would not have spent thirty dollars to find out anything at all. She looked at the button for a while. Then she paid it.</p>\n<p>She searched for <em>Carroll,</em> for the boy Ned had written about, <em>Jem Carroll died of the flux on Tuesday.</em> There were more Carrolls at Point Lookout than she could check in a night, from Virginia and North Carolina and Maryland and Georgia, Jameses and Johns and a Jeremiah and several with only an initial. Any of them could be Jem. None of them had to be.</p>\n<p>She searched for <em>Keene,</em> and there were Keenes, too, but no Christopher, and then she stopped and made herself think it through. Kit had never been at Point Lookout. Kit had been shot outside Washington and carried home in a wagon under a load of potatoes. If there had ever been a Christopher Keene, he would not be in these records at all. The one who would be was the cousin.</p>\n<p>And she did not know the cousin's last name. Ned had called Kit's mother <em>Aunt Margaret.</em> He could have been a Keene, if he was the son of her husband's brother. He could just as easily have been anything else.</p>\n<p>She wrote it down: <em>Ned's last name?</em> And underneath it, because she was honest on paper: <em>Would a real one know? Ask him. Watch how fast he answers.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>\"Is that him?\"</p>\n<p>Freda had come around the table and was reading over her shoulder. Iola had not heard her get up.</p>\n<p>\"Is that who?\"</p>\n<p>\"The guy. Your guy. The Confederate.\" Freda leaned closer and read the screen. \"Point Lookout. Is that where he was?\"</p>\n<p>\"His cousin. He says.\"</p>\n<p>\"Oh.\" Freda read a little more, frowning. \"That's so many people.\" She was quiet for a moment. Then she said, \"Did the cousin die?\"</p>\n<p>\"I don't know yet. He hasn't told me.\"</p>\n<p>\"You should ask him.\" Freda straightened up. \"Actually, don't ask him. Let him tell you. You always say that, people tell you more if you wait.\"</p>\n<p>Iola looked up at her.</p>\n<p>\"I do say that,\" she said.</p>\n<p>\"You say it all the time.\" Freda went back around the table and sat down and picked up her pencil. The phone lay beside her chemistry book, face down, and it buzzed once, and she did not look at it. \"Tell me if the cousin dies, okay?\"</p>\n<p>\"Okay.\"</p>\n<p>They worked on, across the table from each other, until nearly eleven. Freda did her chemistry and Iola did nothing useful at all. She read about Point Lookout. She read about the exchange of prisoners, and why it had stopped, and who had stopped it. She read the same page about the obelisk twice. The phone buzzed three more times. Freda did not turn it over, and Iola did not look at it, and neither of them said anything about it, and every light in the house stayed on.</p>\n<p>When Freda finally went up to bed, she stopped in the kitchen doorway.</p>\n<p>\"Night, Mom.\"</p>\n<p>\"Night, baby.\"</p>\n<p>\"Don't call me baby.\"</p>\n<p>\"Night, Freda.\"</p>\n<p>Freda almost smiled, and went up. Iola sat for a while longer, in the bright kitchen, with the laptop open in front of her and the house quiet. Then she turned off the lights, one by one, all of them, and went up too.</p>", "added": 1790562708171, "pt": [1790562708171, 1790562708171, 1790562708171, 1790564773258, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171]}, {"num": 10, "title": "H Street", "html": "<p>She had decided on the drive up how she would do it. She would not lead into it. She would not give him time.</p>\n<p>So she set out the two recorders, and said the date and the time, and before he had quite settled in his chair, she said, \"What was Ned's last name?\"</p>\n<p>\"Hurley,\" he said.</p>\n<p>He did not pause. He did not look at the ceiling the way people do when they are making something up, or at the floor the way they do when they are trying to remember. He said it the way you would say the name of the street you grew up on.</p>\n<p>\"Edward Hurley. His mother was Margaret's younger sister, Ann. She married a Hurley from St. Mary's County, a waterman, and died when Ned was small, and Ned was more or less raised at the Keenes' after that. That's why he called her Aunt Margaret and wrote to her instead of to anyone else. There was no one else.\" He tilted his head. \"You won't find him as Edward, if you're looking. The clerks at the camps wrote down whatever they heard. He'll be Ned, or E., and they spelled Hurley three different ways.\"</p>\n<p>She wrote it all down. She could feel him watching her write it.</p>\n<p>\"You've been looking,\" he said. It was not a question.</p>\n<p>\"I looked up Point Lookout.\"</p>\n<p>\"And?\"</p>\n<p>\"And it's real,\" she said. \"And it's on the first page of the internet, and anyone could have read it.\"</p>\n<p>\"Yes,\" he agreed, as if that were the right answer, and seemed pleased with her.</p>\n<p>She wanted, very much, to ask him the next thing. <em>Did Ned come home?</em> It was right there. But she heard Freda in her head, <em>let him tell you,</em> and she closed her mouth and waited.</p>\n<p>He smiled a little, as though he knew exactly what she was not asking.</p>\n<p>\"In January,\" he said, \"I went to Washington.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>January to March 1865</em></p>\n<p>I told my mother I had found work in the city. It was nearly true.</p>\n<p>The farm needed money more than it needed a lame boy. There was no cash for feed, no one to hire, and no crop worth selling until the tobacco went to market in the spring. Washington in the last winter of the war was full of work, and full of wages, and whatever I earned there I could send home. The government had grown enormous. Every office needed clerks, every hospital needed orderlies, every stable needed a man to muck it out. A Maryland farm boy with a bad leg and a decent hand could find something. If anyone asked about the leg, I was to say a wagon had rolled over it at harvest. Nobody in Washington knew that Kit Keene had ever crossed the Potomac. He had never been captured, so he had never been paroled, and the only papers with his name on them were muster rolls in a Confederate office somewhere in Richmond, where no Union clerk could read them. As far as the government was concerned, I was only a farm boy who limped.</p>\n<p>I took a room in a tall narrow house near the Navy Yard, with a family from Charles County who knew my mother's people and asked me nothing at all. I found work copying invoices for a lumber merchant on the waterfront. And every day, on my way to work and on my way home, I walked past the end of the Navy Yard Bridge, and I watched the soldiers who guarded it.</p>\n<p>That was my part. Booth had said so. Everything else could be planned in a parlor, but somebody had to know that bridge. What time the guard changed. How many men were on it at night. Whether they stopped every wagon or only the ones that looked like trouble. Whether they were bored. I watched them for two months, and I wrote down what I saw on the backs of the lumber merchant's invoices, in a code that was only a list of prices, and I found out they were very bored indeed.</p>\n<p>In February, the exchange started again.</p>\n<p>After nearly two years, the two governments came to terms, and the boats began to carry prisoners down the Chesapeake and up the James River to be traded. The first men from Point Lookout went in the middle of the month. My mother wrote to me the week it was in the newspapers. She wrote in a hand I hardly recognized, it was so quick. <em>They are sending them home, Kit. Ned will be on the next boat.</em></p>\n<p>He was not on the next boat. Or the one after. They went by lists, and nobody would tell a family whose name was on which list, or why. Every week my mother wrote to me, and every week the letter ended the same way: <em>Not yet.</em></p>\n<p>I told myself that the plan was still needed. That a few boats were not all the camps. That the exchange had stopped before and could stop again. All of that was true. I noticed, even then, that I was telling it to myself rather often.</p>\n<p class=\"break\">&#10043;</p>\n<p>Booth took me to H Street for the first time in the middle of February.</p>\n<p>It was a plain brick house with three stories and an attic, on a plain street a few blocks from the Patent Office, with steps up to the front door. He knocked, and the woman who opened it had a round, pleasant face, and dark hair parted in the middle, and a rosary in the pocket of her apron. She looked at Booth with a kind of fond exasperation, the way you look at a nephew who is charming and never on time.</p>\n<p>\"Mrs. Surratt,\" Booth said, \"this is Kit Keene. Margaret Keene's boy, from Bryantown.\"</p>\n<p>Her face changed.</p>\n<p>The name meant nothing to me. I have told you the rule: never say a name first, and never pretend to know more than you do. So I smiled, and waited, and let her tell me.</p>\n<p>\"The boy in the potatoes,\" she said. \"At the tavern, in the summer. I never saw your face, only the sacks, and your mother's. I gave her blankets for you.\" She took my hand in both of hers. \"Well. Look at you. Walking.\"</p>\n<p>It was the widow from Surrattsville. Her name was Mary Surratt. She had come to the city that autumn to take in boarders, and in December she leased the tavern out, and this was her house.</p>\n<p class=\"break\">&#10043;</p>\n<p>Iola had stopped writing.</p>\n<p>\"Mary Surratt,\" she said. \"The one they hanged.\"</p>\n<p>\"Yes.\"</p>\n<p>She knew the name the way everyone knows it, from a line in a history book: the first woman the federal government ever executed. She had never once thought of her as someone who opened a door, or had a face, or gave a stranger's mother two blankets on a hot day.</p>\n<p>\"You knew her,\" she said.</p>\n<p>\"I ate at her table.\" He was looking at the notepad, not at her. \"You're going to ask me whether she knew what they were planning. Everyone who has ever heard of her asks that. I'll tell you what I thought that first night. Later, I'll tell you what I came to think, and they aren't the same, and I'd ask you not to hurry me from one to the other.\"</p>\n<p>She thought about hurrying him. Then she picked up her pen.</p>\n<p class=\"break\">&#10043;</p>\n<p>I want to tell you exactly what I thought of her that first night, because a great deal came to depend on it later, and because I have had a long time to wonder whether I was right.</p>\n<p>I thought she was kind. I thought she was devout; she went to Mass every morning at St. Patrick's, a few blocks away, and the rosary was worn smooth. I thought she was a widow who had been left with debts by a husband who drank, and who was doing what she had to do to keep her children fed. And I thought she was a woman who had learned, over a long time, exactly which questions not to ask. Men came and went from her house at all hours. Her son rode off to Richmond and came back with papers sewn into his boots. She served them all supper and asked them how the weather had been on the road.</p>\n<p>She knew. That is what I thought, that night. I did not know yet how much.</p>\n<p class=\"break\">&#10043;</p>\n<p>Her son was in the parlor. He was the courier Dr. Mudd had promised to introduce to Booth before Christmas, the young man who knew every road between here and Richmond. John Surratt was twenty years old, tall and very thin, with a sharp face and a little pointed beard he was plainly proud of. He had been a courier for the Confederacy since he was seventeen, carrying letters across the river and back, and he had never once been caught, and he could not stop telling you so. Not in words. In the way he sat, and the way he checked the window, and the way he lowered his voice to say ordinary things. John Surratt loved a secret more than he loved any cause a secret could serve. I have met that kind of man in every century. They are brave, and useful, and they will get you killed, because they cannot bear for anyone not to know how much they know.</p>\n<p>There was another young man in the parlor, reading a newspaper by the lamp, and I noticed him because nobody introduced him. His name, I learned later, was Louis Weichmann. He had been at school with John, and he boarded in the house and shared John's room, and he worked as a clerk in the War Department, in the office of the Commissary General of Prisoners. He was plump and soft-spoken and polite, and he said good evening to Booth, and to me, and went back to his newspaper.</p>\n<p>He did not turn a page for the next half hour.</p>\n<p>I watched him not turn it. He was listening to every word. He was not one of us, and he was not against us. He was a young man who had put himself in a room where interesting things were said, and who was remembering all of them, and who had not yet decided what he would do with what he remembered. I thought, <em>if this goes wrong, that one will talk.</em> I did not think it as a prophecy. I thought it the way you notice that a bridge rail is loose.</p>\n<p>\"Weichmann?\" He laughed. \"Weichmann is John's oldest friend. He's harmless.\"</p>\n<p>\"He's a clerk in the War Department,\" I said, \"and he shares a room with a Confederate courier. Nobody is harmless who is in both of those places at once.\"</p>\n<p>It was only later, lying awake in my narrow room by the Navy Yard, that I understood what office that was. The Commissary General of Prisoners. The office that kept the lists: every prisoner in every Northern camp, his name and his regiment and where he was held, and whether he was sick, and whether he was dead. Weichmann sat at a desk in that office every day. He could have found Edward Hurley of St. Mary's County in an afternoon. He could have told my mother whether Ned was on a list, or when.</p>\n<p>I never asked him.</p>\n<p>I wanted to. I lay there and wanted to more than I have wanted most things. But to ask, I would have had to give him my name, and Ned's, and my mother's, and the name of our county, and tell him why a farm boy with a limp cared so much about one prisoner at Point Lookout. And I had already decided that Weichmann was the one who would talk. So I did not give him my name. Not then, and not ever. From that night on, when I was in that house, I made sure that nobody said it where he could hear.</p>\n<p>I chose the plan over my cousin. I did not put it to myself that way at the time. I have put it to myself that way since, a great many times.</p>\n<p>But all of that was later. That first night, walking back down H Street in the cold, I only said to Booth what I thought of Weichmann.</p>\n<p>Booth stopped under a streetlamp and looked at me for a moment, and I thought he was going to argue. Then he laughed again, and put his arm through mine, and said I was a gloomy devil and he was glad to have me, and talked about something else.</p>\n<p class=\"break\">&#10043;</p>\n<p>The others I met one at a time, over the next weeks.</p>\n<p>George Atzerodt was a German, a carriage painter from Port Tobacco, down in our own county, with a thick accent and a bad beard and a laugh that was always a little too loud. He had spent the war rowing people across the Potomac at night, for money, spies and couriers and anyone who could pay, and that was why Booth wanted him: he knew the river, and he had a boat, or said he did. He drank. Mrs. Surratt would not have him in the house for long, because she found liquor bottles in his room. I liked him more than I should have. He was a man who would say yes to anything, cheerfully, as long as the thing was far away, and I thought, watching him, that if the thing ever came close, he would find he had somewhere else to be.</p>\n<p>David Herold was twenty-two and looked sixteen. He had been a clerk in a drugstore, and he had grown up hunting partridges in the woods of Southern Maryland, and he knew those roads nearly as well as I did. That made us rivals, at first, in the way of young men. He would say <em>the road past Beantown,</em> and I would say <em>not in March, it floods,</em> and he would say <em>not if you take the ridge,</em> and Booth would laugh at us. He talked too much, and he was a little in love with Booth, the way a younger brother is. There was no harm in him at all. I have thought about that many times.</p>\n<p>Samuel Arnold and Michael O'Laughlen came down from Baltimore. They had been boys with Booth there, and both had served in the Confederate army, and both had come home. Booth had brought them in the summer before, long before me. O'Laughlen was small and dark and quiet and did what Arnold did. Arnold was the sensible one. He had a clerk's careful face and a soldier's impatience, and every time I saw him, he asked Booth the same question: <em>When?</em> He had been waiting since August. He was beginning to think it would never happen, and a part of him, I think, was beginning to hope so.</p>\n<p>And then, in March, a giant came to the door.</p>\n<p>He gave his name as Wood, the first time. The next time he came, Weichmann told me afterward, he was a Baptist preacher named Paine. His real name was Lewis Powell. He was twenty years old and over six feet tall, with shoulders like a doorframe, and he had been a Confederate soldier, and been wounded and captured at Gettysburg, and escaped, and ridden with the partisans in Virginia. He ate everything that was put in front of him, quickly, without looking up, the way men eat who have been hungry for a long time. He said almost nothing. When Booth spoke, Powell listened the way a good dog listens: completely, and without any thought of his own.</p>\n<p>He was the only one of them who frightened me. Not because he was cruel. I never saw him be cruel. It was that there was nothing in him that would stop. Every one of the others had some small door in the back of his mind that he could go out of, if it came to that. Arnold's was his doubts, and Atzerodt's was his cowardice, and Herold's was his boyishness, and John Surratt's was his love of the game for its own sake. Powell did not have one. Whatever Booth asked, Powell would do, all the way to the end of it.</p>\n<p>I noticed that Booth had noticed it too.</p>\n<p class=\"break\">&#10043;</p>\n<p>On the fifteenth of March, Booth gathered all of us together for the first and only time.</p>\n<p>He took a private room upstairs at Gautier's, a fine restaurant on Pennsylvania Avenue, and ordered oysters and cigars and more to drink than anyone needed. That same night he had taken a box at Ford's Theatre, the President's own box, and sent John Surratt and Powell to sit in it and study it, with two girls from the boarding house along for cover. They came to Gautier's afterward, flushed and pleased with themselves, and John described the box to us the way you would describe a castle you meant to storm.</p>\n<p>And then Booth told us the new plan.</p>\n<p>He wanted to take Lincoln from the theater. In the box, during the play. Two men to seize him, one to gag him, and then lower him over the rail to the stage, carry him out the back door into the alley, and away. The audience would think it was part of the performance, he said, until it was too late. He was an actor. He knew that stage. He knew how long it took a crowd to understand what it was seeing.</p>\n<p>He was magnificent, telling it. I do not think I have ever seen a man more alive. He walked up and down the little room with his cigar, lowering an invisible President over an invisible rail, and for a few minutes, I think, every one of us could see it.</p>\n<p>Then Arnold put down his glass.</p>\n<p>It was madness, Arnold said. A theater full of people. Gas lamps. Soldiers in the audience, half of them armed. A man of Lincoln's size, who would not come quietly, lowered twelve feet to a stage in front of a thousand witnesses, and then carried out through a door that anyone could run to. They would all be killed, or taken, before they reached the alley. If Booth had meant the road, the carriage, a quiet place in the country, then Arnold was still with him. But not this.</p>\n<p>The room went quiet. Booth stopped walking.</p>\n<p>Arnold told it afterward, in an account of his own, and I have read it more than once. He said that Booth said that any man who backed out now deserved to be shot. And that he, Arnold, said that two could play at that game.</p>\n<p>I was in the room. That is about how it went. I would add only that when Booth said it, he was smiling, and that nobody laughed, and that I looked across the table at Powell and saw that Powell was not smiling at all. He was looking at Booth, waiting to see if he meant it.</p>\n<p>I spoke then. I had not meant to. I said that Mr. Arnold was right about the theater, and that the road was better, and that there were only two things we truly needed to know: when the President would next leave the city in his carriage, and whether the guard on the Navy Yard Bridge would stop a party of horsemen at night. And that I could tell them the second one already.</p>\n<p>They all looked at me. Booth looked at me longest.</p>\n<p>\"Well?\" he said.</p>\n<p>\"They won't,\" I said. \"There's an order that nobody crosses after nine o'clock at night. It's written down, and the sergeants know it. But the war is nearly over, and they're bored, and they're watching for rebels coming into the city, not farm boys going home. A man riding south who says he's going home to Maryland, they let him go. I've watched them do it.\"</p>\n<p>Booth began to smile again, slowly, and this time it was real.</p>\n<p>I should have stopped there. But there was a thing I had been carrying for a month, and the wine had loosened it.</p>\n<p>\"And the exchange?\" I said. \"It's started again. They're sending men home from Point Lookout every few weeks. My mother reads the lists.\"</p>\n<p>The smile did not go anywhere. Booth only waved his cigar, as if I had mentioned the weather.</p>\n<p>\"A few boatloads,\" he said, \"when it suits Grant. It's a Yankee trick, Kit, to make us feel grateful while they finish us. They'll stop it again the day it stops suiting them.\" He leaned on the table toward me. \"We're past trading prisoners. Take him, and the North has to talk to us, and the war ends. That's what this is for now.\"</p>\n<p>It was not the reason he had given me in the barn.</p>\n<p>I noticed it. I want you to know that I noticed. And I told myself it was the same reason, only bigger, the way a man's reasons grow when the stakes do. I have told myself that sort of thing in a great many lives. I am nearly always wrong.</p>\n<p>\"The road, then,\" Booth said, and raised his glass to Arnold, and Arnold, after a moment, raised his.</p>\n<p>The next day, word came. The President was to drive out to a hospital at the edge of the city on the afternoon of the seventeenth, to see a play performed for the wounded soldiers. On a quiet road. In his carriage. With almost no guard.</p>\n<p>We had our chance.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there. The light outside had gone gray.</p>\n<p>\"You'll look for me,\" he said, \"in what Weichmann told the court, and in what Arnold wrote down afterward. You'll look carefully, because that's what you do.\"</p>\n<p>\"Yes.\"</p>\n<p>\"You won't find me. Nobody mentions me.\" He turned the pencil over. \"Now you know why.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>The house is still there. Iola looked it up that night, at the kitchen table, with Freda across from her doing her homework.</p>\n<p>It was not 541 anymore. The city had renumbered the streets long ago, and it was 604 H Street now, in the middle of Chinatown, with a restaurant on the ground floor and a historical marker by the door. She had walked past it a hundred times. She had eaten there once, years ago, with people from the paper, and never looked up.</p>\n<p>Then she did what she had come home meaning to do, and looked for Edward Hurley.</p>\n<p>It was harder than she expected. Some of the Point Lookout records were online and some were not, and the ones that were had been typed up from handwritten lists by volunteers, and the index stopped and started. She found Hurleys. She found a Hurly and a Hurlee and an E. Hurley with no county beside it, which could have been anyone at all. The rest of the records, the site said, were on microfilm at the National Archives, on Pennsylvania Avenue. She looked at the map. It was twenty minutes from her front door.</p>\n<p>She wrote it on the calendar, in the next free morning: <em>Archives. Hurley.</em></p>\n<p>\"Did the cousin die yet?\" Freda said, without looking up.</p>\n<p>\"He hasn't said.\"</p>\n<p>\"You didn't ask him?\"</p>\n<p>\"I didn't ask him.\"</p>\n<p>Freda looked up then, and gave her a small, approving nod, like a teacher, and went back to her homework.</p>\n<p>The phone lay face down beside the chemistry book. It buzzed once, a little after nine. Freda turned it over, and read whatever it was, and Iola watched her face close like a door. Then Freda turned it face down again and picked up her pencil and wrote something very carefully in the margin of her worksheet, and did not look at her mother, and Iola did not look at her.</p>\n<p><em>Somebody is saying things to your daughter.</em></p>\n<p>She turned the page of her notebook, and did not turn it back, and did not ask.</p>", "added": 1790565051993, "pt": [1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790567141236, 1790565051993, 1790565051993, 1790567141236, 1790567141236, 1790567141236, 1790567141236, 1790565051993, 1790567141236, 1790567141236, 1790567141236, 1790567141236, 1790567141236, 1790567141236, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790565051993, 1790565051993, 1790565051993, 1790567141236, 1790567450982, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790567141236, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790567141236, 1790565051993, 1790567141236, 1790567141236, 1790567141236, 1790567141236, 1790567141236, 1790567141236, 1790565051993, 1790567141236, 1790567141236, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790565051993, 1790565051993, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790567450982]}, {"num": 11, "title": "The National", "html": "<p>The client's question came on Tuesday, like the first one. It was one line.</p>\n<p><em>Please ask the gentleman whether he ever went to the National Hotel.</em></p>\n<p>Iola looked it up before she did anything else. The National had been the grandest hotel in Washington before the war, on Pennsylvania Avenue at Sixth Street, halfway between the White House and the Capitol. Congressmen lived there. So did John Wilkes Booth, whenever he was in the city, in room 228. The building had been torn down in 1942.</p>\n<p>So it was not an odd question at all. It was the most natural question in the world. Booth lived there, and the old man said he had been one of Booth's men.</p>\n<p>She read it again anyway. It had taken the client a week of silence to ask it.</p>\n<p>She had also called the National Archives. You could not simply walk in and ask for microfilm, it turned out. You needed a researcher card, and to get one you had to sit through an orientation, and the next orientation with a free seat was a week from Monday. She put it on the calendar under <em>Archives. Hurley.</em> and felt, absurdly, as if the building were stalling her on purpose.</p>\n<p class=\"break\">&#10043;</p>\n<p>On Thursday she set out the recorders, said the date and the time, and read him the question.</p>\n<p>\"The National,\" he said. \"Yes. Many times.\"</p>\n<p>He did not look at the mantel this time. He looked at her, and for a moment she had the feeling that he was deciding something. Then he smiled and settled back.</p>\n<p>\"Tell your client yes,\" he said. \"And I'll tell you about it. I think it's what he wants to hear.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>March 1865</em></p>\n<p>The National Hotel was the kind of place where a farm boy with a cane was invisible, and I was glad of it.</p>\n<p>It took up most of a block. It had a great lobby with marble floors and brass spittoons and a gallery around the top where ladies could look down on the men without being looked at, and a barbershop and a telegraph office and a bar that never closed. Half the Congress seemed to live there. So did a good many people who wished the Congress would go home to their states and stay there. It had always been a Southern sort of hotel. Before the war the planters had stayed there when they came to Washington, and some of their friends still did, and in the bar you could hear things said about the President, in low voices, that would have got a man arrested in most of the city.</p>\n<p>Booth held court there like a prince. He knew every clerk and every porter by name. He tipped them all too much. When he came down the stairs, people turned to look, and he let them, and pretended not to notice. He had a way of standing in that lobby with one hand on the newel post that I think he had learned on a stage.</p>\n<p>I went there to bring him the bridge. Every week or so I would come up Pennsylvania Avenue from the Navy Yard, with my lumber merchant's invoices folded in my coat, and ask for Mr. Booth at the desk, and he would come down and take me into the dining room and order me a dinner I could not have paid for in a month. And while I ate, I told him what the guards had done that week, in a low voice, and he listened and smiled and said <em>good, good,</em> and ordered another bottle.</p>\n<p>It was on my third or fourth visit that I noticed the bill of fare.</p>\n<p>It was a card on the table, the day's dishes written out by hand. Most hotels printed them. The National's were written fresh every morning, and whoever wrote them had the most beautiful hand I had seen in that life: even and flowing and perfectly clear, with long, looping capitals, the kind of writing that was taught in the best schools and hardly anyone ever mastered. I remember that I picked it up and turned it to the light, the way you pick up a good piece of workmanship.</p>\n<p>\"Isn't it something,\" Booth said. \"The headwaiter says it's one of the new men. He won't tell me which. He says if the guests find out, they'll all want letters written, and he'll never see the man again.\" He laughed. \"I told him I'd pay double for a love letter in that hand. I could use one.\"</p>\n<p>I put the card down. But I did not forget it.</p>\n<p class=\"break\">&#10043;</p>\n<p>I saw Damon a few minutes later.</p>\n<p>He came through the door from the kitchen with a tray on his shoulder, in the white jacket that all the National's waiters wore, and he walked the length of the dining room and set down four plates at a table by the window without a sound, and turned, and saw me.</p>\n<p>It was a small thing. Nobody else in that room would have noticed it. His step did not change and his face did not change. But his eyes went to me, and stopped, and I watched them take me in the way they had taken in Lottie's newspaper that afternoon in the kitchen yard: quickly, left to right and down. My cane. My good coat, which Booth had paid for. The ink on my fingers from the lumber merchant's invoices. And the man across the table from me, laughing, with his hand on a bottle of wine.</p>\n<p>Then he looked away, and went back through the kitchen door, and was gone.</p>\n<p>\"Somebody you know?\" Booth said. He noticed everything that had to do with faces.</p>\n<p>\"A man who used to work on our farm.\"</p>\n<p>\"Ah.\" Booth lost interest at once. \"Well, he's done better for himself than most of them. The National doesn't take just anybody.\"</p>\n<p>Damon came back to our table twenty minutes later, to clear the plates. Booth was talking, as he always was, and he did not look up. The waiters at the National were not people to him. They were a kind of weather that brought food.</p>\n<p>I looked up. I said, quietly, \"Damon.\"</p>\n<p>He stopped, with my plate in his hand. For a moment I thought he would not answer me at all. Then he did.</p>\n<p>\"M-Mister. K-Keene.\"</p>\n<p>It took him a long time. The first sound stuck, and he waited for it with his jaw set, patiently, the way you wait for a stiff door, and then pushed it through. I had not known. On the farm I had never heard him say more than a handful of words at a time. I had thought that was caution, or the habit of that place. Some of it had been. Some of it, I understood now, sitting there, was this.</p>\n<p>\"Is Miss L-Lottie well?\" he said.</p>\n<p>It was the last thing I expected him to ask. I think it was the only thing he could have asked that I would have answered without thinking.</p>\n<p>\"She's well,\" I said. \"She reads too much.\"</p>\n<p>Something happened at the corner of his mouth that on another man would have been the start of a smile. \"She alw-ways did.\"</p>\n<p>He did not ask about my mother. He picked up the rest of the plates, and went away with them, and he did not come back to our table again that night. Another waiter brought the coffee.</p>\n<p>I had it before the coffee came. One of the new men, the headwaiter had said, and would not say which. A hand that had been taught, and taught well, and practiced for years. And a man I had watched in a kitchen yard reading a newspaper faster than I could, and hiding it, who had come to Washington four months ago and walked straight into the best hotel in the city. It was not a hard sum. Damon wrote the bills of fare.</p>\n<p>I was right about that. What I made of it was the likely thing: that somebody had taught him as a boy, in secret, at a risk to both of them I did not like to think about, and that he had hidden it for twenty years on our farm and was only now, in a free city, letting it show a little, on a card nobody would ever connect to him. It was the likely answer. It was even partly true.</p>\n<p class=\"break\">&#10043;</p>\n<p>I saw him every time I went to the National after that. I made a point of it. I told myself it was only habit, that I always want to see.</p>\n<p>He was always busy and always silent, a tall man in a white jacket at the edge of the room, never quite looking at anyone. Guests talked in front of him as if he were a chair. And I saw, because I was watching, that he was listening to every word of it.</p>\n<p>He listened most of all to Booth.</p>\n<p>I could hardly blame him. Booth was not a quiet man, in the dining room of the National, with a bottle in him. He said things about the President, in front of me and anyone else who happened to be near, that I will not repeat to you. He said them in the beautiful voice he had been trained to use in the largest theaters in America, and he laughed afterward, and the men at the tables around us laughed too, or pretended not to hear. Once, when he said something about what should be done with the President's new friends, the freedmen, Damon was pouring water at the next table. I watched the water stop. Only for a second. Then it went on pouring, and the glass filled, and Damon moved to the next one.</p>\n<p>I thought I understood that. A man who had been freed four months before, by a vote of a few hundred in a state that did not want to free him, standing in a room full of men who wished he were not free, and listening to the most famous of them talk. Of course he listened. In his place I would have listened too. I would have remembered every face in that room.</p>\n<p>What I did not think about, not once, was what he made of me. The Keene boy, who had come back from the war different, whom he had watched all that summer and fall and not liked what he saw. Sitting now at John Wilkes Booth's own table, in a coat Booth had bought him, talking low, with papers in his pocket.</p>\n<p>He had known me for four months on a farm. He had never known me to lie. And he had never, I think, had any reason to believe a single good thing about me.</p>\n<p>I did not think about any of that. I was busy watching the bridge.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there, and was quiet for long enough that Iola checked the red light on the recorder.</p>\n<p>\"The menus,\" she said. \"The handwriting.\"</p>\n<p>\"Yes?\"</p>\n<p>\"You worked it out that night. That it was him.\"</p>\n<p>\"Before the coffee came.\"</p>\n<p>\"Then what did you get wrong?\" She looked at her notes. \"You said it was partly true.\"</p>\n<p>He looked down at his notepad, and his pencil moved a little, going over something already drawn.</p>\n<p>\"The likely answer is nearly always the right one,\" he said. \"That's what makes it dangerous. You stop looking the moment you have it.\" He smiled slightly. \"I had it. So I stopped looking.\"</p>\n<p>On the drive home she tried to think of a way to check the handwriting on a bill of fare at a hotel that had been torn down eighty years ago, and could not think of one, and was annoyed with herself for trying.</p>", "added": 1790567995024, "pt": [1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790568656957, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790595815550, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790595815550, 1790595815550, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790567995024]}, {"num": 12, "title": "The Seventeenth", "html": "<p>It rained the whole way up. By the time she reached the gravel road it had settled into the steady kind of rain that meant it was not going to stop, and he met her on the porch with an umbrella big enough for three people and walked her in under it.</p>\n<p>She had her researcher card now. She had spent Monday morning in a basement room at the National Archives, watching a video about how to handle old paper, and had come out with a laminated card and a terrible photograph of herself. The Point Lookout microfilm had to be ordered ahead. It would be ready the next Tuesday.</p>\n<p>She did not tell him any of that. She set out the two recorders and said the date and the time, and then she said, \"March the seventeenth.\"</p>\n<p>\"You looked it up.\"</p>\n<p>\"Anyone who reads about the kidnap plot finds it. It's the day it was supposed to happen.\"</p>\n<p>\"Yes,\" he said. He was quiet a moment, listening to the rain. Then he picked up his pencil. \"I spent it under a bridge.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>March 17, 1865</em></p>\n<p>Booth's note came to the lumber yard at ten in the morning, carried by a boy who would not wait for an answer. It said, in his big, careless hand, <em>This afternoon. Your post. Bring the second horse.</em></p>\n<p>That was all. That was all it needed to say.</p>\n<p>The President was to drive out that afternoon to Campbell Hospital, on the edge of the city to the north, to see a play performed for the wounded. Booth and the others would wait on the road near the hospital. When the carriage came, they would stop it, and take the reins, and one of them would climb inside with the President and keep him quiet, and they would drive south through the city as fast as the horses would go, and cross the Eastern Branch at the Navy Yard Bridge, and be into Maryland before anybody understood what had happened. Herold had gone on ahead, down the county road, to wait for them with what they would need.</p>\n<p>My post was the bridge.</p>\n<p>I was to be waiting on the far side, the Maryland side, with a fresh horse on a lead. When the carriage came across, I was to take them off the main road at once, onto the back ways I had drawn for Booth on tobacco receipts in December, the ridge road and the farm lanes and the long way around the swamp, where no cavalry patrol would think to look for a carriage. By morning we would be at the river.</p>\n<p>I borrowed the second horse from the family I lodged with. I told them Booth wanted to buy it and would pay tomorrow. And a little after one o'clock, I led it across the Navy Yard Bridge, past the bored sentry, who did not even look at me, and found a place on the far bank, under the trees at the edge of the road, where I could see the whole length of the bridge and anyone coming across it.</p>\n<p>And I waited.</p>\n<p class=\"break\">&#10043;</p>\n<p>I have waited for a great many things, in a great many lives. I have waited for battles and for births, and for ships that did not come, and once for three days in a cellar for a city to stop burning over my head. Waiting does not get easier. You would think it might. It only gets more familiar, the way a bad tooth does.</p>\n<p>The afternoon went on. Wagons came across the bridge from the city, and the sentry waved them through, and I watched every one. Carts, a farmer's wagon full of empty barrels, two officers on horseback, a hearse. Every time I heard wheels on the planks, my heart went up into my throat and stayed there until I saw what it was.</p>\n<p>I tried to imagine it. I could not stop trying. The road by the hospital. The carriage slowing for the mud. Powell's great hand on the bridle. The tall man inside, in his black coat, looking up in surprise as the door opened. Frightened, badly, for some weeks. That was the trade I had made in the barn, in my own head. Fifty thousand men home, against one stubborn man frightened for some weeks.</p>\n<p>I had not let myself imagine his face before. Sitting under those trees, I found I could not stop.</p>\n<p>Three o'clock. The guard changed at the far end of the bridge, exactly when I had written down that it would.</p>\n<p>The new sentry noticed me. The old one never had. This one was young, and his uniform still had the creases from being folded, and he walked the length of the bridge twice, looking at the trees where I sat. On the third time he came off the end of it and down the bank toward me with his rifle across his body, and I understood that a man who has been sitting under a tree for two hours with a second horse, saddled, on a lead, is a man a new sentry is going to ask about.</p>\n<p>I had perhaps thirty seconds while he came down the bank. I used them to look at him.</p>\n<p>New uniform, so new to the post. That meant he had been told the rules that morning, and would want to be seen keeping them. He came toward me instead of calling out, so he was not frightened, only curious and a little proud of himself. His boots were caked to the ankle in red clay, so he had walked out that morning from the camp on the Maryland side, where the roads were worse than ours. And he had a good farm boy's walk, flat-footed, and when he passed my horse he ran his hand down its neck without thinking about it. He was from the country. He had horses at home. He missed them.</p>\n<p>\"What's the other horse for?\" he said.</p>\n<p>I did not tell him I was waiting for anyone. A man who says he is waiting for someone is asked who. I told him the horse was lame, and let him look.</p>\n<p>He crouched and picked up the off foreleg, the way I had known he would, because he had horses at home, and he found the stone I had wedged into the frog of the hoof an hour before, when I first saw the guard would change. He dug it out with his thumbnail and held it up and looked at me as if I were a fool.</p>\n<p>\"I didn't have a pick,\" I said. \"I was letting her rest it. My brother'll kill me if she's lamed. It's his.\"</p>\n<p>He laughed, and put the stone in my hand, and told me to walk her slow for a mile and she'd be fine, and went back up the bank to his bridge feeling that he had done his job, and a kindness besides. He never looked at me again. Why would he? He had already found the thing that was wrong.</p>\n<p>Four o'clock. Five. The light began to go. The horse beside me cropped the wet grass and did not care about any of it.</p>\n<p>It was nearly dark when a single rider came across the bridge at a hard trot, and my heart went up again, and then I saw that it was John Surratt, alone.</p>\n<p>He did not stop. He slowed only enough to lean down from the saddle as he passed, and I saw his face in the last of the light. He looked like a boy who had been slapped.</p>\n<p>\"He never came,\" John said. \"He never came near the place. He went to the National instead.\" His voice cracked on it. \"Go home, Keene. It's blown. Go home.\"</p>\n<p>And he kicked his horse on, south down the dark road toward Surrattsville, and was gone.</p>\n<p class=\"break\">&#10043;</p>\n<p>I did not go home.</p>\n<p>I should have. Everything that was sensible in me said so. Instead I led that borrowed horse back across the bridge, and through the streets of the Navy Yard, and up through the city toward Pennsylvania Avenue, because I had to know. I always have to know. It was more than a mile, and my leg had stiffened from the cold and the waiting, and I did not care.</p>\n<p>It was full dark by the time I reached the National. The street in front of it was still busy: soldiers, a great many of them, in a cheerful mood, and people coming away from something in the way crowds do after it's over. I asked a newsboy what had happened.</p>\n<p>A regiment from Indiana, he told me, had captured a rebel flag at some fort in North Carolina, and today they had presented it to the governor of Indiana, who was staying at the National. And the President had come to see it done. He had come instead of going to some hospital, the boy said, because the governor was a friend of his. And at four o'clock he had come out on the balcony, right up there, and made a speech.</p>\n<p>At four o'clock, I had been sitting under the trees by the Navy Yard Bridge, imagining his face.</p>\n<p>I went around to the side of the hotel, where the kitchen was. I do not know why. I think I already knew who I would find there.</p>\n<p>There were four or five of the waiters outside the kitchen door, in their white jackets, taking the air in the cold the way kitchen men do on a break, talking in low voices. They were talking about the President. I could hear it in the way they were standing before I could hear a word. Something had happened to them that afternoon, all of them, and they were still standing in the middle of it.</p>\n<p>Damon was among them. He was not talking. He was listening to the others, with his arms folded, and his face in the light from the kitchen door was a face I had never seen him wear. On the farm it had always been shut. Tonight it was open. It was the face of a man who had heard something he had waited his whole life to hear said out loud.</p>\n<p>Then he looked past the others and saw me.</p>\n<p>I knew what he saw. I have thought about it many times since. A man he knew to keep company with John Wilkes Booth, standing in the dark at the side of Booth's own hotel, on the night the President had come there. Mud to the knees. The clay of the Maryland side on his boots, from a riverbank, not from any street in the city. Sweat on his face, in March. And a saddled horse on a lead beside him, fresh, with nobody to ride it.</p>\n<p>A horse for someone who had not come.</p>\n<p>His face closed. It closed the way I had seen it close in the kitchen yard, when he heard my crutch on the step: smoothly, completely, like a door.</p>\n<p>He said something to the others, and they went in. He did not. He came a few steps toward me, into the edge of the light, and stopped.</p>\n<p>\"The P-President was here,\" he said. \"This afternoon.\"</p>\n<p>\"I heard.\"</p>\n<p>\"He sp-spoke. From the b-balcony. About the rebels, and their p-plan to make soldiers out of their slaves.\" He looked at me steadily. \"D-do you want to know what he said?\"</p>\n<p>I did not answer. He told me anyway.</p>\n<p>\"'I have always thought that all men should be free; but if any should be slaves, it should be first those who desire it for themselves, and secondly those who desire it for others. Whenever I hear any one arguing for slavery, I feel a strong impulse to see it tried on him personally.'\"</p>\n<p>He said it all the way through without a single stumble. Every word. As clear as a bell, as if he were reading it off the page. I learned long after, from men who knew about such things, that it is often that way: that a man who cannot get his own words out can sometimes say another man's perfectly, all in one breath, as if they were a song.</p>\n<p>He had heard it once, from the street below a balcony, a few hours before. And he had it word for word.</p>\n<p>\"G-good night, Mister Keene,\" he said. And he went back in through the kitchen door, and shut it.</p>\n<p>I stood there in the dark with the borrowed horse for a long time.</p>\n<p class=\"break\">&#10043;</p>\n<p>It fell apart after that, the way those things do, all at once and then slowly.</p>\n<p>Arnold and O'Laughlen went home to Baltimore within the week. Arnold wrote Booth a letter at the end of the month, telling him to wait, to go and see how Richmond felt about it first, to do nothing rash. I did not know about that letter then. Everyone in the country knew about it a month later. The police found it in Booth's trunk.</p>\n<p>John Surratt rode south to Richmond on some errand of his own and was gone for weeks. Atzerodt went back to drinking. Powell went back to wherever Powell went. Booth raged for a few days, and then went quiet, and then left the city for a while.</p>\n<p>I went back to the lumber merchant's invoices, and told myself it was over.</p>\n<p>My mother's letter that week ended the way they all did. <em>Not yet.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>He put the pencil down.</p>\n<p>Iola had her phone out. She had not meant to take it out, but she had, and she had found it while he was still talking. March 17, 1865. Speech to the One Hundred Fortieth Indiana Regiment, from the balcony of the National Hotel. <em>Whenever I hear any one arguing for slavery, I feel a strong impulse to see it tried on him personally.</em></p>\n<p>Word for word.</p>\n<p>\"You could have memorized that,\" she said. It came out more quietly than she meant. \"It's famous. It's the kind of thing people put on posters.\"</p>\n<p>\"I could have,\" he agreed. \"Anyone could. That wasn't the point of the story.\"</p>\n<p>\"What was the point?\"</p>\n<p>He looked at the window, at the rain running down it.</p>\n<p>\"He had heard the President of the United States say it,\" he said. \"Out loud. In the street, in front of everyone, about men like him. And I had spent that same afternoon sitting under a bridge, waiting to steal the man who said it.\"</p>", "added": 1790568656957, "pt": [1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957]}];

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
    ${coverFixes()}
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();

}
function toc() {
  main.innerHTML = `<section class="toc"><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.num}</span><span>${c.title}</span>${badge(c)}</button></li>`).join("")}</ol></section>`;
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter">
    <header><div class="num">Chapter ${c.num}</div><h2>${c.title}</h2></header>
    <div id="fixbarSlot"></div>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  markFixes(c);
  $("where").textContent = `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();

// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}

const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
const CKEY = store.get("ckey", null);
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}

$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString(), v: BUILD };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// ---- fixed since you last looked (pencil readers only) ----
// Each paragraph carries the build time its text last changed (c.pt). "seen" is, per chapter,
// the newest change the reader has acknowledged. A chapter they've never opened is NEW.
function seenAt(num) { return store.get("seen", {})[num] || 0; }
function setSeen(num, t) { const s = store.get("seen", {}); s[num] = Math.max(s[num] || 0, t); store.set("seen", s); }
function fixCount(c) { const since = Math.max(seenAt(c.num), c.added); return c.pt.filter(t => t > since).length; }
function isNew(c) { return c.added > seenAt(c.num); }
function badge(c) {
  if (!CKEY) return "";
  if (isNew(c)) return `<span class="tag new">New</span>`;
  const n = fixCount(c);
  return n ? `<span class="tag">${n} fixed</span>` : "";
}
function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">Ch ${c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const since = seenAt(c.num);
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => c.pt[i] > since);
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} fixed since you last looked, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
