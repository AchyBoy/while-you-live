<script>
const BOOK = {"series": "While You Live", "title": "Sic Semper", "number": 1};
const CHAPTERS = [{"num": 1, "title": "The Offer", "html": "<p>The electric bill was on top because it was the only one printed in red.</p>\n<p>Iola Barnett moved it to the bottom of the pile, which changed nothing, and then moved it back, which changed less. Through the wall she could hear Freda on the phone, laughing the low, careful laugh she saved for friends. Sixteen. A good kid, everyone said so, and Iola believed it. But lately there was a door in her daughter that stayed shut, and Iola had not yet found out what was behind it.</p>\n<p>Dinner was done and the dishes put away. Tomorrow's lunches were already in the fridge, and the permission slip for Friday was signed and clipped to Freda's bag. On the laptop, tonight's job sat open: four hundred words on why a family should choose one brand of gutter guard over another.</p>\n<p>These days Iola wrote whatever people paid her to write. The gutter company paid sixty dollars a piece and paid on time, which put it ahead of most. There was also a dentist who wanted a blog, a retired man writing a memoir about forty years in the carpet business, and a real estate office that sent her photos of houses and asked her to make them sound bigger. She did all of it well and on time. It paid most of the bills. None of it would ever be read twice.</p>\n<p>There had been a time when people quoted her. Not often, and not on television, but in rooms that mattered, by people who had read the whole piece. She had been the reporter who went and checked the thing everyone else took for granted. As far as she had ever understood it, that was the whole job: find out whether it was true.</p>\n<p>Then there had been the auction house story.</p>\n<p>Six years ago, a man had called the newsroom and asked for her by name. He worked in the back rooms of Carrow House, the old auction house downtown, the one with the brass doors and the catalogs printed on heavy paper. His job was repairing old documents before they went to sale: flattening letters, mending torn deeds, rebinding diaries that had come apart at the spine. He said that some of the letters Carrow sold as genuine, signed by presidents and generals and famous names, were not genuine at all. He said he could prove it. He said he had been asked to <em>repair</em> some of them, and that the damage he had been asked to repair was new.</p>\n<p>It had taken her eight months. She had met him in diners and parking lots and once, memorably, in a laundromat. She had checked everything he gave her, and everything he gave her had checked out. The story ran on a Sunday, on the front page, under her name.</p>\n<p>On Monday, Carrow House sued.</p>\n<p>On Wednesday, her source was gone. Not fired, not arrested, not quoted in a rival paper denying everything. Gone. His apartment was empty, his phone was off, and nobody who knew him would say where he had gone, if they knew. Without him, the documents he had given her were only documents. Carrow's lawyers said the documents were themselves fakes, made up to smear an honest business. The paper's lawyers called it a difficult position. By the end of the year the paper had printed a correction that took up more space than some of her stories had, and Iola had been let go with a handshake and a box.</p>\n<p>Everyone in the business knew what that meant. It meant she had made it up.</p>\n<p>The envelope had come that afternoon. She had left it unopened on the counter beside the fruit bowl, because nothing good arrived in paper that heavy. Heavy paper meant lawyers, and lawyers were how the last story had ended.</p>\n<p>She opened it anyway, because the electric bill was red.</p>\n<p>It was from a firm she had never heard of, Aldine, Mercer and Voss, with an address in a city she had never been to. The letter was typed, polite, and longer than she expected.</p>\n<p><em>Dear Ms. Barnett,</em></p>\n<p><em>We act for a private client who wishes to engage a writer to record the recollections of an elderly gentleman. The sessions would take place at the gentleman's home, at his convenience and yours. Our client will pay three thousand dollars per session, for no fewer than ten sessions, with travel costs covered in full. You would be free to decline at any point.</em></p>\n<p><em>We should say plainly that the gentleman is not famous, and that his recollections will not, on their face, seem credible. Our client does not ask you to believe them. He asks you to listen carefully, to write down what you are told in the way it is told, and from time to time to put to the gentleman a question our client will send you. Whether any of it is ever published is a matter for you and the gentleman. Our client has no interest in it.</em></p>\n<p><em>Our client has followed your work for some years, including your reporting on Carrow House, and he knows how that ended. He asks us to tell you that it is the reason he chose you. He needs someone who checks everything and accepts nothing until she has, and who knows what it costs to be right when no one believes you.</em></p>\n<p><em>Lastly, our client asks us to add that he has always believed you about Bookbinder.</em></p>\n<p>She read that line four times. Then she put the letter face down on the counter, the way she would put down a hot pan, and stood with her hand flat on top of it.</p>\n<p>Nobody knew about Bookbinder.</p>\n<p>That was not a figure of speech. It was the name she had given her source in her own notes, because of the work he did and because she never wrote a real name down where someone could find it. It was in her own handwriting, in a notebook that had never left her bag. It had not been in the paper. It had not been said to her editor, who had only ever called him <em>your guy.</em> It had not been said to the lawyers, who had called him <em>the alleged source</em> until the word <em>alleged</em> was all anyone remembered.</p>\n<p>Two people on earth had known that name. One of them was standing in her kitchen with her hand on a letter. The other one had been gone for six years.</p>\n<p>\"Is that from the lawyers?\"</p>\n<p>Freda was in the doorway, phone against her chest, the call not ended, only muffled. She had her father's height and none of his patience. Her eyes were already on the letter under her mother's hand. She read everything that way, upside down and faster than she let on.</p>\n<p>\"Different lawyers,\" Iola said.</p>\n<p>\"Worse?\"</p>\n<p>\"Richer.\"</p>\n<p>Freda came in and took an apple from the bowl, though she never ate the apples. She did not ask to see the letter, which meant she wanted to. Iola turned it face up and slid it across. There was no point hiding it. Her daughter had been reading over her shoulder since she was four.</p>\n<p>Freda skimmed it the way you skim a menu when you already know what you're having, and then she stopped at the bottom.</p>\n<p>Below the typed signature of someone named R. Aldine, in a different ink, there was one more line, written by hand. The writing was old-fashioned, the kind taught when handwriting was still a subject in school, and it leaned a little too far to the right. The downstrokes shook, very slightly, like a picture hung on a wall that trucks drove past.</p>\n<p><em>Please ask him what he thinks of 1865.</em></p>\n<p>\"Somebody's grandpa wrote that,\" Freda said.</p>\n<p>\"Maybe it's the gentleman.\"</p>\n<p>\"No, the gentleman's the one you're interviewing. This is the one paying.\" Freda tapped the line with the apple. \"What happened in 1865?\"</p>\n<p>\"The Civil War ended. Lincoln was shot.\"</p>\n<p>\"So he's a history guy.\"</p>\n<p>\"Apparently.\"</p>\n<p>\"Weird thing to pay for.\" Freda read the figures again. From the phone against her chest, her friend's voice said something small and impatient. \"Three thousand dollars. Each time.\"</p>\n<p>\"I can read.\"</p>\n<p>\"Ten times is thirty thousand dollars.\"</p>\n<p>\"I can also add.\"</p>\n<p>Freda looked at her, and for one second she was not sixteen at all. She was the child who had sat on the stairs six years ago while her mother cried in the kitchen and pretended to be on the phone. She had never mentioned it. Neither had Iola.</p>\n<p>\"Are you going to go?\" Freda said.</p>\n<p>\"I don't know yet.\"</p>\n<p>\"You're going to go.\" Freda lifted the phone back to her ear, said \"Sorry, my mom,\" into it, in the voice that meant <em>my mom</em> was a long and tragic story, and went back to her room. The door closed. It didn't slam. Iola had learned to be grateful for the difference.</p>\n<p>She finished the gutter guards first, because she had said she would, and because sixty dollars was sixty dollars. It took twenty minutes. Then she opened a new window and did what she had not done for six years. She started checking.</p>\n<p>Aldine, Mercer and Voss was real. That was the first surprise. It was registered, it was old, and it had a website with a street address, a phone number, and almost nothing else: no photographs of smiling partners, no list of the kinds of cases it took, no news. The kind of firm, she thought, that did not need to find clients, because its clients already knew where it was. There was an R. Aldine on the state bar list, admitted forty-one years ago, with no complaints against him. There was nothing else about him at all, which was harder to arrange than people thought.</p>\n<p>She searched for Carrow House, which she had not let herself do in a long time. It was still there. It had had a good year. There was a photograph of the brass doors.</p>\n<p>She searched for her source's real name, the one she never wrote down, and found what she had found every other time she had looked, back when she still looked: an old address, an old phone listing, and after that, nothing. No obituary. No new address. No arrest. A man who had simply stopped.</p>\n<p>At midnight she closed the laptop and wrote on the back of the envelope, by hand, the way she used to plan a story:</p>\n<p><em>Bookbinder.</em></p>\n<p><em>Who else knew?</em></p>\n<p>She underlined <em>who.</em> Then, under that, because she was honest with herself on paper even when she was not anywhere else:</p>\n<p><em>Electric. Car insurance. Freda's teeth.</em></p>\n<p><em>Thirty thousand dollars.</em></p>\n<p>It felt like picking up an instrument she used to play and finding that her hands still knew where to go.</p>\n<p>In the morning, after the school run, she called the number on the letterhead.</p>\n<p>A woman answered on the second ring. She said that Mr. Aldine had been expecting to hear from her, which Iola did not like. She said that the gentleman lived about two hours north, which was fine. And she said the first session could be as soon as Thursday at ten, which was too soon, and which Iola heard herself agree to.</p>\n<p>\"Can you tell me who your client is?\"</p>\n<p>\"I'm afraid our client prefers not to be named.\"</p>\n<p>\"Can you tell me who the gentleman is?\"</p>\n<p>\"He'll tell you himself, I expect,\" the woman said. \"I'll let him know it's Thursday at ten. He said to tell you he'll have the kettle on.\"</p>\n<p>\"Does he know why your client wants his story?\"</p>\n<p>A pause, and the soft click of a keyboard.</p>\n<p>\"I don't think anyone does, Ms. Barnett,\" the woman said. \"That's rather the point of hiring you.\"</p>\n<p>On Wednesday night she told Freda over dinner. Freda said, \"I told you,\" and then, after a moment, \"Is it safe?\" which was not a question Iola had expected, and which she answered with more confidence than she had.</p>\n<p>\"He's an old man who wants to tell somebody about his life,\" she said. \"I've interviewed a hundred of them.\"</p>\n<p>\"And the one paying?\"</p>\n<p>\"Also old, apparently.\"</p>\n<p>\"Old and rich and weird,\" Freda said. \"Text me when you get there.\"</p>\n<p>\"I will.\"</p>\n<p>\"Text me when you leave.\"</p>\n<p>\"Who's the mother here?\"</p>\n<p>Freda almost smiled. Her phone buzzed on the table beside her plate, and she turned it face down without looking at it, and asked for the salt.</p>\n<p>On Thursday Iola dropped Freda at school, stopped for gas, and drove north with the letter on the passenger seat, face down. The city thinned into highway and the highway into two-lane road, past farm stands closed for the season and a church with a sign that said <em>God answers knee mail.</em> She had printed the directions, because she did not trust her phone out here, and because she was the kind of person who printed directions.</p>\n<p>At every red light she rested her hand on the letter, as if it might get up and leave.</p>"}, {"num": 2, "title": "The Old Man", "html": "<p>The house was at the end of a gravel road, past a mailbox with no name on it, and it was smaller than she had expected. White clapboard, a porch with two chairs, a vegetable garden gone to seed for the winter. Somebody had raked the leaves into a neat pile by the fence and then, apparently, lost interest in doing anything else with them.</p>\n<p>Iola parked behind an old blue pickup truck and sat for a minute with the engine off.</p>\n<p>She texted Freda, <em>Here. Nice old house. Normal.</em> She waited until the reply came, <em>ok,</em> followed a moment later by <em>text when u leave,</em> and then she put the phone in her bag, picked up the folder with her printed directions and the letter in it, and got out.</p>\n<p>The front door opened before she reached the porch.</p>\n<p>He was taller than she had pictured, and straighter. Somewhere in his seventies, with white hair cut short and a gray cardigan buttoned wrong by one button, so that one side hung lower than the other. His face was lined in the way of people who had spent a lot of time outdoors and not worried about it. His eyes were a pale, washed blue, and they went over her once, not rudely, the way a mechanic listens to an engine.</p>\n<p>\"Ms. Barnett,\" he said. \"You found it. People usually drive past the mailbox.\"</p>\n<p>\"I nearly did.\"</p>\n<p>\"Everyone does. I keep meaning to paint my name on it, and then I don't.\" He stepped back to let her in. \"Tom Hale. The kettle's on, as promised. I hope you drink tea, because I'm afraid the coffee here is a crime.\"</p>\n<p>Inside, the house was mostly books.</p>\n<p>They were on shelves that went to the ceiling, and in stacks on the floor beside the shelves, and on the stairs, one to each step, like they were climbing up to bed. There were books in English and books in languages she didn't recognize, paperbacks with cracked spines and old leather volumes with the titles rubbed off. A woodstove ticked in the corner. There was a worn armchair by the window with a lamp beside it, a small table with a chess game half finished and nobody to finish it, and a second, newer armchair across from it that had plainly been bought for company and not used much.</p>\n<p>\"Sit, please,\" he said. \"That one. It's the one that doesn't eat people.\"</p>\n<p>She sat. He went into the kitchen, and she heard the tick of the kettle, the clink of cups, and the particular care of someone who lived alone and did things in the same order every day.</p>\n<p>She looked around, because looking around was a habit she had never been able to break. A calendar from the feed store, still on last month. A pair of reading glasses on the windowsill and a second pair on the table, as if he had lost the first and given up. On the wall, one framed photograph: a woman laughing on a beach, the colors faded to orange, the kind of photo that had been taken on film. A heavy old radio. A bird feeder outside the window, freshly filled. On the mantel, among the clocks and candlesticks, a small wooden frame stood empty, its glass polished clean, as if it were waiting for something.</p>\n<p>He came back with a tray. Two cups, a teapot in a knitted cover, a plate of shortbread that had come out of a tin.</p>\n<p>\"You drove someone to school this morning,\" he said, setting the tray down.</p>\n<p>Iola looked at him.</p>\n<p>\"Your passenger seat,\" he said. \"I saw it when you opened your door. It's pushed all the way back, as far as it goes, and you're not tall, so you didn't do that. Someone taller than you rides with you, often enough that you've stopped moving it back. There's a hair tie around the gearshift, the thick kind. And it's a school day, and you were here at ten, from two hours away, so you left at eight, which is about when schools open.\" He poured. \"A daughter, I'd guess. Tall, like her father, I expect. But I wouldn't bet the house on any of it.\"</p>\n<p>\"You were watching from the window.\"</p>\n<p>\"I was. I'm old. It's what we do.\" He smiled, and it changed his face completely, took ten years off it. \"Also, you have printed directions in that folder. Most people trust their phones. People who print directions have usually been let down before, and don't intend to be let down again.\"</p>\n<p>\"That's a lot to get from a car seat and a folder.\"</p>\n<p>\"Most guesses are wrong,\" he said. \"The trick isn't guessing. It's noticing, and then checking. I suspect you already know that.\"</p>\n<p>She took out her phone and set it on the table between them, and beside it, because she had been burned before, a small digital recorder she had owned for eleven years.</p>\n<p>\"Two?\" he said.</p>\n<p>\"One of them always dies.\"</p>\n<p>\"Which one?\"</p>\n<p>\"Whichever one I trusted.\"</p>\n<p>He laughed at that, a real laugh, and picked up the notepad and pencil from the arm of his chair and settled them on his knee. The top page was already covered in doodles, the kind people make on the phone or while they wait: the same shape, over and over, some gone over so many times that the pencil lead shone. She saw it the way you see a stranger's doodles on a train. A five-pointed star, each one drawn in one long line, with a tiny letter tucked into each point. Greek, she thought, or something like it. While she checked the levels and said the date and time into the phone, the way she always had, his pencil found one of the stars and began, without his looking down, to go over it again.</p>\n<p>\"Mr. Hale,\" she said.</p>\n<p>\"Tom.\"</p>\n<p>\"Tom. Before we start, let me explain how I work. With your permission, I'll record our conversations. Anything that can be verified, I'll verify: names, dates, places. If something you tell me doesn't match the record, I'll tell you, and I'll ask you about it. I'm not trying to catch you out. It's how I make sure that what I write down is accurate.\"</p>\n<p>\"I know,\" he said. \"It's why I agreed.\"</p>\n<p>\"The letter said your memories would not seem credible.\"</p>\n<p>\"Did it say that?\" He seemed pleased. \"That's honest of them. They won't. I can tell you now what I'm going to tell you, and you can decide whether to put your coat back on.\"</p>\n<p>\"Go ahead.\"</p>\n<p>He put the pencil down.</p>\n<p>\"I have lived before,\" he said. \"Not in the way people mean on television, with past-life regression and a woman with a crystal. I mean that I have been other people, one after another, for a very long time, and I remember them. Not perfectly. The way you remember your childhood. Some of it very clearly, and some of it gone, and some of it I would rather have lost.\"</p>\n<p>The woodstove ticked. Outside, a truck went by on the far road, and the sound of it came and went.</p>\n<p>Iola had interviewed a man who believed he had been abducted by aliens, twice, and a woman who believed her late husband spoke to her through the microwave. She had interviewed a state senator who believed he had never taken a bribe. She had found, over the years, that the useful thing was not to argue. You let them tell it. People who were lying tripped over their own stories, if you gave them room. People who believed something strange usually told it the same way every time, which was its own kind of information.</p>\n<p>So she only said, \"How long is a very long time?\"</p>\n<p>\"Longer than I would like you to write down today,\" he said. \"Where would you like to start?\"</p>\n<p>\"My client sent a question,\" she said. She opened the folder, found the letter, and read out the handwritten line at the bottom.</p>\n<p>\"'Please ask him what he thinks of 1865.'\"</p>\n<p>He didn't answer at once. He looked at the window, where there was nothing to see but the raked leaves and the fence and the gray sky over the field. His hand had gone back to the notepad, and the pencil was moving again, slowly, over the same star.</p>\n<p>\"What I think of it,\" he said.</p>\n<p>\"That's what it says.\"</p>\n<p>\"It's a strange way to put it.\" He was quiet a moment longer. \"I think it rained for most of that spring. People forget that. They picture it all in sunshine because the war was ending, and the pictures in the books are all taken on bright days, because you needed a bright day to take a picture then. But I remember mud. The inauguration in March, the streets were a river of mud, you couldn't cross Pennsylvania Avenue without losing a shoe. And it rained all morning, and then when he stood up to speak, the sun came out. Right then. Everyone saw it. People said it was a sign.\"</p>\n<p>\"Lincoln,\" she said.</p>\n<p>\"Lincoln.\" He said the name carefully, as if it were something that might break. \"I didn't think it was a sign. I remember thinking that it was only weather. I was wrong about a great many things that spring. That was one of the smaller ones.\"</p>\n<p>Iola wrote <em>sun, inauguration, March 1865, check</em> in her notebook. It was the kind of detail anyone could find in a library. It proved nothing. She noted, too, that he had said it the way you describe something you saw from where you stood, and not the way you describe something you read. That also proved nothing. People who told stories well could do that. It was her job not to be impressed.</p>\n<p>\"You were in Washington,\" she said.</p>\n<p>\"I was in Washington,\" he said. \"But that's not where it begins. It begins the summer before. July of 1864.\"</p>\n<p>\"What happened in July of 1864?\"</p>\n<p>He set the pencil down on the notepad, on top of the star, and folded his hands.</p>\n<p>\"I woke up,\" he said, \"in a field outside Washington, in a body that wasn't mine yet. It was the hottest day I had felt in a hundred years. And somebody was shooting at me.\"</p>"}, {"num": 3, "title": "Fort Stevens", "html": "<p><em>July 1864</em></p>\n<p>The first thing I knew was the heat.</p>\n<p>Not warmth. Heat, the kind that sits on your chest like an animal. I was lying on my stomach in dry grass, and the ground under me was hot through my shirt, and the air smelled of dust and powder smoke and something sweet and rotten that I did not want to think about yet. Somewhere to my left, very close, a man was shouting a name over and over.</p>\n<p>\"Kit. Kit! You hit?\"</p>\n<p>There is a rule I keep for the first hour of a life, and it has kept me alive more than once. Say as little as you can. Move as little as you can. Watch everything. You do not yet know your own name, or your own voice, or who around you is a friend. Every word you speak is a chance to be wrong.</p>\n<p>So I did not answer at once. I opened my eyes and looked at my hands.</p>\n<p>They were young hands, brown from the sun, the knuckles scraped, with hard yellow calluses across the palms where a plow handle or an axe had worn them. Farm hands. There was a rifle under them, long and heavy, its wooden stock dark with sweat. The sleeves above them were a coarse gray-brown cloth, homespun, the color of dry dirt. There was a hole in one elbow that somebody had darned with the wrong color thread.</p>\n<p>\"Kit!\"</p>\n<p>A hand grabbed my shoulder and rolled me half over. A face above me, sunburnt, a thin beard, missing a tooth on one side. Perhaps twenty years old. Frightened, and trying not to be.</p>\n<p>\"I'm all right,\" I said.</p>\n<p>My voice came out lower than I expected, and it came out soft and slow, rounding the words the way his did. The body knows its own accent, if you let it. You only have to not get in its way.</p>\n<p>\"Thought you was dead,\" he said. \"You just dropped.\"</p>\n<p>\"The heat,\" I said, which was true, in its way.</p>\n<p>\"Lord, the heat.\" He let go of me and crawled back to his place behind a rail fence that had been knocked half flat. \"Keep your head down. Them sharpshooters in the fort can see a cat blink.\"</p>\n<p>I kept my head down, and I looked.</p>\n<p>We were in a line of men strung out along the fence and behind the trees and in the ditches of a road, all of us in the same dirt-colored cloth, all of us lying as flat as the ground would let us. Ahead, across a stretch of open fields and the stumps of trees that had been cut down on purpose, rose a long, low wall of earth with the dark mouths of cannon in it. Above it, limp in the windless air, a flag. Stars and stripes.</p>\n<p>A fort. And we were the ones outside it.</p>\n<p>The men around me were talking in the low, tired way of soldiers who have marched too far in too little time. I listened, and I learned. They said <em>Old Jube</em> and <em>the Valley</em> and <em>the Monocacy</em>, and they spoke about a fight two days back where they had driven off some Yankees at a river and lost good men doing it. They said <em>Washington</em>, again and again, the way you say the name of something you can almost touch. One man said the city was right there, past that fort, and that if they could just get over that one wall they could walk down the avenue and take their dinner in the President's house.</p>\n<p>Another man said that if they could just get over that one wall, they would all be dead, and that he had seen the Yankee boats coming up the river that morning full of men in blue.</p>\n<p>\"That's just militia,\" the first man said. \"Clerks and old men.\"</p>\n<p>\"Them ain't clerks,\" said the second man. \"Them's the Sixth Corps. I seen their flags.\"</p>\n<p>Nobody answered him after that.</p>\n<p>So. It was summer, it was the war between the states, and I was on the side that had come to take the capital and was beginning to understand that it could not. I did not know the year for certain until that afternoon, when a boy down the line read aloud from a newspaper he had taken off a dead man, and the date at the top of it said July of 1864. I did not know my own full name until the next morning, when I found a letter in my jacket addressed to a Christopher, with a Maryland return address, in a mother's careful hand.</p>\n<p>I did not know what would happen next. People always forget that. I am not a prophet. I have never once woken up knowing how a thing would end. I only ever know what I have lived, and I had never lived this.</p>\n<p>We lay in that field for two days.</p>\n<p>The heat did not break. Men fainted and were dragged back into the shade. Water came up in buckets from a spring and never lasted. Every so often the fort's big guns would fire, and the ground would jump under us, and a house or a stand of trees somewhere out in front would come apart. Our own sharpshooters had climbed into the upper windows of the farmhouses in front of the fort and into the tops of the trees, and they kept up a steady, patient fire at the wall, and the men on the wall kept up a steady, patient fire back.</p>\n<p>On the second afternoon, the twelfth, I saw him.</p>\n<p>I had crawled forward to a place behind a stone wall where I could see the fort more clearly. I told the boy with the missing tooth that I wanted a better look at their guns. In truth I wanted to understand where I was, and who I was fighting, and whether we were going to die here. The smoke drifted and thinned, and for a moment the whole length of the parapet was clear in the white afternoon light.</p>\n<p>There were officers on the wall, in blue, with swords and field glasses, crouched low the way sensible men crouch when there are rifles pointed at them. And among them, standing up straight, taller than all of them by a head and more, was a man who was not an officer at all.</p>\n<p>He wore a long black coat, a civilian's coat, and a tall black hat that made him taller still. He was standing on the top of the wall with nothing in front of him but air, looking out over the fields toward us, as calmly as a farmer looking at weather.</p>\n<p>I remember that I noticed three things about him, and I remember the order I noticed them in.</p>\n<p>First, that he was not a soldier. His coat was wrong, and the way he stood was wrong. A soldier on a wall under fire makes himself small without thinking. This man had never learned to.</p>\n<p>Second, that the officers around him were frightened, and not for themselves. They kept glancing at him and then at each other. One of them had a hand half raised, as if he wanted to take hold of the man's sleeve and did not dare.</p>\n<p>Third, that they were not frightened of him. They were frightened <em>for</em> him. Whoever he was, they could not afford to lose him.</p>\n<p>A rifle cracked from one of the trees ahead of me. On the wall, a man standing near the tall one, an officer in blue, jerked and folded and went down out of sight.</p>\n<p>The others moved then. Hands took the tall man by the arms and the coat. Someone was shouting. I could not hear the words at that distance, only the sharpness of them. For one moment longer he stood there, as if he were deciding whether to be offended. Then he stepped down behind the earth, and the wall was only a wall again.</p>\n<p>I lifted my head to see where he had gone.</p>\n<p>That was a mistake. I have made it, in one form or another, in more lives than I would like to tell you. I wanted to see. I always want to see.</p>\n<p>The shot came from my right, from the fort's end of the field, and it went through my left leg just above the knee. It did not hurt at first. It felt as if someone had struck the leg with a heavy stick, very hard, and then the leg was not there anymore, and I was on my back in the grass looking up at the white sky.</p>\n<p>Then it hurt.</p>\n<p>Toward evening the men in blue came out of the fort, the ones from the boats, the ones that were not clerks. They came across the fields in long lines, and our skirmishers fell back in front of them, and for an hour the air was nothing but noise. Somebody dragged me behind the stone wall. Somebody tied a belt around my leg and pulled it tight enough that I screamed, and I heard my own voice and did not recognize it.</p>\n<p>When it was dark, the army left.</p>\n<p>I heard it go. You can hear an army leave, even a quiet one: the wagons, the horses, the long shuffle of feet on a dry road, the voices telling each other to hush. Old Jube was going back the way he had come, back to the Potomac and over it into Virginia, and he was taking everyone who could walk.</p>\n<p>I could not walk.</p>\n<p>The boy with the missing tooth came and knelt by me in the dark. He said he was sorry. He said they had orders. He said someone would come, that there were people in Maryland who were friends to us, that they would find me and see me right. He put a canteen in my hands, half full, and a piece of hard bread, and he pressed my shoulder once, and then he was gone with the others.</p>\n<p>I lay behind the wall and listened to the army go, and to the crickets come back after it, and to the sound of my own breathing.</p>\n<p>I thought about the tall man on the wall. I did not know yet who he was. I thought I could guess. I thought that I had been, for one afternoon, a few hundred yards from the most important man in this country, close enough to see the shape of his hat against the sky, and that I had been lying in a field with a rifle, on the side that wanted him gone.</p>\n<p>It was a strange thought. It did not seem to mean anything yet.</p>\n<p>Near morning, I heard a wagon on the road, moving slowly, without lights. It stopped. A woman's voice said, very low, \"Here. There's one here. He's alive.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>The recorder's small red light was still on. Iola realized she had not written anything in her notebook for some time.</p>\n<p>Tom Hale was looking at the window again. The sky over the field had gone a flat, pale gray. On the notepad on his knee, his pencil had stopped moving.</p>\n<p>\"That was Lincoln,\" she said. \"On the wall.\"</p>\n<p>\"Yes.\"</p>\n<p>\"You said you didn't know.\"</p>\n<p>\"I said I didn't know yet,\" he said. \"I found out later, the way everyone did. From a newspaper.\" He smiled, but it was not the smile from before. \"You'll want to check it.\"</p>\n<p>\"I'll check it.\"</p>\n<p>\"Good,\" he said. \"Check the surgeon too. The man who fell beside him. He was a doctor from Pennsylvania. He lived, I think. I was always glad of that.\"</p>\n<p>She wrote it down. <em>Surgeon. Pennsylvania. Check.</em></p>\n<p>Outside, a bird landed on the feeder, looked at the window, and flew away again.</p>"}, {"num": 4, "title": "Charles County", "html": "<p><em>July to November 1864</em></p>\n<p>The woman's name was Margaret Keene, and she was my mother.</p>\n<p>I learned the first part that morning, from a Union picket on the road below Washington, who stopped the wagon and asked it. I learned the second part a few minutes earlier, when she climbed down into the ditch where I lay, took my face in both her hands, and said, \"Oh, Kit. Oh, my boy,\" and wept against my shoulder while I lay there not knowing her at all.</p>\n<p>There is no rule for that. I have been somebody's son many times, and it has never become easier. She had loved this boy for nineteen years. She had come forty miles, two days on the road and the last of it in the dark, through an army's leavings, on nothing but a rumor that Kit's company was outside Washington, to find him. And the boy she found was not there anymore, and the one she held instead had to decide, in that first moment, whether to tell her.</p>\n<p>I have never told them. Not once, in all the lives. I tell myself it would be cruel. Some nights I think the truth is that I am a coward. Both of those can be true.</p>\n<p>So I said, \"Mama,\" because that was the word the body wanted, and she held on tighter, and I let her.</p>\n<p>There was a man with her. He lifted me out of the ditch and laid me in the back of the wagon on a pile of feed sacks as carefully as if I were made of glass, and he never once looked at my face. He was tall, with gray at his temples, and a scar through one eyebrow. I heard her call him Damon. <em>Damon, the blanket. Damon, mind his leg.</em> He did everything she asked before she had quite finished asking it.</p>\n<p>Then he put sacks of new potatoes over me and around me until I was a lump among the potatoes, and I lay in the dark and the smell of earth and listened to the wheels.</p>\n<p class=\"break\">&#10043;</p>\n<p>Maryland was a Union state. People forget that, too. It had stayed in the Union, mostly because the Union had made sure of it, with soldiers at the rail junctions and soldiers in Baltimore and soldiers at the bridges. But the southern counties, the tobacco counties, the counties that ran down the long peninsula between the Potomac and the Chesapeake Bay, belonged to the Confederacy in every way but the one on the map. Their sons had gone across the river to fight for Virginia. Their letters went back and forth by boat at night. Everyone knew someone who hid someone.</p>\n<p>It took us two days to reach home. We went south out of the city on back roads, and every few miles there was a picket, bored and hot, and every time Margaret Keene said she had been to market in Washington and was going home, and every time she smiled at the soldiers like a woman with nothing under her potatoes. One of them took a handful of potatoes for his supper and let us go.</p>\n<p>We stopped once to water the horse, at a crossroads tavern at a place called Surrattsville. A widow kept it. She came out on the porch to talk with my mother in low voices, and when she went back in, there were two more blankets and a jar of broth in the wagon that had not been there before.</p>\n<p>I remember that I thought nothing of it. It was only kindness.</p>\n<p class=\"break\">&#10043;</p>\n<p>The Keene farm lay a few miles from a village called Bryantown, in low green country cut through by creeks and a great dark swamp that the locals called the Zekiah. Tobacco, mostly, and corn and some hogs. A white house with a long porch, a kitchen built separate from the house because of the heat and the risk of fire, a tobacco barn, and behind the barn, in a row, the small log cabins where the people lived who did the work.</p>\n<p>I was in bed for most of August with fever.</p>\n<p>A doctor came from Bryantown, a thin, nervous man who smelled of tobacco and camphor and said very little, and he looked at my leg and looked at my mother and said he could take it off above the knee, and then I would very likely live. My mother said no. He said then I would very likely die. My mother said we would see. He left some powders and did not come back for a week, and I think he expected to be called for my funeral.</p>\n<p>I did not die. I lived because my mother sat up with me every night for three weeks, and bathed the wound with boiled water and salt when the doctor said not to, and because the bullet had gone clean through and missed the bone, and because this body was young and had been fed well all its life. And, perhaps, because I did not want to die yet. I had seen something from that field that I did not understand, and I have never been able to leave a thing I do not understand.</p>\n<p>While I had the fever I was allowed to say strange things. Afterward I had to be more careful.</p>\n<p>There is a craft to becoming someone who already exists. You must never say a name first. You wait until someone else says it, and then you use it as though you have always known it. You must never tell a story from your past; you let others tell them, and you laugh in the right places, and you say <em>I don't remember that</em> often enough that it becomes a joke about the war and your head. You learn where the cups are kept by watching who reaches for them. You learn which chair was yours by sitting in the wrong one and seeing the small hurt look on a younger sister's face.</p>\n<p>My sister was named Lottie. She was fourteen, and she read novels in the hayloft that my mother did not approve of, and she decided very quickly that the war had made me quiet and sad and interesting, like a man in one of her novels. She brought me water and newspapers and the gossip of the county, and she was the first person in that life I loved.</p>\n<p>It was Lottie who told me the story about the President.</p>\n<p>It was going around, she said, that when the rebels were at the gates of Washington, old Abe Lincoln himself had gone out to the fort to watch, and stood up on the wall like a fool in his tall hat, bold as anything, with the bullets flying, and a man was shot right next to him. And a young Yankee officer had shouted at him, <em>Get down, you fool!</em> Not knowing who it was. Or knowing, which was better.</p>\n<p>\"Is it true?\" she said. \"You were there.\"</p>\n<p>\"I was there,\" I said. \"I didn't hear anybody shout.\"</p>\n<p>\"Well, I'm choosing to believe it,\" said Lottie, \"because it's a better story.\"</p>\n<p>I thought about the tall man on the wall, looking out at us like a farmer looking at weather, and I said nothing.</p>\n<p class=\"break\">&#10043;</p>\n<p>My father was dead, two years ago, of a fever. My older cousin Ned, who had gone across the river with Kit in sixty-two, was alive. We knew that because a letter came from him in the second week of September, a single sheet folded small, written in pencil, and opened and read and stamped by a Union officer before it was allowed to reach us.</p>\n<p>He was a prisoner. He had been taken in the spring, in Virginia, along with two other boys from our company. They were being held at Point Lookout.</p>\n<p>I did not know the name. My mother did. When she read it, she sat down on the porch steps as though her legs had been taken from under her.</p>\n<p>Point Lookout was at the very bottom of our own peninsula, where the Potomac meets the bay. About fifty miles south of where we sat. A flat, sandy spit of land with nothing on it but a Union prison camp: no barracks, only tents, thousands of men living on sand behind a high board fence, with the water all around. In summer the sun came off the sand like the door of an oven. In winter, the wind came off the bay.</p>\n<p><em>We are doing as well as can be expected,</em> Ned wrote, <em>though the rations are short and the water is bad, and Jem Carroll died of the flux on Tuesday. Tell Aunt Margaret not to worry. I think often of home. We hear the exchange will start again soon.</em></p>\n<p>The exchange was not going to start again soon. Everyone in the county knew it. The two governments had stopped trading prisoners the year before, and neither one would give way. The men at Point Lookout were going to stay at Point Lookout until the war ended or they died, and the second was happening faster than the first.</p>\n<p>My mother read the letter aloud three times. Then she folded it up and put it in her apron pocket, and I watched her carry it there, touching it now and then, for the rest of the fall.</p>\n<p class=\"break\">&#10043;</p>\n<p>I noticed Damon in September.</p>\n<p>That is not quite true. I had noticed him from the first morning, the way you notice the man who lifts you out of a ditch. But I had not <em>seen</em> him. That was the point of him, I understood later. He had made himself into something nobody saw.</p>\n<p>He was the one my mother relied on for anything that mattered: the horses, the accounts with the tobacco buyer, the mending of anything broken. He spoke only when spoken to and said as little as a man could say and still answer. He never looked at me directly. I thought at first that it was fear, or the habit of that place, where a Black man who looked a white man in the eye could be whipped for it.</p>\n<p>Then one afternoon I came into the kitchen yard on my crutch, more quietly than I meant to, and he was standing by the table where Lottie had left one of her newspapers. He was not touching it. He was only looking down at it. But his eyes were moving along the lines, left to right, and down, and left to right, the way eyes move when they are reading, and reading quickly.</p>\n<p>He heard my crutch on the step. His eyes stopped. He picked up the bucket at his feet and went to the well, and when he came back past me, his face was nothing at all, as smooth and closed as a shut door.</p>\n<p>I thought about that for a long time.</p>\n<p>A field hand on a Charles County farm, who had never been to school, because no one on that farm would have let him, reading a newspaper faster than I could. And hiding it. Not from my mother. From me. As if he had seen something in me, since the war, that he did not trust.</p>\n<p>I did not know what to make of it, so I did what I have always done with a puzzle I cannot solve. I put it away carefully, where I would not lose it.</p>\n<p class=\"break\">&#10043;</p>\n<p>In October, Maryland voted itself free.</p>\n<p>The new state constitution passed by a few hundred votes, and only because of the votes of Maryland's Union soldiers in the field. The men at home had voted against it. At the end of the month the governor declared it law. At midnight on the first of November, every enslaved person in Maryland would be free by law. Somewhere that night, people were celebrating. In our county, no one was.</p>\n<p>My mother did not come down to supper. Lottie cried, and could not say why.</p>\n<p>In the morning, Damon was standing at the bottom of the porch steps in a clean shirt, with a bundle tied in a blanket over his shoulder. He had come to say that he was going. He said it to my mother, politely, the way he had said everything to her for twenty years, and she stood in the doorway with her arms folded and did not answer him.</p>\n<p>Then he looked at me.</p>\n<p>It was the first time. Just for a moment, one long moment, he looked straight at me, the way I had seen him look at the newspaper: reading me, quickly, left to right and down. I do not know what he found. I know that I felt, for the first time in that life, the particular cold feeling of being seen clearly by somebody who does not like what he sees.</p>\n<p>Then he turned and walked down the lane toward the Washington road, and he did not look back.</p>\n<p>\"Good riddance,\" my mother said, and went inside, and shut the door hard enough that the glass rattled.</p>\n<p>I stood on the porch on my crutch and watched him until the road turned into the trees.</p>\n<p>I never expected to see him again.</p>"}, {"num": 5, "title": "Playback", "html": "<p>She texted Freda from the end of the gravel road, <em>Leaving now,</em> and got back a thumbs up, which in her daughter's language meant <em>received, and please don't make it a conversation.</em></p>\n<p>The drive south was slower than the drive north. There was an accident on the highway, and then there was traffic from the accident, and then there was the long stretch of gray afternoon where she found herself driving with the radio off, which she never did, going back over what he had said.</p>\n<p>She did not believe him. She wanted to be clear with herself about that.</p>\n<p>She had spent six years being very careful about what she believed, because the last time she had believed someone, it had cost her everything she had. She believed in things she could check. So she did what she always did with a story that was too good. She separated it into parts.</p>\n<p>The part she could check: Lincoln at Fort Stevens. A man shot beside him. A Confederate army that came to the edge of Washington in July 1864 and then went away.</p>\n<p>The part she could not check: that an old man in a cardigan had been lying in a field with a rifle, a few hundred yards away, in somebody else's body.</p>\n<p>The first part was history. The second part was either a lie, or a delusion, or something she did not have a word for. And it was not her job to decide which. Her job was to write down what he said, check what could be checked, and cash the checks.</p>\n<p>That was what she told herself for the first hour.</p>\n<p>For the second hour, she thought about how he had said <em>I was always glad of that.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>The house was lit up when she pulled in, every window, the way Freda left it when she was home alone and pretending she didn't mind.</p>\n<p>Freda was at the kitchen table with her laptop and a stack of chemistry worksheets, a pencil behind one ear and another in her hand. She looked up when the door opened, and for a second her face did something that looked like relief, and then she remembered she was sixteen and put it away.</p>\n<p>\"You're late.\"</p>\n<p>\"There was an accident on the highway. Not me. Somebody else's.\"</p>\n<p>\"I know. I looked at the traffic.\" Freda turned a page. \"So is he crazy?\"</p>\n<p>Iola hung up her coat. She put the folder on the counter and her bag on the chair and the two recorders side by side on the table, the way she had always set them out after an interview, like a surgeon laying out instruments.</p>\n<p>\"He's very nice,\" she said. \"He made me tea. He has about ten thousand books.\"</p>\n<p>\"That's not a no.\"</p>\n<p>\"He says he's lived before.\"</p>\n<p>Freda put her pencil down.</p>\n<p>\"Like a past life? Like he was Cleopatra?\"</p>\n<p>\"Like a lot of them. He says he remembers them. He says he was a Confederate soldier at the end of the Civil War.\"</p>\n<p>\"That's why they want to know about 1865.\" Freda looked at her with real interest now, which happened so seldom these days that Iola felt it like sunlight. \"That's so weird. Do you believe him?\"</p>\n<p>\"No.\"</p>\n<p>\"Do you think he believes it?\"</p>\n<p>Iola thought about that. It was a better question than most editors had ever asked her.</p>\n<p>\"Yes,\" she said. \"I think he does.\"</p>\n<p>Freda considered this. Then she said, \"Well, that's kind of sad,\" and went back to her chemistry, and Iola loved her so much in that moment that she had to go and look into the refrigerator for a while.</p>\n<p>There were two mugs in the sink. Two plates, rinsed, with crumbs on them.</p>\n<p>\"Did you have someone over?\"</p>\n<p>\"Maddie came by after school. We did the lab write-up.\" Freda did not look up. \"She left like an hour ago.\"</p>\n<p>\"That's fine. I was only asking.\"</p>\n<p>\"I know you were only asking.\"</p>\n<p>Iola made herself a sandwich she did not want and ate it standing up, and let it go. She had learned that with Freda, the way you learned it with a nervous source: if you pushed, the door shut. If you waited, sometimes, it opened on its own.</p>\n<p>It had not opened in a while.</p>\n<p class=\"break\">&#10043;</p>\n<p>At ten o'clock her phone buzzed with a notification from her bank.</p>\n<p>She looked at it twice. Then she opened the app and looked at it a third time, because she had been checking that balance every morning for six years, and she knew to the dollar what it had said that morning.</p>\n<p>The first payment had already landed. Three thousand dollars, from Aldine, Mercer and Voss, with the note <em>Session 1</em> and nothing else. Not in thirty days. Not in a check that would take a week to clear. The same afternoon.</p>\n<p>She paid the electric bill. Then she sat at the kitchen table with the house quiet around her and Freda's music faintly through the wall, and she put on her headphones and played the recording back from the beginning.</p>\n<p>She always did this. It was one of the few habits from the old job she had never broken, even on the gutter guards. You heard things on the tape that you did not hear in the room. In the room you were busy: thinking of the next question, watching the face, making sure the red light was on. On the tape, you were only listening.</p>\n<p>She heard her own voice, too bright, saying the date. She heard the woodstove, and the cups, and his laugh when she said <em>whichever one I trusted.</em> She heard, all through the first part, a small dry sound she had not noticed at the time, like a mouse in a wall: his pencil, going around and around on the notepad.</p>\n<p>Then she heard herself read out the client's question.</p>\n<p><em>\"Please ask him what he thinks of 1865.\"</em></p>\n<p>And then nothing.</p>\n<p>She checked the time on the playback. Eleven seconds. Eleven seconds of the stove ticking and a truck going by on the far road, and, very faintly, the pencil, going around. In the room it had felt like a pause. On the tape it was a silence, the long kind, the kind people leave when a question has gone somewhere deeper than they expected.</p>\n<p><em>\"What I think of it,\"</em> he said at last.</p>\n<p>She listened to the whole thing. The rain and the mud. The sun coming out when Lincoln stood to speak. The heat in the field. The man with the missing tooth. The tall man on the wall. The bullet. The army leaving in the dark. His voice did not change much as he told it, and it did not perform. It was the voice of a man describing a place he had lived, not a story he had learned. It went slower in some places than others, and stopped sometimes to go back and correct a small detail, the way people do when they are remembering and not reciting.</p>\n<p>Liars did not usually correct themselves. It made them look unsure. The good ones, the ones who had rehearsed, told it smooth.</p>\n<p>That proved nothing either, she reminded herself. Some people were very good.</p>\n<p class=\"break\">&#10043;</p>\n<p>At eleven, she opened her laptop and started checking.</p>\n<p>Lincoln at Fort Stevens was easy. There were books about it, and articles, and a marker at the fort itself, now a small park in the middle of a neighborhood in Washington. Lincoln had come out to the fort on July 12, 1864, and stood on the parapet under fire, and an army surgeon standing near him had been shot. Everything Tom Hale had said about it was in the record.</p>\n<p>That was the problem. Everything he had said about it was in the record. Anyone could have read it.</p>\n<p>She found the surgeon's name in an old account: Cornelius Crawford, assistant surgeon, 102nd Pennsylvania. He had been shot in the leg. He had lived, and years later he had given his own account of that afternoon, and drawn a diagram of where everyone had stood on the wall.</p>\n<p><em>He lived, I think. I was always glad of that.</em></p>\n<p>She sat back.</p>\n<p>It was a small thing. It was a strange thing to say, that was all. If you had read about Fort Stevens in a book, the surgeon was a footnote. The book told you his name and that he was hit, and the book moved on to Lincoln, because the book was about Lincoln. You had to go looking to find out whether the surgeon lived. And if you had gone looking, you would know. You would not say <em>I think.</em></p>\n<p>You would only say <em>I think</em> if you had never looked it up at all. If the last thing you knew about that man was seeing him fall.</p>\n<p>She wrote that down in her notebook, and then she drew a line through it, because it was the kind of thought that had gotten her into trouble before.</p>\n<p>Then, after a moment, she wrote it down again underneath.</p>\n<p>The inauguration was harder, but not much. It had rained on the morning of March 4, 1865, and the streets had been deep in mud. And a newspaper correspondent standing near the platform had written that as Lincoln rose to speak, the sun broke through the clouds, and that Lincoln himself had noticed it and later said it made his heart jump.</p>\n<p>Also in the record. Also proof of nothing.</p>\n<p>She closed the laptop at one in the morning and sat for a while in the dark kitchen.</p>\n<p>On the refrigerator, under a magnet shaped like a strawberry, was the calendar where she kept the whole family's life in pencil: Freda's dentist, the gutter deadline, the car insurance. She took the pencil from the string and wrote in next Thursday's square, in small neat letters, <em>Hale, 10:00.</em></p>\n<p>Then, because she was honest with herself on paper, she wrote beside it a small question mark, and looked at it, and left it there.</p>"}];
const $ = (id) => document.getElementById(id);
const main = $("main");
const store = {
  get(k, d) { try { const v = localStorage.getItem("wyl." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wyl." + k, JSON.stringify(v)); } catch {} },
};

// settings
function applySize() { document.documentElement.style.setProperty("--size", store.get("size", 20) + "px"); }
function applyTheme() {
  const t = store.get("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
applySize(); applyTheme();
document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
  store.set("size", Math.min(28, Math.max(15, store.get("size", 20) + Number(b.dataset.size)))); applySize();
});
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.theme); applyTheme(); });
$("aaBtn").onclick = (e) => { e.stopPropagation(); $("sheet").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!$("sheet").contains(e.target)) $("sheet").classList.remove("open"); });

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();
}
function toc() {
  main.innerHTML = `<section class="toc"><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.num}</span><span>${c.title}</span></button></li>`).join("")}</ol></section>`;
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter">
    <header><div class="num">Chapter ${c.num}</div><h2>${c.title}</h2></header>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  $("where").textContent = `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();

// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });


// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
const CKEY = store.get("ckey", null);
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}
function openCmt(ch, p, text) {
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");
  $("cmtText").value = ""; $("cmtStatus").textContent = "";
  renderOld();
  $("cmt").classList.add("open");
}
$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString() };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
</body>
</html>
