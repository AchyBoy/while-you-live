<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<title>While You Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e7; --ink: #2a251d; --soft: #7a6f5d; --rule: #d9cfbc; --accent: #8a2b1d;
    --size: 20px;
  }
  :root[data-theme="dark"] { --paper: #16140f; --ink: #e6dfd0; --soft: #9a907e; --rule: #3a342a; --accent: #d4826f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #16140f; --ink: #e6dfd0; --soft: #9a907e; --rule: #3a342a; --accent: #d4826f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "EB Garamond", Georgia, "Times New Roman", serif; font-size: var(--size); line-height: 1.6;
         -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
         gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--paper);
         border-bottom: 1px solid var(--rule); font-size: 15px; color: var(--soft); transition: transform .25s; }
  .bar.hide { transform: translateY(-100%); }
  .bar .where { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar button { padding: 6px 8px; border-radius: 6px; font-size: 15px; }
  .bar button:active { background: var(--rule); }

  main { max-width: 34em; margin: 0 auto; padding: 0 22px calc(env(safe-area-inset-bottom) + 40px); }

  .cover { min-height: 88vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cover .series { letter-spacing: .3em; text-transform: uppercase; font-size: .7em; color: var(--soft); }
  .cover h1 { font-weight: 500; font-size: 2.6em; margin: .4em 0 .1em; letter-spacing: .02em; }
  .cover .book { font-style: italic; color: var(--soft); }
  .cover .star { color: var(--accent); font-size: 1.4em; margin: 1.4em 0; }
  .cover .begin { margin-top: 1.2em; padding: .5em 1.6em; border: 1px solid var(--ink); border-radius: 999px; font-size: .9em; }
  .cover .resume { margin-top: .8em; font-size: .8em; color: var(--soft); text-decoration: underline; }

  .toc h2 { font-weight: 500; text-align: center; margin: 2em 0 1em; }
  .toc ol { list-style: none; padding: 0; margin: 0; }
  .toc li button { display: flex; width: 100%; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--rule); text-align: left; }
  .toc .n { color: var(--soft); min-width: 2em; }

  .chapter header { text-align: center; margin: 2.2em 0 1.8em; }
  .chapter .num { letter-spacing: .3em; text-transform: uppercase; font-size: .7em; color: var(--soft); }
  .chapter h2 { font-weight: 500; font-size: 1.6em; margin: .3em 0 0; }
  .chapter p { margin: 0; text-indent: 1.4em; hyphens: auto; -webkit-hyphens: auto; }
  .chapter header + p, .chapter p.break + p { text-indent: 0; }
  .chapter header + p { display: flow-root; }
  .chapter header + p::first-letter { float: left; font-size: 3.4em; line-height: .85; padding: .06em .08em 0 0; color: var(--accent); }
  .chapter p.break { text-align: center; text-indent: 0; margin: 1em 0; color: var(--soft); }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin: 3em 0 1em; padding-top: 1.2em; border-top: 1px solid var(--rule); font-size: .85em; }
  .nav button { max-width: 48%; text-align: left; }
  .nav button.next { text-align: right; margin-left: auto; }
  .nav small { display: block; color: var(--soft); font-size: .8em; }
  .end { text-align: center; color: var(--soft); font-style: italic; margin: 3em 0 1em; }

  .progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; z-index: 6; }
  .sheet { position: fixed; inset: auto 0 0 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--rule);
           padding: 18px 22px calc(env(safe-area-inset-bottom) + 18px); font-size: 16px; display: none; box-shadow: 0 -10px 30px rgba(0,0,0,.15); }
  .sheet.open { display: block; }
  .sheet .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  .sheet .seg { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .sheet .seg button { padding: 8px 14px; }
  .sheet .seg button.on { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>
<div class="bar" id="bar">
  <button id="homeBtn" aria-label="Contents">Contents</button>
  <div class="where" id="where"></div>
  <button id="aaBtn" aria-label="Text settings">Aa</button>
</div>
<main id="main"></main>
<div class="progress" id="progress"></div>
<div class="sheet" id="sheet">
  <div class="row"><span>Text size</span>
    <div class="seg"><button data-size="-1">A&minus;</button><button data-size="1">A+</button></div></div>
  <div class="row"><span>Page</span>
    <div class="seg" id="themeSeg"><button data-theme="auto">Auto</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div></div>
</div>
<script>
const BOOK = {"series": "While You Live", "title": "Sic Semper", "number": 1};
const CHAPTERS = [{"num": 1, "title": "The Offer", "html": "<p>The electric bill was on top because it was the only one printed in red.</p>\n<p>Iola Barnett moved it to the bottom of the pile, which changed nothing, and then moved it back, which changed less. Through the wall she could hear Freda on the phone, laughing the low, careful laugh she used when she didn't want her mother to catch the words. Sixteen. Iola had been sixteen once, and a much worse liar.</p>\n<p>The kitchen still smelled of the rice she had burned at six and scraped into the trash at five past. On the laptop, the job she was supposed to be finishing sat open: four hundred words on why a family should choose one brand of gutter guard over another. So far she had written <em>Rain happens.</em> It was true. She suspected it was the best sentence she would write all week.</p>\n<p>There had been a time when people quoted her. Not often, and not on television, but in rooms that mattered, by people who had read the whole piece. She had been the reporter who checked the thing everyone else assumed. That was the job, as far as she had ever understood it. You checked.</p>\n<p>Then there had been the auction house story, and then there had been lawyers, and now there was rain.</p>\n<p>The envelope had come that afternoon. She had left it unopened on the counter beside the fruit bowl, because nothing good arrived in paper that heavy. Heavy paper meant lawyers, and lawyers were how the last story had ended.</p>\n<p>She opened it anyway, because the electric bill was red.</p>\n<p>It was from a firm she had never heard of, Aldine, Mercer and Voss, with an address in a city she had never been to. The letter was typed, polite, and short.</p>\n<p><em>Dear Ms. Barnett,</em></p>\n<p><em>We act for a private client who wishes to engage a writer to record the recollections of an elderly gentleman. The sessions would take place at the gentleman's home, at his convenience and yours. Our client will pay three thousand dollars per session, for no fewer than ten sessions, with travel costs covered in full. You would be free to decline at any point.</em></p>\n<p><em>Our client has read your work, including the work you were not permitted to finish.</em></p>\n<p><em>Our client asks us to add that he has always believed you about Bookbinder.</em></p>\n<p>She read that line four times. Then she put the letter face down on the counter, the way she would put down a hot pan, and stood with her hand flat on top of it.</p>\n<p>Nobody knew about Bookbinder.</p>\n<p>That was not a figure of speech. It was the name she had given her source in her own notes, in her own handwriting, in a notebook that had never left her bag. It had not been in the paper. It had not been said to her editor, who had only ever called him <em>your guy.</em> It had not been said to the lawyers, who had called him <em>the alleged source</em> until the word <em>alleged</em> was all anyone remembered. Two people on earth had known that name. One of them was standing in her kitchen with her hand on a letter.</p>\n<p>The other one had been gone for six years.</p>\n<p>\"Is that from the lawyers?\"</p>\n<p>Freda was in the doorway, phone against her chest, the call not ended, only muffled. She had her father's height and none of his patience. She was reading the back of the letter through the paper, the way she read everything, upside down and faster than she let on.</p>\n<p>\"Different lawyers,\" Iola said.</p>\n<p>\"Worse?\"</p>\n<p>\"Richer.\"</p>\n<p>Freda came in and took an apple from the bowl she never ate apples from. She did not ask to see the letter, which meant she wanted to. Iola turned it over. There was no point. Her daughter had been reading over her shoulder since she was four.</p>\n<p>Freda skimmed it the way you skim a menu when you already know what you're having, and then she stopped at the bottom.</p>\n<p>Below the typed signature of someone named R. Aldine, in a different ink, there was one more line, written by hand. The writing was old-fashioned, the kind taught when handwriting was still a subject in school, and it leaned a little too far to the right. The downstrokes shook, very slightly, like a picture hung on a wall that trucks drove past.</p>\n<p><em>Please begin with 1865.</em></p>\n<p>\"Somebody's grandpa wrote that,\" Freda said.</p>\n<p>\"Maybe it's the gentleman.\"</p>\n<p>\"No, the gentleman's the one you're interviewing. This is the one paying.\" Freda tapped the line with the apple. \"Why would they want you to start in 1865?\"</p>\n<p>\"Maybe it's a typo.\"</p>\n<p>\"It's handwritten, Mom.\"</p>\n<p>\"People make typos in handwriting.\"</p>\n<p>\"That's not what a typo is.\" Freda read the figures again. The phone against her chest said something small and impatient. \"Three thousand dollars. Each time.\"</p>\n<p>\"I can read.\"</p>\n<p>\"Ten times is thirty thousand dollars.\"</p>\n<p>\"I can also add.\"</p>\n<p>Freda looked at her, and for one second she was not sixteen at all. She was the child who had sat on the stairs six years ago while her mother cried in the kitchen and pretended to be on the phone. She had never mentioned it. Neither had Iola.</p>\n<p>\"Are you going to go?\" Freda said.</p>\n<p>\"I don't know yet.\"</p>\n<p>\"You're going to go.\" Freda lifted the phone back to her ear, said \"Sorry, my mom,\" into it, in the voice that meant <em>my mom</em> was a long and tragic story, and went back to her room. The door closed. It didn't slam. Iola had learned to be grateful for the difference.</p>\n<p>She sat down at the laptop. <em>Rain happens,</em> it said.</p>\n<p>On the back of the envelope she wrote <em>Bookbinder,</em> and then, under it, <em>who else,</em> and underlined <em>who.</em> She had not done that in six years, written a question down so she could look at it. It felt like picking up an instrument she used to play and finding that her hands still knew where to go.</p>\n<p>The number on the letterhead went to a woman who said that Mr. Aldine was expecting her call, which Iola did not like, and that the gentleman lived about two hours north, which was fine, and that the first session could be as soon as Thursday, which was too soon.</p>\n<p>\"Can you tell me who your client is?\"</p>\n<p>\"I'm afraid our client prefers not to be named.\"</p>\n<p>\"Can you tell me who the gentleman is?\"</p>\n<p>\"He'll tell you himself, I expect,\" the woman said. \"He's been told you might be coming. He said he'd put the kettle on.\"</p>\n<p>\"Does he know why?\"</p>\n<p>A pause, and the soft click of a keyboard.</p>\n<p>\"I don't think anyone does, Ms. Barnett,\" the woman said. \"That's rather the point of hiring you.\"</p>\n<p>On Thursday she dropped Freda at school, stopped for gas she paid for with the card that still worked, and drove north with the letter on the passenger seat, face down, her hand resting on it at the red lights.</p>"}];
const $ = (id) => document.getElementById(id);
const main = $("main");
const store = {
  get(k, d) { try { const v = localStorage.getItem("wyl." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wyl." + k, JSON.stringify(v)); } catch {} },
};

// settings
function applySize() { document.documentElement.style.setProperty("--size", store.get("size", 20) + "px"); }
function applyTheme() {
  const t = store.get("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
applySize(); applyTheme();
document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
  store.set("size", Math.min(28, Math.max(15, store.get("size", 20) + Number(b.dataset.size)))); applySize();
});
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.theme); applyTheme(); });
$("aaBtn").onclick = (e) => { e.stopPropagation(); $("sheet").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!$("sheet").contains(e.target)) $("sheet").classList.remove("open"); });

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();
}
function toc() {
  main.innerHTML = `<section class="toc"><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.num}</span><span>${c.title}</span></button></li>`).join("")}</ol></section>`;
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter">
    <header><div class="num">Chapter ${c.num}</div><h2>${c.title}</h2></header>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  $("where").textContent = `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();

// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
</script>
</body>
</html>
