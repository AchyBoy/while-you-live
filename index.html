<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<title>While You Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e7; --ink: #2a251d; --soft: #7a6f5d; --rule: #d9cfbc; --accent: #8a2b1d;
    --size: 20px;
  }
  :root[data-theme="dark"] { --paper: #16140f; --ink: #e6dfd0; --soft: #9a907e; --rule: #3a342a; --accent: #d4826f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #16140f; --ink: #e6dfd0; --soft: #9a907e; --rule: #3a342a; --accent: #d4826f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "EB Garamond", Georgia, "Times New Roman", serif; font-size: var(--size); line-height: 1.6;
         -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
         gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--paper);
         border-bottom: 1px solid var(--rule); font-size: 15px; color: var(--soft); transition: transform .25s; }
  .bar.hide { transform: translateY(-100%); }
  .bar .where { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar button { padding: 6px 8px; border-radius: 6px; font-size: 15px; }
  .bar button:active { background: var(--rule); }

  main { max-width: 34em; margin: 0 auto; padding: 0 22px calc(env(safe-area-inset-bottom) + 40px); }

  .cover { min-height: 88vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cover .series { letter-spacing: .3em; text-transform: uppercase; font-size: .7em; color: var(--soft); }
  .cover h1 { font-weight: 500; font-size: 2.6em; margin: .4em 0 .1em; letter-spacing: .02em; }
  .cover .book { font-style: italic; color: var(--soft); }
  .cover .star { color: var(--accent); font-size: 1.4em; margin: 1.4em 0; }
  .cover .begin { margin-top: 1.2em; padding: .5em 1.6em; border: 1px solid var(--ink); border-radius: 999px; font-size: .9em; }
  .cover .resume { margin-top: .8em; font-size: .8em; color: var(--soft); text-decoration: underline; }

  .toc h2 { font-weight: 500; text-align: center; margin: 2em 0 1em; }
  .toc ol { list-style: none; padding: 0; margin: 0; }
  .toc li button { display: flex; width: 100%; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--rule); text-align: left; }
  .toc .n { color: var(--soft); min-width: 2em; }

  .chapter header { text-align: center; margin: 2.2em 0 1.8em; }
  .chapter .num { letter-spacing: .3em; text-transform: uppercase; font-size: .7em; color: var(--soft); }
  .chapter h2 { font-weight: 500; font-size: 1.6em; margin: .3em 0 0; }
  .chapter p { margin: 0; text-indent: 1.4em; hyphens: auto; -webkit-hyphens: auto; }
  .chapter header + p, .chapter p.break + p { text-indent: 0; }
  .chapter header + p { display: flow-root; }
  .chapter header + p::first-letter { float: left; font-size: 3.4em; line-height: .85; padding: .06em .08em 0 0; color: var(--accent); }
  .chapter p.break { text-align: center; text-indent: 0; margin: 1em 0; color: var(--soft); }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin: 3em 0 1em; padding-top: 1.2em; border-top: 1px solid var(--rule); font-size: .85em; }
  .nav button { max-width: 48%; text-align: left; }
  .nav button.next { text-align: right; margin-left: auto; }
  .nav small { display: block; color: var(--soft); font-size: .8em; }
  .end { text-align: center; color: var(--soft); font-style: italic; margin: 3em 0 1em; }

  .progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; z-index: 6; }
  .sheet { position: fixed; inset: auto 0 0 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--rule);
           padding: 18px 22px calc(env(safe-area-inset-bottom) + 18px); font-size: 16px; display: none; box-shadow: 0 -10px 30px rgba(0,0,0,.15); }
  .sheet.open { display: block; }
  .sheet .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  .sheet .seg { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .sheet .seg button { padding: 8px 14px; }
  .sheet .seg button.on { background: var(--ink); color: var(--paper); }
  .pen { margin-left: .2em; padding: .15em .45em; font-size: .85em; color: var(--soft); opacity: .7; vertical-align: .05em; }
  .pen.has { opacity: 1; }
  .pen.has { color: var(--accent); }
  .cmt { position: fixed; inset: auto 0 0 0; z-index: 12; background: var(--paper); border-top: 1px solid var(--rule);
         padding: 16px 18px calc(env(safe-area-inset-bottom) + 16px); font-size: 16px; display: none;
         box-shadow: 0 -10px 30px rgba(0,0,0,.18); max-height: 75vh; overflow: auto; }
  .cmt.open { display: block; }
  .cmt .quote { color: var(--soft); font-style: italic; margin-bottom: 10px; }
  .cmt .old { border-left: 3px solid var(--accent); padding: 4px 10px; margin: 8px 0; display: flex; gap: 10px; justify-content: space-between; }
  .cmt .old button { color: var(--soft); }
  .cmt textarea { width: 100%; min-height: 90px; font: inherit; font-size: 16px; color: var(--ink); background: transparent;
                  border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
  .cmt .acts { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .cmt .save { padding: 8px 20px; border-radius: 999px; background: var(--ink); color: var(--paper); }
  .cmt .status { color: var(--soft); font-size: 14px; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <button id="homeBtn" aria-label="Contents">Contents</button>
  <div class="where" id="where"></div>
  <button id="aaBtn" aria-label="Text settings">Aa</button>
</div>
<main id="main"></main>
<div class="progress" id="progress"></div>
<div class="sheet" id="sheet">
  <div class="row"><span>Text size</span>
    <div class="seg"><button data-size="-1">A&minus;</button><button data-size="1">A+</button></div></div>
  <div class="row"><span>Page</span>
    <div class="seg" id="themeSeg"><button data-theme="auto">Auto</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div></div>
</div>
<div class="cmt" id="cmt">
  <div class="quote" id="cmtQuote"></div>
  <div id="cmtOld"></div>
  <textarea id="cmtText" placeholder="Your note on this paragraph"></textarea>
  <div class="acts"><button id="cmtClose">Close</button><span class="status" id="cmtStatus"></span><button class="save" id="cmtSave">Save</button></div>
</div>
<script>
const BOOK = {"series": "While You Live", "title": "Sic Semper", "number": 1};
const CHAPTERS = [{"num": 1, "title": "The Offer", "html": "<p>The electric bill was on top because it was the only one printed in red.</p>\n<p>Iola Barnett moved it to the bottom of the pile, which changed nothing, and then moved it back, which changed less. Through the wall she could hear Freda on the phone, laughing the low, careful laugh she saved for friends. Sixteen. A good kid, everyone said so, and Iola believed it. But lately there was a door in her daughter that stayed shut, and Iola had not yet found out what was behind it.</p>\n<p>Dinner was done and the dishes put away. Tomorrow's lunches were already in the fridge, and the permission slip for Friday was signed and clipped to Freda's bag. On the laptop, the job she was supposed to be finishing sat open: four hundred words on why a family should choose one brand of gutter guard over another. So far she had written <em>Rain happens.</em> It was true. She suspected it was the best sentence she would write all week.</p>\n<p>The gutter people paid sixty dollars for four hundred words, and they paid on time, which put them ahead of most. There was also a dentist who wanted a blog, a man who was writing his memoirs about forty years in the carpet trade and could not spell carpet, and a real estate office that sent her photos of houses and asked her to make them sound bigger. She did all of it well, and on time, and none of it would ever be read twice. Nobody was going to quote her on the gutter guards.</p>\n<p>There had been a time when people quoted her. Not often, and not on television, but in rooms that mattered, by people who had read the whole piece. She had been the reporter who went and checked the thing everyone else took for granted. As far as she had ever understood it, that was the whole job: find out whether it was true.</p>\n<p>Then there had been the auction house story.</p>\n<p>Six years ago, a man had called the newsroom and asked for her by name. He worked in the back rooms of Carrow House, the old auction house downtown, the one with the brass doors and the catalogs printed on heavy paper. His job was repairing old documents before they went to sale: flattening letters, mending torn deeds, rebinding diaries that had come apart at the spine. He said that some of the letters Carrow sold as genuine, signed by presidents and generals and famous names, were not genuine at all. He said he could prove it. He said he had been asked to <em>repair</em> some of them, and that the damage he had been asked to repair was new.</p>\n<p>It had taken her eight months. She had met him in diners and parking lots and once, memorably, in a laundromat. She had checked everything he gave her, and everything he gave her had checked out. The story ran on a Sunday, on the front page, under her name.</p>\n<p>On Monday, Carrow House sued.</p>\n<p>On Wednesday, her source was gone. Not fired, not arrested, not quoted in a rival paper denying everything. Gone. His apartment was empty, his phone was off, and nobody who knew him would say where he had gone, if they knew. Without him, the documents he had given her were only documents. Carrow's lawyers said the documents were themselves fakes, made up to smear an honest business. The paper's lawyers called it a difficult position. By the end of the year the paper had printed a correction that took up more space than some of her stories had, and Iola had been let go with a handshake and a box.</p>\n<p>Everyone in the business knew what that meant. It meant she had made it up.</p>\n<p>And now there was rain.</p>\n<p>The envelope had come that afternoon. She had left it unopened on the counter beside the fruit bowl, because nothing good arrived in paper that heavy. Heavy paper meant lawyers, and lawyers were how the last story had ended.</p>\n<p>She opened it anyway, because the electric bill was red.</p>\n<p>It was from a firm she had never heard of, Aldine, Mercer and Voss, with an address in a city she had never been to. The letter was typed, polite, and longer than she expected.</p>\n<p><em>Dear Ms. Barnett,</em></p>\n<p><em>We act for a private client who wishes to engage a writer to record the recollections of an elderly gentleman. The sessions would take place at the gentleman's home, at his convenience and yours. Our client will pay three thousand dollars per session, for no fewer than ten sessions, with travel costs covered in full. You would be free to decline at any point.</em></p>\n<p><em>We should say plainly that the gentleman is not famous, and that his recollections will not, on their face, seem credible. Our client does not ask you to believe them. He asks you to listen carefully, to write down what you are told in the way it is told, and from time to time to put to the gentleman a question our client will send you. Whether any of it is ever published is a matter for you and the gentleman. Our client has no interest in it.</em></p>\n<p><em>Our client has read your work, including the work you were not permitted to finish. He chose you because you were not permitted to finish it.</em></p>\n<p><em>He asks that you not try to find out who he is. He expects that you will try anyway, and he does not hold it against you.</em></p>\n<p><em>Lastly, our client asks us to add that he has always believed you about Bookbinder.</em></p>\n<p>She read that line four times. Then she put the letter face down on the counter, the way she would put down a hot pan, and stood with her hand flat on top of it.</p>\n<p>Nobody knew about Bookbinder.</p>\n<p>That was not a figure of speech. It was the name she had given her source in her own notes, because of the work he did and because she never wrote a real name down where someone could find it. It was in her own handwriting, in a notebook that had never left her bag. It had not been in the paper. It had not been said to her editor, who had only ever called him <em>your guy.</em> It had not been said to the lawyers, who had called him <em>the alleged source</em> until the word <em>alleged</em> was all anyone remembered.</p>\n<p>Two people on earth had known that name. One of them was standing in her kitchen with her hand on a letter. The other one had been gone for six years.</p>\n<p>\"Is that from the lawyers?\"</p>\n<p>Freda was in the doorway, phone against her chest, the call not ended, only muffled. She had her father's height and none of his patience. Her eyes were already on the letter under her mother's hand. She read everything that way, upside down and faster than she let on.</p>\n<p>\"Different lawyers,\" Iola said.</p>\n<p>\"Worse?\"</p>\n<p>\"Richer.\"</p>\n<p>Freda came in and took an apple from the bowl, though she never ate the apples. She did not ask to see the letter, which meant she wanted to. Iola turned it face up and slid it across. There was no point hiding it. Her daughter had been reading over her shoulder since she was four.</p>\n<p>Freda skimmed it the way you skim a menu when you already know what you're having, and then she stopped at the bottom.</p>\n<p>Below the typed signature of someone named R. Aldine, in a different ink, there was one more line, written by hand. The writing was old-fashioned, the kind taught when handwriting was still a subject in school, and it leaned a little too far to the right. The downstrokes shook, very slightly, like a picture hung on a wall that trucks drove past.</p>\n<p><em>Please begin with 1865.</em></p>\n<p>\"Somebody's grandpa wrote that,\" Freda said.</p>\n<p>\"Maybe it's the gentleman.\"</p>\n<p>\"No, the gentleman's the one you're interviewing. This is the one paying.\" Freda tapped the line with the apple. \"Why would they want you to start in 1865?\"</p>\n<p>\"Maybe it's a typo.\"</p>\n<p>\"It's handwritten, Mom.\"</p>\n<p>\"People make typos in handwriting.\"</p>\n<p>\"That's not what a typo is.\" Freda read the figures again. From the phone against her chest, her friend's voice said something small and impatient. \"Three thousand dollars. Each time.\"</p>\n<p>\"I can read.\"</p>\n<p>\"Ten times is thirty thousand dollars.\"</p>\n<p>\"I can also add.\"</p>\n<p>Freda looked at her, and for one second she was not sixteen at all. She was the child who had sat on the stairs six years ago while her mother cried in the kitchen and pretended to be on the phone. She had never mentioned it. Neither had Iola.</p>\n<p>\"Are you going to go?\" Freda said.</p>\n<p>\"I don't know yet.\"</p>\n<p>\"You're going to go.\" Freda lifted the phone back to her ear, said \"Sorry, my mom,\" into it, in the voice that meant <em>my mom</em> was a long and tragic story, and went back to her room. The door closed. It didn't slam. Iola had learned to be grateful for the difference.</p>\n<p>She sat down at the laptop. <em>Rain happens,</em> it said.</p>\n<p>She finished the gutter guards first, because she had said she would, and because sixty dollars was sixty dollars. It took twenty minutes. Then she opened a new window and did what she had not done for six years. She started checking.</p>\n<p>Aldine, Mercer and Voss was real. That was the first surprise. It was registered, it was old, and it had a website with a street address, a phone number, and almost nothing else: no photographs of smiling partners, no list of the kinds of cases it took, no news. The kind of firm, she thought, that did not need to find clients, because its clients already knew where it was. There was an R. Aldine on the state bar list, admitted forty-one years ago, with no complaints against him. There was nothing else about him at all, which was harder to arrange than people thought.</p>\n<p>She searched for Carrow House, which she had not let herself do in a long time. It was still there. It had had a good year. There was a photograph of the brass doors.</p>\n<p>She searched for her source's real name, the one she never wrote down, and found what she had found every other time she had looked, back when she still looked: an old address, an old phone listing, and after that, nothing. No obituary. No new address. No arrest. A man who had simply stopped.</p>\n<p>At midnight she closed the laptop and wrote on the back of the envelope, by hand, the way she used to plan a story:</p>\n<p><em>Bookbinder.</em></p>\n<p><em>Who else knew?</em></p>\n<p>She underlined <em>who.</em> Then, under that, because she was honest with herself on paper even when she was not anywhere else:</p>\n<p><em>Electric. Car insurance. Freda's teeth.</em></p>\n<p><em>Thirty thousand dollars.</em></p>\n<p>It felt like picking up an instrument she used to play and finding that her hands still knew where to go.</p>\n<p>In the morning, after the school run, she called the number on the letterhead.</p>\n<p>A woman answered on the second ring. She said that Mr. Aldine had been expecting to hear from her, which Iola did not like. She said that the gentleman lived about two hours north, which was fine. And she said the first session could be as soon as Thursday at ten, which was too soon, and which Iola heard herself agree to.</p>\n<p>\"Can you tell me who your client is?\"</p>\n<p>\"I'm afraid our client prefers not to be named.\"</p>\n<p>\"Can you tell me who the gentleman is?\"</p>\n<p>\"He'll tell you himself, I expect,\" the woman said. \"I'll let him know it's Thursday at ten. He said to tell you he'll have the kettle on.\"</p>\n<p>\"Does he know why your client wants his story?\"</p>\n<p>A pause, and the soft click of a keyboard.</p>\n<p>\"I don't think anyone does, Ms. Barnett,\" the woman said. \"That's rather the point of hiring you.\"</p>\n<p>On Wednesday night she told Freda over dinner. Freda said, \"I told you,\" and then, after a moment, \"Is it safe?\" which was not a question Iola had expected, and which she answered with more confidence than she had.</p>\n<p>\"He's an old man who wants to tell somebody about his life,\" she said. \"I've interviewed a hundred of them.\"</p>\n<p>\"And the one paying?\"</p>\n<p>\"Also old, apparently.\"</p>\n<p>\"Old and rich and weird,\" Freda said. \"Text me when you get there.\"</p>\n<p>\"I will.\"</p>\n<p>\"Text me when you leave.\"</p>\n<p>\"Who's the mother here?\"</p>\n<p>Freda almost smiled. Her phone buzzed on the table beside her plate, and she turned it face down without looking at it, and asked for the salt.</p>\n<p>On Thursday Iola dropped Freda at school, stopped for gas, and drove north with the letter on the passenger seat, face down. The city thinned into highway and the highway into two-lane road, past farm stands closed for the season and a church with a sign that said <em>God answers knee mail.</em> She had printed the directions, because she did not trust her phone out here, and because she was the kind of person who printed directions.</p>\n<p>At every red light she rested her hand on the letter, as if it might get up and leave.</p>"}];
const $ = (id) => document.getElementById(id);
const main = $("main");
const store = {
  get(k, d) { try { const v = localStorage.getItem("wyl." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wyl." + k, JSON.stringify(v)); } catch {} },
};

// settings
function applySize() { document.documentElement.style.setProperty("--size", store.get("size", 20) + "px"); }
function applyTheme() {
  const t = store.get("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
applySize(); applyTheme();
document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
  store.set("size", Math.min(28, Math.max(15, store.get("size", 20) + Number(b.dataset.size)))); applySize();
});
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.theme); applyTheme(); });
$("aaBtn").onclick = (e) => { e.stopPropagation(); $("sheet").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!$("sheet").contains(e.target)) $("sheet").classList.remove("open"); });

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();
}
function toc() {
  main.innerHTML = `<section class="toc"><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.num}</span><span>${c.title}</span></button></li>`).join("")}</ol></section>`;
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter">
    <header><div class="num">Chapter ${c.num}</div><h2>${c.title}</h2></header>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  $("where").textContent = `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();

// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });


// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
const CKEY = store.get("ckey", null);
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}
function openCmt(ch, p, text) {
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");
  $("cmtText").value = ""; $("cmtStatus").textContent = "";
  renderOld();
  $("cmt").classList.add("open");
}
$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString() };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
</body>
