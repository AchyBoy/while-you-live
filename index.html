<script>
const BOOK = {"series": "While You Live", "title": "Sic Semper", "number": 1};
const CHAPTERS = [{"num": 1, "title": "The Offer", "html": "<p>The electric bill was on top because it was the only one printed in red.</p>\n<p>Iola Barnett moved it to the bottom of the pile, which changed nothing, and then moved it back, which changed less. Through the wall she could hear Freda on the phone, laughing the low, careful laugh she saved for friends. Sixteen. A good kid, everyone said so, and Iola believed it. But lately there was a door in her daughter that stayed shut, and Iola had not yet found out what was behind it.</p>\n<p>Dinner was done and the dishes put away. Tomorrow's lunches were already in the fridge, and the permission slip for Friday was signed and clipped to Freda's bag. On the laptop, tonight's job sat open: four hundred words on why a family should choose one brand of gutter guard over another.</p>\n<p>These days Iola wrote whatever people paid her to write. The gutter company paid sixty dollars a piece and paid on time, which put it ahead of most. There was also a dentist who wanted a blog, a retired man writing a memoir about forty years in the carpet business, and a real estate office that sent her photos of houses and asked her to make them sound bigger. She did all of it well and on time. It paid most of the bills. None of it would ever be read twice.</p>\n<p>There had been a time when people quoted her. Not often, and not on television, but in rooms that mattered, by people who had read the whole piece. She had been the reporter who went and checked the thing everyone else took for granted. As far as she had ever understood it, that was the whole job: find out whether it was true.</p>\n<p>Then there had been the auction house story.</p>\n<p>Six years ago, a man had called the newsroom and asked for her by name. He worked in the back rooms of Carrow House, the old auction house downtown, the one with the brass doors and the catalogs printed on heavy paper. His job was repairing old documents before they went to sale: flattening letters, mending torn deeds, rebinding diaries that had come apart at the spine. He said that some of the letters Carrow sold as genuine, signed by presidents and generals and famous names, were not genuine at all. He said he could prove it. He said he had been asked to <em>repair</em> some of them, and that the damage he had been asked to repair was new.</p>\n<p>It had taken her eight months. She had met him in diners and parking lots and once, memorably, in a laundromat. She had checked everything he gave her, and everything he gave her had checked out. The story ran on a Sunday, on the front page, under her name.</p>\n<p>On Monday, Carrow House sued.</p>\n<p>On Wednesday, her source was gone. Not fired, not arrested, not quoted in a rival paper denying everything. Gone. His apartment was empty, his phone was off, and nobody who knew him would say where he had gone, if they knew. Without him, the documents he had given her were only documents. Carrow's lawyers said the documents were themselves fakes, made up to smear an honest business. The paper's lawyers called it a difficult position. By the end of the year the paper had printed a correction that took up more space than some of her stories had, and Iola had been let go with a handshake and a box.</p>\n<p>Everyone in the business knew what that meant. It meant she had made it up.</p>\n<p>The envelope had come that afternoon. She had left it unopened on the counter beside the fruit bowl, because nothing good arrived in paper that heavy. Heavy paper meant lawyers, and lawyers were how the last story had ended.</p>\n<p>She opened it anyway, because the electric bill was red.</p>\n<p>It was from a firm she had never heard of, Aldine, Mercer and Voss, with an address in a city she had never been to. The letter was typed, polite, and longer than she expected.</p>\n<p><em>Dear Ms. Barnett,</em></p>\n<p><em>We act for a private client who wishes to engage a writer to record the recollections of an elderly gentleman. The sessions would take place at the gentleman's home, at his convenience and yours. Our client will pay three thousand dollars per session, for no fewer than ten sessions, with travel costs covered in full. You would be free to decline at any point.</em></p>\n<p><em>We should say plainly that the gentleman is not famous, and that his recollections will not, on their face, seem credible. Our client does not ask you to believe them. He asks you to listen carefully, to write down what you are told in the way it is told, and from time to time to put to the gentleman a question our client will send you. Whether any of it is ever published is a matter for you and the gentleman. Our client has no interest in it.</em></p>\n<p><em>Our client has followed your work for some years, including your reporting on Carrow House, and he knows how that ended. He asks us to tell you that it is the reason he chose you. He needs someone who checks everything and accepts nothing until she has, and who knows what it costs to be right when no one believes you.</em></p>\n<p><em>Lastly, our client asks us to add that he has always believed you about Bookbinder.</em></p>\n<p>She read that line four times. Then she put the letter face down on the counter, the way she would put down a hot pan, and stood with her hand flat on top of it.</p>\n<p>Nobody knew about Bookbinder.</p>\n<p>That was not a figure of speech. It was the name she had given her source in her own notes, because of the work he did and because she never wrote a real name down where someone could find it. It was in her own handwriting, in a notebook that had never left her bag. It had not been in the paper. It had not been said to her editor, who had only ever called him <em>your guy.</em> It had not been said to the lawyers, who had called him <em>the alleged source</em> until the word <em>alleged</em> was all anyone remembered.</p>\n<p>Two people on earth had known that name. One of them was standing in her kitchen with her hand on a letter. The other one had been gone for six years.</p>\n<p>\"Is that from the lawyers?\"</p>\n<p>Freda was in the doorway, phone against her chest, the call not ended, only muffled. She had her father's height and none of his patience. Her eyes were already on the letter under her mother's hand. She read everything that way, upside down and faster than she let on.</p>\n<p>\"Different lawyers,\" Iola said.</p>\n<p>\"Worse?\"</p>\n<p>\"Richer.\"</p>\n<p>Freda came in and took an apple from the bowl, though she never ate the apples. She did not ask to see the letter, which meant she wanted to. Iola turned it face up and slid it across. There was no point hiding it. Her daughter had been reading over her shoulder since she was four.</p>\n<p>Freda skimmed it the way you skim a menu when you already know what you're having, and then she stopped at the bottom.</p>\n<p>Below the typed signature of someone named R. Aldine, in a different ink, there was one more line, written by hand. The writing was old-fashioned, the kind taught when handwriting was still a subject in school, and it leaned a little too far to the right. The downstrokes shook, very slightly, like a picture hung on a wall that trucks drove past.</p>\n<p><em>Please ask him what he thinks of 1865.</em></p>\n<p>\"Somebody's grandpa wrote that,\" Freda said.</p>\n<p>\"Maybe it's the gentleman.\"</p>\n<p>\"No, the gentleman's the one you're interviewing. This is the one paying.\" Freda tapped the line with the apple. \"What happened in 1865?\"</p>\n<p>\"The Civil War ended. Lincoln was shot.\"</p>\n<p>\"So he's a history guy.\"</p>\n<p>\"Apparently.\"</p>\n<p>\"Weird thing to pay for.\" Freda read the figures again. From the phone against her chest, her friend's voice said something small and impatient. \"Three thousand dollars. Each time.\"</p>\n<p>\"I can read.\"</p>\n<p>\"Ten times is thirty thousand dollars.\"</p>\n<p>\"I can also add.\"</p>\n<p>Freda looked at her, and for one second she was not sixteen at all. She was the child who had sat on the stairs six years ago while her mother cried in the kitchen and pretended to be on the phone. She had never mentioned it. Neither had Iola.</p>\n<p>\"Are you going to go?\" Freda said.</p>\n<p>\"I don't know yet.\"</p>\n<p>\"You're going to go.\" Freda lifted the phone back to her ear, said \"Sorry, my mom,\" into it, in the voice that meant <em>my mom</em> was a long and tragic story, and went back to her room. The door closed. It didn't slam. Iola had learned to be grateful for the difference.</p>\n<p>She finished the gutter guards first, because she had said she would, and because sixty dollars was sixty dollars. It took twenty minutes. Then she opened a new window and did what she had not done for six years. She started checking.</p>\n<p>Aldine, Mercer and Voss was real. That was the first surprise. It was registered, it was old, and it had a website with a street address, a phone number, and almost nothing else: no photographs of smiling partners, no list of the kinds of cases it took, no news. The kind of firm, she thought, that did not need to find clients, because its clients already knew where it was. There was an R. Aldine on the state bar list, admitted forty-one years ago, with no complaints against him. There was nothing else about him at all, which was harder to arrange than people thought.</p>\n<p>She searched for Carrow House, which she had not let herself do in a long time. It was still there. It had had a good year. There was a photograph of the brass doors.</p>\n<p>She searched for her source's real name, the one she never wrote down, and found what she had found every other time she had looked, back when she still looked: an old address, an old phone listing, and after that, nothing. No obituary. No new address. No arrest. A man who had simply stopped.</p>\n<p>At midnight she closed the laptop and wrote on the back of the envelope, by hand, the way she used to plan a story:</p>\n<p><em>Bookbinder.</em></p>\n<p><em>Who else knew?</em></p>\n<p>She underlined <em>who.</em> Then, under that, because she was honest with herself on paper even when she was not anywhere else:</p>\n<p><em>Electric. Car insurance. Freda's teeth.</em></p>\n<p><em>Thirty thousand dollars.</em></p>\n<p>It felt like picking up an instrument she used to play and finding that her hands still knew where to go.</p>\n<p>In the morning, after the school run, she called the number on the letterhead.</p>\n<p>A woman answered on the second ring. She said that Mr. Aldine had been expecting to hear from her, which Iola did not like. She said that the gentleman lived about two hours north, which was fine. And she said the first session could be as soon as Thursday at ten, which was too soon, and which Iola heard herself agree to.</p>\n<p>\"Can you tell me who your client is?\"</p>\n<p>\"I'm afraid our client prefers not to be named.\"</p>\n<p>\"Can you tell me who the gentleman is?\"</p>\n<p>\"He'll tell you himself, I expect,\" the woman said. \"I'll let him know it's Thursday at ten. He said to tell you he'll have the kettle on.\"</p>\n<p>\"Does he know why your client wants his story?\"</p>\n<p>A pause, and the soft click of a keyboard.</p>\n<p>\"I don't think anyone does, Ms. Barnett,\" the woman said. \"That's rather the point of hiring you.\"</p>\n<p>On Wednesday night she told Freda over dinner. Freda said, \"I told you,\" and then, after a moment, \"Is it safe?\" which was not a question Iola had expected, and which she answered with more confidence than she had.</p>\n<p>\"He's an old man who wants to tell somebody about his life,\" she said. \"I've interviewed a hundred of them.\"</p>\n<p>\"And the one paying?\"</p>\n<p>\"Also old, apparently.\"</p>\n<p>\"Old and rich and weird,\" Freda said. \"Text me when you get there.\"</p>\n<p>\"I will.\"</p>\n<p>\"Text me when you leave.\"</p>\n<p>\"Who's the mother here?\"</p>\n<p>Freda almost smiled. Her phone buzzed on the table beside her plate, and she turned it face down without looking at it, and asked for the salt.</p>\n<p>On Thursday Iola dropped Freda at school, stopped for gas, and drove north with the letter on the passenger seat, face down. The city thinned into highway and the highway into two-lane road, past farm stands closed for the season and a church with a sign that said <em>God answers knee mail.</em> She had printed the directions, because she did not trust her phone out here, and because she was the kind of person who printed directions.</p>\n<p>At every red light she rested her hand on the letter, as if it might get up and leave.</p>"}, {"num": 2, "title": "The Old Man", "html": "<p>The house was at the end of a gravel road, past a mailbox with no name on it, and it was smaller than she had expected. White clapboard, a porch with two chairs, a vegetable garden gone to seed for the winter. Somebody had raked the leaves into a neat pile by the fence and then, apparently, lost interest in doing anything else with them.</p>\n<p>Iola parked behind an old blue pickup truck and sat for a minute with the engine off.</p>\n<p>She texted Freda, <em>Here. Nice old house. Normal.</em> She waited until the reply came, <em>ok,</em> followed a moment later by <em>text when u leave,</em> and then she put the phone in her bag, picked up the folder with her printed directions and the letter in it, and got out.</p>\n<p>The front door opened before she reached the porch.</p>\n<p>He was taller than she had pictured, and straighter. Somewhere in his seventies, with white hair cut short and a gray cardigan buttoned wrong by one button, so that one side hung lower than the other. His face was lined in the way of people who had spent a lot of time outdoors and not worried about it. His eyes were a pale, washed blue, and they went over her once, not rudely, the way a mechanic listens to an engine.</p>\n<p>\"Ms. Barnett,\" he said. \"You found it. People usually drive past the mailbox.\"</p>\n<p>\"I nearly did.\"</p>\n<p>\"Everyone does. I keep meaning to paint my name on it, and then I don't.\" He stepped back to let her in. \"Tom Hale. The kettle's on, as promised. I hope you drink tea, because I'm afraid the coffee here is a crime.\"</p>\n<p>Inside, the house was mostly books.</p>\n<p>They were on shelves that went to the ceiling, and in stacks on the floor beside the shelves, and on the stairs, one to each step, like they were climbing up to bed. There were books in English and books in languages she didn't recognize, paperbacks with cracked spines and old leather volumes with the titles rubbed off. A woodstove ticked in the corner. There was a worn armchair by the window with a lamp beside it, a small table with a chess game half finished and nobody to finish it, and a second, newer armchair across from it that had plainly been bought for company and not used much.</p>\n<p>\"Sit, please,\" he said. \"That one. It's the one that doesn't eat people.\"</p>\n<p>She sat. He went into the kitchen, and she heard the tick of the kettle, the clink of cups, and the particular care of someone who lived alone and did things in the same order every day.</p>\n<p>She looked around, because looking around was a habit she had never been able to break. A calendar from the feed store, still on last month. A pair of reading glasses on the windowsill and a second pair on the table, as if he had lost the first and given up. On the wall, one framed photograph: a woman laughing on a beach, the colors faded to orange, the kind of photo that had been taken on film. A heavy old radio. A bird feeder outside the window, freshly filled.</p>\n<p>He came back with a tray. Two cups, a teapot in a knitted cover, a plate of shortbread that had come out of a tin.</p>\n<p>\"You drove someone to school this morning,\" he said, setting the tray down.</p>\n<p>Iola looked at him.</p>\n<p>\"Your passenger seat,\" he said. \"I saw it when you opened your door. It's pushed all the way back, as far as it goes, and you're not tall, so you didn't do that. Someone taller than you rides with you, often enough that you've stopped moving it back. There's a hair tie around the gearshift, the thick kind. And it's a school day, and you were here at ten, from two hours away, so you left at eight, which is about when schools open.\" He poured. \"A daughter, I'd guess. Tall, like her father, I expect. But I wouldn't bet the house on any of it.\"</p>\n<p>\"You were watching from the window.\"</p>\n<p>\"I was. I'm old. It's what we do.\" He smiled, and it changed his face completely, took ten years off it. \"Also, you have printed directions in that folder. Most people trust their phones. People who print directions have usually been let down before, and don't intend to be let down again.\"</p>\n<p>\"That's a lot to get from a car seat and a folder.\"</p>\n<p>\"Most guesses are wrong,\" he said. \"The trick isn't guessing. It's noticing, and then checking. I suspect you already know that.\"</p>\n<p>She took out her phone and set it on the table between them, and beside it, because she had been burned before, a small digital recorder she had owned for eleven years.</p>\n<p>\"Two?\" he said.</p>\n<p>\"One of them always dies.\"</p>\n<p>\"Which one?\"</p>\n<p>\"Whichever one I trusted.\"</p>\n<p>He laughed at that, a real laugh, and picked up the notepad and pencil from the arm of his chair and settled them on his knee. The top page was already covered in doodles, the kind people make on the phone or while they wait: the same shape, over and over, some of it gone over so many times the pencil had shone. She saw it the way you see a stranger's doodles on a train. A five-pointed star, each one drawn in one long line, with a tiny letter tucked into each point. Greek, she thought, or something like it. While she checked the levels and said the date and time into the phone, the way she always had, his pencil found one of the stars and began, without his looking down, to go over it again.</p>\n<p>\"Mr. Hale,\" she said.</p>\n<p>\"Tom.\"</p>\n<p>\"Tom. Before we start, let me explain how I work. With your permission, I'll record our conversations. Anything that can be verified, I'll verify: names, dates, places. If something you tell me doesn't match the record, I'll tell you, and I'll ask you about it. I'm not trying to catch you out. It's how I make sure that what I write down is accurate.\"</p>\n<p>\"I know,\" he said. \"It's why I agreed.\"</p>\n<p>\"The letter said your memories would not seem credible.\"</p>\n<p>\"Did it say that?\" He seemed pleased. \"That's honest of them. They won't. I can tell you now what I'm going to tell you, and you can decide whether to put your coat back on.\"</p>\n<p>\"Go ahead.\"</p>\n<p>He put the pencil down.</p>\n<p>\"I have lived before,\" he said. \"Not in the way people mean on television, with past-life regression and a woman with a crystal. I mean that I have been other people, one after another, for a very long time, and I remember them. Not perfectly. The way you remember your childhood. Some of it very clearly, and some of it gone, and some of it I would rather have lost.\"</p>\n<p>The woodstove ticked. Outside, a truck went by on the far road, and the sound of it came and went.</p>\n<p>Iola had interviewed a man who believed he had been abducted by aliens, twice, and a woman who believed her late husband spoke to her through the microwave. She had interviewed a state senator who believed he had never taken a bribe. She had found, over the years, that the useful thing was not to argue. You let them tell it. People who were lying tripped over their own stories, if you gave them room. People who believed something strange usually told it the same way every time, which was its own kind of information.</p>\n<p>So she only said, \"How long is a very long time?\"</p>\n<p>\"Longer than I would like you to write down today,\" he said. \"Where would you like to start?\"</p>\n<p>\"My client sent a question,\" she said. She opened the folder, found the letter, and read out the handwritten line at the bottom.</p>\n<p>\"'Please ask him what he thinks of 1865.'\"</p>\n<p>He didn't answer at once. He looked at the window, where there was nothing to see but the raked leaves and the fence and the gray sky over the field. His hand had gone back to the notepad, and the pencil was moving again, slowly, over the same star.</p>\n<p>\"What I think of it,\" he said.</p>\n<p>\"That's what it says.\"</p>\n<p>\"It's a strange way to put it.\" He was quiet a moment longer. \"I think it rained for most of that spring. People forget that. They picture it all in sunshine because the war was ending, and the pictures in the books are all taken on bright days, because you needed a bright day to take a picture then. But I remember mud. The inauguration in March, the streets were a river of mud, you couldn't cross Pennsylvania Avenue without losing a shoe. And it rained all morning, and then when he stood up to speak, the sun came out. Right then. Everyone saw it. People said it was a sign.\"</p>\n<p>\"Lincoln,\" she said.</p>\n<p>\"Lincoln.\" He said the name carefully, as if it were something that might break. \"I didn't think it was a sign. I remember thinking that it was only weather. I was wrong about a great many things that spring. That was one of the smaller ones.\"</p>\n<p>Iola wrote <em>sun, inauguration, March 1865, check</em> in her notebook. It was the kind of detail anyone could find in a library. It proved nothing. She noted, too, that he had said it the way you describe something you saw from where you stood, and not the way you describe something you read. That also proved nothing. People who told stories well could do that. It was her job not to be impressed.</p>\n<p>\"You were in Washington,\" she said.</p>\n<p>\"I was in Washington,\" he said. \"But that's not where it begins. It begins the summer before. July of 1864.\"</p>\n<p>\"What happened in July of 1864?\"</p>\n<p>He set the pencil down on the notepad, on top of the star, and folded his hands.</p>\n<p>\"I woke up,\" he said, \"in a field outside Washington, in a body that wasn't mine yet. It was the hottest day I had felt in a hundred years. And somebody was shooting at me.\"</p>"}];
const $ = (id) => document.getElementById(id);
const main = $("main");
const store = {
  get(k, d) { try { const v = localStorage.getItem("wyl." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wyl." + k, JSON.stringify(v)); } catch {} },
};

// settings
function applySize() { document.documentElement.style.setProperty("--size", store.get("size", 20) + "px"); }
function applyTheme() {
  const t = store.get("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
applySize(); applyTheme();
document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
  store.set("size", Math.min(28, Math.max(15, store.get("size", 20) + Number(b.dataset.size)))); applySize();
});
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.theme); applyTheme(); });
$("aaBtn").onclick = (e) => { e.stopPropagation(); $("sheet").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!$("sheet").contains(e.target)) $("sheet").classList.remove("open"); });

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();
}
function toc() {
  main.innerHTML = `<section class="toc"><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.num}</span><span>${c.title}</span></button></li>`).join("")}</ol></section>`;
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter">
    <header><div class="num">Chapter ${c.num}</div><h2>${c.title}</h2></header>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  $("where").textContent = `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();

// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });


// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
const CKEY = store.get("ckey", null);
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}
function openCmt(ch, p, text) {
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");
  $("cmtText").value = ""; $("cmtStatus").textContent = "";
  renderOld();
  $("cmt").classList.add("open");
}
$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString() };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
</body>
</html>
