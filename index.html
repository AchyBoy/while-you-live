. Half the men who had come into his shop that day, he told me, had said the same thing, or near it. They were going to line the Avenue when the President was carried up it, and they wanted to be in blue when they did. He threw in a forage cap for nothing.</p>\n<p class=\"tape\">I thanked him. I did not leave my own coat with him. A good coat left behind is a thing a man remembers. I carried it out rolled under my arm, and that night it went in the canal.</p>\n<p class=\"tape\">And I walked out onto Seventh Street in the uniform of the army that had shot me, with my cane, into a city full of soldiers looking for a lame young man, and not one of them looked at me.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I did not leave the city that day. I could not. The bridges were closed, all of them, and the roads out were stopped by cavalry, and every boat on the river was being searched. And there was something I had to know first.</p>\n<p class=\"tape\">I had to know where Booth was going.</p>\n<p class=\"tape\">I knew that he had crossed the Navy Yard Bridge. The sentry, a sergeant, had told the officers who questioned him that a man on a bay horse had come across late that night and given his name, and said he was going home, into Maryland, and that he had let him through. And another man, a little after, on another horse. He had let him through too.</p>\n<p class=\"tape\">A man going south, who says he is going home. I had written that down, on the back of an invoice, in March. They let him go.</p>\n<p class=\"tape\">So he was in Maryland. On my road. And there was one house on that road that he knew as well as any house in the world, because I had drawn the lane to it for him, in December, on the back of my mother's tobacco receipts.</p>\n<p class=\"tape\">I sat in the blue coat in a saloon doorway on Seventh Street, with the city going past me in its black crepe, and understood that John Wilkes Booth, with half the Union army behind him, might at that moment be riding up the lane to my mother's door.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>\"You went home,\" I said. It was not a question.</p>\n<p>\"I went home.\" He turned the pencil in his fingers. \"Getting out of Washington that week is a story by itself. I'll tell you next time. I'm going to tell you how I found him, Ms. Barnett. Booth. I knew where he was going before the army did. I sent a frightened man home from the Kirkwood, and I found Booth. Those were the two things I got right that week.\" He looked at me. \"The second didn't make any difference to him, in the end.\" He put the pencil down. \"Next week.\"</p>\n<p>I wrote <em>Seventh Street, rag shops, blue coat,</em> and then, underneath, because I could not help it, <em>the right thread.</em></p>", "audio": false, "added": 1790599838901, "pt": [1790604858193, 1790694240640, 1790599838901, 1790861984290, 1790694240640, 1790599838901, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790718282701, 1790599838901, 1790599838901, 1790694240640, 1790604858193, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790604858193, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790830034990, 1790861984290, 1790599838901, 1790599838901, 1790604858193, 1790599838901, 1790785364098, 1790785364098, 1790785364098, 1790785364098, 1790785364098, 1790599838901, 1790599838901, 1790599838901, 1790604858193, 1790599838901, 1790604858193, 1790599838901, 1790599838901, 1790694240640, 1790784418993, 1790694240640]}, {"num": 25, "title": "The Gate", "extra": false, "html": "<p>On the thirteenth visit there was the hardest frost yet, white to the fence line, and the woodstove was already going hard when I came in. He had put a second blanket over the back of my chair. He did not mention it, and neither did I.</p>\n<p>\"Getting out of Washington,\" I said, when the recorders were on. \"You said it was a story by itself.\"</p>\n<p>\"It was a very short story, in the end,\" he said. \"The army took me.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 16 and 17, 1865</em></p>\n<p class=\"tape\">By Sunday morning half the Union army seemed to be going into Southern Maryland. That was where everyone believed Booth had gone, and everyone was right. Cavalry went down the roads in columns, and infantry after them, and wagons after the infantry, carrying feed and rations and tents for the men who would be searching the swamps. The roads south were closed to everyone. Everyone but the army.</p>\n<p class=\"tape\">I stood at the edge of a wagon yard near the Navy Yard, in my faded blue coat and my forage cap, with my cane, and watched the teamsters loading up for Bryantown.</p>\n<p class=\"tape\">It is a strange thing, but true, that nobody on this earth is less questioned than a wounded soldier who looks tired. I limped up to the last wagon in the line and asked the teamster, in the flattest voice I could make, whether he was going down past Bryantown, because I'd been given leave to go home and my people were down that way, and I'd walked as far as I could on this leg. He looked at the leg. He looked at the coat. He jerked his head at the back of the wagon, and I climbed up among the sacks of oats, and we went out over the bridge that afternoon in a long column of wagons with cavalry on both sides of us, and nobody looked into the back of that wagon once.</p>\n<p class=\"tape\">I had left Washington in July under a load of potatoes. I came back into Charles County in April under a load of oats. I thought about that, lying there. I did not think it was funny yet.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The teamster put me down at a crossroads a mile short of Bryantown, and I walked the rest of the way home across the fields.</p>\n<p class=\"tape\">Bryantown was full of soldiers. I could see their tents from the ridge, and their horses in the fields, and smoke from their fires. They had come in on Saturday, the day after, a detachment of cavalry, and taken over the village. The tavern was their headquarters. Every farm for miles was being searched.</p>\n<p class=\"tape\">Ours had been searched on Sunday morning. I learned that on the porch, from my mother, before she had even let go of me. Soldiers had come, an officer and six men, and gone through the house and the barn and the empty cabins, politely enough, and asked whether any strangers had come by, and gone away.</p>\n<p class=\"tape\">\"They didn't ask about you,\" she said. \"Not your name. Nobody's asked your name.\" She held my face in both her hands again, the way she had in the ditch. \"Kit, what are you wearing?\"</p>\n<p class=\"tape\">\"A coat,\" I said. \"I'll tell you.\"</p>\n<p class=\"tape\">I never did.</p>\n<p class=\"tape\">She did not ask me anything else. She had her own grief that week, and it was not the President. The schoolmaster's letter about Ned had come to her first, before she sent it on to me, and she had read it on the porch and folded it up and put it in her apron pocket with the others. I could see the corner of it. She had not taken it out since.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">It was Lottie who told me about the gate.</p>\n<p class=\"tape\">She found me in the barn that evening, where I had gone to be alone, and she sat down on a hay bale across from me with her arms around her knees, the way she had sat when she brought me newspapers in the summer. She was fifteen now. She had grown up in the winter, all at once. She looked at the blue coat and did not ask about it either.</p>\n<p class=\"tape\">\"Somebody came to the gate,\" she said. \"Saturday night.\"</p>\n<p class=\"tape\">I kept my face still.</p>\n<p class=\"tape\">\"I was in the hayloft,\" she said. \"Reading. I wasn't supposed to be. It was nearly dark. And two men came up the lane on horses, slowly, from the Bryantown road. They didn't come to the house. They stopped at the gate.\" She looked at me. \"One of them got down to open it. And he fell.\"</p>\n<p class=\"tape\">\"Fell.\"</p>\n<p class=\"tape\">\"Fell down. When his foot touched the ground. Like his leg had gone out from under him. And the other one got down and helped him up, and he stood there holding onto the gate. Holding onto it like it was all that was holding him up.\" She was quiet a moment. \"And they looked at the house for a long time. Mama had the lamp lit in the kitchen. And then the one who fell said something to the other one, and the other one got him back up on his horse, and they went away. Not back to the road. Down across the field. Toward the swamp.\"</p>\n<p class=\"tape\">\"What time?\"</p>\n<p class=\"tape\">\"After dark. Seven, maybe.\" She had thought about it; I could see it in her face. \"I didn't tell Mama. I didn't tell the soldiers either. When they came on Sunday and asked if we'd seen any strangers.\" She looked at me steadily. \"I don't know why I didn't.\"</p>\n<p class=\"tape\">\"I do,\" I said.</p>\n<p class=\"tape\">She waited.</p>\n<p class=\"tape\">\"You didn't tell them because you'd already guessed who it was,\" I said. \"Didn't you.\"</p>\n<p class=\"tape\">Lottie's face crumpled. She had been holding it together for two days, alone, fifteen years old, with a secret like that. She put her face down on her knees.</p>\n<p class=\"tape\">\"He was so nice to me,\" she said into her knees. \"He said he'd send me a better picture. Signed.\" And she cried, and I sat beside her on the hay bale in the dark barn and held her, and did not say anything, because there was nothing true I could say that would help.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">When she had gone in, I sat alone in the barn and put it together.</p>\n<p class=\"tape\">A man who fell when his foot touched the ground. I had watched Booth come down onto the stage of Ford's Theatre on one knee, and get up, and run into the wings, limping. Something had happened to that leg. Two men on horses, riding slowly. On Saturday evening, in the last light, coming up our lane from the direction of Bryantown and the doctor's house on the other side of it.</p>\n<p class=\"tape\">He had come to our gate. He knew the lane. I had drawn it for him.</p>\n<p class=\"tape\">And then he had stood at the gate holding onto it, and looked at my mother's lamp in the kitchen window, and not come in.</p>\n<p class=\"tape\">I have wondered about that ever since. I would like to believe it was the one decent thing he did that week: that he stood at the gate of a family that had been kind to him and understood what it would cost them to take him in, with the army an hour behind, and turned away to spare them. I would like to believe it. I have known men do that. It is possible.</p>\n<p class=\"tape\">It is more likely that he stood at the gate and saw, from there, what I had seen from the ridge that afternoon: the fires of the cavalry in the fields around Bryantown, a mile away, and understood that the lane he had studied in December now led straight into the arms of the Union army. And turned his horse toward the swamp, because the swamp was the one place in Charles County the cavalry could not ride.</p>\n<p class=\"tape\">I don't know which. I never will. Most of what I know about John Wilkes Booth is like that.</p>\n<p class=\"tape\">But I knew where he was going.</p>\n<p class=\"tape\">The swamp was not a hiding place. The Zekiah was miles long, and wet, and a man with a broken leg could not live in it. It was a road. It ran south, in the dark, all the way to the river country, to the big farms along the Potomac where the landings were and the men who had rowed people across all through the war. And the man who ran those crossings, everyone in the county knew, was a quiet fisherman down by the river named Thomas Jones. He had put more Confederate couriers across that river than anyone alive, and the Union had never managed to stop him for long.</p>\n<p class=\"tape\">Booth could not cross yet. Every gunboat in the Potomac flotilla was on that river now, up and down, day and night. He would have to be hidden, close to the water, and fed, and kept quiet, and wait for the right night. Somebody would have to hide him who knew the river country and was not afraid.</p>\n<p class=\"tape\">I sat in the barn and listened to my mother moving in the kitchen, and I knew, as well as I have ever known anything, that John Wilkes Booth was lying in the woods somewhere between our swamp and the Potomac, waiting for Thomas Jones to tell him the river was dark enough.</p>\n<p class=\"tape\">And I knew those woods.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>\"Lottie,\" I said.</p>\n<p>\"Yes.\"</p>\n<p>\"She was fifteen. And she kept that.\"</p>\n<p>\"She kept it all her life. I asked her, years later, whether she'd ever told anyone. She said no. She said she'd been waiting for someone to ask her, and nobody ever had.\" He looked at the window, at the frost going white on the field. \"She was the best person I knew in that life. I've never been able to decide whether I did right by her.\"</p>\n<p>I wrote that down. Then I sat looking at it.</p>\n<p>\"You're going to go and find him,\" I said. \"In the woods.\"</p>\n<p>\"I'm going to go and find him,\" he said. \"That's next.\"</p>", "audio": false, "added": 1790600451060, "pt": [1790857526860, 1790694240640, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790861984290, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790861984290, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790868876334, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790604858193, 1790604858193, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790694240640, 1790600451060, 1790600451060, 1790600451060, 1790694240640, 1790694240640, 1790600451060]}, {"num": 26, "title": "The Whistle", "extra": false, "html": "<p>On the fourteenth visit the field was frozen hard, and he was already in his chair with the notepad on his knee when I came in. There was no tea. The kettle was cold on the stove; I touched it on my way past, out of habit. The top page of the notepad was covered in small writing, which it never was before we started.</p>\n<p>\"Did you sleep?\" I said.</p>\n<p>\"Some.\" He did not look up. \"I've been awake with this part since four. I'd like to get it said, if you don't mind, before I think about it any more.\"</p>\n<p>I did not mind. I sat down and took out the recorders, and he started talking while I was still untangling the cord.</p>\n<p>\"I found him in two days,\" he said. \"It wasn't clever. I just knew the country, and I knew who to watch.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 18 to 23, 1865</em></p>\n<p class=\"tape\">I did not look for Booth. Booth was a man with a broken leg lying still in the woods, and a man lying still in the woods cannot be found by looking, not in that country, not by anyone. I looked for Thomas Jones.</p>\n<p class=\"tape\">Jones lived above the river, near Pope's Creek, on a bluff where he could see the whole width of the Potomac and the Virginia shore beyond it. He was a quiet, thin, careful man in his forties who fished for a living and had spent the whole war doing something else. Everyone in the county knew what. Nobody said it. He had been in prison for it once, early on, and come home, and gone on doing it.</p>\n<p class=\"tape\">If Booth was being kept anywhere, he was being kept for Jones. And a man being kept alive in the woods has to be fed.</p>\n<p class=\"tape\">So I watched Jones. I took one of my mother's horses and rode down toward the river on the back roads in my blue coat, the way a Union man on leave might ride out to look at the country, and I found a place on a wooded rise across a field from the lane that led up to his house, and I lay in the leaves there with a piece of bread and my father's old spyglass, and I watched.</p>\n<p class=\"tape\">The country was full of soldiers. Cavalry went down the river road three and four times a day. Twice a patrol passed so close below me that I could hear the men talking about the reward. A hundred thousand dollars, one of them said, and what he would do with his share, and another one laughed at him. They rode on toward the river. They never once looked up at the rise.</p>\n<p class=\"tape\">Jones went about his business as if nothing in the world had happened. He fished. He mended a fence. He went to the landing and talked to the men who were watching the river for the army, pleasantly, for a long time. He was, I thought, lying there, the calmest man in Maryland.</p>\n<p class=\"tape\">And on the second afternoon, a little before dark, he walked out of his lane with a basket over his arm, and turned off the road, and went into the pines.</p>\n<p class=\"tape\">I followed him as far as I could without being seen, which was not far. The pines on that side of the road were thick, young, close-grown, the kind of thicket where you cannot see ten feet in front of you. I lost him in it almost at once. I stood at the edge of it, very still, and listened.</p>\n<p class=\"tape\">And from somewhere inside, not far off, I heard a whistle. Three notes. A little rising tune, like a bird that is not quite any bird.</p>\n<p class=\"tape\">A moment later, from deeper in the pines, somebody whistled it back.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I stood at the edge of those pines for a long time.</p>\n<p class=\"tape\">He was in there. A hundred yards from me, perhaps less. Lying on the ground on a blanket with his leg in splints, and Herold beside him, and Jones kneeling to open the basket. I could have walked in. I could have walked in and stood over him. I have thought about what I would have said, many times. I have never once been able to think of anything worth the walk.</p>\n<p class=\"tape\">And I could have walked out. That was the other thing. I could have walked back to the road and waited for the next patrol and pointed into those pines and said <em>there,</em> and he would have been in irons by dark.</p>\n<p class=\"tape\">I want you to understand what that would have meant, because I understood it, standing there, all at once.</p>\n<p class=\"tape\">It would have meant Jones. Jones would have been taken, and Samuel Cox, the planter at Rich Hill, whose land that was and whose people had hidden them in those pines, and every man and woman in that part of the county who had carried a letter or a meal or a message that week. And the soldiers would not have stopped there, because they would not have needed to. They would have gone back up the road Booth came down, house by house. The doctor. The tavern. The farm by the swamp where two riders had stopped at the gate at dusk, and where a girl in the hayloft had seen them, and told no one, and a mother had had a lamp lit in the kitchen.</p>\n<p class=\"tape\">They hanged people, that summer, for a great deal less.</p>\n<p class=\"tape\">I stood at the edge of the pines and chose. I chose my mother, and Lottie, and a county that had hidden me and nursed me and asked me nothing, over the President of the United States, who was dead, and over the justice that was owed him, which was coming anyway. Booth could not stay in those pines forever. He could not walk. He would have to cross the river, and in Virginia he would be one crippled man among strangers, with every soldier in the Union army looking for him. He was going to be caught. I did not need to be the one who caught him here, on this shore, in the middle of everyone I loved.</p>\n<p class=\"tape\">But I would be the one who knew where he went.</p>\n<p class=\"tape\">I turned around and went back to my rise and lay down in the leaves again, and watched Jones's lane, and waited for the night he took them to the river.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">It was Friday. The twenty-first. A week to the night.</p>\n<p class=\"tape\">A little after nine, I saw Jones come out of the pines leading a horse with a man on it, and another man walking beside, and they went down across the fields toward the bluff, slowly, without a light. I followed them as far as the top of the bluff, on my belly, the last of it.</p>\n<p class=\"tape\">From there I watched him put them in a boat. A small flat boat, pulled up in the reeds below. I watched Herold help Booth down into it, and Booth sit, and Jones lean down and say something to them both and point out across the water, and push them off. And I watched the boat go out into the dark on the river and turn south and west, toward Virginia, and grow smaller, and go.</p>\n<p class=\"tape\">Jones stood on the shore a long time after they were gone. Then he walked back up the bluff past where I lay, close enough to touch, and went home.</p>\n<p class=\"tape\">He never knew I was there. He told the whole story himself, years later, in a book. I have read it. I'm not in it.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They did not reach Virginia that night. I know that now; the whole country knows it. The tide and the dark took them up a creek on the Maryland side instead, miles off, and they had to hide another day and go again the next night. At the time I only knew that the boat had gone out on the river on Friday night, and that by Saturday morning, if they had any luck at all, they were in Virginia.</p>\n<p class=\"tape\">On Saturday and Sunday I watched the army search Maryland.</p>\n<p class=\"tape\">They were everywhere, and they were nowhere. They were searching the Zekiah Swamp, which Booth had left a week before. They were searching barns in Bryantown. They had questioned Dr. Mudd twice, and were arresting other men all over the county and taking them to Washington. And every hour they searched Maryland was an hour he had in Virginia.</p>\n<p class=\"tape\">I waited until I was sure he was across. I did not want them on Jones's shore.</p>\n<p class=\"tape\">On Sunday afternoon I rode into Port Tobacco, in my blue coat.</p>\n<p class=\"tape\">There was an officer there from Washington with a party of detectives, running the search in that part of the county from the hotel. A major, a provost marshal named O'Beirne. I had heard his name on the roads all week. I went and stood in the hotel yard among the soldiers and the horses, a lame Union private on leave, and waited until one of his detectives came out, and I told him.</p>\n<p class=\"tape\">I told him that I had been fishing on the Potomac below Pope's Creek on Friday night, and that I had seen a small boat put off from the Maryland shore in the dark, a little after nine, with two men in it. That one of them had been lifted into it by the other, as if he could not walk. That the boat had gone out toward the Virginia side, south and west, and had not come back.</p>\n<p class=\"tape\">I did not say whose shore. I did not say whose boat, or whose pines, or whose lane. I did not say a single name.</p>\n<p class=\"tape\">The detective looked at me a long time. He wrote it down. He asked me my regiment, and I gave him one, a Pennsylvania regiment I knew had been in the fighting around Petersburg, and he wrote that down too. He went inside.</p>\n<p class=\"tape\">I learned afterward, as everyone did, that on Monday morning Major O'Beirne telegraphed the War Department that he believed the men they were looking for had already crossed into Virginia. And that the War Department believed him, and that afternoon put a troop of cavalry on a steamer and sent it down the river. My report had been wrong in the one detail, and right in the one that mattered.</p>\n<p class=\"tape\">I did not learn that on Sunday. On Sunday, the detective came back out into the hotel yard with another man, and the other man looked at my face, and at my cane, and at my leg, and then at my face again, and said, \"What's your name, soldier?\"</p>\n<p class=\"tape\">And I heard, under the question, from somewhere behind me in the yard, one of the soldiers say to another: <em>a lame one. The clerk said a lame one.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>I had been writing fast. I looked up.</p>\n<p>\"They arrested you.\"</p>\n<p>\"They arrested me.\" He smiled slightly. \"For the first time in that life. Not the last time in all of them.\"</p>\n<p>\"For being lame.\"</p>\n<p>\"For being lame, and a Marylander, in a coat that did not quite fit, with a story that was too useful.\" He turned the pencil. \"A clever man who is being careful does not walk into a room full of detectives with the one piece of information they need. I knew that. I did it anyway. I wanted them in Virginia. I wanted them out of my county.\"</p>\n<p>I looked at my notes, and then at him.</p>\n<p>\"You're going to tell me how you got out,\" I said.</p>\n<p>\"Somebody got me out,\" he said. \"I've never been entirely sure who.\"</p>", "audio": false, "added": 1790600832014, "pt": [1790857526860, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790604858193, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790861984290, 1790600832014, 1790600832014, 1790604858193, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790604858193, 1790600832014, 1790600832014, 1790600832014, 1790694240640, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790694240640, 1790694240640, 1790600832014]}, {"num": 27, "title": "The Note", "extra": false, "html": "<p>We broke for lunch. He heated soup, and I set the table without being asked, finding the spoons on the first try now, and we ate looking out the window at a pair of crows walking the frozen field like two men looking for something they had dropped.</p>\n<p>\"I was arrested once,\" I said.</p>\n<p>He put his spoon down and looked at me with real interest, which he did not often show about me.</p>\n<p>\"I was twenty-two. I was covering a protest downtown for a paper that doesn't exist anymore, and when the police cleared the street they cleared me with it. Press pass and all.\" I shrugged. \"Six hours in a holding cell with a woman who read palms. She told me I'd have one daughter and a lot of trouble with men who wouldn't give me straight answers.\"</p>\n<p>\"Was she right?\"</p>\n<p>\"About the daughter.\" I looked at him. \"Jury's still out on the other thing.\"</p>\n<p>He laughed, properly, the first time I had heard him do it in weeks.</p>\n<p>\"What was the worst of it?\" he said. \"The six hours.\"</p>\n<p>I thought about it. \"Not the cell. The cell was just boring. It was being sure, every minute, that somebody out there was about to notice the mistake and come and let me out. And nobody did, until they did.\"</p>\n<p>\"Yes,\" he said. \"That's the worst of it. Every time.\" He picked up his spoon again. \"The first night, you think the mistake is the arrest. It takes a few days to understand that from their side there isn't one.\"</p>\n<p>\"How many times?\"</p>\n<p>\"In all of them?\" He considered it, the way another man might count his children. \"Enough that I've stopped keeping the number. Not enough that I've stopped minding.\"</p>\n<p>He ate a little more. The crows had found whatever it was, out in the field, and were arguing over it.</p>\n<p>I had used his bathroom that morning, and noticed something I should have noticed weeks before. There was no mirror over the sink. There was a pale rectangle on the wallpaper where one had been, and two screw holes, painted over. I had not seen a mirror anywhere else in the house either, now that I thought about it. It explained the cardigan.</p>\n<p>\"You don't have a mirror,\" I said.</p>\n<p>\"No.\"</p>\n<p>\"Anywhere?\"</p>\n<p>\"I stopped keeping them a few lives ago.\" He did not seem to mind the question. \"It's never the face I'm expecting.\"</p>\n<p>\"You'll want to know what they had on me,\" he said. \"It wasn't much. It didn't need to be.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 23 to 28, 1865</em></p>\n<p class=\"tape\">They took me to Washington in a wagon, with my hands tied, with two other men from the county who had been picked up that week: a farmer who had sold a pair of boots to the wrong stranger, and a boy who had been heard to laugh when he was told the President was dead. We did not speak to each other the whole way. We went up the road I had come down under a load of oats, and over the Navy Yard Bridge, and past the end of it where I had sat with a borrowed horse on the seventeenth of March.</p>\n<p class=\"tape\">They put us in the Old Capitol Prison. It had been the Capitol once, when the British burned the real one, and it had been a boarding house after that, and in the war it had become a prison, a big shabby brick building across from the new Capitol dome, full of spies and blockade runners and Southern ladies and anyone the government did not know what else to do with. That week it was full to the attic with men from Southern Maryland.</p>\n<p class=\"tape\">When they asked my name, I gave them the one I had settled on in the wagon, somewhere south of the bridge. Christopher Hurley, of St. Mary's County. Not Keene; Booth's people knew Keene, and some of them were in that building. Christopher, because a man answers to his own first name without thinking, and a man who has to think before he answers is a man who is lying. And Hurley, because it belonged to a boy from the next county, with a voice like mine, whom nobody alive in Washington had ever met. It was the only thing of Ned's I had left, and he would have lent it to me without a second thought.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">On the second day they brought the clerk from the Kirkwood House.</p>\n<p class=\"tape\">They stood me in a room with four other men, all about my age, all of us in whatever we had been arrested in, and they made us walk, one at a time, from one wall to the other. The clerk stood by the door with an officer beside him. When it was my turn I walked, and my leg did what it always did, and I watched the clerk's face.</p>\n<p class=\"tape\">He did not hesitate. \"That's him,\" he said. \"He asked for Mr. Booth. Ten o'clock Friday night. He asked when Mr. Booth left his card, and then he ran out the door.\"</p>\n<p class=\"tape\">\"Ran?\"</p>\n<p class=\"tape\">\"As best he could, sir. With the leg.\"</p>\n<p class=\"tape\">The officer wrote it down.</p>\n<p class=\"tape\">That was what they had. It was enough to hang a man that month. A lame Marylander, wearing a coat that was not his and a name that was not his, claiming a regiment that was not his, who had asked for Booth at the Kirkwood House at the very hour of the murder, and had then run toward Ford's. Who had been found nine days later in the heart of the county Booth had fled through, walking into a room of detectives with a story about a boat. The officer who questioned me that afternoon, a tired colonel with a very clean desk, put it to me in almost those words, and asked me whether I had anything to say.</p>\n<p class=\"tape\">I had a great deal to say, and none of it could be said. I could not tell him why I was at the Kirkwood without telling him why I knew Booth. I could not tell him how I knew about the boat without telling him about the pines, and Jones, and my mother's gate.</p>\n<p class=\"tape\">So I said nothing. I let him think what he liked. I lay on a straw tick in a room with nine other men for three days and three nights, and I thought about rope.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">On the morning of the twenty-seventh, the newspapers came in.</p>\n<p class=\"tape\">We were not supposed to have them. A guard sold them for a quarter, and a man by the window read them out loud to the rest of us, in a low voice, while we sat on the floor and listened.</p>\n<p class=\"tape\">Booth was dead.</p>\n<p class=\"tape\">The cavalry had found him in Virginia, the paper said, a long way south of the river, on a farm near a place called Port Royal, hiding in a tobacco barn. A farmer named Garrett had taken him in, thinking he was a wounded Confederate soldier going home. In the small hours of the twenty-sixth, the soldiers had surrounded the barn and called on him to come out. Herold had come out and surrendered. Booth would not. So they set the barn on fire. And while it burned, a sergeant had fired his pistol through a crack between the boards and shot him through the neck, against orders, and they had dragged him out of the flames onto the porch of the farmhouse, alive, paralyzed, and he had lived a few hours more.</p>\n<p class=\"tape\">The man by the window read out what Booth had said at the end. That he had asked them to tell his mother he died for his country. And that near the end, when they lifted his hands so that he could see them, he had looked at them and said, <em>Useless. Useless.</em></p>\n<p class=\"tape\">Nobody in that room said anything for a long time.</p>\n<p class=\"tape\">I sat on the floor with my back against the wall and thought about the cavalry that had found him. The paper said they had gone down the river by steamer on the twenty-fourth, acting on information. It did not say what information. It did not need to. I knew what I had said in a hotel yard in Port Tobacco on Sunday afternoon, and I knew what day the steamer had sailed.</p>\n<p class=\"tape\">He had been going to be caught. I had known that at the edge of the pines. But I had sent them after him, in the end, with a story about a fishing trip, and they had gone, and they had found him, and he had died on a porch in Virginia looking at his hands.</p>\n<p class=\"tape\">I would like to tell you I felt something clean. I did not. I felt tired, and sick, and I thought of him on the church step in Charles County, playing a whole theater fire for his mother, and I thought of the President getting down from his carriage outside Ford's, tired, standing a moment on the pavement before he went in. And I found I could not tell which of them I was grieving for. That frightened me more than the rope.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The colonel sent for me again on the afternoon of the twenty-eighth.</p>\n<p class=\"tape\">He had a letter on his desk. He did not show it to me. He kept his hand flat on it while he talked, the way you keep a hand on a thing that might blow away.</p>\n<p class=\"tape\">\"This came to the War Department on Tuesday,\" he said. \"Unsigned. It concerns you. I'll tell you what it says, and you'll tell me whether any of it's true.\"</p>\n<p class=\"tape\">The letter said that the lame young man the Kirkwood clerk had described, the one the detectives were already hunting, had been seated in the dress circle of Ford's Theatre on the night of the fourteenth, from half past eight, nearest the door to the President's box. That at about twenty-five minutes to ten he had been handed a note by a man in a hotel waiter's jacket, and had got up and left the theater at once. That the usher at the head of the dress circle stairs would remember it, because the lame man had nearly fallen on the stairs going down. That he had gone to the Kirkwood House, and spoken to a German drinking at the bar, and that the German had left the hotel immediately afterward without going upstairs; and that the bartender would remember that too.</p>\n<p class=\"tape\">\"We found the usher,\" the colonel said. \"He remembers the stairs. We found the bartender. He says a lame man leaned on the bar next to Atzerodt and told him to go home. He heard that much. Go home. And Atzerodt put his money down and went.\" He looked at me. \"So you left Ford's forty minutes before the President was shot. And you went to the Kirkwood, where the Vice President was asleep upstairs, and you sent home the man who was supposed to kill him.\"</p>\n<p class=\"tape\">I said nothing.</p>\n<p class=\"tape\">\"And on Sunday you told Major O'Beirne's man that the murderer had crossed into Virginia. Which he had.\"</p>\n<p class=\"tape\">I said nothing.</p>\n<p class=\"tape\">The colonel sat back. He was a tired man, and a careful one, and I think he had been a lawyer before the war, and would be one after.</p>\n<p class=\"tape\">\"I don't know what you are, Mr. Hurley,\" he said. \"I don't believe that's your name, and I don't believe you went fishing. But I know what you did on Friday night, because somebody took the trouble to tell me. Unsigned, in the finest hand that has come across this desk all month, and I've had senators' letters on it. An educated man. Somebody who was in that theater himself, I'd guess, and has a name he'd rather keep out of all this. Half the men in that house on Friday were somebody. But every word of it checked.\" He tapped the letter with one finger. \"Whatever you were before that, I've got a building full of men who did less than you did that night and deserve the rope more. Go home.\"</p>\n<p class=\"tape\">I asked him who had sent it. He said he did not know, and I believed him.</p>\n<p class=\"tape\">I walked out of the Old Capitol Prison into the afternoon, across from the great white dome of the Capitol, and stood on the pavement, and thought about the finest hand the colonel had ever seen. He had pictured a gentleman with a name to protect. It would never once have crossed his mind that it belonged to a hotel waiter. It had crossed mine at a desk in the Kirkwood House, with the clock over it saying eight minutes past ten. And I thought about a man in a white jacket who had stood by the door in the dress circle and watched me go down the stairs, and had seen me nearly fall. He had sent me to the Kirkwood. He would have wanted to know what I did there. He must have gone and asked the bartender himself.</p>\n<p class=\"tape\">I thought I knew. I have thought about it every year since, and I have never once been certain.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>\"He saved your life,\" I said. \"If it was him.\"</p>\n<p>\"If it was him.\" He was looking at the window. \"It would have been easier for him not to. Much easier. A Black man writing to the War Department that month, about the assassination, about a white man he'd sent out of a theater with a false message: that was not a safe letter to write. He must have known the handwriting could be traced. He wrote it anyway.\" He was quiet for a moment. \"And he never signed it. So I would never have to owe him anything.\"</p>\n<p>I looked down at my notebook. After a moment I said, not quite to him, \"At least somebody wrote something down.\"</p>\n<p>\"Hm?\"</p>\n<p>\"Nothing. It's just.\" I turned a page back and forth. \"They had a file on you. Two pages, and a letter, but a file. Bookbinder kept copies of everything. That was the whole point of him. Two banker's boxes of paper, in his apartment, in the closet by the door. I saw them the one time I was there. Everything he'd ever copied at Carrow, every invoice, every letter he'd been asked to repair.\" I shook my head. \"There's nothing about them in the police report. Not a word. <em>Desk.</em> That's all it says. A desk.\" I closed the notebook. \"I always figured he took them with him.\"</p>\n<p>He did not say anything. He looked at me for a moment, very still, the way a man listens for one wrong note, and then he looked at the floor by my chair, as if the box of <em>CARROW</em> I had not brought were sitting there, and then back at the window.</p>\n<p>\"Next week,\" he said, \"the trial.\"</p>", "audio": false, "added": 1790601727134, "pt": [1790694240640, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790790377268, 1790810120185, 1790810120185, 1790810120185, 1790810120185, 1790810120185, 1790790390581, 1790601727134, 1790601727134, 1790601727134, 1790791624596, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790863360036, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790604858193, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790791624596, 1790601727134, 1790601727134, 1790601727134, 1790604858193, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790791624596, 1790861984290, 1790791624596, 1790861984290, 1790784418993, 1790694240640, 1790601727134, 1790694240640, 1790601727134, 1790694240640, 1790694240640, 1790601727134]}, {"num": 28, "title": "The Arsenal", "extra": false, "html": "<p>\"You've read about her,\" he said. \"Since I told you her name.\"</p>\n<p>\"Everything I could find.\"</p>\n<p>\"Then you know what she's famous for. Being the first.\" He looked at the fire. \"I want to tell you what she was to me. It isn't the same.\"</p>\n<p>It was the fifteenth visit. The payment for the last session had come on Monday, double again, with the same note, and I had stopped being surprised by it and started being uneasy. I had not said so to him. I thought he knew.</p>\n<p>Before we started, because he asked, I told him the school business was dragging on. Mr. Ostrowski had called both girls in on Monday and laid the two write-ups side by side on his desk, and Freda said you could hardly tell them apart, they even had the same weird numbers in the tables, and then Freda had cried in the car, which she never did. He listened, and nodded, and asked whether the gutter people had paid yet.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>May and June, 1865</em></p>\n<p class=\"tape\">I did not go home when they let me out. I could not face my mother yet, or Lottie, with everything I could not tell them. I went back to the lumber merchant on the waterfront, in my blue coat. I told him my name was Hurley now. He looked at me for a long moment and gave me my old stool back and called me Hurley from then on, and did not ask why. A great many people in Washington did not ask each other things that spring.</p>\n<p class=\"tape\">The trial began in May, at the Arsenal, down at the point where the Eastern Branch meets the Potomac, in the old penitentiary there. Not in a courtroom. The government would not risk a jury, not in a city where half the jurors might be Marylanders. It was a military commission: nine officers at a long table, generals and colonels, deciding in a room on the third floor of a prison. There were eight people accused. Mrs. Surratt was the only woman.</p>\n<p class=\"tape\">They let the public in, by pass. The newspapers printed every word of the testimony the next morning, pages of it, in small type. I read every page. And some days, when I could get a pass from a man at the lumber yard whose brother was a clerk at the War Department, I went.</p>\n<p class=\"tape\">I went the day Weichmann testified.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">They sat the prisoners on a raised platform along one wall, in a row, with a soldier between each of them. The men wore irons on their wrists and ankles, and heavy chains between. Mrs. Surratt sat at the end, in black, with a veil over her face and a fan in her hand, and she did not wear irons. She hardly moved.</p>\n<p class=\"tape\">I sat at the back among the spectators in my blue coat, and I watched Louis Weichmann walk to the witness chair.</p>\n<p class=\"tape\">He had not changed. Plump, soft-spoken, polite. He had gone to the police himself, I learned later, within a day or two of the murder, and told them everything he knew, and they had kept him close ever since. He did not look at the prisoners. He looked at the commission, and he answered their questions for hours, in his careful clerk's voice, and he remembered everything.</p>\n<p class=\"tape\">He remembered every visit Booth had made to the house on H Street. He remembered Atzerodt, and the bottles, and Powell as Wood and Powell as the Reverend Paine. He remembered driving Mrs. Surratt to her tavern on the afternoon of the fourteenth, and the package she carried, done up in paper, and Booth talking with her before they left. He remembered it all, in order, with dates.</p>\n<p class=\"tape\">I sat at the back and listened to him, and remembered the first night I saw him, reading by the lamp in the parlor on H Street, and what I had told Booth about him afterward, under a streetlamp: <em>if this ever goes wrong, that one will talk.</em> Booth had laughed and called him harmless. I had kept my name out of his hearing from that night on. It was not much protection. He had seen my face across that parlor, and my cane, and he remembered everything.</p>\n<p class=\"tape\">So I waited. Every time he came to a new day, I waited for him to say <em>and a lame young man who came with Booth.</em> He did not mention me. Not once, in all those hours. I have never known why. I have had a very long time to wonder, and I still do not know.</p>\n<p class=\"tape\">I had been right that he would talk, and something in him I never understood had saved my neck. And I sat there and watched that careful memory of his tie a rope, one date at a time, around the neck of the woman who had given him a room and fed him at her table all winter. I did not feel lucky. I did not feel anything I have a good word for.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">John Lloyd testified too, the man who had leased her tavern. He was the worst of it, for her. He said that in March, John Surratt and Herold and Atzerodt had brought two carbines to the tavern and hidden them in the ceiling. He said that on the afternoon of the fourteenth, Mrs. Surratt had come to the tavern and handed him a package, and told him to have the shooting irons ready that night, because they would be called for. And that at midnight Booth and Herold had come, and he had given them the whiskey, and the carbine, and the package, which was a pair of field glasses.</p>\n<p class=\"tape\">And the officers who had arrested her testified that on the night of the seventeenth, while they were in her parlor taking her away, a knock had come at the door, near midnight, and it was Powell. Filthy, with a pickaxe on his shoulder, saying he had come to dig a gutter. And that when they asked her whether she knew him, she had raised her hand and said, <em>Before God, sir, I do not know this man.</em></p>\n<p class=\"tape\">He had eaten at her table, as the Reverend Paine, for days.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I spent that spring doing what I always do. I took the thing apart, piece by piece, and looked at each piece.</p>\n<p class=\"tape\">The kidnapping: she knew. I was sure of that before the trial began, and nothing in it changed my mind. She had watched the men come and go in her house all winter. She had heard John talk, and John could never keep a secret he could boast of. She knew about the carbines in March, the ones hidden in her own ceiling; they were bought for the kidnapping, to hold off pursuit on the road south. She had known and said nothing, the way she said nothing about anything she did not want to know.</p>\n<p class=\"tape\">The murder: I did not believe she knew. And I had one thing, in all that trial, that nobody on that commission had.</p>\n<p class=\"tape\">I had stood on the corner of H Street at half past two on the fourteenth and watched Booth go into the house, and come out again, and go. And then I had watched her come out with that package, after his visit, and put it in the buggy without looking at it. Without opening it, or weighing it in her hand, or turning it over to see what it was. She had carried it the way she carried everything for the men in her house: as an errand, to be done and not asked about.</p>\n<p class=\"tape\">A woman who knows she is carrying the field glasses for a murderer's escape looks at the package. She cannot help it. I have watched a great many people carry things they knew to be terrible, and they all look. They hold it as if it were hot. She had held it like a loaf of bread.</p>\n<p class=\"tape\">And the words she gave Lloyd, <em>have the shooting irons ready:</em> those were the words of the kidnapping. Those guns had been waiting in that ceiling for a month, for the road south with the President in a carriage. She had passed the message on, as she passed on everything. I did not think she had asked what they would be used for now. I did not think she had wanted to know.</p>\n<p class=\"tape\">And Powell at the door: she had lied. Of course she had lied. She had known him for weeks. But a woman with soldiers in her parlor, at midnight, being taken from her own house, who sees a filthy man with a pickaxe on her step and says <em>I do not know him,</em> is a frightened woman lying about a boarder. That is not the same as knowing he had spent Friday night stabbing the Secretary of State in his bed.</p>\n<p class=\"tape\">All of the kidnapping. None of the murder. That was my answer, and I have never changed it.</p>\n<p class=\"tape\">It was the same line I had walked. I had known all of the kidnapping too. I had drawn them the road. The only difference between us was that I had got out on the eleventh of April, on a lawn, in the candlelight, when Booth said <em>the last speech he will ever make,</em> and she had not been standing there to hear it.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The commission gave its verdict at the end of June. It was kept secret for a week.</p>\n<p class=\"tape\">On the sixth of July, the newspapers said it. Four of them to hang: Powell, Herold, Atzerodt, and Mary Surratt. The others to prison. The hangings were set for the next day. One day's notice.</p>\n<p class=\"tape\">Years later it came out that five of the nine officers who tried her had signed a letter asking the President to spare her, because of her age and because she was a woman. He said he had never seen it. The judge advocate said he had shown it to him. People have argued about that ever since.</p>\n<p class=\"tape\">And a story went around, in those days, secondhand: that the President had said of her that she kept the nest that hatched the egg. I do not know if he said it. I heard it from a man at the lumber yard who had heard it from someone. But I remember thinking, when I heard it, that it was the truest thing anyone said about her that summer, and that it was not a reason to hang her.</p>\n<p class=\"tape\">I had kept the nest too. I had drawn it on my mother's tobacco receipts.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">That night, the sixth of July, I sat at my table in a rented room on the waterfront and did the only thing I could think of. I wrote a letter.</p>\n<p class=\"tape\">I wrote it to the President. I wrote that I had been present in Washington in April and had reason to know that Mrs. Surratt had known of a plan to seize President Lincoln, but not of any plan to kill him; that on the afternoon of the fourteenth she had carried a package from Booth without looking at it, as a woman carries an errand she does not understand; that her crime was silence, not murder, and that silence was the crime of half of Maryland that winter. I wrote it as clearly and as plainly as I could. I wrote it three times, until every word was right.</p>\n<p class=\"tape\">I did not sign it. I could not sign it. To sign it was to put my own neck beside hers.</p>\n<p class=\"tape\">I walked it up the Avenue to the President's house at midnight, holding it inside my coat, and gave it to the doorkeeper, who took it without looking at me and put it on a pile with the others. There was a pile. It was a big one. Half of Washington was writing to the President that night.</p>\n<p class=\"tape\">I walked home down the Avenue. And somewhere around Seventh Street, I stopped, in the dark, and stood still for a long time.</p>\n<p class=\"tape\">A man writing a letter at midnight, three times over, until every word was right. Not signing it. Walking it out into the night toward the President's house.</p>\n<p class=\"tape\">I had seen that before. In the dining room of the National, on the thirteenth of April, by one lamp. I had thought it was a love letter.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. His hand had gone still on the notepad.</p>\n<p>\"Damon,\" I said. \"The night before. He was writing to Lincoln.\"</p>\n<p>\"I think so. I've thought so ever since that night on Seventh Street.\" He looked down at his hand, and moved it off the page. \"I never knew for certain. I never saw it. He never told me. But I think that man sat up writing a warning to the President of the United States, in the best hand in Washington, and walked it to the door himself. And they put it on a pile.\" He was quiet a moment. \"Like mine.\"</p>\n<p>\"Did yours do anything?\"</p>\n<p>\"She was hanged the next afternoon,\" he said. \"At the Arsenal. At half past one.\" He picked up his pencil again. \"I was there. That's next week. I'd like to stop.\"</p>\n<p>I turned off the recorders myself, before he asked me to.</p>", "audio": false, "added": 1790602030627, "pt": [1790602030627, 1790602030627, 1790602030627, 1790857526860, 1790694240640, 1790602030627, 1790604858193, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790830034990, 1790830034990, 1790830034990, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790604858193, 1790861984290, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790604858193, 1790861984290, 1790602030627, 1790604858193, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790604858193, 1790602030627, 1790604858193, 1790694240640, 1790604858193, 1790602030627, 1790602030627, 1790694240640]}, {"num": 29, "title": "July the Seventh", "extra": false, "html": "<p>He was sitting on the porch when I drove up, in his coat, in the cold, the way he had been the week of the Kirkwood. He did not get up. When I came up the steps he moved over on the bench to make room, and I sat down beside him, and for a while neither of us said anything. Our breath went up white.</p>\n<p>\"I'd like to tell this one out here,\" he said. \"If you don't mind the cold. It was very hot that day. I find I don't want to be warm while I tell it.\"</p>\n<p>I put the phone on the bench between us and turned it on, and did not bother with the other recorder.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>July 7, 1865</em></p>\n<p class=\"tape\">It was a terrible day for heat. People said afterward it had been a hundred degrees in the sun, and I believe it. The air in the Arsenal yard sat on you like a hand.</p>\n<p class=\"tape\">I had a pass. The man at the lumber yard whose brother was a clerk had got me one, and he had not asked me why I wanted it, and I did not tell him. There were a great many passes. The yard was full of people by noon: soldiers, mostly, lined up along the walls in the heat, and officers, and newspapermen, and a few others like me, standing in whatever shade there was. Some men had climbed onto the prison wall to see better. A photographer had set up his camera on a roof across the yard, with his black cloth over his head, waiting.</p>\n<p class=\"tape\">In the middle of the yard was the scaffold. It was new. You could smell the fresh-cut pine from where I stood. It had been built the day before, and they had tried the traps that morning with weights, and the sound of them dropping had carried all over the Arsenal. Beside it, in the dirt, four graves had been dug, and four plain pine boxes laid beside the graves.</p>\n<p class=\"tape\">Men had been trying all morning to stop it. I learned that later. Her lawyers had got a judge to order her brought before him, and the order had been carried to the Arsenal gate, and the President had set it aside. Her daughter, Anna, had gone to the President's house that morning to beg for her mother's life, and had not been let in to see him. She had sat on the stairs and wept, people said. Nobody who could have stopped it would see anyone.</p>\n<p class=\"tape\">And my letter was somewhere on a pile.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">At a little after one o'clock, a door in the prison wall opened, and they brought them out.</p>\n<p class=\"tape\">Mrs. Surratt came first. She could hardly walk. Two soldiers held her up, one on each side, and two priests walked with her, praying, and she was in black, with a veil. Someone was holding an umbrella over her head against the sun. It was the only kindness I saw that day: shade, for a woman who had half an hour to live.</p>\n<p class=\"tape\">Then Herold, looking about him the way he always had, like a boy at a fair, with his face gone white. Then Powell, tall and straight and perfectly calm, in a sailor's shirt, looking out over all of us as if we were not there. Then Atzerodt, in a gray coat, shaking so that you could see it across the yard.</p>\n<p class=\"tape\">They went up the steps. They sat in four chairs at the edge of the platform, with the umbrellas held over them, while an officer read out the orders in the heat, at length, and the ministers prayed, at length. It took a long time. The soldiers along the walls shifted in the sun. Somewhere a man fainted and was carried away.</p>\n<p class=\"tape\">I did not look away. I had decided that, on the walk down to the Arsenal. I owed her that much. I did not look away once.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I will not tell you all of it. You can read it. It is all written down, and there are the photographs, from the camera on the roof: the four of them in their chairs under the umbrellas, and then standing, and then the other one. You have probably seen them. Everyone has.</p>\n<p class=\"tape\">I will tell you two things.</p>\n<p class=\"tape\">The first is that Atzerodt spoke at the end, standing on the trap with the rope around his neck, in his thick German voice, which shook. He said goodbye, and that he hoped we would all meet in another world. I thought of him at the bar in the Kirkwood House, looking at me in the mirror with that terrible hope in his face, and putting his money down, and going out without once looking at the stairs. He had never gone up to the Vice President's door. He had never touched him. He had gone home, the way I told him to, and they had hanged him anyway, for the room upstairs and the knife in it and the questions he had asked the bartender. For what he had been ready to do, and had not done.</p>\n<p class=\"tape\">I had given him leave to fail. It had not been enough.</p>\n<p class=\"tape\">The second is that the traps fell at half past one, and it was very quick, and the sound of it was the same sound the weights had made that morning, and I heard it all over the Arsenal, and I have heard it ever since.</p>\n<p class=\"tape\">Then it was very quiet in the yard, in the heat, for a long time.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I went home to Charles County the next week.</p>\n<p class=\"tape\">I told the lumber merchant I was going, and he shook my hand and said, <em>Good luck to you, Hurley,</em> and I said <em>good luck</em> back, and never saw him again. I burned the blue coat in the stove at the lumber yard, the way I had burned the receipts. I walked out over the Navy Yard Bridge in a farm coat I had bought for the purpose, and the sentry did not look at me. The war was over. Nobody stopped the ones going home anymore.</p>\n<p class=\"tape\">My mother was on the porch when I came up the lane. Lottie was in the hayloft; I saw her face at the little window before she came running. The tobacco was in. It had been planted in May without me, by my mother and Lottie and old Hester and two men they had hired from Bryantown for wages, and it was coming on well.</p>\n<p class=\"tape\">My mother held my face in her hands. She did not ask me where I had been. She never did, not once, for the rest of her life.</p>\n<p class=\"tape\">\"You're home,\" she said.</p>\n<p class=\"tape\">\"I'm home,\" I said.</p>\n<p class=\"tape\">It was true, as far as it went. It was the only home that body ever had, and I stayed in it to the end. I always do. I don't get to choose when I leave. One day I wake up somewhere else, in someone else, and sometimes I remember how the last one ended, and sometimes I don't.</p>\n<p class=\"break\">&#10043;</p>\n<p>He was quiet then.</p>\n<p>I sat beside him on the cold bench and looked out at the field. The frost had gone off it in the sun, and it was brown and bare, and a hawk was going round and round over the far end of it, very high.</p>\n<p>\"That's the end,\" I said. \"Of 1865.\"</p>\n<p>\"That's the end of 1865.\"</p>\n<p>I reached down and turned off the phone. I did not know what I was supposed to say. In all my years of interviews I had never once not known what to say at the end of one.</p>\n<p>\"Thank you,\" I said at last. \"For telling me.\"</p>\n<p>He looked at me, surprised, as if nobody had ever said that to him before.</p>\n<p>\"Thank you for listening to it,\" he said. \"I don't think anyone ever has. Not all of it. Not in order.\" He looked back at the hawk. \"It turns out it's heavier in order.\"</p>\n<p>We sat on the porch until I was too cold to feel my hands. Then he stood up, slowly, one hand on the rail, and said he supposed I would want my lunch, and we went in.</p>", "audio": false, "added": 1790602314555, "pt": [1790694240640, 1790602314555, 1790694240640, 1790602314555, 1790604858193, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790604858193, 1790604858193, 1790602314555, 1790861984290, 1790602314555, 1790602314555, 1790604858193, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790604858193, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790806623051, 1790602314555, 1790694240640, 1790694240640, 1790602314555, 1790694240640, 1790694240640, 1790861984290, 1790602314555, 1790694240640]}, {"num": 30, "title": "The Scale", "extra": false, "html": "<p>It was a strange lunch. It was the first one in sixteen visits that was not in the middle of anything. 1865 was over. I did not know quite what we were supposed to talk about now, and I do not think he did either, and so, for a while, we did not talk at all. He made grilled cheese, because the soup had run out, and apologized for it, and I said it was the best thing I had eaten all week, which was true.</p>\n<p>Then, halfway through the second half of my sandwich, he said, \"Your man didn't take his files.\"</p>\n<p>I put the sandwich down.</p>\n<p>\"Bookbinder,\" he said. \"You told me two things. Weeks apart. You told me that the police found his family photographs still on the living room wall. And two weeks ago you told me that he kept two boxes of papers in the closet by the door, and that the police found no papers at all.\" He wiped his fingers on a napkin, carefully, one at a time. \"You said you always figured he took them with him.\"</p>\n<p>\"He must have.\"</p>\n<p>\"A man who runs,\" he said, \"and has time to pack, takes his photographs first and his papers if he can carry them. He doesn't leave his mother's face on the wall and his cat shut in a bedroom and remember to take two banker's boxes.\" He looked at me. \"Your man left the photographs on the wall and the cat in the bedroom, and the files were gone. That isn't a man packing to run. That's two different people. One of them lived there, and meant to come home. The other one came in after him, and knew exactly what to take.\"</p>\n<p>\"Not after him,\" I said. \"He let them in.\"</p>\n<p>He looked at me.</p>\n<p>\"I called Petrakis. Weeks ago.\" I told him about Pearl, and the door, and the pressing machine. \"He only shut her in when somebody came to the door. Petrakis made him promise, after the second time she got out.\"</p>\n<p>He looked at me for a moment, and I could see he was pleased, and that it was with me and not the news.</p>\n<p>\"You checked,\" he said. \"Good.\" Then it went out of his face. \"Then it's worse than I said. He didn't open that door to a stranger. He put the cat away for somebody he knew.\"</p>\n<p>I sat at his kitchen table with half a sandwich in front of me and six years going over in my head like pages in a wind. The report I had read over and over since I took the box down. <em>Framed family photographs on living room wall. Desk.</em> The closet by the door. The cat.</p>\n<p>Then I heard how certain it sounded, and the part of me that used to do this for a living sat up.</p>\n<p>\"Somebody came to the door,\" I said. \"That's all the cat tells you. He shut her in for anybody. Petrakis said so.\"</p>\n<p>He thought about it. \"Yes,\" he said. \"Fair.\"</p>\n<p>\"And the boxes. The officer wrote down the cat and the dishes and the photographs because they were in front of him. Two boxes in a closet, he could have looked straight at and never written down. That report doesn't prove anything that isn't in it.\"</p>\n<p>\"No,\" he said. \"It doesn't. It's a reason to ask, that's all.\" He picked up the plates. \"But you couldn't see it until you set the boxes down next to the photographs, and you'd never said the two things out loud in the same month until you said them to me. I've wanted to tell you for some time. I didn't know how you'd take it.\"</p>\n<p>\"How am I supposed to take it?\"</p>\n<p>\"The way you take everything,\" he said. \"By checking.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He walked me out to the car at three. The hawk was still over the field, or another one like it.</p>\n<p>I had the door open and one foot in when he said, \"Oh. Tell Freda something for me.\"</p>\n<p>I looked up.</p>\n<p>\"Tell her to ask Mr. Ostrowski to weigh something on her scale.\"</p>\n<p>\"Her scale.\"</p>\n<p>\"At her bench. The one that reads everything two percent heavy.\" He had his hands in his cardigan pockets. \"You told me about it back in the fall, the same day you told me about the bow ties. She had to write an extra paragraph explaining why her whole lab came out wrong.\"</p>\n<p>I did remember. I had told it as a joke. \"What about it?\"</p>\n<p>\"Last week you told me the other girl's write-up had the same weird numbers in it.\"</p>\n<p>\"It does. That's the whole problem. They're the same.\"</p>\n<p>\"The same wrong numbers,\" he said. \"Two percent heavy. Every one.\"</p>\n<p>I stood there with my hand on the car door, and I felt it begin to turn over, the way things did around him, a little before I could see what was underneath.</p>\n<p>\"Nobody else in that room weighed anything on Freda's scale,\" he said. \"Their scales worked. If the other girl had done that lab herself, at her own bench, she'd have got the right answers. She has Freda's wrong ones.\" He lifted one shoulder. \"That doesn't prove who copied whom. It proves where the numbers were weighed. That's enough to make him look again. And I know which way I'd bet.\"</p>\n<p>\"Freda won't say that. She won't say a word against her.\"</p>\n<p>\"No,\" he said. \"You told me that too. She's protecting a friend. Even now, with the friend letting her take the blame.\" He said it gently, as if he liked Freda for it. \"So she doesn't have to say anything against anybody. She only has to ask Mr. Ostrowski to put a weight on her scale, and let the scale do the talking.\"</p>\n<p>I stood there. Weeks of Freda going quiet at the dinner table, and the answer had been sitting in a joke I told him back in the fall.</p>\n<p>\"When did you work this out?\"</p>\n<p>\"Last week, when you said the numbers were the same. Before that it was only a hunch.\" He shrugged a little. \"I wasn't going to hand you a hunch about your daughter.\"</p>\n<p>\"Last week?\" My voice went up. \"Why didn't you say?\"</p>\n<p>He took a moment before answering. \"I had just told you about the Arsenal. I sent you home early because I wasn't fit to think about anything else.\" He looked at me. \"But I should have told you before you left. I'm sorry.\"</p>\n<p>I tried to think of what to say. He waited, but nothing came, and eventually I got into the car. He shut the door for me, and I turned around on the gravel and drove home with the radio off.</p>\n<p>Twice I reached for my phone to call her, then thought better of it. I wanted to be there when I told her, to see her face and hear what she said.</p>\n<p>Somewhere past Frederick, I caught myself saying the words out loud. <em>Ask Mr. Ostrowski to weigh something on your scale.</em> I said them again, the way I used to rehearse the first question of an interview I was afraid of. Nine words, and I kept going over them to make sure I had them right.</p>\n<p class=\"break\">&#10043;</p>\n<p>Freda was at the kitchen table. Every light was on. The phone was face down beside the chemistry book.</p>\n<p>I hung up my coat and put my bag on the chair, but I did not sit down. All the way home I had thought about how to say it, and in the end I just said it.</p>\n<p>\"Ask Mr. Ostrowski to weigh something on your scale.\"</p>\n<p>Freda looked up.</p>\n<p>\"What?\"</p>\n<p>\"Your scale. At your bench. The one that's two percent off.\" I sat down across from her. \"If the other write-up has your numbers in it, it has your wrong numbers. Their scale worked. They'd have gotten it right if they'd done it themselves. You don't have to say anything about anybody. Just ask him to weigh something.\"</p>\n<p>Freda did not move. I watched her face do the thing it did when she was working out a problem, the little frown between her eyebrows that she had had since she was four years old. I watched it get there. Her eyes went to the phone, and away, and back.</p>\n<p>Then Freda put her pencil down very carefully.</p>\n<p>\"How did he know about the scale?\"</p>\n<p>I had not expected that. \"I told him.\"</p>\n<p>\"You told him about my scale.\"</p>\n<p>\"I told him about you,\" I said. \"I tell him about you every week.\" And then, because it was true, and because I was tired of not saying true things in my own kitchen: \"You're my favorite thing to talk about. You always have been.\"</p>\n<p>Freda looked at me for a long moment. Her face did something complicated, and then something simpler.</p>\n<p>\"That's so embarrassing,\" she said. And then she put her head down on her arms on top of the chemistry book, and her shoulders started to shake, and it took me a moment to understand that she was crying, and a moment more to get around the table.</p>\n<p class=\"break\">&#10043;</p>\n<p>It took four days.</p>\n<p>On Monday Freda asked Mr. Ostrowski. On Tuesday, she told me that night, he put a hundred-gram weight on her scale in front of her, and it said a hundred and two, and he looked at her write-up, and at the other one, and at the extra paragraph at the end of hers. The other one had every one of her wrong numbers, and no paragraph at all. He took off his glasses and cleaned them for a long time. He told Freda afterward that he should have checked the scale when he first read her paragraph. On Wednesday he kept Maddie after class, and Maddie told him: she had copied Freda's write-up at our kitchen table, numbers and all, the afternoon she came over to look at the lab, and left off the paragraph at the end. Then she had been too frightened to say so. Freda heard that part from Maddie herself, at lunch, and told me that night with her eyes on her plate. There was a meeting in the vice principal's office that Freda was not in; I knew of it only because the school left a message on my phone. On Thursday morning, before I left for the drive, Maddie's mother called me, and was very quiet on the phone, and apologized for something she did not quite name, and I was kinder to her than I had planned to be.</p>\n<p>When she hung up, I drove north anyway. The client had not said stop, and the money had come on Monday the way it always did, and I told myself that was the reason. It was not. I wanted to tell him.</p>\n<p>He asked about Freda before I had my coat off. I told him all of it, Monday and Tuesday and the weight that said a hundred and two, and he listened with his eyes closed and said \"Good,\" once, at the end. There was no more 1865 to tell, and neither of us pretended there was. We spent the rest of the afternoon splitting kindling behind the house, which he said I had been doing wrong my whole life, and he was right. The recorders stayed in my bag.</p>\n<p>That night I came home, and hung up my coat, and put my bag on the chair.</p>\n<p>Freda was at the kitchen table, doing her chemistry. The phone was beside the book. It was face up. While I watched, it lit up with a message, and Freda glanced at it, and snorted at whatever it said, and typed something back with one thumb, and put it down again. Face up.</p>\n<p>Only the kitchen light was on. The rest of the house was dark.</p>\n<p>I stood in the doorway and looked at my daughter for a long time.</p>\n<p>I had taken the job for the money. I would have said so to anyone. Three thousand dollars a session, for an old man's stories, from a client who knew too much. My plan had been to do my ten sessions and cash the checks and pay off the car and be done with it.</p>\n<p>The ten sessions had been over for seven weeks, and I had not stopped. I had told myself it was the double payments, or the story, or the not being able to leave a thing half finished, which had always been my worst habit.</p>\n<p>Standing in the doorway, I knew that I would go back next Thursday, and the Thursday after that, for as long as he would have me. And that it was not for the money anymore, and not for the story, and not for the client, whoever he was.</p>\n<p>It was for the phone, face up, on my kitchen table.</p>", "audio": false, "added": 1790602818535, "pt": [1790857526860, 1790694240640, 1790694240640, 1790604858193, 1790602818535, 1790694240640, 1790694240640, 1790694240640, 1790805706984, 1790806849147, 1790806849147, 1790694240640, 1790854901238, 1790854901238, 1790854901238, 1790854901238, 1790854901238, 1790602818535, 1790602818535, 1790694240640, 1790805706984, 1790694240640, 1790602818535, 1790805706984, 1790805706984, 1790805706984, 1790805706984, 1790805706984, 1790805706984, 1790805706984, 1790830174013, 1790805706984, 1790807429881, 1790807429881, 1790807429881, 1790807429881, 1790807833909, 1790807833909, 1790861984290, 1790807833909, 1790861984290, 1790602818535, 1790694240640, 1790602818535, 1790602818535, 1790602818535, 1790694240640, 1790694240640, 1790602818535, 1790602818535, 1790694240640, 1790602818535, 1790694240640, 1790694240640, 1790694240640, 1790602818535, 1790863360036, 1790861708675, 1790806282680, 1790805706984, 1790694240640, 1790602818535, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790694240640]}, {"num": 31, "title": "The Pile", "extra": false, "html": "<p><em>They put it on a pile. Like mine.</em></p>\n<p>I could not stop thinking about it. Not the hanging, not Atzerodt, not the sleeves, though I thought about all of those. The pile. A waiter writing a warning to the President three times over, until every word was right, and walking it to the door himself, and the doorkeeper putting it on a pile with the others.</p>\n<p>Piles got kept. That was the thing I knew, that he might not. I had spent twenty years in archives and records offices and the back rooms of county courthouses, and I knew that governments almost never threw anything away. They filed it. They filed it badly, and lost it, and forgot it, but they kept it.</p>\n<p>That Thursday night, after Freda was asleep, I took the <em>CARROW</em> box down again and read the police report through with a pencil. <em>Framed family photographs on living room wall. Desk.</em> Nothing about any papers. I sat on the closet floor with it for a long time.</p>\n<p>In the morning I did the two things you do when you have a theory and no proof. I asked the police department for the whole file, not just the report: the officer's notes, any photographs, whatever was behind it. And I found the movers. They were still in business, the same small outfit from across the river, and the woman who answered said they kept their job sheets seven years. I told her what I wanted. Who had booked the job, and when, and whether there was an address to take it to, or a number to call that wasn't his.</p>\n<p>She called back that afternoon. The job had been booked by phone, eleven days before he disappeared, with a deposit in cash. The line for the new address was blank. Under it, somebody had written <em>Customer to call with address.</em></p>\n<p>He never called.</p>\n<p>So the following Monday, when Freda had gone to school with her phone face up in her hand, I drove to the Library of Congress.</p>\n<p class=\"break\">&#10043;</p>\n<p>The Lincoln Papers were easy. That was the first surprise. Almost all of them had been put online years ago, twenty thousand documents, photographed and indexed, letters to Lincoln and from him, every scrap his son had kept. I had sat up the whole of Sunday night scrolling through April of 1865 on my laptop at the kitchen table. There were letters of warning in it. Lincoln had got them by the hundred, all through the war; a friend of his had written, afterward, that Lincoln kept them stuffed in a pigeonhole in his desk and told him he had filed eighty just like them. Some of them were in the papers. Crude, some of them. Some with drawings. None of them in a beautiful hand. None of them dated the thirteenth of April.</p>\n<p>But the papers online were only what Lincoln's son had handed over. His two secretaries, Nicolay and Hay, had spent years afterward writing Lincoln's life, and Nicolay, I found at two in the morning, had kept envelopes of his own: material he had set aside and never used. Notes. Clippings. Private letters. Papers that had come through the President's office in the last days and had never been sorted into anything. They were at the Library of Congress too, in his own collection. Most of that had been put online as well. But not all of it. A few boxes had come in long after the rest, from a relative's estate, and had been catalogued in a single line and never scanned.</p>\n<p>At a quarter to nine I was on the steps of the Madison Building with a new reader card in my wallet, with a photograph that was, if anything, worse than the one from the Archives.</p>\n<p class=\"break\">&#10043;</p>\n<p>The Manuscript Reading Room was quiet in the particular way of rooms where people are handling things that cannot be replaced. Long tables. Green-shaded lamps. A reference librarian with reading glasses on a chain, who listened to what I wanted and looked at me over the glasses for a moment.</p>\n<p>\"Nicolay,\" she said. \"The later addition. Some of that hasn't been out of the stacks in a very long time.\"</p>\n<p>\"How long?\"</p>\n<p>The librarian checked something on her screen. \"That box? Nobody's requested it since before I came here. And I've been here twe
