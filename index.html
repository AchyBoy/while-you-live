n<p>A little after seven, the door at the top of the steps opened, and a man came out. Not one of the great men. A doctor, one of the younger ones, in his shirt, with his coat over his arm. He stood at the top of the steps for a moment in the rain, looking at nothing.</p>\n<p>I saw it, and Damon saw it, at the same moment. I know that, because we said it at the same moment, very low, both of us:</p>\n<p>\"His sleeves.\"</p>\n<p>The doctor's sleeves were rolled down, and buttoned at the wrist. All night, every time a doctor had come to the door, his sleeves had been pushed up to the elbow. You do not roll down your sleeves and button them while there is still anything left to do.</p>\n<p>Damon turned his head and looked at me. And I looked at him. For a moment, one long moment, in the rain, in front of that house, we only looked at each other. Two men who had just noticed the same small thing, in the same second, and said it in the same two words.</p>\n<p>I did not know what to make of it. I have wondered about it since, often. I think he did too.</p>\n<p>Then the word came down the steps, and ran out into the crowd, and went up Tenth Street and down it, the way the news had gone out from the steps of Ford's the morning before, the way a stone goes into a pond. And the bells began. First one church, somewhere up toward the Avenue, and then another, and then all of them, all over the city, in the rain.</p>\n<p>It was twenty-two minutes past seven.</p>\n<p class=\"break\">&#10043;</p>\n<p>Damon took off his hat and held it against his chest. He stood like that for a long time, with the rain on his face.</p>\n<p>Then he put the hat back on, and turned to go.</p>\n<p>\"What will you do?\" I said.</p>\n<p>He stopped. He thought about it, looking back up the street, toward the Avenue, toward everything the man in that house had said out loud four nights before, from a window, in the candlelight.</p>\n<p>\"W-what comes next,\" he said.</p>\n<p>And he walked away up Tenth Street, through the crowd, in the rain, in his thin white jacket, and did not look back. I watched him until I could not see him anymore.</p>\n<p>I did not see him again in that life.</p>", "added": 1790599355195, "pt": [1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195, 1790599355195]}, {"num": 23, "title": "The Tape", "html": "<p>He stopped, and did not start again.</p>\n<p>Iola sat with her pen above the notebook. She had not written anything for a long time; the last thing on the page was <em>the sleeves,</em> and under it a line that trailed off into nothing where her hand had simply stopped. The woodstove had burned down to a red glow. The window had gone blue. She did not know when that had happened.</p>\n<p>He was sitting with his hands flat on his knees, the way he had put them there two hours before, looking at the floor between his feet. He was not crying. She had half expected him to, and would have known what to do if he had. People cried in interviews all the time. You waited, and you did not look away, and you did not touch the recorder.</p>\n<p>He was not crying. He looked like a man who had carried something up a very long flight of stairs and set it down at the top, and did not yet know whether he could stand up again without it.</p>\n<p>She reached over and turned off the recorders. First the phone, then the old one. The two red lights went out.</p>\n<p>She had never once, in her whole career, turned off a recorder before the subject said they were done.</p>\n<p>He looked up at the sound of the click, and saw what she had done, and for a moment something moved in his face that she did not have a word for.</p>\n<p>\"Thank you,\" he said.</p>\n<p class=\"break\">&#10043;</p>\n<p>She stayed another half hour. She did not ask him anything. She made the tea, for the first time, in his kitchen, finding the cups by opening the wrong cupboards first, and brought it to him, and he drank it, and after a while some color came back into his face.</p>\n<p>At the door, in the dark, with her bag over her shoulder and her keys in her hand, she said, \"Are you going to be all right?\"</p>\n<p>It was not a question she had ever asked a source.</p>\n<p>\"I'm always all right,\" he said. \"That's the trouble.\" He tried to smile, and very nearly did. \"Drive carefully. It's late for that road.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>It was nearly eight when she got home.</p>\n<p>The house was lit, every window. She sat in the car for a minute in the driveway, looking at it, before she went in.</p>\n<p>Freda was asleep at the kitchen table, with her head on her arms on top of a chemistry textbook and her pencil still in her hand. Her phone lay face down beside the book. There was a plate by her elbow with a sandwich on it, cut into triangles, with plastic wrap over it, and a sticky note on the plastic wrap that said <em>MOM</em> in capital letters.</p>\n<p>Iola stood in the doorway and looked at her for a long time.</p>\n<p>Then she took the blanket off the back of the couch and put it over Freda's shoulders, carefully, so as not to wake her. Freda stirred and said something that was not a word, and did not wake. Iola sat down across from her and ate the sandwich, in the bright kitchen, with every light in the house on, and did not turn any of them off.</p>\n<p class=\"break\">&#10043;</p>\n<p>She did not sleep that night.</p>\n<p>At eleven she carried Freda up to bed, which she had not done in years and could barely do anymore, and Freda woke enough to say \"you're back\" and \"how was the guy\" and was asleep again before Iola could answer. At midnight she sat down at the kitchen table with her headphones and her laptop and began typing up the transcript, because the lawyers wanted it by Monday and because she did not know what else to do with herself.</p>\n<p>It was very strange, typing it. In the room, she had been inside it. At the kitchen table, with her fingers on the keys, she was outside it again, the way she had always been outside every story, and she could hear it for what it was.</p>\n<p>It was too good.</p>\n<p>That was the thing she kept coming back to, at two in the morning, and at three. Not the facts. The facts were the easy part; she had checked a hundred facts for him by now and they were all right, and none of them proved anything, because anyone could learn facts. It was the rest of it. The seven minutes on the bad leg. The boy on the ground in the alley asking why. The doctor at the top of the steps with his sleeves rolled down. A man standing beside him in a thin white jacket who could not get out the one word that mattered.</p>\n<p>She had interviewed liars. Good ones, some of them. Liars tell a story from the outside. They know how it ends, so they build toward it. They give you the big moments large and clear, the shot, the leap, the famous words, because those are the parts they have read about.</p>\n<p>He had not heard the famous words. He had been in the lobby, with a crowd screaming, and he had not heard them. He had seen the man's face, and it was the happiest he had ever seen it.</p>\n<p>A liar would have heard the words.</p>\n<p>At three, she stopped typing and looked it up. She searched every way she could think of for a doctor rolling down his sleeves on the steps of the Petersen House. For anyone who had noticed it, or written about it. There was nothing. There were a hundred accounts of that morning and none of them mentioned it. It was exactly the kind of detail nobody could check. Like the color of the thread.</p>\n<p>She sat with that for a long time.</p>\n<p>She thought: either he is the best liar I have ever met in my life, or</p>\n<p>She did not finish the sentence. She sat at the kitchen table in the lit house and looked at the words on the screen, and she did not finish it.</p>\n<p class=\"break\">&#10043;</p>\n<p>At four she finished the transcript and read it through once, the way she always had, for typos. When she got to the part about the sleeves she stopped, and read it twice.</p>\n<p><em>I saw it, and Damon saw it, at the same moment. I know that, because we said it at the same moment, very low, both of us: \"His sleeves.\"</em></p>\n<p>She thought about the client, whoever he was, reading this on Monday. Somebody who read carefully. Somebody who had asked about the color of a thread, and the National Hotel, and whether the old man had ever spoken to the waiter again. She wondered what he would make of the sleeves.</p>\n<p>She attached the file to an email to Aldine, Mercer and Voss, and wrote <em>Session 11</em> in the subject line, and sent it.</p>\n<p>Then she sat in the kitchen with every light on until the windows went gray, and it was Friday, and somewhere upstairs Freda's alarm began to go off, and went on going off, the way it did every morning, until Iola went up the stairs to wake her.</p>", "added": 1790599688184, "pt": [1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184, 1790599688184]}, {"num": 24, "title": "The Blue Coat", "html": "<p>The payment for Session 11 landed on Monday afternoon.</p>\n<p>Iola looked at it on her phone in the parking lot of the grocery store, and then looked again, and then sat in the car with the engine off and the groceries getting warm in the back. It was six thousand dollars. Twice the rate. The note on the transfer, instead of the session number, said: <em>Our client asks you to take all the time the gentleman needs.</em></p>\n<p>There was no question with it. There was no email at all.</p>\n<p>She called the number at Aldine, Mercer and Voss that afternoon, the one she had called in the beginning. The same woman answered on the second ring. Iola said there must have been a mistake in the payment. The woman said there was no mistake. Iola asked whether the client had a question for the next session. The woman said the client did not, and that he had asked her to say, if Ms. Barnett called, that he had read the transcript with great attention, and that he was grateful.</p>\n<p>\"Grateful for what?\" Iola said.</p>\n<p>\"He didn't say, Ms. Barnett.\"</p>\n<p>Iola hung up. She sat in the car a while longer.</p>\n<p>In eleven sessions the client had never once said anything about the story itself. He had asked his odd, narrow questions, one at a time, like a man picking a lock. He had never said whether he believed it, or liked it, or what it was for. And now he had read the part where an old man and a waiter said <em>his sleeves</em> in the same breath on a street in 1865, and he had doubled her money, and he was grateful, and he did not have a question anymore.</p>\n<p>She put the car in gear and drove home, and put the groceries away, and did not tell Freda about the money, because she did not know how to explain it.</p>\n<p class=\"break\">&#10043;</p>\n<p>She told him on Thursday. She read him the note from her phone.</p>\n<p>He listened without moving. When she got to <em>take all the time the gentleman needs,</em> he looked at the mantel, at the empty frame with its polished glass, for longer than he had ever looked at it before. His face did not change. But he was quiet for so long that she checked the recorders.</p>\n<p>\"Well,\" he said finally. \"That's kind of him.\"</p>\n<p>\"Is it?\"</p>\n<p>\"I don't know yet.\" He turned back to her, and some of the usual dryness came back into his voice. \"I find I don't know a great many things about your client. I'm not used to that.\" He picked up his pencil. \"The fifteenth of April. Everybody in Washington was looking for someone. I was one of the someones.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 15 to 18, 1865</em></p>\n<p>I did not go home that morning. I walked.</p>\n<p>The city had changed in the hours we had been standing on Tenth Street. The flags from the victory were still up, but somebody had already begun hanging black crepe over them, and by noon the whole of the Avenue was black and white, the bunting of Monday and the mourning of Saturday on the same buildings. The saloons were closed by order. The theaters were closed. Soldiers were everywhere, at every corner, stopping men and asking their names.</p>\n<p>And they were arresting people. Anyone. Everyone. A man who had said something careless about the President in a barbershop. A man who looked like Booth. Every actor in Ford's company, and the stagehands, and the Ford brothers who owned the theater. Anyone who had ever been seen with Booth. Hundreds of them, in those first days, until the jails were full. The ones they thought mattered most were put in irons below decks on ironclad ships in the river.</p>\n<p>I knew, walking through it, that I was one of the people they wanted. I did not yet know how much.</p>\n<p>I found out that afternoon.</p>\n<p>The family I lodged with by the Navy Yard met me at the door. Their faces told me before they said a word. Two men had come that morning, detectives, in plain clothes. They had not asked for me by name. They did not have my name. They had asked whether a young man boarded there who walked with a cane. A young Marylander, lame in one leg. They had a description, the detectives said, from the desk clerk at a hotel, of a lame young man who had come in at ten o'clock on Friday night asking for John Wilkes Booth.</p>\n<p>The family had told them no. They had lied for me, to men from the War Department, the morning after the President was murdered, because my mother's people had hidden their sons in the war. They told me so, standing in the hall. They were shaking.</p>\n<p>\"You have to go,\" the woman of the house said. \"Not for your sake. For ours.\"</p>\n<p>She was right.</p>\n<p class=\"break\">&#10043;</p>\n<p>I sat on the edge of the bed in my narrow room and went through it, one door at a time, the way I always did. I had perhaps an hour.</p>\n<p>What did they have? Not my name. I had kept it out of every mouth that could have given it to them: out of Weichmann's hearing, off Booth's papers. They had a clerk's description. A lame young man, a Maryland voice, a cane, asking for Booth. That was all.</p>\n<p>But it was enough. A lame young man was a thing you could see from across a street. I could not hide the leg. I could not walk ten steps without it announcing me. Every soldier on every corner of Washington was looking for Booth and for a lame young Marylander, and I was the second of those, and I could not stop being him.</p>\n<p>Unless I was someone else who limped.</p>\n<p>Washington in April of 1865 was full of lame young men. That is the thing I saw, sitting there. The hospitals were overflowing. There were thousands of wounded soldiers in that city, on crutches and in slings and on canes, in the streets every day, going to and from the hospitals and the pension offices and the railroad depots. Union soldiers. Nobody looked at them twice. Nobody could. There were too many of them.</p>\n<p>A lame young man in a Confederate farm boy's coat, asking after Booth, was a suspect.</p>\n<p>A lame young man in Union blue was furniture.</p>\n<p>I went down to the rag shops on Seventh Street, where the soldiers sold what they did not need and the dealers sold it on to the next soldier, and for two dollars I bought an army coat that had belonged to somebody bigger than me, faded, with a darned place at the elbow. I looked at the darn for a long moment in the shop. It had been mended with the right thread. I bought a forage cap to go with it. I left my own coat in the shop in part payment, and the man did not ask me why, and I did not tell him.</p>\n<p>And I walked out onto Seventh Street in the uniform of the army that had shot me, with my cane, into a city full of soldiers looking for a lame young man, and not one of them looked at me.</p>\n<p class=\"break\">&#10043;</p>\n<p>I did not leave the city that day. I could not. The bridges were closed, all of them, and the roads out were stopped by cavalry, and every boat on the river was being searched. And there was something I had to know first.</p>\n<p>I had to know where Booth was going.</p>\n<p>I knew that he had crossed the Navy Yard Bridge. Everyone knew it by the next day; the sentry, a sergeant, told the officers who questioned him that a man on a bay horse had come across late that night and given his name, and said he was going home, into Maryland, and that he had let him through. And another man, a little after, on another horse. He had let him through too.</p>\n<p>A man going south, who says he is going home. I had written that down, on the back of an invoice, in March. They let him go.</p>\n<p>So he was in Maryland. On my road. And there was one house on that road that he knew as well as any house in the world, because I had drawn the lane to it for him, at Christmas, on the back of my mother's tobacco receipts, in her kitchen.</p>\n<p>I sat in the blue coat in a saloon doorway on Seventh Street, with the city going past me in its black crepe, and understood that John Wilkes Booth, with half the Union army behind him, might at that moment be riding up the lane to my mother's door.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>\"You went home,\" Iola said. It was not a question.</p>\n<p>\"I went home.\" He turned the pencil in his fingers. \"Getting out of Washington that week is a story by itself. I'll tell you next time. I'm going to tell you how I found him, Ms. Barnett. Booth. I knew where he was going before the army did. That was the one thing that week I got right.\" He looked at her. \"It didn't make any difference to him, in the end.\" He put the pencil down. \"Next week.\"</p>\n<p>She wrote <em>Seventh Street, rag shops, blue coat,</em> and then, underneath, because she could not help it, <em>the right thread.</em></p>", "added": 1790599838901, "pt": [1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901, 1790599838901]}, {"num": 25, "title": "The Gate", "html": "<p>On the thirteenth Thursday there was frost on the field for the first time, and the woodstove was already going hard when she came in. He had put a second blanket over the back of her chair. He did not mention it, and neither did she.</p>\n<p>\"Getting out of Washington,\" she said, when the recorders were on. \"You said it was a story by itself.\"</p>\n<p>\"It was a very short story, in the end,\" he said. \"The army took me.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 16 and 17, 1865</em></p>\n<p>By Sunday morning half the Union army seemed to be going into Southern Maryland. That was where everyone believed Booth had gone, and everyone was right. Cavalry went down the roads in columns, and infantry after them, and wagons after the infantry, carrying feed and rations and tents for the men who would be searching the swamps. The roads south were closed to everyone. Everyone but the army.</p>\n<p>I stood at the edge of a wagon yard near the Navy Yard, in my faded blue coat and my forage cap, with my cane, and watched the teamsters loading up for Bryantown.</p>\n<p>It is a strange thing, but true, that nobody on this earth is less questioned than a wounded soldier who looks tired. I limped up to the last wagon in the line and asked the teamster, in the flattest voice I could make, whether he was going down past Bryantown, because I'd been given leave to go home and my people were down that way, and I'd walked as far as I could on this leg. He looked at the leg. He looked at the coat. He jerked his head at the back of the wagon, and I climbed up among the sacks of oats, and we went out over the bridge that afternoon in a long column of wagons with cavalry on both sides of us, and nobody looked into the back of that wagon once.</p>\n<p>I had left Washington in July under a load of potatoes. I came back into Charles County in April under a load of oats. I thought about that, lying there. I did not think it was funny yet.</p>\n<p class=\"break\">&#10043;</p>\n<p>The teamster put me down at a crossroads a mile short of Bryantown, and I walked the rest of the way home across the fields.</p>\n<p>Bryantown was full of soldiers. I could see their tents from the ridge, and their horses in the fields, and smoke from their fires. They had come in on Saturday, the day after, a detachment of cavalry, and taken over the village. The tavern was their headquarters. Every farm for miles was being searched.</p>\n<p>Ours had been searched on Sunday morning. I learned that on the porch, from my mother, before she had even let go of me. Soldiers had come, an officer and six men, and gone through the house and the barn and the empty cabins, politely enough, and asked whether any strangers had come by, and gone away.</p>\n<p>\"They didn't ask about you,\" she said. \"Not your name. Nobody's asked your name.\" She held my face in both her hands again, the way she had in the ditch. \"Kit, what are you wearing?\"</p>\n<p>\"A coat,\" I said. \"I'll tell you.\"</p>\n<p>I never did.</p>\n<p>She did not ask me anything else. She had her own grief that week, and it was not the President. The schoolmaster's letter about Ned had come to her first, before she sent it on to me, and she had read it on the porch and folded it up and put it in her apron pocket with the others. I could see the corner of it. She had not taken it out since.</p>\n<p class=\"break\">&#10043;</p>\n<p>It was Lottie who told me about the gate.</p>\n<p>She found me in the barn that evening, where I had gone to be alone, and she sat down on a hay bale across from me with her arms around her knees, the way she had sat when she brought me newspapers in the summer. She was fifteen now. She had grown up in the winter, the way girls do, all at once. She looked at the blue coat and did not ask about it either.</p>\n<p>\"Somebody came to the gate,\" she said. \"Saturday night.\"</p>\n<p>I kept my face still.</p>\n<p>\"I was in the hayloft,\" she said. \"Reading. I wasn't supposed to be. It was nearly dark. And two men came up the lane on horses, slowly, from the Bryantown road. They didn't come to the house. They stopped at the gate.\" She looked at me. \"One of them got down to open it. And he fell.\"</p>\n<p>\"Fell.\"</p>\n<p>\"Fell down. When his foot touched the ground. Like his leg had gone out from under him. And the other one got down and helped him up, and he stood there holding onto the gate. Holding onto it like it was all that was holding him up.\" She was quiet a moment. \"And they looked at the house for a long time. Mama had the lamp lit in the kitchen. And then the one who fell said something to the other one, and the other one got him back up on his horse, and they went away. Not back to the road. Down across the field. Toward the swamp.\"</p>\n<p>\"What time?\"</p>\n<p>\"After dark. Seven, maybe.\" She had thought about it; I could see it in her face. She had been thinking about it for two days. \"I didn't tell Mama. I didn't tell the soldiers either. When they came on Sunday and asked if we'd seen any strangers.\" She looked at me steadily. \"I don't know why I didn't.\"</p>\n<p>\"I do,\" I said.</p>\n<p>She waited.</p>\n<p>\"You didn't tell them because you'd already guessed who it was,\" I said. \"Didn't you.\"</p>\n<p>Lottie's face crumpled. She had been holding it together for two days, alone, fifteen years old, with a secret like that. She put her face down on her knees.</p>\n<p>\"He was so nice to me,\" she said into her knees. \"He said I was a reader. He said I had ink on my finger.\" And she cried, and I sat beside her on the hay bale in the dark barn and held her, and did not say anything, because there was nothing true I could say that would help.</p>\n<p class=\"break\">&#10043;</p>\n<p>When she had gone in, I sat alone in the barn and put it together.</p>\n<p>A man who fell when his foot touched the ground. I had watched Booth come down onto the stage of Ford's Theatre on one knee, and get up, and run into the wings, limping. Something had happened to that leg. Two men on horses, riding slowly. On Saturday evening, in the last light, coming up our lane from the direction of Bryantown and the doctor's house on the other side of it.</p>\n<p>He had come to our gate. He knew the lane. I had drawn it for him.</p>\n<p>And then he had stood at the gate holding onto it, and looked at my mother's lamp in the kitchen window, and not come in.</p>\n<p>I have wondered about that for a hundred and sixty years. I would like to believe it was the one decent thing he did that week: that he stood at the gate of a family that had been kind to him and understood what it would cost them to take him in, with the army an hour behind, and turned away to spare them. I would like to believe it. I have known men do that. It is possible.</p>\n<p>It is more likely that he stood at the gate and saw, from there, what I had seen from the ridge that afternoon: the fires of a cavalry regiment in the fields around Bryantown, a mile away, and understood that the lane he had studied at Christmas now led straight into the arms of the Union army. And turned his horse toward the swamp, because the swamp was the one place in Charles County the cavalry could not ride.</p>\n<p>I don't know which. I never will. Most of what I know about John Wilkes Booth is like that.</p>\n<p>But I knew where he was going.</p>\n<p>The swamp was not a hiding place. The Zekiah was miles long, and wet, and a man with a broken leg could not live in it. It was a road. It ran south, in the dark, all the way to the river country, to the big farms along the Potomac where the landings were and the men who had rowed people across all through the war. And the man who ran those crossings, everyone in the county knew, was a quiet fisherman down by the river named Thomas Jones. He had put more Confederate couriers across that river than anyone alive, and the Union had never managed to stop him for long.</p>\n<p>Booth could not cross yet. Every gunboat in the Potomac flotilla was on that river now, up and down, day and night. He would have to be hidden, close to the water, and fed, and kept quiet, and wait for the right night. Somebody would have to hide him who knew the river country and was not afraid.</p>\n<p>I sat in the barn and listened to my mother moving in the kitchen, and I knew, as well as I have ever known anything, that John Wilkes Booth was lying in the woods somewhere between our swamp and the Potomac, waiting for Thomas Jones to tell him the river was dark enough.</p>\n<p>And I knew those woods.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>\"Lottie,\" Iola said.</p>\n<p>\"Yes.\"</p>\n<p>\"She was fifteen. And she kept that.\"</p>\n<p>\"She kept it all her life. I asked her, years later, whether she'd ever told anyone. She said no. She said she'd been waiting for someone to ask her, and nobody ever had.\" He looked at the window, at the frost going white on the field. \"She was the best person I knew in that life. I've never been able to decide whether I did right by her.\"</p>\n<p>Iola wrote that down. Then she sat looking at it.</p>\n<p>\"You're going to go and find him,\" she said. \"In the woods.\"</p>\n<p>\"I'm going to go and find him,\" he said. \"That's next.\"</p>", "added": 1790600451060, "pt": [1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060, 1790600451060]}, {"num": 26, "title": "The Whistle", "html": "<p>\"I found him in two days,\" he said. \"It wasn't clever. I just knew the country, and I knew who to watch.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 18 to 23, 1865</em></p>\n<p>I did not look for Booth. Booth was a man with a broken leg lying still in the woods, and a man lying still in the woods cannot be found by looking, not in that country, not by anyone. I looked for Thomas Jones.</p>\n<p>Jones lived above the river, near Pope's Creek, on a bluff where he could see the whole width of the Potomac and the Virginia shore beyond it. He was a quiet, thin, careful man in his forties who fished for a living and had spent the whole war doing something else. Everyone in the county knew what. Nobody said it. He had been in prison for it once, early on, and come home, and gone on doing it.</p>\n<p>If Booth was being kept anywhere, he was being kept for Jones. And a man being kept alive in the woods has to be fed.</p>\n<p>So I watched Jones. I took one of my mother's horses and rode down toward the river on the back roads in my blue coat, the way a Union man on leave might ride out to look at the country, and I found a place on a wooded rise across a field from the lane that led up to his house, and I lay in the leaves there with a piece of bread and my father's old spyglass, and I watched.</p>\n<p>The country was full of soldiers. Cavalry went down the river road three and four times a day. Twice a patrol passed so close below me that I could hear the men talking about the reward. A hundred thousand dollars, one of them said, and what he would do with his share, and another one laughed at him. They rode on toward the river. They never once looked up at the rise.</p>\n<p>Jones went about his business as if nothing in the world had happened. He fished. He mended a fence. He went to the landing and talked to the men who were watching the river for the army, pleasantly, for a long time. He was, I thought, lying there, the calmest man in Maryland.</p>\n<p>And on the second afternoon, a little before dark, he walked out of his lane with a basket over his arm, and turned off the road, and went into the pines.</p>\n<p>I followed him as far as I could without being seen, which was not far. The pines on that side of the road were thick, young, close-grown, the kind of thicket where you cannot see ten feet in front of you. I lost him in it almost at once. I stood at the edge of it, very still, and listened.</p>\n<p>And from somewhere inside, not far off, I heard a whistle. Three notes. A little rising tune, like a bird that is not quite any bird.</p>\n<p>A moment later, from deeper in the pines, somebody whistled it back.</p>\n<p class=\"break\">&#10043;</p>\n<p>I stood at the edge of those pines for a long time.</p>\n<p>He was in there. A hundred yards from me, perhaps less. Lying on the ground on a blanket with his leg in splints, and Herold beside him, and Jones kneeling to open the basket. I could have walked in. I could have walked in and stood over him. I have thought about what I would have said, many times. I have never once been able to think of anything worth the walk.</p>\n<p>And I could have walked out. That was the other thing. I could have walked back to the road and waited for the next patrol and pointed into those pines and said <em>there,</em> and he would have been in irons by dark.</p>\n<p>I want you to understand what that would have meant, because I understood it, standing there, all at once.</p>\n<p>It would have meant Jones. Jones would have been taken, and Samuel Cox, whose land that was, and whose people had led him there, and every man and woman in that part of the county who had carried a letter or a meal or a message that week. And the soldiers would not have stopped there, because they would not have needed to. They would have gone back up the road Booth came down, house by house. The doctor. The tavern. The farm by the swamp where two riders had stopped at the gate at dusk, and where a girl in the hayloft had seen them, and told no one, and a mother had had a lamp lit in the kitchen.</p>\n<p>They hanged people, that summer, for a great deal less.</p>\n<p>I stood at the edge of the pines and chose. I chose my mother, and Lottie, and a county that had hidden me and nursed me and asked me nothing, over the President of the United States, who was dead, and over the justice that was owed him, which was coming anyway. Booth could not stay in those pines forever. He could not walk. He would have to cross the river, and in Virginia he would be one crippled man among strangers, with every soldier in the Union army looking for him. He was going to be caught. I did not need to be the one who caught him here, on this shore, in the middle of everyone I loved.</p>\n<p>But I would be the one who knew where he went.</p>\n<p>I turned around and went back to my rise and lay down in the leaves again, and watched Jones's lane, and waited for the night he took them to the river.</p>\n<p class=\"break\">&#10043;</p>\n<p>It was Friday. The twenty-first. A week to the night.</p>\n<p>A little after nine, I saw Jones come out of the pines leading a horse with a man on it, and another man walking beside, and they went down across the fields toward the bluff, slowly, without a light. I followed them as far as the top of the bluff, on my belly, the last of it.</p>\n<p>From there I watched him put them in a boat. A small flat boat, pulled up in the reeds below. I watched Herold help Booth down into it, and Booth sit, and Jones lean down and say something to them both and point out across the water, and push them off. And I watched the boat go out into the dark on the river and turn south and west, toward Virginia, and grow smaller, and go.</p>\n<p>Jones stood on the shore a long time after they were gone. Then he walked back up the bluff past where I lay, close enough to touch, and went home.</p>\n<p>He never knew I was there. He told the whole story himself, years later, in a book. I have read it. I'm not in it.</p>\n<p class=\"break\">&#10043;</p>\n<p>They did not reach Virginia that night. I know that now; the whole country knows it. The tide and the dark took them up a creek on the Maryland side instead, miles off, and they had to hide another day and go again the next night. I did not know that then. I only knew that the boat had gone out on the river on Friday night, and that by Saturday morning, if they had any luck at all, they were in Virginia.</p>\n<p>On Saturday and Sunday I watched the army search Maryland.</p>\n<p>They were everywhere, and they were nowhere. They were searching the Zekiah Swamp, which Booth had left a week before. They were searching barns in Bryantown. They had questioned Dr. Mudd twice, and were arresting other men all over the county and taking them to Washington. And every hour they searched Maryland was an hour he had in Virginia.</p>\n<p>On Sunday afternoon I rode into Port Tobacco, in my blue coat.</p>\n<p>There was an officer there from Washington with a party of detectives, running the search in that part of the county from the hotel. A major, a provost marshal named O'Beirne. I had heard his name on the roads all week. I went and stood in the hotel yard among the soldiers and the horses, a lame Union private on leave, and waited until one of his detectives came out, and I told him.</p>\n<p>I told him that I had been fishing on the Potomac below Pope's Creek on Friday night, and that I had seen a small boat put off from the Maryland shore in the dark, a little after nine, with two men in it. That one of them had been lifted into it by the other, as if he could not walk. That the boat had gone out toward the Virginia side, south and west, and had not come back.</p>\n<p>I did not say whose shore. I did not say whose boat, or whose pines, or whose lane. I did not say a single name.</p>\n<p>The detective looked at me a long time. He wrote it down. He asked me my regiment, and I gave him one, a Pennsylvania regiment I knew had been in the fighting around Petersburg, and he wrote that down too. He went inside.</p>\n<p>I learned afterward, as everyone did, that on Monday morning Major O'Beirne telegraphed the War Department that he believed the men they were looking for had already crossed into Virginia. And that the War Department believed him, and that afternoon put a troop of cavalry on a steamer and sent it down the river.</p>\n<p>I did not learn that on Sunday. On Sunday, the detective came back out into the hotel yard with another man, and the other man looked at my face, and at my cane, and at my leg, and then at my face again, and said, \"What's your name, soldier?\"</p>\n<p>And I heard, under the question, from somewhere behind me in the yard, one of the soldiers say to another: <em>a lame one. The clerk said a lame one.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>Iola had been writing fast. She looked up.</p>\n<p>\"They arrested you.\"</p>\n<p>\"They arrested me.\" He smiled slightly. \"For the first time in that life. Not the last time in all of them.\"</p>\n<p>\"For being lame.\"</p>\n<p>\"For being lame, and a Marylander, in a coat that did not quite fit, with a story that was too useful.\" He turned the pencil. \"A clever man who is being careful does not walk into a room full of detectives with the one piece of information they need. I knew that. I did it anyway. I wanted them in Virginia. I wanted them out of my county.\"</p>\n<p>She looked at her notes, and then at him.</p>\n<p>\"You're going to tell me how you got out,\" she said.</p>\n<p>\"Somebody got me out,\" he said. \"I've never been entirely sure who.\"</p>", "added": 1790600832014, "pt": [1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014, 1790600832014]}, {"num": 27, "title": "The Note", "html": "<p>They broke for lunch. He heated soup, and she set the table without being asked, finding the spoons on the first try now, and they ate looking out the window at a pair of crows walking the frozen field like two men looking for something they had dropped.</p>\n<p>\"You'll want to know what they had on me,\" he said, halfway through the bowl. \"It wasn't much. It didn't need to be.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 23 to 28, 1865</em></p>\n<p>They took me to Washington in a wagon, with my hands tied, with two other men from the county who had been picked up that week: a farmer who had sold a pair of boots to the wrong stranger, and a boy who had been heard to laugh when he was told the President was dead. We did not speak to each other the whole way. We went up the road I had come down under a load of oats, and over the Navy Yard Bridge, and past the end of it where I had sat with a borrowed horse on the seventeenth of March.</p>\n<p>They put us in the Old Capitol Prison. It had been the Capitol once, when the British burned the real one, and it had been a boarding house after that, and in the war it had become a prison, a big shabby brick building across from the new Capitol dome, full of spies and blockade runners and Southern ladies and anyone the government did not know what else to do with. That week it was full to the attic with men from Southern Maryland.</p>\n<p>When they asked my name, I gave them one. Christopher Hurley, of St. Mary's County. It was the first name that came to me. It was the only thing of Ned's I had left to give anyone.</p>\n<p class=\"break\">&#10043;</p>\n<p>On the second day they brought the clerk from the Kirkwood House.</p>\n<p>They stood me in a room with four other men, all about my age, all of us in whatever we had been arrested in, and they made us walk, one at a time, from one wall to the other. The clerk stood by the door with an officer beside him. When it was my turn I walked, and my leg did what it always did, and I watched the clerk's face.</p>\n<p>He did not hesitate. \"That's him,\" he said. \"He asked for Mr. Booth. Ten o'clock Friday night. He asked when Mr. Booth left his card, and then he ran out the door.\"</p>\n<p>\"Ran?\"</p>\n<p>\"As best he could, sir. With the leg.\"</p>\n<p>The officer wrote it down.</p>\n<p>That was what they had. It was enough to hang a man that month. A lame Marylander, wearing a coat that was not his and a name that was not his, who had asked for Booth at the Kirkwood House at the very hour of the murder, and had then run toward Ford's. Who had been found nine days later in the heart of the county Booth had fled through, walking into a room of detectives with a story about a boat. The officer who questioned me that afternoon, a tired colonel with a very clean desk, put it to me in almost those words, and asked me whether I had anything to say.</p>\n<p>I had a great deal to say, and none of it could be said. I could not tell him why I was at the Kirkwood without telling him why I knew Booth. I could not tell him how I knew about the boat without telling him about the pines, and Jones, and my mother's gate.</p>\n<p>So I said nothing. I let him think what he liked. I lay on a straw tick in a room with nine other men for three days and three nights, and I thought about rope.</p>\n<p class=\"break\">&#10043;</p>\n<p>On the morning of the twenty-seventh, the newspapers came in.</p>\n<p>We were not supposed to have them. A guard sold them for a quarter, and a man by the window read them out loud to the rest of us, in a low voice, while we sat on the floor and listened.</p>\n<p>Booth was dead.</p>\n<p>The cavalry had found him in Virginia, the paper said, a long way south of the river, on a farm near a place called Port Royal, hiding in a tobacco barn. A farmer named Garrett had taken him in, thinking he was a wounded Confederate soldier going home. In the small hours of the twenty-sixth, the soldiers had surrounded the barn and called on him to come out. Herold had come out and surrendered. Booth would not. So they set the barn on fire. And while it burned, a sergeant had put his rifle to a crack between the boards and shot him through the neck, against orders, and they had dragged him out of the flames onto the porch of the farmhouse, alive, paralyzed, and he had lived a few hours more.</p>\n<p>The man by the window read out what Booth had said at the end. That he had asked them to tell his mother he died for his country. And that near the end, when they lifted his hands so that he could see them, he had looked at them and said, <em>Useless. Useless.</em></p>\n<p>Nobody in that room said anything for a long time.</p>\n<p>I sat on the floor with my back against the wall and thought about the cavalry that had found him. The paper said they had gone down the river by steamer on the twenty-fourth, acting on information. It did not say what information. It did not need to. I knew what I had said in a hotel yard in Port Tobacco on Sunday afternoon, and I knew what day the steamer had sailed.</p>\n<p>He had been going to be caught. I had known that at the edge of the pines. But I had sent them after him, in the end, with a story about a fishing trip, and they had gone, and they had found him, and he had died on a porch in Virginia looking at his hands.</p>\n<p>I would like to tell you I felt something clean. I did not. I felt tired, and sick, and I thought of him on the fence in Charles County telling Lottie she had ink on her finger, and I thought of the President getting down from his carriage outside Ford's, tired, deciding. And I found I could not tell which of them I was grieving for. That frightened me more than the rope.</p>\n<p class=\"break\">&#10043;</p>\n<p>The colonel sent for me again on the afternoon of the twenty-eighth.</p>\n<p>He had a letter on his desk. He did not show it to me. He kept his hand flat on it while he talked, the way you keep a hand on a thing that might blow away.</p>\n<p>\"This came to the War Department on Tuesday,\" he said. \"Unsigned. It concerns you. I'll tell you what it says, and you'll tell me whether any of it's true.\"</p>\n<p>The letter said that the lame young man held on suspicion from the Kirkwood House had been seated in the dress circle of Ford's Theatre on the night of the fourteenth, from half past eight, nearest the door to the President's box. That at about twenty-five minutes to ten he had been handed a note by a man in a hotel waiter's jacket, and had got up and left the theater at once. That the usher at the head of the dress circle stairs would remember it, because the lame man had nearly fallen on the stairs going down. That he had gone to the Kirkwood House, and spoken to a German drinking at the bar, and that the German had left the hotel immediately afterward without going upstairs; and that the bartender would remember that too.</p>\n<p>\"We found the usher,\" the colonel said. \"He remembers the stairs. We found the bartender. He says a lame man leaned on the bar next to Atzerodt and told him to go home. He heard that much. Go home. And Atzerodt put his money down and went.\" He looked at me. \"So you left Ford's forty minutes before the President was shot. And you went to the Kirkwood, where the Vice President was asleep upstairs, and you sent home the man who was supposed to kill him.\"</p>\n<p>I said nothing.</p>\n<p>\"And on Sunday you told Major O'Beirne's man that the murderer had crossed into Virginia. Which he had.\"</p>\n<p>I said nothing.</p>\n<p>The colonel sat back. He was a tired man, and a careful one, and I think he had been a lawyer before the war, and would be one after.</p>\n<p>\"I don't know what you are, Mr. Hurley,\" he said. \"I don't believe that's your name, and I don't believe you went fishing. But I know what you did on Friday night, because somebody took the trouble to tell me, in the best handwriting I've seen in this building, and every word of it checked.\" He tapped the letter with one finger. \"Whatever you were before that, I've got a building full of men who did less and deserve more rope. Go home.\"</p>\n<p>He did not show me the letter. I asked him who had sent it. He said he did not know, and I believed him.</p>\n<p>I walked out of the Old Capitol Prison into the afternoon sun, across from the great white dome of the Capitol, and stood on the pavement, and thought about the best handwriting in that building. And about a man in a white jacket who had stood by the door in the dress circle and watched me go down the stairs, and had seen me nearly fall.</p>\n<p>I thought I knew. I have never been certain. I have thought about it for a hundred and sixty years, and I have never once been certain.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. She had stopped writing some time before.</p>\n<p>\"He saved your life,\" she said. \"If it was him.\"</p>\n<p>\"If it was him.\" He was looking at the window. \"It would have been easier for him not to. Much easier. A Black man writing to the War Department that month, about the assassination, about a white man he'd sent out of a theater with a false message: that was not a safe letter to write. He must have known the handwriting could be traced. He wrote it anyway.\" He was quiet for a moment. \"And he never signed it. So I would never have to owe him anything.\"</p>\n<p>Iola looked down at her notebook. After a moment she said, not quite to him, \"At least somebody wrote something down.\"</p>\n<p>\"Hm?\"</p>\n<p>\"Nothing. It's just.\" She turned a page back and forth. \"They had a file on you. Two pages, and a letter, but a file. Bookbinder kept copies of everything. That was the whole point of him. Two banker's boxes of paper, in his apartment, in the closet by the door. I saw them the one time I was there. Everything he'd ever copied at Carrow, every invoice, every letter he'd been asked to repair.\" She shook her head. \"There's nothing about them in the police report. Not a word. <em>Desk.</em> That's all it says. A desk.\" She closed the notebook. \"I always figured he took them with him.\"</p>\n<p>He did not say anything. He looked at her for a moment, the mechanic listening to the engine, and then he looked at the box of <em>CARROW</em> she had not brought, as if it were sitting on the floor by her chair, and then back at the window.</p>\n<p>\"Next week,\" he said, \"the trial.\"</p>", "added": 1790601727134, "pt": [1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134, 1790601727134]}, {"num": 28, "title": "The Arsenal", "html": "<p>\"You've read about her,\" he said. \"Since I told you her name.\"</p>\n<p>\"Everything I could find.\"</p>\n<p>\"Then you know what she's famous for. Being the first.\" He looked at the fire. \"I want to tell you what she was to me. It isn't the same.\"</p>\n<p>It was the fifteenth Thursday. The payment for the last session had come on Monday, double again, with the same note, and Iola had stopped being surprised by it and started being uneasy. She had not said so to him. She thought he knew.</p>\n<p class=\"break\">&#10043;</p>\n<p><em>May and June, 1865</em></p>\n<p>I did not go home when they let me out. I could not face my mother yet, or Lottie, with everything I could not tell them. I went back to the lumber merchant on the waterfront, in my blue coat, as Mr. Hurley, and he looked at me for a long moment and gave me my old stool back and did not ask where I had been. A great many people in Washington did not ask each other things that spring.</p>\n<p>The trial began in May, at the Arsenal, down at the point where the Eastern Branch meets the Potomac, in the old penitentiary there. Not in a courtroom. The government would not risk a jury, not in a city where half the jurors might be Marylanders. It was a military commission: nine officers at a long table, generals and colonels, deciding in a room on the third floor of a prison. There were eight people accused. Mrs. Surratt was the only woman.</p>\n<p>They let the public in, by pass. The newspapers printed every word of the testimony the next morning, pages of it, in small type. I read every page. And some days, when I could get a pass from a man at the lumber yard whose brother was a clerk at the War Department, I went.</p>\n<p>I went the day Weichmann testified.</p>\n<p class=\"break\">&#10043;</p>\n<p>They sat the prisoners on a raised platform along one wall, in a row, with a soldier between each of them. The men wore irons on their wrists and ankles, and heavy chains between. Mrs. Surratt sat at the end, in black, with a veil over her face and a fan in her hand, and she did not wear irons. She hardly moved.</p>\n<p>I sat at the back among the spectators in my blue coat, and I watched Louis Weichmann walk to the witness chair.</p>\n<p>He had not changed. Plump, soft-spoken, polite. He had gone to the police himself, I learned later, within a day or two of the murder, and told them everything he knew, and they had kept him close ever since. He did not look at the prisoners. He looked at the commission, and he answered their questions for hours, in his careful clerk's voice, and he remembered everything.</p>\n<p>He remembered every visit Booth had made to the house on H Street. He remembered Atzerodt, and the bottles, and Powell as Wood and Powell as the Reverend Paine. He remembered driving Mrs. Surratt to her tavern on the afternoon of the fourteenth, and the package she carried, done up in paper, and Booth talking with her before they left. He remembered it all, in order, with dates.</p>\n<p>I sat at the back and listened to him and thought: <em>if this goes wrong, that one will talk.</em></p>\n<p>He did not mention me. Not once, in all those hours. He had never heard my name. I had seen to that, on the first night, walking back down H Street in the cold.</p>\n<p>I had been right about him. I sat there being right about him and wished, with my whole heart, that I had been wrong.</p>\n<p class=\"break\">&#10043;</p>\n<p>John Lloyd testified too, the man who had leased her tavern. He was the worst of it, for her. He said that in March, John Surratt and Herold and Atzerodt had brought two carbines to the tavern and hidden them in the ceiling. He said that on the afternoon of the fourteenth, Mrs. Surratt had come to the tavern and handed him a package, and told him to have the shooting irons ready that night, because they would be called for. And that at midnight Booth and Herold had come, and he had given them the whiskey, and the carbine, and the package, which was a pair of field glasses.</p>\n<p>And the officers who had arrested her testified that on the night of the seventeenth, while they were in her parlor taking her away, a knock had come at the door, near midnight, and it was Powell. Filthy, with a pickaxe on his shoulder, saying he had come to dig a gutter. And that when they asked her whether she knew him, she had raised her hand and said, <em>Before God, sir, I do not know this man.</em></p>\n<p>He had eaten at her table, as the Reverend Paine, for days.</p>\n<p class=\"break\">&#10043;</p>\n<p>I spent that spring doing what I always do. I took the thing apart, piece by piece, and looked at each piece.</p>\n<p>The kidnapping: she knew. I was sure of that before the trial began, and nothing in it changed my mind. She had watched the men come and go in her house all winter. She had heard John talk, and John could never keep a secret he could boast of. She knew about the carbines in March, the ones hidden in her own ceiling; they were bought for the kidnapping, to hold off pursuit on the road south. She had known and said nothing, the way she said nothing about anything she did not want to know.</p>\n<p>The murder: I did not believe she knew. And I had one thing, in all that trial, that nobody on that commission had.</p>\n<p>I had stood on the corner of H Street at half past two on the fourteenth and watched Booth hand her that package on the steps. And I had watched her take it, and put it in the buggy, without looking at it. Without opening it, or weighing it in her hand, or asking what it was. She had taken it from him the way she took everything from the men in her house: as an errand, to be done and not asked about.</p>\n<p>A woman who knows she is carrying the field glasses for a murderer's escape looks at the package. She cannot help it. I have watched a great many people carry things they knew to be terrible, in a great many lives, and they all look. They hold it as if it were hot. She had held it like a loaf of bread.</p>\n<p>And the words she gave Lloyd, <em>have the shooting irons ready:</em> those were the words of the kidnapping. Those guns had been waiting in that ceiling for a month, for the road south with the President in a carriage. She had passed the message on, as she passed on everything. I did not think she had asked what they would be used for now. I did not think she had wanted to know.</p>\n<p>And Powell at the door: she had lied. Of course she had lied. She had known him for weeks. But a woman with soldiers in her parlor, at midnight, being taken from her own house, who sees a filthy man with a pickaxe on her step and says <em>I do not know him,</em> is a frightened woman lying about a boarder. That is not the same as knowing he had spent Friday night stabbing the Secretary of State in his bed.</p>\n<p>All of the kidnapping. None of the murder. That was my answer, and I have never changed it.</p>\n<p>It was the same line I had walked. I had known all of the kidnapping too. I had drawn them the road. The only difference between us was that I had got out on the eleventh of April, on a lawn, in the candlelight, when Booth said <em>the last speech he will ever make,</em> and she had not been standing there to hear it.</p>\n<p class=\"break\">&#10043;</p>\n<p>The commission gave its verdict at the end of June. It was kept secret for a week.</p>\n<p>On the sixth of July, the newspapers said it. Four of them to hang: Powell, Herold, Atzerodt, and Mary Surratt. The others to prison. The hangings were set for the next day. One day's notice.</p>\n<p>The papers also said, some of them, in a paragraph near the bottom, that five of the nine officers who had tried her had signed a letter asking the President to spare her, because of her age and because she was a woman. The President had not granted it. He said later that he had never seen it. The judge advocate said he had shown it to him. People have argued about that ever since.</p>\n<p>And a story went around, in those days, secondhand, the way stories do: that the President had said of her that she kept the nest that hatched the egg. I do not know if he said it. I heard it from a man at the lumber yard who had heard it from someone. But I remember thinking, when I heard it, that it was the truest thing anyone said about her that summer, and that it was not a reason to hang her.</p>\n<p>I had kept the nest too. I had drawn it on my mother's tobacco receipts.</p>\n<p class=\"break\">&#10043;</p>\n<p>That night, the sixth of July, I sat at my table by the Navy Yard and did the only thing I could think of. I wrote a letter.</p>\n<p>I wrote it to the President. I wrote that I had been present in Washington in April and had reason to know that Mrs. Surratt had known of a plan to seize President Lincoln, but not of any plan to kill him; that on the afternoon of the fourteenth she had carried a package from Booth without looking at it, as a woman carries an errand she does not understand; that her crime was silence, not murder, and that silence was the crime of half of Maryland that winter. I wrote it as clearly and as plainly as I could. I wrote it three times, until every word was right.</p>\n<p>I did not sign it. I could not sign it. To sign it was to put my own neck beside hers.</p>\n<p>I walked it up the Avenue to the President's house at midnight, holding it inside my coat, and gave it to the doorkeeper, who took it without looking at me and put it on a pile with the others. There was a pile. It was a big one. Half of Washington was writing to the President that night.</p>\n<p>I walked home down the Avenue. And somewhere around Seventh Street, I stopped, in the dark, and stood still for a long time.</p>\n<p>A man writing a letter at midnight, three times over, until every word was right. Not signing it. Walking it up the Avenue himself, holding it inside his coat. Handing it in at the President's door.</p>\n<p>I had seen that before. In the dining room of the National, on the thirteenth of April, by one lamp. I had thought it was a love letter.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. His hand had gone still on the notepad, on top of the drawing that was always there, the one he went over and over without looking.</p>\n<p>Iola sat very still.</p>\n<p>\"Damon,\" she said. \"The night before. He was writing to Lincoln.\"</p>\n<p>\"I think so. I've thought so ever since that night on Seventh Street.\" He looked down at his hand, and moved it off the page, as if he had only just noticed where it was. \"I never knew for certain. I never saw it. He never told me. But I think that man sat up writing a warning to the President of the United States, in the best hand in Washington, and walked it to the door himself. And they put it on a pile.\" He was quiet a moment. \"Like mine.\"</p>\n<p>\"Did yours do anything?\"</p>\n<p>\"She was hanged the next afternoon,\" he said. \"At the Arsenal. At half past one.\" He picked up his pencil again. \"I was there. That's next week. I'd like to stop.\"</p>\n<p>She turned off the recorders herself, before he asked her to.</p>", "added": 1790602030627, "pt": [1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627, 1790602030627]}, {"num": 29, "title": "July the Seventh", "html": "<p>He was sitting on the porch when she drove up, in his coat, in the cold, the way he had been the week of the Kirkwood. He did not get up. When she came up the steps he moved over on the bench to make room, and she sat down beside him, and for a while neither of them said anything. Their breath went up white.</p>\n<p>\"I'd like to tell this one out here,\" he said. \"If you don't mind the cold. It was very hot that day. I find I don't want to be warm while I tell it.\"</p>\n<p>She put the phone on the bench between them and turned it on, and did not bother with the other recorder.</p>\n<p class=\"break\">&#10043;</p>\n<p><em>July 7, 1865</em></p>\n<p>It was the hottest day of that summer. People said afterward it had been a hundred degrees in the sun, and I believe it. There was no wind at all off the river. The air in the Arsenal yard sat on you like a hand.</p>\n<p>I had a pass. The man at the lumber yard whose brother was a clerk had got me one, and he had not asked me why I wanted it, and I did not tell him. There were a great many passes. The yard was full of people by noon: soldiers, mostly, lined up along the walls in the heat, and officers, and newspapermen, and a few others like me, standing in whatever shade there was. Some men had climbed onto the prison wall to see better. A photographer had set up his camera on a roof across the yard, with his black cloth over his head, waiting.</p>\n<p>In the middle of the yard was the scaffold. It was new. You could smell the fresh-cut pine from where I stood. It had been built the day before, and they had tried the traps that morning with weights, and the sound of them dropping had carried all over the Arsenal. Beside it, in the dirt, four graves had been dug, and four plain pine boxes laid beside the graves.</p>\n<p>Men had been trying all morning to stop it. I learned that later. Her lawyers had got a judge to order her brought before him, and the order had been carried to the Arsenal gate, and the President had set it aside. Her daughter, Anna, had gone to the President's house that morning to beg for her mother's life, and had not been let in to see him. She had sat on the stairs and wept, people said. Nobody who could have stopped it would see anyone.</p>\n<p>And my letter was somewhere on a pile.</p>\n<p class=\"break\">&#10043;</p>\n<p>At a little after one o'clock, a door in the prison wall opened, and they brought them out.</p>\n<p>Mrs. Surratt came first. She could hardly walk. Two soldiers held her up, one on each side, and two priests walked with her, praying, and she was in black, with a veil. Someone was holding an umbrella over her head against the sun. It was the only kindness I saw that day, and it was a small one, and I have never forgotten who needed it least.</p>\n<p>Then Herold, looking about him the way he always had, like a boy at a fair, with his face gone white. Then Powell, tall and straight and perfectly calm, in a sailor's shirt, looking out over all of us as if he were looking at weather. Then Atzerodt, in a gray coat, shaking so that you could see it across the yard.</p>\n<p>They went up the steps. They sat in four chairs at the edge of the platform, with the umbrellas held over them, while an officer read out the orders in the heat, at length, and the ministers prayed, at length. It took a long time. The soldiers along the walls shifted in the sun. Somewhere a man fainted and was carried away.</p>\n<p>I did not look away. I had decided that, on the walk down to the Arsenal. I owed her that much, at least. I did not look away once.</p>\n<p class=\"break\">&#10043;</p>\n<p>I will not tell you all of it. You can read it. It is all written down, and there are the photographs, from the camera on the roof: the four of them in their chairs under the umbrellas, and then standing, and then the other one. You have probably seen them. Everyone has.</p>\n<p>I will tell you two things.</p>\n<p>The first is that Atzerodt spoke at the end, standing on the trap with the rope around his neck, in his thick German voice, which shook. He said goodbye, and that he hoped we would all meet in another world. I thought of him at the bar in the Kirkwood House, looking at me in the mirror with that terrible hope in his face, and putting his money down, and going out without once looking at the stairs. He had never climbed them. He had never touched the Vice President. He had gone home, the way I told him to, and they had hanged him anyway, for the room upstairs and the knife in it and the questions he had asked the bartender. For what he had been ready to do, and had not done.</p>\n<p>I had given him leave to fail. It had not been enough.</p>\n<p>The second is that the traps fell at half past one, and it was very quick, and the sound of it was the same sound the weights had made that morning, and I heard it all over the Arsenal, and I have heard it ever since.</p>\n<p>Then it was very quiet in the yard, in the heat, for a long time.</p>\n<p class=\"break\">&#10043;</p>\n<p>I went home to Charles County the next week.</p>\n<p>I told the lumber merchant I was going, and he shook my hand and said, <em>Good luck to you, Hurley,</em> and I said <em>good luck</em> back, and never saw him again. I burned the blue coat in the stove at the lumber yard, the way I had burned the receipts. I walked out over the Navy Yard Bridge in my own clothes, and the sentry did not look at me. The war was over. Nobody stopped the ones going home anymore.</p>\n<p>My mother was on the porch when I came up the lane. Lottie was in the hayloft; I saw her face at the little window before she came running. The tobacco was in. It had been planted in May without me, by my mother and Lottie and old Hester and two men they had hired from Bryantown for wages, and it was coming on well.</p>\n<p>My mother held my face in her hands. She did not ask me where I had been. She never did, not once, for the rest of her life.</p>\n<p>\"You're home,\" she said.</p>\n<p>\"I'm home,\" I said.</p>\n<p>It was true, as far as it went. It was the only home that body ever had. I stayed in it a long time.</p>\n<p class=\"break\">&#10043;</p>\n<p>He was quiet then.</p>\n<p>Iola sat beside him on the cold bench and looked out at the field. The frost had gone off it in the sun, and it was brown and bare, and a hawk was going round and round over the far end of it, very high.</p>\n<p>\"That's the end,\" she said. \"Of 1865.\"</p>\n<p>\"That's the end of 1865.\"</p>\n<p>She reached down and turned off the phone. She did not know what she was supposed to say. In all her years of interviews she had never once not known what to say at the end of one.</p>\n<p>\"Thank you,\" she said at last. \"For telling me.\"</p>\n<p>He looked at her, surprised, as if nobody had ever said that to him before. Perhaps nobody had.</p>\n<p>\"Thank you for listening to it,\" he said. \"I don't think anyone ever has. Not all of it. Not in order.\" He looked back at the hawk. \"It turns out it's heavier in order.\"</p>\n<p>They sat on the porch until she was too cold to feel her hands. Then he stood up, slowly, one hand on the rail, and said he supposed she would want her lunch, and they went in.</p>", "added": 1790602314555, "pt": [1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555, 1790602314555]}];

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
    ${coverFixes()}
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();
  main.querySelectorAll(".fixes [data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
}
function toc() {
  main.innerHTML = `<section class="toc"><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.num}</span><span>${c.title}</span>${badge(c)}</button></li>`).join("")}</ol></section>`;
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter">
    <header><div class="num">Chapter ${c.num}</div><h2>${c.title}</h2></header>
    <div id="fixbarSlot"></div>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  markFixes(c);
  $("where").textContent = `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();

// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });

const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
const CKEY = store.get("ckey", null);
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}

$("cmtSave").onclick = async () => {

// the newest change the reader has acknowledged. A chapter they've never opened is NEW.
function seenAt(num) { return store.get("seen", {})[num] || 0; }
function setSeen(num, t) { const s = store.get("seen", {}); s[num] = Math.max(s[num] || 0, t); store.set("seen", s); }
function fixCount(c) { const since = Math.max(seenAt(c.num), c.added); return c.pt.filter(t => t > since).length; }
function isNew(c) { return c.added > seenAt(c.num); }
function badge(c) {
  if (!CKEY) return "";
  if (isNew(c)) return `<span class="tag new">New</span>`;
  const n = fixCount(c);
  return n ? `<span class="tag">${n} fixed</span>` : "";
}
function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">Ch ${c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const since = seenAt(c.num);
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => c.pt[i] > since);
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} fixed since you last looked, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
