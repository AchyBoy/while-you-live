nty-two years.\"</p>\n<p>It came up from the stacks at eleven, on a cart: a gray archival box, and inside it, a row of old envelopes, brittle, soft at the corners, some of them labeled in a thin, slanting hand, some of them not labeled at all. I washed my hands, and the attendant reminded me to keep the papers in order. A woman at the desk kept half an eye on me, the way they keep it on everyone.</p>\n<p>I went through them one at a time. Newspaper clippings, yellow and crumbling. A draft of something in Nicolay's hand. Notes on the backs of White House cards. A letter from a woman in Ohio about her son. Receipts. A list of names I did not recognize.</p>\n<p>And in the fourth envelope, folded in thirds, on a single sheet of good paper gone the color of weak tea, a letter.</p>\n<p>I knew it before I had it unfolded. I knew it from the handwriting, which I had never once seen. It was the most beautiful hand I had ever looked at: even, flowing, perfectly clear, with long looping capitals, the kind of writing that was taught in the best schools and that hardly anyone had ever mastered. It looked like it had been written slowly. It looked like it had been written more than once.</p>\n<p>It was dated at the top: <em>Washington, April 13th, 1865.</em></p>\n<p>It was not signed.</p>\n<p class=\"break\">&#10043;</p>\n<p><em>Mr. President,</em></p>\n<p><em>I beg you will read this to the end, though it is not signed, for reasons you will understand.</em></p>\n<p><em>There is a man in this city who means to take your life. His name is John Wilkes Booth, the actor. He lives at the National Hotel. On the evening of the 11th inst., standing upon your lawn while you spoke, he said in my hearing that it was the last speech you would ever make. I believe he meant it as I believe I am writing this.</em></p>\n<p><em>He does not mean you alone. He has asked, in my hearing, after the house of Mr. Seward, who lies ill, and after the rooms of the Vice President at the Kirkwood House. He has about him a large young man who has called himself both Wood and Paine; a German of Port Tobacco who drinks; a druggist's clerk; and a young man of Charles County, lately a soldier of the rebellion, lame in the left leg, who is much at his table and knows the roads of Southern Maryland.</em></p>\n<p><em>I pray you will not go abroad in the evenings, nor to any public place, until these men are taken up. I pray you will think of what you said upon the 11th, and of how many of us wait to see it done. We cannot spare you, Sir. Not now.</em></p>\n<p><em>I have no name that would carry weight with you. I am one of those you spoke of.</em></p>\n<p>On the back, in a different hand, a clerk's hand, small and hurried, someone had written: <em>Anonymous. Warning. Filed.</em></p>\n<p>And in the left margin, beside the last line, small, drawn in the same ink as the letter, as if the pen had moved there by itself while the writer was thinking, there was a mark. A small star, the kind you draw without lifting the pen, crowded with some foreign letters.</p>\n<p>I looked at it for a moment, the way you look at a doodle in the margin of anything. It seemed vaguely familiar, the way a lot of things do, and I did not give it a second thought. My eyes went back up to the middle of the letter, and stayed there.</p>\n<p><em>A young man of Charles County, lately a soldier of the rebellion, lame in the left leg, who is much at his table and knows the roads of Southern Maryland.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>I sat in the quiet room under the green lamp for a long time.</p>\n<p>I had checked a hundred things for him. The inauguration, the surgeon, Point Lookout, the National, the flag, the speech, the salute. Every one of them had been in some book, somewhere, that anyone could read, and so every one of them had proved nothing, and I had said so, every time, and he had agreed with me every time and seemed pleased. And there were the two I could not check at all, the thread and the sleeves, which proved nothing the other way.</p>\n<p>I could not find it in any book. I checked, right there, quietly, on my phone, searching every phrase of it I could remember. <em>Lame in the left leg. Much at his table. Knows the roads.</em> Nothing. I could find no historian who had quoted it, and no book on the assassination that mentioned it, and nothing online. It had sat in a box in the stacks of the Library of Congress, unrequested, for longer than the librarian had worked there.</p>\n<p>Carrow came into my head, because I could not help it. A letter that matched his story word for word was exactly what a clever man would forge, and my client read every word of that story. A recent forgery would mean getting it into a box nobody had requested in twenty-two years. The docket on the back was in a different hand, and the ink had gone brown into the fibers the way ink does in a century and a half, not in a season.</p>\n<p>Twenty-two years was not forever, either. He could have read it twenty-three years ago, and built the story around it. I had no way of knowing.</p>\n<p>But he had never asked me to find this letter. He had said he had never seen it. I had gone looking on my own. Still, he knew how I worked.</p>\n<p>And it described him. Not the story. Him. The lame young man at Booth's table. It described him exactly as he had described himself, week after week, from a chair by a woodstove, and it had been written by the waiter he had told me about, in the hand he had told me about, on the night he had told me about, and filed and forgotten less than a day before the shot.</p>\n<p>I thought of the man in the dining room of the National, bent over the headwaiter's desk by one lamp, writing it three times. I thought of the old man in the cardigan, standing on the pavement on Seventh Street in the dark, understanding it a hundred and sixty years too late.</p>\n<p><em>I have no name that would carry weight with you. I am one of those you spoke of.</em></p>\n<p>I read the last line again. My eyes had filled, and I held the letter out over the table, away from me, until they cleared. It was a hundred and sixty years old, and I was not going to be the one who put a mark on it.</p>\n<p>I photographed it on my phone, front and back, with no flash, as the sign on the wall asked. Then I asked for a copy anyway, because I wanted one I could hold. The librarian looked at the letter for a long moment when I brought it to the desk, and at me, and did not say anything, and made the copy herself.</p>\n<p>I walked out of the Madison Building into the gray winter noon with the copy in a folder under my arm, and sat in my car on the street without starting it.</p>\n<p>For four months I had been a doubter. It had been the one thing I was sure of. Every Thursday I had come to his house determined to find the lie, and I had never found it, and I had told myself that proved nothing, and it had not.</p>\n<p>Sitting there in the car, I made myself say it, out loud, alone, to the steering wheel, the way I made myself say true things on paper.</p>\n<p>\"I don't know what he is.\"</p>\n<p>It was not the same as believing him. But it was the first time since that first Thursday that I had not been sure.</p>", "audio": false, "added": 1790602936661, "pt": [1790602936661, 1790694240640, 1790694240640, 1790694240640, 1790854901238, 1790854901238, 1790854901238, 1790861698841, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790602936661, 1790602936661, 1790602936661, 1790857416033, 1790694240640, 1790602936661, 1790694240640, 1790602936661, 1790602936661, 1790602936661, 1790602936661, 1790602936661, 1790602936661, 1790602936661, 1790602936661, 1790602936661, 1790604858193, 1790694240640, 1790602936661, 1790694240640, 1790694240640, 1790861698841, 1790861698841, 1790856836363, 1790871219288, 1790694240640, 1790694240640, 1790602936661, 1790808830027, 1790694240640, 1790861984290, 1790857526860, 1790694240640, 1790602936661, 1790861984290]}, {"num": 32, "title": "The Carpathia", "extra": false, "html": "<p>The photocopy sat on the kitchen table all that evening, in its folder, and neither of us touched it.</p>\n<p>Freda had seen it when she came in from school. She had asked, and I had told her, all of it: the envelope, the gray box nobody had asked for in twenty-two years, the handwriting, <em>lame in the left leg.</em> Freda had listened with her chin on her fist, the way she had listened as a little girl to stories at bedtime, and at the end she had said, \"So he's not lying.\"</p>\n<p>\"I don't know.\"</p>\n<p>\"Mom.\"</p>\n<p>\"I don't know what he is,\" I said. \"That's all I know. That's the most I've ever known about him.\"</p>\n<p>Freda thought about that. \"That's kind of a lot,\" she said, and went back to her chemistry, and her phone lay face up beside the book and buzzed twice, and she read both and laughed at one.</p>\n<p class=\"break\">&#10043;</p>\n<p>The payment came at eight o'clock.</p>\n<p>I heard my phone go and looked at it and did not understand the number at first. Then I did. It was twenty thousand dollars. It was more than I had made in the whole of the year before. It was the car paid off, and the dentist, and a start on Freda's college, if she went somewhere sensible. The note on the transfer said: <em>With our client's thanks, at the close of the first part.</em></p>\n<p>The first part.</p>\n<p>At a quarter to nine there was a knock at the door.</p>\n<p>It was a courier, a young man in a reflective jacket with a motorcycle idling at the curb, holding out an envelope and a tablet for me to sign. I signed. He was gone before I had the door shut.</p>\n<p>The envelope was heavy cream paper, the same as the first letter, months ago, on the night of the electric bill. <em>Aldine, Mercer and Voss.</em> Inside was a single card, smaller than a postcard. There was no letter with it, no typed note from the lawyers. Only the card, and on the card one line, written by hand, in ink.</p>\n<p>It was the same old-fashioned hand that had written <em>Please ask him what he thinks of 1865</em> at the bottom of the first letter. I would have known it anywhere. Still, I went and got the first letter out of my file to be sure, and laid them side by side on the kitchen table under the light.</p>\n<p>It was the same hand. But it was not the same. The letters were the same shapes, the same careful, schooled, slightly slanting shapes, but they wavered now. The long strokes had a tremor in them, a little shiver, like a line drawn on a moving train. The pen had stopped, here and there, and started again. Whoever had written this had written it slowly, and I thought it had cost him something.</p>\n<p><em>Please ask him about the Carpathia.</em></p>\n<p>\"What's the Carpathia?\" Freda said, from across the table.</p>\n<p>I was already looking it up.</p>\n<p>\"A ship,\" I said. \"It was a ship. In 1912.\" I read, and my voice went quieter. \"It was the ship that came for the Titanic. It picked up the survivors from the lifeboats, in the morning. Seven hundred and five of them.\"</p>\n<p>\"The Titanic?\" Freda put her pencil down. \"Like, the Titanic?\"</p>\n<p>\"Like the Titanic.\"</p>\n<p>\"Did he ever say anything about the Titanic?\"</p>\n<p>\"No.\" I looked at the card. \"He never said anything about it. Not once. Not in four months of Thursdays.\" I thought back, carefully, through every page of every transcript, the way I had been trained to. \"He's never mentioned the Carpathia. Or 1912. Nothing about where he was that April.\"</p>\n<p>Freda looked at the card, and at my face.</p>\n<p>\"Then how does the client know to ask?\"</p>\n<p>I did not answer. I sat at the kitchen table with the letter and the card side by side under the light, the steady hand and the shaking one, and the folder with the photocopy in it at my elbow, and I did not have an answer to that at all.</p>\n<p class=\"break\">&#10043;</p>\n<p>On Thursday there was a late snow, the last of the winter, probably. We had missed only two Thursdays in all that time, Thanksgiving and Christmas Eve. The gravel road was white at the edges, and the field beyond the house was white, and the old blue pickup had a clean cap of snow on its roof.</p>\n<p>He had the kettle on. He had a fire going. He looked, I thought, tired, more tired than I had seen him, and I wondered for the first time how old he really was in this life, and whether anyone looked after him when I was not there.</p>\n<p>The folder was in my bag. On the drive up I had decided that I would show him. That I would lay the photocopy on the table in front of him, the waiter's letter, <em>I am one of those you spoke of,</em> and watch his face while he read it, and that whatever his face did would tell me the thing I had not been able to decide in nineteen weeks.</p>\n<p>I set out the recorders and said the date and the time. And then, because it was how every Thursday began, and because it was the client's question and I was being paid to ask it, I took the card out of my notebook first.</p>\n<p>\"The client sent a question,\" I said. \"Monday night. By hand.\"</p>\n<p>\"Read it to me.\"</p>\n<p>I read it.</p>\n<p>\"'Please ask him about the Carpathia.'\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He did not move.</p>\n<p>That was the first thing. He had been reaching for his tea, and his hand stopped, just short of the cup. After a moment it came down and rested on the arm of the chair, and did not move again. The pencil in his other hand stopped on the notepad. His face did not change at all, and that was the second thing, because his face was always changing, always listening, always a little amused, and now it was entirely still, like a pond in the moment after the stone and before the rings.</p>\n<p>I waited. Without meaning to, I counted, the way I had counted on the tape in the autumn. Eleven seconds, that first day, after <em>1865.</em></p>\n<p>I got to forty.</p>\n<p>Then, very slowly, he looked past me, over my shoulder, at the mantel. At the empty wooden frame with its polished glass, waiting.</p>\n<p>\"Say it again,\" he said.</p>\n<p>\"'Please ask him about the Carpathia.'\" I held up the card so he could see it. \"It's in the same hand as the first letter. The one at the bottom that said 1865. But it's shakier. Like he's...\" I stopped. I did not know what I had been going to say.</p>\n<p>He looked at the card for a long time. At the handwriting. At the tremor in the long strokes.</p>\n<p>\"Ms. Barnett,\" he said. \"Did I ever say that word to you? <em>Carpathia.</em> In any session. Even once, in passing?\"</p>\n<p>\"No. I checked. Every transcript.\"</p>\n<p>\"I know you did.\" He was still looking at the card. \"I have never said it to anyone. Not in this life. I have never written it down. I have never told a soul where I was in April of 1912.\" He said it very quietly, almost wonderingly, as if he were checking it against his own memory as he spoke. \"Not one living person.\"</p>\n<p>The fire ticked in the stove. Outside, the snow had started again, very fine, drifting past the window without seeming to fall.</p>\n<p>\"Then how does he know?\" I said.</p>\n<p>He did not answer me. He sat in his chair by the woodstove, an old man in a cardigan buttoned wrong by one button, and looked at the empty frame on the mantel, and for the first time since I had known him, he looked like a man who did not know something.</p>\n<p>The folder with the photocopy in it sat in my bag on the floor by my chair, six feet from the notepad on his knee. I did not take it out. I found that I could not. Not today. Not on top of this.</p>\n<p>On the notepad, without looking down, his pencil had begun to move again. Going over something already drawn. Around, and around, and around.</p>\n<p>\"Tell your client,\" he said at last, and stopped, and began again. \"Tell your client yes.\"</p>\n<p>\"Yes, you'll tell him?\"</p>\n<p>\"Yes,\" he said. \"I was there.\" He turned from the mantel and looked at me, and something had come back into his face, something sharp and awake that I had not seen in it since the day he told me about the dress circle at Ford's. \"Next Thursday, Ms. Barnett. And bring a warmer coat.\"</p>\n<p>\"Why?\"</p>\n<p>\"Because it is very cold,\" he said, \"in the North Atlantic, in April.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>End of Book One</em></p>", "audio": false, "added": 1790603693255, "pt": [1790694240640, 1790694240640, 1790603693255, 1790603693255, 1790694240640, 1790603693255, 1790603693255, 1790810120185, 1790603693255, 1790603693255, 1790694240640, 1790603693255, 1790694240640, 1790743455739, 1790603693255, 1790603693255, 1790694240640, 1790694240640, 1790603693255, 1790603693255, 1790603693255, 1790861984290, 1790694240640, 1790603693255, 1790694240640, 1790694240640, 1790694240640, 1790857526860, 1790694240640, 1790694240640, 1790603693255, 1790694240640, 1790603693255, 1790603693255, 1790810120185, 1790694240640, 1790694240640, 1790810120185, 1790603693255, 1790694240640, 1790603693255, 1790603693255, 1790603693255, 1790603693255, 1790603693255, 1790694240640, 1790694240640, 1790694240640, 1790603693255, 1790603693255, 1790603693255, 1790694240640, 1790603693255, 1790603693255, 1790603693255]}, {"num": 33, "title": "Facts", "extra": true, "html": "<p>Lincoln stood on the parapet at Fort Stevens in July 1864, the only sitting President ever to come under enemy fire in battle.</p>\n<p>Booth's first plan was to kidnap Lincoln, not kill him, and trade him for Confederate prisoners. The attempt on March 17, 1865 failed because Lincoln changed his plans that afternoon and never came down the road.</p>\n<p>On April 10, the morning after Appomattox, Lincoln asked a crowd at the White House for \"Dixie,\" and told them the Attorney General had ruled it a lawful prize.</p>\n<p>On April 11 he spoke from a window about giving the vote to Black men, \"the very intelligent, and on those who serve our cause as soldiers.\" Booth was standing below, and is recorded as saying it would be the last speech he ever made.</p>\n<p>On April 14 Booth rode a bay mare with a white star from Pumphrey's stable, and was warned she would break her halter if left alone.</p>\n<p>That same afternoon Mrs. Surratt drove to her tavern with a package from Booth that held field glasses.</p>\n<p>Booth left his card at the Kirkwood House for Andrew Johnson: \"Don't wish to disturb you. Are you at home?\"</p>\n<p>He handed a letter to the actor John Mathews to give to the newspapers. Mathews read it and burned it.</p>\n<p>The Grants left town that afternoon. On the way to the train, a horseman galloped past their carriage and stared in. Grant later learned it was Booth.</p>\n<p>The President's guard, John Parker, was away from his post. Booth timed his shot to a laugh line in the third act.</p>\n<p>Lewis Powell got into Secretary Seward's house by claiming to bring medicine from his doctor, beat Frederick Seward with a revolver that misfired, and ran into the street shouting \"I'm mad! I'm mad!\" All five men he hurt that night lived.</p>\n<p>George Atzerodt took a room at the Kirkwood House, where the Vice President was staying, drank in the bar, and never went upstairs.</p>\n<p>Lincoln was laid diagonally across a bed too short for him in the Petersen house, and died there at twenty-two minutes past seven the next morning.</p>\n<p>Thomas Jones hid Booth in the woods for days and brought him the newspapers.</p>\n<p>Booth was shot in a burning tobacco barn on the Garrett farm. At the end he asked to see his hands and said \"Useless, useless.\"</p>\n<p>Three nights after the shooting, while detectives were in Mrs. Surratt's boarding house, Powell turned up at her door carrying a pickaxe. She said \"Before God, sir, I do not know this man.\"</p>\n<p>Louis Weichmann and John Lloyd both testified against her at the trial. President Johnson said he never saw the plea for mercy for Mrs. Surratt. const $ = (id) => document.getElementById(id);
const main = $("main");
const store = {
  get(k, d) { try { const v = localStorage.getItem("wyl." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wyl." + k, JSON.stringify(v)); } catch {} },
};

// settings
function applySize() { document.documentElement.style.setProperty("--size", store.get("size", 20) + "px"); }
function applyTheme() {
  const t = store.get("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.theme === t));
}
applySize(); applyTheme();
document.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
  store.set("size", Math.min(28, Math.max(15, store.get("size", 20) + Number(b.dataset.size)))); applySize();
});
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.theme); applyTheme(); });
$("aaBtn").onclick = (e) => { e.stopPropagation(); $("sheet").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!$("sheet").contains(e.target)) $("sheet").classList.remove("open"); });

// views
function cover() {
  const saved = store.get("pos", null);
  const c = saved && CHAPTERS.find(x => x.num === saved.ch);
  main.innerHTML = `<section class="cover">
    <div class="series">${BOOK.series} &middot; Book ${BOOK.number}</div>
    <h1>${BOOK.title}</h1>
    <div class="book">by ${BOOK.author}</div>
    <div class="star">&#10043;</div>
    <button class="begin" id="begin">${c ? "Continue reading" : "Begin"}</button>
    <button class="resume" id="toc">Contents</button>
    ${coverFixes()}
  </section>`;
  $("where").textContent = "";
  $("begin").onclick = () => go(c ? c.num : CHAPTERS[0].num, c ? saved.y : 0);
  $("toc").onclick = () => toc();
  main.querySelectorAll(".fixes [data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
}
function toc() {
  main.innerHTML = `<section class="toc"><h2>${BOOK.title}</h2><ol>${CHAPTERS.map(c =>
    `<li><button data-ch="${c.num}"><span class="n">${c.extra ? "" : c.num}</span><span>${c.title}</span>${badge(c)}</button></li>`).join("")}</ol></section>`;
  main.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => go(Number(b.dataset.ch), 0));
  $("where").textContent = "Contents";
  history.replaceState(null, "", "#contents");
  window.scrollTo(0, 0);
}
function go(num, y) {
  const i = CHAPTERS.findIndex(c => c.num === num);
  if (i < 0) return cover();
  const c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  main.innerHTML = `<article class="chapter${c.extra ? " extra" : ""}">
    <header><div class="num">${c.extra ? "" : "Chapter " + c.num}</div><h2>${c.title}</h2>${c.audio ? `<button class="listen" id="listenBtn">&#9654;&nbsp; Listen</button>` : ""}</header>
    <div id="fixbarSlot"></div>
    ${c.html}
    ${next ? "" : `<p class="end">More chapters to come.</p>`}
    <nav class="nav">
      ${prev ? `<button data-go="${prev.num}"><small>Previous</small>${prev.title}</button>` : ""}
      ${next ? `<button class="next" data-go="${next.num}"><small>Next</small>${next.title}</button>` : ""}
    </nav></article>`;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(Number(b.dataset.go), 0));
  addPens(c.num);
  markFixes(c);
  listenHook(c, next);
  voicePicker(c);
  $("where").textContent = c.extra ? c.title : `${c.num}. ${c.title}`;
  history.replaceState(null, "", "#ch" + c.num);
  store.set("pos", { ch: c.num, y: y || 0 });
  requestAnimationFrame(() => window.scrollTo(0, (y || 0) * (document.body.scrollHeight - innerHeight)));
  onScroll();
}
$("homeBtn").onclick = () => toc();
// Tom's voice audition (author only, chapter 2): tap a number to hear a 4-second line.
const VOICES = ["Onyx", "Onyx, slower", "Eric", "Adam", "Liam", "Echo", "Fenrir", "Puck", "Onyx + Michael", "Onyx + Eric",
  "George (British)", "Lewis (British)", "Daniel (British)", "Fable (British)", "Michael (current)",
  "Lewis, American", "9 + Lewis, American", "Lewis + Onyx, American, slower",
  "NEW model: its own voice", "NEW model: in 9's voice", "NEW model: 9's voice, calmer", "TURBO new model: 9's voice"];
const vClip = new Audio();
function voicePicker(c) {
  if (!CKEY || c.num !== 2) return;
  const box = document.createElement("div");
  box.className = "voices";
  box.innerHTML = `<div class="vt">Tom's voice: tap to hear</div>` + VOICES.map((v, i) =>
    `<button data-v="${i + 1}" title="${v}">${i + 1}</button>`).join("") + `<div class="vn" id="vName">&nbsp;</div>`;
  main.querySelector(".chapter header").appendChild(box);
  box.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    box.querySelectorAll("[data-v]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    $("vName").textContent = `${b.dataset.v}. ${VOICES[b.dataset.v - 1]}`;
    vClip.src = `audio/samples/tom/s${b.dataset.v}.mp3`;
    vClip.play();
  });
}

// Narration: one mp3 per chapter (audio/chNN.mp3) + audio/chNN.json, the start time of each paragraph.
// The paragraph being read is highlighted and kept on screen; at the end it carries on into the next chapter.
const player = document.createElement("div");
player.id = "player";
player.innerHTML = `<button id="pBack" aria-label="Back 15 seconds">&#8634;</button><button id="pPlay" aria-label="Play or pause">&#10074;&#10074;</button>
  <button id="pFwd" aria-label="Forward 15 seconds">&#8635;</button><span class="t" id="pTime"></span><button id="pStop" aria-label="Stop">&#10005;</button>`;
document.body.appendChild(player);
const audio = new Audio();
audio.preload = "auto";
let aCh = null, aMarks = [], aNext = null, aFollow = true, lastPara = -1;
const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function paraEls() { return [...main.querySelectorAll(".chapter > p:not(.end)")]; }
function listenHook(c, next) {
  if (aCh !== c.num && !audio.paused) audio.pause();
  if (aCh !== c.num) { player.classList.remove("on"); lastPara = -1; }
  const b = $("listenBtn");
  if (b) b.onclick = () => startListen(c, next);
  if (aCh === c.num) aNext = next;
}
async function startListen(c, next, fromStart) {
  if (aCh !== c.num) {
    aCh = c.num; aNext = next; lastPara = -1;
    const nn = String(c.num).padStart(2, "0");
    try { aMarks = (await (await fetch(`audio/ch${nn}.json?v=${BUILD}`)).json()).paras; } catch (e) { aMarks = []; }
    audio.src = `audio/ch${nn}.mp3?v=${BUILD}`;
    const saved = store.get("listen", null);
    audio.currentTime = !fromStart && saved && saved.ch === c.num ? saved.t : 0;
  }
  aFollow = true;
  player.classList.add("on");
  audio.play();
}
audio.addEventListener("play", () => $("pPlay").innerHTML = "&#10074;&#10074;");
audio.addEventListener("pause", () => $("pPlay").innerHTML = "&#9654;");
audio.addEventListener("timeupdate", () => {
  const t = audio.currentTime;
  $("pTime").textContent = `${fmtT(t)} / ${fmtT(audio.duration || 0)}`;
  store.set("listen", { ch: aCh, t });
  let i = -1;
  for (let k = 0; k < aMarks.length; k++) if (aMarks[k] <= t + 0.1) i = k; else break;
  if (i === lastPara) return;
  lastPara = i;
  const ps = paraEls();
  ps.forEach(p => p.classList.remove("reading"));
  const p = ps[i];
  if (!p) return;
  p.classList.add("reading");
  if (aFollow) {
    const r = p.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 90) window.scrollTo(0, window.scrollY + r.top - innerHeight * 0.25);
  }
});
audio.addEventListener("ended", () => {
  store.set("listen", { ch: aCh, t: 0 });
  if (aNext && aNext.audio) { const n = aNext; aCh = null; go(n.num, 0); startListen(n, CHAPTERS[CHAPTERS.indexOf(n) + 1], true); }
  else player.classList.remove("on");
});
$("pPlay").onclick = () => audio.paused ? (aFollow = true, audio.play()) : audio.pause();
$("pBack").onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 15);
$("pFwd").onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
$("pStop").onclick = () => { audio.pause(); player.classList.remove("on"); paraEls().forEach(p => p.classList.remove("reading")); lastPara = -1; };
// scrolling by hand stops the page from following until play is pressed again
window.addEventListener("touchmove", () => { if (!audio.paused) aFollow = false; }, { passive: true });
window.addEventListener("wheel", () => { if (!audio.paused) aFollow = false; }, { passive: true });


// progress, save place, hide bar while reading down
let lastY = 0;
function onScroll() {
  const max = document.body.scrollHeight - innerHeight;
  const frac = max > 0 ? scrollY / max : 0;
  const reading = !!main.querySelector(".chapter");
  $("progress").style.width = reading ? (frac * 100) + "%" : "0";
  if (reading) { const p = store.get("pos", null); if (p) store.set("pos", { ch: p.ch, y: frac }); }
  $("bar").classList.toggle("hide", scrollY > lastY && scrollY > 80);
  lastY = scrollY;
}
addEventListener("scroll", onScroll, { passive: true });


// ---- paragraph comments (only for whoever opened the page with ?c=<key>) ----
const API = "https://api.jobhubgo.com/api/yam/";
(function () { const k = new URLSearchParams(location.search).get("c"); if (k) store.set("ckey", k); })();
const CKEY = store.get("ckey", null);
let comments = [];
async function loadComments() {
  if (!CKEY) return;
  try { const r = await fetch(API + CKEY); const j = await r.json(); comments = (j.data && j.data.comments) || []; } catch {}
  markPens();
}
async function saveComments(mutate) {
  // Re-read, apply, write; retry once if someone else wrote in between.
  for (let i = 0; i < 2; i++) {
    let cur = [];
    try { const j = await (await fetch(API + CKEY)).json(); cur = (j.data && j.data.comments) || []; } catch {}
    const next = mutate(cur.slice());
    try {
      const r = await fetch(API + CKEY, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: { comments: next }, updatedAt: Date.now() }) });
      const j = await r.json();
      if (j.ok) { comments = next; markPens(); return true; }
    } catch {}
  }
  return false;
}
function markPens() {
  document.querySelectorAll(".pen").forEach(b => {
    b.classList.toggle("has", comments.some(c => c.ch === Number(b.dataset.ch) && c.p === Number(b.dataset.p)));
  });
}
function addPens(chNum) {
  if (!CKEY) return;
  main.querySelectorAll(".chapter p:not(.break):not(.end)").forEach((p, i) => {
    const text = p.textContent.trim();
    const b = document.createElement("button");
    b.className = "pen"; b.textContent = "✎"; b.dataset.ch = chNum; b.dataset.p = i;
    b.setAttribute("aria-label", "Comment on this paragraph");
    b.onclick = (e) => { e.stopPropagation(); openCmt(chNum, i, text); };
    p.appendChild(b);
  });
  markPens();
}
let cmtAt = null;
function renderOld() {
  const mine = comments.filter(c => c.ch === cmtAt.ch && c.p === cmtAt.p);
  $("cmtOld").innerHTML = mine.map(c => `<div class="old"><span></span><button data-id="${c.id}">Delete</button></div>`).join("");
  $("cmtOld").querySelectorAll(".old span").forEach((el, i) => el.textContent = mine[i].text);
  $("cmtOld").querySelectorAll("button").forEach(b => b.onclick = async () => {
    $("cmtStatus").textContent = "Deleting...";
    await saveComments(cur => cur.filter(c => c.id !== b.dataset.id));
    $("cmtStatus").textContent = ""; renderOld();
  });
}
function openCmt(ch, p, text) {
  if (staleV) { showStale(); return; }
  cmtAt = { ch, p, quote: text.slice(0, 80) };
  $("cmtQuote").textContent = "“" + text.slice(0, 90) + (text.length > 90 ? "...”" : "”");
  $("cmtText").value = ""; $("cmtStatus").textContent = "";
  renderOld();
  $("cmt").classList.add("open");
}
$("cmtClose").onclick = () => $("cmt").classList.remove("open");
$("cmtSave").onclick = async () => {
  const text = $("cmtText").value.trim();
  if (!text) return;
  $("cmtStatus").textContent = "Saving...";
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ch: cmtAt.ch, p: cmtAt.p,
              quote: cmtAt.quote, text, at: new Date().toISOString(), v: BUILD };
  const ok = await saveComments(cur => cur.concat([c]));
  if (ok) { $("cmtText").value = ""; $("cmtStatus").textContent = "Saved"; renderOld(); }
  else $("cmtStatus").textContent = "Didn't save, try again";
};

// ---- fixed since you last looked (pencil readers only) ----
// Each paragraph carries the build time its text last changed (c.pt). "seen" is, per chapter,
// the newest change the reader has acknowledged. A chapter they've never opened is NEW.
// "seen" is kept per review round, so starting a round (or moving it back) shows its boxes fresh on every device.
const SEEN_KEY = "seen-" + ROUND;
function seenAt(num) { return store.get(SEEN_KEY, {})[num] || ROUND - 1; }
function setSeen(num, t) { const s = store.get(SEEN_KEY, {}); s[num] = Math.max(s[num] || 0, t); store.set(SEEN_KEY, s); }
function isFix(c, t) { return t >= ROUND && t > Math.max(seenAt(c.num), c.added); }
function fixCount(c) { return c.pt.filter(t => isFix(c, t)).length; }
function isNew(c) { return c.added > seenAt(c.num); }
function badge(c) {
  if (!CKEY) return "";
  if (isNew(c)) return `<span class="tag new">New</span>`;
  const n = fixCount(c);
  return n ? `<span class="tag">${n} fixed</span>` : "";
}
function coverFixes() {
  if (!CKEY) return "";
  const fixed = CHAPTERS.filter(c => !isNew(c) && fixCount(c));
  const fresh = CHAPTERS.filter(isNew);
  if (!fixed.length && !fresh.length) return "";
  const list = (cs) => cs.map(c => `<button data-ch="${c.num}">${c.extra ? c.title : "Ch " + c.num}</button>`).join("");
  return `<div class="fixes">${fixed.length ? `<div><span class="tag">Fixed</span> ${list(fixed)}</div>` : ""}
    ${fresh.length ? `<div style="margin-top:.5em"><span class="tag new">New</span> ${list(fresh)}</div>` : ""}</div>`;
}
function markFixes(c) {
  if (!CKEY) return;
  if (isNew(c)) { setSeen(c.num, c.added); return; }  // a new chapter is all new; nothing to box
  const ps = [...main.querySelectorAll(".chapter p:not(.break):not(.end)")];
  const boxed = ps.filter((p, i) => isFix(c, c.pt[i]));
  if (!boxed.length) return;
  boxed.forEach(p => { p.classList.add("fixed"); const t = document.createElement("span"); t.className = "tag"; t.textContent = "Fixed"; p.prepend(t); });
  const slot = $("fixbarSlot");
  slot.innerHTML = `<div class="fixbar"><b>${boxed.length} paragraph${boxed.length > 1 ? "s" : ""} changed in the latest round of fixes, boxed in green.</b>
    <button id="fixNext">Show me &darr;</button><button class="done" id="fixDone">Got it, clear the boxes</button></div>`;
  let at = 0;
  $("fixNext").onclick = () => { boxed[at % boxed.length].scrollIntoView({ block: "center" }); at++; };
  $("fixDone").onclick = () => {
    setSeen(c.num, Math.max(...c.pt));
    boxed.forEach(p => { p.classList.remove("fixed"); const t = p.querySelector(":scope > .tag"); if (t) t.remove(); });
    slot.innerHTML = "";
  };
}

// ---- this page is out of date ----
let staleV = 0;
function showStale() { $("stale").classList.add("open"); }
$("staleGo").onclick = () => {
  const q = new URLSearchParams(location.search); q.delete("c"); q.set("v", staleV || Date.now());
  location.replace(location.pathname + "?" + q + location.hash);
};
$("staleLater").onclick = () => $("stale").classList.remove("open");
async function checkVersion() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const j = await r.json();
    if (j.v > BUILD) { const first = !staleV; staleV = j.v; if (first) showStale(); }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
addEventListener("focus", checkVersion);
setInterval(checkVersion, 3 * 60 * 1000);
checkVersion();

// start
const h = location.hash;
if (h.startsWith("#ch")) go(Number(h.slice(3)), 0);
else if (h === "#contents") toc();
else cover();
loadComments();
</script>
