p>\n<p>On Thursday I set out the recorders, said the date and the time, and read him the question.</p>\n<p>\"The National,\" he said. \"Yes. Many times.\"</p>\n<p>He did not look at the mantel this time. He looked at me, and for a moment I had the feeling that he was deciding something. Then he smiled and settled back.</p>\n<p>\"Tell your client yes,\" he said. \"And I'll tell you about it. I think it's what he wants to hear.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>March 1865</em></p>\n<p class=\"tape\">The National Hotel was the kind of place where a farm boy with a cane was invisible, and I was glad of it.</p>\n<p class=\"tape\">It took up most of a block. It had a great lobby with marble floors and brass spittoons and a gallery around the top where ladies could look down on the men without being looked at, and a barbershop and a telegraph office and a bar that never closed. Half the Congress seemed to live there. So did a good many people who wished the Congress would go home to their states and stay there. It had always been a Southern sort of hotel. Before the war the planters had stayed there when they came to Washington, and some of their friends still did, and in the bar you could hear things said about the President, in low voices, that would have got a man arrested in most of the city.</p>\n<p class=\"tape\">Booth held court there like a prince. He knew every clerk and every porter by name. He tipped them all too much. When he came down the stairs, people turned to look, and he let them, and pretended not to notice. He had a way of standing in that lobby with one hand on the newel post that I think he had learned on a stage.</p>\n<p class=\"tape\">I went there to bring him the bridge. Every week or so I would come up Pennsylvania Avenue from the Navy Yard, with my lumber merchant's invoices folded in my coat, and ask for Mr. Booth at the desk, and he would come down and take me into the dining room and order me a dinner I could not have paid for in a month. And while I ate, I told him what the guards had done that week, in a low voice, and he listened and smiled and said <em>good, good,</em> and ordered another bottle.</p>\n<p class=\"tape\">It was on my third or fourth visit that I noticed the bill of fare.</p>\n<p class=\"tape\">It was a card on the table, the day's dishes written out by hand. Most hotels printed them. The National's were written fresh every morning, and whoever wrote them had the most beautiful hand I had seen in that life: even and flowing and perfectly clear, with long, looping capitals, the kind of writing that was taught in the best schools and hardly anyone ever mastered. I remember that I picked it up and turned it to the light, the way you pick up a good piece of workmanship.</p>\n<p class=\"tape\">\"Isn't it something,\" Booth said. \"The headwaiter says it's one of the new men. He won't tell me which. He says if the guests find out, they'll all want letters written, and he'll never see the man again.\" He laughed. \"I told him I'd pay double for a love letter in that hand. I could use one.\"</p>\n<p class=\"tape\">I put the card down. But I did not forget it.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I saw Damon a few minutes later.</p>\n<p class=\"tape\">He came through the door from the kitchen with a tray on his shoulder, in the white jacket that all the National's waiters wore, and he walked the length of the dining room and set down four plates at a table by the window without a sound, and turned, and saw me.</p>\n<p class=\"tape\">It was a small thing. Nobody else in that room would have noticed it. His step did not change and his face did not change. But his eyes went to me, and stopped, and I watched them take me in the way they had taken in Lottie's newspaper that afternoon in the kitchen yard: quickly, the whole of me at once. My cane. My good coat, which Booth had paid for. The ink on my fingers from the lumber merchant's invoices. And the man across the table from me, laughing, with his hand on a bottle of wine.</p>\n<p class=\"tape\">Then he looked away, and went back through the kitchen door, and was gone.</p>\n<p class=\"tape\">\"Somebody you know?\" Booth said. He noticed everything that had to do with faces.</p>\n<p class=\"tape\">\"A man who used to work on our farm.\"</p>\n<p class=\"tape\">\"Ah.\" Booth lost interest at once. \"Well, he's done better for himself than most of them. The National doesn't take just anybody.\"</p>\n<p class=\"tape\">Damon came back to our table twenty minutes later, to clear the plates. Booth was talking, as he always was, and he did not look up. The waiters at the National were not people to him. They were a kind of weather that brought food.</p>\n<p class=\"tape\">I looked up. I said, quietly, \"Damon.\"</p>\n<p class=\"tape\">He stopped, with my plate in his hand. For a moment I thought he would not answer me at all. Then he did.</p>\n<p class=\"tape\">\"M-Mister. K-Keene.\"</p>\n<p class=\"tape\">It took him a long time. The first sound stuck, and he waited for it with his jaw set, patiently, the way you wait for a stiff door, and then pushed it through. I had not known. On the farm I had never heard him say more than a handful of words at a time. I had thought that was caution, or the habit of that place. Some of it had been. Some of it, I understood now, sitting there, was this.</p>\n<p class=\"tape\">\"Is Miss L-Lottie well?\" he said.</p>\n<p class=\"tape\">It was the last thing I expected him to ask. I think it was the only thing he could have asked that I would have answered without thinking.</p>\n<p class=\"tape\">\"She's well,\" I said. \"She reads too much.\"</p>\n<p class=\"tape\">Something happened at the corner of his mouth that on another man would have been the start of a smile. \"She alw-ways did.\"</p>\n<p class=\"tape\">He did not ask about my mother. He picked up the rest of the plates, and went away with them, and he did not come back to our table again that night. Another waiter brought the coffee.</p>\n<p class=\"tape\">I had it before the coffee came. One of the new men, the headwaiter had said, and would not say which. A hand that had been taught, and taught well, and practiced for years. And a man I had watched in a kitchen yard reading a newspaper faster than I could, and hiding it, who had come to Washington four months ago and walked straight into the best hotel in the city. It was not a hard sum. Damon wrote the bills of fare.</p>\n<p class=\"tape\">I was right about that. What I made of it was the likely thing: that somebody had taught him as a boy, in secret, at a risk to both of them I did not like to think about, and that he had hidden it for twenty years on our farm and was only now, in a free city, letting it show a little, on a card nobody would ever connect to him. It was even partly true.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I saw him every time I went to the National after that. I made a point of it. I told myself it was only habit, that I always want to see.</p>\n<p class=\"tape\">He was always busy and always silent, a tall man in a white jacket at the edge of the room, never quite looking at anyone. Guests talked in front of him as if he were a chair. And I saw, because I was watching, that he was listening to every word of it.</p>\n<p class=\"tape\">He listened most of all to Booth.</p>\n<p class=\"tape\">I could hardly blame him. Booth was not a quiet man, in the dining room of the National, with a bottle in him. He said things about the President, in front of me and anyone else who happened to be near, that I will not repeat to you. He said them in the beautiful voice he had been trained to use in the largest theaters in America, and he laughed afterward, and the men at the tables around us laughed too, or pretended not to hear. Once, when he said something about what should be done with the President's new friends, the freedmen, Damon was pouring water at the next table. I watched the water stop. Only for a second. Then it went on pouring, and the glass filled, and Damon moved to the next one.</p>\n<p class=\"tape\">I thought I understood that. A man who had been freed four months before, by a vote of a few hundred in a state that did not want to free him, standing in a room full of men who wished he were not free, and listening to the most famous of them talk. Of course he listened. In his place I would have listened too. I would have remembered every face in that room.</p>\n<p class=\"tape\">What I did not think about, not once, was what he made of me. The Keene boy, who had come back from the war different, whom he had watched all that summer and fall and not liked what he saw. Sitting now at John Wilkes Booth's own table, in a coat Booth had bought him, talking low, with papers in his pocket.</p>\n<p class=\"tape\">He had known Kit Keene all his life, and had watched the one who came home from the war for four months, and he had never, I think, had any reason to believe a single good thing about either of them.</p>\n<p class=\"tape\">I did not think about any of that. My mind was on the bridge, and the guards, and what I would tell Booth the next time I came.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there, and was quiet for a while.</p>\n<p>\"The menus,\" I said. \"The handwriting.\"</p>\n<p>\"Yes?\"</p>\n<p>\"You worked it out that night. That it was him.\"</p>\n<p>\"Before the coffee came.\"</p>\n<p>\"Then what did you get wrong?\" I looked at my notes. \"You said it was partly true.\"</p>\n<p>He looked down at his notepad, and his pencil moved a little, going over something already drawn.</p>\n<p>\"The likely answer is nearly always the right one,\" he said. \"That's what makes it dangerous. You stop looking the moment you have it.\" He smiled slightly. \"I had it. So I stopped looking.\"</p>\n<p>On the drive home I tried to think of a way to check the handwriting on a bill of fare at a hotel that had been torn down eighty years ago, and could not think of one, and was annoyed with myself for trying.</p>", "audio": false, "added": 1790567995024, "pt": [1790567995024, 1790567995024, 1790694240640, 1790567995024, 1790694240640, 1790694240640, 1790694240640, 1790567995024, 1790694240640, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790595815550, 1790567995024, 1790567995024, 1790604858193, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790595815550, 1790861984290, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790567995024, 1790604858193, 1790709253842, 1790718282701, 1790694240640, 1790567995024, 1790595815550, 1790595815550, 1790694240640, 1790595815550, 1790595815550, 1790694240640]}, {"num": 12, "title": "The Seventeenth", "extra": false, "html": "<p>It rained the whole way up. By the time I reached the gravel road it had settled into the steady kind of rain that meant it was not going to stop, and he met me on the porch with an umbrella big enough for three people and walked me in under it.</p>\n<p>I had my researcher card now. On Monday morning I had sat in a basement room at the National Archives, watching a video about how to handle old paper, and come out with a laminated card and a terrible photograph of myself. The reel I needed was kept in the stacks and had to be pulled for me. It would be ready the next Tuesday.</p>\n<p>I did not tell him any of that. I set out the two recorders and said the date and the time, and then said, \"March the seventeenth.\"</p>\n<p>\"You looked it up.\"</p>\n<p>\"Anyone who reads about the kidnap plot finds it. It's the day it was supposed to happen.\"</p>\n<p>\"Yes,\" he said. He was quiet a moment, listening to the rain. Then he picked up his pencil. \"I spent it under a bridge.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>March 17, 1865</em></p>\n<p class=\"tape\">Booth's note came to the lumber yard at ten in the morning, carried by a boy who would not wait for an answer. It said, in his big, careless hand, <em>This afternoon. Your post. Bring the second horse.</em></p>\n<p class=\"tape\">That was all. That was all it needed to say.</p>\n<p class=\"tape\">The President was to drive out that afternoon to Campbell Hospital, on the edge of the city to the north, to see a play performed for the wounded. Booth and the others would wait on the road near the hospital. When the carriage came, they would stop it, and take the reins, and one of them would climb inside with the President and keep him quiet, and they would drive south through the city as fast as the horses would go, and cross the Eastern Branch at the Navy Yard Bridge, and be into Maryland before anybody understood what had happened. Herold had gone on ahead, down the county road, to wait for them with what they would need.</p>\n<p class=\"tape\">My post was the bridge.</p>\n<p class=\"tape\">I was to be waiting on the far side, the Maryland side, with a fresh horse on a lead. When the carriage came across, I was to take them off the main road at once, onto the back ways I had drawn for Booth on tobacco receipts in December, the ridge road and the farm lanes and the long way around the swamp, where no cavalry patrol would think to look for a carriage. By morning we would be at the river.</p>\n<p class=\"tape\">I borrowed the second horse from the family I lodged with. I told them Booth wanted to buy it and would pay tomorrow. And a little after one o'clock, I led it across the Navy Yard Bridge, past the bored sentry, who did not even look at me, and found a place on the far bank, under the trees at the edge of the road, where I could see the whole length of the bridge and anyone coming across it.</p>\n<p class=\"tape\">And I waited.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I have waited for a great many things, in a great many lives. I have waited for battles and for births, and for ships that did not come, and once for three days in a cellar for a city to stop burning over my head. Waiting does not get easier. You would think it might. It only gets more familiar, the way a bad tooth does.</p>\n<p class=\"tape\">The afternoon went on. Wagons came across the bridge from the city, and the sentry waved them through, and I watched every one. Carts, a farmer's wagon full of empty barrels, two officers on horseback, a hearse. Every time I heard wheels on the planks, my heart went up into my throat and stayed there until I saw what it was.</p>\n<p class=\"tape\">I tried to imagine it. I could not stop trying. The road by the hospital. The carriage slowing for the mud. Powell's great hand on the bridle. The tall man inside, in his black coat, looking up in surprise as the door opened. Frightened, badly, for some weeks. That was the trade I had made in the barn, in my own head. Fifty thousand men home, against one stubborn man frightened for some weeks.</p>\n<p class=\"tape\">I had not let myself imagine his face before. Sitting under those trees, I found I could not stop.</p>\n<p class=\"tape\">Three o'clock. The guard changed at the far end of the bridge, exactly when I had written down that it would.</p>\n<p class=\"tape\">The new sentry noticed me. The old one never had. This one was young, and his uniform still had the creases from being folded, and he walked the length of the bridge twice, looking at the trees where I sat. On the third time he came off the end of it and down the bank toward me with his rifle across his body, and I understood that a man who has been sitting under a tree for two hours with a second horse, saddled, on a lead, is a man a new sentry is going to ask about.</p>\n<p class=\"tape\">I had perhaps thirty seconds while he came down the bank. I used them to read him.</p>\n<p class=\"tape\">New uniform, so new to the army. A new man wants to be seen doing his job. He came toward me instead of calling out, so he was not frightened, only curious and a little proud of himself. His boots were caked to the ankle in red clay, so he had walked out that morning from the camp on the Maryland side, where the roads were worse than ours. And he had a good farm boy's walk, flat-footed, and when he passed my horse he ran his hand down its neck without thinking about it. He was from the country. He had horses at home. He missed them.</p>\n<p class=\"tape\">\"What's the other horse for?\" he said.</p>\n<p class=\"tape\">I did not tell him I was waiting for anyone. A man who says he is waiting for someone is asked who. I told him the horse was lame, and let him look.</p>\n<p class=\"tape\">He crouched and picked up the off foreleg, the way I had known he would, because he had horses at home, and he found the stone I had wedged between the shoe and the frog an hour before, because I knew the guard changed at three, and a fresh man looks at everything. He dug it out with his thumbnail and held it up and looked at me as if I were a fool.</p>\n<p class=\"tape\">\"I didn't have a pick,\" I said. \"I was letting her rest it. My brother'll kill me if she's lamed. It's his.\"</p>\n<p class=\"tape\">He laughed, and put the stone in my hand, and told me to walk her slow for a mile and she'd be fine, and went back up the bank to his bridge feeling that he had done his job, and a kindness besides.</p>\n<p class=\"tape\">That should have been the end of it. It would have been, if I had walked her slow for a mile. I did not. I could not leave my post. So I led her a little way down the road, where he could see me do it, and then back again, and sat down under the same trees.</p>\n<p class=\"tape\">Four o'clock. He noticed. He walked the bridge, and at the end of it he stopped, and looked down the bank at me for a long moment, and walked back. At half past four he did it again. The third time, he came down.</p>\n<p class=\"tape\">\"Thought you were walking her home,\" he said.</p>\n<p class=\"tape\">\"I'm waiting for my brother,\" I said. It was the one answer I had promised myself I would not give, and I heard myself give it. \"She's his horse. He's coming out from the city with the wagon. I'm not to go home without him.\"</p>\n<p class=\"tape\">\"What's his name?\"</p>\n<p class=\"tape\">\"Tom.\"</p>\n<p class=\"tape\">\"Tom what?\"</p>\n<p class=\"tape\">\"Tom Kelly,\" I said, which was the first name that came, and belonged to nobody.</p>\n<p class=\"tape\">He looked at me, and at the horse, and up the road toward the city. He was not a fool. He was only young.</p>\n<p class=\"tape\">\"Bridge closes going south at nine,\" he said. \"Orders. If your brother's not across by then, the both of you can sleep on that side.\" And he went back up the bank, and this time, when he walked his bridge, he looked at me every time he turned.</p>\n<p class=\"tape\">Five o'clock. The light began to go.</p>\n<p class=\"tape\">And then I heard it. Heavy wheels, a long way off on the city side, coming fast, faster than anything had come all afternoon, and horses ahead of them. I was on my feet before I knew it. A closed carriage came onto the far end of the bridge, black, with its curtains drawn, and two riders in front of it, and it did not slow down for the sentry.</p>\n<p class=\"tape\">It was exactly what I had been told to wait for. My hands went to the lead rope and got the knot wrong, twice. I could hear my own heart over the wheels. I remember thinking, very clearly, that the man inside that carriage was about to look out through the curtain and see me, and that I would be the first face he saw in his new life as a prisoner, and that I had not decided what my face would do.</p>\n<p class=\"tape\">The riders were in blue. That was the first thing. Booth's men would not be riding ahead of it in Union blue. They were cavalry, with their sabers, riding easy, as if they had every right to the road, and the sentry did not stop them because he was saluting. The carriage came off the end of the bridge and past me close enough to touch, and the curtain swung open with the jolt, and inside there was a surgeon in a bloody apron, holding a lamp over a man on a stretcher.</p>\n<p class=\"tape\">An ambulance, going out to the camp on the Maryland side. That was all.</p>\n<p class=\"tape\">I sat down again under the trees, because my leg would not hold me, and the sentry at the end of the bridge watched me do it.</p>\n<p class=\"tape\">It was nearly dark when a single rider came across the bridge at a hard trot, and my heart went up again, and then I saw that it was John Surratt, alone.</p>\n<p class=\"tape\">He did not stop. He slowed only enough to lean down from the saddle as he passed, and I saw his face in the last of the light. He looked like a boy who had been slapped.</p>\n<p class=\"tape\">\"He never came,\" John said. \"He never came near the place. He went to the National instead.\" His voice cracked on it. \"Go home, Keene. It's blown. Go home.\"</p>\n<p class=\"tape\">And he kicked his horse on, south down the dark road toward Surrattsville, and was gone.</p>\n<p class=\"tape\">\"That your brother?\" the sentry called down from the end of the bridge.</p>\n<p class=\"tape\">\"No,\" I said. \"A neighbor. My brother's not coming.\" And I led the borrowed horse up the bank and back across the bridge toward the city, under his eyes, at a walk, the way an honest man walks, and I did not look back once. It was the longest walk of that day.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I did not go home.</p>\n<p class=\"tape\">I should have. Everything that was sensible in me said so. Instead I led that borrowed horse on through the streets of the Navy Yard, and up through the city toward Pennsylvania Avenue, because I had to know. I always have to know. It was more than a mile, and my leg had stiffened from the waiting, and I did not care.</p>\n<p class=\"tape\">It was full dark by the time I reached the National. The street in front of it was still busy: soldiers, a great many of them, in a cheerful mood, and people coming away from something that was over. I asked a newsboy what had happened.</p>\n<p class=\"tape\">A regiment from Indiana, he told me, had captured a rebel flag at some fort in North Carolina, and today they had presented it to the governor of Indiana, who was staying at the National. And the President had come to see it done. He had come instead of going to some hospital, the boy said, because the governor was a friend of his. And at four o'clock he had come out on the balcony, right up there, and made a speech.</p>\n<p class=\"tape\">At four o'clock, I had been sitting under the trees by the Navy Yard Bridge, imagining his face.</p>\n<p class=\"tape\">I went around to the side of the hotel, where the kitchen was. I do not know why. I think I already knew who I would find there.</p>\n<p class=\"tape\">There were four or five of the waiters outside the kitchen door, in their white jackets, taking the air on their break, talking in low voices. They were talking about the President. I could hear it in the way they were standing before I could hear a word. Something had happened to them that afternoon, all of them, and they were still standing in the middle of it.</p>\n<p class=\"tape\">Damon was among them. He was not talking. He was listening to the others, with his arms folded, and his face in the light from the kitchen door was a face I had never seen him wear. On the farm it had always been shut. Tonight it was open. It was the face of a man who had heard something he had waited his whole life to hear said out loud.</p>\n<p class=\"tape\">Then he looked past the others and saw me.</p>\n<p class=\"tape\">I knew what he saw. I have thought about it many times since. A man he knew to keep company with John Wilkes Booth, standing in the dark at the side of Booth's own hotel, on the night the President had come there. Mud to the knees. The clay of the Maryland side on his boots, from a riverbank, not from any street in the city. Sweat on his face, in March. And a saddled horse on a lead beside him, fresh, with nobody to ride it.</p>\n<p class=\"tape\">A horse for someone who had not come.</p>\n<p class=\"tape\">His face closed. It closed the way I had seen it close in the kitchen yard, when he heard my crutch on the step: smoothly, completely, like a door.</p>\n<p class=\"tape\">He said something to the others, and they went in. He did not. He came a few steps toward me, into the edge of the light, and stopped.</p>\n<p class=\"tape\">\"The P-President was here,\" he said. \"This afternoon.\"</p>\n<p class=\"tape\">\"I heard.\"</p>\n<p class=\"tape\">\"He sp-spoke. From the b-balcony. About the rebels, and their p-plan to make soldiers out of their slaves.\" He looked at me steadily. \"D-do you want to know what he said?\"</p>\n<p class=\"tape\">I did not answer. He told me anyway.</p>\n<p class=\"tape\">\"'I have always thought that all men should be free; but if any should be slaves, it should be first those who desire it for themselves, and secondly those who desire it for others. Whenever I hear any one arguing for slavery, I feel a strong impulse to see it tried on him personally.'\"</p>\n<p class=\"tape\">He said it all the way through without a single stumble. Every word. As clear as a bell, as if he were reading it off the page. I learned long after, from men who knew about such things, that it is often that way: that a man who cannot get his own words out can sometimes say another man's perfectly, all in one breath, as if they were a song.</p>\n<p class=\"tape\">He had heard it once, from the street below a balcony, a few hours before. And he had it word for word.</p>\n<p class=\"tape\">\"G-good night, Mister Keene,\" he said. And he went back in through the kitchen door, and shut it.</p>\n<p class=\"tape\">I stood there in the dark with the borrowed horse for a long time.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">It fell apart after that, the way those things do, all at once and then slowly.</p>\n<p class=\"tape\">Arnold and O'Laughlen went home to Baltimore within the week. Arnold wrote Booth a letter at the end of the month, telling him to wait, to go and see how Richmond felt about it first, to do nothing rash. I did not know about that letter then. Everyone in the country knew about it a month later. The police found it in Booth's trunk.</p>\n<p class=\"tape\">John Surratt rode south to Richmond on some errand of his own and was gone for more than a week. Atzerodt went back to drinking. Powell went back to wherever Powell went. Booth raged for a few days, and then went quiet, and then left the city for a while.</p>\n<p class=\"tape\">I went back to the lumber merchant's invoices, and told myself it was over.</p>\n<p class=\"tape\">My mother's letter that week ended the way they all did. <em>Not yet.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>He put the pencil down.</p>\n<p>I knew that line. I had seen it before, printed large on a museum wall somewhere, one of those quotations they hang over a doorway. I had read it a dozen times and never once thought about who had been standing in the street when it was said.</p>\n<p>\"How do you know it word for word?\" I asked. \"It's famous. It's the kind of thing people put on posters.\"</p>\n<p>\"I didn't learn it from a poster,\" he said. \"But that wasn't the point of the story.\"</p>\n<p>\"What was the point?\"</p>\n<p>He looked at the window, at the rain running down it.</p>\n<p>\"He had heard the President of the United States say it,\" he said. \"Out loud. In the street, in front of everyone, about men like him. And I had spent that same afternoon sitting under a bridge, waiting to steal the man who said it.\"</p>", "audio": false, "added": 1790568656957, "pt": [1790694240640, 1790694240640, 1790694240640, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790595815550, 1790595815550, 1790709253842, 1790604858193, 1790595815550, 1790595815550, 1790604858193, 1790595815550, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790709253842, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790709253842, 1790709253842, 1790568656957, 1790709253842, 1790861984290, 1790568656957, 1790568656957, 1790568656957, 1790861984290, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790568656957, 1790604858193, 1790568656957, 1790568656957, 1790568656957, 1790709253842, 1790718282701, 1790718282701, 1790568656957, 1790568656957, 1790568656957]}, {"num": 13, "title": "The Register", "extra": false, "html": "<p>The National Archives building on Pennsylvania Avenue looks like a bank that has decided to become a temple. I had driven past it most of my life. On Tuesday morning I went in through the researchers' entrance on the side, showed my laminated card with its terrible photograph, put my bag in a locker because bags were not allowed, and was given a pencil, because pens were not allowed either.</p>\n<p>The microfilm room was dim and cool and almost silent. There were rows of readers, big gray machines with screens like old televisions, and at most of them sat somebody bent close, turning a crank. A retired man was telling the desk clerk about his great-grandfather. A graduate student had three boxes of reels and the face of someone who had not slept. My reel was waiting for me at the desk. I threaded it the way the video had shown me, and turned the crank.</p>\n<p>The pages went by in a gray blur and then slowed. They were registers. Big ledger books, photographed page by page a long time ago, with columns ruled by hand: name, rank, company, regiment, where captured, when captured, and at the end a wide column headed <em>Remarks.</em> The handwriting changed every few pages as one clerk went off duty and another sat down. Some of them wrote beautifully. Some of them I could hardly read.</p>\n<p>The names were in rough alphabetical order, and there were so many of them. I had known the numbers from the website. Ten thousand men, twenty thousand. What I had not known was what it would be like to turn a crank for forty minutes and still be in the <em>H</em>s.</p>\n<p>I found the Hurleys at a quarter to twelve.</p>\n<p>There were three. A John Hurley from Georgia, exchanged in March. A Hurley with no first name at all, only an initial I could not make out. And one line that stopped my hand on the crank.</p>\n<p><em>Hurly, E. Pvt.</em> A Virginia infantry regiment, a company letter, captured in May of 1864. And in a column I had not expected, somebody had written <em>resid. St. Mary's Co., Md.</em></p>\n<p>I sat and looked at it.</p>\n<p>He had said the clerks spelled it three ways. He had said I would not find him as Edward. He had said St. Mary's County, a waterman's son, raised on his aunt's farm across the county line. It was all sitting there on the screen in a dead clerk's handwriting, the way he had told it.</p>\n<p>I made myself move my eyes to the end of the line. The <em>Remarks</em> column.</p>\n<p><em>Died Feb. 6, 1865. Chr. diarrhoea.</em></p>\n<p>The flux. The thing that had killed Jem Carroll.</p>\n<p>I wrote it down exactly as it was, spelling and all, the regiment and the company and the date. Then I sat with the pencil in my hand for a long time, in the dim room, with the gray page glowing in front of me.</p>\n<p>It did not prove anything. Anyone could have found this. A man with a lot of time and an interest in the war could have sat at this same machine thirty years ago and found a private named Hurly who died of dysentery at Point Lookout, and built a whole family around him: an aunt, a cousin, a farm, a mother with a letter in her apron pocket. It would be a strange thing to do. People did strange things.</p>\n<p>But on the drive home I found I was thinking about the date. The sixth of February. The first boats had taken men away from Point Lookout to be exchanged a week later, in the middle of the month. I had read that on the website. A week.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"Did the cousin die?\" Freda said.</p>\n<p>She said it without looking up, the way she had said it every night for weeks. Then she looked up, because I had not answered.</p>\n<p>\"Yes,\" I said.</p>\n<p>Freda put her pencil down. \"Oh.\"</p>\n<p>\"In February. At the camp. About a week before they started sending men home.\"</p>\n<p>\"Oh,\" Freda said again, more quietly. She was quiet for a moment. \"Did he tell you?\"</p>\n<p>\"No. I found it. At the Archives.\"</p>\n<p>\"So he doesn't know you know.\"</p>\n<p>\"No.\"</p>\n<p>Freda thought about that. \"Are you going to tell him?\"</p>\n<p>\"No,\" I said. \"I'm going to wait and see if he tells me. And what date he says.\"</p>\n<p>Freda looked at me for a long moment, the way she sometimes did lately, as if she were seeing me from the outside for the first time.</p>\n<p>\"That's kind of cold,\" she said.</p>\n<p>\"It's careful.\"</p>\n<p>\"He's old, Mom. What if it's his real cousin, and it's sad for him?\"</p>\n<p>\"Then he'll tell me.\"</p>\n<p>\"You're treating him like a story.\" She picked up her pencil again, and did not look at me.</p>\n<p>I did not have an answer for that. I wrote the date on an index card, <em>Feb. 6,</em> and turned it face down, and put it in the back of my notebook, where I would not have to look at it.</p>\n<p class=\"break\">&#10043;</p>\n<p>On Thursday he talked for most of the morning about the week after the seventeenth: the plotters scattering, the letters from Baltimore, the lumber yard. I listened, and wrote, and did not ask about Ned.</p>\n<p>I could see him noticing that I did not ask. Once he looked up from the notepad and studied my face for a moment, and I held still under it, and he looked down again.</p>\n<p>After lunch, he told me.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>March 1865</em></p>\n<p class=\"tape\">The letter came at the end of March. My mother sent it on to me in Washington with nothing of her own inside it. That was how I knew before I opened it.</p>\n<p class=\"tape\">It was in the same hand as Ned's December letter: small and upright and careful, in ink. The man who had written for Ned when Ned could not hold a pencil had written one more time, on his own account. He was a schoolmaster from Virginia, it turned out, and he had been in the next tent. He wrote that Edward Hurley had died on the sixth of February, of the flux, very quietly, in the night. That he had not suffered much at the end. That he had spoken often of his Aunt Margaret, and of a cousin called Kit, and of a farm near a swamp. That he had been buried with the others, near the water, and that the schoolmaster was sorry it had taken so long to write, but paper was hard to come by, and he had been waiting to be exchanged himself, so that he could post it from the South, where it would not be read by strangers first.</p>\n<p class=\"tape\">He had been exchanged in the middle of February. On one of the first boats. The sick were meant to go first, he wrote, and he believed that Ned's name would have been called.</p>\n<p class=\"tape\">I read it standing up, in the hall of the house by the Navy Yard, by the light from the street. Then I read it again. Then I folded it and put it in my coat, and I went out, and walked for a long time, I do not remember where.</p>\n<p class=\"tape\">I had known since December. I had known from the moment I saw that careful handwriting where Ned's big leaning pencil ought to have been. Knowing is not the same. It has never once been the same.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. Outside, somebody's dog was barking a long way off, and the woodstove ticked.</p>\n<p>I did not reach for the notebook. There was no need. I knew what was on the card in the back of it, and I knew what Freda would say if she could see me now.</p>\n<p>\"The sixth of February,\" I said.</p>\n<p>He looked at me for a long moment. Then he smiled.</p>\n<p>\"You found him,\" he said.</p>\n<p>\"On Tuesday. At the Archives. <em>Hurly, E.</em> No <em>e.</em> St. Mary's County.\" I heard my own voice, and it was not quite steady. \"Died February sixth. Chronic diarrhoea.\"</p>\n<p>\"And you didn't tell me.\"</p>\n<p>\"No.\"</p>\n<p>\"You waited to see what date I would say.\" He nodded slowly. \"That's what I would have done.\"</p>\n<p>\"It doesn't prove anything,\" I said. \"You know that. Anyone could have found that line. You could have found it yourself, years ago.\"</p>\n<p>\"Yes,\" he said. \"Anyone could. And if I had, I would have known the date too, wouldn't I?\" He did not sound disappointed. He sounded, if anything, pleased with me. \"Good. Keep doing that.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I wanted to leave it there. I found I could not.</p>\n<p>\"You knew in December,\" I said. \"You told me. You read that letter and you knew he was dying. And you still thought that kidnapping the President of the United States was the answer.\"</p>\n<p>\"Yes.\"</p>\n<p>\"You're not stupid. I've spent seven Thursdays with you. You're the least stupid person I've ever met.\" I put my pen down. \"So explain it to me. Not the arithmetic. Booth's arithmetic. You. Why would a man like you walk into that?\"</p>\n<p>He was quiet for a long time.</p>\n<p>\"Because it made sense,\" he said at last. \"That's the honest answer, and it's the one nobody wants. You want me to tell you I was fooled, or angry, or young. The body was young. I was fooled, and I was angry. But I wasn't stupid, and it wasn't madness. Every step of it made sense from where I stood.\"</p>\n<p>He held up a hand and counted on his fingers.</p>\n<p>\"There were tens of thousands of men in those camps, on both sides, dying of what killed Ned. The one man who could end the exchange war was the President. He couldn't be persuaded, and he couldn't be voted out, because we had just watched him win. So you ask what can move him. And the answer, if you are a certain kind of clever young man in a certain kind of winter, is: take him. Not hurt him. Take him, and hold him, and trade him. It had been done before, with kings. Men have been ransomed for as long as there have been men.\" He lowered his hand. \"Every step of it made sense. And every step of it was a step further from anything a decent man would do. Both of those were true at once. That's the part I want you to understand. Not that I was wrong. Anyone can be wrong. That I could see it all, clearly, and walk down it anyway.\"</p>\n<p>\"Why?\"</p>\n<p>He looked at me, and for a moment he seemed about to say something else entirely. Then he looked at the window instead.</p>\n<p>\"Because I thought I could steer it,\" he said. \"I had done it before. Many times, in many lives: got inside something that was already moving, and leaned on it until it went a better way. Sometimes it worked. Sometimes it half worked. And a few times it went so badly wrong that I have spent whole lifetimes trying not to think about them.\" He picked up the pencil again. \"But you remember the times it worked. You always do. So I told myself that if I was inside, I could keep it a kidnapping. Keep anyone from getting hurt. I have been clever for a very long time, and clever men always think they can walk right up to the edge and stop.\"</p>\n<p>On the drive home I thought about how sure he had been, and about Ned, and I could not decide which was sadder.</p>", "audio": false, "added": 1790596727727, "pt": [1790694240640, 1790743455739, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790596727727, 1790596727727, 1790694240640, 1790861984290, 1790694240640, 1790596727727, 1790861984290, 1790694240640, 1790596727727, 1790596727727, 1790596727727, 1790596727727, 1790596727727, 1790596727727, 1790596727727, 1790694240640, 1790694240640, 1790718282701, 1790718282701, 1790718282701, 1790718282701, 1790718282701, 1790718282701, 1790694240640, 1790694240640, 1790694240640, 1790709178882, 1790596727727, 1790596727727, 1790596727727, 1790596727727, 1790861984290, 1790596727727, 1790718282701, 1790694240640, 1790861984290, 1790596727727, 1790694240640, 1790596727727, 1790596727727, 1790596727727, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790596727727, 1790694240640, 1790718282701, 1790718282701, 1790596727727, 1790596727727, 1790596727727, 1790694240640, 1790718282701, 1790861984290]}, {"num": 14, "title": "Five Hundred Guns", "extra": false, "html": "<p>I had thought about it all week. On the eighth visit, before I had even taken off my coat, I said, \"The drawings.\"</p>\n<p>He was setting down the tray. He stopped with it halfway to the table.</p>\n<p>\"The roads you drew for Booth,\" I said. \"On the tobacco receipts. In December, in your mother's house. You told me you drew him the way south: the tavern, the swamp, the farms where a man could hide, the landing places on the river. In your own hand.\" I sat down. \"Booth kept everything. The police found Arnold's letter in his trunk. It was in the papers within a week. It's in every book.\" I looked at him. \"So where were your drawings?\"</p>\n<p>He set the tray down very carefully. Then he smiled, the real one, the one that took ten years off his face.</p>\n<p>\"You've been waiting all week to ask me that.\"</p>\n<p>\"Since Tuesday.\"</p>\n<p>\"Good,\" he said, and sat down. \"That's the right question. That's April the tenth.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 1865</em></p>\n<p class=\"tape\">The guns woke me.</p>\n<p class=\"tape\">It was not yet light. The first one shook the window in its frame and brought me up out of bed with my heart going before I knew where I was, and for a moment I was on the field in front of Fort Stevens again, with the sun on my face and somebody shooting at me. Then the second gun, and the third. And I lay back down in the dark and listened, and counted, and understood.</p>\n<p class=\"tape\">They were coming from the Navy Yard, a few streets away, and from the forts around the city, and they were not coming at random. Each gun fired, and then the next, at the same slow, even pace, like a clock. Nobody fires like that at an enemy. That is how you fire when there is no enemy left, when you want the whole city to hear it and count.</p>\n<p class=\"tape\">I counted to a hundred and got up and dressed. The guns went on. By the time I was out in the street, it was full of people in their nightclothes and coats, and a man was shouting that Lee had surrendered, Lee had surrendered to Grant in Virginia yesterday, and it was over.</p>\n<p class=\"tape\">Five hundred guns, the newspapers said afterward. The Secretary of War had ordered it. Up by the President's house, around Lafayette Square, the windows broke.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I will not pretend to you that I felt only one thing that morning.</p>\n<p class=\"tape\">I stood in the street by the Navy Yard, with people I did not know shaking my hand and weeping and passing bottles, and I felt the war end in me like a fever breaking. It was over. Nobody else would lie in a ditch in Maryland with a belt around his leg. Nobody else would write home in pencil from a sand spit and die of the flux a week before the boat. I had wanted that more than I can tell you.</p>\n<p class=\"tape\">And I felt, under it, cold and clear, the other thing. That the plan was dead. There was no one left to trade prisoners to, and no Confederacy to hold a President for ransom, and no reason on earth for any of it anymore. Booth's great scheme was a pile of paper. And some of the paper was mine.</p>\n<p class=\"tape\">I stood there in the crowd with the guns going and thought about my drawings.</p>\n<p class=\"tape\">I had drawn Booth the whole road south, on the backs of my mother's tobacco receipts. The Keene farm was on them. Our lane was on them. Every friendly house between Washington and the river was on them, in my hand, on paper with my mother's name written at the top. And I knew Booth. He kept everything. He kept letters from women he had forgotten and bills he would never pay, all together, in a big leather trunk in room 228 at the National. He was the most careless man with paper I have ever known. He thought that nothing could touch him. Actors often do.</p>\n<p class=\"tape\">If anything ever went wrong now, anything at all, the first thing anyone would open was that trunk.</p>\n<p class=\"tape\">I did not know yet what could go wrong. The plan was dead. But I have lived a long time, Ms. Barnett, and I have never once seen a man like Booth simply put a thing down because the reason for it was gone.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Later that morning the men from the Navy Yard came out of the gates with their band, hundreds of them, workmen in their aprons and shirtsleeves, and started up the Avenue toward the President's house through mud that came over their shoes, and half the Navy Yard neighborhood went with them. I went too. I did not decide to. The crowd simply took me, and by the time we reached the President's house there were thousands of us, packed across the lawn and into the street, calling for him.</p>\n<p class=\"tape\">A window over the door opened, and he appeared at it.</p>\n<p class=\"tape\">It was the first time I had been near enough to see his face. At Fort Stevens he had been a tall hat on a wall, and at the inauguration a small dark figure on a platform across a sea of mud.</p>\n<p class=\"tape\">He did not make a speech. He said he would make one later, if they came back, and that he did not want to spoil it by saying anything now. And then he asked the band to play \"Dixie.\" The crowd didn't understand at first. You could feel them not understand. Then he told them, in a high, dry, country voice that carried to the back of that crowd without seeming to try, that he had always thought \"Dixie\" one of the best tunes he had ever heard, and that the other side had tried to take it for themselves, but that he had put the question to the Attorney General, and had been told it was now our lawful prize. That we had fairly captured it.</p>\n<p class=\"tape\">And the crowd laughed. Thousands of them. And the band played \"Dixie,\" to the President of the United States, on the morning the war ended, and I stood in the middle of all those Union people and heard it and could not breathe for a moment.</p>\n<p class=\"tape\">I thought: that is a man who has already forgiven us. And I had spent the winter planning to steal him.</p>\n<p class=\"tape\">I went to the National that night. The whole city was out. There were bonfires in the streets and rockets going up over the river, and bands on every corner, and I walked through all of it and hardly saw it.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Booth was in his room. He had been drinking all day. He was not loud, the way he usually was. That was the first thing that frightened me.</p>\n<p class=\"tape\">He was sitting in the chair by the window with the curtain pulled back, watching the rockets go up over the city, and he did not turn around when I came in. On the table beside him there was a bottle of brandy, most of the way down, and a pistol. It was a small pistol, a single-shot pocket pistol, the kind a gentleman carries, and it was lying there on the table next to the brandy as if it had been set down in the middle of a thought.</p>\n<p class=\"tape\">I looked at it and understood what kind of pistol it was. The kidnapping had been armed; there were carbines hidden in a ceiling at Surrattsville for the road south. But you cannot hold a carriage with a pistol that fires once, or keep a prisoner quiet with it. It is good for one thing only, at arm's length.</p>\n<p class=\"tape\">\"Kit,\" he said, without turning. \"Have you come to celebrate?\"</p>\n<p class=\"tape\">\"I came to see how you were,\" I said.</p>\n<p class=\"tape\">\"I'm very well,\" he said. \"I'm better than I have ever been.\" He laughed. It was a bad laugh. \"You heard him? This morning? Asking for 'Dixie'? Our song. He's taken our song, Kit, and he's giving it back to us like a present. Like a man gives a bone to a dog.\"</p>\n<p class=\"tape\">\"He was being kind,\" I said.</p>\n<p class=\"tape\">Booth turned around in the chair then and looked at me. I have had a long time to learn men's faces, and I can read most of them. His, that night, I could not read at all. That frightened me more than the pistol.</p>\n<p class=\"tape\">\"Was he,\" Booth said. It was not a question.</p>\n<p class=\"tape\">He turned back to the window, and I sat down in the other chair, because I did not want to leave him alone with that pistol.</p>\n<p class=\"tape\">For a long time neither of us said anything. Then he began to talk, and none of it was about the kidnapping. It was about Rome.</p>\n<p class=\"tape\">\"Do you know what they did to Brutus, Kit?\" he said. \"They cursed him for a season. That's all. The men who kill a tyrant are honored for a thousand years.\"</p>\n<p class=\"tape\">\"Not in the play,\" I said. \"In the play they run him out of Rome, and he falls on his own sword in the last act. You were there. You played Antony.\"</p>\n<p class=\"tape\">Booth laughed, and poured, and went on about Caesar, and I listened. He fell asleep in the chair a little after midnight, with the rockets still going up and the bottle empty. I told myself it was the brandy. I told myself it was an actor talking about a play he had been in.</p>\n<p class=\"tape\">When he was asleep, I opened the trunk.</p>\n<p class=\"tape\">It was not locked. Of course it was not locked. It was full, the way I had known it would be: shirts, costumes, a wig, a bundle of playbills, a box of cartridges, letters tied in bundles with string. I found my receipts in the second bundle, folded in half, between a bill from a tailor and a letter from a woman in Boston. Eleven of them. I counted them twice, because I had made eleven. The road south, the farm, the lane, the landing places, in my hand, on my mother's paper.</p>\n<p class=\"tape\">There was another letter in that bundle, from a village outside Baltimore, in a hand I knew. It was signed <em>Sam.</em> It was Arnold's, telling Booth to wait, to be careful, to see how Richmond felt first. I held it in my hand for a long moment. I could have taken that too.</p>\n<p class=\"tape\">I didn't. It was not mine to take. That is what I told myself. The truth is that if I had taken everything, Booth would have noticed the next morning, and known who had been in his room. If I took only my own, eleven slips of paper out of hundreds, he would never know they were gone.</p>\n<p class=\"tape\">So I left Sam Arnold's letter in Booth's trunk, and I put my eleven receipts inside my shirt, and I closed the lid, and I let myself out.</p>\n<p class=\"tape\">In the corridor, at the top of the back stairs, a waiter in a white jacket was standing with a tray of empty glasses, as if he had been waiting there for somebody to come out of a room.</p>\n<p class=\"tape\">He did not say anything. Neither did I. I went past him and down the stairs with my eleven receipts against my chest, and I felt his eyes on my back the whole way down.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"You burned them,\" I said.</p>\n<p>\"In the stove at the lumber yard, the next morning. All eleven.\" He looked at his hands. \"It's why you won't find the Keene farm in any book. It's one of the reasons you won't find me.\"</p>\n<p>\"And Arnold's letter.\"</p>\n<p>\"Was in every newspaper in the country within the week. It helped put him in prison for four years.\" He met my eyes. \"You asked me if I was clever. I was clever that night. I made sure nothing would ever lead back to my mother's house. I did it quickly and quietly and well. And I left a man I had drunk with, who had argued for the sensible road, to take what came.\"</p>\n<p>\"You couldn't have taken it. Booth would have known.\"</p>\n<p>\"That was my reason,\" he agreed. \"It was a good reason. I've never been sure it was the real one.\"</p>\n<p>I wrote it down. Then I wrote underneath it, smaller: <em>Pistol. April 10. Check.</em></p>", "audio": false, "added": 1790596892936, "pt": [1790857526860, 1790596892936, 1790694240640, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790610090237, 1790604858193, 1790604858193, 1790604858193, 1790604858193, 1790596892936, 1790604858193, 1790596892936, 1790604858193, 1790604858193, 1790596892936, 1790735225479, 1790604858193, 1790596892936, 1790604858193, 1790735225479, 1790735225479, 1790735225479, 1790735225479, 1790735416417, 1790861984290, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790694240640, 1790596892936, 1790596892936, 1790694240640, 1790596892936, 1790596892936, 1790694240640]}, {"num": 15, "title": "The Last Speech", "extra": false, "html": "<p>We ate lunch without talking much. I could tell he was somewhere else, and I let him be there. When we went back into the living room, he stood at the window for a while with his hands in his cardigan pockets, looking out at the field, before he sat down.</p>\n<p>\"The next night,\" he said, \"he gave the speech he had promised them.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 11, 1865</em></p>\n<p class=\"tape\">Booth came for me at the lumber yard at six o'clock. He was sober and freshly shaved and very cheerful, and that frightened me more than the brandy had.</p>\n<p class=\"tape\">\"Come and hear the great man,\" he said. \"He's going to tell us what he means to do with us.\"</p>\n<p class=\"tape\">Powell was with him, a step behind, the way he always was, too big for his coat, saying nothing. And Herold came along too, trotting to keep up, talking. We walked up to the President's house through streets still hung with flags from the night before, and bunting, and candles in every window. The whole city was lit. People had put candles in every pane of glass they owned, so that the houses seemed to be made of light.</p>\n<p class=\"tape\">The crowd on the lawn was bigger than the one that morning. It filled the grounds and ran out into the avenue, thousands of people, soldiers and clerks and families, and a great many Black men and women, standing together in a group near the front, dressed in their best, as if for church. Booth steered us through the crowd until we were quite close, under the tall window over the north door, near the front. He wanted to see.</p>\n<p class=\"tape\">I saw Damon before the speech began.</p>\n<p class=\"tape\">He was standing with the others near the front, a little to one side, very straight, in a dark coat that was not a waiter's coat. He had come on his own time. He was watching the window the way you watch a door you have been waiting a long time to see open.</p>\n<p class=\"tape\">He had not seen us yet. I made sure to stand where Booth's shoulder was between us.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The window opened, and the President appeared at it, and the crowd roared so that you felt it in your chest.</p>\n<p class=\"tape\">He had a sheaf of papers in his hand. A man stood behind him and a little to one side with a candle, holding it up so that he could read. And every time he finished a page, he let it fall, and a small boy darted out from behind him and caught the pages as they came down, and gathered them up off the floor. His son, somebody near me said. Tad.</p>\n<p class=\"tape\">He read it. He did not orate. I had heard great speakers, in other lives, men who could make a crowd weep or riot, and I had heard Booth, who could do both before supper. This was not that. It was a tired man in a window reading a careful, difficult paper about Louisiana: how the state had written a new constitution, and whether it should be let back into the Union, and on what terms. Most of the crowd had come for a victory speech. They got a lawyer's argument. I felt them grow restless around me, and shift, and murmur.</p>\n<p class=\"tape\">Then he came to the part about the vote.</p>\n<p class=\"tape\">Some people were unhappy, he said, that the new government of Louisiana had not given the vote to the colored man. And then he said, in that same dry, reading voice, that he himself would prefer that it were given now to the very intelligent, and to those who serve our cause as soldiers.</p>\n<p class=\"tape\">It was one sentence in the middle of a long speech. He did not raise his voice for it. Half the crowd, I think, did not even hear it for what it was.</p>\n<p class=\"tape\">The group near the front heard it. I watched it go through them. Nobody cheered. It was too big a thing to cheer. A woman put her hand over her mouth. An old man took off his hat and held it against his chest, as if a flag were going by.</p>\n<p class=\"tape\">And Damon closed his eyes.</p>\n<p class=\"tape\">That was all he did. He stood very straight in his good coat in the candlelight and closed his eyes, the way a man does when he has been carrying something heavy a long way and has finally been told he can set it down. Not here yet. Not today. But the door was open. For the first time in his life, a President of the United States had stood at a window and said it out loud.</p>\n<p class=\"tape\">Beside me, Booth said, \"That means citizenship.\"</p>\n<p class=\"tape\">He said a good deal more than that, in words I will not use in your house. And then he said, not loudly, but in the trained voice that could carry to the back of any theater in America without seeming to try:</p>\n<p class=\"tape\">\"That is the last speech he will ever make.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I have told you that I was clever in that life. It did not take cleverness to understand that sentence. A child would have understood it. But I will tell you how it fell into place for me, standing there, because it all fell at once, and it was the worst moment of that life.</p>\n<p class=\"tape\">The pistol on the table the night before, the kind that fires once. I had carried one in another life. I knew how short its reach is: a few steps, no more. A man who carries one means to walk right up to someone, close enough to touch. The brandy, and the quiet, and the talk about Brutus. <em>The men who kill a tyrant are honored for a thousand years.</em> The kidnapping dead, and Booth not grieving for it at all, only waiting, the way an actor waits in the wings. And now this: the last speech he will ever make.</p>\n<p class=\"tape\">He was not going to take the President anywhere. There was nowhere left to take him. He was going to kill him.</p>\n<p class=\"tape\">I turned my head and looked at Powell. Powell was looking at Booth. He was not shocked. He was not anything. He was waiting to be told.</p>\n<p class=\"tape\">And past Powell, through a gap in the crowd that had opened when people shifted to leave, I saw Damon.</p>\n<p class=\"tape\">His eyes were open again. He was looking straight at us. At Booth, who had just said it, and at Powell beside him. And at me, standing at Booth's elbow, in the coat Booth had bought me, as close to him as a brother.</p>\n<p class=\"tape\">He had heard every word. I saw it on his face, and I saw him look at me and put it together with everything else he had seen of me since the farm.</p>\n<p class=\"tape\">Then the crowd closed again, and he was gone.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I walked back down the avenue with them afterward. I laughed when Herold made a joke. I said good night to Booth at the door of the National and shook his hand.</p>\n<p class=\"tape\">I did all of that on purpose.</p>\n<p class=\"tape\">I lay awake all that night in my room by the Navy Yard, and I went through it the way I would go through any problem, one door at a time.</p>\n<p class=\"tape\">I could go to the police. And say what? That an actor, drunk and angry, had said something ugly about the President in a crowd? Half of Washington had heard somebody say something ugly about the President that week. The Provost Marshal had drawers full of such reports. They would ask me how I knew John Wilkes Booth so well. And the answer to that was a kidnapping plot, and the answer to that was a rope. For me, and for Arnold and O'Laughlen in Baltimore, and for a widow on H Street who had given my mother blankets, and for the people in Charles County who had hidden me, and for my mother. And they would still not have Booth, because Booth had done nothing yet, and he was the most famous young actor in America, and he would laugh at them.</p>\n<p class=\"tape\">I could run. Go home, and sit on the porch in Bryantown, and wait, and read about it in the newspaper.</p>\n<p class=\"tape\">Or I could stay exactly where I was. At Booth's elbow. The man he trusted, the man who knew the roads. If he meant to do it, he would need the others, and he would need a time and a place, and he would tell me, because I was one of his. And then I would know when, and where, and who. And I could stop it. Not with the police. Myself. Quietly. The way I had taken back my drawings: so that nobody would ever know anything had happened at all.</p>\n<p class=\"tape\">It was the cleverest of the three. I lay there until the window went gray and could not find the flaw in it.</p>\n<p class=\"tape\">There was one. There were two, in fact. The first was that I was not the only clever man watching Booth.</p>\n<p class=\"tape\">The second was that the other one had just seen me standing at his elbow.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"You stayed,\" I said. \"On purpose. To spy on him.\"</p>\n<p>\"To be inside when it happened. Yes.\"</p>\n<p>\"That's insane.\"</p>\n<p>\"It was the only door that led anywhere,\" he said. \"The police door led to the rope and didn't stop him. The home door led to the newspaper. Only that one went through the room where he would decide.\" He looked at me. \"Tell me which you'd have chosen. Honestly.\"</p>\n<p>I opened my mouth, and closed it again.</p>\n<p>Once, six years ago, I had chosen it myself. A source inside Carrow House, who could have walked away and didn't, because inside was the only place you could see what they were doing. I had told him to stay, for those eight months. I had told him it was the only way.</p>\n<p>I did not say any of that. I wrote down <em>April 11,</em> and underlined it, and after a moment I wrote, underneath, <em>the other one,</em> and looked at it, and did not ask.</p>", "audio": false, "added": 1790597004832, "pt": [1790694240640, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790604858193, 1790597004832, 1790597004832, 1790597004832, 1790604858193, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790767768318, 1790735225479, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790861984290, 1790597004832, 1790597004832, 1790604858193, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790694240640, 1790597004832, 1790597004832, 1790694240640, 1790694240640, 1790694240640, 1790694240640]}, {"num": 16, "title": "Lafayette Square", "extra": false, "html": "<p>The client's question came on Tuesday.</p>\n<p><em>Please ask the gentleman whether he ever spoke to the waiter again.</em></p>\n<p>I read it standing at the kitchen counter, and then I read it again, and then I went and got the transcripts.</p>\n<p>It was a strange question. Everything the client had asked so far had made a kind of sense. The color of a thread, which nobody could check. The National Hotel, where Booth lived. Those were a skeptic's questions, the questions I would have asked myself, trying to catch a man in a lie. But the waiter was nobody. The waiter had said perhaps twenty words of his own in the whole story. Out of everything in eight sessions, the President and Booth and the plot and the guns, the client wanted to know about the waiter.</p>\n<p>I wrote it on a sticky note and put it on the front of my notebook, and under it, in small letters, <em>why?</em></p>\n<p class=\"break\">&#10043;</p>\n<p>On Thursday I was an hour late. The school had asked me to come in first thing, and it had not gone well.</p>\n<p>He read the sticky note before I had my coat off. He read it upside down, across the table, while I was still setting out the recorders. I saw him do it.</p>\n<p>\"<em>Why,</em>\" he said. \"Good.\"</p>\n<p>\"You tell me.\"</p>\n<p>\"I don't know,\" he said. And for the first time since I had known him, I believed he did not. He sat back and looked at the empty frame on the mantel for a long moment. \"Your client likes Damon,\" he said at last, slowly. \"Or he wants to know whether I did.\" Then he shook his head, as if setting it aside for later. \"Tell him yes. More than once. Tell him I'll get there.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>It was nearly noon by then. He put the soup on, and at lunch I told him about the school.</p>\n<p>I had not meant to. It came out sideways, the way things do, because the soup was good and because it had been a bad week. I told him that the car had started making a noise like a spoon in a garbage disposal, and the mechanic had charged me four hundred dollars to tell me it was a loose heat shield. That the carpet man had sent back chapter nine of his memoir with a note asking for more about the Berber shortage of 1987. And that Freda's school had called on Wednesday, the chemistry teacher, Mr. Ostrowski, the one with the bow ties, to say that two lab write-ups had come in almost word for word the same, numbers and all, in a class where everybody weighs their own and writes their own, and he had to treat them both as copied until he knew whose work it was, and one of them was Freda's. He had told both girls weeks ago, it turned out, the day the write-ups came in, and word had gone round the class. The school had only called now because neither girl would say anything, and that morning I had sat in a plastic chair outside the vice principal's office for forty minutes to be told so in person.</p>\n<p>\"And Freda says she didn't,\" I said. \"And she won't say anything else. Not who, not how. She just goes quiet.\" I stirred my soup. \"She's not a cheater. She's the most annoyingly honest person I know. She told her dentist she doesn't floss.\"</p>\n<p>He did not say anything. He listened, the way he always did, and when I had finished he asked how the car was now, and whether the gutter people paid on time, and he did not say one word about Freda or the school or the lab. I was almost disappointed. Then I was annoyed with myself for being disappointed, and then the soup was gone, and we went back into the living room.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>April 12 and 13, 1865</em></p>\n<p class=\"tape\">I had decided to stay inside. Now I had to find out what inside was going to do.</p>\n<p class=\"tape\">Booth told us nothing. That was the first thing I learned. On the twelfth and the thirteenth he was everywhere in the city and with all of us, cheerful, restless, buying drinks, and he said nothing at all about the President. He did not need to. Whatever he was going to do, he had not yet decided when, and a man like Booth does not share a plan until he has the ending.</p>\n<p class=\"tape\">So I did what I could do. I listened to his questions.</p>\n<p class=\"tape\">A man's questions tell you what he is thinking far better than his answers do. Booth asked me a great many things over those two days, the way he had asked me about horses and roads on a fence in Charles County, lightly, between other remarks, so that each one sounded like nothing. He asked me the fastest way from Lafayette Square to the Navy Yard Bridge, at night, for a man on a horse who did not know the city. He asked me whether the Kirkwood House, at Twelfth Street and the Avenue, had a back way out onto the alley. He asked me, laughing, whether I thought Andy Johnson drank as much as they said, and whether a man like that answered his own door at night.</p>\n<p class=\"tape\">And on the afternoon of the thirteenth, in the dining room of the National, he read me a paragraph from the <em>Star</em> about the Secretary of State.</p>\n<p class=\"tape\">Mr. Seward had been thrown from his carriage eight days before, when his horses bolted. It had been in all the papers. His jaw was broken and his arm, and he was lying in bed in his house on Lafayette Square, across from the President's house, badly hurt and under a doctor's care. Booth read me the paragraph about how he was getting on. Then he folded the paper and said, \"Poor old man. Who doctors him, do you know?\"</p>\n<p class=\"tape\">I said I did not. He said it did not matter, and changed the subject.</p>\n<p class=\"tape\">I sat there with my coffee and laid his questions side by side. Each one alone was nothing. Together they were not.</p>\n<p class=\"tape\">Every one of them was about the night, and every one was about getting away. And not one of them was about the President. Booth did not need my help with the President. Whatever he meant to do there, he meant to do himself, in a city he knew street by street. The questions were for other men.</p>\n<p class=\"tape\">A man on a horse who did not know the city: that was not Booth. That was Powell, who could not find his way across Washington in daylight. And Lafayette Square, yes, the President's house faced it, but nobody plans a stranger's escape from a house he will never get into. The other house on that square that mattered that week was Seward's, with Seward in it, flat in bed with a broken jaw and a doctor coming and going. A man who asks for the doctor's name is looking for a reason to be let in at the door.</p>\n<p class=\"tape\">The Kirkwood: everyone in Washington knew that the new Vice President, Andrew Johnson, had rooms there. And the man who asked me whether Andy Johnson answered his own door at night was not asking about his drinking.</p>\n<p class=\"tape\">The President. The Vice President. The Secretary of State.</p>\n<p class=\"tape\">I knew how that government was put together. Kill only the President, and the Vice President takes his oath the next morning, and nothing changes; the war is still won. Kill the Vice President too, and the law calls for a new election, and the man whose office sends word to the states to hold it is the Secretary of State. Kill all three in one night, and for a few days nobody would be quite sure who was running the country at all. Booth did not mean to kill a man. He meant to cut the head off the government, all at once, in one night, and see what grew back.</p>\n<p class=\"tape\">It was, I have to tell you, a clever plan. It was the first truly clever plan I ever saw him make.</p>\n<p class=\"tape\">And it meant he would need three men, in three places, at the same moment. Himself, for the President. Powell, for Seward, because Powell would do anything and Seward's house would need a man who would. And for Johnson, one of the others. Atzerodt, most likely, who knew nothing about the city and would go where he was told.</p>\n<p class=\"tape\">I knew who. For two of them, I knew where. I did not know where the President would be, or when.</p>\n<p class=\"tape\">I thought of writing it down and leaving it, unsigned, at the door of the President's house. Everyone in Washington knew he got threats by the sackful and laughed at them. A letter would go on a pile.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I went back to the National late on the night of the thirteenth, to see if Booth had come in. He had not. The clerk said he had gone out to see the illuminations.</p>\n<p class=\"tape\">The whole city was lit again that night, brighter than before. The government had ordered it: every public building covered in candles and gaslight and transparencies, and the private houses doing the same, so that the streets were as bright as noon. I had walked through it to get there and hardly seen it.</p>\n<p class=\"tape\">I went through the lobby toward the stairs, and passed the doors to the dining room, which was closed for the night and dark except for one lamp at the far end, on the headwaiter's desk.</p>\n<p class=\"tape\">Damon was sitting there. Writing.</p>\n<p class=\"tape\">He was in his shirtsleeves, with the white jacket over the back of the chair, bent close to the lamp, and he was writing slowly and very carefully. I stood in the dark of the doorway and watched him, and he did not look up. He wrote to the bottom of a page. He read it through. Then he crumpled it, and put it in his pocket, and took a fresh sheet, and began again from the beginning.</p>\n<p class=\"tape\">I watched him write it three times.</p>\n<p class=\"tape\">The third time he did not crumple it. He read it through twice, and blotted it, and folded it, and put it in an envelope, and wrote something on the front, and sealed it. Then he sat for a moment with his hand flat on it, the way you rest your hand on a thing you are afraid of losing. And then he put on his coat, not the white jacket but his own dark one, the one I had seen him wear on the lawn two nights before, and came toward the door where I stood.</p>\n<p class=\"tape\">I stepped back into the lobby, behind a pillar, and let him pass.</p>\n<p class=\"tape\">He went out the front of the hotel into the bright street, and turned west, up the Avenue, toward the President's house, walking fast with the envelope held inside his coat.</p>\n<p class=\"tape\">I started after him. I had gone perhaps three steps across the lobby when the street door opened again and Booth came in out of the light, flushed and bright-eyed from the illuminations. He saw me at once, and came straight over, and took my arm.</p>\n<p class=\"tape\">\"Kit,\" he said. \"Come up.\"</p>\n<p class=\"tape\">There was no way to pull free of him without telling him why. So I went up the stairs with Booth's arm through mine, and by the time I could have looked, Damon was long gone into the crowds and the light. I never saw where he turned.</p>\n<p class=\"tape\">I thought about it afterward, lying awake. A man writing at midnight, in the best hand in Washington, three times over until every word was right. Sealing it. Resting his hand on it. Walking it out himself into the night, instead of trusting it to the post, holding it against his chest.</p>\n<p class=\"tape\">In the end I settled on the likely answer, which was that he was in love with someone. Someone up that way, on the west side of the city, who worked in one of the big houses there. A man only writes a letter three times for one reason, in my experience, and I had a great deal of experience. It was an answer I could sleep on, and so I took it.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there, and looked at the notepad for a while.</p>\n<p>\"I should tell your client,\" he said, \"that that was not speaking to him. I only watched.\" He smiled a little, not happily. \"I watched a great deal, that week. You'd think I would have seen more.\"</p>\n<p>I was writing. <em>Seward, carriage accident, April 5. Check. Johnson, Kirkwood House. Check. Illumination, April 13. Check.</em></p>\n<p>I looked up. \"You worked out all three targets. From some questions and a newspaper.\"</p>\n<p>\"From his questions. Anybody could have. Nobody else was listening to them.\"</p>\n<p>\"And you still didn't know when.\"</p>\n<p>\"No,\" he said. \"Nobody knew when. Not even Booth. Not until the next morning, when he went to collect his mail.\"</p>\n<p>He put the pencil down.</p>\n<p>\"That's Friday,\" he said. \"I think that's enough for today.\"</p>\n<p>It was only two o'clock. I did not argue. I packed up the recorders, and on the drive home I found that I kept thinking, for no reason I could name, about a man writing the same letter three times.</p>", "audio": false, "added": 1790597316850, "pt": [1790597316850, 1790597316850, 1790694240640, 1790694240640, 1790694240640, 1790739775447, 1790739775447, 1790597316850, 1790597316850, 1790694240640, 1790739775447, 1790830174013, 1790694240640, 1790694240640, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790739775447, 1790597316850, 1790739775447, 1790739775447, 1790739775447, 1790739775447, 1790739775447, 1790739775447, 1790739775447, 1790739775447, 1790861984290, 1790597316850, 1790604858193, 1790604858193, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790604858193, 1790604858193, 1790604858193, 1790604858193, 1790604858193, 1790604858193, 1790597316850, 1790597316850, 1790694240640, 1790694240640, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790694240640]}, {"num": 17, "title": "Good Friday", "extra": false, "html": "<p>I brought the box with me on the tenth visit.</p>\n<p>It was an ordinary banker's box, the cardboard kind with handholds cut in the ends, and it had lived on the top shelf of my closet for six years under a bag of winter hats. <em>CARROW</em> was written on the lid in marker, in my own handwriting from a worse time. I had taken it down the week before, on the night the client's question about the waiter came, for no better reason than that odd questions made me want to go back over old ones.</p>\n<p>I had not meant to bring it. But it was on the passenger seat on Thursday morning, and I did not take it out again.</p>\n<p>He saw it when I came in and did not ask about it. He made the tea. I set out the recorders and did not turn them on, and while the tea steeped I found I was talking.</p>\n<p>\"I went back through it this week,\" I said. \"The old stuff. I haven't opened it since I left the paper.\"</p>\n<p>\"Did it help?\"</p>\n<p>\"No. It made me feel like I was thirty-eight again and about to be fired.\" I took the lid off anyway. \"It's mostly paper. My notes. Copies of the documents he gave me, the ones they said were fake. The correction, which I kept, because I'm like that.\" I lifted out a thin folder. \"And the police report. It took me three months and a records request to get this, and when I got it, it was two pages long and they'd spelled his name wrong.\"</p>\n<p>I told him about it the way you tell someone about a bad time you have mostly gotten over: all at once, jumping around, with too much in it.</p>\n<p>The officer who took the report had been named Delacroix, and he had called me <em>ma'am</em> in a way that made clear he thought I was a crank. The report said that the tenant had not been
