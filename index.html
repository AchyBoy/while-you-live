ands. But one by one the cabins behind the tobacco barn emptied. A family went to Washington. Two of the young men went to Baltimore to look for work on the docks. An old woman named Hester, who had cooked in that kitchen since before my mother was married, stayed, and my mother paid her in money for the first time, and neither of them ever spoke about it.</p>\n<p class=\"tape\">The tobacco was cut and hanging in the barn. The corn was half in. There was nobody to bring in the rest of it but my mother and Lottie and a man on a crutch.</p>\n<p class=\"tape\">In the second week of November we heard that Lincoln had won the election. He had won it easily, in every state but three. My mother read it in the newspaper and folded the paper up very small and put it in the stove.</p>\n<p class=\"tape\">\"Four more years,\" she said. \"Ned will die in that place.\"</p>\n<p class=\"tape\">Nobody at the table told her she was wrong.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">That Sunday my mother decided I was well enough for Mass.</p>\n<p class=\"tape\">St. Mary's was a little brick church outside Bryantown, and on a Sunday morning it was the whole county in one room. You went for God, and you went to find out who had news from across the river, who had a letter from a son, whose barn had been searched by the provost men and what they had found in it. The women talked on one side of the churchyard after Mass and the men talked on the other, and the talk on both sides was the same talk, in lower voices than it would have been a year before.</p>\n<p class=\"tape\">There were six steps up to the door. I counted them from the wagon. My mother got down first and did not offer me her arm, because she knew I would not take it in front of the county, and Lottie walked beside me with her hands folded, as if she had not noticed anything at all. I took the steps one at a time, crutch and then foot, crutch and then foot. The talk in the churchyard went quiet while I did it, and started again, a little too loudly, when I reached the top.</p>\n<p class=\"tape\">That was the first time I understood what the leg was going to mean in that life. Every man in the county knew that Margaret Keene's boy had been shot in front of Washington. A wound is a kind of letter of introduction.</p>\n<p class=\"tape\">After Mass, the men came to me. Men who had never said a word to Kit came across the grass and shook my hand, and some of them stayed, and lowered their voices.</p>\n<p class=\"tape\">A farmer named Carrico, with a face like a walnut, held on to my hand a while. \"My Tom's across the river with Mosby,\" he said. \"Got a letter from him Thursday. Came over the river at night, the way they do.\" He looked at the leg. \"He'd want me to say he's proud of you. So I'm saying it.\"</p>\n<p class=\"tape\">A younger man, who kept his hat in his hands the whole time, told me the provost men had been through Hardy's place on Wednesday, looking for a boat. \"Turned the barn out,\" he said. \"Pulled up the floor of the corncrib. Never found it.\" He almost smiled. \"It's on the bottom of the creek, with a load of stones in it. You bail it out when you need it.\"</p>\n<p class=\"tape\">And an old man I did not know at all, with a gray beard down to his second button, leaned in close enough that I could smell the tobacco on him, and said, \"When that leg's better, son, if you're minded to go back over, you come and see me. I can find you a boat, and a man who knows the river well enough to row it in the dark.\"</p>\n<p class=\"tape\">I thanked every one of them. I did not ask a single question. A man who is trusted does not have to ask; he only has to stand still and let the county tell him what it knows. By the time my mother was ready to go, I knew where at least one boat was kept, which roads the provost men watched, and that half the men in that churchyard were in the business of getting letters and people across the Potomac at night.</p>\n<p class=\"tape\">I was still standing in the churchyard with my weight on the crutch when I saw the stranger.</p>\n<p class=\"tape\">He was standing with old Dr. Queen, who was past seventy and lived some miles south of the village, and with Dr. Queen's son-in-law, a man named Thompson. He was not very tall. He had black hair, curled, and a black moustache, and skin so pale that it looked as if he had never been out in the weather in his life. His coat was better than any coat in that churchyard, and he wore it as if he had forgotten he had it on, which is a harder thing to do than it looks.</p>\n<p class=\"tape\">Lottie took hold of my arm hard enough to hurt.</p>\n<p class=\"tape\">\"Kit,\" she said. \"Kit. Do you know who that is?\"</p>\n<p class=\"tape\">\"No,\" I said. \"Should I?\"</p>\n<p class=\"tape\">\"That's John Wilkes Booth.\" She said the whole name, the way you say the name of a place. \"The actor. I have his picture. I have his picture <em>in my room</em>.\"</p>\n<p class=\"tape\">She did. I had seen it. Actors sold their portraits in those days on little cards, the size of your hand, and girls collected them the way boys collected cigar bands. Lottie had three of this one, propped along her windowsill.</p>\n<p class=\"tape\">\"What's he doing in Bryantown?\" I said.</p>\n<p class=\"tape\">\"I don't know. I don't care.\" She was standing on her toes. \"He's the most famous young actor in America. Everybody says so. When he plays Richard the Third he fights so wildly that the other actors are afraid of him.\"</p>\n<p class=\"tape\">\"Are they really?\" I said.</p>\n<p class=\"tape\">She gave me the look she saved for when I was being a brother, and did not bother to answer, and went back to staring across the churchyard.</p>\n<p class=\"tape\">I watched Thompson bring him across the churchyard to a man standing by the gate: a slim man with a high forehead and reddish whiskers, about thirty, whom I knew as the young Dr. Mudd, who farmed and doctored a few miles up the road. The two of them shook hands. They talked for a few minutes, with their heads close together. I could not hear what was said. It looked like nothing, two men being polite on a church step.</p>\n<p class=\"tape\">Everything I tell you about Booth, I learned later, looking back. That morning he was only a famous man in a churchyard, and I was a farm boy with a bad leg and a sister pulling on my sleeve.</p>\n<p class=\"tape\">Then Thompson brought him over to us.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">\"Mrs. Keene,\" Thompson said. \"Mr. Booth is staying with my father-in-law. He asked to be introduced to the family of the young man who was at Fort Stevens.\"</p>\n<p class=\"tape\">He was charming. I want to say that plainly, because it matters, and because nobody who writes about him now likes to say it. He was the most charming man I met in that life, and I have met more charming men than I can count.</p>\n<p class=\"tape\">He bowed over my mother's hand as if she were a duchess and they were in a ballroom and not a muddy churchyard. \"Mrs. Keene,\" he said. \"I've heard about your son all morning. Half the county is proud of him, and I think the other half is jealous of you.\"</p>\n<p class=\"tape\">My mother, who had not smiled at a stranger since the war began, smiled.</p>\n<p class=\"tape\">Then he turned to Lottie. \"And this is?\"</p>\n<p class=\"tape\">\"Charlotte,\" Lottie said, which nobody had called her in her life. And then, before anyone could stop her, \"I have your picture.\"</p>\n<p class=\"tape\">I thought she would die of it. My mother closed her eyes.</p>\n<p class=\"tape\">Booth did not laugh at her. He looked delighted, as if it were the best news he had heard all week. \"Then you have the advantage of me, Miss Keene,\" he said. \"Which one? Not the one as Richard, I hope. They made my nose far too long in that one. I've had words with the man.\" He put his hand on his heart. \"You must let me send you a better one. Signed. If your mother permits.\"</p>\n<p class=\"tape\">She went as red as a brick and adored him forever.</p>\n<p class=\"tape\">I remember thinking that was not bad. Not bad at all. He had taken a girl's worst moment, in front of the whole county, and in three sentences turned it into the story she would tell for the rest of her life.</p>\n<p class=\"tape\">Then he turned to me, and shook my hand, and held it a moment longer than a man needs to.</p>\n<p class=\"tape\">\"I won't ask you about it,\" he said, looking at the crutch. \"Everybody's asked you about it already, I expect. I'll only say I'm glad you came home.\"</p>\n<p class=\"tape\">\"Thank you,\" I said.</p>\n<p class=\"tape\">\"Mr. Booth has come down to look at land,\" Thompson said.</p>\n<p class=\"tape\">\"Land, and horses,\" Booth said. \"There'll be money to be made in Southern Maryland once this war is over, Mrs. Keene. Good land, good water, the river right there. I mean to buy before everybody else wakes up to it. And I need a good horse or two besides.\" He said it to my mother, but he was looking around the churchyard as he spoke, lightly, the way you look around a room you have just walked into. \"Do you know of anyone selling?\"</p>\n<p class=\"tape\">My mother looked at me. I knew what she was thinking. We had five horses and nobody to work them and no money for their feed through the winter.</p>\n<p class=\"tape\">\"We might,\" she said.</p>\n<p class=\"tape\">\"Then may I call?\" He smiled at her. \"Tuesday, perhaps?\"</p>\n<p class=\"tape\">He came to the farm on Tuesday.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I showed him the horses, because I was the man of the house, and because my mother did not want to be seen selling them.</p>\n<p class=\"tape\">I leaned on the fence and watched him while he looked at them.</p>\n<p class=\"tape\">He did not look at them the way a man looks at a horse he means to buy. He did not open a single mouth to see the teeth. He did not run his hand down a single leg. He walked around each one and patted its neck and said something kind about it, the way you would say something kind about a friend's baby.</p>\n<p class=\"tape\">\"This one's a good fellow,\" he said, about the old bay. \"He has a wise face. Don't you think he has a wise face?\"</p>\n<p class=\"tape\">\"He's sixteen,\" I said. \"He's wise because he's old.\"</p>\n<p class=\"tape\">\"The best reason.\" He laughed. \"May I ride him?\"</p>\n<p class=\"tape\">He rode well. I will say that too. He rode better than anyone I had seen in that county, easily, as if the horse were a chair. He took the bay down to the end of the lane and back at a canter, and pulled up by the fence, and swung down, and I saw that he had not once looked at the horse's paces. He had been looking at the lane. Where it met the road, and which way the road went.</p>\n<p class=\"tape\">He leaned on the fence beside me.</p>\n<p class=\"tape\">\"How far is it to the river from here?\" he said. \"The Potomac, I mean.\"</p>\n<p class=\"tape\">\"Twenty miles, about. Depends which way you go.\"</p>\n<p class=\"tape\">\"And which way would you go? With a wagon, say.\"</p>\n<p class=\"tape\">\"Down through Beantown, if it's dry. Across by the swamp road, if you don't mind wet feet.\"</p>\n<p class=\"tape\">\"The swamp road,\" he said, as if it were the name of a song. \"Does it flood?\"</p>\n<p class=\"tape\">\"In the spring. You can get through if you know where the high ground is.\"</p>\n<p class=\"tape\">\"And do you?\"</p>\n<p class=\"tape\">\"Everybody here does.\"</p>\n<p class=\"tape\">\"Are there soldiers on it?\"</p>\n<p class=\"tape\">\"Sometimes. On the main road, more often. At the crossings.\"</p>\n<p class=\"tape\">\"And at night?\"</p>\n<p class=\"tape\">\"Fewer,\" I said. \"They don't like the swamp in the dark any more than anybody else does.\"</p>\n<p class=\"tape\">He said all of it lightly, leaning on the fence, between remarks about the weather and the fine old house and the wise face of the bay, so that each question sounded like the natural next thing to ask. \"For the land, you understand,\" he said. \"A man wants to know how he'd get his crop to market.\"</p>\n<p class=\"tape\">Nobody in Charles County took a crop across the Potomac. Virginia was on the other side, and there was a war on it. And nobody who meant to farm asked which roads a wagon could use at night.</p>\n<p class=\"tape\">I said none of this. I answered every question, truthfully, because every one of them was something any child in the county could have told him. And I let him think I was a slow farm boy who had been shot and would believe anything he was told.</p>\n<p class=\"tape\">Then he turned around on the fence and looked at me, and I found out he had been watching me too.</p>\n<p class=\"tape\">\"You stand,\" he said, \"like a man who is learning a part.\"</p>\n<p class=\"tape\">For a moment I could not breathe.</p>\n<p class=\"tape\">I had been in that body for four months. I had fooled a mother, which is the hardest audience there is. I had fooled Lottie, and the priest, and every man in that churchyard. And in twenty minutes, leaning on a fence, a stranger had seen the one thing I had been hiding.</p>\n<p class=\"tape\">Then he laughed, and put his hand on my shoulder.</p>\n<p class=\"tape\">\"Forgive me,\" he said. \"I see it in all of them. The boys who come home. They come back, and they don't quite fit themselves anymore, and they have to learn how to be who they were before. It's the saddest thing I know.\" He meant it. His eyes were wet. \"Where did you get the leg?\"</p>\n<p class=\"tape\">\"Fort Stevens,\" I said. \"In front of Washington. In July.\"</p>\n<p class=\"tape\">He went very still.</p>\n<p class=\"tape\">\"Were you,\" he said. \"Then you saw him. They say he came out on the wall.\"</p>\n<p class=\"tape\">\"I saw a tall man in a tall hat,\" I said. \"I didn't know who he was until later.\"</p>\n<p class=\"tape\">\"How close?\"</p>\n<p class=\"tape\">\"A few hundred yards.\"</p>\n<p class=\"tape\">\"And nobody fired at him.\"</p>\n<p class=\"tape\">\"Everybody fired at the fort,\" I said. \"Nobody knew who he was.\"</p>\n<p class=\"tape\">\"Nobody knew,\" Booth said, softly, to himself, and looked out over the fence at nothing for a long time.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">My mother gave him supper. It was the least she could do for a man who might buy her horses, and more than she could afford. She put out the good plates, which had not been down from the shelf since the spring, and Hester killed a chicken, and nobody said a word about what it cost.</p>\n<p class=\"tape\">He was easy at the table. He told my mother her biscuits were better than any in Baltimore, and asked Hester how she made them, and listened to the answer. He asked me nothing at all about the war, which I was grateful for, and nothing more about the roads, which I noticed.</p>\n<p class=\"tape\">It was Lottie, of course, who told him about Ned. She could not help it either.</p>\n<p class=\"tape\">\"Our cousin's a prisoner,\" she said. \"At Point Lookout. He wrote to us in September. In pencil, and a Union officer read it first, you could see where he'd stamped it. He says he's all right. Jem Carroll's dead, though. Jem was in his company. He died of the flux.\" She said it all in one breath, the way she said everything. \"But it doesn't matter so much now, because the exchange is going to start again soon, everybody says so, and then Ned will come home.\"</p>\n<p class=\"tape\">I watched the charm go out of his face like a lamp being turned down.</p>\n<p class=\"tape\">\"It won't,\" he said. \"It won't start again. Grant has seen to that. He knows every man he sends back to us is a man back in the line, and he has more men than we do, so he'll let ours die in the camps sooner than trade them.\" He put his fork down. \"They're starving them, Mrs. Keene. At Point Lookout, at Elmira, at all of them. Not by accident. On purpose, by men who can count.\"</p>\n<p class=\"tape\">Nobody said anything. My mother's hand went to her apron pocket, where the letter was. Lottie looked at her plate.</p>\n<p class=\"tape\">\"Somebody ought to make them trade,\" Booth said.</p>\n<p class=\"tape\">He did not say anything more than that. He picked up his fork again, and looked at Lottie, and saw her face, and changed the subject, very gracefully, the way you would lift a child over a puddle.</p>\n<p class=\"tape\">\"Miss Keene,\" he said. \"Do you know what I'm doing in ten days?\"</p>\n<p class=\"tape\">She shook her head.</p>\n<p class=\"tape\">\"I'm going to be on the stage of the Winter Garden, in New York, playing <em>Julius Caesar,</em>\" he said. \"With both of my brothers. Edwin, and Junius, and me. The three of us, for the first time in our lives, on one stage, on one night.\" He opened his hands. \"It's a benefit. We're raising money for a statue of Shakespeare, in the new Central Park. Our father would have liked that. He was an actor too, you know. The best of us, some people say.\"</p>\n<p class=\"tape\">Lottie nearly died of it.</p>\n<p class=\"tape\">\"Which part do you play?\" she asked.</p>\n<p class=\"tape\">\"Mark Antony,\" he said. \"Caesar's friend. The one who stands up after the murder and turns the crowd.\"</p>\n<p class=\"tape\">\"And who does the murder?\"</p>\n<p class=\"tape\">\"Brutus.\" He smiled. \"Edwin has Brutus. Edwin always gets Brutus.\"</p>\n<p class=\"tape\">He said it as a joke about brothers, and we all laughed. I laughed too. But I was sitting nearest him, and I saw his hand close on the napkin in his lap while he said it, and open again, and smooth it out flat on his knee. It took no time at all. Nobody else at that table saw it. I remember it because I thought, just for a moment, that he minded, and because it was the first thing he had done all day that he had not meant anyone to see.</p>\n<p class=\"tape\">He did not buy a horse. He said he would think it over and come back before Christmas. He rode away down the lane in the last of the light, sitting his borrowed horse as if he had been born on it, and Lottie watched from the porch until he was gone.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He did come back, in the middle of December.</p>\n<p class=\"tape\">He stayed with Dr. Queen again, and on the Sunday he was at St. Mary's again, in the same good coat, and this time the whole churchyard knew who he was. After Mass there was a little crowd around him, and Lottie was at the front of it, and she did not wait to be introduced.</p>\n<p class=\"tape\">\"How was the play?\" she said. \"Mr. Booth. How was <em>Julius Caesar?</em>\"</p>\n<p class=\"tape\">He laughed, and looked around at all of them, and I saw him decide to give them a performance. He was very good at it. He did not tell it so much as play it, there on the church step, with his hands.</p>\n<p class=\"tape\">\"You want the whole of it?\" he said.</p>\n<p class=\"tape\">\"<em>Yes.</em>\"</p>\n<p class=\"tape\">\"Then you shall have it.\" He went back up onto the top step, where all of us would have to look up at him. An actor always knows where to stand. \"Picture a theater, Miss Keene. Bigger than this church ten times over, all red and gold, and every seat sold a week before. People standing at the back. People in the aisles. My mother in a box above the stage, in her best black silk, come to see her three sons together. Our father never lived to see it. So she saw it for him.\"</p>\n<p class=\"tape\">He put his hand on the door frame behind him, as if it were the edge of a curtain.</p>\n<p class=\"tape\">\"We came on together, the three of us, in the very first scene. And before any of us could say a word, the whole house stood up. Every soul in it, on their feet, for the Booths. So we did the only thing we could.\" He turned, and looked up at the church roof as if there were a box there, and bowed to it, slowly, with his hand on his heart. Half the women in the churchyard sighed. \"We bowed to our mother.\"</p>\n<p class=\"tape\">Lottie had both hands pressed together under her chin.</p>\n<p class=\"tape\">\"And then we played. And it went well. It went better than well.\" He lowered his voice, and the crowd leaned in to hear it. \"Until the middle of it, with my brother Edwin alone on the stage, and every eye on him. And from somewhere at the back of the house, a man stood up.\" Booth flung out one arm and pitched his voice high and wild, and it rang off the brick. \"<em>Fire!</em>\"</p>\n<p class=\"tape\">Somebody in the crowd gasped. A child started to cry and was hushed.</p>\n<p class=\"tape\">\"You could hear it,\" he said, quietly now. \"The whole house, all at once, starting to get up. Seats banging. A woman screaming somewhere upstairs. The sound a crowd makes just before it runs, and once it runs, people die on the stairs. It was no false alarm, you see. The hotel next door had caught fire.\" He paused, and let them wait. \"And my brother walked down to the very edge of the stage, in his toga, and held up one hand. Like this.\" He held up his hand, palm out, and stood perfectly still, and so did we. \"And he said, in the voice he uses for Brutus, as calm as a man ordering his breakfast, <em>Ladies and gentlemen. There is no danger. Please keep your seats.</em>\"</p>\n<p class=\"tape\">He let his hand fall.</p>\n<p class=\"tape\">\"And they sat down. Every one of them. He talked them down like a man gentling a horse. And the firemen put it out next door, and nobody was hurt, and we finished the play.\"</p>\n<p class=\"tape\">\"Were you frightened?\" Lottie said.</p>\n<p class=\"tape\">\"Not for a moment.\" He smiled at her. \"I was in the wings. I had my best speech still to come.\"</p>\n<p class=\"tape\">Everyone laughed. Somebody said it sounded like the Yankees ought to mind their fire engines. Somebody else said he'd read in the paper that it wasn't only the one hotel, it was a dozen of them, all over the city, the same night, and they were saying it was Southern men who did it.</p>\n<p class=\"tape\">Booth's face did not change at all.</p>\n<p class=\"tape\">\"So I read,\" he said. \"Afterward.\" And he turned back to Lottie and asked her whether she had ever seen a play, and the talk went on to other things.</p>\n<p class=\"tape\">I stood at the edge of it on my crutch and thought about his story. It had been beautifully told. He had given every part of that night its moment: the house on its feet, the bow to his mother, the shout, the seats banging, his brother's hand. And the only part he had nothing to say about was the part that was in every newspaper in the country.</p>\n<p class=\"tape\">A man who has read something afterward usually has an opinion about it. Booth had an opinion about everything.</p>\n<p class=\"tape\">When the crowd broke up, I watched Dr. Mudd take him by the arm and walk him down the road toward Bryantown, with a man I did not know walking on his other side. I did not think anything of that either, at the time.</p>\n<p class=\"tape\">That afternoon he rode up our lane alone, in the rain, and asked my mother if he might have a word with her son.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there and reached for his tea. It had been sitting beside him since the churchyard, and it must have been stone cold, but he drank it anyway.</p>\n<p>My pen was still above the page, and I had not written anything for some time. The churchyard, the fence, the good plates on the supper table: I had been there, all of it, and now I was back in his living room, with the woodstove ticking and the little red lights on the recorders, and my hand had gone stiff.</p>\n<p>\"So he came down to buy a horse,\" I said, \"and you sold him the roads instead.\"</p>\n<p>\"Not yet,\" he said. \"In November I only answered his questions. December was when I sold him the roads.\"</p>\n<p>I laughed before I could stop myself, and then I did stop, because he was not laughing.</p>\n<p>\"The fires,\" I said. \"In New York. Was that real?\"</p>\n<p>\"You'll look it up tonight,\" he said. \"I'd rather you did that than take my word for it. But yes.\"</p>\n<p>He was right. I would.</p>\n<p>\"And he knew?\"</p>\n<p>\"I don't know.\" He turned his pencil over in his fingers. \"That's the honest answer. He told the fire as if it were only a thing that happened to the Booths one night in New York. I used to think that meant he knew. Then I used to think it meant he didn't care. I've had a long time to think about it, and I still don't know.\" He looked up at me. \"You'd be surprised how much of it is like that.\"</p>\n<p>I wrote <em>Winter Garden. Fires. Did he know?</em> at the bottom of the page, and underlined the last part twice, and we stopped for lunch.</p>", "audio": false, "added": 1790546996279, "pt": [1790562708171, 1790693647384, 1790693647384, 1790562708171, 1790693647384, 1790562708171, 1790562708171, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790692270737, 1790861984290, 1790654385028, 1790546996279, 1790546996279, 1790546996279, 1790654385028, 1790546996279, 1790654385028, 1790654385028, 1790654385028, 1790692270737, 1790692270737, 1790654385028, 1790546996279, 1790546996279, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790654385028, 1790692270737, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790546996279, 1790546996279, 1790654385028, 1790546996279, 1790546996279, 1790692270737, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790861984290, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790546996279, 1790692270737, 1790654385028, 1790546996279, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790654385028, 1790546996279, 1790546996279, 1790654385028, 1790654385028, 1790654385028, 1790692270737, 1790692270737, 1790693427454, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790654385028, 1790861984290, 1790654385028, 1790654385028, 1790654385028, 1790693427454, 1790861984290, 1790693647384, 1790692270737, 1790693647384, 1790693647384, 1790654385028, 1790693647384, 1790654385028, 1790861984290, 1790693647384]}, {"num": 8, "title": "The Pitch", "extra": false, "html": "<p>At noon he made soup again, white bean this time, with a ham bone in it, and cornbread from a box that he apologized for. We ate it at the kitchen table and talked about nothing at all: the bakery that was closing, a fox he had seen in the field, a show Freda watched that I could not follow. He did not say Booth's name once.</p>\n<p>Afterward we went back to the living room. I turned the recorders on and said the time.</p>\n<p>\"December,\" he said. \"He came back in December, in the rain.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>December 1864</em></p>\n<p class=\"tape\">We walked out to the tobacco barn, because it was the only place on the farm where two men could talk without being overheard, and because Booth said he wanted to see the crop.</p>\n<p class=\"tape\">He did not look at the crop. He stood in the doorway with the rain running off the roof behind him and the tobacco hanging over our heads in long brown rows, curing in the dark, and he looked at me the way he had looked at me on the fence in November. Then he asked me how my cousin was.</p>\n<p class=\"tape\">I told him the truth. A second letter had come at the beginning of the month. It was shorter than the first. Ned had been sick, it said, and was better now, and two more of the boys from our company were dead. The last line said, <em>Tell Aunt Margaret I am sorry to be so much trouble.</em></p>\n<p class=\"tape\">My mother read it as good news. <em>He's better,</em> she kept saying. <em>He says so himself.</em></p>\n<p class=\"tape\">He had not said so himself. That was the first thing I saw, the first time I held it. The September letter had been in Ned's own pencil, big and leaning, with the letters pressed hard into the paper, the hand of a young man who had left school at twelve. This one was in ink, small and upright and careful, the hand of somebody who had been taught properly and wrote letters for a living. Somebody in that camp had written it for him. A man who was really better would have held the pencil himself. And <em>I am sorry to be so much trouble</em> is not what a man says when he is getting well. It is what he says to the people who are nursing him, near the end, when he knows.</p>\n<p class=\"tape\">I did not tell my mother. I told myself she would learn it soon enough from someone kinder. Lottie found the letter in the apron pocket and read it and came to me in the hayloft, white in the face, and asked me what it meant. She had seen it too. She was a reader. I could not make myself tell her she was right, and I could not make myself tell her she was wrong, so I said nothing at all, and she understood that as well.</p>\n<p class=\"tape\">Booth listened to all of it without once looking away.</p>\n<p class=\"tape\">\"I told your mother that somebody ought to make them trade,\" he said. \"Do you remember?\"</p>\n<p class=\"tape\">\"I remember.\"</p>\n<p class=\"tape\">\"I have spent the last month,\" he said, \"working out how.\"</p>\n<p class=\"tape\">He came in out of the doorway, and stood close, and lowered his voice under the sound of the rain.</p>\n<p class=\"tape\">\"I'm going to tell you something I have told very few men,\" he said. \"When I've finished, you'll want to know why I told it to you. I'll tell you that too.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">I am going to tell you what he said as closely as I can, and I am going to tell you why I listened. I am not asking you to agree with either of us. I am only asking you to stand in that barn with me, in December of 1864, and hear it the way I heard it.</p>\n<p class=\"tape\">\"You know the war is lost,\" he said.</p>\n<p class=\"tape\">He said it plainly, which surprised me, because every other man in that county still talked as though Richmond would hold forever.</p>\n<p class=\"tape\">\"Don't you?\" he said. \"You've been out there. You know better than these farmers.\"</p>\n<p class=\"tape\">I did not answer, and he took that as an answer.</p>\n<p class=\"tape\">\"Hood's army is smashed at Nashville,\" he said. \"It came over the wire this week. Sherman has walked straight through Georgia to the sea, and there was nobody left to stop him. Grant has Lee dug in at Petersburg and he is starving him out one railroad at a time.\" He counted them off on his gloved fingers. \"And we have no more men, Kit. That's the whole of it. Every man who can carry a rifle is carrying one. There's nobody left at home to send.\"</p>\n<p class=\"tape\">\"There are the prisoners,\" I said.</p>\n<p class=\"tape\">\"There are the prisoners.\" He pointed at me. \"Fifty thousand of them. The very men who could hold those lines, sitting in Northern camps, dying of cold and flux and short rations. And the Union knows exactly what they're worth, and won't give them back.\"</p>\n<p class=\"tape\">\"Grant won't trade them,\" he said. \"He's said so. Every man he sends home is a man back in the line against him, and he can afford to lose his own in our camps sooner than let ours go. It is not cruelty. I wish it were. Cruelty you could appeal to. It's arithmetic.\"</p>\n<p class=\"tape\">\"So you mean to change the arithmetic,\" I said.</p>\n<p class=\"tape\">He smiled at me then, the way you smile at a pupil who has got there first.</p>\n<p class=\"tape\">\"There is one man in the North,\" he said, \"whom they would trade anything for.\"</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">\"Do you know how he goes about Washington?\" Booth said. \"The President?\"</p>\n<p class=\"tape\">\"No.\"</p>\n<p class=\"tape\">\"With less guard than a general.\" He began to walk, up and down under the hanging tobacco, three steps and turn, the way I would later see him walk a stage. \"He has a cavalry escort he dislikes and a few policemen he puts up with, and he slips both of them whenever he can. He rides out in the evenings. He goes to the theater. He drives out to the soldiers' hospitals on the edge of the city, on country roads, with one carriage and a driver. He doesn't like soldiers around him. He says so. He is a stubborn man.\"</p>\n<p class=\"tape\">\"And?\"</p>\n<p class=\"tape\">\"And I mean to take him.\"</p>\n<p class=\"tape\">I did not say anything. The rain went on.</p>\n<p class=\"tape\">\"Not hurt him,\" Booth said. \"Take him. At some quiet place on some quiet road, with a handful of good men and fast horses. Out of the city before anyone knows he's gone. South across the Navy Yard Bridge, down through Prince George's and into Charles County.\" He stopped walking and looked at me. \"On roads you know in the dark. From one safe house to the next. Across the Potomac by night, in a boat that's waiting. Into Virginia, and on to Richmond.\"</p>\n<p class=\"tape\">\"And then?\"</p>\n<p class=\"tape\">\"And then the government in Richmond holds him. Safe, and comfortable, and treated like the President he is. And it offers to give him back.\" He smiled. \"In exchange for every Southern prisoner in every Northern camp.\"</p>\n<p class=\"tape\">\"Every one,\" Booth said. \"Point Lookout. Elmira. Camp Douglas. All of them, home by the spring. Your cousin home for planting.\" He took a step toward me. \"Fifty thousand men back in the line, Kit. The North would have to talk. They'd have to. And a war that ends in talking is not a war that ends in Richmond burning.\"</p>\n<p class=\"tape\">\"And if the President is hurt?\"</p>\n<p class=\"tape\">\"He won't be.\" He said it with complete certainty. \"He can't be. A dead President is worth nothing to anybody. He'd be a martyr, and they'd hang every man in Maryland for it, and they'd be right to. A live one is worth an army.\" He spread his hands. \"No one is to be hurt. I've told every man I've spoken to the same thing. You have my word.\"</p>\n<p class=\"tape\">I believed him. I have heard a great many men give their word, and I know the sound of a man who means it. He meant it. And it was a good plan. I stood in that barn and looked for the flaw in it, and I could not find one.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">\"Why me?\" I asked him.</p>\n<p class=\"tape\">He had thought about that too. He had thought about everything.</p>\n<p class=\"tape\">The route, he said, ran within a few miles of our door. It ran along roads I had known since I was a boy, and I had just shown him in November that I knew every one of them, which roads flooded, which ones the soldiers watched, which ones a wagon could use in the dark. A house on the route with a wounded veteran in it was a house the provost men would search politely and leave. A man on a crutch was a man nobody looked at twice. \"They'll look at a boy with two good legs,\" he said. \"They'll never look at you.\"</p>\n<p class=\"tape\">And he said that he had watched me in November, and that I was not what I seemed.</p>\n<p class=\"tape\">\"I don't know what you are,\" he said. \"I thought at first you were only a boy the war had broken. But you listened to every question I asked you on that fence, and you understood why I asked it, and you answered as if you didn't. I need men who can think. I have enough men who can ride.\"</p>\n<p class=\"tape\">I did not answer for a long time.</p>\n<p class=\"tape\">The rain came down on the barn roof. Somewhere out in the yard Hester was calling the chickens in, in the voice she used for them, which was the only voice she ever raised.</p>\n<p class=\"tape\">I thought about Ned.</p>\n<p class=\"tape\">I had never met Ned. That is the truth, and it is the part I have never been able to explain to anyone. The boy whose body I was living in had grown up with him, and gone across the river with him, and fought beside him, and I had none of it. Only the letters. The pencil. <em>I am sorry to be so much trouble.</em> And my mother's hand going to her apron pocket, over and over, all that fall.</p>\n<p class=\"tape\">I knew what that second letter meant, and I knew that a plan made in December would come too late for him, or very nearly. But there were two more boys from our company in that camp, and thousands of other women's sons, and if there was any chance at all for Ned, it was not going to come from waiting on Grant. It would have to come soon, and it would have to come from somebody doing something.</p>\n<p class=\"tape\">I thought about the other side of it, too. I am not a fool, and I was not a fool then. There were Union men in Southern camps. Everybody knew about Andersonville, down in Georgia, where the Yankee prisoners were dying faster than at any camp in the North. If the arithmetic was cruel, it was cruel in both directions, and a trade would send those men home too. Booth said that himself, when I raised it. I think he believed it mattered. I think he believed it mattered a little less.</p>\n<p class=\"tape\">And I thought about the tall man on the wall at Fort Stevens.</p>\n<p class=\"tape\">I am not a prophet. I have told you that. I did not know how the war would end, or when, or how many more men would die before it did. I only knew what I could see. And what I could see, that December, was a plan in which no one was meant to die, which might bring fifty thousand men home, which might end a war by talking. Against it, one stubborn man would be taken from his carriage by force and frightened, badly, for some weeks.</p>\n<p class=\"tape\">I have made worse trades, in other lives. I have made better ones.</p>\n<p class=\"tape\">\"What would you need from me?\" I asked.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">He did not need much, at first. That is how these things begin.</p>\n<p class=\"tape\">He needed to know the roads. So in the evenings, while my mother thought we were talking about horses, I drew them for him on the backs of old tobacco receipts: the road south from the Navy Yard Bridge, the tavern at Surrattsville, the turn toward Bryantown, the long way around the swamp, the farms where a man could be hidden, and the landing places on the river where the boats went across at night. When he asked who took people across, I told him there was a fisherman down by Pope's Creek named Jones, whom everyone said had put half the Confederate mail across that river, and whom you would never in your life get to admit it. He needed to know whose houses were friendly and whose were not. He needed a place to rest a horse, if it came to that.</p>\n<p class=\"tape\">He was going back to Washington before Christmas, he said. There was a young man there that Dr. Mudd had promised to introduce him to, a courier who carried letters back and forth to Richmond and knew every road between. He would write to me. I was to answer him at the National Hotel, where he kept a room.</p>\n<p class=\"tape\">\"And your mother?\" he asked.</p>\n<p class=\"tape\">\"My mother,\" I said, \"thinks you've come to buy a horse.\"</p>\n<p class=\"tape\">He laughed at that. Two days later he bought a horse at last, from Dr. Mudd's next-door neighbor, a man named Gardiner, as if to prove me right. It was a big dark bay, and it was blind in one eye. Everyone in the county knew about it by the end of the week, because it was a poor horse for a rich man to buy, and nobody could understand why a man who rode like that would want it.</p>\n<p class=\"tape\">I would see that horse again.</p>\n<p class=\"tape\">On his last evening in the county, he stood on our porch in his fine coat, with the rain finally stopped and the fields gone blue in the cold, and he shook my hand.</p>\n<p class=\"tape\">\"Home for planting,\" he said.</p>\n<p class=\"tape\">\"Home for planting,\" I said.</p>\n<p class=\"tape\">Lottie watched him ride away from the upstairs window. My mother came out onto the porch and stood beside me, and put her hand in her apron pocket, and asked me what we had talked about all that time.</p>\n<p class=\"tape\">\"Horses,\" I said.</p>\n<p class=\"tape\">It was the first real lie I told in that life. Everything before it had only been pretending to be someone. This one was mine.</p>", "audio": false, "added": 1790546996279, "pt": [1790694240640, 1790694240640, 1790568656957, 1790546996279, 1790546996279, 1790546996279, 1790595815550, 1790595815550, 1790595815550, 1790595815550, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790692270737, 1790692270737, 1790694240640, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790861984290, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790692270737, 1790546996279, 1790546996279, 1790546996279, 1790861984290, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790595841330, 1790546996279, 1790604858193, 1790604858193, 1790546996279, 1790546996279, 1790546996279, 1790604858193, 1790546996279, 1790546996279, 1790546996279, 1790567141236, 1790567141236, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279, 1790546996279]}, {"num": 9, "title": "Point Lookout", "extra": false, "html": "<p>He walked me out to the car at four o'clock, slowly, with one hand on the porch rail going down the steps. The light was already going. Somebody down the road was burning leaves, and the smoke hung low over the fields and made everything smell like the end of the year.</p>\n<p>\"How is your daughter?\" he asked.</p>\n<p>It was the kind of thing people asked. I nearly said <em>fine,</em> the way you do. But it had been a long day of listening to him, and he had listened to me at lunch the week before, and I found that I wanted to answer properly.</p>\n<p>So I told him. I told him that Freda was good. That she was taking chemistry this year with a teacher named Mr. Ostrowski, who wore a bow tie every single day and had once set his own sleeve on fire in front of the class, and that Freda, who had said all through ninth grade that she hated science, now came home and explained things to me about moles and molecules whether I wanted to hear them or not. Last week it had been a long complaint about the scale at her bench, which read everything about two percent heavy, so that her whole lab came out wrong and she had to write an extra paragraph at the end explaining why. That she had grown two inches since spring and none of her jeans fit. That she had started doing her homework at the kitchen table instead of in her room, which was new, and which I was not complaining about, because it meant I got to see her. That every light in the house was on whenever I came home, like Freda was expecting a party.</p>\n<p>\"And her phone buzzed all through dinner on Tuesday,\" I said. \"She turned it face down on the table without looking at it. She's been doing that. I thought, well, at least she's not texting at the table. I've been trying to get her to stop that for three years.\"</p>\n<p>He had stopped at the bottom of the steps. He was looking at me in the way he had, the mechanic listening to the engine.</p>\n<p>\"She knows what it is,\" he said.</p>\n<p>\"What?\"</p>\n<p>\"When the phone buzzes. She doesn't need to look, because she already knows what it will say. And she doesn't want to read it.\" He said it gently. \"Somebody is saying things to your daughter that she doesn't want to hear, and she doesn't want to be alone with them. That's why she works at the kitchen table now, where you are. And it's why every light in the house is on when you come home.\"</p>\n<p>I stood very still by the car.</p>\n<p>The thing about the lights had been a joke, one line in a long list. I had not thought about it twice. He had picked it out of everything else I said and put it next to the phone.</p>\n<p>\"You don't know her,\" I said.</p>\n<p>\"No,\" he agreed. \"But you do. And you'd noticed already, or you wouldn't have told me about the phone. You'd have told me about the chemistry teacher and stopped there.\"</p>\n<p>I did not answer that. I got into the car. He stayed by the steps while I turned around on the gravel, and I drove away down the road through the smoke.</p>\n<p class=\"break\">&#10043;</p>\n<p>I did not say anything to Freda that night.</p>\n<p>All the way home, two hours, with the radio off, I had thought about it. I had thought about sitting her down and asking straight out, <em>Is someone bothering you?</em> It was easy to picture exactly how that would go. Freda would say <em>no, Mom,</em> in the voice that meant the conversation was over, and go to her room, and shut the door, and take her homework with her. And then she would not be at the kitchen table anymore. And whoever it was would have her all to themselves.</p>\n<p>So I came in, and said hello, and hung up my coat, and did not look at the phone lying face down beside the chemistry book. Freda had made pasta. There was some left in the pot for me, with a plate on top to keep it warm, which was not a thing Freda had ever done before. I ate it standing at the counter and said it was very good, which it was.</p>\n<p>Then I got out my own laptop and sat down at the kitchen table across from my daughter, and went to work.</p>\n<p class=\"break\">&#10043;</p>\n<p>Point Lookout was real. I had known it would be.</p>\n<p>It was all there, a few clicks down: the long peninsula between the Potomac and the Chesapeake, and at the very bottom of it, where the two waters met, a flat, sandy point that was now a state park, with campsites and a fishing pier and a lighthouse. People went there on weekends to catch rockfish. There were photographs of families on the beach.</p>\n<p>In 1863 the Union had put a prison camp there. It was built to hold ten thousand men. At times it held nearly twice that. There were no barracks, only tents, on open sand, behind a high board fence, with water on three sides. Men wrote about the heat in summer and the wind off the bay in winter, about the bad water, about the rations. The exchange of prisoners had broken down in 1863, and after that, the men who went in mostly stayed until the war was over, or until they died.</p>\n<p>About a mile up the road from the park, beside the highway, there was a tall granite obelisk. The United States government had put it up in 1911. It said that three thousand three hundred and eighty-four Confederate prisoners had died at Point Lookout and been buried there, and that their graves had been moved, more than once, and could no longer be told apart. They were all together now, under the grass by the road. Their names were on bronze plaques around the base.</p>\n<p>Other websites gave other numbers, some of them much higher. None of them agreed with each other.</p>\n<p>I sat back.</p>\n<p>None of it proved anything. I wrote that in my notebook first. Everything he had told me about Point Lookout was on the first page of results. A man with ten thousand books and a lot of time could have read all of it in an afternoon. He could have read it forty years ago. He could have built a whole life, a whole Kit Keene, on top of an afternoon's reading, and believed it by now.</p>\n<p>But there were records. There were always records. That was the other thing I knew.</p>\n<p>The prisoner-of-war records were at the National Archives, and somebody had scanned a great many of them, and a genealogy company had put them online behind a paywall, at twenty-nine ninety-nine a month. A month ago I would not have spent thirty dollars to find out anything at all. For a while I looked at the button. Then I paid it.</p>\n<p>I searched for <em>Carroll,</em> for the boy Ned had written about, <em>Jem Carroll died of the flux on Tuesday.</em> There were more Carrolls at Point Lookout than I could check in a night, from Virginia and North Carolina and Maryland and Georgia, Jameses and Johns and a Jeremiah and several with only an initial. Any of them could be Jem. None of them had to be.</p>\n<p>Then I searched for <em>Keene,</em> and there were Keenes, too, but no Christopher, and then I stopped and made myself think it through. Kit had never been at Point Lookout. Kit had been shot outside Washington and carried home in a wagon under a load of potatoes. If there had ever been a Christopher Keene, he would not be in these records at all. The one who would be was the cousin.</p>\n<p>And I did not know the cousin's last name. Ned had called Kit's mother <em>Aunt Margaret.</em> He could have been a Keene, if he was the son of her husband's brother. He could just as easily have been anything else.</p>\n<p>I wrote it down: <em>Ned's last name?</em> And underneath it, smaller: <em>Would a real one know? Ask him. Watch how fast he answers.</em></p>\n<p class=\"break\">&#10043;</p>\n<p>\"Is that him?\"</p>\n<p>Freda had come around the table and was reading over my shoulder. I had not heard her get up.</p>\n<p>\"Is that who?\"</p>\n<p>\"The guy. Your guy. The Confederate.\" Freda leaned closer and read the screen. \"Point Lookout. Is that where he was?\"</p>\n<p>\"His cousin. He says.\"</p>\n<p>\"Oh.\" Freda read a little more, frowning. \"That's so many people.\" She was quiet for a moment. Then she said, \"Did the cousin die?\"</p>\n<p>\"I don't know yet. He hasn't told me.\"</p>\n<p>\"You should ask him.\" Freda straightened up. \"Actually, don't ask him. Let him tell you. You always say that, people tell you more if you wait.\"</p>\n<p>I looked up at her.</p>\n<p>\"I do say that,\" I said.</p>\n<p>\"You say it all the time.\" Freda went back around the table and sat down and picked up her pencil. The phone lay beside her chemistry book, face down, and it buzzed once, and she did not look at it. \"Tell me if the cousin dies, okay?\"</p>\n<p>\"Okay.\"</p>\n<p>We worked on, across the table from each other, until nearly eleven. Freda did her chemistry and I did nothing useful at all. I read about Point Lookout. I read about the exchange of prisoners, and why it had stopped, and who had stopped it. I read the same page about the obelisk twice. The phone buzzed three more times. Freda did not turn it over, and I did not look at it, and neither of us said anything about it, and every light in the house stayed on.</p>\n<p>When Freda finally went up to bed, she stopped in the kitchen doorway.</p>\n<p>\"Night, Mom.\"</p>\n<p>\"Night, baby.\"</p>\n<p>\"Don't call me baby.\"</p>\n<p>\"Night, Freda.\"</p>\n<p>Freda almost smiled, and went up. I sat for a while longer, in the bright kitchen, with the laptop open in front of me and the house quiet. Then I turned off the lights, one by one, all of them, and went up too.</p>", "audio": false, "added": 1790562708171, "pt": [1790694240640, 1790562708171, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790604858193, 1790562708171, 1790604858193, 1790694240640, 1790861984290, 1790694240640, 1790562708171, 1790861698841, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790861984290, 1790562708171, 1790562708171, 1790562708171, 1790694240640, 1790861984290, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790562708171, 1790694240640, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790694240640, 1790694240640, 1790562708171, 1790562708171, 1790694240640, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790562708171, 1790694240640]}, {"num": 10, "title": "H Street", "extra": false, "html": "<p>On the drive up I had decided how I would do it. I would not lead into it. I would not give him time.</p>\n<p>So I set out the two recorders, and said the date and the time, and before he had quite settled in his chair, I said, \"What was Ned's last name?\"</p>\n<p>\"Hurley,\" he said.</p>\n<p>He did not pause. He did not look at the ceiling, or at the floor. He said it the way you would say the name of the street you grew up on.</p>\n<p>\"Edward Hurley. His mother was Margaret's younger sister, Ann. She married a Hurley from St. Mary's County, a waterman, and died when Ned was small, and Ned was more or less raised at the Keenes' after that. That's why he called her Aunt Margaret and wrote to her instead of to anyone else. There was no one else.\" He tilted his head. \"You won't find him as Edward, if you're looking. The clerks at the camps wrote down whatever they heard. He'll be Ned, or E., and they spelled Hurley three different ways.\"</p>\n<p>I wrote it all down. I could feel him watching me write it.</p>\n<p>\"You've been looking,\" he said. It was not a question.</p>\n<p>\"I looked up Point Lookout.\"</p>\n<p>\"And?\"</p>\n<p>\"And it's real,\" I said. \"And it's on the first page of the internet, and anyone could have read it.\"</p>\n<p>\"Yes,\" he agreed, as if that were the right answer, and seemed pleased with me.</p>\n<p>I wanted, very much, to ask him the next thing. <em>Did Ned come home?</em> It was right there. But I heard Freda in my head, <em>let him tell you,</em> and closed my mouth and waited.</p>\n<p>He smiled a little, as though he knew exactly what I was not asking.</p>\n<p>\"In January,\" he said, \"I went to Washington.\"</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>January to March 1865</em></p>\n<p class=\"tape\">I told my mother I had found work in the city. It was nearly true.</p>\n<p class=\"tape\">The farm needed money more than it needed a lame boy. There was no cash for feed, no one to hire, and no crop worth selling until the tobacco went to market in the spring. Washington in the last winter of the war was full of work, and full of wages, and whatever I earned there I could send home. The government had grown enormous. Every office needed clerks, every hospital needed orderlies, every stable needed a man to muck it out. A Maryland farm boy with a bad leg and a decent hand could find something. If anyone asked about the leg, I was to say a wagon had rolled over it at harvest. Nobody in Washington knew that Kit Keene had ever crossed the Potomac. He had never been captured, so he had never been paroled, and the only papers with his name on them were muster rolls in a Confederate office somewhere in Richmond, where no Union clerk could read them. As far as the government was concerned, I was only a farm boy who limped.</p>\n<p class=\"tape\">I took a room in a tall narrow house near the Navy Yard, with a family from Charles County who knew my mother's people and asked me nothing at all. I found work copying invoices for a lumber merchant on the waterfront. And every day, on my way to work and on my way home, I walked past the end of the Navy Yard Bridge, and I watched the soldiers who guarded it.</p>\n<p class=\"tape\">That was my part. Booth had said so. Everything else could be planned in a parlor, but somebody had to know that bridge. What time the guard changed. How many men were on it at night. Whether they stopped every wagon or only the ones that looked like trouble. Whether they were bored. I watched them for two months, through the mud of a Washington winter, which was mud from one end of the city to the other and came up over your boots on the Avenue itself, and I wrote down what I saw on the backs of the lumber merchant's invoices, in a code that was only a list of prices, and I found out they were very bored indeed.</p>\n<p class=\"tape\">In February, the exchange started again.</p>\n<p class=\"tape\">After nearly two years, the two governments came to terms, and the boats began to carry prisoners down the Chesapeake and up the James River to be traded. The first men from Point Lookout went in the middle of the month. My mother wrote to me the week it was in the newspapers. She wrote in a hand I hardly recognized, it was so quick. <em>They are sending them home, Kit. Ned will be on the next boat.</em></p>\n<p class=\"tape\">He was not on the next boat. Or the one after. They went by lists, and nobody would tell a family whose name was on which list, or why. Every week my mother wrote to me, and every week the letter ended the same way: <em>Not yet.</em></p>\n<p class=\"tape\">The week the first boats went, I stood at the end of the Navy Yard Bridge with my invoices in my pocket and did the sum that Booth had done for me in the barn. The plan was to force a trade. Now there was a trade, and nobody had forced anything. Grant had simply changed his mind. <em>Home for planting,</em> Booth had said to me on our porch, and it looked, that week, as if Grant might send Ned home for planting without us.</p>\n<p class=\"tape\">I told myself that the plan was still needed. That a few boats were not all the camps. That the exchange had stopped before and could stop again. All of that was true. But I noticed, even then, that I was telling it to myself rather often. And I noticed that I had not gone to Booth and said any of it. I watched the guard change, and wrote down the time, and went home.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Booth took me to H Street for the first time in the middle of February.</p>\n<p class=\"tape\">It was a plain brick house with three stories and an attic, on a plain street a few blocks from the Patent Office, with steps up to the front door. He knocked, and the woman who opened it had a round, pleasant face, and dark hair parted in the middle, and a rosary in the pocket of her apron. She looked at Booth with a kind of fond exasperation, the way you look at a nephew who is charming and never on time.</p>\n<p class=\"tape\">\"Mrs. Surratt,\" Booth said on the step, before we had gone in, \"this is Kit Keene. Margaret Keene's boy, from Bryantown.\"</p>\n<p class=\"tape\">Her face changed.</p>\n<p class=\"tape\">Her name, Surratt, meant nothing to me. I have told you the rule: never say a name first, and never pretend to know more than you do. So I smiled, and waited, and let her tell me.</p>\n<p class=\"tape\">\"The boy in the potatoes,\" she said. \"At the tavern, in the summer. I never saw your face, only the sacks, and your mother's. I gave her blankets for you.\" She took my hand in both of hers. \"Well. Look at you. Walking.\"</p>\n<p class=\"tape\">It was the widow from Surrattsville. Her name was Mary Surratt. She had come to the city that autumn to take in boarders, and in December she leased the tavern out, and this was her house.</p>\n<p class=\"break\">&#10043;</p>\n<p>I had stopped writing.</p>\n<p>\"Mary Surratt,\" I said. \"The one they hanged.\"</p>\n<p>\"Yes.\"</p>\n<p>I knew the name the way everyone knows it, from a line in a history book: the first woman the federal government ever executed. I had never once thought of her as someone who opened a door, or had a face, or gave a stranger's mother two blankets on a hot day.</p>\n<p>\"You knew her,\" I said.</p>\n<p>\"I ate at her table.\" He was looking at the notepad, not at me. \"You're going to ask me whether she knew what they were planning. Everyone who has ever heard of her asks that. I'll tell you what I thought that first night. Later, I'll tell you what I came to think, and they aren't the same, and I'd ask you not to hurry me from one to the other.\"</p>\n<p>I thought about hurrying him. Then I picked up my pen.</p>\n<p class=\"break\">&#10043;</p>\n<p class=\"tape tape-head\"><em>February 1865</em></p>\n<p class=\"tape\">I want to tell you exactly what I thought of her that first night, because a great deal came to depend on it later, and because I have had a long time to wonder whether I was right.</p>\n<p class=\"tape\">I thought she was kind. I thought she was devout; she went to Mass every morning at St. Patrick's, a few blocks away, and the rosary was worn smooth. I thought she was a widow who had been left with debts by a husband who drank, and who was doing what she had to do to keep her children fed. And I thought she was a woman who had learned, over a long time, exactly which questions not to ask. Men came and went from her house at all hours. Her son rode off to Richmond and came back with papers sewn into his boots. She served them all supper and asked them how the weather had been on the road.</p>\n<p class=\"tape\">She knew. That is what I thought, that night. I did not know yet how much.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">Her son was in the parlor. He was the courier Dr. Mudd had promised to introduce to Booth before Christmas, the young man who knew every road between here and Richmond. John Surratt was twenty years old, tall and very thin, with a sharp face and a little pointed beard he was plainly proud of. He had been a courier for the Confederacy since he was seventeen, carrying letters across the river and back, and he had never once been caught, and he could not stop telling you so. Not in words. In the way he sat, and the way he checked the window, and the way he lowered his voice to say ordinary things. John Surratt loved a secret more than he loved any cause a secret could serve. I have met that kind of man in every century. They are brave, and useful, and they will get you killed, because they cannot bear for anyone not to know how much they know.</p>\n<p class=\"tape\">The last time I saw John Surratt, he was standing on a stage in Rockville, Maryland, more than five years later, selling tickets to all of this. He never said my name.</p>\n<p class=\"tape\">A little after we sat down, another young man came down the stairs with a newspaper and settled by the lamp. He had not been in the hall when Booth said my name at the door, and nobody introduced him, which is why I noticed him. His name, I learned later, was Louis Weichmann. He had been at school with John, and he boarded in the house and shared John's room, and he worked as a clerk in the War Department, in the office of the Commissary General of Prisoners. He was plump and soft-spoken and polite, and he said good evening to Booth, and to me, and went back to his newspaper.</p>\n<p class=\"tape\">He did not turn a page for the next half hour.</p>\n<p class=\"tape\">I watched him not turn it. He was listening to every word. He was not one of us, and he was not against us. He was a young man who had put himself in a room where interesting things were said, and who was remembering all of them, and who had not yet decided what he would do with what he remembered. I thought, <em>if this goes wrong, that one will talk.</em> I did not think it as a prophecy. I thought it the way you notice that a bridge rail is loose.</p>\n<p class=\"tape\">Walking back down H Street in the cold, I told Booth what I thought of Weichmann. He stopped under a streetlamp and laughed.</p>\n<p class=\"tape\">\"Weichmann?\" he said. \"Weichmann is John's oldest friend. He's harmless.\"</p>\n<p class=\"tape\">\"He's a clerk in the War Department,\" I said, \"and he shares a room with a Confederate courier. Nobody is harmless who is in both of those places at once.\"</p>\n<p class=\"tape\">It was only later, lying awake in my narrow room by the Navy Yard, that I understood what office that was. The Commissary General of Prisoners. The office that kept the lists: every prisoner in every Northern camp, his name and his regiment and where he was held, and whether he was sick, and whether he was dead. My mother had written to that office twice already, that winter, in her best hand, and had never had an answer. Weichmann sat at a desk in that office every day. He could have found Edward Hurley of St. Mary's County in an afternoon. He could have told my mother whether Ned was on a list, or when.</p>\n<p class=\"tape\">I never asked him.</p>\n<p class=\"tape\">I wanted to. I lay there and wanted to more than I have wanted most things. But to ask, I would have had to give him my name, and Ned's, and my mother's, and the name of our county, and tell him why a farm boy with a limp cared so much about one prisoner at Point Lookout. And I had already decided that Weichmann was the one who would talk. So I did not give him my name. Not then, and not ever. From that night on, when I was in that house, I made sure that nobody said it where he could hear.</p>\n<p class=\"tape\">I chose the plan over my cousin. I did not put it to myself that way at the time. I have put it to myself that way since, a great many times.</p>\n<p class=\"tape\">But all of that was later. That night Booth only put his arm through mine, and said I was a gloomy devil and he was glad to have me, and talked about something else.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">The others I met one at a time, over the next weeks.</p>\n<p class=\"tape\">George Atzerodt was a German, a carriage painter from Port Tobacco, down in our own county, with a thick accent and a bad beard and a laugh that was always a little too loud. He had spent the war rowing people across the Potomac at night, for money, spies and couriers and anyone who could pay, and that was why Booth wanted him: he knew the river, and he had a boat, or said he did. He drank. Mrs. Surratt would not have him in the house for long, because she found liquor bottles in his room. I liked him more than I should have. He was a man who would say yes to anything, cheerfully, as long as the thing was far away, and I thought, watching him, that if the thing ever came close, he would find he had somewhere else to be.</p>\n<p class=\"tape\">David Herold was twenty-two and looked sixteen. He had been a clerk in a drugstore, and he had grown up hunting partridges in the woods of Southern Maryland, and he knew those roads nearly as well as I did. That made us rivals, at first, in the way of young men. He would say <em>the road past Beantown,</em> and I would say <em>not in March, it floods,</em> and he would say <em>not if you take the ridge,</em> and Booth would laugh at us. He talked too much, and he was a little in love with Booth, the way a younger brother is. There was no harm in him at all. I have thought about that many times.</p>\n<p class=\"tape\">Samuel Arnold and Michael O'Laughlen came down from Baltimore. They had been boys with Booth there, and both had served in the Confederate army, and both had come home. Booth had brought them in the summer before, long before me. O'Laughlen was small and dark and quiet and did what Arnold did. Arnold was the sensible one. He had a clerk's careful face and a soldier's impatience, and every time I saw him, he asked Booth the same question: <em>When?</em> He had been waiting since August. He was beginning to think it would never happen, and a part of him, I think, was beginning to hope so.</p>\n<p class=\"tape\">And then, in March, a giant came to the door.</p>\n<p class=\"tape\">He gave his name as Wood, the first time. The next time he came, Weichmann told me afterward, he was a Baptist preacher named Paine. His real name was Lewis Powell. He was twenty years old and over six feet tall, with shoulders like a doorframe, and he had been a Confederate soldier, and been wounded and captured at Gettysburg, and escaped, and ridden with the partisans in Virginia. He ate everything that was put in front of him, quickly, without looking up. He said almost nothing. When Booth spoke, Powell listened the way a good dog listens: completely, and without any thought of his own.</p>\n<p class=\"tape\">He was the only one of them who frightened me. Not because he was cruel. I never saw him be cruel. It was that there was nothing in him that would stop. Every one of the others had some small door in the back of his mind that he could go out of, if it came to that. Arnold's was his doubts, and Atzerodt's was his cowardice, and Herold's was his boyishness, and John Surratt's was his love of the game for its own sake. Powell did not have one. Whatever Booth asked, Powell would do, all the way to the end of it.</p>\n<p class=\"tape\">I noticed that Booth had noticed it too.</p>\n<p class=\"break tape\">&#10043;</p>\n<p class=\"tape\">On the fifteenth of March, Booth gathered all of us together for the first and only time.</p>\n<p class=\"tape\">He took a private room upstairs at Gautier's, a fine restaurant on Pennsylvania Avenue, and ordered oysters and cigars and more to drink than anyone needed. That same night he had taken a box at Ford's Theatre, the President's own box, and sent John Surratt and Powell to sit in it and study it, with two girls from the boarding house along for cover. They came to Gautier's afterward, flushed and pleased with themselves, and John described the box to us the way you would describe a castle you meant to storm.</p>\n<p class=\"tape\">And then Booth told us the new plan.</p>\n<p class=\"tape\">He wanted to take Lincoln from the theater. In the box, during the play. Two men to seize him, one to gag him, and then lower him over the rail to the stage, carry him out the back door into the alley, and away. The audience would think it was part of the performance, he said, until it was too late. He was an actor. He knew that stage. He knew how long it took a crowd to understand what it was seeing.</p>\n<p class=\"tape\">He was magnificent, telling it. I do not think I have ever seen a man more alive. He walked up and down the little room with his cigar, lowering an invisible President over an invisible rail, and for a few minutes, I think, every one of us could see it.</p>\n<p class=\"tape\">Then Arnold put down his glass.</p>\n<p class=\"tape\">It was madness, Arnold said. A theater full of people. Gas lamps. Soldiers in the audience, half of them armed. A man of Lincoln's size, who would not come quietly, lowered twelve feet to a stage in front of a thousand witnesses, and then carried out through a door that anyone could run to. They would all be killed, or taken, before they reached the alley. If Booth had meant the road, the carriage, a quiet place in the country, then Arnold was still with him. But not this.</p>\n<p class=\"tape\">The room went quiet. Booth stopped walking.</p>\n<p class=\"tape\">Arnold told it afterward, in an account of his own, and I have read it more than once. He said that Booth said that any man who backed out now deserved to be shot. And that he, Arnold, said that two could play at that game.</p>\n<p class=\"tape\">I was in the room. That is about how it went. I would add only that when Booth said it, he was smiling, and that nobody laughed, and that I looked across the table at Powell and saw that Powell was not smiling at all. He was looking at Booth, waiting to see if he meant it.</p>\n<p class=\"tape\">I spoke then. I had not meant to. I said that Mr. Arnold was right about the theater, and that the road was better, and that there were only two things we truly needed to know: when the President would next leave the city in his carriage, and whether the guard on the Navy Yard Bridge would stop a party of horsemen at night. And that I could tell them the second one already.</p>\n<p class=\"tape\">They all looked at me. Booth looked at me longest.</p>\n<p class=\"tape\">\"Well?\" he said.</p>\n<p class=\"tape\">\"They won't,\" I said. \"There's an order that nobody crosses after nine o'clock at night. It's written down, and the sergeants know it. But the war is nearly over, and they're bored, and they're watching for rebels coming into the city, not farm boys going home. A man riding south who says he's going home to Maryland, they let him go. I've watched them do it.\"</p>\n<p class=\"tape\">Booth began to smile again, slowly, and this time it was real.</p>\n<p class=\"tape\">I should have stopped there. But there was a thing I had been carrying for a month, and the wine had loosened it.</p>\n<p class=\"tape\">\"And the exchange?\" I said. \"It's started again. They're sending men home from Point Lookout every few weeks. My mother reads the lists.\"</p>\n<p class=\"tape\">The smile did not go anywhere. Booth only waved his cigar, as if I had mentioned the weather.</p>\n<p class=\"tape\">\"A few boatloads,\" he said, \"when it suits Grant. It's a Yankee trick, Kit, to make us feel grateful while they finish us. They'll stop it again the day it stops suiting them.\" He leaned on the table toward me. \"We're past trading prisoners. Take him, and the North has to talk to us, and the war ends. That's what this is for now.\"</p>\n<p class=\"tape\">It was not the reason he had given me in the barn.</p>\n<p class=\"tape\">I noticed it. And I told myself it was the same reason, only bigger, the way a man's reasons grow when the stakes do. I have told myself that sort of thing a great many times since, and I am nearly always wrong.</p>\n<p class=\"tape\">\"The road, then,\" Booth said, and raised his glass to Arnold, and Arnold, after a moment, raised his.</p>\n<p class=\"tape\">The next day, word came. The President was to drive out to a hospital at the edge of the city on the afternoon of the seventeenth, to see a play performed for the wounded soldiers. On a quiet road. In his carriage. With almost no guard.</p>\n<p class=\"tape\">We had our chance.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there. The light outside had gone gray.</p>\n<p>\"You'll look for me,\" he said, \"in what Weichmann told the court, and in what Arnold wrote down afterward. You'll look carefully, because that's what you do.\"</p>\n<p>\"Yes.\"</p>\n<p>\"You won't find me. Nobody mentions me.\" He turned the pencil over. \"I kept my name out of Weichmann's hearing, from that first night on. That was never enough, and I knew it; he had seen my face, and the cane. So I came to H Street as little as I could, and when I saw Booth, I saw him at the National, where nobody from that house was listening. And the ones who did know me had every reason to leave me out. Naming a man the government didn't know about only made the plot bigger, and them guiltier.\" He set the pencil down. \"Now you know part of why.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>The house is still there. I looked it up that night, at the kitchen table, with Freda across from me doing her homework.</p>\n<p>It was not 541 anymore. The city had renumbered the streets long ago, and it was 604 H Street now, in the middle of Chinatown, with a restaurant on the ground floor and a historical marker by the door. I had walked past it a hundred times. I had eaten there once, years ago, with people from the paper, and never looked up.</p>\n<p>Then I did what I had come home meaning to do, and looked for Edward Hurley.</p>\n<p>It was harder than I expected. Some of the Point Lookout records were online and some were not, and the ones that were had been typed up from handwritten lists by volunteers, and the index stopped and started. I found Hurleys. I found a Hurly and a Hurlee and an E. Hurley with no county beside it, which could have been anyone at all. The register for that winter, the site said, was one of the reels nobody had scanned yet. It was on microfilm at the National Archives, on Pennsylvania Avenue. I looked at the map. It was twenty minutes from my front door.</p>\n<p>On the calendar, in the next free morning, I wrote: <em>Archives. Hurley.</em></p>\n<p>\"Did the cousin die yet?\" Freda said, without looking up.</p>\n<p>\"He hasn't said.\"</p>\n<p>\"You didn't ask him?\"</p>\n<p>\"I didn't ask him.\"</p>\n<p>Freda looked up then, and gave me a small, approving nod, like a teacher, and went back to her homework.</p>\n<p>The phone lay face down beside the chemistry book. It buzzed once, a little after nine. Freda turned it over, and read whatever it was, and I watched her face go still and shut. Then Freda turned it face down again and picked up her pencil and wrote something very carefully in the margin of her worksheet, and did not look at me, and I did not look at her.</p>\n<p><em>Somebody is saying things to your daughter.</em></p>\n<p>I turned the page of my notebook, and did not turn it back, and did not ask.</p>", "audio": false, "added": 1790565051993, "pt": [1790694240640, 1790694240640, 1790565051993, 1790861984290, 1790565051993, 1790694240640, 1790565051993, 1790565051993, 1790565051993, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790565051993, 1790565051993, 1790565051993, 1790567141236, 1790565051993, 1790610090237, 1790567141236, 1790567141236, 1790567141236, 1790709253842, 1790709253842, 1790565051993, 1790567141236, 1790604858193, 1790567141236, 1790604858193, 1790567141236, 1790567141236, 1790694240640, 1790694240640, 1790567450982, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790709178882, 1790565051993, 1790565051993, 1790565051993, 1790567141236, 1790709253842, 1790830034990, 1790565051993, 1790565051993, 1790604858193, 1790604858193, 1790565051993, 1790709253842, 1790567450982, 1790567450982, 1790567450982, 1790604858193, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790861984290, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790567141236, 1790565051993, 1790565051993, 1790565051993, 1790565051993, 1790567141236, 1790565051993, 1790567141236, 1790567141236, 1790567141236, 1790567141236, 1790567141236, 1790861984290, 1790565051993, 1790567141236, 1790567141236, 1790567450982, 1790567450982, 1790567450982, 1790830034990, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790694240640, 1790567450982, 1790567450982, 1790567450982, 1790567450982, 1790694240640, 1790694240640, 1790567450982, 1790694240640]}, {"num": 11, "title": "The National", "extra": false, "html": "<p>The client's question came on Tuesday, like the first one. It was one line.</p>\n<p><em>Please ask the gentleman whether he ever went to the National Hotel.</em></p>\n<p>I looked it up before I did anything else. The National had been the grandest hotel in Washington before the war, on Pennsylvania Avenue at Sixth Street, a short walk from the Capitol. Congressmen lived there. So did John Wilkes Booth, whenever he was in the city, in room 228. The building had been torn down in 1942.</p>\n<p>So it was not an odd question at all. It was the most natural question in the world. Booth lived there, and the old man said he had been one of Booth's men.</p>\n<p>I read it again anyway. It had taken the client two weeks of silence to ask it.</p>\n<p>I had also called the National Archives. You could not simply walk in and ask for microfilm, it turned out. You needed a researcher card, and to get one you had to sit through an orientation, and the next orientation with a free seat was the following Monday. I put it on the calendar under <em>Archives. Hurley.</em> and felt, absurdly, as if the building were stalling me on purpose.</p>\n<p class=\"break\">&#10043;</
