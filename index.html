had been standing on a wall with bullets going past him, and I had been lying in a field on the side that was shooting.</p>\n<p>He did not make a speech. He said he would make one tomorrow, if they came back, and that he did not want to spoil it by saying anything now. And then he asked the band to play \"Dixie.\" The crowd didn't understand at first. You could feel them not understand. Then he told them, in a high, dry, country voice that carried to the back of that crowd without seeming to try, that he had always thought \"Dixie\" one of the best tunes he had ever heard, and that the other side had tried to take it for themselves, but that he had put the question to the Attorney General, and had been told it was now our lawful prize. That we had fairly captured it.</p>\n<p>And the crowd laughed. Thousands of them. And the band played \"Dixie,\" to the President of the United States, on the night the war ended, and I stood in the middle of all those Union people and heard it and could not breathe for a moment.</p>\n<p>I thought: that is a man who has already forgiven us. And I had spent the winter planning to steal him.</p>\n<p>Then I went on to the National, because there was nothing else to do.</p>\n<p class=\"break\">&#10043;</p>\n<p>Booth was in his room. He had been drinking all day. He was not loud, the way he usually was. That was the first thing that frightened me.</p>\n<p>He was sitting in the chair by the window with the curtain pulled back, watching the rockets go up over the city, and he did not turn around when I came in. On the table beside him there was a bottle of brandy, most of the way down, and a pistol. It was a small pistol, a pocket pistol, the kind a gentleman carries, and it was lying there on the table next to the brandy as if it had been set down in the middle of a thought.</p>\n<p>He had never carried one before. Not that I had seen. I had sat across from him at a dozen dinners and walked with him on a dozen nights, and he had never once had anything heavier in his coat than a cigar case.</p>\n<p>\"Kit,\" he said, without turning. \"Have you come to celebrate?\"</p>\n<p>I told him I had come to see how he was.</p>\n<p>\"I'm very well,\" he said. \"I'm better than I have ever been.\" He laughed. It was a bad laugh. \"You heard him? Tonight? Asking for 'Dixie'? Our song. He's taken our song, Kit, and he's giving it back to us like a present. Like a man gives a bone to a dog.\"</p>\n<p>\"He was being kind,\" I said.</p>\n<p>Booth turned around in the chair then and looked at me. I have seen a great many men's faces in a great many lives, and I have learned to read most of them. His, that night, I could not read at all. That frightened me more than the pistol.</p>\n<p>\"Was he,\" Booth said.</p>\n<p>I sat with him until he fell asleep in the chair, a little after midnight, with the rockets still going up and the bottle empty. It took a long time. He talked, and I listened, and none of it was about the kidnapping. It was about Rome, and Caesar, and Brutus, and how the men who kill a tyrant are honored for a thousand years. I told myself it was the brandy. I told myself it was an actor talking about a play he had been in. I have told myself a great many things.</p>\n<p>When he was asleep, I opened the trunk.</p>\n<p>It was not locked. Of course it was not locked. It was full, the way I had known it would be: shirts, costumes, a wig, a bundle of playbills, a box of cartridges, letters tied in bundles with string. I found my receipts in the second bundle, folded in half, between a bill from a tailor and a letter from a woman in Boston. Eleven of them. I counted them twice, because I had made eleven. The road south, the farm, the lane, the landing places, in my hand, on my mother's paper.</p>\n<p>There was another letter in that bundle, from a village outside Baltimore, in a hand I knew. It was signed <em>Sam.</em> It was Arnold's, telling Booth to wait, to be careful, to see how Richmond felt first. I held it in my hand for a long moment. I could have taken that too.</p>\n<p>I didn't. It was not mine to take. That is what I told myself. The truth is that if I had taken everything, Booth would have noticed the next morning, and known who had been in his room. If I took only my own, eleven slips of paper out of hundreds, he would never know they were gone.</p>\n<p>So I left Sam Arnold's letter in Booth's trunk, and I put my eleven receipts inside my shirt, and I closed the lid, and I let myself out.</p>\n<p>In the corridor, at the top of the back stairs, a waiter in a white jacket was standing with a tray of empty glasses, as if he had been waiting there for somebody to come out of a room.</p>\n<p>He did not say anything. Neither did I. I went past him and down the stairs with my eleven receipts against my chest, and I felt his eyes on my back the whole way down.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"You burned them,\" Iola said.</p>\n<p>\"In the stove at the lumber yard, the next morning. All eleven.\" He looked at his hands. \"It's why you won't find the Keene farm in any book. It's one of the reasons you won't find me.\"</p>\n<p>\"And Arnold's letter.\"</p>\n<p>\"Was in every newspaper in the country within the week. It helped put him in prison for four years.\" He met her eyes. \"You asked me if I was clever. I was clever that night. I made sure nothing would ever lead back to my mother's house. I did it quickly and quietly and well. And I left a man I had drunk with, who had argued for the sensible road, to take what came.\"</p>\n<p>\"You couldn't have taken it. Booth would have known.\"</p>\n<p>\"That was my reason,\" he agreed. \"It was a good reason. I've never been sure it was the real one.\"</p>\n<p>She wrote it down. Then, because she was honest on paper, she wrote underneath it, smaller: <em>Pistol. April 10. Check.</em></p>", "added": 1790596892936, "pt": [1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936, 1790596892936]}, {"num": 15, "title": "The Last Speech", "html": "<p>They ate lunch without talking much. She could tell he was somewhere else, and she let him be there. When they went back into the living room, he stood at the window for a while with his hands in his cardigan pockets, looking out at the field, before he sat down.</p>\n<p>\"The next night,\" he said, \"he gave the speech he had promised them.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 11, 1865</em></p>\n<p>Booth came for me at the lumber yard at six o'clock. He was sober and freshly shaved and very cheerful, and that frightened me more than the brandy had.</p>\n<p>\"Come and hear the great man,\" he said. \"He's going to tell us what he means to do with us.\"</p>\n<p>Powell was with him, a step behind, the way he always was, too big for his coat, saying nothing. And Herold came along too, trotting to keep up, talking. We walked up to the President's house through streets still hung with flags from the night before, and bunting, and candles in every window. The whole city was lit. People had put candles in every pane of glass they owned, so that the houses seemed to be made of light.</p>\n<p>The crowd on the lawn was bigger than the night before. It filled the grounds and ran out into the avenue, thousands of people, soldiers and clerks and families, and a great many Black men and women, standing together in a group near the front, dressed in their best, as if for church. Booth steered us through the crowd until we were quite close, under the tall window over the north door, near the front. He wanted to see.</p>\n<p>I saw Damon before the speech began.</p>\n<p>He was standing with the others near the front, a little to one side, very straight, in a dark coat that was not a waiter's coat. He had come on his own time. He was watching the window the way you watch a door you have been waiting a long time to see open.</p>\n<p>He had not seen us yet. I made sure to stand where Booth's shoulder was between us.</p>\n<p class=\"break\">&#10043;</p>\n<p>The window opened, and the President came out, and the crowd roared so that you felt it in your chest.</p>\n<p>He had a sheaf of papers in his hand. A man stood behind him and a little to one side with a candle, holding it up so that he could read. And every time he finished a page, he let it fall, and a small boy darted out from behind him and caught the pages as they came down, and gathered them up off the floor. His son, somebody near me said. Tad.</p>\n<p>He read it. He did not orate. I had heard great speakers, in other lives, men who could make a crowd weep or riot, and I had heard Booth, who could do both before supper. This was not that. It was a tired man in a window reading a careful, difficult paper about Louisiana: how the state had written a new constitution, and whether it should be let back into the Union, and on what terms. Most of the crowd had come for a victory speech. They got a lawyer's argument. I felt them grow restless around me, and shift, and murmur.</p>\n<p>Then he came to the part about the vote.</p>\n<p>Some people were unhappy, he said, that the new government of Louisiana had not given the vote to the colored man. And then he said, in that same dry, reading voice, that he himself would prefer that it were given now to the very intelligent, and to those who serve our cause as soldiers.</p>\n<p>It was one sentence in the middle of a long speech. He did not raise his voice for it. Half the crowd, I think, did not even hear it for what it was.</p>\n<p>The group near the front heard it. I watched it go through them. Nobody cheered. It was too big a thing to cheer. A woman put her hand over her mouth. An old man took off his hat and held it against his chest, as if a flag were going by.</p>\n<p>And Damon closed his eyes.</p>\n<p>That was all he did. He stood very straight in his good coat in the candlelight and closed his eyes, the way a man does when he has been carrying something heavy a long way and has finally been told he can set it down. Not here yet. Not today. But the door was open. For the first time in his life, a President of the United States had stood at a window and said it out loud.</p>\n<p>Beside me, Booth said, \"That means citizenship.\"</p>\n<p>He said a good deal more than that, in words I will not use in your house. And then he said, not loudly, but in the trained voice that could carry to the back of any theater in America without seeming to try:</p>\n<p>\"That is the last speech he will ever make.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>I have told you that I was clever in that life. I want you to understand that it did not take cleverness to understand that sentence. A child would have understood it. But I will tell you how it fell into place for me, standing there, because it all fell at once, and it was the worst moment of that life.</p>\n<p>The pistol on the table, the night before, where there had never been a pistol. The brandy, and the quiet, and the talk about Brutus. <em>The men who kill a tyrant are honored for a thousand years.</em> The kidnapping dead, and Booth not grieving for it at all, only waiting, the way an actor waits in the wings. And now this: the last speech he will ever make.</p>\n<p>He was not going to take the President anywhere. There was nowhere left to take him. He was going to kill him.</p>\n<p>I turned my head and looked at Powell. Powell was looking at Booth. He was not shocked. He was not anything. He was waiting to be told.</p>\n<p>And past Powell, through a gap in the crowd that had opened when people shifted to leave, I saw Damon.</p>\n<p>His eyes were open again. He was looking straight at us. At Booth, who had just said it, and at Powell beside him. And at me, standing at Booth's elbow, in the coat Booth had bought me, as close to him as a brother.</p>\n<p>He had heard it. I do not know how, over that crowd, but I saw on his face that he had heard every word, and I saw him look at me and put it together with everything else he knew: the farm, and the war, and the dinners at the National, and a saddled horse with no rider on the night of the seventeenth, and a man coming out of Booth's room at midnight with his shirt full of paper.</p>\n<p>Then the crowd closed again, and he was gone.</p>\n<p class=\"break\">&#10043;</p>\n<p>I walked back down the avenue with them afterward. I laughed when Herold made a joke. I said good night to Booth at the door of the National and shook his hand.</p>\n<p>I want you to understand why.</p>\n<p>I lay awake all that night in my room by the Navy Yard, and I went through it the way I would go through any problem, one door at a time.</p>\n<p>I could go to the police. And say what? That an actor, drunk and angry, had said something ugly about the President in a crowd? Half of Washington had heard somebody say something ugly about the President that week. The Provost Marshal had drawers full of such reports. They would ask me how I knew John Wilkes Booth so well. And the answer to that was a kidnapping plot, and the answer to that was a rope. For me, and for Arnold and O'Laughlen in Baltimore, and for a widow on H Street who had given my mother blankets, and for the people in Charles County who had hidden me, and for my mother. And they would still not have Booth, because Booth had done nothing yet, and he was the most famous young actor in America, and he would laugh at them.</p>\n<p>I could run. Go home, and sit on the porch in Bryantown, and wait, and read about it in the newspaper.</p>\n<p>Or I could stay exactly where I was. At Booth's elbow. The man he trusted, the man who knew the roads. If he meant to do it, he would need the others, and he would need a time and a place, and he would tell me, because I was one of his. And then I would know when, and where, and who. And I could stop it. Not with the police. Myself. Quietly. The way I had taken back my drawings: so that nobody would ever know anything had happened at all.</p>\n<p>It was the cleverest of the three. I lay there until the window went gray and could not find the flaw in it.</p>\n<p>There was one. There were two, in fact. The first was that I was not the only clever man watching Booth.</p>\n<p>The second was that the other one had just seen me standing at his elbow.</p>\n<p class=\"break\">&#10043;</p>\n<p>\"You stayed,\" Iola said. \"On purpose. To spy on him.\"</p>\n<p>\"To be inside when it happened. Yes.\"</p>\n<p>\"That's insane.\"</p>\n<p>\"It was the only door that led anywhere,\" he said. \"The police door led to the rope and didn't stop him. The home door led to the newspaper. Only that one went through the room where he would decide.\" He looked at her. \"Tell me which you'd have chosen. Honestly.\"</p>\n<p>She opened her mouth, and closed it again.</p>\n<p>She had chosen it herself, once. Six years ago. A source inside Carrow House, who could have walked away and didn't, because inside was the only place you could see what they were doing. She had told him to stay. She had told him it was the only way.</p>\n<p>She did not say any of that. She wrote down <em>April 11,</em> and underlined it, and after a moment she wrote, underneath, <em>the other one,</em> and looked at it, and did not ask.</p>", "added": 1790597004832, "pt": [1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832, 1790597004832]}, {"num": 16, "title": "Lafayette Square", "html": "<p>The client's question came on Tuesday.</p>\n<p><em>Please ask the gentleman whether he ever spoke to the waiter again.</em></p>\n<p>Iola read it standing at the kitchen counter, and then she read it again, and then she went and got the transcripts.</p>\n<p>It was a strange question. Everything the client had asked so far had made a kind of sense. The color of a thread, which nobody could check. The National Hotel, where Booth lived. Those were a skeptic's questions, the questions she would have asked herself, trying to catch a man in a lie. But the waiter was nobody. The waiter had said perhaps twenty words in the whole story. Out of everything in eight sessions, the President and Booth and the plot and the guns, the client wanted to know about the waiter.</p>\n<p>She wrote it on a sticky note and put it on the front of her notebook, and under it, in small letters, <em>why?</em></p>\n<p class=\"break\">&#10043;</p>\n<p>On Thursday he read the sticky note before she had even read him the question. He read it upside down, across the table, while she was setting out the recorders. She saw him do it.</p>\n<p>\"<em>Why,</em>\" he said. \"Good.\"</p>\n<p>\"You tell me.\"</p>\n<p>\"I don't know,\" he said. And for the first time since she had known him, she believed he did not. He sat back and looked at the empty frame on the mantel for a long moment. \"Your client likes Damon,\" he said at last, slowly. \"Or he wants to know whether I did.\" Then he shook his head, as if putting it away for later. \"Tell him yes. Once more. Tell him I'll get there.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>At lunch she told him about the school.</p>\n<p>She had not meant to. It came out sideways, the way things do, because the soup was good and because it had been a bad week. She told him that the car had made a noise on Monday that cost four hundred dollars to find out was nothing. That the gutter people wanted twelve more articles about gutter guards, which she was going to write, because it was money. That Freda's school had called on Wednesday, the chemistry teacher, Mr. Ostrowski, the one with the bow ties, to say that two lab write-ups had come in nearly the same, word for word, and he had to treat them both as copied until he knew otherwise, and one of them was Freda's.</p>\n<p>\"And Freda says she didn't,\" Iola said. \"And she won't say anything else. Not who, not how. She just goes up to her room.\" She stirred her soup. \"She's not a cheater. She's the most annoyingly honest person I know. She told her dentist she doesn't floss.\"</p>\n<p>He did not say anything. He listened, the way he always did, and when she had finished he asked how the car was now, and whether the gutter people paid on time, and he did not say one word about Freda or the school or the lab. She was almost disappointed. Then she was annoyed with herself for being disappointed, and then the soup was gone, and they went back into the living room.</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 12 and 13, 1865</em></p>\n<p>I had decided to stay inside. Now I had to find out what inside was going to do.</p>\n<p>Booth told us nothing. That was the first thing I learned. On the twelfth and the thirteenth he was everywhere in the city and with all of us, cheerful, restless, buying drinks, and he said nothing at all about the President. He did not need to. Whatever he was going to do, he had not yet decided when, and a man like Booth does not share a plan until he has the ending.</p>\n<p>So I did what I could do. I listened to his questions.</p>\n<p>A man's questions tell you what he is thinking far better than his answers do. Booth asked me a great many things over those two days, the way he had asked me about horses and roads on a fence in Charles County, lightly, between other remarks, so that each one sounded like nothing. He asked me the fastest way from Lafayette Square to the Navy Yard Bridge, at night, for a man on a horse. He asked me whether the Kirkwood House, at Twelfth Street and the Avenue, had a back way out onto the alley. He asked me, laughing, whether I thought Andy Johnson drank as much as they said.</p>\n<p>And on the afternoon of the thirteenth, in the dining room of the National, he read me a paragraph from the <em>Star</em> about the Secretary of State.</p>\n<p>Mr. Seward had been thrown from his carriage eight days before, when his horses bolted. It had been in all the papers. His jaw was broken and his arm, and he was lying in bed in his house on Lafayette Square, across from the President's house, badly hurt and under a doctor's care. Booth read me the paragraph about how he was getting on. Then he folded the paper and said, \"Poor old man,\" and changed the subject.</p>\n<p>I sat there with my coffee and put it together. It was not difficult. It only needed someone to put the pieces side by side.</p>\n<p>Lafayette Square: that was Seward's house. The Kirkwood House: everyone in Washington knew that the new Vice President, Andrew Johnson, had rooms there. And the President. The President, the Vice President and the Secretary of State.</p>\n<p>I knew enough about how that government was put together to know what those three men were. If you killed the President, the Vice President took his place. If you killed them both, and the Secretary of State too, the man whose office was supposed to send word to the states and call an election, then for a few days nobody would be quite sure who was running the country at all. Booth did not mean to kill a man. He meant to cut the head off the government, all at once, in one night, and see what grew back.</p>\n<p>It was, I have to tell you, a clever plan. It was the first truly clever plan I ever saw him make. It frightened me more than anything he had done.</p>\n<p>And it meant he would need three men, in three places, at the same moment. Himself, for the President. Powell, for Seward, because Powell would do anything and Seward's house would need a man who would. And for Johnson, one of the others. Atzerodt, most likely, who knew nothing about the city and would go where he was told.</p>\n<p>I knew who, now. I knew where. I did not know when.</p>\n<p class=\"break\">&#10043;</p>\n<p>I went back to the National late on the night of the thirteenth, to see if Booth had come in. He had not. The clerk said he had gone out to see the illuminations.</p>\n<p>The whole city was lit again that night, brighter than before. The government had ordered it: every public building covered in candles and gaslight and transparencies, and the private houses doing the same, so that the streets were as bright as noon. I had walked through it to get there and hardly seen it.</p>\n<p>I went through the lobby toward the stairs, and passed the doors to the dining room, which was closed for the night and dark except for one lamp at the far end, on the headwaiter's desk.</p>\n<p>Damon was sitting there. Writing.</p>\n<p>He was in his shirtsleeves, with the white jacket over the back of the chair, bent close to the lamp, and he was writing slowly and very carefully. I stood in the dark of the doorway and watched him, and he did not look up. He wrote to the bottom of a page. He read it through. Then he crumpled it, and put it in his pocket, and took a fresh sheet, and began again from the beginning.</p>\n<p>I watched him write it three times.</p>\n<p>The third time he did not crumple it. He read it through twice, and blotted it, and folded it, and put it in an envelope, and wrote something on the front, and sealed it. Then he sat for a moment with his hand flat on it, the way you rest your hand on a thing you are afraid of losing. And then he put on his coat, not the white jacket but his own dark one, the one I had seen him wear on the lawn two nights before, and came toward the door where I stood.</p>\n<p>I stepped back into the lobby, behind a pillar, and let him pass.</p>\n<p>He went out the front of the hotel into the bright street, and turned west, up the Avenue, toward the President's house, walking fast with the envelope held inside his coat. I watched him go until he was lost in the crowds and the light.</p>\n<p>I thought about that for a minute, standing behind the pillar. A man writing at midnight, in the best hand in Washington, three times over until every word was right. Sealing it. Resting his hand on it. Walking it out himself into the night, instead of trusting it to the post, holding it against his chest.</p>\n<p>I thought: he's in love with someone. Someone up that way, on the west side of the city, who works in one of the big houses there. It was the likely answer. A man only writes a letter three times for one reason, in my experience, and I had a great deal of experience.</p>\n<p>I was pleased with myself for it, I remember. And I went up to wait for Booth, and forgot about it.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there, and looked at the notepad for a while.</p>\n<p>\"I should tell your client,\" he said, \"that that was not speaking to him. I only watched.\" He smiled a little, not happily. \"I watched a great deal, that week. You'd think I would have seen more.\"</p>\n<p>Iola was writing. <em>Seward, carriage accident, April 5. Check. Johnson, Kirkwood House. Check. Illumination, April 13. Check.</em></p>\n<p>She looked up. \"You worked out all three targets. From some questions and a newspaper.\"</p>\n<p>\"From his questions. Anybody could have. Nobody else was listening to them.\"</p>\n<p>\"And you still didn't know when.\"</p>\n<p>\"No,\" he said. \"Nobody knew when. Not even Booth. Not until the next morning, when he went to collect his mail.\"</p>\n<p>He put the pencil down.</p>\n<p>\"That's Friday,\" he said. \"I think that's enough for today.\"</p>\n<p>It was only two o'clock. She did not argue. She packed up the recorders, and on the drive home she found that she kept thinking, for no reason she could name, about a man writing the same letter three times.</p>", "added": 1790597316850, "pt": [1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850, 1790597316850]}, {"num": 17, "title": "Good Friday", "html": "<p>She brought the box with her on the tenth Thursday.</p>\n<p>It was an ordinary banker's box, the cardboard kind with handholds cut in the ends, and it had lived on the top shelf of her closet for six years under a bag of winter hats. <em>CARROW</em> was written on the lid in marker, in her own handwriting from a worse time. She had taken it down on Tuesday night, after the client's question about the waiter, for no better reason than that odd questions made her want to go back over old ones.</p>\n<p>She had not meant to bring it. But it was on the passenger seat on Thursday morning, and she did not take it out again.</p>\n<p>He saw it when she came in and did not ask about it. He made the tea. She set out the recorders and did not turn them on, and while the tea steeped she found she was talking.</p>\n<p>\"I went back through it this week,\" she said. \"The old stuff. I haven't opened it since I left the paper.\"</p>\n<p>\"Did it help?\"</p>\n<p>\"No. It made me feel like I was thirty-eight again and about to be fired.\" She took the lid off anyway. \"It's mostly paper. My notes. Copies of the documents he gave me, the ones they said were fake. The correction, which I kept, because I'm like that.\" She lifted out a thin folder. \"And the police report. It took me three months and a records request to get this, and when I got it, it was two pages long and they'd spelled his name wrong.\"</p>\n<p>She told him about it the way you tell someone about a bad time you have mostly gotten over: all at once, jumping around, with too much in it.</p>\n<p>The officer who took the report had been named Delacroix, and he had called her <em>ma'am</em> in a way that made clear he thought she was a crank. The report said that the tenant had not been seen since approximately Wednesday, per the landlord. It said there were no signs of forced entry, no signs of a struggle, and that the tenant's vehicle was not at the address, which Iola could have told them, since he did not own a vehicle and never had. Petrakis had given the police a statement too, which was mostly about money. The tenant was two weeks behind on the rent. A moving company had been booked for the Saturday, a small outfit from across the river, and the movers had shown up and knocked and gone away again, and then sent Petrakis a bill for the trip, which he wanted the police to know he did not intend to pay. There was a list of what the officers had seen in the apartment, one line to a thing: <em>bed, unmade. Kitchen, dishes in sink. Framed family photographs on living room wall. Desk. No computer observed. Cat (1) in bedroom, door closed, removed by landlord.</em></p>\n<p>\"Two weeks behind on the rent,\" Iola said. \"I didn't know that at the time. I'd have lent it to him. He never said.\" She put the report back in its folder. \"And the movers. He'd told me he was going to move after the story ran, somewhere Carrow couldn't find him. I thought he meant eventually. He'd already booked them.\"</p>\n<p>\"For the Saturday,\" he said.</p>\n<p>\"For the Saturday.\" She shook her head. \"Anyway. It didn't help. I don't know why I brought it.\"</p>\n<p>She closed the box, and put it on the floor by her chair, and turned on the recorders.</p>\n<p>He did not say anything about any of it. He poured the tea, and looked at the box on the floor for a moment, and then he looked at the window.</p>\n<p>\"The fourteenth,\" he said. \"Good Friday.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 14, 1865</em></p>\n<p>It was Good Friday. I want you to remember that, because nobody does. The churches were full that morning. The Catholics in the city were at their long service, and Mrs. Surratt would have been at St. Patrick's, the way she was most mornings, and the Protestant churches were open too, for the ones who kept the day. And the rest of the city was still half drunk on the end of the war, and the flags were still up, and the theaters were all playing, because it was Washington, and Washington had never been as pious as it pretended.</p>\n<p>I did not go to church. I went to the National at ten o'clock, to find Booth.</p>\n<p>He was not in. The clerk said he had gone out early, to the barber's, and would be back for his mail. I stood in the lobby for a while, not knowing what to do with myself. The dining room was being laid for luncheon. I looked for Damon among the waiters, the way I always did by then, and he was not there. I asked the headwaiter, in passing, as if it were nothing, and he said the man had asked for the morning off, which he never did, and had gone out early.</p>\n<p>I thought: the woman on the west side of town. And I was glad for him, a little. And I put it away.</p>\n<p>At a little after eleven I saw Booth come down the Avenue from the barber's, freshly shaved and in a very good humor, and turn up Tenth Street. And I followed him.</p>\n<p>I do not know why I did it. I had been with him for two days waiting for him to tell me when. I think I had simply run out of patience with waiting. He did not look back. He walked the way he always walked, as if the street had been laid down for him that morning. And he went a block up Tenth Street and in at the front of Ford's Theatre.</p>\n<p>He had his mail sent there. All the actors in Washington did; Ford's was a kind of home to them. I knew that. I had walked him there a dozen times. So I crossed to the other side of Tenth Street, and stood in the doorway of a shop across the way, and watched the door.</p>\n<p>He was inside for no more than a few minutes. When he came out, he had a letter in his hand, and he was not reading it.</p>\n<p>I have told you that I could not read his face on the night of the tenth. I could read it now. He stopped on the steps of the theater, in the spring sun, with a letter in his hand that he had forgotten he was holding, and he looked up at the front of that building, at the upper windows, the way a man looks at a house he has just been told is his.</p>\n<p>Then he went down the steps, and walked away down Tenth Street toward the Avenue, fast, and did not see me.</p>\n<p>I stayed where I was.</p>\n<p>A minute later, a young man came out of the theater's front door onto the steps, bareheaded, in shirtsleeves, and called across the street to a man he knew who was passing. He called it cheerfully, the way you call good news, the way a man calls it who has tickets to sell.</p>\n<p>\"The President's coming tonight,\" he called. \"And General Grant! Tell everyone!\"</p>\n<p>The man he called to waved his hat. A woman who was passing turned to look. A boy ran off down the street, already shouting it.</p>\n<p>I stood in the doorway across Tenth Street and watched the news go out into the city from the steps of Ford's Theatre, the way a stone goes into a pond.</p>\n<p>Tonight. Here.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>Iola realized that she had not written anything for some time. The recorder's red light was on. The woodstove ticked.</p>\n<p>\"That's how he found out,\" she said. \"Collecting his mail.\"</p>\n<p>\"That's how he found out. It's in every book. He went to get his letters, and they told him.\"</p>\n<p>\"And you were across the street.\"</p>\n<p>\"I was across the street.\" He picked up his cup, found it was cold, and put it down again. \"I had three names and three places, and now I had a time. The only one who didn't know what I knew was the one man who could have stopped all of it by simply staying home.\" He looked at her. \"Nobody was going to tell him. That was the thing I understood, standing in that doorway. The whole city was about to know he was coming. And the one thing nobody in it was going to tell him was <em>don't.</em>\"</p>\n<p>He was quiet for a moment.</p>\n<p>\"Except one,\" he said. \"But I didn't know that yet.\"</p>", "added": 1790597457671, "pt": [1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671, 1790597457671]}, {"num": 18, "title": "The Afternoon", "html": "<p>He did not make soup that day. He made sandwiches, and they ate them standing in the kitchen, and neither of them suggested sitting down. The box with <em>CARROW</em> on the lid stayed on the living room floor by her chair, where she had left it. She saw him glance at it once, through the doorway, and then away.</p>\n<p>When they went back in, he did not sit. He stood by the window.</p>\n<p>\"I had ten hours,\" he said. \"I want to tell you how I spent them, because I spent them well. That's important. I don't want you to think what happened that night happened because I was slow.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 14, 1865, afternoon</em></p>\n<p>The first thing I did was decide.</p>\n<p>I had three men and three places and a time. I could not be in three places. I had to choose one, and I chose the theater, for two reasons. Booth was the only one of the three who would not lose his nerve; Powell would do anything, but Powell would do it only because Booth had told him to, and Atzerodt would go wherever the most brandy was. And Booth was the one I could get near. I was his friend. I could walk up to him anywhere in that city and he would smile and put his arm through mine.</p>\n<p>So I would stop Booth. And I would do it the way I had taken back my drawings: quietly, so that nobody ever knew that anything had happened.</p>\n<p>The second thing I did was follow him.</p>\n<p>When he came away from Ford's he went straight down to the Avenue and round behind the National, to a livery stable on C Street, a man named Pumphrey's, where he usually hired a horse. I stood across the street and watched him through the big open doors. He talked with Pumphrey a long time. He did not get the horse he usually had. They brought out a small bay mare instead, quick and nervous, with a white star on her forehead, and he walked round her twice and ran his hand down her legs, which he had not bothered to do with any horse in Charles County, and then said something and left her there, and came away.</p>\n<p>A fast horse, chosen carefully, for later in the day. I thought about the Navy Yard Bridge. I thought about the sentry who stopped the ones coming in and let the ones going out go home, and about the backs of my mother's tobacco receipts, which I had burned, but which I had drawn in the first place, and which Booth had studied for three months.</p>\n<p>He did not need the receipts anymore. He knew the road. I had taught it to him.</p>\n<p class=\"break\">&#10043;</p>\n<p>A little after two, he went to H Street.</p>\n<p>I did not go in. I stood on the corner in the sun, down the block, where I could see the steps. There was a hired buggy at the curb, with a horse and a young man holding it: Weichmann, who I had never let hear my name. And while I watched, Mrs. Surratt came out and down the steps in her bonnet and shawl, ready for a drive, and Booth came out after her, and on the steps he gave her a small package, done up in paper and string, about the size of a man's two fists. She took it and put it in the buggy. They spoke for a moment. Then Weichmann helped her up and they drove away, south, toward the Navy Yard and the bridge and the county. Toward the tavern.</p>\n<p>I stood on that corner and thought about that package for a long time.</p>\n<p>I did not know what was in it. I want to be honest with you about that, because it came to matter a great deal, later, to a great many people. I did not know, and I could not have known, from the corner of the street. I only knew that Booth had given a package to a woman who was driving that afternoon to a tavern on the road he would take that night, and that she had taken it from him and put it in the buggy without looking at it.</p>\n<p>A woman who asks no questions she does not want the answers to. I had thought that of her the first night I met her. I thought it again, standing on that corner, and I did not like it any better.</p>\n<p class=\"break\">&#10043;</p>\n<p>At four o'clock I was on the Avenue near Willard's, because I had lost him for an hour and the Avenue was where you found people. And I found him. He was on the bay mare now, sitting her the way he sat every horse, as if he had been born on it, talking down from the saddle to a man on the sidewalk, an actor I knew a little, named Mathews. He handed Mathews an envelope. Mathews put it in his coat.</p>\n<p>I have read since what was in it. Everyone has. It was a letter to the editor of the <em>National Intelligencer,</em> explaining to the country why he had done what he was about to do, and Mathews was to take it to the paper the next day. He was writing the reviews before the play had opened.</p>\n<p>And while I watched, an open carriage came down the Avenue from the direction of the President's house, with a soldier driving and trunks strapped on the back, and a stocky man with a short beard in the back seat beside a woman in a traveling bonnet. People on the sidewalk pointed. Somebody cheered. It was General Grant and his wife, leaving the city.</p>\n<p>Booth turned the mare's head and watched the carriage go by. His face did something I had not seen it do before. Then he wheeled the mare and rode off after it, not fast, keeping it in sight, and I lost him again in the traffic.</p>\n<p>I went down to the railroad station later, because I had understood, and I needed to be sure. The Grants had taken the train north. They were going to see their children in New Jersey. They were not going to the theater.</p>\n<p>Only the President, then. And his wife, and whoever they asked to sit with them in Grant's place. And no general in that box, with a general's instincts and a general's aides.</p>\n<p class=\"break\">&#10043;</p>\n<p>At six I went to Ford's and bought a ticket.</p>\n<p>That was the third thing I did, and I was proud of it. I stood at the box office window and asked the man for a seat in the dress circle, and while he found me one I looked past him at the plan of the house pinned to the wall behind his head, the way a man looks at a picture while he waits. The dress circle ran round the theater in a horseshoe, one floor up. At the right-hand end of it, the stage end, there was a narrow door, drawn on the plan as a little break in the line. That door led into a short passage, and the passage led to the two boxes that had been thrown together to make the President's box.</p>\n<p>One door. Anybody going into that box had to go through it. I bought the seat nearest to it that he had.</p>\n<p>\"You'll see him from there,\" the man said, handing me the ticket, meaning the President. \"Right across the way.\"</p>\n<p>I said I was sure I would.</p>\n<p class=\"break\">&#10043;</p>\n<p>I will tell you my plan, because it was a good one, and you should know that.</p>\n<p>I did not mean to fight him. I was a lame boy with a cane, and he was one of the finest swordsmen on the American stage and had a pistol in his coat. I did not mean to go to the guard, because there would be a guard, and a guard would ask how I knew, and we have been through where that door led.</p>\n<p>I meant to be loud.</p>\n<p>Booth needed, more than anything, not to be seen. He needed to walk through that crowded dress circle as if he were nobody, one more gentleman going to the back for air. And he was the most famous young actor in America. If a man stood up in that dress circle, with the whole house there, and called out <em>Mr. Booth! Mr. John Wilkes Booth, as I live!</em> and came limping toward him with his hand out, delighted, making a fuss, then every head in that half of the theater would turn. Every one. Women would stand up to see him. The ushers would come. And he could not go through that little door with three hundred people watching him do it. Not then. Perhaps not that night at all.</p>\n<p>It would not stop him forever. I knew that. But the Grants were gone, and the war was over, and the President might never be so easy to reach again. Every night I could buy was a night for somebody else to notice what I had noticed. It was the best plan I had, and I still think it was a good one.</p>\n<p>It needed only one thing. It needed me to be in that dress circle when Booth came in.</p>\n<p>At a quarter past eight I was standing on the pavement outside Ford's, in the crowd, with my ticket in my pocket, when the President's carriage came up Tenth Street.</p>\n<p>I watched him get down. He was tired. You could see it in the way he stood a moment on the pavement, as if deciding. His wife on his arm, and a young officer and a young lady I did not know, and he went in through the front doors past me, near enough to touch. And a minute later, through the open doors, I heard the orchestra stop in the middle of whatever it had been playing, and start \"Hail to the Chief,\" and the whole house come to its feet with a roar.</p>\n<p>I went in after them, and up the stairs, and found my seat, and turned it a little, so that I could see the door.</p>\n<p>I sat there for an hour, with the play going on below me and people laughing, and I did not take my eyes off that door, or off the stairs from the lobby.</p>\n<p>And at a little after half past nine, somebody touched my shoulder from behind, very lightly, and said, in a low voice that had to wait for its first word:</p>\n<p>\"M-Mister Keene.\"</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped there.</p>\n<p>Iola's hand had stopped moving on the page some time before. She looked down and found that she had written, in the margin, very small, the word <em>loud,</em> and underlined it twice.</p>\n<p>\"That was a good plan,\" she said. She had not meant to say it.</p>\n<p>\"It was a very good plan,\" he said. \"I've had a hundred and sixty years to look for the hole in it, and I've only ever found one.\" He looked at the box on the floor by her chair. \"Someone else was watching the same door.\"</p>", "added": 1790597725855, "pt": [1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855, 1790597725855]}, {"num": 19, "title": "The Message", "html": "<p>\"Go on,\" Iola said.</p>\n<p>He looked at the clock on the mantel, next to the empty frame. It was twenty past three.</p>\n<p>\"I'll tell you what he said,\" he said, \"and then I'll tell you what each of us saw. Because we both saw correctly, Ms. Barnett. That's what I need you to understand about that night. Neither of us made a mistake. That's what makes it unbearable.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 14, 1865, a little after half past nine</em></p>\n<p>I turned in my seat, and Damon was standing in the aisle behind me, bent a little toward me, the way a servant bends to a gentleman.</p>\n<p>He was in his white jacket from the National. That was how he had got in. I understood it at once, and I admired it, even then. A Black man in the dress circle of Ford's Theatre on a Friday night would have been stopped at the foot of the stairs and asked his business. But a hotel waiter in a hotel jacket, with a folded note in his hand, looking for a gentleman, is not a man. He is a message. The ushers had let him up without a second look. The people in the seats around me did not look at him at all.</p>\n<p>He held the folded note out to me, for show, and I took it. It was blank. He bent closer.</p>\n<p>\"He s-sent me,\" he said, very low, under the laughter from the stage. \"M-Mister Booth.\"</p>\n<p>I did not move.</p>\n<p>\"He says the D-Dutchman has lost his nerve. The one for the Vice P-President.\" Each word came out of him one at a time, pushed through, with a long terrible pause before the hard ones. \"He has g-gone to the Kirkwood himself. To s-see to it. You're to come. N-now. He says the theater will k-keep.\"</p>\n<p>Then he straightened up, and stepped back, and stood waiting, with his hands behind him, the way a servant waits to see whether there will be an answer.</p>\n<p class=\"break\">&#10043;</p>\n<p>I want to tell you what I thought, in the next half minute, because I thought very clearly, and every step of it was sound.</p>\n<p>First: that Damon knew Booth's business. There was no doubt of it. He knew the Kirkwood. He knew the Vice President. He knew there was a man assigned to him, and that the man was a German, and that the man was the kind to lose his nerve. Nobody knew those things who was not inside.</p>\n<p>Second: that I should have seen it weeks ago. Damon had been at Booth's elbow, one way or another, since the first night I saw him at the National. Waiting on Booth's table. Listening to every word Booth said. Standing at the top of the back stairs at midnight outside Booth's room, as if he had been waiting there for somebody to come out. On the lawn when Booth said <em>the last speech he will ever make.</em> Taking the morning off, today of all days, the day Booth learned the President was coming. Everywhere Booth went, Damon had been, a few steps off, unseen.</p>\n<p>And Booth, I knew, tipped every waiter in that hotel too much, and knew them all by name, and thought of them as furniture. What better man for an errand, on a night like this, than one nobody would ever look at twice? Booth was vain, and he was careless with paper, but he was not a fool. A waiter from the National, who could go anywhere in a white jacket, carrying messages, watching doors. It was exactly what I would have done.</p>\n<p>I had thought the letter at midnight was a love letter. I had been pleased with myself. I felt, sitting there, the particular cold shame of a clever man who has been clever about the wrong thing.</p>\n<p>Third: that the message made sense. That was the worst of it. It fit everything I knew. Atzerodt losing his nerve was the most likely thing in the world; I had thought, the first time I met him, that when the thing came close he would find he had somewhere else to be. And if he had, then Booth was exactly the man to go and do it himself. The Kirkwood was four blocks away. The play had more than half an hour to run. Booth knew every line of it. He could be at the Kirkwood and back before the third act turned. Two in one night, instead of one. That was Booth. That was the man who had walked up and down Gautier's with his cigar, lowering an invisible President over an invisible rail.</p>\n<p>And fourth: that if Booth was at the Kirkwood, then Booth was not here. He was four blocks away, alone, in a hotel, going up a staircase toward the Vice President. And if I could reach him there, I could stop both of them. Johnson and the President. In one place. Tonight.</p>\n<p>I would check. I was not a fool either. I would ask at the Kirkwood desk before I did anything at all, and if Booth had not been there, I would know the message was false, and I would come straight back.</p>\n<p>It took me perhaps half a minute to think all of that. I got up, and took my cane, and went past Damon up the aisle toward the stairs.</p>\n<p>At the top of the stairs I looked back.</p>\n<p>Damon had not followed me. He was standing against the back wall of the dress circle, near the corner, not far from that narrow door at the end, with his hands behind him, still and patient, like a servant waiting for his gentleman to come back. Waiting, I thought, for Booth.</p>\n<p>It was exactly where I would have put him.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped.</p>\n<p>\"And what did he see?\" Iola said. \"Damon. You said you both saw correctly.\"</p>\n<p>\"He saw a man he had known on a farm, who came back from the war changed, and cold, and whom he had never liked. Who went to Washington in the winter and began to eat his dinners at John Wilkes Booth's own table, in a coat that Booth had paid for. Who came to the side door of the National on the night of the seventeenth of March, the night the plotters were supposed to take the President, with mud to his knees and a saddled horse on a lead with nobody to ride it. Who stood at Booth's elbow on the lawn when Booth said <em>the last speech he will ever make,</em> and did not so much as turn his head. Who came out of Booth's room at midnight with his shirt full of papers.\" He held up his hand, and turned it over, and looked at it. \"And who, on the night the President came to Ford's Theatre, had bought the seat in the dress circle nearest to the only door into the President's box, and sat in it for an hour, with his eyes on that door and on the stairs, and did not watch the play.\"</p>\n<p>He put his hand down.</p>\n<p>\"What would you have thought I was?\"</p>\n<p>Iola did not answer.</p>\n<p>\"He thought I was the one who would hold the door,\" he said. \"Booth's man, placed there to keep the way clear. And he was right about everything he had seen. Every single thing. He was only wrong about me, and there was no way on earth for him to know that, because the only thing that had changed was inside my head.\" He smiled, very slightly. \"So he did what I would have done. He found the one message that would move me, and he made it true enough to check.\"</p>\n<p>\"The Kirkwood.\"</p>\n<p>\"The Kirkwood.\" He picked up the pencil and turned it in his fingers. \"I've spent a long time wondering how he knew about Atzerodt. That he'd lose his nerve. Booth never said it in front of him. I'm nearly sure of that. He must have watched Atzerodt the way he watched all of us, and worked it out for himself.\" He shook his head. \"He was right about that too.\"</p>\n<p>She looked at the clock. It was nearly four.</p>\n<p>\"You checked,\" she said. \"At the Kirkwood. You said you would check.\"</p>\n<p>\"I did check.\" He stood up, slowly, one hand on the arm of the chair. \"And it was true. That's next week, Ms. Barnett. I find that I'm tired.\"</p>\n<p>She wanted to argue. She looked at his face and did not.</p>\n<p>On the porch, while she was finding her keys, he said, \"The box.\" He nodded at it, under her arm, the one with <em>CARROW</em> on the lid. \"You brought it for a reason. You just haven't found the reason yet.\"</p>\n<p>\"I told you. I don't know why I brought it.\"</p>\n<p>\"No,\" he agreed. \"But you will.\"</p>", "added": 1790597844961, "pt": [1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961, 1790597844961]}, {"num": 20, "title": "The Kirkwood", "html": "<p>She did not bring the box the next week. She thought about it, standing in the closet with the light on, and left it where it was.</p>\n<p>He was waiting on the porch when she drove up, which he had never done before, in his coat, with the umbrella furled though it was not raining. He did not make small talk. He did not make tea. When she had set out the recorders and said the date and the time, he began before she had finished writing it down, as if he had been saying it to himself all week and was only now letting her hear.</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 14, 1865, a quarter to ten</em></p>\n<p>The Kirkwood House stood at the corner of Twelfth Street and the Avenue. It was not grand, the way the National was. It was a plain, busy, respectable hotel, the kind congressmen stayed in when they did not want to be seen spending money, and it was four blocks from Ford's. I did those four blocks faster than I had walked anywhere since Fort Stevens. My leg did not like it. I did not ask it.</p>\n<p>The lobby was bright and nearly empty. A clerk at the desk. Two men in chairs with newspapers. And through an open door on the left, the bar, with the noise of a Friday night coming out of it.</p>\n<p>I went to the desk. I made myself slow down before I got there, and lean on the cane a little, and smile. A lame young man with a pleasant face, asking after a friend.</p>\n<p>\"Has Mr. Booth been in?\" I said. \"The actor. John Wilkes Booth.\"</p>\n<p>The clerk's face did what everyone's face did at that name. \"Mr. Booth? Yes, sir, he was in.\" He was pleased to know it. \"Left his card for Mr. Browning. That's the Vice President's secretary.\" He lowered his voice, the way people do when they are telling you something about the great. \"Wanted to know was Mr. Johnson at home.\"</p>\n<p>So it was true.</p>\n<p>I stood at that desk and felt it go through me. Damon had not lied. Booth had been here, asking for Johnson. <em>Are you at home.</em> Everything in the message had held.</p>\n<p>I did not ask when. I should have asked when. I will tell you why I did not.</p>\n<p>Through the open door of the bar, over the clerk's shoulder, I saw Atzerodt.</p>\n<p class=\"break\">&#10043;</p>\n<p>He was at the far end of the bar, alone, in a dark coat, with a glass in front of him that was not his first. His hat was pushed back. His face had the loose, shining look of a man who has been drinking for courage for an hour and has found it does not come from there. As I watched, he leaned across the bar and said something to the bartender, low, and the bartender looked at him oddly and shook his head and moved away to someone else.</p>\n<p>I found out later what he had asked. Everyone did. It came out at the trial. He had asked where the Vice President's room was, and what sort of man he was.</p>\n<p>And upstairs, I knew, one floor above the Vice President's rooms, was a room Atzerodt had taken that morning in his own name. I did not know then what he had left in it. They found it the next day: a loaded revolver under the pillow, and a long knife between the sheets and the mattress, and Booth's bankbook in the pocket of a coat.</p>\n<p>I did not need to know that, standing in the lobby. I only needed to look at him.</p>\n<p>I have told you what I thought about Atzerodt the first time I met him: that he would say yes to anything, cheerfully, as long as it was far away, and that if it ever came close, he would find he had somewhere else to be. Looking at him through that door, I saw that I had been right, and also that I had not been right enough. He had not found somewhere else to be. He was sitting forty feet below the Vice President, with a room upstairs and a weapon in it, and he was drinking. A frightened man who drinks can go either way. He can drink himself out of it. Or he can drink until the fear goes quiet for ten minutes, and in those ten minutes he can climb a flight of stairs.</p>\n<p>And Booth was not in the bar. Booth was not in the lobby. If Booth had come to see to it himself, he had not got here yet.</p>\n<p>So I did the only thing that made sense. I went into the bar.</p>\n<p class=\"break\">&#10043;</p>\n<p>Atzerodt saw me in the mirror behind the bar before I reached him, and I saw his face do three things, one after another. Fear, first, because anyone coming toward him that night was something to fear. Then he knew me, and there was relief: Keene, the lame boy, the one who knew the roads. And then, right behind the relief, a terrible hope.</p>\n<p>I did not sit down. I leaned on the bar beside him with my cane between us, and I did not look at him. I looked at the bottles, the way two men do who are not together.</p>\n<p>\"He says leave it,\" I said.</p>\n<p>I said it quietly, the way I had heard Booth say things all winter, as if it were already settled and I were only passing it along.</p>\n<p>Atzerodt turned his head and stared at me.</p>\n<p>\"Leave it,\" I said again. \"It's off. He said to find you and tell you. Go get your horse and go home. Go anywhere. Don't go upstairs, don't go back to your room. Just go.\"</p>\n<p>That was the lie I told him. I had worked it out on the four blocks from Ford's, in case I needed it, the way you work out a move before you know if you'll need to make it. It was not a clever lie. It did not need to be. It only needed to be the thing he most wanted to hear, said by someone he believed was close to Booth. Nobody questions the thing he most wants to hear. I have used that in a great many lives. I am not proud of how often.</p>\n<p>He did not question it. I watched it go into him like warmth. His shoulders came down. He let out a breath that he must have been holding since eight o'clock.</p>\n<p>\"He is not angry?\" he said. His accent was always thicker when he drank. \"I told him. At the house, tonight. I told him, I did not come for killing. I came for the other thing, the taking. Not this. I told him.\"</p>\n<p>\"He's not angry,\" I said. \"Go.\"</p>\n<p>He put money on the bar, too much of it. He picked up his hat. He went out of the bar and through the lobby and out the front doors onto the Avenue without once looking at the staircase, and I stood at the bar and watched him in the mirror until he was gone.</p>\n<p>He said afterward, in the statements he gave after they arrested him, that he had refused Booth. That he had never meant to go through with it. I believe that was true, as far as it went. He had refused the moment somebody gave him leave to.</p>\n<p class=\"break\">&#10043;</p>\n<p>I stood there for a moment, with my hand on the bar.</p>\n<p>The Vice President was asleep upstairs. I learned later that he had gone to bed early that night. He did not know, and he never knew, that a drunk carriage painter with a knife in his room had sat forty feet below him, working up to it, and that a lame boy had sent him home. It is not in any book. It is not in the trial record. The record says only that Atzerodt lost his nerve, and drank, and left. That is true. That is exactly what happened.</p>\n<p>It was the only thing I did that night that worked.</p>\n<p>And standing there, with the noise of the bar going on around me, I thought: <em>where is Booth?</em></p>\n<p>He had sent me here to help with Johnson. He had come here to see to it himself. He was not here. Atzerodt had not seen him, or he would have said. If Booth had meant to come, he would have been here before me; he had a fast horse, and I had a cane.</p>\n<p>I went back to the desk.</p>\n<p>\"Mr. Booth,\" I said to the clerk. \"When he left his card. What time was that?\"</p>\n<p>The clerk thought about it. \"This afternoon, sir,\" he said. \"Three o'clock, maybe. Half past. Mr. Browning had it by five.\" He looked at me, curious now. \"Were you to meet him?\"</p>\n<p>This afternoon.</p>\n<p>I have told you that knowing a thing is not the same as knowing it. That was a night I learned it again. It all turned over in me at once, the whole half minute in the dress circle, every sound step of it, like a card turned face up on a table.</p>\n<p>Booth had not come to the Kirkwood tonight. Booth had never been coming. The card was six hours old, and it was true, and it had been chosen because it was true, because I would check, and it would hold. Somebody had wanted me out of that dress circle. Out of the seat by the only door. And had found the one message that would move me, and made it true enough to check.</p>\n<p>He was not Booth's man. Booth's man would never have sent Booth's backup away from the door. There was only one reason to empty that seat.</p>\n<p>He thought I was guarding it.</p>\n<p>And he was standing by it now, in his white jacket, against the back wall, alone. And Booth, who had not been at the Kirkwood, was somewhere I had just walked away from.</p>\n<p>I looked at the clock over the desk. It was eight minutes past ten.</p>\n<p>I went out through the doors onto the Avenue and turned east, toward Tenth Street, and I ran. I had not run since July. I had a cane and a leg with a Union bullet hole through it, and I ran.</p>\n<p class=\"break\">&#10043;</p>\n<p>He stopped. His hands were shaking. She had never seen them shake.</p>\n<p>\"I'm going to stop there,\" he said, \"for a minute.\"</p>\n<p>He got up and went into the kitchen, and she heard the tap run, and run, and after a while stop. She sat in the living room with the woodstove ticking and the two red lights on the recorders, and she did not follow him, and she did not turn them off.</p>", "added": 1790598338018, "pt": [1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018, 1790598338018]}, {"num": 21, "title": "Tenth Street", "html": "<p>He came back after ten minutes with a glass of water he did not drink. He set it on the table by the notepad and sat down, and his hands had stopped shaking, and he put them flat on his knees anyway, as if to keep them there.</p>\n<p>\"Four blocks,\" he said. \"I had done them in six minutes on the way there. I did them in seven on the way back. I've gone over it more times than I can tell you. There was nothing in those seven minutes I could have done faster.\"</p>\n<p class=\"break\">&#10043;</p>\n<p><em>April 14, 1865, a quarter past ten</em></p>\n<p>Tenth Street was quiet when I turned into it. That is what I remember first. A quiet street at night, gaslit, with carriages waiting along the curb for the end of the play, and the drivers dozing on their boxes, and a boy selling something at the corner. The front of Ford's was lit and its doors were open to the warm night, and I could hear the play from the street, faintly, one man's voice.</p>\n<p>I knew that play. Everyone did; it had been running in one theater or another for years. And I knew where in it we were. I had sat through the first two acts from my seat by the door, listening with half my mind. We were in the third act. One of the actors was alone on the stage, and I could hear his voice rising toward the line that always got the biggest laugh of the night.</p>\n<p>I was thirty yards from the doors. I was running on a leg that had stopped being a leg some blocks back and become only a thing I threw forward and landed on.</p>\n<p>The laugh came out through the open doors like a wave breaking. The whole house, all at once, the way a house laughs at the one line it has been waiting for.</p>\n<p>And inside it, very small, very flat, a single crack. Like a stick broken over a knee.</p>\n<p>Most of the people on Tenth Street did not hear it. The drivers did not stir. I heard it because I was listening for it, and because I had heard a great many pistols in a great many lives, and there is no other sound in the world quite like one fired indoors.</p>\n<p>For a moment nothing happened. The laugh went on. Then it broke off, raggedly, the way a laugh does when half the people laughing have stopped and the other half have not yet understood why. And then, in the silence after it, a woman screamed.</p>\n<p>I have heard that scream in my sleep for a hundred and sixty years.</p>\n<p class=\"break\">&#10043;</p>\n<p>I got to the doors. I got into the lobby. People were beginning to come out of the inner doors toward me, not running yet, only standing up and turning, with their faces open and stupid, the way faces are in the first second before they understand. I pushed through them. I got to the inner doors and I could see the stage, down the long slope of the house, bright under the gas.</p>\n<p>A man was on the stage.</p>\n<p>He was down on one knee, in the middle of it, as if he had fallen, and he was getting up. He had something in his hand that caught the light, and a flag was trailing from somewhere above him, torn half off the front of the box, hanging. He got to his feet. He turned toward the audience, toward all of us, and he raised the thing in his hand, and he shouted something.</p>\n<p>I could not hear the words. The screaming had started by then, and the noise of a thousand people getting to their feet at once. People told the newspapers afterward that it was <em>Sic semper tyrannis,</em> thus always to tyrants, the motto of Virginia. Some of them heard that. Some heard <em>the South is avenged.</em> Some heard nothing at all. I heard nothing. I only saw his face, from the back of the house, lit from below by the footlights, the way I had seen it a dozen times on a stage, playing a king.</p>\n<p>It was the happiest I ever saw him.</p>\n<p>Then he turned and ran across the stage, limping, and into the wings, and was gone.</p>\n<p class=\"break\">&#10043;</p>\n<p>I knew where he was going.</p>\n<p>That was the one thing I still had. I knew him. I knew the mare with the white star, and I knew he had not tied her at the front. The front of the theater was on Tenth Street, with a hundred people in it. The back of the theater opened onto an alley, and the alley ran out to F Street and to the dark, and that was where a man would leave a fast horse, with somebody to hold her, because Pumphrey had told him she would break her halter if he tied her.</p>\n<p>I turned around in that lobby and fought my way back out through the doors against the crowd that was beginning to come out behind me, and down the steps, and along the front of the building, to where the narrow passage ran between Ford's and the building next door, back toward the alley.</p>\n<p>It was dark in the passage. I ran into the wall once and did not feel it. I came out at the far end into the alley behind the theater, and the back door of the stage was standing open, and there was light coming out of it and noise.</p>\n<p>And there was a boy on the ground, holding his head. And there was the sound of hooves on stone, going away fast, up the alley toward the street. I saw the horse's hindquarters, and a man low on her back, and then the turn of the alley took them, and the sound went on a little longer, and then it was gone too.</p>\n<p>I stood in the alley with my cane.</p>\n<p>I had taught him that road. The Navy Yard Bridge, the sentry who stopped the ones coming in and let the ones going home go home. The ridge road. The long way round the swamp. The farms where a man could be hidden. I had drawn every inch of it on my mother's tobacco receipts, and I had burned the receipts, and it did not matter in the least, because he knew it all by heart.</p>\n<p>The boy on the ground was crying. I helped him up. He was the boy who held horses for the actors; I had seen him before, running errands around the theater. Booth had struck him with the handle of a knife to make him let go of the reins. He did not know why. He kept asking me why. I did not tell him.</p>\n<p class=\"break\">&#10043;</p>\n<p>When I came back around to Tenth Street it was full.</p>\n<p>It had filled the way water fills a lock, all at once, from every direction. People had come out of Ford's and people had come out of every house and saloon and boarding house on the street, and soldiers were arriving, running, from somewhere, and nobody knew anything, and everybody was shouting what they knew. The President was shot. The President was dead. The President was not hurt at all. It was a rebel army. It was an actor. It was Booth, it was Booth, somebody had seen him, it was John Wilkes Booth.</p>\n<p>Across the city, in the same minutes, though I did not know it yet, Powell was forcing his way into the Seward house on Lafayette Square with a revolver that jammed and a knife that did not. He stabbed the Secretary of State as he lay in bed, in his broken jaw and his broken arm, and cut down his sons and a nurse and a messenger, and ran out into the night shouting that he was mad. Seward lived. The metal brace on his jaw, they said, turned the knife.</p>\n<p>And at the Kirkwood, the Vice President was asleep upstairs, and in the bar below him the stool where Atzerodt had sat was empty.</p>\n<p>That was what I had done with my ten hours. That was all of it.</p>\n<p class=\"break\">&#10043;</p>\n<p>They were carrying him out.</p>\n<p>The doors of Ford's opened wider and a knot of men came down the steps, slowly, carefully, carrying something between them, and the crowd fell back and went silent in a wave that ran out ahead of them down the street. I saw a long body, and a head held in a man's hands, and a pair of long legs. Somebody was shouting to clear the way. Somebody was shouting, <em>Where can we take him? Where?</em></p>\n<p>Across the street, a door opened, at the top of a flight of curving steps, in a narrow brick house, and a man stood in it with a candle, and called to them to bring him in there.</p>\n<p>They carried him across Tenth Street and up those steps and in, and the door closed.</p>\n<p>I stood on the pavement across from that door, in the crowd, with my cane.</p>\n<p>And after a while I understood that the man standing next to me, very still, in a white hotel jacket, was Damon.</p>", "added": 1790598705203, "pt": [1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203, 1790598705203]}, {"num": 22, "title": "The Vigil", "html": "<p><em>April 14 to 15, 1865</em></p>\n<p>We did not speak for a long time.</p>\n<p>The soldiers came, a whole company of them at the double, and pushed the crowd back from the house and out of the street, and made a line. We were pushed back with everyone else, the two of us, and we ended up against the front of a building on the Ford's side of the street, almost opposite those curving steps, and we stood there. Neither of us left. There was nowhere either of us could have gone.</p>\n<p>The crowd never went home. It grew. It stood in the street all night and hardly made a sound. Every so often a carriage came, and a man got down and was let through the line and went up the steps and in: a general, a senator, a member of the Cabinet, one of the President's secretaries. And every time the door opened, the whole street leaned toward it, and the door closed again, and the street settled back.</p>\n<p>The upstairs windows were lit. Somebody said he was in a room at the back, on the ground floor, in a bed too short for him, so that they had to lay him across it slantwise. Somebody said the surgeon general was there. Somebody said there was no hope. Somebody said there was.</p>\n<p>Damon stood beside me in his white jacket, which was too thin for the night. He did not move. He watched the door.</p>\n<p class=\"break\">&#10043;</p>\n<p>It was past midnight when I spoke.</p>\n<p>\"You sent me to the Kirkwood.\"</p>\n<p>He did not turn his head. After a long time, he said, \"Y-yes.\"</p>\n<p>\"Because you thought I was holding the door for him.\"</p>\n<p>\"You were s-sitting by it.\" Each word pushed through. \"For an hour. W-watching it. Not the play.\"</p>\n<p>\"I was waiting to stop him.\"</p>\n<p>He turned then, and looked at me, and I watched him read my face in the light from the windows across the street. Left to right, and down. The way he had read the newspaper in the kitchen yard, and me on the porch the morning he left. He did it slowly this time. He was looking for the lie.</p>\n<p>He did not find one. I saw the moment he did not find one. Something in his face went, very quietly, the way a wall goes when the mortar has been washed out of it for years and it is only now, all at once, that anyone sees.</p>\n<p>\"How?\" he said.</p>\n<p>So I told him. Not all of it. The seat by the door. The plan to stand up and shout Booth's name, so that the whole dress circle would turn and look and he could not go through. He listened without moving.</p>\n<p>Then I told him what I had worked out on the pavement in the last hour, because I could not stop myself working things out, not even that night.</p>\n<p>\"And you stayed by the door,\" I said. \"After I left. You meant to stop him yourself. But you had no ticket, and no gentleman, and once the message was delivered you were only a Black man standing in the dress circle of Ford's Theatre. So an usher came and told you to go down.\" I watched his face. \"You went down to the lobby. And you were there, at the foot of the stairs, when he came in from the street.\"</p>\n<p>He did not answer. He did not have to.</p>\n<p>\"Did you try to stop him?\"</p>\n<p>His jaw set. I watched him wait for the first word, the way I had watched him wait for it at the National, with that terrible patience. It would not come. His mouth worked, and nothing, and nothing, and he closed his eyes.</p>\n<p>And I understood. I did not need him to tell me. Booth had come in off the street, and walked across the lobby past a waiter in a white jacket, and the waiter had opened his mouth to say <em>stop,</em> or <em>help,</em> or <em>that man,</em> or anything at all to anyone in that lobby. And the first sound had caught, the way it always caught. And by the time he got it out, Booth was up the stairs.</p>\n<p>\"Yes,\" he said at last. Very quietly. It was the only word he said that night that came without a stumble.</p>\n<p class=\"break\">&#10043;</p>\n<p>We stood there a long time after that without saying anything.</p>\n<p>I will tell you the rest of what was said between us, because it was not much, and I have remembered all of it.</p>\n<p>Somewhere around three in the morning he said, without looking at me, \"Y-you were his.\"</p>\n<p>\"Until Tuesday. Yes.\"</p>\n<p>\"B-before Tuesday.\"</p>\n<p>\"Yes.\"</p>\n<p>\"Then you p-put the gun in his hand,\" he said. \"As much as anyone.\"</p>\n<p>It was true. I had given Booth the road, and the bridge, and three months of my best thinking, and the mare with the white star was carrying him down every mile of it now, in the dark, while we stood there.</p>\n<p>\"Yes,\" I said. \"And you took away the one man who was between him and that door.\"</p>\n<p>That was true too. I watched it land. I was not sorry I had said it, and I was sorry. Both.</p>\n<p>Neither of us said anything else for a long time.</p>\n<p class=\"break\">&#10043;</p>\n<p>Toward morning the sky went gray. It was a dark and gloomy morning, and rain set in, a thin, cold, steady rain that came down on all of us, and nobody left. The crowd had changed in the night. There were a great many Black men and women in it by morning, more than there had been at midnight, standing together in the rain, very quiet, and many of them weeping. I have never forgotten that. They had come from every part of the city, in the dark, and they stood there without umbrellas, and they did not make a sound.</p>\
